ace":"贾母","text":"却说这晴雯当日系赖大买的。还有个姑舅哥哥，叫做吴贵，人都叫他贵儿。那时晴雯才得十岁，时常赖嬷嬷带进来，贾母见了喜欢，故此赖嬷嬷就孝敬了贾母。过了几年，赖大又给他姑舅哥哥娶了一房媳妇。谁知贵儿一味胆小老实，那媳妇却倒伶俐，又兼有几分姿色，看着贵儿无能为，便每日家打扮的妖妖调调，两只眼儿水汪汪的，招惹的赖大家人如蝇逐臭，渐渐做出些风流勾当来。那时晴雯已在宝玉屋里，他便央及了晴雯转求凤姐，合赖大家的要过来。目今两口儿就在园子后角门外居住，伺候…","so":0,"eo":0},{"surface":"贾母","text":"王夫人自来不曾听见这等考语，真是意外之喜。一时候他父子去了，方欲过贾母那边来时，就有芳官等三个干娘走来，回说：“芳官自前日蒙太太的恩典赏出来了，他就疯了似的，茶饭都不吃，勾引上藕官、蕊官，三个人寻死觅活，只要铰了头发做尼姑去。我只当是小孩子家，一时出去不惯，也是有的，不过隔两日就好了，谁知越闹越凶，打骂着也不怕。实在没法，所以来求太太，或是依他们去做尼姑去，或教导他们一顿，赏给别人做女孩儿去罢。我们没这福。”王夫人听了，道：“胡说！那里…","so":0,"eo":0}]},{"chap":78,"ctitle":"第78章 老学士闲征姽婳词 痴公子杜撰芙蓉诔","deeds":[{"surface":"贾母","text":"话说两个尼姑领了芳官等去后，王夫人便往贾母处来。见贾母喜欢，便趁便回道：“宝玉屋里有个晴雯，那个丫头也大了，而且一年之间病不离身。我常见他比别人分外淘气，也懒，前日又病倒了十几天，叫大夫瞧，说是女儿痨，所以我就赶着叫他下去了。若养好了，也不用叫他进来，就赏他家配人去也罢了。再那几个学戏的女孩子，我也做主放了。一则他们都会戏，口里没轻没重，只会混说，女孩儿们听了，如何使得？二则他们唱会子戏，白放了他们，也是应该的。况丫头们也太多，若说不够…","so":0,"eo":0},{"surface":"贾母","text":"一时，只见迎春妆扮了前来告辞过去。凤姐也来请早安，伺候早饭。又说笑一回，贾母歇晌，王夫人便唤了凤姐，问他丸药可曾配来。凤姐道：“还不曾呢，如今还是吃汤药，太太只管放心，我已大好了。”王夫人见他精神复初，也就信了，因告诉撵逐晴雯等事。又说：“宝丫头怎么私自回家去了？你们都不知道。我前儿顺路都查了一查，谁知兰小子的这一个新进来的奶子，也十分的妖调，也不喜欢他。我说给你大嫂子了，好不好，叫他各自去罢。我因问你大嫂子，‘宝丫头出去，难道你们不知…","so":0,"eo":0},{"surface":"贾母","text":"说话之间，只见宝玉已回来了，因说：“老爷还未散，恐天黑了，所以先叫我们回来了。”王夫人忙问：“今日可丢了丑了没有？”宝玉笑道：“不但不丢丑，拐了许多东西来。”接着就有老婆子们从二门上小厮手内接进东西来。王夫人一看时，只见扇子三把，扇坠三个，笔墨共六匣，香珠三串，玉绦环三个。宝玉说道：“这是梅翰林送的，那是杨侍郎送的，这是李员外送的：每人一分。”说着，又向怀中取出一个檀香小护身佛来，说：“这是庆国公单给我的。”王夫人又问在席何人，做何诗词…","so":0,"eo":0},{"surface":"贾母","text":"当下麝月、秋纹已带了两个丫头来等候。见宝玉辞了贾母出来，秋纹便将墨笔等物拿着，随宝玉进园来。宝玉满口里说：“好热。”一壁走一面便摘冠解带，将外面的大衣服都脱下来，麝月拿着，只穿着一件松花绫子夹袄，襟内露出血点般大红裤子来。秋纹见这条红裤是晴雯针线，因叹道：“真是‘物在人亡’了！”麝月将秋纹拉了一把，笑道：“这裤子配着松花色袄儿、石青靴子，越显出靛青的头、雪白的脸来了。”宝玉在前，只装没听见，又走了两步便止步道：“我要走一走，这怎么好？”…","so":0,"eo":0}]},{"chap":79,"ctitle":"第79章 薛文起悔娶河东吼 贾迎春误嫁中山狼","deeds":[{"surface":"贾母","text":"原来贾赦已将迎春许与孙家了。这孙家乃是大同府人氏，祖上系军官出身，乃当日宁、荣府中之门生，算来亦系至交。如今孙家只有一人在京，现袭指挥之职。此人名唤孙绍祖，生得相貌魁梧，体格健壮，弓马娴熟，应酬权变，年纪未满三十，且又家资饶富，现在兵部候缺题升。因未曾娶妻，贾赦见是世交子侄，且人品家当都相称合，遂择为东床娇婿。亦曾回明贾母，贾母心中却不大愿意，但想儿女之事，自有天意，况且他亲父主张，何必出头多事？因此只说“知道了”三字，馀不多及。贾政又…","so":0,"eo":0},{"surface":"贾母","text":"宝玉却未曾会过这孙绍祖一面的，次日只得过去，聊以塞责。只听见那娶亲的日子甚近，不过今年就要过门的，又见邢夫人等回了贾母，将迎春接出大观园去，越发扫兴。每每痴痴呆呆的，不知作何消遣。又听说要陪四个丫头过去，更又跌足道：“从今后这世上又少了五个清净人了！”因此天天到紫菱洲一带地方徘徊瞻顾。见其轩窗寂寞，屏帐倏然，不过只有几个该班上夜的老妪。再看那岸上的蓼花苇叶，也都觉摇摇落落，似有追忆故人之态，迥非素常逞妍斗色可比。所以情不自禁，乃信口吟成…","so":0,"eo":0},{"surface":"贾母","text":"宝玉见他这样，便怅然如有所失，呆呆的站了半日，只得没精打彩，还入怡红院来。一夜不曾安睡，种种不宁。次日便懒进饮食，身体发热。也因近日抄检大观园、逐司棋、别迎春、悲晴雯等羞辱、惊恐、悲凄所致，兼以风寒外感，遂致成疾，卧床不起。贾母听得如此，天天亲来看视。王夫人心中自悔，不合因晴雯过于逼责了他。心中虽如此，脸上却不露出，只吩咐众奶娘等好生伏侍看守。一日两次带进医生来诊脉下药。一月之后，方才渐渐的痊愈。好生保养过百日，方许动荤腥油面，方可出门…","so":0,"eo":0}]},{"chap":80,"ctitle":"第80章 美香菱屈受贪夫棒 王道士胡诌妒妇方","deeds":[{"surface":"贾母","text":"此时宝玉已过了百日，出门行走。亦曾过来见过金桂，举止形容也不怪厉，一般是鲜花嫩柳，与众姊妹不差上下，焉得这等情性，可为奇事。因此，心中纳闷。这日，与王夫人请安去，又正遇见迎春奶娘来家请安，说起孙绍祖甚属不端，“姑娘惟有背地里淌眼泪，只要接了家来，散荡两日。”王夫人因说：“我正要这两日接他去，只是七事人事的都不遂心，所以就忘了。前日宝玉去了，回来也曾说过的。明日是个好日子，就接他去。”正说时，贾母打发人来找宝玉，说：“明儿一早往天齐庙还愿…","so":0,"eo":0},{"surface":"贾母","text":"那时迎春已来家好半日，孙家婆娘媳妇等人已待晚饭，打发回家去了。迎春方哭哭啼啼，在王夫人房中诉委屈，说：“孙绍祖一味好色，好赌，酗酒，家中所有的媳妇丫头，将及淫遍。略劝过两三次，便骂我是‘醋汁子老婆拧出来的’。又说老爷曾收着五千银子，不该使了他的。如今他来要了两三次不得，便指着我的脸说道：‘你别和我充夫人娘子！你老子使了我五千银子，把你准折卖给我的。好不好，打你一顿。撵到下房里睡去。当日有你爷爷在时，希冀上我们的富贵，赶着相与的。论理我和…","so":0,"eo":0}]},{"chap":81,"ctitle":"第81章 占旺相四美钓游鱼 奉严词两番入家塾","deeds":[{"surface":"贾母","text":"紫鹃刚进茶来，见他两个这样，正在纳闷，只见袭人进了，进来看见宝玉，便道：“二爷在这里呢么，老太太那里叫呢。我估量着二爷就是在这里。”黛玉听见是袭人，便欠身起来让坐。黛玉的两个眼圈儿已经哭的通红了。宝玉看见，道：“妹妹，我刚才说的，不过是些呆话，你也不用伤心了。要想我的话时，身子更要保重才好。你歇歇儿罢。老太太那边叫我，我看看去就来。”说着，往外走了。袭人悄问黛玉道：“你两个又为什么？”黛玉道：“他为他二姐姐伤心，我是刚才眼睛发痒揉的，并…","so":0,"eo":0},{"surface":"贾母","text":"宝玉走到贾母房中，只见王夫人陪着贾母摸牌。宝玉看见无事，才把心放下了一半。贾母见他进来，便问道：“你前年那一次得病的时候，后来亏了一个疯和尚和个瘸道士治好了的。那会子病里你觉得是怎么样？”宝玉想了一回道：“我记得得病的时候儿，好好的站着，倒象背地里有人把我拦头一棍，疼的眼睛前头漆黑，看见满屋子里都是些青面獠牙，拿刀举棒的恶鬼。躺在炕上，觉着脑袋上加了几个脑箍似的。以后便疼的任什么不知道了。到好的时候．又记得堂屋里一片金光，直照到我床上来…","so":0,"eo":0},{"surface":"贾母","text":"说着凤姐也进来了，见了贾母，又回身见过了王夫人，说道：“老祖宗要问我什么？”贾母道：“你那年中了邪的时候儿，你还记得么？”凤姐儿笑道：“我也不很记得了。但觉自己身子不由自主，倒象有什么人拉拉扯扯，要我杀人才好。有什么拿什么，见什么杀什么，自己原觉很乏，只是不能住手。”贾母道：“好的时候儿呢？”凤姐道：“好的时候象空中有人说了几句话似的，却不记得说什么来着。”贾母道：“这么看起来，竟是他了。他姐儿两个病中的光景合才说的一样。这老东西竟这样…","so":0,"eo":0},{"surface":"贾母","text":"凤姐道：“咱们的病一准是他。我记得咱们病后，那老妖精向赵姨娘那里来过几次，和赵姨娘讨银子，见了我，就脸上变貌变色，两眼黧鸡似的。我当初还猜了几遍，总不知什么原故。如今说起来，却原来都是有因的。但只我在这里当家，自然惹人恨怨，怪不得别人治我，宝玉可合人有什么仇呢？忍得下这么毒手！”贾母道：“焉知不因我疼宝玉，不疼环儿，竟给你们种了毒了呢。”王夫人道：“这老货已经问了罪，决不好叫他来对证。没有对证，赵姨娘那里肯认账？事情又大，闹出来外面也不…","so":0,"eo":0},{"surface":"贾母","text":"正说着，只见玉钏儿走来对王夫人道：“老爷要找一件什么东西，请太太伺候了老太太的饭完了，自己去找一找呢。”贾母道：“你去罢，保不住你老爷有要紧的事。”王夫人答应着，便留下凤姐儿伺候，自己退了出来。回至房中，合贾政说了些闲话，把东西找出来了。贾政便问道：“迎儿已经回去了？他在孙家怎么样？”王夫人道：“迎丫头一肚子眼泪，说孙姑爷凶横的了不得。”因把迎春的话述了一遍。贾政叹道：“我原知不是对头，无奈大老爷已说定了，叫我也没法。不过迎丫头受些委屈…","so":0,"eo":0},{"surface":"贾母","text":"宝玉听了，半日竟无一言可答，因回到怡红院来。袭人正在着急听信，见说取书，倒也喜欢。独是宝玉要人即刻送信给贾母，欲叫拦阻。贾母得信，便命人叫过宝玉来，告诉他说：“只管放心先去，别叫你老子生气。有什么难为你，有我呢。”宝玉没法，只得回来，嘱咐了丫头们：“明日早早叫我，老爷要等着送我到家学里去呢。”袭人等答应了，同麝月两个倒替着醒了一夜。","so":0,"eo":0}]},{"chap":82,"ctitle":"第82章 老学究讲义警顽心 病潇湘痴魂惊恶梦","deeds":[{"surface":"贾母","text":"话说宝玉下学回来，见了贾母。贾母笑道：“好了，如今野马上了笼头了。去罢，见见你老爷去来，散散儿去罢。”宝玉答应着，去见贾政。贾政道：“这早晚就下学了么？师父给你定了工课没有？”宝玉道：“定了，早起理书，饭后写字，晌午讲书念文章。”贾政听了，点点头儿，因道：“去罢，还到老太太那边陪着坐坐去。你也该学些人功道理，别一味的贪玩。晚上早些睡，天天上学，早些起来。你听见了？”宝玉连忙答应几个“是”，退出来，忙忙又去见王夫人，又到贾母那边打了个照面…","so":0,"eo":0},{"surface":"贾母","text":"且说宝玉上学之后，怡红院中甚觉清净闲暇，袭人倒可做些活计，拿着针线要绣个槟榔包儿。想这如今宝玉有了功课，丫头们可也没有饥荒了，早要如此，晴雯何至弄到没有结果？兔死狐悲，不觉叹起气来。忽又想到自己终身，本不是宝玉的正配，原是偏房。宝玉的为人却还拿得住，只怕娶了一个利害的，自己便是尤二姐、香菱的后身。素来看着贾母，王夫人光景，及凤姐儿往往露出话来，自然是黛玉无疑了。那黛玉就是个多心人。想到此际，脸红心热，拿着针不知戳到那里去了。便把活计放下…","so":0,"eo":0},{"surface":"贾母","text":"黛玉此时心中干急，又说不出来，哽哽咽咽，恍惚又是和贾母在一处的似的，心中想道：“此事惟求老太太，或还有救。”于是两腿跪下去，抱着贾母的腿说道：“老太太救我！我南边是死也不去的。况且有了继母，又不是我的亲娘，我是情愿跟着老太太一块儿的。”但见贾母呆着脸儿笑道：“这个不干我的事。”黛玉哭道：“老太太，这是什么事呢。”老太太道：“续弦也好，倒多得一副妆奁。”黛玉哭道：“我在老太太跟前，决不使这里分外的闲钱，只求老太太救我！”贾母道：“不中用了…","so":0,"eo":0},{"surface":"贾母","text":"黛玉情知不是路了，求去无用，不如寻个自尽，站起来，往外就走。深痛自己没有亲娘，便是外祖母与舅母妹妹们，平时何等待的好，可见都是假的。又一想：“今日怎么独不见宝玉？或见他一面，他还有法儿。”便见宝玉站在面前，笑嘻嘻的道：“妹妹大喜呀。”黛玉听了这一句话，越发急了，也顾不得什么了，把宝玉紧紧的拉住，说：“好宝玉！我今日才知道你是个无情无义的人了！”宝玉道：“我怎么无情无义？你既有了人家儿，咱们各自干各自的了。”黛玉越听越气，越没了主意，只得…","so":0,"eo":0}]},{"chap":83,"ctitle":"第83章 省宫闱贾元妃染恙 闹闺阃薛宝钗吞声","deeds":[{"surface":"贾母","text":"话说探春、湘云才要走时，忽听外面一个人嚷道：“你这不成人的小蹄子，你是个什么东西，来这园子里头混搅！”黛玉听了，大叫一声道：“这里住不得了！”一手指着窗外，两眼反插上去。原来黛玉住在大观园中，虽靠着贾母疼爱，然在别人身上，凡事终是寸步留心。听见窗外老婆子这样骂着，在别人呢，一句是贴不上的，竟象专骂着自己的。自思一个千金小姐，只因没了爹娘，不知何人指使这老婆子来这般辱骂，那里委屈得来？因此，肝肠崩裂，哭的过去了。紫鹃只是哭叫：“姑娘怎么样…","so":0,"eo":0},{"surface":"贾母","text":"且说探春湘云出了潇湘馆，一路往贾母这边来。探春因嘱咐湘云道：“妹妹回来见了老太太，别象刚才那样冒冒失失的了。”湘云点头笑道：“知道了。我头里是叫他唬的忘了神了。”说着已到贾母那边。探春因提起黛玉的病来。贾母听了，自是心烦，因说道：“偏是这两个‘玉’儿多病多灾的。林丫头一来二去的大了，他这个身子也要紧。我看那孩子太是个心细。”众人也不敢答言。贾母便向鸳鸯道：“你告诉他们，明儿大夫来，瞧了宝玉，叫他再到林姑娘那屋里去。”鸳鸯答应着出来，告诉…","so":0,"eo":0},{"surface":"贾母","text":"到了次日，大夫来了。瞧了宝玉，不过说饮食不调，着了点儿风邪，没大要紧，疏散疏散就好了。这里王夫人凤姐等，一面遣人拿了方子回贾母，一面使人到潇湘馆，告诉说：“大夫就过来。”紫鹃答应了，连忙给黛玉盖好被窝，放下帐子，雪雁赶着收拾房里的东西。一时贾琏陪着大夫进来了，便说道：“这位老爷是常来的，姑娘们不用回避。”老婆子打起帘子，贾琏让着，进入房中坐下。贾琏道：“紫鹃姐姐，你先把姑娘的病势向王老爷说说。”王大夫道：“且慢说。等我诊了脉，听我说了，…","so":0,"eo":0},{"surface":"贾母","text":"贾赦、贾政送出大门，回来先禀贾母。贾母道：“亲丁四人，自然是我和你们两位太太了。那一个人呢？”众人也不敢答言。贾母想了想，道：“必得是凤姐儿，他诸事有照应。你们爷儿们各自商量去罢。”贾赦、贾政答应了出来，因派了贾琏、贾蓉看家外，凡“文”字辈至“草”字辈一应都去。遂吩咐家人预备四乘绿轿，十余辆翠盖车，明儿黎明伺候。家人答应去了。贾赦、贾政又进去回明贾母：“辰巳时进去，申酉时出来。今日早些歇歇，明日好早些起来，收拾进宫。”贾母道；“我知道，…","so":0,"eo":0},{"surface":"贾母","text":"且说贾家的车辆轿马在外西垣门口歇下等着。一会儿，有两个内监出来，说道：“贾府省亲的太太奶奶们着令入宫探问。爷们俱着令内宫门外请安，不得入见。”门上人叫：“快进去。”贾府中四乘轿子跟着小内监前行，贾家爷们在轿后步行跟着，令众家人在外等候。走近宫门口，只见几个老公在门上坐着，见他们来了，便站起来说道：“贾府爷们至此。”贾赦、贾政便捱次立定。轿子抬至宫门口，便都出了轿，早有几个小内监引路，贾母等各有丫头扶着步行。走至元妃寝宫，只见奎壁辉煌，琉…","so":0,"eo":0},{"surface":"贾母","text":"走过院子里，只见贾母身边的丫头同着秋菱迎面走来。薛姨妈道：“你从那里来？老太太身上可安？”那丫头道：“老太太身上好，叫来请姨太太安，还谢谢前儿的荔枝，还给琴姑娘道喜。”宝钗道：“你多早晚来的？”那丫头道：“来了好一会子了。”薛姨妈料他知道，红着脸说道：“这如今，我们家里闹的也不象个过日子的人家了，叫你们那边听见笑话。”丫头道：“姨太太说那里的话？谁家没个碟大碗小磕着碰着的呢。那是姨太太多心罢咧。”说着，跟了回到薛姨妈房中，略坐了一回就去…","so":0,"eo":0}]},{"chap":84,"ctitle":"第84章 试文字宝玉始提亲 探惊风贾环重结怨","deeds":[{"surface":"贾母","text":"且说元妃疾愈之后，家中俱各喜欢。过了几日，有几个老公走来，带着东西银两，宣贵妃娘娘之命，因家中省问勤劳，俱有赏赐，把物件银两一一交代清楚。贾赦、贾政等禀明了贾母，一齐谢恩毕，太监吃了茶去了。大家回到贾母房中，说笑一回，外面老婆子传进来说：“小厮们来回道：‘那边有人请大老爷说要紧的话呢。’”贾母便向贾赦道：“你去罢。”贾赦答应着，退出来自去了。","so":0,"eo":0},{"surface":"贾母","text":"这里贾母忽然想起，合贾政笑道：“娘娘心里却甚实惦记着宝玉，前儿还特特的问他来着呢。”贾政陪笑道：“只是宝玉不大肯念书，辜负了娘娘的美意。”贾母道：“我倒给他上了个好儿，说他近日文章都做上来了。”贾政笑道：“那里能象老太太的话呢。”贾母道：“你们时常叫他出去作诗作文，难道他都没作上来么？小孩子家，慢慢的教导他。可是人家说的：‘胖子也不是一口儿吃的。’”贾政听了这话，忙陪笑道：“老太太说的是。”贾母又道：“提起宝玉，我还有一件事和你商量：如…","so":0,"eo":0},{"surface":"贾母","text":"几句话说得贾政心中甚实不安，连忙陪笑道：“老太太看的人也多了，既说他好，有造化，想来是不错的。只是儿子望他成人的性儿太急了一点，或者竟合古人的话相反，倒是‘莫知其子之美’了。”一句话把贾母也怄笑了，众人也都陪着笑了。贾母因说道：“你这会子也有了几岁年纪，又居着官，自然越历练越老成。”说到这里，回头瞅着邢夫人合王夫人，笑道：“想他那年轻的时候，那一种古怪脾气，比宝玉还加一倍呢。直等娶了媳妇，才略略的懂了些人事儿。如今只抱怨宝玉。这会子，我…","so":0,"eo":0},{"surface":"贾母","text":"却说邢夫人自去了。贾政同王夫人进入房中。贾政因提起贾母方才的话来，说道：“老太太这么疼宝玉。毕竟要他有些实学，日后可以混得功名才好，不枉老太太疼他一场，也不至遭塌了人家的女儿。”王夫人道：“老爷这话自然是该当的。”贾政因派个屋里的丫头传出去告诉李贵：“宝玉放学回来，索性吃饭后再叫他过来，说我还要问他话呢。”李贵答应了“是”。至宝玉放了学，刚要过来请安，只见李贵道：“二爷先不用过去。老爷吩咐了，今日叫二爷吃了饭就过去呢。听见还有话问二爷呢…","so":0,"eo":0},{"surface":"贾母","text":"宝玉答应了个“是”，只得拿捏着慢慢的退出。刚过穿廊月洞门影屏，便一溜烟跑到贾母院门口。急得焙茗在后头赶着叫道：“看跌倒了！老爷来了。”宝玉那里听的见？刚进得门来，便听见王夫人、凤姐、探春等笑语之声。丫鬟们见宝玉来了，连忙打起帘子，悄悄告诉道：“姨太太在这里呢。”宝玉赶忙进来给薛姨妈请安，过来才给贾母请了晚安。贾母便问：“你今儿怎么这早晚才散学？”宝玉悉把贾政看文章并命作破题的话述了一遍。贾母笑容满面。宝玉因问众人道：“宝姐姐在那里坐着呢…","so":0,"eo":0},{"surface":"贾母","text":"大家吃着酒，贾母便问道：“可是才姨太太提香菱，我听见前儿丫头们说‘秋菱’，不知是谁，问起来才知道是他。怎么那孩子好好的又改了名字呢？”薛姨妈满脸飞红，叹了口气，道：“老太太再别提起。自从蟠儿娶了这个不知好歹的媳妇，成日家咕咕唧唧，如今闹的也不成个人家了。我也说过他几次，他牛心不听说，我也没那么大精神和他们尽着吵去，只好由他们去。可不是他嫌这丫头的名儿不好改的。”贾母道：“名儿什么要紧的事呢。”薛姨妈道：“说起来，我也怪臊的。其实老太太这…","so":0,"eo":0},{"surface":"贾母","text":"这里丫头们刚捧上茶来，只见琥珀走过来向贾母耳朵旁边说了几句，贾母便向凤姐儿道：“你快去罢，瞧瞧巧姐儿去罢。”凤姐听了，还不知何故。大家也怔了。琥珀遂过来向凤姐道：“刚才平儿打发小丫头子来回二奶奶，说：‘巧姐儿身上不大好，请二奶奶忙着些过来才好呢。’”贾母因说道：“你快去罢，姨太太也不是外人。”凤姐连忙答应，在薛姨妈跟前告了辞。又见王夫人说道：“你先过去，我就去。小孩子家魂儿还不全呢，别叫丫头们大惊小怪的。屋里的猫儿狗儿，也叫他们留点神儿…","so":0,"eo":0},{"surface":"贾母","text":"却说次日邢夫人过贾母这边来请安，王夫人便提起张家的事，一面回贾母，一面问邢夫人。邢夫人道：“张家虽系老亲，但近年来久已不通音信，不知他家的姑娘是怎么样的。倒是前日孙亲家太太打发婆子来问安，却说起张家的事，说他家有个姑娘，托孙亲家那边有对劲的提一提。听见说，只这一个女孩儿，十分娇养，也识得几个字，见不得大阵仗儿，常在屋里不出来的。张大老爷又说：只有这一个女孩儿，不肯嫁出去，怕人家公婆严，姑娘受不得委屈。必要女婿过门，赘在他家，给他料理些家…","so":0,"eo":0}]},{"chap":85,"ctitle":"第85章 贾存周报升郎中任 薛文起复惹放流刑","deeds":[{"surface":"贾母","text":"贾赦见过贾母，便各自回去。这里贾政带着他三人请过了贾母的安，又说了些府里遇见什么人。宝玉又回了贾政吴大人陛见保举的话。贾政道：“这吴大人本来咱们相好，也是我辈中人，还倒是有骨气的。”又说了几句闲话儿，贾母便叫：“歇着去罢。”贾政退出，珍、琏、宝玉都跟到门口。贾政道：“你们都回去陪老太太坐着去罢。”说着便回房去。刚坐了一坐，只见一个小丫头回道：“外面林之孝请老爷回话。”说着递上个红单帖来，写着吴巡抚的名字。贾政知道来拜，便叫小丫头叫林之孝…","so":0,"eo":0},{"surface":"贾母","text":"且说珍、琏、宝玉三人回去，独有宝玉到贾母那边，一面述说北静王待他的光景，并拿出那块玉来。大家看着，笑了一回，贾母因命人：“给他收起去罢，别丢了。”因问：“你那块玉好生带着罢？别闹混了。”宝玉便在项上摘下来，说：“这不是我那一块玉？那里就掉了呢。比起来，两块玉差远着呢，那里混得过？我正要告诉老太太：前儿晚上，我睡的时候，把玉摘下来挂在帐子里，他竟放起光来了，满帐子都是红的。”贾母说道：“又胡说了。帐子的檐是红的，火光照着，自然红是有的。”…","so":0,"eo":0},{"surface":"贾母","text":"这里贾母问道：“正是，你们去看姨太太，说起这事来没有？”王夫人道：“本来就要去看，因凤丫头为巧姐儿病着耽搁了两天，今儿才去的。这事我们告诉了，他姨妈倒也十分愿意，只说蟠儿这时候不在家，目今他父亲没了，只得和他商量商量再办。”贾母道：“这也是情理的话。既这么样，大家先别提起，等姨太太那边商量定了再说。”","so":0,"eo":0},{"surface":"贾母","text":"不说贾母处谈论亲事。且说宝玉回到自己房中，告诉袭人道：“老太太和凤姐姐方才说话，含含糊糊，不知是什么意思？”袭人想了想，笑了一笑道：“这个我也猜不着。但只刚才说这些话时，林姑娘在跟前没有？”宝玉道：“林姑娘才病起来，这些时何曾到老太太那边去呢？”正说着，只听外间屋里麝月与秋纹拌嘴。袭人道：“你两个又闹什么？”麝月道：“我们两个斗牌，他赢了我的钱，他拿了去；他输了钱，就不肯拿出来。这也罢了，他倒把我的钱都抢了去了。”宝玉笑道：“几个钱什么…","so":0,"eo":0},{"surface":"贾母","text":"宝玉笑着进了房门。只见黛玉挨着贾母左边坐着呢，右边是湘云。地下邢王二夫人，探春、惜春、李纨、凤姐、李纹、李绮、邢岫烟一干姐妹，都在屋里，只不见宝钗、宝琴、迎春三人。宝玉此时喜的无话可说，忙给贾母道了喜，又给邢王二夫人道喜。一一见了众姐妹，便向黛玉笑道：“妹妹身体可大好了？”黛玉也微笑道：“大好了。听见说二哥哥身上也欠安，好了么？”宝玉道：“可不是！我那日夜里，忽然心里疼起来，这几天刚好些就上学去了，也没能过去看妹妹。”黛玉不等他说完，早…","so":0,"eo":0},{"surface":"贾母","text":"这里贾母因问凤姐：“谁说送戏的话？”凤姐道：“说是二舅舅那边说：后儿日子好，送一班新出的小戏儿给老太太、老爷、太太贺喜。”因又笑着说道：“不但日子好，还是好日子呢！后日还是……”却瞅着黛玉笑。黛玉也微笑。王夫人因道：“可是呢，后日还是外甥女儿的好生日呢。”贾母想了一想，也笑道：“可见我如今老了，什么事都糊涂了。亏了有我这凤丫头，是我个‘给事中’。既这么着，很好。他舅舅家给他们贺喜，你舅舅家就给你做生日，岂不好呢？”说的大家都笑起来，说道…","so":0,"eo":0},{"surface":"贾母","text":"如此两日，已是庆贺之期。这日一早，王子胜和亲戚家已送过一班戏来，就在贾母正厅前搭起行台。外头爷都穿着公服陪侍。亲戚来贺的，约有十余桌酒。里面为着是新戏，又见贾母高兴，便将琉璃戏屏隔在后厦，里面也摆下酒席。上首薛姨妈一桌，是王夫人宝琴陪着；对面老太太一桌，是邢夫人岫烟陪着。下面尚空两桌，贾母叫他们快来。一回儿，只见凤姐领着众丫头，都簇拥着黛玉来了。那黛玉略换了儿件新鲜衣服，打扮得宛如嫦娥下界，含羞带笑的，出来见了众人。湘云、李纹、李琦都让…","so":0,"eo":0},{"surface":"贾母","text":"众人正在高兴时，忽见薛家的人满头大汗闯进来，向薛蝌说道：“二爷快回去！一并里头回明太太，也请回去，家里有要紧事。”薛蝌道：什么事？”家人道：“家去说罢。”薛蝌也不及告辞就走了。薛姨妈见里头丫头传进话去，更骇得面如土色，即忙起身，带着宝琴别了一声，即刻上车回去了。弄得内外愕然。贾母道：“咱们这里打发人跟过去听听，到底是什么事，大家都关切的。”众人答应了个“是”。","so":0,"eo":0}]},{"chap":86,"ctitle":"第86章 受私贿老官翻案牍 寄闲情淑女解琴书","deeds":[{"surface":"贾母","text":"正说着，贾母等回来，见了薛姨妈，也顾不得问好，便问薛蟠的事。薛姨妈细述了一遍。宝玉在旁听见什么蒋玉函一段，当着人不问，心里打量是：“他既回了京，怎么不来瞧我？”又见宝钗也不过来，不知是怎么个原故。心内正自呆呆的想呢，恰好黛玉也来请安。宝玉稍觉心里喜欢，便把想宝钗来的念头打断，同着妹妹们在老太太那里吃了晚饭。大家散了，薛姨妈将就住在老太太的套间屋里。","so":0,"eo":0}]},{"chap":87,"ctitle":"第87章 感秋声抚琴悲往事 坐禅寂走火入邪魔","deeds":[{"surface":"贾母","text":"却说宝玉这日起来，梳洗了，带着焙茗正往书房中来，只见墨雨笑嘻嘻的跑来，迎头说道：“二爷今日便宜了。太爷不在书房里，都放了学了。”宝玉道：“当真的么？”墨雨道：“二爷不信，那不是三爷和兰哥来了？”宝玉看时，只见贾环、贾兰跟着小厮们，两个笑嘻嘻的，嘴里咭咭呱呱不知说些什么，迎头来了。见了宝玉，都垂手站住。宝玉问道：“你们两个怎么就回来了？”贾环道：“今日太爷有事，说是放一天学，明儿再去呢。”宝玉听了，方回身到贾母、贾政处去禀明了，然后回到怡…","so":0,"eo":0}]},{"chap":88,"ctitle":"第88章 博庭欢宝玉赞孤儿 正家法贾珍鞭悍仆","deeds":[{"surface":"贾母","text":"鸳鸯遂辞了出来，同小丫头来至贾母房中，回了一遍。看见贾母与李纨打双陆，鸳鸯旁边瞧着。李纨的骰子好，掷下去把老太太的锤打下了好几个去。鸳鸯抿着嘴儿笑。忽见宝玉进来，手中提了两个细蔑丝的小笼子，笼内有几个蝈蝈儿，说道：“我听说老太太夜里睡不着，我给老太太留下解解闷。”贾母笑道：“你别瞅着你老子不在家，你只管淘气。”宝玉笑道：“我没有淘气。”贾母道：“你没淘气，不在学房里念书，为什么又弄这个东西呢。”宝玉道：“不是我自己弄的。今儿因师父叫环儿…","so":0,"eo":0},{"surface":"贾母","text":"贾母又问道：“兰小子呢，做上来了没有？这该环儿替他了，他又比他小了。是不是？”宝玉笑道：“他倒没有，却是自己对的。”贾母道：“我不信，不然就也是你闹了鬼了。如今你还了得，‘羊群里跑出骆驼来了，就只你大。’你又会做文章了。”宝玉笑道：“实在是他作的。师父还夸他明儿一定大有出息呢。老太太不信，就打发人叫了他来亲自试试，老太太就知道了。”贾母道：“果然这么着我才喜欢。我不过怕你撒谎。既是他做的，这孩子明儿大概还有一点儿出息。”因看着李纨，又想…","so":0,"eo":0},{"surface":"贾母","text":"只见贾环、贾兰也都进来给贾母请了安。贾兰又见过他母亲，然后过来，在贾母傍边侍立。贾母道：“我刚才听见你叔叔说你对的好对子，师父夸你来着。”贾兰也不言语，只管抿着嘴儿笑。鸳鸯过来说道：“请示老太太，晚饭伺候下了。”贾母道：“请你姨太太去罢。”琥珀接着便叫人去王夫人那边请薛姨妈。这里宝玉、贾环退出，素云和小丫头们过来把双陆收起，李纨尚等着伺候贾母的晚饭。贾兰便跟着他母亲站着。贾母道：“你们娘儿两个跟着我吃罢。”李纨答应了。一时，摆上饭来，丫…","so":0,"eo":0},{"surface":"贾母","text":"却说贾母刚吃完了饭，盥漱了，歪在床上说闲话儿。只见小丫头告诉琥珀，琥珀过来回贾母道：“东府大爷请晚安来了。”贾母道：“你们告诉他，如今他办理家务乏乏的，叫他歇着去罢。我知道了。”小丫头告诉老婆子们，老婆子才告诉贾珍，贾珍然后退出。","so":0,"eo":0}]},{"chap":89,"ctitle":"第89章 人亡物在公子填词 蛇影杯弓颦卿绝粒","deeds":[{"surface":"贾母","text":"晚间放学时，宝玉便往代儒托病告假一天。代儒本来上年纪的人，也不过伴着几个孩子解闷儿，时常也八病九痛的，乐得去一个少操一日心。况且明知贾政事忙，贾母溺爱，便点点头儿。宝玉一径回来，见过贾母王夫人，也是这么说，自然没有不信的。略坐一坐，便回园中去了。见了袭人等，也不似往日有说有笑的，便和衣躺在炕上。袭人道：“晚饭预备下了，这会儿吃，还是等一等儿？”宝玉道：“我不吃了，心里不舒服。你们吃去罢。”袭人道：“那么着，你也该把这件衣裳换下来了。那个…","so":0,"eo":0},{"surface":"贾母","text":"紫鹃在旁也不敢劝，只怕倒把闲话勾引旧恨来。迟了好一会，黛玉才随便梳洗了，那眼中泪渍，终是不干。又自坐了一会，叫紫鹃道：“你把藏香点上。”紫鹃道：“姑娘，你睡也没睡得几时，如何点香？不是要写经？”黛玉点点头儿。紫鹃道：“姑娘今日醒得太早，这会子又写经，只怕太劳神了罢。”黛玉道：“不怕！早完了早好！况且我也并不是为经，倒借着写字解解闷儿。以后你们见了我的字迹，就算见了我的面儿了。”说着，那泪直流下来。紫鹃听了这话，不但不能再劝，连自己也掌不…","so":0,"eo":0}]},{"chap":90,"ctitle":"第90章 失绵衣贫女耐嗷嘈 送果品小郎惊叵测","deeds":[{"surface":"贾母","text":"却说黛玉自立意自戕之后，渐渐不支，一日竟至绝粒。从前十几天内，贾母等轮流看望，他有时还说几句话，这两日索性不大言语。心里虽有时昏晕，却也有时清楚。贾母等见他这病不似无因而起，也将紫鹃、雪雁盘问过两次。两个那里敢说？便是紫鹃欲向侍书打听消息，又怕越闹越真，黛玉更死得快了，所以见了侍书，毫不提起。那雪雁是他传话弄出这样原故来，此时恨不得长出百十个嘴来说“我没说”，自然更不敢提起。到了这一天黛玉绝粒之日，紫鹃料无指望了，守着哭了会子，因出来偷…","so":0,"eo":0},{"surface":"贾母","text":"原来那黛玉虽则病势沉重，心里却还明白。起先侍书雪雁说话时，他也模糊听见了一半句，却只作不知，也因实无精神答理。及听了雪雁侍书的话，才明白过前头的事情原是议而未成的。又兼侍书说是凤姐说的，老太太的主意，亲上作亲，又是园中住着的，非自己而谁？因此一想，阴极阳生，心神顿觉清爽许多，所以才喝了两口水，又要想问诗书的话。恰好贾母、王夫人、李纨、凤姐听见紫鹃之言都赶着来看。黛玉心中疑团已破，自然不似先前寻死之意了。虽身骨软弱，精神短少，却也勉强答应…","so":0,"eo":0},{"surface":"贾母","text":"不但紫鹃和雪雁在私下里讲究，就是众人也都知道黛玉的病也病的奇怪，好也好得奇怪，三三两两，唧唧哝哝议论着。不多几时，连凤姐儿也知道了，邢、王二夫人也有些疑惑，倒是贾母略猜着了八九。那时正值邢、王二夫人、凤姐等在贾母房中说闲话，说起黛玉的病来。贾母道：“我正要告诉你们。宝玉和林丫头是从小儿在一处的，我只说小孩子们怕什么。以后时常听得林丫头忽然病，忽然好，都为有了些知觉了。所以我想他们若尽着搁在一块儿，毕竟不成体统。你们怎么说？”王夫人听了，…","so":0,"eo":0}]},{"chap":91,"ctitle":"第91章 纵淫心宝蟾工设计 步疑阵宝玉妄谈禅","deeds":[{"surface":"贾母","text":"到了次日，王夫人将贾政的话向薛姨妈说了，薛姨妈想着也是。到了饭后，王夫人陪着来到贾母房中，大家让了坐。贾母道：“姨太太才过来？”薛姨妈道：“还是昨儿过来的，因为晚了，没得过来给老太太请安。”王夫人便把贾政昨夜所说的话向贾母述了一遍，贾母甚喜。说着，宝玉进来了，贾母便问道：“吃了饭了没有？”宝玉道：“才打学房里回来，吃了，要往学房里去，先见见老太太。又听见说姨妈来了，过来给姨妈请请安。”因问：“宝姐姐大好了？”薛姨妈笑道：“好了。”原来方…","so":0,"eo":0}]},{"chap":92,"ctitle":"第92章 评女传巧姐慕贤良 玩母珠贾政参聚散","deeds":[{"surface":"贾母","text":"到了次日，果然一早到老太太那里请了安。又到贾政、王大人那里请了安，回明了老太太今儿不叫上学，贾政也没言语，便慢慢退出来。走了几步，便一溜烟跑到贾母房中。见众人都没来，只有凤姐那边的奶妈子，带了巧姐儿，跟着几个小丫头过来，给老太太请了安，说：“我妈妈先叫我来请安，陪着老太太说说话儿。妈妈回来就来。”贾母笑着道：“好孩子，我一早就起来了，等他们总不来。只有你二叔叔来了。”那奶妈子便说：“姑娘，给叔叔请安。”巧姐便请了安。宝玉也问了一声“妞妞…","so":0,"eo":0},{"surface":"贾母","text":"宝玉便道：“那文王后妃不必说了。那姜后脱簪待罪和齐国的无盐安邦定国，是后妃里头的贤能的。”巧姐听了，答应个“是”。宝玉又道：“若说有才的，是曹大姑、班婕妤、蔡文姬、谢道韫诸人。”巧姐问道：“那贤德的呢？”宝玉道：“孟光的荆钗布裙，鲍宣妻的提瓮出汲，陶侃母的截发留宾，这些不厌贫的，就是贤德了。”巧姐欣然点头。宝玉道：“还有苦的，象那乐昌破镜，苏蕙回文；那孝的，木兰代父从军，曹娥投水寻尸等类，也难尽说。”巧姐听到这些，却默默如有所思。宝玉又…","so":0,"eo":0},{"surface":"贾母","text":"巧姐道：“我还听见我妈妈说：我们家的小红，头里是二叔叔那里的，我妈妈要了来，还没有补上人呢。我妈妈想着要把什么柳家的五儿补上，不知二叔叔要不要。”宝玉听了更喜欢，笑着道：“你听你妈妈的话！要补谁就补谁罢咧，又问什么要不要呢。”因又向贾母笑道：“我瞧大妞妞这个小模样儿，又有这个聪明儿，只怕将来比凤姐姐还强呢，又比他认的字。”贾母道：“女孩儿家认得字也好，只是女工针黹倒是要紧的。”巧姐儿道：“我也跟着刘妈妈学着做呢。什么扎花吻，拉锁子例，我…","so":0,"eo":0},{"surface":"贾母","text":"贾母等着那些人，见这时候还不来，又叫丫头去请。回来李纨同着他妹子、探春、惜春、史湘云、黛玉都来了。大家请了贾母的安，众人厮见。独有薛姨妈未到，贾母又叫请去。果然薛姨妈带着宝琴过来。宝玉请了安，问了好，只不见宝钗邢岫烟二人。黛玉便问起：“宝姐姐为何不来？”薛姨妈假说身上不好。邢岫烟知道薛姨妈在坐，所以不来。宝玉虽见宝钗不来，心中纳闷，因黛玉来了，便把想宝钗的心暂且搁开。不多时，邢、王二夫人也来了。凤姐听见婆婆们先到了，自己不好落后，只得打…","so":0,"eo":0},{"surface":"贾母","text":"凤姐听了，诧异道：“那有这样傻丫头，偏偏的就碰见这个傻小子！怪不得那一天翻出那些东西来，他心里没事人似的，敢只是这么个烈性孩子。论起来我也没这么大工夫管他这些闲事，但只你才说的，叫人听着怪可怜见儿的。也罢了，你回去告诉他，我和你二爷说，打发旺儿给他撕掳就是了。”凤姐打发那人去了，才过贾母这边来，不提。","so":0,"eo":0},{"surface":"贾母","text":"贾政便着人叫贾琏把这两件东西送到老太太那边去，并叫人请了邢、王二夫人、凤姐儿都来瞧着，又把两件东西一一试过。贾琏道：“他还有两件：一件是围屏，一件是乐钟。共总要卖二万银子呢。”凤姐儿接着道：“东西自然是好的，但是那里有这些闲钱？咱们又不比外任督抚要办贡。我已经想了好些年了，象咱们这种人家，必得置些不动摇的根基才好：或是祭地，或是义庄，再置些坟屋。往后子孙遇见不得意的事，还是点儿底子，不到一败涂地。我的意思是这样，不知老太太、老爷、太太们…","so":0,"eo":0}]},{"chap":94,"ctitle":"第94章 宴海棠贾母赏花妖 失宝玉通灵知奇祸","deeds":[{"surface":"贾母","text":"且说紫鹃因黛玉渐好，园中无事，听见女尼等预备宫内使唤，不知何事便到贾母那边打听打听。恰遇着鸳鸯下来闲着，坐下说闲话儿，提起女尼的事，鸳鸯诧异道：“我并没有听见。回来问问二奶奶就知道了。”正说着，只见傅试家两个女人过来请贾母的安，鸳鸯要陪了上去。那两个女人因贾母正睡晌觉，就与鸳鸯说了一声儿，回去了。紫鹃问：“这是谁家差来的？”鸳鸯道：“好讨人嫌！家里有了一个女孩儿，长的好些儿，就献宝的似的，常在老太太跟前夸他们姑娘怎么长的好，心地儿怎么好…","so":0,"eo":0},{"surface":"贾母","text":"大家说笑了一回，讲究这花开得古怪。贾母道：“这花儿应在三月里开的，如今虽是十一月，因节气迟，还算十月，应着小阳春的天气，因为和暖，开花也是有的。”王夫人道：“老太太见的多，说得是，也不为奇。”邢夫人道：“我听见这花已经萎了一年，怎么这回不应时候儿开了？必有个原故。”李纨笑道：“老太太和太太说的都是。据我的糊涂想头，必是宝玉有喜事来了，此花先来报信。”探春虽不言语，心里想道：“必非好兆。大凡顺者昌，逆者亡；草木知运，不时而发，必是妖孽。”…","so":0,"eo":0},{"surface":"贾母","text":"正说着，贾赦、贾政、贾环、贾兰都进来看花。贾赦便说：“据我的主意，把他砍去。必是花妖作怪。”贾政道：“见怪不怪，其怪自败。不用砍他，随他去就是了。”贾母听见，便说：“谁在这里混说？人家有喜事好处，什么怪不怪的。若有好事，你们享去；若是不好，我一个人当去。你们不许混说！”贾政听了，不敢言语，讪讪的同贾赦等走了出来。","so":0,"eo":0},{"surface":"贾母","text":"那贾母高兴，叫人传话到厨房里：“快快预备酒席，大家赏花。”叫宝玉、环儿、兰儿：“各人做一首诗志喜。林姑娘的病才好，别叫他费心，若高兴，给你们改改。”对着李纨道：“你们都陪我喝酒。”李纨答应了是，便笑对探春笑道：“都是你闹的。”探春道：“饶不叫我们做诗，怎么我们闹的？”李纨道：“海棠社不是你起的么？如今那棵海棠也要来入社了。”大家听着都笑了。","so":0,"eo":0},{"surface":"贾母","text":"一时摆上酒菜，一面喝着，彼此都要讨老太太的喜欢，大家说些兴头话。宝玉上来斟了酒，便立成了四句诗，写出来念与贾母听，道：","so":0,"eo":0},{"surface":"贾母","text":"贾兰恭楷誊正，呈与贾母。贾母命李纨念道：","so":0,"eo":0},{"surface":"贾母","text":"贾母听毕，便说：“我不大懂诗，听去倒是兰儿的好，环儿做的不好。都上来吃饭罢。”宝玉看见贾母喜欢，更是兴头，因想起：“晴雯死的那年，海棠死的；今日海棠复荣，我们院内这些人，自然都好，但是晴雯不能象花的死而复生了。”顿觉转喜为悲。忽又想起前日巧姐提凤姐要把五儿补入。“或此花为此而开，也未可知。”却又转悲为喜，依旧说笑。","so":0,"eo":0},{"surface":"贾母","text":"贾母还坐了半天，然后扶了珍珠回去了，王夫人等跟着过来。只见平儿笑嘻嘻的迎上来，说：“我们奶奶知道老太太在这里赏花，自己不得来，叫奴才来伏侍老太太、太太们。还有两匹红送宝二爷包裹这花，当作贺礼。”袭人过来接了，呈与贾母看。贾母笑道：“偏是凤丫头行出点事儿来，叫人看着又体面，又新鲜，很有趣儿。”袭人笑着向平儿道：“回去替宝二爷给二奶奶道谢：要有喜，大家喜。”贾母听了，笑道：“嗳哟！我还忘了呢。凤丫头虽病着，还是他想的到，送的也巧。”一面说着…","so":0,"eo":0}]},{"chap":95,"ctitle":"第95章 因讹成实元妃薨逝 以假混真宝玉疯癫","deeds":[{"surface":"贾母","text":"次日，王夫人等早派人到当铺里去查问，凤姐暗中设法找寻。一连闹了几天、总无下落。还喜贾母、贾政未知。袭人等每日提心吊胆。宝玉也好几天不上学，只是怔怔的，不言不语，没心没绪的。王夫人只知他因失玉而起，也不大着意。那日正在纳闷，忽见贾琏进来请安，嘻嘻的笑道：“今日听得雨村打发人来告诉咱们二老爷，说舅太爷升了内阁大学士，奉旨进京，已定于明年正月二十日宣麻，有三百里的文书去了。想舅太爷昼夜趱行，半个多月就要到了。侄儿特来回太太知道。”王夫人听说，…","so":0,"eo":0},{"surface":"贾母","text":"忽一天，贾政进来，满脸泪痕，喘吁吁的说道：“你快去禀知老太太，即刻进宫！不用多人的，是你伏侍进去。因娘娘忽得暴病，现在太监在外立等。他说：‘太医院已经奏明痰厥，不能医治。’”王夫人听说，使大哭起来。贾政道：“这不是哭的时候，快快去请老太太。说得宽缓些，不要吓坏了老人家。”贾政说着，出来吩咐家人伺候。王夫人收了泪，去请贾母，只说元妃有病，进去请安。贾母念佛道：“怎么又病了？前番吓的我了不得，后来又打听错了。这回情愿再错了也罢。”王夫人一面…","so":0,"eo":0},{"surface":"贾母","text":"且说元春自选了凤藻宫后，圣眷隆重，身体发福，未免举动费力。每日起居劳乏，时发痰疾。因前日侍宴回宫，偶沾寒气、勾起旧病。不料此回甚属利害，竟至痰气壅塞，四肢厥冷。一面奏明，即召太医调治。岂知汤药不进，连用通关之剂，并不见效。内官忧虑，奏请预办后事，所以传旨命贾氏椒房进见。贾母、王夫人遵旨进宫，见元妃痰塞口涎，不能言语。见了贾母，只有悲泣之状，却没眼泪。贾母进前请安，奏些宽慰的话。少时贾政等职名递进，宫嫔传奏，元妃目不能顾，渐渐脸色改变。内…","so":0,"eo":0},{"surface":"贾母","text":"朝门内官员有信。不多时，只见太监出来，立传钦天监。贾母便知不好，尚未敢动。稍刻，小太监传谕出来，说：“贾娘娘薨逝。”是年甲寅年十二月十八日立春，元妃薨日，是十二月十九日，已交卯年寅月，存年四十三岁。贾母含悲起身，只得出宫上轿回家。贾政等亦已得信，一路悲戚。到家中，邢夫人、李纨、凤姐、宝玉等出厅，分东西迎着贾母，请了安，并贾政、王夫人请安，大家哭泣不提。","so":0,"eo":0},{"surface":"贾母","text":"独有宝玉原是无职之人，又不念书，代儒学里知他家里有事，也不来管他；贾政正忙，自然没有空儿查他。想来宝玉趁此机会，竟可与妹妹们天天畅乐：不料他自失了玉后，终日懒怠，说话也糊涂了。贾母等出门回来，有人叫他去请安，便去；没人叫他，他也不动。袭人等怀着鬼胎，又不敢去招惹他，恐他生气。每天茶饭，端到面前便吃，不来也不要。袭人看这光景，不象是有气，竟象是有病的。袭人偷着空儿到潇馆告诉紫鹃，说是：“二爷这么着，求姑娘给他开导开导。”紫鹃虽即告诉黛玉，…","so":0,"eo":0},{"surface":"贾母","text":"过了几日，元妃停灵寝庙，贾母等送殡去了几天。岂知宝玉一日呆似一日，也不发烧，也不疼痛，只是吃不象吃，睡不象睡，甚至说话都无头绪。那袭人、麝月等一发慌了，回过凤姐几次。凤姐不时过来。起先道是找不着玉生气，如今看他失魂落魄的样子，只有日日请医调治。煎药吃了好几剂，只有添病的，没有减病的。及至问他那里不舒服，宝玉也不说出来。直至元妃事毕，贾母惦记宝玉，亲自到园看视，王夫人也随过来。袭人等叫宝玉接出去请安。宝玉虽说是病，每日原起来行动，今日叫他…","so":0,"eo":0},{"surface":"贾母","text":"不一时传话进来，说：“老爷谢客去了。”贾母道：“不用他也使得。你们便说我说的话，暂且也不用责罚下人。我便叫琏儿来，写出赏格，悬在前日经过的地方，便说：‘人有检得送来者，情愿送银一万两；如有知人检得，送信找得者，送银五千两。’如真有了，不可吝惜银子。这么一找，少不得就找出来了。若是靠着咱们家几个人找，就找一辈子也不能得！”王夫人也不敢直言。贾母传话告诉贾琏，叫他速办去了。贾母便叫人：“将宝玉动用之物，都搬到我那里去。只派袭人、秋纹跟过来，…","so":0,"eo":0},{"surface":"贾母","text":"回到自己房中，叫王夫人坐下，看人收拾里间屋内安置，便对王夫人道：“你知道我的意思么？我为的是园里人少，怡红院的花树忽萎忽开，有些奇怪。头里仗着那块玉能除邪祟，如今玉丢了，只怕邪气易侵，所以我带过他来一块儿住着。这几天也不用叫他出去。大夫来，就在这里瞧。”王夫人听说，便接口道：“老太太想的自然是。如今宝玉同着老太太住了，老太太的福气大，不论什么都压住了。”贾母道：“什么福气！不过我屋里干净些，经卷也多，都可以念念，定定心神。你问宝玉好不好…","so":0,"eo":0}]},{"chap":96,"ctitle":"第96章 瞒消息凤姐设奇谋 泄机关颦儿迷本性","deeds":[{"surface":"贾母","text":"贾政早已知道，心里很不受用，又知宝玉失玉以后，神志昏愦，医药无效，又值王夫人心疼。那年正值京察，工部将贾政保列一等，二月，吏部带领引见。皇上念贾政勤俭谨慎，即放了江西粮道。即日谢恩，已奏明起程日期。虽有众亲朋贺喜，贾政也无心应酬。只念家中人口不宁，又不敢耽延在家。正在无计可施，只听见贾母那边叫：“请老爷。”贾政即忙进去。看见王夫人带着病也在那里，便向贾母请了安。贾母叫他坐下，便说：“你不日就要赴任，我有多少话与你说，不知你听不听？”说着…","so":0,"eo":0},{"surface":"贾母","text":"王夫人见贾政说着也有些眼圈儿红，知道心里是疼的，便叫袭人扶了宝玉来。宝玉见了他父亲，袭人叫他请安，他便请了个安。贾政见他脸面很瘦，目光无神，大有疯傻之状，便叫人扶了进去，便想到：“自己也是望六的人了，如今又放外任，不知道几年回来。倘或这孩子果然不好，一则年老无嗣，虽说有孙子，到底隔了一层；二则老太太最疼的是宝玉，若有差错，可不是我的罪名更重了？”瞧瞧王夫人一包眼泪，又想到他身上，复站起来说：“老太太这么大年纪，想法儿疼孙子，做儿子的还敢…","so":0,"eo":0},{"surface":"贾母","text":"贾政听了，原不愿意，只是贾母做主，不敢违命，勉强陪笑说道：“老太太想得极是，也很妥当。只是要吩咐家下众人，不许吵嚷得里外皆知，这要耽不是的。姨太太那边只怕不肯，若是果真应了，也只好按着老太太的主意办去。”贾母道：“姨太太那里有我呢，你去罢。”贾政答应出来，心中好不自在。因赴任事多，部里领凭，亲友们荐人，种种应酬不绝，竟把宝玉的事听凭贾母交与王夫人凤姐儿了。惟将荣禧堂后身王夫人内屋旁边一大跨所二十余间房屋指与宝玉，余者一概不管。贾母定了主…","so":0,"eo":0},{"surface":"贾母","text":"且说宝玉见过贾政，袭人扶回里间炕上。因贾政在外，无人敢与宝玉说话，宝玉便昏昏沉沉的睡去，贾母与贾政所说的话，宝玉一句也没有听见。袭人等却静静儿的听得明白。头里虽也听得些风声，到底影响，只不见宝钗过来，却也有些信真。今日听了这些话，心里方才水落归漕，倒也喜欢。心里想道：“果然上头的眼力不错，这才配的是，我也造化！若他来了，我可以卸了好些担子。但是这一位的心里只有一个林姑娘，幸亏他没有听见，若知道了，又不知要闹到什么分儿了。”袭人想到这里，…","so":0,"eo":0},{"surface":"贾母","text":"说着，仍到贾母跟前。贾母正在那里和凤姐儿商议，见王夫人进来，便问道：“袭人丫头说什么，这么鬼鬼祟祟的？”王夫人趁问，便将宝玉的心事细细回明贾母。贾母听了，半日没言语。王夫人和凤姐也都不再说了。只见贾母叹道：“别的事都好说。林丫头倒没有什么。若宝玉真是这样，这可叫人作了难了。”只见凤姐想了一想，因说道：“难倒不难。只是我想了个主意，不知姑妈肯不肯。”王夫人道：“你有主意，只管说给老太太听，大家娘儿们商量着办罢了。”凤姐道：“依我想，这件事…","so":0,"eo":0},{"surface":"贾母","text":"正说间，丫头传进话来，说：“琏二爷回来了。”王夫人恐贾母问及，使个眼色与凤姐。凤姐便出来迎着贾琏，努了个嘴儿，同到王夫人屋里等着去了。一会儿，王夫人进来，已见凤姐哭的两眼通红。贾琏请了安，将到十里屯料理王子腾的丧事的话说了一遍，便说：“有恩旨赏了内阁的职衔，谥了文勤公，命本家扶柩回籍，着沿途地方宫员照料。昨日起身，连家眷回南去了。舅太太叫我回来请安问好，说：‘如今想不到不能进京，有多少话不能说。听见我大舅子要进京，若是路上遇见了，便叫他…","so":0,"eo":0},{"surface":"贾母","text":"一日，黛玉早饭后，带着紫鹃到贾母这边来，一则请安，二则也为自己散散闷。出了潇湘馆，走了几步，忽然想起忘了手绢子来，因叫紫鹃回去取来，自己却慢慢的走着等他。刚走到沁芳桥那边山石背后当日同宝玉葬花之处，忽听一个人呜呜咽咽在那里哭。黛玉煞住脚听时，又听不出是谁的声音，也听不出哭的叨叨的是些什么话。心里甚是疑惑，便慢慢走去。及到了跟前，却见一个浓眉大眼的丫头在那里哭呢。黛玉未见他时，还只疑府里这些大丫头有什么说不出的心事，所以来这里发泄发泄；及…","so":0,"eo":0},{"surface":"贾母","text":"那丫头见黛玉来了，便也不敢再哭，站起来拭眼泪。黛玉问道：“你好好的为什么在这里伤心？”那丫头听了这话、又流泪道：“林姑娘，你评评这个理。他们说话，我又不知道，我就说错了一句话，我姐姐也不犯就打我呀。”黛玉听了，不懂他说的是什么，因笑问道：“你姐姐是那一个？”那丫头道：“就是珍珠姐姐。”黛玉听了，才知他是贾母屋里的。因又问：“你叫什么？”那丫头道：“我叫傻大姐儿。”黛玉笑了一笑，又问：“你姐姐为什么打你？你说错了什么话了？”那丫头道：“为…","so":0,"eo":0}]},{"chap":97,"ctitle":"第97章 林黛玉焚稿断痴情 薛宝钗出闺成大礼","deeds":[{"surface":"贾母","text":"话说黛玉到潇湘馆门口，紫鹃说了一句话，更动了心，一时吐出血来，几乎晕倒，亏了紫鹃还同着秋纹，两个人搀扶着黛玉到屋里来。那时秋纹去后，紫鹃雪雁守着，见他渐渐苏醒过来，问紫鹃道：“你们守着哭什么？”紫鹃见他说话明白，倒放了心了，因说：“姑娘刚才打老太太那边回来，身上觉着不大好，唬的我们没了主意，所以哭了。”黛玉笑道：“我那里就能够死呢。”这一句话没完，又喘成一处。原来黛玉因今日听得宝玉宝钗的事情，这本是他数年的心病，一时急怒，所以迷惑了本性…","so":0,"eo":0},{"surface":"贾母","text":"只见黛玉微微睁眼，看见贾母在他旁边，便喘吁吁的说道：“老太太！你白疼了我了。”贾母一闻此言，十分难受，便道：“好孩子，你养着罢！不怕的。”黛玉微微一笑，把眼又闭上了。外面丫头进来回凤姐道：“大夫来了。”于是大家略避。王大夫同着贾琏进来，诊了脉，说道：“尚不妨事。这是郁气伤肝，肝不藏血，所以神气本定。如今要用敛阴止血的药，方可望好。”王大夫说完，同着贾链出去开方取药去了。贾母看黛玉神气不好，便出来告诉凤姐等道：“我看这孩子的病，不是我咒他…","so":0,"eo":0},{"surface":"贾母","text":"且说次日凤姐吃了早饭过来，便要试试宝玉，走进屋里说道：“宝兄弟大喜！老爷已择了吉日，要给你娶亲了。你喜欢不喜欢？”宝玉听了，只管瞅着凤姐笑，微微的点点头儿。凤姐笑道：“给你娶林妹妹过来，好不好？”宝玉却大笑起来。凤姐看着，也断不透他是明白，是糊涂，因又问道：“老爷说：你好了就给你娶林妹妹呢。若还是这么傻，就不给你娶了。”宝玉忽然正色道：“我不傻，你才傻呢。”说着，便站起来说：“我去瞧瞧林妹妹，叫他放心。”凤姐忙扶住了，说：“林妹妹早知道…","so":0,"eo":0},{"surface":"贾母","text":"说着，王夫人也来。大家到了薛姨妈那里，只说：“惦记着这边的事，来瞧瞧。”薛姨妈感激不尽，说些薛蟠的话。喝了茶，薛姨妈要叫人告诉宝钗，凤姐连忙拦住，说：“姑妈不必告诉宝妹妹。”又向薛姨妈陪笑说道：“老太太此来，一则为瞧姑妈，二则也有句要紧的话，特请姑妈到那边商议。”薛姨妈听了，点点头儿说：“是了。”于是大家又说些闲话，便回来了。当晚薛姨妈果然过来，见过了贾母，到王夫人屋里来，不免说起王子腾来，大家落了一回泪。薛姨妈便问道：“刚才我到老太太…","so":0,"eo":0},{"surface":"贾母","text":"次日，贾琏过来见了薛姨妈，请了安，便说：“明日就是上好的日子。今日过来回姨太太，就是明日过礼罢。只求姨太太不要挑饬就是了。”说着，捧过通书来。薛姨妈也谦逊了几句，点头应允。贾琏赶着回去，回明贾政。贾政便道：“你回老太太说：既不叫亲友们知道，诸事宁可简便些。若是东西上，请老太太瞧了就是了，不必告诉我。”贾琏答应，进内将话回明贾母。这里王夫人叫了凤姐命人将过礼的物件都送与贾母过目，并叫袭人告诉宝玉。那宝玉又嘻嘻的笑道：“这里送到园里，回来园…","so":0,"eo":0},{"surface":"贾母","text":"且说黛玉虽然服药，这病日重一日。紫鹃等在旁苦劝，说道：“事情到了这个分儿，不得不说了。姑娘的心事，我们也都知道。至于意外之事，是再没有的。姑娘不信，只拿宝玉的身子说起，这样大病，怎么做得亲呢？姑娘别听瞎话，自己安心保重才好。”黛玉微笑一笑，也不答言，又咳嗽数声，吐出好些血来。紫鹃等看去，只有一息奄奄，明知劝不过来，惟有守着流泪。天天三四趟去告诉贾母，鸳鸯测度贾母近日比前疼黛玉的心差了些，所以不常去回。况贾母这几日的心都在宝钗、宝玉身上，…","so":0,"eo":0},{"surface":"贾母","text":"黛玉向来病着，自贾母起直到妹妹们的下人，常来问候，今见贾府中上下人等都不过来，连一个问的人都没有，睁开眼只有紫鹃一人。自料万无生理，因扎挣着向紫鹃说道：“妹妹，你是我最知心的。虽是老太太派你伏侍我，这几年，我拿你就当作我的亲妹妹。”说到这里，气又接不上来。紫鹃听了，一阵心酸，早哭得说不出话来。迟了半日，黛玉又一面喘，一面说道：“紫鹃妹妹，我躺着不受用，你扶起我来靠着坐坐才好。”紫鹃道：“姑娘的身上不大好，起来又要抖搂着了。”黛玉听了，闭…","so":0,"eo":0},{"surface":"贾母","text":"到了次日早起，觉黛玉又缓过一点儿来。饭后，忽然又嗽又吐，又紧起来。紫鹃看着不好了，连忙将雪雁等都叫进来看守，自己却来回贾母。那知到了贾母上房，静悄悄的，只有两三个老妈妈和几个做粗活的丫头在那里看屋子呢。紫鹃因问道：“老太太呢？”那些人都说：“不知道。”紫鹃听这话诧异，遂到宝玉屋里去看，竟也无人。遂问屋里的丫头，也说不知。紫鹃巳知八九：“但这些人怎么竟这样狠毒冷淡！”又想到黛玉这几天竟连一个人问的也没有，越想越悲，索性激起一腔闷气来，一扭…","so":0,"eo":0}]},{"chap":98,"ctitle":"第98章 苦绛珠魂归离恨天 病神瑛泪洒相思地","deeds":[{"surface":"贾母","text":"回家，宝玉越加沉重。次日连起坐都不能了，日重一日，甚至汤水不进。薛姨妈等忙了手脚，各处遍请名医，皆不识病源。只有城外破寺中住着个穷医姓毕别号知庵的，诊得病源是悲喜激射，冷暖失调，饮食失时，忧忿滞中，正气壅闭，此内伤外感之症。于是度量用药，至晚服了，二更后，果然省些人事，便要喝水，贾母、王夫人等才放了心，请了薛姨妈带了宝钗，都到贾母那里，暂且歇息。宝玉片时清楚，自料难保，见诸人散后，房中只有袭人，因唤袭人至跟前，拉着手哭道：“我问你，宝姐…","so":0,"eo":0},{"surface":"贾母","text":"宝玉听了，不禁放声大哭，倒在床上，忽然眼前漆黑，辨不出方向。心中正自恍惚，只见眼前好象有人走来。宝玉茫然问道：“借问此是何处？”那人道：“此阴司泉路。你寿未终，何故至此？”宝玉道：“适闻有一故人已死，遂寻访至此，不觉迷途。”那人道：“故人是谁？”宝玉道：“姑苏林黛玉。”那人冷笑道：“林黛玉生不同人，死不同鬼，无魂无魄，何处寻访？凡人魂魄，聚而成形，散而为气，生前聚之，死则散焉。常人尚无可寻访，何况林黛玉呢？汝快回去罢。”宝玉听了，呆了半…","so":0,"eo":0},{"surface":"贾母","text":"起初宝钗早知黛玉已死，因贾母等不许众人告诉宝玉知道，恐添病难治。自己却深知宝玉之病实因黛玉而起，失玉次之，故趁势说明，使其痛决绝，神魂一归，庶可疗治。贾母、王夫人等不知宝钗的用意，深怪他造次，后来见宝玉醒了过来，方才放心，立刻到外书房请了毕大夫进来诊视。那大夫进来诊了脉，便道奇怪：“这回脉气沉静，神安郁散，明日进调理的药，就可以望好了。”说着出去。众人各自安心散去。袭人起初深怨宝钗不该告诉，惟是口中不好说出。莺儿背地也说宝钗道：“姑娘忒…","so":0,"eo":0},{"surface":"贾母","text":"那宝钗任人诽谤，并不介意，只察宝玉心病，暗下针砭。一日，宝玉渐觉神志安定，虽一时想起黛玉，尚有糊涂。更有袭人缓缓的将“老爷选定的宝姑娘为人和厚，嫌林姑娘秉性古怪，原恐早夭。老太太恐你不知好歹，病中着急，所以叫雪雁过来哄你”的话，时常劝解。宝玉终是心酸落泪。欲待寻死，又想着梦中之言，又恐老太太、太太生气，又不得撩开。又想黛玉已死，宝钗又是第一等人物，方信“金石姻缘”有定，自己也解了好些。宝钗看来不妨大事，于是自己心也安了，只在贾母、王夫人…","so":0,"eo":0},{"surface":"贾母","text":"一时叫了林之孝家的过来，将黛玉停放毕，派人看守，等明早去回凤姐。凤姐因见贾母、王夫人等忙乱，贾政起身，又为宝玉昏愦更甚，正在着急异常之时，若是又将黛玉的凶信回了，恐贾母、王夫人愁苦交加，急出病来，只得亲自到园。到了潇湘馆内，也不免哭了一场。见了李纨、探春，知道诸事齐备，就说：“很好。只是刚才你们为什么不言语，叫我着急？”探春道：“刚才送老爷，怎么说呢？”凤姐道：“这倒是你们两个可怜他些。这么着，我还得那边去招呼那个冤家呢。但是这件事好累…","so":0,"eo":0},{"surface":"贾母","text":"凤姐到了宝玉那里，听见大夫说不妨事，贾母、王夫人略觉放心，凤姐便背了宝玉，缓缓的将黛玉的事回明了。贾母、王夫人听得，都唬了一大跳。贾母眼泪交流，说道：“是我弄坏了他了。但只是这个丫头也忒傻气！”说着，便要到园里去哭他一场，又惦记着宝玉，两头难顾。王夫人等含悲共劝贾母：“不必过去，老太太身子要紧。”贾母无奈，只得叫王夫人自去。又说：“你替我告诉他的阴灵，‘并不是我忍心不来送你，只为有个亲疏。你是我的外孙女儿，是亲的了；若与宝玉比起来，可是…","so":0,"eo":0},{"surface":"贾母","text":"那时宝钗尚未回九，所以每每见了人，倒有些含羞之意。这一天，见贾母满面泪痕，递了茶，贾母叫他坐下。宝钗侧身陪着坐了，才问道：“听得林妹妹病了，不知他可好些了？”贾母听了这话，那眼泪止不住流下来，因说道：“我的儿！我告诉你，你可别告诉宝玉。都是因你林妹妹，才叫你受了多少委屈！你如今作媳妇了，我才告诉你，这如今你林妹妹没了两三天了，就是娶你的那个时辰死的。如今宝玉这一番病，还是为着这个。你们先都在园子里，自然也都是明白的。”宝钗把脸飞红了，想…","so":0,"eo":0},{"surface":"贾母","text":"自此，宝钗千回万转，想了一个主意，只不肯造次，所以过了回九，才想出这个法子来。如今果然好些，然后大家说话才不至似前留神。独是宝玉虽然病势一天好似一天，他的痴心总不能解，必要亲去哭地一场。贾母等知他病未除根，不许他胡思乱想，怎奈他郁闷难堪，病多反复，倒是大夫看出心病，索性叫他开散了再用药调理，倒可好得快些。宝玉听说，立刻要往潇湘馆来。贾母等只得叫人抬了竹椅子过来，扶宝玉坐上，贾母王夫人即便先行。到了潇湘馆内，一见黛玉灵柩，贾母已哭得泪干气…","so":0,"eo":0}]},{"chap":99,"ctitle":"第99章 守官箴恶奴同破例 阅邸报老舅自担惊","deeds":[{"surface":"贾母","text":"话说凤姐见贾母和薛姨妈为黛玉伤心，便说：“有个笑话儿说给老太太和姑妈听。”未从开口，先自笑了。因说道：“太太和姑妈打谅是那里的笑话儿？就是咱们家的新姑爷新媳妇啊。”贾母道：“怎么了？”凤姐拿手比着道：“一个这么坐着，一个这么站着；一个这么扭过去，一个这么转过来，一个又……”说到这里，贾母已经大笑起来，说道：“你好生说罢。倒不是他们两口儿，你倒把人怄的受不得了。”薛姨蚂也笑道：“你往下直说罢，不用比了。”凤姐才说道：“刚才我到宝兄弟屋里，…","so":0,"eo":0},{"surface":"贾母","text":"却说宝玉虽然病好，宝钗有时高兴，翻书观看，谈论起来，宝玉所有常见的尚可记忆，若论灵机儿大不似先，连他自己也不解。宝钗明知是“通灵”失去，所以如此。倒是袭人时常说他：“你为什么把从前的灵机儿都没有了？倒是忘了旧毛病也好，怎么脾气还照旧，独道理上更糊涂了呢？”宝玉听了，并不生气，反是嘻嘻的笑。有时宝玉顺性胡闹，亏宝钗劝着，略觉收敛些。袭人倒可小费些唇舌，惟知悉心伏侍。别的丫头素仰宝钗贞静和平，各人心服，无不安静。只有宝玉到底是爱动不爱静的，…","so":0,"eo":0}]},{"chap":100,"ctitle":"第100章 破好事香菱结深恨 悲远嫁宝玉感离情","deeds":[{"surface":"贾母","text":"贾政心想薛蟠的事，到底有什么挂碍，在外头信息不通，难以打点。故回到本任来便打发家人进京打听，顺便将总制求亲之事回明贾母，如若愿意，即将三姑娘接到任所。家人奉命，赶到京中回明了王夫人，便在吏部打听得贾政并无处分，惟将署太平县的这位老爷革职。即写了禀帖，安慰了贾政，然后住着等信。","so":0,"eo":0},{"surface":"贾母","text":"是日，宝钗在贾母屋里，听得王夫人告诉老太太要聘探春一事。贾母说道：“既是同乡的人，很好。只是听见说那孩子到过我们家里，怎么你老爷没有提起？”王夫人道：“连我们也不知道。”贾母道：“好是好，但只道儿太远。虽然老爷在那里，倘或将来老爷调任，可不是我们孩子太单了吗？”王夫人道：“两家都是做官的，也是拿不定。或者那边还调进来，即不然，终有个叶落归根。况且老爷既在那里做官，上司已经说了，好意思不给么？想来老爷的主意定了，只是不敢做主，故遣人来回老…","so":0,"eo":0},{"surface":"贾母","text":"这里探春又气又笑又伤心，也不过自己掉泪而已。坐了一回，闷闷的走到宝玉这边来。宝玉问道：“三妹妹，我听见林妹妹死的时候，你在那里来着。我还听见说：林妹妹死的时候，远远的有音乐之声。或者他是有来历的，也未可知。”探春笑道：“那是你心里想着罢了。但只那夜却怪，不象人家鼓乐的声儿，你的话或者也是。”宝玉听了，更以为实。又想前日自己神魂飘荡之时，曾见一人，说是黛玉生不同人，死不同鬼，必是那里的仙子临凡。又想起那年唱戏做的嫦娥，飘飘艳艳，何等风致。…","so":0,"eo":0},{"surface":"贾母","text":"宝玉本想念黛玉，因此及彼，又想跟黛玉的人已经云散，更加纳闷。闷到无可如何，忽又想黛玉死的这样清楚，必是离凡返仙去了，反又欢喜。忽然听见袭人和宝钗那里讲究探春出嫁之事，宝玉听了，“啊呀”的一声，哭倒在炕上。唬得宝钗袭人都来扶起，说：“怎么了？”宝玉早哭的说不出来。定了一回子神，说道：“这日子过不得了，我姊妹们都一个一个的散了！林妹妹是成了仙去了。大姐姐呢，已经死了。这也罢了，没天天在一块儿。二姐姐碰着了一个混账不堪的东西。三妹妹又要远嫁，…","so":0,"eo":0},{"surface":"贾母","text":"那贾母又想起探春远行，虽不全备妆奁，其一应动用之物俱该预备，便把凤姐叫来，将老爷的主意告诉了一遍，叫他料理去。凤姐答应。","so":0,"eo":0}]},{"chap":101,"ctitle":"第101章 大观园月夜警幽魂 散花寺神签惊异兆","deeds":[{"surface":"贾母","text":"宝玉一面也搭讪着，找这个弄那个。凤姐道：“你先去罢，那里有个爷们等着奶奶们一块儿走的理呢。”宝玉道：“我只是嫌我这衣裳不大好，不如前年穿着老太太给的那件雀金呢好。”凤姐因怄他道：“你为什么不穿？”宝玉道：“穿着太早些。”凤姐忽然想起，自悔失言。幸亏宝钗也和王家是内亲，只是那些丫头们跟前，已经不好意思了。袭人却接着说道：“二奶奶还不知道呢，就是穿得，他也不穿了。”凤姐儿道：“这是什么原故？”袭人道：“告诉二奶奶，真真的我们这位爷行的事都是…","so":0,"eo":0},{"surface":"贾母","text":"凤姐儿看他两口儿这般恩爱缠绵，想起贾琏方才那种光景，甚实伤心，坐不住，便起身向宝钗笑道：“我和你上太太屋里去罢。”笑着出了房门，一同来见贾母。宝玉正在那里回贾母往舅舅家去。贾母点头说道：“去罢，只是少吃酒，早些回来，你身子才好些。”宝玉答应着出来，刚走到院内，又转身回来，向宝钗耳边说了几句，不知什么。宝钗笑道：“是了，你快去罢。”将宝玉催着去了。这里贾母和风姐、宝钗说了没三句话，只见秋纹进来传说：“二爷打发焙茗回来说，请二奶奶。”宝钗道…","so":0,"eo":0},{"surface":"贾母","text":"只见散花寺的姑子大了来了，给贾母请安，见过了凤姐，坐着吃茶。贾母因问他：“这一向怎么不来？”大了道：“因这几日庙中作好事，有几位诰命夫人不时在庙里起坐，所以不得空儿来，今日特来回老祖宗，明儿还有一家作好事，不知老祖宗高兴不高兴？若高兴，也去随喜随喜。”贾母便问：“做什么好事？”大了道：“前日为王大人府里不干净，见神见鬼的，偏生那太太夜间又看见去世的老爷。因此，昨日在我庙里告诉我，要在散花菩萨跟前许愿烧香，做四十九天的水陆道场，保佑家口安…","so":0,"eo":0},{"surface":"贾母","text":"看完也不甚明白。大了道：“奶奶大喜，这一签巧得很。奶奶自幼在这里长大，何曾回南京去过？如今老爷放了外任，或者接家眷来，顺便回家，奶奶可不是‘衣锦还乡’了？”一面说，一面抄了个签经交与丫头。凤姐也半疑半信的。大了摆了斋来，凤姐只动了一动，放下了要走，又给了香银。大了苦留不住，只得让他走了。凤姐回至家中，见了贾母王夫人等，问起签来，命人一解，都欢喜非常：“或者老爷果有此心，咱们走一趟也好。”凤姐儿见人人这么说，也就信了，不在话下。","so":0,"eo":0}]},{"chap":104,"ctitle":"第104章 醉金刚小鳅生大浪 痴公子馀痛触前情","deeds":[{"surface":"贾母","text":"众人说毕，举手而散，贾政然后回家。众子侄等都迎接上来。贾政迎着请贾母的安，然后众子侄俱请了贾政的安，一同进府。王夫人等已到了荣禧堂迎接。贾政先到了贾母那里拜见了，陈述些违别的话。贾母问探春消息，贾政将许嫁探春的事都禀明了，还说：“儿子起身急促，难过重阳，虽没有亲见，听见那边亲家的人来，说的极好。亲家老爷太太都说请老太太的安。还说今冬明春，大约还可调进京来。这便好了。如今闻得海疆有事，只怕那时还不能调。”贾母始则因贾政降调回来，知探春远在…","so":0,"eo":0}]},{"chap":105,"ctitle":"第105章 锦农军查抄宁国府 骢马使弹劾平安州","deeds":[{"surface":"贾母","text":"不多一会，只见进来无数番役，各门把守，本宅上下人等一步不能乱走。赵堂官便转过一副脸来，回王爷道：“请爷宣旨意，就好动手。”这些番役都撩衣奋臂，专等旨意。西平王慢慢的说道：“小王奉旨，带领锦衣府赵全来查看贾赦家产。”贾赦等听见，俱俯伏在地。王爷便站在上头说：“有旨意：贾赦交通外官，依势凌弱，辜负肤恩，有忝祖德，着革去世职。钦此。”赵堂宫一叠声叫：“拿下贾赦！其馀皆看守！”维时贾赦、贾政、贾琏、贾珍、贾蓉、贾蔷、贾芝、贾兰俱在，惟宝玉假说有…","so":0,"eo":0},{"surface":"贾母","text":"且说贾母那边女眷也摆家宴。王夫人正在那边说：“宝玉不到外头，看你老子生气。”凤姐带病哼哼卿卿的说：“我看宝玉也不是怕人，他见前头陪客的人也不少了，所以在这里照应，也是有的。倘或者爷想起里头少个人在那里照应，太太便把宝兄弟献出去，可不是好？”贾母笑道：“凤丫头病到这个分儿，这张嘴还是那么尖巧。”正说到高兴，只听见邢夫人那边的人一直声的嚷迸来说：“老太太，太太！不、不好了！多多少少的穿靴带帽的强、强盗来了！翻箱倒笼的来拿东西！”贾母等听着发…","so":0,"eo":0},{"surface":"贾母","text":"那时一屋子人拉这个扯那个，正闹得翻天覆地。又听见一叠声嚷说：“叫里头女眷们回避，王爷进来了。”宝钗、宝玉等正在没法，只见地下这些丫头婆子乱拉乱扯的时候，贾琏喘吁吁的跑进来说：“好了，好了，幸亏王爷救了我们了！”众人正要问他，贾琏见凤姐死在地下，哭着乱叫；又见老太太吓坏了，也回不过气来，更是着急。还亏了平儿将凤姐叫醒，令人抚着。老太太也苏醒了，又哭的气短神昏，躺在炕上，李纨再三宽慰。然后贾琏定神，将两王恩典说明，惟恐贾母邢夫人知道贾赦被拿…","so":0,"eo":0},{"surface":"贾母","text":"贾琏在旁窃听，不见报他的东西，心里正在疑惑。只闻二王问道：“所抄家资，内有借券，实系盘剥，究是谁行的？政老据实才好。”贾政听了，跪在地下磕头，说：“实在犯官不理家务，这些事全不知道，问犯官侄儿贾琏才知。”贾琏连忙走上，跪下禀说：“这一箱文书既在奴才屋里抄出来的，敢说不知道么？只求王爷开恩。奴才叔叔并不知道的。”两王道：“你父已经获罪，只可并案办理。你今认了，也是正理。如此，叫人将贾琏看守，馀俱散收宅内。政老，你须小心候旨，我们进内复旨去…","so":0,"eo":0}]},{"chap":106,"ctitle":"第106章 王熙凤致祸抱羞惭 贾太君祷天消祸患","deeds":[{"surface":"贾母","text":"话说贾政闻知贾母危急，即忙进去看视。见贾母惊吓气逆，王夫人、鸳鸯等唤醒回来，即用疏气安神的丸药服了，渐渐的好些，只是伤心落泪。贾政在旁劝慰，总说：“是儿子们不肖，招了祸来，累老太太受惊。若老太太宽慰些，儿子们尚可在外料理；若是老太太有什么不自在，儿子们的罪孽更重了。”贾母道：“我活了八十多岁，自作女孩儿起，到你父亲手里，都托着祖宗的福，从没有听见过这些事。如今到老了，见你们倘或受罪，叫我心里过的去吗？倒不如合上眼随你们去罢了。”说着又哭…","so":0,"eo":0},{"surface":"贾母","text":"那时天已点灯时候，贾政进去请贾母的安，见贾母略略好些。回到自己房中，埋怨贾琏夫妇不知好歹，如今闹出放账的事情，大家不好，心里很不受用。只是凤姐现在病重，况他所有的什物尽被抄抢，心内自然难受，一时也未便说他，暂且隐忍不言。一夜无话。次早贾政进内谢恩，并到北静王府西平王府两处叩谢，求二位王爷照应他哥哥侄儿。二王应许。贾政又在同寅相好处托情。","so":0,"eo":0},{"surface":"贾母","text":"幸贾母不知底细，因近日身子好些，又见贾政无事，宝玉、宝钗在旁，天天不离左右，略觉放心。素来最疼凤姐，便叫鸳鸯：“将我的体己东西拿些给凤丫头，再拿些银钱交给平儿，好好的伏侍好了凤丫头，我再慢慢的分派。”又命王夫人照看邢夫人。此时宁国府第入官，所有财产房地等项并家奴等俱已造册收尽。这里贾母命人将车接了尤氏婆媳过来。可惜赫赫宁府，只剩得他们婆媳两个并佩凤偕鸾二人，连一个下人没有。贾母指出房子一所居住，就在惜春所住的间壁，又派了婆子四人、丫头两…","so":0,"eo":0},{"surface":"贾母","text":"且说贾母见祖宗世职革去，现在子孙在监质审，邢夫人、尤氏等日夜啼哭，凤姐病在垂危，虽有宝玉、宝钗在侧，只可解劝，不能分忧，所以日夜不宁，思前想后，眼泪不干。一日傍晚，叫宝玉回去，自己扎挣坐起，叫鸳鸯等各处佛堂上香，又命自己院内焚起斗香，用拐拄着，出到院中。琥珀知是老太太拜佛，铺下大红猩毡拜垫。贾母上香跪下，磕了好些头，念了一回佛，含泪祝告天地道：“皇天菩萨在上，我贾门史氏，虔诚祷告，求菩萨慈悲。我贾门数世以来，不敢行凶霸道。我帮夫助子，虽…","so":0,"eo":0},{"surface":"贾母","text":"只见王夫人带了宝玉宝钗过来请晚安，见贾母伤悲，三人也大哭起来。宝钗更有一层苦楚：想哥哥也在外监，将来要处决，不知可能减等；公婆虽然无事，眼见家业萧条；宝玉依然疯傻，毫无志气。想到后来终身，更比贾母王夫人哭的悲痛。宝玉见宝钗如此，他也有一番悲戚，想着：“老太太年老不得安心，老爷太太见此光景，不免悲伤，众姐妹风流云散，一日少似一日。追思园中吟诗起社，何等热闹；自林妹妹一死，我郁闷到今，又有宝姐姐伴着，不便时常哭泣。况他又忧兄思母，日夜难得笑…","so":0,"eo":0},{"surface":"贾母","text":"正自不解，只见老婆子带了史侯家的两个女人进来，请了贾母的安，又向众人请安毕，便说道：“我们家的老爷、太太、姑娘打发我来说：听见府里的事，原没什么大事，不过一时受惊。恐怕老爷太太烦恼，叫我们过来告诉一声，说这里二老爷是不怕的了。我们姑娘本要自己来的，因不多几日就要出阁，所以不能来了。”贾母听了，不便道谢，说：“你回去给我问好。这是我们的家运合该如此。承你们老爷太太惦记着，改日再去道谢。你们姑娘出阁，想来姑爷是不用说的了，他们的家计如何呢？…","so":0,"eo":0}]},{"chap":107,"ctitle":"第107章 散馀资贾母明大义 复世职政老沐天恩","deeds":[{"surface":"贾母","text":"贾政听了，感激涕零，叩首不及，又叩求王爷代奏下忱。北静王道：“你该叩谢天恩，更有何奏？”贾政道：“犯官仰蒙圣恩，不加大罪，又蒙将家产给还，实在扪心惶懊。愿将祖宗遗受重禄，积馀置产，一并交官。”北静王道：“主上仁慈待下，明慎用刑，赏罚无差，如今既蒙莫大深恩，给还财产，你又何必多此一奏？”众官也说不必。贾政便谢了恩，叩谢了王爷出来，恐贾母不放心，急忙赶回。上下男女人等不知传进贾政是何吉凶，都在外头打听，一见贾政回家，都略略的放心，也不敢问。","so":0,"eo":0},{"surface":"贾母","text":"只见贾政忙忙的走到贾母跟前，将蒙圣恩宽免的事细细告诉了一遍。贾母虽则放心，只是两个世职革去，贾赦又往台站效力，贾珍又往海疆，不免又悲伤起来。邢夫人、尤氏听见这话，更哭起来。贾政便道：“老太太放心。大哥虽则台站效力，也是为国家办事，不致受苦，只要办得妥当，就可复职。珍儿正是年轻，很该出力。若不是这样，便是祖父的馀德亦不能久享。”说了些宠慰的括。贾母素来本不大喜欢贾赦，那边东府贾珍究竟隔了一层，只有邢夫人、尤氏痛哭不止。邢夫人想着：“家产一…","so":0,"eo":0},{"surface":"贾母","text":"贾母又道：“我这几年老的不成人了，总没有问过家事。如今东府里是抄了去了，房子入官不用说；你大哥那边，琏儿那里，也都抄了。咱们西府里的银库和东省地土，你知道还剩了多少？他两个起身，也得给他们几千银子才好。”贾政正是没法，听见贾母一问，心想着：“若是说明，又恐老太太着急；若不说明，不用说将来，只现在怎样办法呢？”想毕，便回道：“若老太太不问，儿子也不敢说。如今老太太既问到这里，现在琏儿也在这里，昨日儿子已查了：旧库的银子早已虚空，不但用尽，…","so":0,"eo":0},{"surface":"贾母","text":"贾母正在忧虑，只见贾赦、贾珍、贾蓉一齐进来给贾母请安。贾母看这般光景，一只手拉着贾赦，一只手拉着贾珍，便大哭起来。他两人脸上羞惭，又见贾母哭泣，都跪在地下哭着说道：“儿孙们不长进，将祖上功勋丢了，又累老太太伤心，儿孙们是死无葬身之地的了！”满屋中人看这光景，又一齐大哭起来。贾政只得劝解：“倒先要打算他两个的使用。大约在家只可住得一两日，迟则人家就不依了。”老太太含悲忍泪的说道：“你两个且各自同你们媳妇们说说话儿去罢。”又吩咐贾政道：“这…","so":0,"eo":0},{"surface":"贾母","text":"却说贾母叫邢、王二夫人同着鸳鸯等开箱倒笼，将做媳妇到如今积攒的东西都拿出来，又叫贾赦、贾政、贾珍等一一的分派。给贾赦三千两，说：“这里现有的银子你拿二千两去做你的盘费使用，留一千给大太太零用。这三千给珍儿：你只许拿一千去，留下二千给你媳妇收着。仍旧各自过日子。房子还是一处住，饭食各自吃罢。四丫头将来的亲事，还是我的事。只可怜凤丫头操了一辈子心，如今弄的精光，也给他三千两，叫他自己收着，不许叫琏儿用。如今他还病的神昏气短，叫平儿来拿去。这…","so":0,"eo":0},{"surface":"贾母","text":"宝玉已经成了家，我下剩的这些金银东西，大约还值几千银子，这是都给宝玉的了。珠儿媳妇向来孝顺我，兰儿也好，我也分给他们些。这就是我的事情完了。”贾政等见母亲加此明断分晰，俱跪下哭着说：“老太太这么大年纪，儿孙们没点孝顺，承受老祖宗这样恩典，叫儿孙们更无地自容了。”贾母道：“别瞎说了。要不闹出这个乱儿来，我还收着呢。只是现在家人太多，只有二老爷当差，留几个人就够了，你就吩咐管事的，将人叫齐了，分派妥当。各家有人就罢了。譬如那时都抄了，怎么样…","so":0,"eo":0},{"surface":"贾母","text":"贾政见贾母劳乏，求着老太太歇歇养神。贾母又道：“我所剩的东西也有限，等我死了，做结果我的使用。下剩的都给伏侍我的丫头。”贾政等听到这里，更加伤感，大家跪下：“请老太太宽怀。只愿儿子们托老太太的福，过了些时，都邀了恩眷，那时兢兢业业的治起家来，以赎前愆，奉养老太太到一百岁。”贾母道：“但愿这样才好，我死了也好见祖宗。你们别打量我是享得富贵受不得贫穷的人哪！不过这几年看着你们轰轰烈烈，我乐得都不管，说说笑笑，养身子罢了。那知道家运一败，直到…","so":0,"eo":0},{"surface":"贾母","text":"贾母正自长篇大论的说，只见丰儿慌慌张张的跑来回王夫人道：“今早我们奶奶听见外头的事，哭了一场，如今气都接不上了，平儿叫我来回太太。”丰儿没有说完，贾母听见，便问：“到底怎么样？”王夫人便代回道：“如今说是不大好。”贾母起身道：“嗳！这些冤家，竟要磨死我了。”说着，叫人扶着，要亲自看去，贾政急忙拦信住劝道：“老太太伤了好一会子心，又分派了好些事，这会子该歇歇儿了。就是孙子媳妇有什么事，叫媳妇瞧去就是了，何必老太太亲身过去呢？倘或再伤感起来…","so":0,"eo":0}]},{"chap":108,"ctitle":"第108章 强欢笑蘅芜庆生辰 死缠绵潇湘闻鬼哭","deeds":[{"surface":"贾母","text":"却说贾政先前曾将房产并大观园奏请入官，内廷不收，又无人居住，只好封锁。因园子接连尤氏、惜春住宅，太觉旷阔无人，遂将包勇罚看荒园。此时贾政理家，奉了贾母之命，将人口渐次减少，诸凡省俭，尚且不能支持。幸喜凤姐是贾母心爱的人，王夫人等虽不大喜欢，若说治家办事，尚能出力，所以内事仍交凤姐办理。但近来因被抄以后，诸事运用不来，也是每形拮据。那些房头上下人等原是宽裕惯了的，如今较往日十去其七，怎能周到？不免怨言不绝。凤姐也不敢推辞，在贾母前扶病承欢…","so":0,"eo":0},{"surface":"贾母","text":"一日，史湘云出嫁回门，来贾母这边请安。贾母提起他女婿甚好，史湘云也将那里家中平安的话说了，请老太太放心，又提起黛玉去世，不免大家落泪。贾母又想起迎春苦楚，越觉悲伤起来。史湘云解劝一回，又到各家请安问好毕，仍到贾母房中安歇。言及薛家这样人家，“被薛大哥闹的家破人亡，今年虽是缓决人犯，明年不知可能减等？”贾母道：“你还不知道呢：昨儿蟠儿媳妇死的不明白，几乎又闹出一场事来。还幸亏老佛爷有眼，叫他带来的丫头自己供出来了，那夏奶奶没的闹了，自家拦…","so":0,"eo":0},{"surface":"贾母","text":"湘云道：“我从小儿在这里长大的，这里那些人的脾气，我都知道的。这一回来了，竟都改了样子了。我打量我隔了好些时没来，他们生疏我；我细想起来，竟不是的。就是见了我，瞧他们的意思，原要象先一样的热闹，不知道怎么说说就伤起心来了，所以我坐了坐儿就到老太太这里来了。”贾母道：“如今的日子在我也罢了，他们年轻轻儿的人，还了得。我正要想个法儿，叫他们还热闹一天才好，只是打不起这个精神来。”湘云道：“我想起来了，宝姐姐不是后儿的生日吗？我多住一天，给他…","so":0,"eo":0},{"surface":"贾母","text":"次日传话出去，打发人去接迎春，又请了薛姨妈、宝琴，叫带了香菱来，又请李婶娘，不多半日，李纹、李绮都来了。宝钗本不知道，听见老太太的丫头来请，说：“薛姨太太来了，请二奶奶过去呢。”宝钗心里喜欢，便是随身衣服过去，要见他母亲。只见妹子宝琴并香菱都在这里，又见李婶娘等人也都来了，心想：“那些人必是知道我们家的事情完了，所以来问候的。”便去问了李婶娘好，见了贾母，然后与他母亲说了几句话，和李家姐妹们问好。","so":0,"eo":0},{"surface":"贾母","text":"湘云在旁说道：“太太们请都坐下，让我们姐妹们给姐姐拜寿。”宝钗听了，倒呆了一呆，回来一想：“可不是明日是我的生日吗？”便说：“姐妹们过来瞧老太太是该的，若说为我的生日，是断断不敢的。”正推让着，宝玉也来请薛姨妈、李婶娘的安。听见宝钗自己推让，他心里本早打算过宝钗生日，因家中闹得七颠八倒，也不敢在贾母处提起。今儿湘云等众人要拜寿，便喜欢道：“明日才是生日，我正要告诉老太太来。”湘云笑道：“扯臊，老太太还等你告诉？你打量这些人为什么来？是老…","so":0,"eo":0},{"surface":"贾母","text":"凤姐虽勉强说了几句有兴的话，终不似先前爽利、招人发笑。贾母心里要宝钗喜欢，故意的怄凤姐儿说话。凤姐也知贾母之意，便竭力张罗，说道：“今儿老太太喜欢些了。你看这些人好几时没有聚在一处，今儿齐全。”说着，回过头去，看见婆婆、尤氏不在这里，又缩住了口。贾母为着“齐全”两字，也想邢夫人等，叫人请去。邢夫人、尤氏、惜春等听见老太太叫，不敢不来，心内也十分不愿意、想着家业零败，偏又高兴给宝钗做生日，到底老太太偏心，便来了也是无精打彩的。贾母问起岫烟…","so":0,"eo":0},{"surface":"贾母","text":"一时摆下果酒。贾母说：“也不送到外头，今日只许咱们娘儿们乐一乐。”宝玉虽然娶过亲的人，因贾母疼爱，仍在里头打混，但不与湘云、宝琴等同席，便在贾母身旁设着一个坐儿，他替宝钗轮流敬酒。贾母道：“如今且坐下，大家喝酒。到挨晚儿再到各处行礼去。若如今行起礼来，大家又闹规矩，把我的兴头打回去，就没趣了。”宝钗便依言坐下。贾母又向众人道：“咱们今儿索性洒脱些，各留一两个人伺候。我叫鸳鸯带了彩云、莺儿、袭人、平儿等在后间去也喝一钟酒。”鸳鸯等说：“我…","so":0,"eo":0},{"surface":"贾母","text":"宝玉听了，不待再说，就出席到后间去找鸳鸯，说：“老太太要行令，叫姐姐去呢。”鸳鸯道：“小爷，让我们舒舒服服的喝一钟罢。何苦来，又来搅什么？”宝玉道：“当真老太太说的，叫你去呢。与我什么相干？”鸳鸯没法，说道：“你们只管喝，我去了就来。”便到贾母那边。老太太道：“你来了么？这里要行令呢。”鸳鸯道：“听见宝二爷说老太太叫我，才来的。不知老太太要行什么令儿？”贾母道：“那文的怪闷的慌，武的又不好，你倒是想个新鲜玩意儿才好。”鸳鸯想了想道：“如…","so":0,"eo":0}]},{"chap":109,"ctitle":"第109章 候芳魂五儿承错爱 还孽债迎女返真元","deeds":[{"surface":"贾母","text":"袭人也本没有睡，听见他们两个说话，即忙上来倒茶。只见老太太那边打发小丫头来问：“宝二爷昨夜睡的安顿么？若安顿，早早的同二奶奶梳洗了就过去。”袭人道：“你去回老太太，说：‘宝玉昨夜很安顿，回来就过来。’”小丫头去了。宝钗连忙梳洗了，莺儿、袭人等跟着，先到贾母那里行了礼。便到王夫人那边起，至凤姐，都让过了。仍到贾母处，见他母亲也过来了。大家问起：“宝玉晚上好么？”宝钗便说：“回去就睡了，没有什么。”众人放心，又说些闲话。","so":0,"eo":0},{"surface":"贾母","text":"只见小丫头进来，说：“二姑奶奶要回去了。听见说，孙姑爷那边人来，到大太太那里说了些话，大太太叫人到四姑娘那边说，不必留了，让他去罢。如今二姑奶奶在大太太那边哭呢，大约就过来辞老太太。”贾母众人听了，心中好不自在，都说：“二姑娘这么一个人，为什么命里遭着这样的人！一辈子不能出头，这可怎么好呢。”说着，迎春进来，泪痕满面。因是宝钗的好日子，只得含着泪，辞了众人要回去。贾母知道他的苦处，也不便强留，只说道：“你回去也罢了，但只不用伤心。碰着这…","so":0,"eo":0},{"surface":"贾母","text":"独有薛姨妈辞了贾母，到宝钗那里，说道：“你哥哥是今年过了，直要等到皇恩大赦的时候，减了等，才好赎罪。这几年叫我孤苦伶仃，怎么处！我想要给你二哥哥完婚，你想想好不好？”宝钗道：“妈妈是因为大哥哥娶了亲，唬怕了的，所以把二哥哥的事也疑惑起来。据我说，很该办。邢姑娘是妈妈知道的，如今在这里也很苦。娶了去，虽说咱们穷，究竟比他傍人门户好多着呢。”薛姨妈道：“你得便的时候，就去回明老太太，说我家没人，就要择日子了。”宝钗道：“妈妈只管和二哥哥商量…","so":0,"eo":0},{"surface":"贾母","text":"且说贾母两日高兴，略吃多了些，这晚有些不受用；第二天，便觉着胸口饱闷。鸳鸯等要回贾政，贾母不叫言语，说：“我这两日嘴馋些，吃多了点子。我饿一顿就好了，你们快别吵嚷。”于是鸳鸯等并没有告诉人。这日晚间，宝玉回到自己屋里，见宝钗自贾母王夫人处才请了晚安回来。宝玉想着早起之事，未免赧颜抱惭，宝钗看他这样的，也晓得是没意思的光景。因想着他是个痴情人，要治他的这个病，少不得仍以痴情治之。想了想，便问宝玉道：“你今夜还在外头睡去罢咧？”宝玉自觉没趣…","so":0,"eo":0},{"surface":"贾母","text":"且说次日宝玉、宝钗同起，宝玉梳洗了，先过贾母这边来。这里贾母因疼宝玉，又想宝钗孝顺，忽然想起一件东西来。便叫鸳鸯开了箱了，取出祖上所遗的一个汉玉，虽不及宝玉他那块玉石，挂在身上却也希罕。鸳鸯找出来递与贾母，便说道：“这件东西，我好象从没见的。老太太这些年还记得这样清楚，说是那一箱什么匣于里装着，我按着老太太的话一拿就拿出来了。老太太这会子叫拿出来做什么？”贾母道：“你那里知道？这块玉还是祖爷爷给我们老太爷，老太爷疼我，临出嫁的时候叫了我…","so":0,"eo":0},{"surface":"贾母","text":"自此，贾母两日不迸饮食，胸口仍是膨闷，觉得头晕目眩，咳嗽。邢、王二夫人、凤姐等请安，见贾母精神尚好，不过叫人告诉贾政，立刻来请了安。贾政出来，即请大夫看脉。不多一时，大夫来诊了脉，说是有年纪的人，停了些饮食、感冒些风寒，略消导发散些就好了。开了方子，贾政看了，知是寻常药品，命人煎好进服。以后贾政早晚进来请安。一连三日，不见稍减。贾政又命贾琏打听好大夫，“快去请来瞧老太太的病。咱们家常请的几个大夫，我瞧着不怎么好，所以叫你去。”贾琏想了一…","so":0,"eo":0},{"surface":"贾母","text":"且说贾母病时，合宅女眷无日不来请安。一日，众人都在那里，只见看园内腰门的老婆子进来回说：“园里的栊翠庵的妙师父知道老太太病了，特来请安。”众人道：“他不常过来，今儿特来，你们快请进来。”凤姐走到床前回了贾母。岫烟是妙玉的旧日相识，先走出去接他。只见妙玉头带妙常冠，身上穿一件月白素绸袄儿，外罩一件水田青缎镶边长背心，拴着秋香色的丝绦，腰下系一条淡墨画的白绫裙，手执麈尾念珠，跟着一个侍儿，飘飘拽拽的走来。岫烟见了问好，说是：“在园内住的时候…","so":0,"eo":0},{"surface":"贾母","text":"一面说着，已到贾母房中。众人见了，都问了好。妙玉走到贾母床前问候，说了几句套话。贾母便道：“你是个女菩萨，你瞧瞧我的病可好的了好不了？”妙玉道：“老太太这样慈善的人，寿数正有呢。一时感冒，吃几帖药，想来也就好了。有年纪的人，只要宽心些。”贾母道：“我倒不为这些。我是极爱寻快乐的。如今这病也不觉怎么着，只是胸隔饱闷。刚才大夫说是气恼所致。你是知道的，谁敢给我气受？这不是那大夫脉理平常么？我和琏儿说了，还是头一个大夫说感冒伤食的是，明儿还请…","so":0,"eo":0}]},{"chap":110,"ctitle":"第110章 史太君寿终归地府 王凤姐力诎失人心","deeds":[{"surface":"贾母","text":"却说贾母坐起说道：“我到你们家已经六十多年了，从年轻的时候到老来，福也享尽了。自你们老爷起，儿子孙子也都算是好的了。就是宝玉呢，我疼了他一场，”说到那里，拿眼满地下瞅着，王夫人便推宝玉走到床前。贾母从被窝里伸出手来拉着宝玉，道：“我的儿，你要争气才好！”宝玉嘴里答应，心里一酸，那眼泪便要流下来，又不敢哭，只得站着。听贾母说道：“我想再见一个重孙子，我就安心了。我的兰儿在那里呢？”李纨也推贾兰上去。贾母放了宝玉，拉着贾兰道：“你母亲是要孝…","so":0,"eo":0},{"surface":"贾母","text":"贾母又瞧了一瞧宝钗，叹了口气，只见脸上发红。贾政知是回光返照，即忙进上参汤。贾母的牙关已经紧了，合了一回眼，又睁着满屋里瞧了一瞧。王夫人、宝钗上去，轻轻扶着，邢夫人、凤姐等便忙穿衣。地下婆子们已将床安设停当，铺了被褥。听见贾母喉间略一响动，脸变笑容，竟是去了。享年八十三岁。众婆子疾忙停床。","so":0,"eo":0},{"surface":"贾母","text":"鸳鸯见凤姐这样慌张，又不好叫他回来，心想：“他头里作事何等爽利周到，如今怎么掣肘的这个样儿。我看这两三天连一点头脑都没有，不是老太太白疼了他了吗！”那里知邢夫人一听贾政的话，正合着将来家计艰难的心，巴不得留一点子作个收局。况且老太太的事原是长房作主。贾赦虽不在家，贾政又是拘泥的人，有件事便说：“请大太太的主意。”邢夫人素知凤姐手脚大，贾琏的闹鬼，所以死拿住不放松。鸳鸯只道已将这项银两交了出去了，故见凤姐掣肘如此，却疑为不肯用心，便在贾母…","so":0,"eo":0},{"surface":"贾母","text":"且说史湘云因他女婿病着，贾母死后，只来了一次，屈指算是后日送殡，不能不去。又见他女婿的病已成痨症，暂且不妨，只得坐夜前一日过来。想起贾母素日疼他；又想到自己命苦，刚配了一个才貌双全的女婿，情性又好，偏偏的得了冤孽症候，不过捱日子罢了。于是更加悲痛，直哭了半夜。鸳鸯等再三劝慰不止。宝玉瞅着也不胜悲伤，又不好上前去劝。见他淡汝素服，不敷脂粉，更比未出嫁的时候犹胜几分。回头又看宝琴等也都是淡素妆饰，丰韵嫣然。独看到宝钗浑身挂孝，那一种雅致，比…","so":0,"eo":0}]},{"chap":111,"ctitle":"第111章 鸳鸯女殉主登太虚 狗彘奴欺天招伙盗","deeds":[{"surface":"贾母","text":"这里琥珀辞了灵，听邢、王二夫人分派看家的人，想着去问鸳鸯明日怎样坐车，便在贾母的那间屋里找了一遍。不见，又找到套间里头。刚到门口，见门儿掩着；从门缝里望里看时，只见灯光半明半灭的，影影绰绰。心里害怕，又不听见屋里有什么动静，便走回来说道：“这蹄子跑到那里去了？”劈头见了珍珠，说：“你见鸳鸯姐姐来着没有？”珍珠道：“我也找他，太太们等他说话呢。必在套间里睡着了罢？”琥珀道：“我瞧了，屋里没有。那灯也没人夹蜡花儿，漆黑怪怕的，我没进去。如今…","so":0,"eo":0},{"surface":"贾母","text":"贾政因他为贾母而死，要了香来，上了三炷，作了个揖，说：“他是殉葬的人，不可作丫头论，你们小一辈的都该行个礼儿。”宝玉听了，喜不自胜，走来恭恭敬敬磕了几个头。贾琏想他素日的好处，也要上来行礼，被邢夫人说道：“有了一个爷们就是了，别折受的他不得超生。”贾琏就不便过来了。宝钗听着这话，好不自在，便说道：“我原不该给他行礼，但只老太太去世，咱们都有未了之事，不敢胡为。他肯替咱们尽孝，咱们也该托托他。好好的替咱们伏侍老太太西去，也少尽一点子心哪。…","so":0,"eo":0},{"surface":"贾母","text":"却说周瑞的干儿子何三，去年贾珍管事之时，因他和鲍二打架，被贾珍打了一顿，撵在外头，终日在赌场过日。近知贾母死了，必有些事情领办，岂知探了几天的信，一些也没有想头，便嗳声叹气的回到堵场中，闷闷的坐下。那些人便说道：“老三，你怎么不下来捞本儿了吗？”何三道：“倒想要捞一捞呢，就只没有钱么。”那些人道：“你到你们周大太爷那里去了几日，府里的钱，你也不知弄了多少来，又来和我们装穷儿了。”何三道：“你们还说呢。他们的金银不知有几百万，只藏着不用。…","so":0,"eo":0},{"surface":"贾母","text":"且说包勇自被贾政吆喝，派去看园，贾母的事出来，也忙了，不曾派他差使。他也不理会，总是自做自吃，闷来睡一觉，醒时便在园里耍刀弄棍，倒也无拘无束。那日贾母一早出殡，他虽知道，因没有派他差使，他任意闲游。只见一个女尼带了一个道婆，来到园内腰门那里扣门。包勇走来，说道：“女师父那里去？”道婆道：“今日听得老太太的事完了，不见四姑娘送殡，想必是在家看家。恐他寂寞，我们师父来瞧他一瞧。”包勇道：“主子都不在家，园门是我看的，请你们回去罢。要来呢，等…","so":0,"eo":0}]},{"chap":112,"ctitle":"第112章 活冤孽妙姑遭大劫 死雠仇赵妾赴冥曹","deeds":[{"surface":"贾母","text":"且说贾琏回到铁槛寺，将到家中查点了上夜的人，开了失单报去的话，回了贾政。贾政道：“怎么开的？”贾琏便将琥珀记得的数目单于呈出，并说：“上头元妃赐的东西，已经注明；还有那人家不大有的东西，不便开上。等侄儿脱了孝，出去托人细细的缉访，少不得弄出来的。”贾政听了合意，就点头不言。贾琏进内见了邢，王二夫人，商量着：“劝老爷早些回家才好呢，不然都是乱麻似的。”邢夫人道：“可不是，我们在这里也是惊心吊胆。”贾琏道：“这是我们不敢说的，还是太太的主意…","so":0,"eo":0}]},{"chap":114,"ctitle":"第114章 王熙凤历幻返金陵 甄应嘉蒙恩还玉阙","deeds":[{"surface":"贾母","text":"两人正说着，门上的进来回道：“江南甄老爷来了。”贾政便问道：“甄老爷进京为什么？”那人道：“奴才也打听过了，说是蒙圣恩起复了。”贾政道：“不用说了，快请罢。”那人出去，请了进来。那甄老爷即是甄宝玉之父，名叫甄应嘉，表字友忠，也是金陵人氏，功勋之后。原与贾府有亲，素来走动的。因前年挂误革了职，动了家产，今遇主上眷念功臣，赐还世职，行取来京陛见。知道贾母新丧，特备祭礼，择日到寄灵的地方拜奠，所以先来拜望。","so":0,"eo":0}]},{"chap":117,"ctitle":"第117章 阻超凡佳人双护玉 欣聚党恶子独承家","deeds":[{"surface":"贾母","text":"贾琏又说了几句，才出来，叫了众家人来，交代清楚。写了书，收拾了行装，平儿等不免叮咛了好些话。只有巧姐儿惨伤的了不得。贾琏又欲托王仁照应，巧姐到底不愿意，听见外头托了芸、蔷二人，心里更不受用，嘴里却说不出来。只得送了他父亲，谨谨慎慎的随着平儿过日子。丰儿、小红因凤姐去世，告假的告假，告病的告病。平儿意欲接了家中一个姑娘来，一则给巧姐作伴，二则可以带量他。遍想无人。只有喜鸾、四姐儿是贾母旧日钟爱的，偏偏四姐儿新近出了嫁了，喜鸾也有了人家儿，…","so":0,"eo":0}]},{"chap":118,"ctitle":"第118章 记微嫌舅兄欺弱女 惊谜语妻妾谏痴人","deeds":[{"surface":"贾母","text":"且言贾政扶了贾母灵柩，一路南行，因遇着班师的兵将船只过境，河道拥挤，不能速行，在道实在心焦。幸喜遇见了海疆的官员，闻得镇海统制钦召回京，想来探春一定回家，略略解些烦心。只打听不出起程的日期，心里又是烦躁。想到盘费算来不敷。不得已写书一封，差人到赖尚荣任上借银五百，叫人沿途迎来，应付需用。过了数日，贾政的船才行得十数里，那家人回来，迎上船只，将赖尚荣的禀启呈上。书内告了多少苦处，备上白银五十两。贾政看了大怒，即命家人：“立刻送还！将原书发…","so":0,"eo":0},{"surface":"贾母","text":"到了八月初三这一日，正是贾母的冥寿。宝玉早晨过来磕了头，便回去，仍到静室中去了。饭后，宝钗袭人等都和姊妹们跟着邢、王二夫人在前面屋里说闲话儿。宝玉自在静室，冥心危坐。忽见莺儿端了一盘瓜果进来，说：“太太叫人送来给二爷吃的，这是老太太的克什。”宝玉站起来答应了，复又坐下，便道：“搁在那里罢。”莺儿一面放下瓜果，一面悄悄向宝玉道：“太太那里夸二爷呢。”宝玉微笑。莺儿又道：“太太说了，二爷这一用功，明儿进场中了出来，明年再中了进士，作了官，老…","so":0,"eo":0}]},{"chap":120,"ctitle":"第120章 甄士隐详说太虚情 贾雨村归结红楼梦","deeds":[{"surface":"贾母","text":"且说贾政扶贾母灵柩，贾蓉送了秦氏、凤姐、鸳鸯的棺木到了金陵，先安了葬。贾蓉自送黛玉的灵，也去安葬。贾政料理坟墓的事。一日，接到家书，一行一行的看到宝玉、贾兰得中，心里自是喜欢；后来看到宝玉走失，复又烦恼。只得赶忙回来。在道儿上又闻得有恩赦的旨意，又接着家书，果然赦罪复职，更是喜欢，便日夜趱行。","so":0,"eo":0},{"surface":"贾母","text":"那日已是迎娶吉期，袭人本不是那一种泼辣人，委委屈屈的上轿而去，心里另想到那里再作打算。岂知过了门，见那蒋家办事，极其认真，全都按着正配的规矩。一进了门，丫头仆妇，都称“奶奶”。袭人此时欲要死在这里，又恐害了人家，辜负了一番好意。那夜原是哭着不肯俯就的，那姑爷却极柔情曲意的承顺。到了第二天开箱，这姑爷看见一条猩红汗巾，方知是宝玉的丫头。原来当初只知是贾母的侍儿，益想不到是袭人。此时蒋玉函念着宝玉待他的旧情，倒觉满心惶愧，更加周旋；又故意将…","so":0,"eo":0}]}],"relations":[{"id":"358a04ae-01ab-458b-b359-228921fed51f","code":"母子","sc":3,"ec":81,"status":"ENDED","other":"宝玉","dir":"out"},{"id":"b75cb783-4e4d-41c7-9fc0-2549a3756325","code":"母子","sc":3,"ec":110,"status":"ENDED","other":"贾赦","dir":"out"},{"id":"dd6710f0-f512-426d-8516-813443fc0be4","code":"母子","sc":3,"ec":110,"status":"ENDED","other":"贾政","dir":"out"},{"id":"a0b2b113-f308-4a17-b766-94d773755dc2","code":"母子","sc":3,"ec":null,"status":"ACTIVE","other":"贾珠","dir":"out"},{"id":"da3b8d6c-8a96-4cff-b276-3f5e17f42dea","code":"主仆","sc":3,"ec":108,"status":"ACTIVE","other":"袭人","dir":"out"},{"id":"726a891b-4eb1-491f-815a-7ad3e066c28c","code":"主仆","sc":16,"ec":71,"status":"ACTIVE","other":"赖大","dir":"out"},{"id":"e2eef441-fd60-459d-a982-eb1e35d7a5d1","code":"主仆","sc":19,"ec":92,"status":"ACTIVE","other":"宝玉","dir":"out"},{"id":"4103b62a-29e3-4318-be1f-72b3ea967cb6","code":"主仆","sc":29,"ec":112,"status":"ACTIVE","other":"鸳鸯","dir":"out"},{"id":"ea6af5a3-a8fd-44ba-a9a9-90436db85b26","code":"夫妻","sc":33,"ec":90,"status":"ENDED" tus":"ACTIVE","other":"鹦哥","dir":"out"}]},{"id":"a415f326-3daa-41d3-b189-a1294e550b10","name":"五儿","type":"PERSON","mentionCount":29,"chapterCount":12,"firstChapter":60,"lastChapter":118,"aliases":["五丫头","柳五儿"],"density":"moderate","timeline":[{"chap":60,"ctitle":"第60章 茉莉粉替去蔷薇硝 玫瑰露引出茯苓霜","deeds":[{"surface":"五儿","text":"这里柳家的见人散了，忙出来和芳官说：“前日那话说了没有？”芳官道：“说了。等一两天，再提这事。偏那赵不死的又和我闹了一场。前日那玫瑰露，姐姐吃了没有？他到底可好些？”柳家的道：“可不都吃了。他爱的什么儿似的，又不好合你再要。”芳官道：“不值什么，等我再要些来给他就是了。”原来柳家的有个女孩儿，今年十六岁，虽是厨役之女，却生得人物与平、袭、鸳、紫相类。因他排行第五，便叫他五儿。只是素有弱疾，故没得差使。近因柳家的见宝玉房中丫鬟，差轻人多，…","so":0,"eo":0},{"surface":"五儿","text":"前言少述，且说当下芳官回至怡红院，回复了宝玉。这里宝玉正为赵姨娘吵闹，心中不悦，说又不是，不说又不是。只等吵完了，打听着探春劝了他去后，方又劝了芳官一阵，因使他到厨房说话去。今见他回来，又说还要些玫瑰露给柳五儿吃去，宝玉忙道：“有着呢，我又不大吃，你都给他吃去罢。”说着，命袭人取出来。见瓶中也不多了，遂连瓶给了芳官。芳官便自携了瓶与他去。正值柳家的带进他女儿来散闷，在那边畸角子一带地方逛了一回，便回到厨房内，正吃茶歇着呢。见芳官拿了一个…","so":0,"eo":0},{"surface":"五儿","text":"五儿便送出来，因见无人，又拉着芳官说道：“我的话到底说了没有？”芳官笑道：“难道哄你不成？我听见屋里正经还少两个人的窝儿，并没补上：一个是小红的，琏二奶奶要去了，还没给人来；一个是坠儿的，也没补。如今要你一个也不算过分。皆因平儿每每和袭人说：‘凡有动人动钱的事，得挨的且挨一日。如今三姑娘正要拿人作筏子呢。’连他屋里的事都驳了两三件，如今正要寻我们屋里的事没寻着，何苦来往网里碰去？倘或说些话驳了，那时候老了，倒难再回转。且等冷一冷儿，老太…","so":0,"eo":0},{"surface":"五儿","text":"单表五儿回来，和他娘深谢芳官之情。他娘因说：“再不承望得了这些东西。虽然是个尊贵物儿，却是吃多了也动热，竟把这个倒些送个人去，也是大情。”五儿问：“送谁？”他娘道：“送你姑舅哥哥一点儿，他那热病，也想这些东西吃。我倒半盏给他去。”五儿听了，半日没言语，随他妈倒了半盏去，将剩的连瓶便放在家伙厨内。五儿冷笑道：“依我说，竟不给他也罢了。倘或有人盘问起来，倒又是一场是非。”他娘道：“那里怕起这些来，还了得。我们辛辛苦苦的，里头赚些东西，也是应…","so":0,"eo":0},{"surface":"五儿","text":"可巧又有家中几个小厮—和他侄儿素日相好的伴儿，走来看他的病。内中有一个叫钱槐，是赵姨娘之内亲。他父母现在库上管账，他本身又派跟贾环上学。因他手头宽裕，尚未娶亲，素日看上柳家的五儿标致，一心和父母说了，娶他为妻。也曾央中保媒人，再四求告。柳家的父母却也情愿，争奈五儿执意不从，虽未明言，却已中止，他父母未敢应允。近日又想往园内去，越发将此事丢开，只等三五年后放出时，自向外边择婿了。钱槐家中人见如此，也就罢了，争奈钱槐不得五儿，心中又气又愧，…","so":0,"eo":0}]},{"chap":61,"ctitle":"第61章 投鼠忌器宝王瞒赃 判冤决狱平儿行权","deeds":[{"surface":"五儿","text":"话说那柳家的，听了这小么儿一席话，笑道：“好猴儿崽子！你亲婶子找野老儿去了，你不多得一个叔叔吗，有什么疑的？别叫我把你头上的杩子盖揪下来，还不开门让我进去呢。”那小厮且不推门，又拉着笑道：“好婶子，你这一进去，好歹偷几个杏儿出来赏我吃。我这里老等。你要忘了，日后半夜三更打酒买油的，我不给你老人家开门，也不答应你，随你干叫去。”柳氏啐道：“发了昏的！今年还比往年？把这些东西部分给了众妈妈了。一个个的不象抓破了脸的，人打树底下一过，两眼就象…","so":0,"eo":0},{"surface":"五儿","text":"柳家的打发他女儿喝了一回汤，吃了半碗粥，又将茯苓霜一节说了。五儿听罢，便心下要分些赠芳官，遂用纸另包了一半，趁黄昏人稀之时，自己花遮柳隐的来找芳官，且喜无人盘问。一径到了怡红院门首，不好进去，只在一簇玫瑰花前站立，远远的望着。有一盏茶时候，可巧春燕出来，忙上前叫住。春燕不知是那一个，到跟前方看真切，因问：“做什么？”五儿笑道：“你叫出芳官来，我和他说话。”春燕悄笑道：“姐姐太性急了。横竖等十来日就来了，只管找他做什么？方才使了他往前头去…","so":0,"eo":0},{"surface":"五儿","text":"林之孝家的听他词钝意虚，又因近日玉钏儿说那边正房内失落了东西，几个丫头对赖，没主儿，心下便起了疑。可巧小蝉、莲花儿和几个媳妇子走来见了这事，便说道：“林奶奶倒要审审他。这两日他往这里头跑的不象，鬼鬼祟祟的，不知干些什么事。”小蝉又道：“正是。昨日玉钏儿姐姐说：‘太太耳房里的柜子开了，少了好些零碎东西。’琏二奶奶打发平姑娘和玉钏儿姐姐要些玫瑰露，谁知也少了一罐子，不是找还不知道呢！”莲花儿笑道：“这我没听见。今日我倒看见一个露瓶子。”林之…","so":0,"eo":0},{"surface":"五儿","text":"那时李纨正因兰儿病了，不理事务，只命去见探春。探春已归房。人回进去，丫鬟们都在院内纳凉，探春在内盥沐，只有侍书回进去，半日出来说：“姑娘知道了，叫你们找平儿回二奶奶去。”林之孝家的只得领出来，到凤姐那边，先找着平儿进去回了凤姐。凤姐方才睡下，听见此事，便吩咐：“将他娘打四十板子，撵出去，永不许进二门。把五儿打四十板子，立刻交给庄子上，或卖或配人。”平儿听了出来，依言吩咐了林之孝家的。五儿吓得哭哭啼啼，给平儿跪着，细诉芳官之事。平儿道：“…","so":0,"eo":0},{"surface":"五儿","text":"这里五儿被人软禁起来，一步不敢多走。又兼众媳妇也有劝他说：“不该做这没行止的事。”也有抱怨说：“正经更还坐不上来，又弄个贼来给我们看守。倘或眼不见，寻了死，或逃走了，都是我们的不是。”又有素日一于与柳家不睦的人，见了这般十分趁愿，都来奚落嘲戏他。这五儿心内又气又委屈，竟无处可诉！且本来怯弱有病，这一夜思茶无茶，思水无水，思睡无衾枕，呜呜咽咽直哭了一夜。谁知和他母女不和的那些人，巴不得一时就撵他出门去。生恐次日有变，大家先起个清早，都悄悄…","so":0,"eo":0},{"surface":"五儿","text":"于是大家商议妥贴，平儿带了他两个并芳官来至上夜房中，叫了五儿，将茯苓霜一节也悄悄的教他说系芳官给的，五儿感激不尽。平儿带他们来至自己这边，已见林之孝家的带领了几个媳妇，押解着柳家的等够多时了。林之孝家的又向平儿说：“今日一早押了他来，怕园里没有人伺候早饭，我暂且将秦显的女人派了去伺候姑娘们的饭呢。”平儿道：“秦显的女人是谁？我不大相熟啊。”林之孝家的道：“他是园里南角子上夜的，白日里没什么事，所以姑娘不认识。高高儿的孤拐，大大的眼睛，最…","so":0,"eo":0}]},{"chap":63,"ctitle":"第63章 寿怡红群芳开夜宴 死金丹独艳理亲丧","deeds":[{"surface":"五儿","text":"话说宝玉回至房中洗手，因和袭人商议：“晚间吃酒，大家取乐，不可拘泥。如今吃什么好？早说给他们备办去。”袭人笑道：“你放心，我和晴雯、麝月、秋纹四个人，每人五钱银子，共是二两；芳官、碧痕、春燕、四儿四个人，每人三钱银子，他们告假的不算：共是三两二钱银子，早已交给了柳嫂子，预备四十碟果子。我和平儿说了，已经抬了一罐好绍兴酒藏在那边了。我们八个人单替你做生日。”宝玉听了，喜的忙说：“他们是那里的钱？不该叫他们出才是。”晴雯道：“他们没钱，难道…","so":0,"eo":0}]},{"chap":70,"ctitle":"第70章 林黛玉重建桃花社 史湘云偶填柳絮词","deeds":[{"surface":"五儿","text":"原来这一向因凤姐儿病了，李纨探春料理家务，不得闲暇。接着过年过节，许多杂事，竟将诗社搁起。如今仲春天气，虽得了工夫，争奈宝玉因柳湘莲遁迹空门，又闻得尤三姐自刎，尤二姐被凤姐逼死，又兼柳五儿自那夜监禁之后，病越重了：连连接接，闲愁胡恨，一重不了一重添，弄的情色若痴，语言常乱，似染怔仲之病。慌的袭人等又不敢回贾母，只百般逗他玩笑。","so":0,"eo":0}]},{"chap":77,"ctitle":"第77章 俏丫鬟抱屈夭风流 美优怜斩情归水月","deeds":[{"surface":"五儿","text":"正闹着，只听窗外有人问：“这晴雯姐姐在这里住呢不是？”那媳妇子也吓了一跳，连忙放了宝玉。这宝玉已经吓怔了，听不出声音。外边晴雯听见他嫂子缠磨宝玉，又急又臊又气，一阵虚火上攻，早昏晕过去。那媳妇连忙答应着，出来看，不是别人，却是柳五儿和他母亲两个，抱着一个包袱。柳家的拿着几吊钱，悄悄的问那媳妇道：“这是里头袭姑娘叫拿出来给你们姑娘的。他在那屋里呢？”那媳妇儿笑道：“就是这个屋子，那里还有屋子？”","so":0,"eo":0},{"surface":"五儿","text":"那柳家的领着五儿刚进门来，只见一个人影儿往屋里一闪。柳家的素知这媳妇子不妥，只打量是他的私人。看见晴雯睡着了，连忙放下，带着五儿便往外走。谁知五儿眼尖，早已见是宝玉，便问他母亲道：“头里不是袭人姐姐那里悄悄儿的找宝二爷呢吗？”柳家的道：“嗳哟，可是忘了。方才老宋妈说：‘见宝二爷出角门来了。门上还有人等着，要关园门呢。’”因回头问那媳妇儿。那媳妇儿自己心虚，便道：“宝二爷那里肯到我们这屋里来？”柳家的听说，便要走。这宝玉一则怕关了门，二则…","so":0,"eo":0},{"surface":"五儿","text":"却说宝玉跑进角门，才把心放下来，还是突突乱跳。又怕五儿关在外头，眼巴巴瞅着他母女也进来了。远远听见里边嬷嬷们正查人，若再迟一步，就关了园门了。宝玉进入园中，且喜无人知道。到了自己房里，告诉袭人，只说在薛姨妈家去的，也就罢了。一时铺床，袭人不得不问：“今日怎么睡？”宝玉道：“不管怎么睡罢了。”原来这一二年来，袭人因王夫人看重了他，越发自要尊重，凡背人之处或夜晚之间，总不与宝玉狎昵，较先小时反倒疏远了。虽无大事办理，然一应针线，并宝玉及诸小…","so":0,"eo":0}]},{"chap":87,"ctitle":"第87章 感秋声抚琴悲往事 坐禅寂走火入邪魔","deeds":[{"surface":"五儿","text":"紫鹃走来，看见这样光景，想着必是因刚才说起南边北边的话来，一时触着黛玉的心事了。便问道：“姑娘们来说了半天话，想来姑娘又劳了神了。刚才我叫雪雁告诉厨房里，给姑娘作了一碗火肉白菜汤，加了一点儿虾米儿，配了点青笋紫菜，姑娘想着好么？”黛玉道：“也罢了。”紫鹃道：“还熬了一点江米粥。”黛玉点点头儿，又说道：“那粥得你们两个自己熬了，不用他们厨房里熬才是。”紫鹃道：“我也怕厨房里弄的不干净，我们自己熬呢。就是那汤，我也告诉雪雁合柳嫂儿说了，要弄…","so":0,"eo":0}]},{"chap":92,"ctitle":"第92章 评女传巧姐慕贤良 玩母珠贾政参聚散","deeds":[{"surface":"五儿","text":"巧姐道：“我还听见我妈妈说：我们家的小红，头里是二叔叔那里的，我妈妈要了来，还没有补上人呢。我妈妈想着要把什么柳家的五儿补上，不知二叔叔要不要。”宝玉听了更喜欢，笑着道：“你听你妈妈的话！要补谁就补谁罢咧，又问什么要不要呢。”因又向贾母笑道：“我瞧大妞妞这个小模样儿，又有这个聪明儿，只怕将来比凤姐姐还强呢，又比他认的字。”贾母道：“女孩儿家认得字也好，只是女工针黹倒是要紧的。”巧姐儿道：“我也跟着刘妈妈学着做呢。什么扎花吻，拉锁子例，我…","so":0,"eo":0}]},{"chap":101,"ctitle":"第101章 大观园月夜警幽魂 散花寺神签惊异兆","deeds":[{"surface":"五儿","text":"宝玉一面也搭讪着，找这个弄那个。凤姐道：“你先去罢，那里有个爷们等着奶奶们一块儿走的理呢。”宝玉道：“我只是嫌我这衣裳不大好，不如前年穿着老太太给的那件雀金呢好。”凤姐因怄他道：“你为什么不穿？”宝玉道：“穿着太早些。”凤姐忽然想起，自悔失言。幸亏宝钗也和王家是内亲，只是那些丫头们跟前，已经不好意思了。袭人却接着说道：“二奶奶还不知道呢，就是穿得，他也不穿了。”凤姐儿道：“这是什么原故？”袭人道：“告诉二奶奶，真真的我们这位爷行的事都是…","so":0,"eo":0}]},{"chap":108,"ctitle":"第108章 强欢笑蘅芜庆生辰 死缠绵潇湘闻鬼哭","deeds":[{"surface":"五儿","text":"贾母道：“这令完了，咱们喝两杯，吃饭罢。”回头一看，见宝玉还没进来，便问道：“宝玉那里去了，还不来？”鸳鸯道：“换衣裳去了。”贾母道：“谁跟了去的？”那莺儿便上来回道：“我看见二爷出去，我叫袭人姐姐跟了去了。”贾母王夫人才放心。等了一回，王夫人叫人去找。小丫头到了新房子里，只见五儿在那里插蜡。小丫头便问：“宝二爷那里去了？”五儿道：“在老太太那边喝酒呢。”小丫头道：“我打老太太那里来，太太叫我来找，岂有在那里倒叫我来找的呢。”五儿道：“…","so":0,"eo":0}]},{"chap":109,"ctitle":"第109章 候芳魂五儿承错爱 还孽债迎女返真元","deeds":[{"surface":"五儿","text":"却说宝玉晚间归房，因想：“咋夜黛玉竟不入梦，或者他已经成仙，所以不肯来见我这种浊人，也是有的；不然，就是我的性儿太急了，也未可知。”便想了个主意，向宝钗说道：“我昨夜偶然在外头睡着，似乎比在屋里睡的安稳些，今日起来，心里也觉清净。我的意思，还要在外头睡两夜，只怕你们又来拦我。”宝钗听了，明知早晨他嘴里念诗自然是为黛玉的事了，想来他那个呆性是不能劝的，倒好叫他睡两夜，索性自己死了心也罢了，况兼昨夜听他睡的倒也安静。便道：“好没来由，你只管…","so":0,"eo":0},{"surface":"五儿","text":"那知宝玉要睡越睡不着，见他两个人在那里打铺，忽然想起那年袭人不在家时，晴雯、麝月两个人服事，夜间麝月出去，睛雯要唬他，因为没穿衣服着了凉，后来，还是从这个病上死的。想到这里，一心移在晴雯身上去了。忽又想起凤姐说五儿给晴雯“脱了个影儿”，因将想睛雯的心又移在五儿身上。自己假装睡着，偷偷儿的看那五儿，越瞧越象晴雯，不觉呆性复发。听了听里间已无声息，知是睡了；但不知麝月睡了没有，便故意叫了两声，却不答应。五儿听见了宝玉叫人，便问道：“二爷要什…","so":0,"eo":0},{"surface":"五儿","text":"那五儿自从芳官去后，也无心进来了。后来听说凤姐叫他进来伏侍宝玉，竟比宝玉盼他进来的心还急。不想进来以后，见宝钗、袭人一般尊贵稳重，看着心里实在敬慕；又见宝玉疯疯傻傻，不似先前的丰致；又听见王夫人为女孩子们和宝玉玩笑都撵了，所以把女儿的柔情和素日的痴心，一概搁起。怎奈这位呆爷今晚把他当作晴雯，只管爱惜起来。那五儿早已羞得两颊红潮，又不敢大声说话，只得轻轻的说道：“二爷，漱口啊。”宝玉笑着接了茶在手中，也不知道漱了没有，便笑嘻嘻的问道：“你…","so":0,"eo":0},{"surface":"五儿","text":"此时五儿心中也不知宝玉是怎么个意思，便说道：“夜深了，二爷睡罢，别紧着坐着，看凉着了。刚才奶奶和袭人姐姐怎么嘱咐来！”宝玉道：“我不凉。”说到这里，忽然想起五儿没穿着衣裳，就怕他也象晴雯着了凉，便问道：“你为什么不穿上衣裳就过来？”五儿道：“爷叫的紧，那里有尽着穿衣裳的空儿？要知道说这半天话儿时，我也穿上了。”宝玉听了，连忙把自己盖的一件月白绫子绵袄儿揭起来递给五儿，叫他披上。五儿只不肯接，说：“二爷盖着罢，我不凉。我凉，我有我的衣裳。…","so":0,"eo":0},{"surface":"五儿","text":"却说五儿被宝玉鬼混了半夜，又兼宝钗咳嗽，自己怀着鬼胎，生怕宝钗听见了，也是思前想后，一夜无眠。次日一早起来，见宝玉尚自昏昏睡着，便轻轻儿的收拾了屋子。那里麝月已醒，便道：“你怎么这么早起来了？你难道一夜没睡吗？”五儿听这话又似麝月知道了的光景，便只是讪笑，也不答言。一时宝钗袭人也都起来，开了门。见宝玉尚睡，却也纳闷：“怎么在外头两夜睡的倒这么安稳呢？”及宝玉醒来，见众人都起来了，自己连忙爬起。揉着眼睛，细想昨夜又不曾梦见，可是“仙凡路隔…","so":0,"eo":0},{"surface":"五儿","text":"宝钗见他发怔，虽知他为黛玉之事，却也定不得梦不梦，只是瞅的自己倒不好意思的，便道：“你昨夜可遇见仙了么？”宝玉听了，只道昨晚的话宝钗听见了，笑着勉强说道：“这是那里的话？”那五儿听了这一句，越发心虚起来，又不好说的，只得且看宝钗的光景。只见宝钗又笑着问五儿道：“你听见二爷睡梦里和人说话来着么？”宝玉听了，自己坐不住，搭讪着走开了。五儿把脸飞红，只得含糊道：“前半夜倒说了几句，我也没听真。什么‘担了虚名’，又什么‘没打正经主意’，我也不懂…","so":0,"eo":0},{"surface":"五儿","text":"且说贾母两日高兴，略吃多了些，这晚有些不受用；第二天，便觉着胸口饱闷。鸳鸯等要回贾政，贾母不叫言语，说：“我这两日嘴馋些，吃多了点子。我饿一顿就好了，你们快别吵嚷。”于是鸳鸯等并没有告诉人。这日晚间，宝玉回到自己屋里，见宝钗自贾母王夫人处才请了晚安回来。宝玉想着早起之事，未免赧颜抱惭，宝钗看他这样的，也晓得是没意思的光景。因想着他是个痴情人，要治他的这个病，少不得仍以痴情治之。想了想，便问宝玉道：“你今夜还在外头睡去罢咧？”宝玉自觉没趣…","so":0,"eo":0}]},{"chap":116,"ctitle":"第116章 得通灵幻境悟仙缘 送慈柩故乡全孝道","deeds":[{"surface":"五儿","text":"一日，恰遇紫鹃送了林黛玉的灵柩回来，闷坐自己屋里啼哭，想着：“宝玉无情，见他林妹妹的灵柩回去，并不伤心落泪；见我这样痛哭，也不来劝慰，反瞅着我笑。这样负心的人，从前都是花言巧语来哄着我们。前夜亏我想得开，不然几乎又上了他的当！只是一 的行事叫人感念。”平儿笑了一笑说：“你回来坐着罢。”婆子道：“我还有事，改日再过来瞧姑娘罢。”说着走了。平儿回来，回覆了凤姐。不在话下。","so":0,"eo":0}]},{"chap":94,"ctitle":"第94章 宴海棠贾母赏花妖 失宝玉通灵知奇祸","deeds":[{"surface":"丰儿","text":"凤姐病中也听见宝玉失玉，知道王夫人过来，料躲不住，便扶了丰儿来到园里。正值王夫人起身要走，凤姐娇怯怯的说：“请太太安。”宝玉等过来问了凤姐好。王夫人因说道：“你也听见了么？这可不是奇事吗？刚才眼错不见就丢了，再找不着。你去想想，打老太太那边的丫头起，至你们平儿，谁的手不稳，谁的心促狭，我要回了老太太，认真的查出来才好。不然，是断了宝玉的命根子了！”凤姐回道：“咱们家人多手杂，自古说的，‘知人知面不知心’，那里保的住谁是好的？但只一吵嚷，…","so":0,"eo":0}]},{"chap":101,"ctitle":"第101章 大观园月夜警幽魂 散花寺神签惊异兆","deeds":[{"surface":"丰儿","text":"却说凤姐回至房中，见贾琏尚未回来，便分派那管办探春行李妆奁事的一干人。那天有黄昏以后，因忽然想起探春来，要瞧瞧他去，便叫丰儿与两个丫头跟着，头里一个丫头打着灯笼。走出门来，见月光已上，照耀如水，凤姐便命：“打灯笼的回去罢。”因而走至茶房窗下，听见里面有人嘁嘁喳喳的，又似哭，又似笑，又似议论什么的。凤姐知道不过是家下婆子们又不知搬什么是非，心内大不受用，便命小红：“进去装做无心的样子，细细打听着，用话套出原委来。”小红答应着去了。","so":0,"eo":0},{"surface":"丰儿","text":"凤姐只带着丰儿来至园门前，门尚未关，只虚虚的掩着。于是主仆二人方推门进去。只见园中月色比外面更觉明朗，满地下重重树影，沓无人声，甚是凄凉寂静。刚欲往秋爽斋这条路来，只听唿唿的一声风过，吹的那树枝上落叶，满园中唰喇喇的作响，枝梢上吱娄娄的发哨，将那些寒鸦宿鸟都惊飞起来。凤姐吃了酒，被风一吹，只觉身上发噤。丰儿后面也把头一缩，说：“好冷！”凤姐也掌不住，便叫丰儿：“快回去把那件银鼠坎肩儿拿来，我在三姑娘那里等着。”丰儿巴不得一声，也要回去穿…","so":0,"eo":0},{"surface":"丰儿","text":"凤姐刚举步走了不远，只觉身后哧哧似有闻嗅之声，不觉头发森然直竖起来。由不得回头一看，只见黑油油一个东西在后面伸着鼻子闻他呢，那两只眼睛恰似灯光一般。凤姐吓的魂不附体，不觉失声的了一声，却是一只大狗。那狗抽头回身，拖着个扫帚尾巴，一气跑上大土山上，方站住了，回身犹向凤姐拱爪儿。凤姐此时肉跳心惊，急急的向秋爽斋来。将已来至门口，方转过山子，只见迎面有一个人影儿一恍。凤姐心中疑惑，还想着必是那一房的丫头，便问：“是谁？”问了两声，并没有人出来…","so":0,"eo":0}]},{"chap":107,"ctitle":"第107章 散馀资贾母明大义 复世职政老沐天恩","deeds":[{"surface":"丰儿","text":"贾母正自长篇大论的说，只见丰儿慌慌张张的跑来回王夫人道：“今早我们奶奶听见外头的事，哭了一场，如今气都接不上了，平儿叫我来回太太。”丰儿没有说完，贾母听见，便问：“到底怎么样？”王夫人便代回道：“如今说是不大好。”贾母起身道：“嗳！这些冤家，竟要磨死我了。”说着，叫人扶着，要亲自看去，贾政急忙拦信住劝道：“老太太伤了好一会子心，又分派了好些事，这会子该歇歇儿了。就是孙子媳妇有什么事，叫媳妇瞧去就是了，何必老太太亲身过去呢？倘或再伤感起来…","so":0,"eo":0}]},{"chap":111,"ctitle":"第111章 鸳鸯女殉主登太虚 狗彘奴欺天招伙盗","deeds":[{"surface":"丰儿","text":"话说凤姐听了小丫头的话，又气又急又伤心，不觉吐了一口血，便昏晕过去，坐在地下。平儿急来扶住，忙叫了人来搀扶着，慢慢的送到自己房中，将凤姐轻轻的安放在炕上，立刻叫小红斟上一杯开水送到凤姐唇边。凤姐呷了一口，昏迷仍睡。秋桐过来略瞧了一瞧，便走开了，平儿也不叫他。只见丰儿在旁站着，平儿便说：“快去回明二位太太。”于是丰儿将凤姐吐血不能照应的话回了邢、王二夫人。邢夫人打量凤姐推病藏躲，因这时女亲都在内里，也不好说别的，心里却不全信，只说：“叫他…","so":0,"eo":0}]},{"chap":112,"ctitle":"第112章 活冤孽妙姑遭大劫 死雠仇赵妾赴冥曹","deeds":[{"surface":"丰儿","text":"贾琏叫人检点偷剩下的东西，只有些衣服、尺头、钱箱未动，馀者都没有了。贾琏心里更加着急，想着外头的棚杠银、厨房的钱，都没有付给，明儿拿什么还呢？便呆想了一会。只见琥珀等进去，哭了一番，见箱柜开着，所有的东西怎能记忆，便胡乱猜想，虚拟了一张失单，命人即送到文武衙门。贾琏复又派人上夜。凤姐、惜春各自回房。贾琏不敢在家安歇，也不及埋怨凤姐，竟自骑马赶出城外去了。这里凤姐又恐惜春短见，打发丰儿过去安慰。","so":0,"eo":0}]},{"chap":113,"ctitle":"第113章 忏宿冤凤姐托村妪 释旧憾情婢感痴郎","deeds":[{"surface":"丰儿","text":"小丫头子说着，凤姐听见，便叫：“平儿，你来。人家好心来瞧，不可冷淡了他。你去请了刘老老进来，我和他说说话儿。”平儿只得出来请刘老老这里坐。凤姐刚要合眼，又见一个男人一个女人走向炕前，就象要上炕的。凤姐急忙便叫平儿，说：“那里来了一个男人，跑到这里来了！”连叫了两声，只见丰儿小红赶来，说：“奶奶要什么？”凤姐睁眼一瞧，不见有人，心里明白，不肯说出来，便问丰儿：“平儿这东西那里去了？”丰儿道：“不是奶奶叫去请刘老老去了么？”凤姐定了一会神，…","so":0,"eo":0},{"surface":"丰儿","text":"正说着，又听凤姐叫呢。平儿及到床前，凤姐又不言语了。平儿正问丰儿，贾琏进来，向炕上一瞧，也不言语，走到里间，气哼哼的坐下。只有秋桐跟了进去，倒了茶，殷勤一回，不知嘁嘁喳喳的说些什么。回来，贾琏叫平儿来问道：“奶奶不吃药么？”平儿道：“不吃药怎么样呢？”贾琏道：“我知道么？你拿柜子上的钥匙来罢。”平儿见贾琏有气，又不敢问，只得出来凤姐耳边说了一声。凤姐不言语。平儿便将一个匣子搁在贾琏那里就走。","so":0,"eo":0},{"surface":"丰儿","text":"贾琏道：“有鬼叫你吗？你搁着叫谁拿呢？”平儿忍气打开，取了钥匙，开了柜子，便问道：“拿什么？”贾琏道：“咱们有什么吗？”平儿气的哭道：“有话明说，人死了也愿意！”贾琏道：“这还要说么？头里的事是你们闹的；如今老太太的还短了四五千银子，老爷叫我拿公中的地账弄银子，你说有么？外头拉的账不开发，使得么？谁叫我应这个名儿！只好把老太太给我的东西折变去罢了，你不依么？”平儿听了，一句不言语，将柜里东西搬出。只见小红过来，说：“平姐姐快走！姐姐不好…","so":0,"eo":0},{"surface":"丰儿","text":"这里凤姐愈加不好，丰儿等便大哭起来。巧姐听见赶来。刘老老也急忙走到炕前，嘴里念佛，捣了些鬼，果然凤姐好些。一时王夫人听了丫头的信，也过来了，先见凤姐安静些，心下略放心。见了刘老老，便说：“刘老老，你好？什么时候来的？”刘老老便说“请安”，也不及说别的，只言凤姐的病，讲究了半天。彩云进来说：“老爷请太太呢。”王夫人叮咛了平儿几句话，便过去了。凤姐闹了一回，此时又觉清楚些，见刘老老在这里，心里信他求神祷告，便把丰儿等支开，叫刘老老坐在床前，…","so":0,"eo":0}]},{"chap":117,"ctitle":"第117章 阻超凡佳人双护玉 欣聚党恶子独承家","deeds":[{"surface":"丰儿","text":"贾琏又说了几句，才出来，叫了众家人来，交代清楚。写了书，收拾了行装，平儿等不免叮咛了好些话。只有巧姐儿惨伤的了不得。贾琏又欲托王仁照应，巧姐到底不愿意，听见外头托了芸、蔷二人，心里更不受用，嘴里却说不出来。只得送了他父亲，谨谨慎慎的随着平儿过日子。丰儿、小红因凤姐去世，告假的告假，告病的告病。平儿意欲接了家中一个姑娘来，一则给巧姐作伴，二则可以带量他。遍想无人。只有喜鸾、四姐儿是贾母旧日钟爱的，偏偏四姐儿新近出了嫁了，喜鸾也有了人家儿，…","so":0,"eo":0}]}],"relations":[{"id":"a4ef84e5-a704-4b50-b905-029c5aa82c84","code":"主仆","sc":14,"ec":113,"status":"ACTIVE","other":"凤姐","dir":"in"},{"id":"6182f3c8-ed69-43a5-af9f-33a7abe76046","code":"主仆","sc":117,"ec":null,"status":"ACTIVE","other":"贾琏","dir":"in"}]},{"id":"797b0e87-8921-472f-b627-c9aaa8e3774c","name":"周姨娘","type":"PERSON","mentionCount":9,"chapterCount":6,"firstChapter":25,"lastChapter":113,"aliases":[],"density":"sparse","timeline":[{"chap":25,"ctitle":"第25章 魇魔法叔嫂逢五鬼 通灵玉蒙蔽遇双真","deeds":[{"surface":"周姨娘","text":"黛玉听了，笑道：“你们听听，这是吃了他一点子茶叶，就使唤起人来了。”凤姐笑道：“你既吃了我们家的茶，怎么还不给我们家作媳妇儿？”众人都大笑起来。黛玉涨红了脸，回过头去，一声儿不言语。宝钗笑道：“二嫂子的诙谐真是好的。”黛玉道：“什么诙谐！不过是贫嘴贱舌的讨人厌罢了！”说着又啐了一口。凤姐笑道：“你给我们家做了媳妇，还亏负你么？”指着宝玉道：“你瞧瞧人物儿配不上？门第儿配不上？根基儿家私儿配不上？那一点儿玷辱你？”黛玉起身便走。宝钗叫道：…","so":0,"eo":0}]},{"chap":35,"ctitle":"第35章 白玉钏亲尝莲叶羹 黄金莺巧结梅花络","deeds":[{"surface":"周姨娘","text":"话说宝钗分明听见黛玉克薄他，因惦记着母亲哥哥，并不回头，一径去了。这里黛玉仍旧立于花阴之下，远远的却向怡红院内望着。只见李纨、迎春、探春、惜春并丫鬟人等，都向怡红院内去过之后，一起一起的散尽了，只不见凤姐儿来。心里自己盘算说道：“他怎么不来瞧瞧宝玉呢？便是有事缠住了，他必定也是要来打个花胡哨，讨老太太、太太的好儿才是呢。今儿这早晚不来，必有原故。”一面猜疑，一面抬头再看时，只见花花簇簇一群人，又向恰红院内来了。定睛看时，却是贾母搭着凤姐…","so":0,"eo":0},{"surface":"周姨娘","text":"少顷出至园外，王夫人恐贾母乏了，便欲让至上房内坐，贾母也觉脚酸，便点头依允。王未人便命丫头忙先去铺设坐位。那时赵姨娘推病，只有周姨娘与那老婆丫头们忙着打帘子，立靠背，铺褥子。贾母扶着凤姐儿进来，与薛姨妈分宾主坐了，宝钗、湘云坐在下面。王夫人亲自捧了茶来，奉与贾母，李宫裁捧与薛姨妈。贾母向王夫人道：“让他们小妯娌伏侍罢，在那里坐下，好说话儿。”王夫人方向一张小机子上坐下，便吩咐凤姐儿道：“老太太的饭放在这里，添了东西来。”凤姐儿答应出去，…","so":0,"eo":0}]},{"chap":36,"ctitle":"第36章 绣鸳鸯梦兆绛芸轩 识分定情悟梨香院","deeds":[{"surface":"周姨娘","text":"王夫人又问道：“正要问你：如今赵姨娘、周姨娘的月例多少？”凤姐道：“那是定例，每人二两。赵姨娘有环兄弟的二两，共是四两，另外四串钱。”王夫人道：“月月可都按数给他们？”凤姐见问得奇，忙道：“怎么不按数给呢！”王夫人道：“前儿恍惚听见有人抱怨，说短了一串钱，什么原故？”凤姐忙笑道：“姨娘们的丫头月例，原是人各一吊钱，从旧年他们外头商量的，姨娘们每位丫头，分例减半，人各五百钱。每位两个丫头，所以短了一吊钱。这事其实不在我手里，我倒乐得给他们…","so":0,"eo":0},{"surface":"周姨娘","text":"薛姨妈笑道：“你们只听凤丫头的嘴，倒象倒了核桃车子似的。账也清楚，理也公道。”凤姐笑道：“姑妈，难道我说错了吗？”薛姨妈笑道：“说的何尝错，只是你慢着些儿说不省力些？”凤姐才要笑，忙又忍住了，听王夫人示下。王夫人想了半日，向凤姐道：“明儿挑一个丫头送给老太太使唤，补袭人，把袭人的一分裁了。把我每月的月例，二十两银子里拿出二两银子一吊钱来，给袭人去。以后凡事有赵姨娘、周姨娘的，也有袭人的，只是袭人的这一分，都从我的分例上匀出来，不必动官中…","so":0,"eo":0}]},{"chap":60,"ctitle":"第60章 茉莉粉替去蔷薇硝 玫瑰露引出茯苓霜","deeds":[{"surface":"周姨娘","text":"正没开交，谁知晴雯早遣春燕回了探春。当下尤氏、李纨、探春三人带着平儿与众媳妇走来，忙忙把四个喝住。问起原故来，赵姨娘气的瞪着眼、粗了筋，一五一十说个不清。尤、李两个不答言，只喝禁他四人。探春便叹气说道：“这是什么大事，姨娘太肯动气了。我正有一句话，要请姨娘商议，怪道丫头们说不知在那里，原来在这里生气呢。姨娘快同我来。”尤氏、李纨都笑说：“请姨娘到厅上来，咱们商量。”赵姨娘无法，只好同他三人出来，口内犹说长说短。探春便说：“那些小丫头子们…","so":0,"eo":0}]},{"chap":112,"ctitle":"第112章 活冤孽妙姑遭大劫 死雠仇赵妾赴冥曹","deeds":[{"surface":"周姨娘","text":"都起来正要走时，只见赵姨娘还爬在地下不起。周姨娘打量他还哭，便去拉他。岂知赵姨娘满嘴白沫，眼睛直竖，把舌头吐出，反把家人唬了一跳。贾环过来乱嚷。赵姨娘醒来说道：“我是不回去的，跟着老太太回 function renderList() {
  const el = document.getElementById("list");
  el.innerHTML = "";
  for (const w of DATA.works) {
    const g = document.createElement("div");
    g.className = "work-group";
    const t = document.createElement("div");
    t.className = "work-title";
    t.textContent = w.title;
    g.appendChild(t);
    for (const e of w.entities) {
      const d = document.createElement("div");
      d.className = "ent-item";
      d.dataset.id = e.id;
      d.innerHTML =
        '<span class="dot ' + e.density + '"></span>' +
        '<span class="nm">' + e.name + '</span>' +
        '<span class="cnt">' + e.mentionCount + '</span>';
      d.onclick = () => select(e);
      g.appendChild(d);
    }
    el.appendChild(g);
  }
}

function select(entity) {
  document.querySelectorAll(".ent-item").forEach((n) => {
    n.classList.toggle("active", n.dataset.id === entity.id);
  });
  render(entity);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/** 把段落文本里命中实体的片段包成 <mark>。 */
function highlight(deed, target) {
  const t = esc(deed.text);
  const raw = esc(deed.surface);
  if (!raw) return t;
  // 只高亮第一次出现，避免同一段多处命名把版面刷花
  const i = t.indexOf(raw);
  if (i < 0) return t;
  return t.slice(0, i) + "<mark>" + raw + "</mark>" + t.slice(i + raw.length);
}

  h += "<span>跨 <b>" + e.chapterCount + "</b> 回</span>";

    h += "<span>首次 <b>第 " + e.firstChapter + " 回</b></span>";

  }
  h += "<span>关系 <b>" + e.relations.length + "</b> 条</span>";
  h += "</div>";
  if (e.aliases.length) {
    h += '<div class="aliases">别名 ' + e.aliases.map((a) => "<span>" + esc(a) + "</span>").join("") + "</div>";

  } else if (e.density === "moderate") {

  } else {
    h += '<div class="timeline">';
    for (const g of e.timeline) {
      h += '<div class="chap-block">';
      h += '<div class="chap-title">第 ' + g.chap + ' 回 <span class="n">' + g.deeds.length + " 处</span></div>";
      for (const d of g.deeds) {
        h += '<div class="deed">' + highlight(d, e.name) + "</div>";
      }
      h += "</div>";
    }
    h += "</div>";
  }

  // —— 关系 ——
  h += '<h3 class="section">关系</h3>';
  if (e.relations.length === 0) {
    h += '<p style="color:var(--faint);font-size:13px">该实体暂无已解析出的关系。</p>';
  } else {
    h += '<table class="rel"><thead><tr><th>关系</th><th>对方</th><th>生效回次</th><th>状态</th></tr></thead><tbody>';
    for (const r of e.relations) {
      const range = r.ec !== null
        ? "第 " + r.sc + "–" + r.ec + " 回"
        : "第 " + r.sc + " 回起";
      const st = r.status === "ENDED"
        ? '<span class="status-ended">已终止</span>'
        : '<span class="status-active">持续</span>';
      h += "<tr><td class=\"rc\">" + esc(r.code) + "</td><td>" + esc(r.other) +
           "</td><td class=\"range\">" + range + "</td><td>" + st + "</td></tr>";
    }
    h += "</tbody></table>";
  }

  h += '<div class="footer-note">';
  h += "事迹时间线取自 <code>entity_mentions</code> → <code>paragraphs</code> → <code>chapters.ordinal</code>，按回号排序；";
  h += "关系取自 <code>relationships</code>，回次区间来自 <code>start_chapter</code> / <code>end_chapter</code>。";
  h += "<br>两者均为库内既有事实，此页面不含任何模型生成内容 —— 因此可复现、可对账。";
  h += "</div>";

  c.innerHTML = h;
  c.scrollTop = 0;
}

boot();
</script>
</body>
</html>
