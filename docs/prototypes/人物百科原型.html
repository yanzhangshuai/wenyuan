听见丫头们混说，便吓唬着要打，所以…","so":0,"eo":0}]},{"chap":104,"ctitle":"第104章 醉金刚小鳅生大浪 痴公子馀痛触前情","deeds":[{"surface":"宝玉","text":"不料贾芸自从那日给凤姐送礼不收，不好意思进来，也不常到荣府。那荣府的门上原看着主子的行事，叫谁走动才有些体面，一时来了他便进去通报；若主子不大理了，不论本家亲戚，他一概不回，支回去就完事。那日贾芸到府，说：“给琏二爷请安。”门上的说：“二爷不在家，等回来我们替回罢。”贾芸欲要说“请二奶奶的安”，又恐门上厌烦，只得回家。又被倪家母女催逼着，说：“二爷常说府上不论那个衙门，说一声儿谁敢不依。如今还是府里的一家儿，又不为什么大事，这个情还讨不…","so":0,"eo":0},{"surface":"宝玉","text":"贾政回到自己屋内，王夫人等见过，宝玉贾琏替另拜见。贾政见了宝玉果然比起身之时脸面丰满，倒觉安静，独不知他心里糊涂，所以心甚喜欢，不以降调为念，心想幸亏老太太办理的好。又见宝钗沉厚更胜先时，兰儿文雅俊秀，便喜形于色。独见环儿仍是先前，究不甚钟爱。歇息了半天，忽然想起：“为何今日短了一人？”王夫人知是想着黛玉，前因家书未报，今日又刚到家，正是喜欢，不便直告，只说是病着。岂知宝玉的心里已如刀搅，因父亲到家，只得把持心性伺候。王夫人设筵接风，子…","so":0,"eo":0},{"surface":"宝玉","text":"只说宝玉因昨日贾政问起黛玉，王夫人答以有病，他便暗里伤心，直待贾政命他回去，一路上已滴了好些眼泪。回到房中，见宝钗和袭人等说话，他便独坐外间纳闷。宝钗叫袭人送过茶去，知他必是怕老爷查问工课，所以如此，只得过来安慰。宝玉便借此过去向宝钗说：“你今夜先睡，我要定定神。这时更不如从前了，三言倒忘两语，老爷瞧着不好。你先睡，叫袭人陪我略坐坐。”宝钗不便强他，点头应允。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉出来便轻轻和袭人说，央他：“把紫鹃叫来，有话问他。但是紫鹃见了我，脸上总是有气，须得你去解劝开了再来才好。”袭人道：“你说要定神，我倒喜欢，怎么又定到这上头夫了？有话你明儿问不得？”宝玉道：“我就是今晚得闲，明日倘或老爷叫干什么，便没空儿了。好姐姐，你快去叫他来。”袭人道：“他不是二奶奶叫是不来的。”宝玉道：“所以得你去说明了才好。”袭人道：“叫我说什么？”宝玉道：“你还不知道我的心和他的心么？都为的是林姑娘。你说我并不是负心，我如…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，麝月出来说：“二奶奶说，天已四更了，请二爷进去睡罢。袭人姐姐必是说高了兴了，忘了时候儿了。”袭人听了，道：“可不是该睡了。有话明儿再说罢。”宝玉无奈，只得进去，又向袭人耳边道：“明儿好歹别忘了。”袭人笑道：“知道了。”麝月抹着脸笑道：“你们两个又闹鬼儿了。为什么不和二奶奶说明了，就到袭人那边睡去？由着你们说一夜，我们也不管。”宝玉摆手道：“不用言语。”袭人恨道：“小蹄子儿，你又嚼舌根，看我明儿撕你的嘴！”回头对宝玉道：“这不是你…","so":0,"eo":0},{"surface":"宝玉","text":"那夜宝玉无眠，到了次日，还想这事。只听得外头传进话来，说：“众亲朋因老爷回家，都要送戏接风。老爷再四推辞，说‘不必唱戏，竟在家里备了水酒，倒请亲朋过来大家谈谈’。于是定了后儿摆席请人，所以进来告诉。”","so":0,"eo":0}]},{"chap":105,"ctitle":"第105章 锦农军查抄宁国府 骢马使弹劾平安州","deeds":[{"surface":"宝玉","text":"不多一会，只见进来无数番役，各门把守，本宅上下人等一步不能乱走。赵堂官便转过一副脸来，回王爷道：“请爷宣旨意，就好动手。”这些番役都撩衣奋臂，专等旨意。西平王慢慢的说道：“小王奉旨，带领锦衣府赵全来查看贾赦家产。”贾赦等听见，俱俯伏在地。王爷便站在上头说：“有旨意：贾赦交通外官，依势凌弱，辜负肤恩，有忝祖德，着革去世职。钦此。”赵堂宫一叠声叫：“拿下贾赦！其馀皆看守！”维时贾赦、贾政、贾琏、贾珍、贾蓉、贾蔷、贾芝、贾兰俱在，惟宝玉假说有…","so":0,"eo":0},{"surface":"宝玉","text":"里头那些查抄的人，听得北静王到，俱一齐出来。及闻赵堂官走了，大家没趣，只得侍立听候。北静王便拣选两个诚实司官并十来个老年番役，馀者一概逐出。西平王便说：“我正和老赵生气，幸得王爷到来降旨；不然，这里很吃大亏。”北静王说：“我在朝内听见王爷奉旨查抄贾宅，我甚放心，谅这里不致荼毒，不料老赵这么混账。但不知现在政老及宝玉在那里？里面不知闹到怎么样了？”众人回禀：“贾政等在下房看守着，里面已抄的乱腾腾了。”北静王便吩咐司员：“快将贾政带来问话。…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾母那边女眷也摆家宴。王夫人正在那边说：“宝玉不到外头，看你老子生气。”凤姐带病哼哼卿卿的说：“我看宝玉也不是怕人，他见前头陪客的人也不少了，所以在这里照应，也是有的。倘或者爷想起里头少个人在那里照应，太太便把宝兄弟献出去，可不是好？”贾母笑道：“凤丫头病到这个分儿，这张嘴还是那么尖巧。”正说到高兴，只听见邢夫人那边的人一直声的嚷迸来说：“老太太，太太！不、不好了！多多少少的穿靴带帽的强、强盗来了！翻箱倒笼的来拿东西！”贾母等听着发…","so":0,"eo":0},{"surface":"宝玉","text":"那时一屋子人拉这个扯那个，正闹得翻天覆地。又听见一叠声嚷说：“叫里头女眷们回避，王爷进来了。”宝钗、宝玉等正在没法，只见地下这些丫头婆子乱拉乱扯的时候，贾琏喘吁吁的跑进来说：“好了，好了，幸亏王爷救了我们了！”众人正要问他，贾琏见凤姐死在地下，哭着乱叫；又见老太太吓坏了，也回不过气来，更是着急。还亏了平儿将凤姐叫醒，令人抚着。老太太也苏醒了，又哭的气短神昏，躺在炕上，李纨再三宽慰。然后贾琏定神，将两王恩典说明，惟恐贾母邢夫人知道贾赦被拿…","so":0,"eo":0},{"surface":"宝玉","text":"贾琏在旁窃听，不见报他的东西，心里正在疑惑。只闻二王问道：“所抄家资，内有借券，实系盘剥，究是谁行的？政老据实才好。”贾政听了，跪在地下磕头，说：“实在犯官不理家务，这些事全不知道，问犯官侄儿贾琏才知。”贾琏连忙走上，跪下禀说：“这一箱文书既在奴才屋里抄出来的，敢说不知道么？只求王爷开恩。奴才叔叔并不知道的。”两王道：“你父已经获罪，只可并案办理。你今认了，也是正理。如此，叫人将贾琏看守，馀俱散收宅内。政老，你须小心候旨，我们进内复旨去…","so":0,"eo":0}]},{"chap":106,"ctitle":"第106章 王熙凤致祸抱羞惭 贾太君祷天消祸患","deeds":[{"surface":"宝玉","text":"贾政连连叹气，想道：“我祖父勤劳王事，立下功勋，得了两个世职，如今两房犯事，都革去了。我瞧这些子侄没一个长进的。老天哪，老天哪！我贾家何至一败如此！我虽蒙圣恩格外垂慈，给还家产，那两处食用自应归并一处，叫我一人那里支撑的往？方才琏儿所说，更加诧异，说不但库上无银，而且尚有亏空，这几年竟是虚名在外。只恨我自己为什么糊涂若此？倘或我珠儿在世，尚有膀臂；宝玉虽大，更是无用之物。”想到那里不觉泪满衣襟。又想：“老太太若大年纪，儿子们并没奉养一日…","so":0,"eo":0},{"surface":"宝玉","text":"幸贾母不知底细，因近日身子好些，又见贾政无事，宝玉、宝钗在旁，天天不离左右，略觉放心。素来最疼凤姐，便叫鸳鸯：“将我的体己东西拿些给凤丫头，再拿些银钱交给平儿，好好的伏侍好了凤丫头，我再慢慢的分派。”又命王夫人照看邢夫人。此时宁国府第入官，所有财产房地等项并家奴等俱已造册收尽。这里贾母命人将车接了尤氏婆媳过来。可惜赫赫宁府，只剩得他们婆媳两个并佩凤偕鸾二人，连一个下人没有。贾母指出房子一所居住，就在惜春所住的间壁，又派了婆子四人、丫头两…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾母见祖宗世职革去，现在子孙在监质审，邢夫人、尤氏等日夜啼哭，凤姐病在垂危，虽有宝玉、宝钗在侧，只可解劝，不能分忧，所以日夜不宁，思前想后，眼泪不干。一日傍晚，叫宝玉回去，自己扎挣坐起，叫鸳鸯等各处佛堂上香，又命自己院内焚起斗香，用拐拄着，出到院中。琥珀知是老太太拜佛，铺下大红猩毡拜垫。贾母上香跪下，磕了好些头，念了一回佛，含泪祝告天地道：“皇天菩萨在上，我贾门史氏，虔诚祷告，求菩萨慈悲。我贾门数世以来，不敢行凶霸道。我帮夫助子，虽…","so":0,"eo":0},{"surface":"宝玉","text":"只见王夫人带了宝玉宝钗过来请晚安，见贾母伤悲，三人也大哭起来。宝钗更有一层苦楚：想哥哥也在外监，将来要处决，不知可能减等；公婆虽然无事，眼见家业萧条；宝玉依然疯傻，毫无志气。想到后来终身，更比贾母王夫人哭的悲痛。宝玉见宝钗如此，他也有一番悲戚，想着：“老太太年老不得安心，老爷太太见此光景，不免悲伤，众姐妹风流云散，一日少似一日。追思园中吟诗起社，何等热闹；自林妹妹一死，我郁闷到今，又有宝姐姐伴着，不便时常哭泣。况他又忧兄思母，日夜难得笑…","so":0,"eo":0},{"surface":"宝玉","text":"正自不解，只见老婆子带了史侯家的两个女人进来，请了贾母的安，又向众人请安毕，便说道：“我们家的老爷、太太、姑娘打发我来说：听见府里的事，原没什么大事，不过一时受惊。恐怕老爷太太烦恼，叫我们过来告诉一声，说这里二老爷是不怕的了。我们姑娘本要自己来的，因不多几日就要出阁，所以不能来了。”贾母听了，不便道谢，说：“你回去给我问好。这是我们的家运合该如此。承你们老爷太太惦记着，改日再去道谢。你们姑娘出阁，想来姑爷是不用说的了，他们的家计如何呢？…","so":0,"eo":0}]},{"chap":107,"ctitle":"第107章 散馀资贾母明大义 复世职政老沐天恩","deeds":[{"surface":"宝玉","text":"宝玉已经成了家，我下剩的这些金银东西，大约还值几千银子，这是都给宝玉的了。珠儿媳妇向来孝顺我，兰儿也好，我也分给他们些。这就是我的事情完了。”贾政等见母亲加此明断分晰，俱跪下哭着说：“老太太这么大年纪，儿孙们没点孝顺，承受老祖宗这样恩典，叫儿孙们更无地自容了。”贾母道：“别瞎说了。要不闹出这个乱儿来，我还收着呢。只是现在家人太多，只有二老爷当差，留几个人就够了，你就吩咐管事的，将人叫齐了，分派妥当。各家有人就罢了。譬如那时都抄了，怎么样…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉是从来没有经过这大风浪的，心下只知安乐，不知忧患的人，如今碰来碰去，都是哭泣的事，所以他竞比傻子尤甚，见人哭他就哭。凤姐看见众人忧闷，反倒勉强说几句宽慰贾母的话，求着：“请老太太、太太回去，我略好些过来磕头。”说着，将头仰起。贾母叫平儿：“好生服侍。短什么，到我那里要去。”说着，带了王夫人将要回到自己房中，只听见两三处哭声。贾母听着，实在不忍，便叫王夫人散去，叫宝玉：“去见你大爷大哥，送一送就回来。”自己躺在榻上下泪。幸喜鸳鸯等能用…","so":0,"eo":0},{"surface":"宝玉","text":"贾政带了宝玉回家，未及进门，只见门上有好些人在那里乱嚷，说：“今日旨意：将荣国公世职着贾政承袭。”那些人在那里要喜钱，门上人和他们分争，说：“是本来的世职，我们本家袭了，有什么喜报？”那些人说道：“那世职的荣耀，比任什么还难得，你们大老爷闹掉了，想要这个，再不能的了。如今圣上的恩典比天还大，又赏给二老爷了，这是千载难逢的，怎么不给喜钱？”正闹着，贾政回家，门上回了。虽则喜欢，究竟是哥哥犯事所致，反觉感极涕零，赶着进内告诉贾母。贾母自然喜…","so":0,"eo":0}]},{"chap":108,"ctitle":"第108章 强欢笑蘅芜庆生辰 死缠绵潇湘闻鬼哭","deeds":[{"surface":"宝玉","text":"湘云道：“我从小儿在这里长大的，这里那些人的脾气，我都知道的。这一回来了，竟都改了样子了。我打量我隔了好些时没来，他们生疏我；我细想起来，竟不是的。就是见了我，瞧他们的意思，原要象先一样的热闹，不知道怎么说说就伤起心来了，所以我坐了坐儿就到老太太这里来了。”贾母道：“如今的日子在我也罢了，他们年轻轻儿的人，还了得。我正要想个法儿，叫他们还热闹一天才好，只是打不起这个精神来。”湘云道：“我想起来了，宝姐姐不是后儿的生日吗？我多住一天，给他…","so":0,"eo":0},{"surface":"宝玉","text":"湘云在旁说道：“太太们请都坐下，让我们姐妹们给姐姐拜寿。”宝钗听了，倒呆了一呆，回来一想：“可不是明日是我的生日吗？”便说：“姐妹们过来瞧老太太是该的，若说为我的生日，是断断不敢的。”正推让着，宝玉也来请薛姨妈、李婶娘的安。听见宝钗自己推让，他心里本早打算过宝钗生日，因家中闹得七颠八倒，也不敢在贾母处提起。今儿湘云等众人要拜寿，便喜欢道：“明日才是生日，我正要告诉老太太来。”湘云笑道：“扯臊，老太太还等你告诉？你打量这些人为什么来？是老…","so":0,"eo":0},{"surface":"宝玉","text":"一时摆下果酒。贾母说：“也不送到外头，今日只许咱们娘儿们乐一乐。”宝玉虽然娶过亲的人，因贾母疼爱，仍在里头打混，但不与湘云、宝琴等同席，便在贾母身旁设着一个坐儿，他替宝钗轮流敬酒。贾母道：“如今且坐下，大家喝酒。到挨晚儿再到各处行礼去。若如今行起礼来，大家又闹规矩，把我的兴头打回去，就没趣了。”宝钗便依言坐下。贾母又向众人道：“咱们今儿索性洒脱些，各留一两个人伺候。我叫鸳鸯带了彩云、莺儿、袭人、平儿等在后间去也喝一钟酒。”鸳鸯等说：“我…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，不待再说，就出席到后间去找鸳鸯，说：“老太太要行令，叫姐姐去呢。”鸳鸯道：“小爷，让我们舒舒服服的喝一钟罢。何苦来，又来搅什么？”宝玉道：“当真老太太说的，叫你去呢。与我什么相干？”鸳鸯没法，说道：“你们只管喝，我去了就来。”便到贾母那边。老太太道：“你来了么？这里要行令呢。”鸳鸯道：“听见宝二爷说老太太叫我，才来的。不知老太太要行什么令儿？”贾母道：“那文的怪闷的慌，武的又不好，你倒是想个新鲜玩意儿才好。”鸳鸯想了想道：“如…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉巴不得要说、只是令盆轮不到，正想着，恰好到了跟前，便掷了一个二，两个三，一个么，便说道：“这是什么？”鸳鸯笑道：“这是个‘臭’！先喝一钟再掷罢。”宝玉只得喝了又掷。这一掷掷了两个三，两个四。鸳鸯道：“有了，这叫做‘张敞画眉’。”宝玉知是打趣他。宝钗的脸也飞红了。凤姐不大懂得，还说：“二兄弟快说了，再找下家儿是谁。”宝玉难说，自认：“罚了罢。我也没下家儿。”","so":0,"eo":0},{"surface":"宝玉","text":"过了令盆，轮到李纨，便掷了一下。鸳鸯道：“大奶奶掷的是‘十二金钗’。”宝玉听了，赶到李纨身旁看时，只见红绿对开，便说：“这一个好看的很。”忽然想起“十二钗”的梦来，便呆呆的退到自己座上，心里想：“这‘十二钗’说是金陵的，怎么我家这些人，如今七大八小的就剩了这几个？”复又看看湘云、宝钗，虽说都在，只是不见了黛玉。一时按捺不住，眼泪便要下来，恐人看见，便说身上燥的很，脱脱衣裳去，挂了筹出席去了。史湘云看见宝玉这般光景，打量宝玉掷不出好的来，…","so":0,"eo":0},{"surface":"宝玉","text":"贾母道：“这令完了，咱们喝两杯，吃饭罢。”回头一看，见宝玉还没进来，便问道：“宝玉那里去了，还不来？”鸳鸯道：“换衣裳去了。”贾母道：“谁跟了去的？”那莺儿便上来回道：“我看见二爷出去，我叫袭人姐姐跟了去了。”贾母王夫人才放心。等了一回，王夫人叫人去找。小丫头到了新房子里，只见五儿在那里插蜡。小丫头便问：“宝二爷那里去了？”五儿道：“在老太太那边喝酒呢。”小丫头道：“我打老太太那里来，太太叫我来找，岂有在那里倒叫我来找的呢。”五儿道：“…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉一时伤心，走出米，正无主意。只见袭人赶来，问是怎么了。宝玉道：“不怎么，只是心里怪烦的。要不趁他们喝酒，咱们两个到珍大奶奶那里逛逛去。”袭人道：“珍大奶奶在这里，去找谁？”宝玉道：“不找谁，瞧瞧他，既在这里，住的房屋怎么样。”袭人只得跟着，一面走，一面说。走到尤氏那边，又一个小门儿半开半掩，宝玉也不进去。只见看园门的两个婆子坐在门槛上说话儿。宝玉问道：“这小门儿开门么？”婆子道：“天天不开。今儿有人出来说，今日预备老太太要用园里…","so":0,"eo":0}]},{"chap":109,"ctitle":"第109章 候芳魂五儿承错爱 还孽债迎女返真元","deeds":[{"surface":"宝玉","text":"话说宝钗叫袭人问出原故，恐宝玉悲伤成疾，便将黛玉临死的话与袭人假作闲谈，说是：“人在世上，有意有情，到了死后，各自干各自的去了，并不是生前那样的人死后还是那样。活人虽有痴心，死的竟不知道。况且林姑娘既说仙去，他看凡人是个不堪的浊物，那里还肯混在世上？只是人自己疑心，所以招出些邪魔外祟来缠扰。”宝钗虽是与袭人说话，原说给宝玉听的。袭人会意，也说是：“没有的事。若说林姑娘的魂灵儿还在园里，我们也算相好，怎么没有梦见过一次？”宝玉在外面听着，…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，正合机宜。等宝钗睡下，便叫袭人、麝月另铺设下一副被褥，常叫人进来瞧二奶奶睡着了没有。宝钗故意装睡，也是一夜不宁。那宝玉只当宝钗睡着，便与袭人道：“你们各自睡罢，我又不伤感。你若不信，你就伏侍我睡了再进去，只要不惊动我就是了。”袭人果然伏侍他睡下，预备下了茶水，关好了门，进里间去照应了一回，各自假寐，等着宝玉若有动静再出来。宝玉见袭人进去了，便将坐更的两个婆子支到外头。他轻轻的坐起来，暗暗的祝赞了几句，方才睡下。起初再睡不着，以…","so":0,"eo":0},{"surface":"宝玉","text":"袭人也本没有睡，听见他们两个说话，即忙上来倒茶。只见老太太那边打发小丫头来问：“宝二爷昨夜睡的安顿么？若安顿，早早的同二奶奶梳洗了就过去。”袭人道：“你去回老太太，说：‘宝玉昨夜很安顿，回来就过来。’”小丫头去了。宝钗连忙梳洗了，莺儿、袭人等跟着，先到贾母那里行了礼。便到王夫人那边起，至凤姐，都让过了。仍到贾母处，见他母亲也过来了。大家问起：“宝玉晚上好么？”宝钗便说：“回去就睡了，没有什么。”众人放心，又说些闲话。","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉晚间归房，因想：“咋夜黛玉竟不入梦，或者他已经成仙，所以不肯来见我这种浊人，也是有的；不然，就是我的性儿太急了，也未可知。”便想了个主意，向宝钗说道：“我昨夜偶然在外头睡着，似乎比在屋里睡的安稳些，今日起来，心里也觉清净。我的意思，还要在外头睡两夜，只怕你们又来拦我。”宝钗听了，明知早晨他嘴里念诗自然是为黛玉的事了，想来他那个呆性是不能劝的，倒好叫他睡两夜，索性自己死了心也罢了，况兼昨夜听他睡的倒也安静。便道：“好没来由，你只管…","so":0,"eo":0},{"surface":"宝玉","text":"那知宝玉要睡越睡不着，见他两个人在那里打铺，忽然想起那年袭人不在家时，晴雯、麝月两个人服事，夜间麝月出去，睛雯要唬他，因为没穿衣服着了凉，后来，还是从这个病上死的。想到这里，一心移在晴雯身上去了。忽又想起凤姐说五儿给晴雯“脱了个影儿”，因将想睛雯的心又移在五儿身上。自己假装睡着，偷偷儿的看那五儿，越瞧越象晴雯，不觉呆性复发。听了听里间已无声息，知是睡了；但不知麝月睡了没有，便故意叫了两声，却不答应。五儿听见了宝玉叫人，便问道：“二爷要什…","so":0,"eo":0},{"surface":"宝玉","text":"那五儿自从芳官去后，也无心进来了。后来听说凤姐叫他进来伏侍宝玉，竟比宝玉盼他进来的心还急。不想进来以后，见宝钗、袭人一般尊贵稳重，看着心里实在敬慕；又见宝玉疯疯傻傻，不似先前的丰致；又听见王夫人为女孩子们和宝玉玩笑都撵了，所以把女儿的柔情和素日的痴心，一概搁起。怎奈这位呆爷今晚把他当作晴雯，只管爱惜起来。那五儿早已羞得两颊红潮，又不敢大声说话，只得轻轻的说道：“二爷，漱口啊。”宝玉笑着接了茶在手中，也不知道漱了没有，便笑嘻嘻的问道：“你…","so":0,"eo":0},{"surface":"宝玉","text":"此时五儿心中也不知宝玉是怎么个意思，便说道：“夜深了，二爷睡罢，别紧着坐着，看凉着了。刚才奶奶和袭人姐姐怎么嘱咐来！”宝玉道：“我不凉。”说到这里，忽然想起五儿没穿着衣裳，就怕他也象晴雯着了凉，便问道：“你为什么不穿上衣裳就过来？”五儿道：“爷叫的紧，那里有尽着穿衣裳的空儿？要知道说这半天话儿时，我也穿上了。”宝玉听了，连忙把自己盖的一件月白绫子绵袄儿揭起来递给五儿，叫他披上。五儿只不肯接，说：“二爷盖着罢，我不凉。我凉，我有我的衣裳。…","so":0,"eo":0},{"surface":"宝玉","text":"却说五儿被宝玉鬼混了半夜，又兼宝钗咳嗽，自己怀着鬼胎，生怕宝钗听见了，也是思前想后，一夜无眠。次日一早起来，见宝玉尚自昏昏睡着，便轻轻儿的收拾了屋子。那里麝月已醒，便道：“你怎么这么早起来了？你难道一夜没睡吗？”五儿听这话又似麝月知道了的光景，便只是讪笑，也不答言。一时宝钗袭人也都起来，开了门。见宝玉尚睡，却也纳闷：“怎么在外头两夜睡的倒这么安稳呢？”及宝玉醒来，见众人都起来了，自己连忙爬起。揉着眼睛，细想昨夜又不曾梦见，可是“仙凡路隔…","so":0,"eo":0}]},{"chap":110,"ctitle":"第110章 史太君寿终归地府 王凤姐力诎失人心","deeds":[{"surface":"宝玉","text":"却说贾母坐起说道：“我到你们家已经六十多年了，从年轻的时候到老来，福也享尽了。自你们老爷起，儿子孙子也都算是好的了。就是宝玉呢，我疼了他一场，”说到那里，拿眼满地下瞅着，王夫人便推宝玉走到床前。贾母从被窝里伸出手来拉着宝玉，道：“我的儿，你要争气才好！”宝玉嘴里答应，心里一酸，那眼泪便要流下来，又不敢哭，只得站着。听贾母说道：“我想再见一个重孙子，我就安心了。我的兰儿在那里呢？”李纨也推贾兰上去。贾母放了宝玉，拉着贾兰道：“你母亲是要孝…","so":0,"eo":0},{"surface":"宝玉","text":"贾赦不在家，贾政为长；宝玉、贾兰是亲孙，年纪又小，都应守灵。贾琏虽也是亲孙，带着贾蓉，尚可分派家人办事。虽请了些男女外亲来照应，内里邢、王二夫人、李纨、凤姐、宝钗等是应灵旁哭泣的；尤氏虽可照应，他自贾珍外出，依住荣府，一向总不上前，且又荣府的事不甚谙练；贾蓉的媳妇更不必说，惜春年小，虽在这里长的，他于家事全不知道。所以内里竟无一人支持，只有凤姐可以照管里头的事，况又贾琏在外作主，里外他二人，倒也相宜。","so":0,"eo":0},{"surface":"宝玉","text":"且说史湘云因他女婿病着，贾母死后，只来了一次，屈指算是后日送殡，不能不去。又见他女婿的病已成痨症，暂且不妨，只得坐夜前一日过来。想起贾母素日疼他；又想到自己命苦，刚配了一个才貌双全的女婿，情性又好，偏偏的得了冤孽症候，不过捱日子罢了。于是更加悲痛，直哭了半夜。鸳鸯等再三劝慰不止。宝玉瞅着也不胜悲伤，又不好上前去劝。见他淡汝素服，不敷脂粉，更比未出嫁的时候犹胜几分。回头又看宝琴等也都是淡素妆饰，丰韵嫣然。独看到宝钗浑身挂孝，那一种雅致，比…","so":0,"eo":0}]},{"chap":111,"ctitle":"第111章 鸳鸯女殉主登太虚 狗彘奴欺天招伙盗","deeds":[{"surface":"宝玉","text":"王夫人、宝钗等听了，都哭着去瞧。邢夫人道：“我不料鸳鸯倒有这样志气！快叫人去告诉老爷。”只有宝玉听见此信，便唬的双眼直竖。袭人等慌忙扶着说道：“你要哭就哭，别憋着气。”宝玉死命的才哭出来了。心想：“鸳鸯这样一个人，偏又这样死法！”又想：“实在天地间的灵气，独钟在这些女子身上了。他算得了死所。我们究竟是一件浊物，还是老太太的儿孙，谁能赶得上他？”复又喜欢起来。那时，宝钗听见宝玉大哭了出来了，及到跟前，见他又笑。袭人等忙说：“不好了，又要疯…","so":0,"eo":0},{"surface":"宝玉","text":"平儿也知道了，过来同袭人、莺儿等一干人都哭的哀哀欲绝。内中紫鹃也想起自己终身，无着落，恨不跟了林姑娘去，又全了主仆的恩义，又得了死所。如今空悬在宝玉屋内，虽说宝玉仍是柔情密意，究竟算不得什么，于是更哭得哀切。","so":0,"eo":0},{"surface":"宝玉","text":"贾政因他为贾母而死，要了香来，上了三炷，作了个揖，说：“他是殉葬的人，不可作丫头论，你们小一辈的都该行个礼儿。”宝玉听了，喜不自胜，走来恭恭敬敬磕了几个头。贾琏想他素日的好处，也要上来行礼，被邢夫人说道：“有了一个爷们就是了，别折受的他不得超生。”贾琏就不便过来了。宝钗听着这话，好不自在，便说道：“我原不该给他行礼，但只老太太去世，咱们都有未了之事，不敢胡为。他肯替咱们尽孝，咱们也该托托他。好好的替咱们伏侍老太太西去，也少尽一点子心哪。…","so":0,"eo":0},{"surface":"宝玉","text":"这里妙玉带了道婆走到惜春那里，道了恼，叙些闲话。惜春说起：“在家看家，只好熬个几夜，但是二奶奶病着，一个人又闷又害怕，能有一个人在这里我就放心，如今里头一个男人也没有。今儿你既光降，肯伴我一宵，咱们下棋说话儿，可使得么？”妙玉本来不肯，见惜春可怜，又提起下棋，一时高兴应了。打发道婆回去取了他的茶具衣褥，命侍儿送了过来，大家坐谈一夜。惜春欣幸异常，便命彩屏去开上年蠲的雨水，预备好茶。那妙玉自有茶具。道婆去了不多一时，又来了一个侍者，送下妙…","so":0,"eo":0}]},{"chap":112,"ctitle":"第112章 活冤孽妙姑遭大劫 死雠仇赵妾赴冥曹","deeds":[{"surface":"宝玉","text":"且说贾政等送殡到了寺内，安厝毕，亲友散去。贾政在外厢房伴灵，邢、王二夫人等在内，一宿无非哭泣。到了第二日，重新上祭，正摆饭时，只见贾芸进来，在老太太灵前磕了个头，忙忙的跑到贾政跟前，跪下请了安，喘吁吁的将昨夜被盗，将老太太上房的东西都偷去，包勇赶贼打死了一个，已经呈报文武衙门的话说了一遍。贾政听了发怔。邢、王二夫人等在里头也听见了，都唬得魂不附体，并无一言，只有啼哭。贾政过了一会子，问：“失单怎样开的？”贾芸回道：“家里的人都不知道，还…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾琏回到铁槛寺，将到家中查点了上夜的人，开了失单报去的话，回了贾政。贾政道：“怎么开的？”贾琏便将琥珀记得的数目单于呈出，并说：“上头元妃赐的东西，已经注明；还有那人家不大有的东西，不便开上。等侄儿脱了孝，出去托人细细的缉访，少不得弄出来的。”贾政听了合意，就点头不言。贾琏进内见了邢，王二夫人，商量着：“劝老爷早些回家才好呢，不然都是乱麻似的。”邢夫人道：“可不是，我们在这里也是惊心吊胆。”贾琏道：“这是我们不敢说的，还是太太的主意…","so":0,"eo":0},{"surface":"宝玉","text":"正闹着，贾政打发人进来叫环儿。婆子们去回说：“赵姨娘中了邪了，三爷看着呢。”贾政道：“没有的事。我们先走了。”于是爷们等先回。这里赵姨娘还是混说，一时救不过来。邢夫人恐他又说出什么来，便说：“多派几个人在这里瞧着他，咱们先走。到了城里，打发大夫出来瞧罢。”王夫人本嫌他，也打撒手儿。宝钗本是仁厚的人，虽想着他害宝玉的事，心里究竟过不去，背地里托了周姨娘在这里照应。周姨娘也是个好人，便应承了。李纨说道：“我也在这里罢。”王夫人道：“可以不必…","so":0,"eo":0},{"surface":"宝玉","text":"贾政、邢、王夫人等先后到家，到了上房，哭了一场。林之孝带了家下众人请了安，跪着。贾政喝道：“去罢！明日问你。”凤姐那日发晕了几次，竟不能出接，只有惜春见了，觉得满面羞惭。邢夫人也不理他，王夫人仍是照常，李纨、宝钗拉着手说了几句话。独有尤氏说道：“姑娘，你操心了，倒照应了好几天！”惜春一言不答，只紫涨了脸。宝钗将尤氏一拉，使了个眼色，尤氏等各自归房去了。贾政略略的看了一看，叹了口气，并不言语。到书房席地坐下，叫了贾琏、贾蓉、贾芸吩咐了几句…","so":0,"eo":0}]},{"chap":113,"ctitle":"第113章 忏宿冤凤姐托村妪 释旧憾情婢感痴郎","deeds":[{"surface":"宝玉","text":"且说栊翠庵原是贾府的地址，因盖省亲园子，将那度圈在里头，向来食用香火，并不动贾府的钱粮。如今妙玉被劫，那女尼呈报到官，一则候官府缉盗的下落，二则是妙玉基业，不便离散，依旧住下，不过回明了贾府。那时贾府的人虽都知道，只为贾政新丧，且又心事不宁，也不敢将这些没要紧的事回禀。只有惜春知道此事，日夜不安。渐渐传到宝玉耳边，说：“妙玉被贼劫去。”又有的说：“妙玉凡心动了，跟人而走。”宝玉听得，十分纳闷：“想来必是被强徒抢去。这个人必不肯受，一定不…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉见屋里人少，想起：“紫鹃到了这里，我从没合他说句知心的话儿，冷冷清清撂着他，我心里甚不过意。他呢，又比不得麝月秋纹，我可以安放得的。想起从前我病的时候，他在我这里伴了好些时，如今他的那一面小镜子还在我这里，他的情意却也不薄了。如今不知为什么，见我就是冷冷的。若说为我们这一个呢，他是合林妹妹最好的，我看他待紫鹃也不错。我不在家的日子，紫鹃原也与他有说有笑的，到我来了，紫鹃便走开了。想来自然是为林妹妹死了，我便成了家的原故。嗳！紫鹃，紫…","so":0,"eo":0},{"surface":"宝玉","text":"那紫鹃的下房也就在西厢里间。宝玉悄悄的走到窗下，只见里面尚有灯光，便用舌头舐破窗纸，往里一瞧，见紫鹃独自挑灯，又不是做什么，呆呆的坐着。宝玉便轻轻的叫道：“紫鹃姐姐，还没有睡么？”紫鹃听了，唬了一跳，怔怔的半日，才说：“是谁？”宝玉道：“是我。”紫鹃听着似乎是宝玉的声音，便问：“是宝二爷么？”宝玉在外轻轻的答应了一声。紫鹃问道：“你来做什么？”宝玉道：“我有一句心里的话要和你说说，你开了门，我到你屋里坐坐。”紫鹃停了一会儿，说道：“二爷…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉正在这里伤心，忽听背后一个人接言道：“你叫谁替你说呢？谁是谁的什么？自己得罪了人，自己央及呀，人家赏脸不赏在人家，何苦来拿我们这些没要紧的垫喘儿呢？”这一句话把里外两个人都吓了一跳。你道是谁，原来却是麝月。宝玉自觉脸上没趣。只见麝月又说道：“到底是怎么着？一个赔不是，一个又不理。你倒是快快儿的央及呀。嗳，我们紫鹃姐姐也就太狠心了：外头这么怪冷的，人家央及了这半天，总连个活动气儿也没有！”又向宝玉道：“刚才二奶奶说了，多早晚了，打量你…","so":0,"eo":0},{"surface":"宝玉","text":"这里紫鹃被宝玉一招，越发心里难受，直直的哭了一夜。思前想后：“宝玉的事，明知他病中不能明白，所以众人弄鬼弄神的办成了。后来宝玉明白了，旧病复发，时常哭想，并非忘情负义之徒。今日这种柔情，一发叫人难受。只可怜我们林姑娘真真是无福消受他。如此看来。人生缘分，都有一定，在那未到头时，大家都是痴心妄想，及至无可如何，那糊涂的也就不理会了，那情深义重的也不过临风对月，洒泪悲啼。可怜那死的倒未必知道，这活的真真是苦恼伤心，无休无了。算来竟不如草木石…","so":0,"eo":0}]},{"chap":114,"ctitle":"第114章 王熙凤历幻返金陵 甄应嘉蒙恩还玉阙","deeds":[{"surface":"宝玉","text":"却说宝玉、宝钗听说凤姐病的危急，赶忙起来，丫头秉烛伺候。正要出院，只见王夫人那边打发人来说：“琏二奶奶不好了，还没有咽气，二爷、二奶奶且慢些过去罢。琏二奶奶的病有些古怪，从三更天起，到四更时候，没有住嘴，说了好些胡话，要船要轿，只说赶到金陵归入什么册子去。众人不懂，他只是哭哭喊喊。琏二爷没有法儿，只得去糊船轿，还没拿来，琏二奶奶喘着气等着呢。太太叫我们过来说，等琏二奶奶去了，再过去罢。”宝玉道：“这也奇，他到金陵做什么去？”袭人轻轻的说…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉道：“别提他了。你只说邢妹妹罢，自从我们这里连连的有事，把他这件事竟忘记了。他们家这么一件大事，怎么就草草的完了？也没请亲唤友的。”宝钗道：“你这话又是迂了。我们家的亲戚，只有咱们这里和王家最近。王家没了什么正经人了，咱们家遭了老太太的大事，所以也没请，就是琏二哥张罗了张罗。别的亲戚虽也有一两门子，你没过去，如何知道？算起来，我们这二嫂子的命和我差不多。好好的许了我二哥哥，我妈妈原想要体体面面的给二哥哥娶这房亲事的。一则为我哥哥在监…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉还要讲出不搬去的理，王夫人打发人来说：“琏二奶奶咽了气了，所有的人都过去了，请二爷、二奶奶就过去。”宝玉听了，也掌不住跺脚要哭。宝钗虽也悲戚，恐宝玉伤心，便说：“有在这里哭的，不如到那边哭去。”于是两人一直到凤姐那里，只见好些人围着哭呢。宝钗走到跟前，见凤姐已经停床，便大放悲声。宝玉也拉着贾琏的手，大哭起来，贾琏也重新哭泣。平儿等因见无人劝解，只得含悲上来劝止了。众人都悲哀不止。贾琏此时手足无措，叫人传了赖大来，叫他办理丧事。自己回…","so":0,"eo":0},{"surface":"宝玉","text":"两人正说着，门上的进来回道：“江南甄老爷来了。”贾政便问道：“甄老爷进京为什么？”那人道：“奴才也打听过了，说是蒙圣恩起复了。”贾政道：“不用说了，快请罢。”那人出去，请了进来。那甄老爷即是甄宝玉之父，名叫甄应嘉，表字友忠，也是金陵人氏，功勋之后。原与贾府有亲，素来走动的。因前年挂误革了职，动了家产，今遇主上眷念功臣，赐还世职，行取来京陛见。知道贾母新丧，特备祭礼，择日到寄灵的地方拜奠，所以先来拜望。","so":0,"eo":0},{"surface":"宝玉","text":"贾琏宝玉早已伺候在那里代送，因贾政未叫，不敢擅入。甄应嘉出来，两人上去请安。应嘉一见宝玉，呆了一呆，心想：“这个怎么甚象我家宝玉！只是浑身缟素。”问道：“至亲久阔，爷们都不认得了。”贾政忙指贾琏道：“这是家兄名赦之子琏二侄儿。”又指着宝玉道：“这是第二小犬，名叫宝玉。”应嘉拍手道：“奇！我在家听见说老亲翁有个衔玉生的爱子，名叫宝玉，因与小儿同名，心中甚为罕异。后来想着这个也是常有的事，不在意了。岂知今日一见，不但面貌相同，且举止一般，这…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉回到自己房中，告诉了宝钗，说是：“常提的甄宝玉，我想一见不能，今日倒先见了他父亲了。我还听得说，宝玉也不日要到京了，要求拜望我们老爷呢。他也说和我一模一样的，我只不信。若是他后儿到了咱们这里来，你们都去瞧瞧，看他果然和我象不象？”宝钗听了道：“嗳，你说话怎么越发没前后了？什么男人同你一样都说出来了，还叫我们瞧去呢。”宝玉听了，知是失言，脸上一红，连忙的还要解说。","so":0,"eo":0}]},{"chap":115,"ctitle":"第115章 惑偏私惜春矢素志 证同类宝玉失相知","deeds":[{"surface":"宝玉","text":"话说宝玉为自己失言，被宝钗问住，想要掩饰过去，只见秋纹进来说：“外头老爷叫二爷呢。”宝玉巴不得一声儿，便走了。到贾政那里，贾政道：“我叫你来不为别的。现在你穿着孝，不便到学里去，你在家里，必要将你念过的文章温习温习。我这几天倒也闲着。隔两三日要做几篇文章我瞧瞧，看你这些时进益了没有。”宝玉只得答应着。贾政又道：“你环兄弟兰侄儿我也叫他们温习去了。倘若你做的文章不好，反倒不及他们，那可就不成事了。”宝玉不敢言语，答应了个“是”，站着不动。…","so":0,"eo":0},{"surface":"宝玉","text":"正要坐下静静心，只见两个姑子进来，是地藏庵的。见了宝钗，说道：“请二奶奶安。”宝钗待理不理的说：“你们好。”因叫人来：“倒茶给师父们喝。”宝玉原要和那姑子说话，见宝钗似乎厌恶这些，也不好兜搭。那姑子知道宝钗是个冷人，也不久坐，辞了要去。宝钗道：“再坐坐去罢。”那姑子道：“我们因在铁槛寺做了功德，好些时没来请太太奶奶们的安。今日来了，见过了奶奶太太们，还要看看四姑娘呢。”宝钗点头，由他去了。那姑子到了惜春那里，看见彩屏，便问：“姑娘在那里…","so":0,"eo":0},{"surface":"宝玉","text":"邢、王二夫人正要告诉贾政，只听外头传进来说：“甄家的太太带了他们家的宝玉来了。”众人急忙接出，便在王夫人处坐下。众人行礼，叙些寒温，不必细述。只言王夫人提起甄宝玉与自己的宝玉无二，要请甄宝玉进来一见。传话出去，回来说道：“甄少爷在外书房同老爷说话，说的投了机了，打发人来请我们二爷三爷，还叫兰哥儿在外头吃饭，吃了饭进来。”说毕，里头也便摆饭。","so":0,"eo":0},{"surface":"宝玉","text":"原来此时贾政见甄宝玉相貌果与宝玉一样，试探他的文才，竟应对如流，甚是心敬，故叫宝玉等三人出来警励他们，再者到底叫宝玉来比一比。宝玉听命，穿了素服。带了兄弟侄儿出来，见了甄宝玉，竟是旧相识一般。那甄宝玉也象那里见过的。两人行了礼，然后贾环贾兰相见。本来贾政席地而坐，要让甄宝玉在椅子上坐，甄宝玉因是晚辈，不敢上坐，就在地下铺了褥子坐下。如今宝玉等出来，又不能同贾政一处坐着，为甄宝玉是晚一辈，又不好竟叫宝玉等站着。贾政知是不便，站起来又说了几…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾宝玉见了甄宝玉，想到梦中之景，并且素知甄宝玉为人，必是和他同心，以为得了知己。因初次见面，不便造次，且又贾环贾兰在坐，只有极力夸赞说：“久仰芳名，无由亲炙，今日见面，真是谪仙一流的人物。”那甄宝玉素来也知贾宝玉的为人，今日一见，果然不差，“只是可与我共学，不可与我适道。他既和我同名同貌，也是三生石上的旧精魂了。我如今略知些道理，何不和他讲讲？但只是初见，尚不知他的心与我同不同，只好缓缓的来。”便道：“世兄的才名，弟所素知的。在世兄…","so":0,"eo":0},{"surface":"宝玉","text":"贾宝玉听了兰儿的话，心里越发不合，想道：“这孩子从几时也学了这一派酸论！”便说道：“弟闻得世兄也诋尽流俗，性情中另有一番见解。今日弟幸会芝范，想欲领教一番超凡入圣的道理，从此可以洗净俗肠，重开眼界。不意视弟为蠢物，所以将世路的话来酬应。”甄宝玉听说，心里晓得：“他知我少年的性情，所以疑我为假。我索性把话说明，或者与我作个知心朋友，也是好的。”便说：“世兄高论，固是真切。但弟少时也曾深恶那些旧套陈言，只是一年长似一年，家君致仕在家，懒于酬…","so":0,"eo":0},{"surface":"宝玉","text":"所以把少时那些迂想痴情，渐浙的淘汰了些。如今尚欲访师觅友，教导愚蒙。幸会世兄，定当有以教我。适才所言，并非虚意。”贾宝玉愈听愈不耐烦，又不好冷淡，只得将言语支吾。幸喜里头传出话来，说：“若是外头爷们吃了饭，请甄少爷里头去坐呢。”宝玉听了，趁势便邀甄宝玉进去。那甄宝玉依命前行，贾宝玉等陪着来见王夫人。贾宝玉见是甄太太上坐，便先请过了安。贾环贾兰也见了。甄宝玉也请了王夫人的安。两母两子，互相厮认。虽是贾宝玉是娶过亲的，那甄夫人年纪已老，又是…","so":0,"eo":0},{"surface":"宝玉","text":"众人一见两个宝玉在这里，都来瞧看，说道：“真真奇事！名字同了也罢，怎么相貌身材都是一样的。亏得是我们宝玉穿孝，若是一样的衣服穿着，一时也认不出来。”内中紫鹃一时痴意发作，因想起黛玉来，心里说道：“可惜林姑娘死了，若不死时，就将那甄宝玉配了他，只怕也是愿意的。”正想着，只听得甄夫人道：“前日听得我们老爷回来说：我们宝玉年纪也大了，求这里老爷留心一门亲事。”王夫人正爱甄宝玉，顺口便说道：“我也想要与令郎诈伐。我家有四个姑娘：那三个都不用说，…","so":0,"eo":0}]},{"chap":116,"ctitle":"第116章 得通灵幻境悟仙缘 送慈柩故乡全孝道","deeds":[{"surface":"宝玉","text":"话说宝玉一听麝月的话，身往后仰，复又死去，急得王夫人等哭叫不止。麝月自知失言致祸，此时王夫人等也不及说他。那麝月一面哭着，一面打算主意，心想：“若宝玉一死，我便自尽，跟了他去。”","so":0,"eo":0},{"surface":"宝玉","text":"不言麝月心里的事。且说王夫人等见叫不回来，赶着叫人出来找和尚救治。岂知贾政进内出去时，那和尚已不见了。贾政正在诧异，听见里头又闹，急忙进来，见宝玉又是先前的样子，牙关紧闭，脉息全无。用手在心窝中一摸，尚是温热。贾政只得急忙请医，灌药救治。那知那宝玉的魂魄早已出了窍了。你道死了不成？却原来恍恍惚惚赶到前厅，见那送玉的和尚坐着，便施了礼。那和尚忙站起身来，拉着宝玉就走。宝玉跟了和尚，觉得身轻如叶，飘飘摇摇，也没出大门，也不知从那里走出来了。","so":0,"eo":0},{"surface":"宝玉","text":"行了一程，到了个荒野地方，远远的望见一座牌楼，好象曾到过的。正要问那和尚，只见恍恍惚惚又来了一个女人。宝玉心里想道：“这样旷野地方，那得有如此的丽人？必是神仙下界了。”宝玉想着，走近前来，细细一看，竟有些认得的，只是一时想不起来。只见那女人合和尚打了一个照面，就不见了。宝玉一想，竟是尤三姐的样子，越发纳闷：“怎么他也在这里？”又要问时，那和尚早拉着宝玉过了牌楼。只见牌上写着“真如福地”四个大字，两边一副对联，乃是：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看了，心下想道：“原来如此，我倒要问问因果来去的事了。”这么一想，只见鸳鸯站在那里，招手儿叫他。宝玉想道：“我走了半日，原不曾出园子，怎么改了样儿了呢？”赶着要合鸳鸯说话，岂知一转眼便不见了，心里不免疑惑起来。走到鸳鸯站的地方儿，乃是一溜配殿，各处都有匾额。宝玉无心去看，只向鸳鸯立的所在奔去，只见一间配殿的门半掩半开。宝玉也不敢造次进去，心里正要问那和尚一声，回过头来，和尚早已不见了。宝玉恍惚见那殿宇巍峨，绝非大观园景象，便立住脚，…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看了，便点头叹息。想要进去找鸳鸯，问他是什么所在。细细想来，甚是熟识，便仗着胆子推门进去。满屋一瞧，并不见鸳鸯，里头只是黑漆漆的。心下害怕。正要退出，见有十数个大橱，橱门半掩。宝玉忽然想起：“我少时做梦，曾到过这样个地方；如今能够亲身到此，也是大幸。”恍惚间，把找鸳鸯的念头忘了，便仗着胆子把上首大橱开了橱门一瞧，见有好几本册子。心里更觉喜欢，想道：“大凡人做梦，说是假的，岂知有这梦便有这事！我常说还要做这个梦再不能的，不料今儿被我找…","so":0,"eo":0},{"surface":"宝玉","text":"待要往后再看，听见有人说道：“你又发呆了，林妹妹请你呢。”好似鸳鸯的声气，回头却不见人。心中正自惊疑，忽鸳鸯在门外招手。宝玉一见，喜得赶出来，但见鸳鸯在前，影影绰绰的走，只是赶不上。宝玉叫道：“好姐姐等等我！”那鸳鸯并不理，只顾前走。宝玉无奈，尽力赶去。忽见别有一洞天，楼阁高耸，殿角玲珑，且有好些宫女隐约其间。宝玉贪看景致，竟将鸳鸯忘了。宝玉顺步走入一座宫门，内有奇花异卉，都也认不明白，惟有白石花栏围着一颗青草，叶头上略有红色，“但不知…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了发怔，只觉自形秽浊。正要退出，又听见有人赶来，说道：“里面叫请神瑛侍者。”那人道：“我奉命等了好些时，总不见有神瑛侍者过来，你叫我那里请去？”那一个笑道：“才退去的不是么？”那侍女慌忙赶出来，说：“请神瑛侍者回来。”宝玉只道是问别人，又怕被人追赶，只得踉跄而逃。正走时，只见一人手提宝剑，迎面拦住，说：“那里走！”吓得宝玉惊惶无措。仗着胆抬头一看，却不是别人，就是尤三姐。宝玉见了，略定些神，央告道：“姐姐，怎么你也来逼起我来了？”…","so":0,"eo":0},{"surface":"宝玉","text":"岂知身后说话的并非别人，却是晴雯。宝玉一见，悲喜交集，便说：“我一个人走迷了道儿，遇见仇人，我要逃回，却不见你们一人跟着我。如今好了，晴雯姐姐，快快的带我回家去罢！”晴雯道：“侍者不必多疑。我非晴雯，我是奉妃子之命，特来请你一会，并不难为你。”宝玉满腹狐疑，只得问道：“姐姐说是妃子叫我，那妃子究是何人？”晴雯道：“此时不必问，到了那里自然知道。”宝玉没法，只得跟着走。细看那人背后举动，恰是晴雯，“那面目声音是不错的了，怎么他说不是？我此…","so":0,"eo":0}]},{"chap":117,"ctitle":"第117章 阻超凡佳人双护玉 欣聚党恶子独承家","deeds":[{"surface":"宝玉","text":"话说王夫人打发人来叫宝钗过去商量，宝玉听见说是和尚在外头，赶忙的独自一人走到前头，嘴里乱嚷道：“我的师父在那里？”叫了半天，并不见有和尚，只得走到外面。见李贵将和尚拦住，不放他进来。宝玉便说道：“太太叫我请师父进去。”李贵听了，松了手，那和尚便摇摇摆摆的进来。宝玉看见那僧的形状与他死去时所见的一般，心里早有些明白了，便上前施礼，连叫：“师父，弟子迎候来迟。”那僧说：“我不要你们接待，只要银子拿了来，我就走。”宝玉听来，又不象有道行的话。…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉也不答言，往里就跑。走到自己院内，见宝钗、袭人等都到王夫人那里去了，忙向自己床边取了那玉，便走出来。迎面碰见袭人，撞了一个满怀，把袭人唬了一跳，说道：“太太说你陪着和尚坐着很好。太太在那里打算送他些银两，你又回来做什么？”宝玉道：“你快去回太太说：不用张罗银子了，我把这玉还了他就是了。”袭人听说，即忙拉住宝玉，道：“这断使不得的！那玉就是你的命，若是他拿了去，你又要病着了。”宝玉道：“如今再不病的了。我已经有了心了，要那玉何用？”摔…","so":0,"eo":0},{"surface":"宝玉","text":"里面的丫头听见，连忙赶来，瞧见他两个人的神情不好。只听见袭人哭道：“快告诉太太去！宝二爷要把那玉去还和尚呢！”丫头赶忙飞报王夫人。那宝玉更加生气，用手来掰开了袭人的手。幸亏袭人忍痛不放。紫鹃在屋里听见宝玉要把玉给人，这一急比别人更甚，把素日冷淡宝玉的主意都忘在九霄云外了，连忙跑出来，帮着抱住宝玉。那宝玉虽是个男人，用力摔打，怎奈两个人死命的抱住不放，也难脱身，叹口气道：“为一块玉，这样死命的不放！若是我一个人走了，你们又怎么样？”袭人、…","so":0,"eo":0},{"surface":"宝玉","text":"正在难分难解，王夫人、宝钗急忙赶来。见是这样形景，王夫人便哭着喝道：“宝玉，你又疯了！”宝玉见王夫人来了，明知不能脱身，只得陪笑道：“这当什么，又叫太太着急！他们总是这样大惊小怪。我说那和尚不近人情，他必要一万银子，少一个不能。我生气进来，拿了这玉还他，就说是假的，要这玉干什么？他见我们不希罕那玉，便随意给他些，就过去了。”王夫人道：“我打量真要还他！这也罢了。为什么不告诉明白了他们？叫他们哭哭喊喊的象什么？”宝钗道：“这么说呢，倒还使…","so":0,"eo":0},{"surface":"宝玉","text":"王夫人、宝钗等进来坐下，问起袭人来由。袭人便将宝玉的话细细说了。王夫人、宝钗甚是不放心，又叫人出去，吩咐众人伺候，听着和尚说些什么。回来，小丫头传话进来回王夫人道：“二爷真有些疯了。外头小厮们说，里头不给他玉，他也没法儿；如今身子出来了，求那和尚带了他去。”王夫人听了，说道：“这还了得！那和尚说什么来着？”小丫头回道：“和尚说，要玉不要人。”宝钗道：“不要银子了么？”小丫头道：“没听见说。后来和尚合二爷两个人说着笑着，有好些话，外头小厮…","so":0,"eo":0},{"surface":"宝玉","text":"正要叫人出去拉宝玉进来，只见宝玉笑嘻嘻的进来，说：“好了，好了。”宝钗仍是发怔。王夫人道：“你疯疯癫癫的说的是什么？”宝玉道：“正经话，又说我疯癫！那和尚与我原认得的，他不过也是要来见我一见。他何尝是真要银子呢？也只当化个善缘就是了。所以说明了，他自己就飘然而去了。这可不是好了么？”王夫人不信，又隔着窗户问那小厮。那小厮连忙出去问了门上的人，进来回说：“果然和尚走了，说：‘请太太们放心，我原不要银子，’只要宝二爷时常到他那里去去就是了，…","so":0,"eo":0},{"surface":"宝玉","text":"那贾蔷还想勾引宝玉。贾芸拦住道：“宝二爷那个人没运气的，不用惹他。那一年我给他说了一门子绝好的亲，父亲在外头做税官，家里开几个当铺，姑娘长的比仙女儿还好看。我巴巴儿的细细的写了一封书子给他，谁知他没造化。”说到这里，瞧了瞧左右无人，又说：“他心里早和咱们这个二婶娘好上了。你没听见说，还有一个林姑娘呢，弄的害了相思病死的，谁不知道！这也罢了，各自的姻缘罢咧。谁知他为这件事倒恼了我了，总不大理。他打量谁必是借谁的光儿呢！”贾蔷听了，点点头，…","so":0,"eo":0},{"surface":"宝玉","text":"他两个还不知道宝玉自会那和尚以后，他是欲断尘缘，一则在王夫人跟前不敢任性，已与宝钗、袭人等皆不大款洽了。那些丫头不知道，还要逗他，宝玉那里看得到眼里。他也并不将家事放在心里。时常王夫人、宝钗劝他念书，他便假作攻书，一心想着那个和尚引他到那仙境的机关，心目中触处皆为俗人。却在家难受，闲来倒与惜春闲讲。他们两个人讲得上了，那种心更加准了几分，那里还管贾环、贾兰等。那贾环为父亲不在家，赵姨娘已死，王夫人不大理会，他便入了贾蔷一路。倒是彩云时常…","so":0,"eo":0}]},{"chap":118,"ctitle":"第118章 记微嫌舅兄欺弱女 惊谜语妻妾谏痴人","deeds":[{"surface":"宝玉","text":"王夫人知道不愿意，正在想人。袭人立在宝玉身后，想来宝玉必要大哭，防着他的旧病。岂知宝玉叹道：“真真难得！”袭人心里更自伤悲。宝钗虽不言语，遇事试探，见他执迷不醒，只得暗中落泪。王夫人才要叫了众丫头来问，忽见紫鹃走上前去，在王夫人面前跪下，回道：“刚才太太问跟四姑娘的姐姐，太太看着怎么样？”王夫人道：“这个如何强派得人的？谁愿意，他自然就说出来了。”紫鹃道：“姑娘修行，自然姑娘愿意，并不是别的姐姐们的意思。我有句话回太太，我也并不是拆开姐…","so":0,"eo":0},{"surface":"宝玉","text":"李纨、宝钗听了，诧异道：“不好了！这个人入了魔了。”王夫人听了这话，点头叹息，便问：“宝玉，你到底是那里看来的？”宝玉不便说出来，回道：“太太也不必问我，自有见的地方。”王夫人回过味来，细细一想，便更哭起来道：“你说前儿是玩话，怎么忽然有这首诗？罢了，我知道了。你们叫我怎么样呢？我也没有法儿了，也只得由着你们去罢，但只等我合上了眼，各自干各自的就完了！”","so":0,"eo":0},{"surface":"宝玉","text":"宝钗一面劝着，这个心比刀绞更甚，也掌不住，便放声大哭起来。袭人已经哭的死去活来，幸亏秋纹扶着。宝玉也不啼哭，也不相劝，只不言语。贾兰、贾环听到那里，各自走开。李纨竭力的解说：“总是宝兄弟见四妹妹修行，他想来是痛极了，不顾前后的疯话，这也作不得准。独有紫鹃的事情，准不准，好叫他起来。”王夫人道：“什么依不依？横竖一个人的主意定了，那也是扭不过来的。可是宝玉说的，也是一定的了！”紫鹃听了磕头。惜春又谢了王夫人。紫鹃又给宝玉、宝钗磕了头，宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"因时已五更，宝玉请王夫人安歇。李纨等各自散去。彩屏等暂且伏侍惜春回去，后来指配了人家。紫鹃终身伏侍，毫不改初。此是后话。","so":0,"eo":0},{"surface":"宝玉","text":"平儿心下留神打听，那些丫头婆子都是平儿使过的，平儿一问，所有听见外头的风声都告诉了。平儿便吓的没了主意，虽不和巧姐说，便赶着去告诉了李纨、宝钗，求他二人告诉王夫人。王夫人知道这事不好，便和邢夫人说知。怎奈邢夫人信了兄弟并王仁的话，反疑心王夫人不是好意，便说：“孙女儿也大了。现在琏儿不在家，这件事我还做得主。况且他亲舅爷爷和亲舅舅打听的，难道倒比别人不真么？我横竖是愿意的。倘有什么不好，我和琏儿也抱怨不着别人。”王夫人听了这些话，心下暗暗…","so":0,"eo":0},{"surface":"宝玉","text":"这里王夫人想到烦闷，一阵心痛，叫丫头扶着，勉强回到自己房中躺下，不叫宝玉、宝钗过来，说睡睡就好的。自己却也烦闷。听见说李婶娘来了，也不及接待。只见贾兰进来请了安，回道：“今早爷爷那里打发人带了一封书子来，外头小子们传进来的。我母亲接了，正要过来，因我老娘来了，叫我先呈给太太瞧，回来我母亲就过来来回太太。还说我老娘要过来呢。”说着，一面把书子呈上。王夫人一面接书，一面问道：“你老娘来作什么？”贾兰道：“我也不知道。我听见我老娘说：我三姨儿…","so":0,"eo":0},{"surface":"宝玉","text":"近因沿途俱系海疆凯旋船只，不能迅速前行。闻探姐随翁婿来都，不知曾有信否？前接到琏侄手禀，知大老爷身体欠安，亦不知已有确信否？宝玉、兰儿场期已近，务须实心用功，不可怠惰。老太太灵柩抵家，尚需日时。我身体平善，不必挂念。此谕宝玉等知道。月日手书。蓉儿另禀。","so":0,"eo":0},{"surface":"宝玉","text":"王夫人看了，仍旧递给贾兰，说：“你拿去给你二叔叔瞧瞧，还交给你母亲罢。”正说着，李纨同李婶娘过来，请安问好毕，王夫人让了坐。李婶娘便将甄家要娶李绮的话说了一遍。大家商议了一会子。李纨因问王夫人道：“老爷的书子，太太看过了么？”王夫人道：“看过了。”贾兰便拿着给他母亲瞧。李纨看了道：“三姑娘出了门好几年，总没有来，如今要回京了，太太也放了好些心。”王夫人道：“我本是心痛，看见探丫头要回来了，心里略好些，只是不知几时才到？”李婶娘便问了贾政…","so":0,"eo":0}]},{"chap":119,"ctitle":"第119章 中乡魁宝玉却尘缘 沐皇恩贾家延世泽","deeds":[{"surface":"宝玉","text":"话说莺儿见宝玉说话，摸不着头脑，正自要走，只听宝玉又说道：“傻丫头，我告诉你罢。你姑娘既是有造化的，你跟着他，自然也是有造化的了。你袭人姐姐是靠不住的。只要往后你尽心伏侍他就是了，日后或有好处，也不枉你跟着他熬了一场。”莺儿听着前头象话，后头说的又有些不象了，便道：“我知道了。姑娘还等我呢。二爷要吃果子时，打发小丫头叫我就是了。”宝玉点头，莺儿才去了。一时，宝钗、袭人回来，各自房中去了，不提。","so":0,"eo":0},{"surface":"宝玉","text":"且说过了几天，便是场期。别人只知盼望他爷儿两个作了好文章，便可以高中的了，只有宝钗见宝玉的工课虽好，只是那有意无意之间，却别有一种冷静的光景。知他要进场了，头一件，叔侄两个都是初次赴考，恐人马拥挤，有什么失闪；第二件，宝玉自和尚去后，总不出门，虽然见他用功喜欢，只是改的太速太好了，反倒有些信不及，只怕又有什么变故。所以进场的头一天，一面派了袭人带了小丫头们同着素云等给他爷儿两个收拾妥当，自己又都过了目，好好的搁起，预备着，一面过来同李纨…","so":0,"eo":0},{"surface":"宝玉","text":"次日，宝玉、贾兰换了半新不旧的衣服、欣然过来见了王夫人。王夫人嘱咐道：“你们爷儿两个都是初次下场，但是你们活了这么大，并不曾离开我一天。就是不在我跟前，也是丫头媳妇们围着，何曾自己孤身睡过一夜？今日各自进去，孤孤凄凄，举目无亲，须要自己保重。早些作完了文章出来，找着家人，早些回来，也叫你母亲、媳妇们放心。”王夫人说着，不免伤起心来。贾兰听一句答应一句。只见宝玉一声不哼，待王夫人说完了，走过来给王夫人跪下，满眼流泪，磕了三个头，说道：“母…","so":0,"eo":0},{"surface":"宝玉","text":"李纨见王夫人和他如此，一则怕勾起宝玉的病来，二则也觉得光景不大吉祥，连忙过来说道：“太太，这是大喜的事，为什么这样伤心？况且宝兄弟近来很知好歹，很孝顺，又肯用功。只要带了侄儿进去，好好的作文章，早早的回来，写出来请咱们的世交老先生们看了，等着爷儿两个都报了喜，就完了。”一面叫人搀起宝玉来。宝玉却转过身来给李纨作了个揖，说：“嫂子放心，我们爷儿两个都是必中的。日后兰哥还有大出息，大嫂子还要带凤冠穿霞帔呢。”李纨笑道：“但愿应了叔叔的话，也…","so":0,"eo":0},{"surface":"宝玉","text":"此时宝钗听得，早已呆了。这些话不但宝玉说的不好，便是王夫人李纨所说，句句都是不祥之兆，却又不敢认真，只得忍泪无言。那宝玉走到跟前，深深的作了一个揖。众人见他行事古怪，也摸不着是怎么样，又不敢笑他。只见宝钗的眼泪直流下来，众人更是纳罕。又听宝玉说道：“姐姐，我要走了。你好生跟着太太，听我的喜信儿罢！”宝钗道：“是时候了，你不必说这些唠叨话了。”宝玉道：“你倒催的我紧，我自己也知道该走了！”回头见众人都在这里，只没惜春、紫鹃，便说道：“四妹…","so":0,"eo":0},{"surface":"宝玉","text":"众人见他的话，又象有理，又象疯话。大家只说他从来没出过门，都是太太的一套话招出来的，不如早早催他去了就完了事了，便说道：“外面有人等你呢，你再闹就误了时辰了。”宝玉仰面大笑道：“走了，走了！不用胡闹了，完了事了！”众人也都笑道：“快走罢！”独有王夫人和宝钗娘儿两个倒象生离死别的一般，那眼泪也不知从那里来的，直流下来，几乎失声哭出。但见宝玉嘻天哈地，大有疯傻之状，遂从此出门而去。正是：","so":0,"eo":0},{"surface":"宝玉","text":"不言宝玉、贾兰出门赴考，且说贾环见他们考去，自己又气又恨，便自大为王，说：“我可要给母亲报仇了。家里一个男人没有，上头大太太依了我，还怕谁！”想定了主意，跑到邢夫人那边请了安，说了些奉承的话。那邢夫人自然喜欢，便说道：“你这才是明理的孩子呢。象那巧姐儿的事，原该我作主的。你琏二哥糊涂，放着亲奶奶倒托别人去。”贾环道：“人家那头儿也说了：只认得这一门子，现在定了，还要备一分大礼来送太太呢。如今太太有了这样的藩王孙女女婿，还怕大老爷没大官做…","so":0,"eo":0},{"surface":"宝玉","text":"看看到了出场日期，王夫人只盼着宝玉、贾兰回来。等到晌午，不见回来，王夫人、李纨、宝钗着忙，打发人去到下处打听。去了一起，又无消息，连去的人也不来了。回来又打发一起人去，又不见回来。三个人心里如热油熬煎。","so":0,"eo":0}]},{"chap":120,"ctitle":"第120章 甄士隐详说太虚情 贾雨村归结红楼梦","deeds":[{"surface":"宝玉","text":"原来袭人模糊听见说宝玉若不回来，便要打发屋里的人都出去，一急越发不好了。到大夫瞧后，秋纹给他煎药，他各自一人躺着，神魂未定，好象宝玉在他面前，恍惚又象是见个和尚，手里拿着一本册子揭着看，还说道：“你不是我的人，日后自然有人家儿的。”袭人似要和他说话，秋纹走来说：“药好了，姐姐吃罢。”袭人睁眼一瞧，知是个梦，也不告诉人。吃了药，便自己细细的想：“宝玉必是跟了和尚去。上回他要拿玉出去，便是要脱身的样子。被我揪住，看他竟不象往常，把我混推混搡…","so":0,"eo":0},{"surface":"宝玉","text":"过了几日，起来服侍宝钗。宝钗想念宝玉，暗中垂泪，自叹命苦。又知他母亲打算给哥哥赎罪，很费张罗，不能不帮着打算。暂且不表。","so":0,"eo":0},{"surface":"宝玉","text":"且说贾政扶贾母灵柩，贾蓉送了秦氏、凤姐、鸳鸯的棺木到了金陵，先安了葬。贾蓉自送黛玉的灵，也去安葬。贾政料理坟墓的事。一日，接到家书，一行一行的看到宝玉、贾兰得中，心里自是喜欢；后来看到宝玉走失，复又烦恼。只得赶忙回来。在道儿上又闻得有恩赦的旨意，又接着家书，果然赦罪复职，更是喜欢，便日夜趱行。","so":0,"eo":0},{"surface":"宝玉","text":"一日，行到陵驿地方，那天乍寒，下雪，泊在一个清静去处。贾政打发众人上岸投帖辞谢朋友，总说即刻开船，都不敢劳动。船上只留一个小厮伺候，自己在船中写家书，先要打发人起早到家。写到宝玉的事，便停笔。抬头忽见船头上微微的雪影里面一个人，光着头，赤着脚，身上披着一领大红猩猩毡的斗篷，向贾政倒身下拜。贾政尚未认清，急忙出船，欲待扶住问他是谁。那人已拜了四拜，站起来打了个问讯。贾政才要还揖，迎面一看，不是别人，却是宝玉。贾政吃一大惊，忙问道：“可是宝…","so":0,"eo":0},{"surface":"宝玉","text":"众家人回船，见贾政不在舱中，问了船夫，说是老爷上岸追赶两个和尚一个道士去了。众人也从雪地里寻踪迎去，远远见贾政来了，迎上去接着，一同回船。贾政坐下，喘息方定，将见宝玉的话说了一遍。众人回禀，便要在这地方寻觅。贾政叹道：“你们不知道，这是我亲眼见的，并非鬼怪。况听得歌声，大有玄妙。宝玉生下时，衔了玉来，便也古怪，我早知是不祥之兆，为的是老太太疼爱，所以养育到今。便是那和尚道士，我也见了三次：头一次，是那僧道来说玉的好处；第二次，便是宝玉病…","so":0,"eo":0},{"surface":"宝玉","text":"薛蟠便要去拜谢贾家。薛姨妈宝钗也都过来。见了众人，彼此聚首，又说了一番的话。正说着，恰好那日贾政的家人回家，呈上书子，说：“老爷不日到了。”王夫人叫贾兰将书子念给听。贾兰念到贾政亲见宝玉的一段，众人听了，都痛哭起来，王夫人、宝钗、袭人等更甚。大家又将贾政书内叫家内不必悲伤，原是借胎的话解说了一番：“与其作了官，倘或命运不好，犯了事，坏家败产，那时倒不好了。宁可咱们家出一位佛爷，倒是老爷太太的积德，所以才投到咱们家来。不是说句不顾前后的话…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗哭得人事不知。所有爷们都在外头。王夫人便说道：“我为他担了一辈子的惊，刚刚儿的娶了亲，中了举人，又知道媳妇作了胎，我才喜欢些，不想弄到这样结局！早知这样，就不该娶亲，害了人家的姑娘。”薛姨妈道：“这是自己一定的。咱们这样人家，还有什么别的说的吗？幸喜有了胎，将来生个外孙子，必定是有成立的，后来就有了结果了。你看大奶奶，如今兰哥儿中了举人，明年成了进士，可不是就做了官了么？他头里的苦也算吃尽的了，如今的甜来，也是他为人的好处。我们姑娘…","so":0,"eo":0},{"surface":"宝玉","text":"那日薛姨妈并未回家，因恐宝钗痛哭，住在宝钗房中解劝。那宝钗却是极明理，思前想后：“宝玉原是一种奇异的人，夙世前因，自有一定，原无可怨天尤人。”更将大道理的话告诉他母亲了。薛姨妈心里反倒安慰，便到王夫人那里，先把宝钗的话说了。王夫人点头叹道：“若说我无德，不该有这样好媳妇了。”说着更又伤心起来。薛姨妈倒又劝了一会子。因又提起袭人来，说：“我见袭人近来瘦的了不得，他是一心想着宝哥儿。但是正配呢理应守的，屋里人愿守也是有的。惟有这袭人，虽说是…","so":0,"eo":0}]}],"relations":[{"id":"665e97b0-b8d4-4801-aebe-540c18187cc9","code":"父子","sc":2,"ec":118,"status":"ACTIVE","other":"贾政","dir":"in"},{"id":"358a04ae-01ab-458b-b359-228921fed51f","code":"母子","sc":3,"ec":81,"status":"ENDED","other":"贾母","dir":"in"},{"id":"61b426d6-f29f-467a-88c4-80ec5645da8e","code":"母子","sc":3,"ec":119,"status":"ACTIVE","other":"王夫人","dir":"in"},{"id":"01a19577-06b9-4377-bd39-3902cbf45e5f","code":"夫妻","sc":5,"ec":5,"status":"ACTIVE","other":"可卿","dir":"out"},{"id":"f8d245b0-0d3d-4e6c-8836-7ce07e377e4e","code":"朋友","sc":5,"ec":116,"status":"ACTIVE","other":"黛玉","dir":"out"},{"id":"000682e4-2faf-435e-9ee1-b01fd0f60321","code":"朋友","sc":7,"ec":31,"status":"ACTIVE","other":"凤姐","dir":"in"},{"id":"498573ca-718e-4fad-89fb-4546d0def0fc","code":"主仆","sc":7 4294-8339-0960eaca4814","code":"朋友","sc":119,"ec":null,"status":"ACTIVE","other":"贾兰","dir":"out"}]},{"id":"07b3e9a7-34f4-458f-84f4-d692634f2346","name":"凤姐","type":"PERSON","mentionCount":605,"chapterCount":100,"firstChapter":6,"lastChapter":120,"aliases":["二婶子","凤儿","凤哥","凤奶奶","凤姐儿","凤婶子","夜叉","夜叉婆","婶子","我们奶奶","泼妇","琏二婶子","琏儿媳妇"],"density":"rich","timeline":[{"chap":6,"ctitle":"第6章 贾宝玉初试云雨情 刘老老一进荣国府","deeds":[{"surface":"凤姐","text":"原来这小小之家，姓王，乃本地人氏，祖上也做过一个小小京官，昔年曾与凤姐之祖王夫人之父认识。因贪王家的势利，便连了宗，认作侄儿。那时只有王夫人之大兄凤姐之父与王夫人随在京的知有此一门远族，馀者也皆不知。目今其祖早故，只有一个儿子，名唤王成，因家业萧条，仍搬出城外乡村中住了。王成亦相继身故，有子小名狗儿，娶妻刘氏，生子小名板儿；又生一女，名唤青儿。一家四口，以务农为业。因狗儿白日间自作些生计，刘氏又操井臼等事，青、板姊弟两个无人照管，狗儿遂…","so":0,"eo":0},{"surface":"凤姐","text":"周瑞家的听了，便已猜着几分来意。只因他丈夫昔年争买田地一事，多得狗儿他父亲之力，今见刘老老如此，心中难却其意，二则也要显弄自己的体面。便笑说：“老老你放心。大远的诚心诚意来了，岂有个不叫你见个真佛儿去的呢。论理，人来室至，却都不与我相干。我们这里都是各一样儿。我们男的只管春秋两季地租子，闲了时带着小爷们出门就完了；我只管跟太太奶奶们出门的事。皆因你是太太的亲戚，又拿我当个人，投奔了我来，我竟破个例给你通个信儿去。但只一件，你还不知道呢：…","so":0,"eo":0},{"surface":"凤姐","text":"先至倒厅，周瑞家的将刘老老安插住等着，自己却先过影壁，走进了院门，知凤姐尚未出来，先找着凤姐的一个心腹通房大丫头名唤平儿的。周瑞家的先将刘老老起初来历说明，又说：“今日大远的来请安，当日太太是常会的，所以我带了他过来。等着奶奶下来，我细细儿的回明了，想来奶奶也不至嗔着我莽撞的。”平儿听了，便作了个主意：“叫他们进来，先在这里坐着就是了。”周瑞家的才出去领了他们进来。上了正房台阶，小丫头打起猩红毡帘，才入堂屋，只闻一阵香扑了脸来，竟不知是…","so":0,"eo":0},{"surface":"凤姐","text":"忽见周瑞家的笑嘻嘻走过来，点手儿叫他。刘老老会意，于是带着板儿下炕。至堂屋中间，周瑞家的又和他咕唧了一会子，方蹭到这边屋内。只见门外铜钩上悬着大红洒花软帘，南窗下是炕，炕上大红条毡，靠东边板壁立着一个锁子锦的靠背和一个引枕，铺着金线闪的大坐褥，傍边有银唾盒。那凤姐家常带着紫貂昭君套，围着那攒珠勒子，穿着桃红洒花袄，石青刻丝灰鼠披风，大红洋绉银鼠皮裙，粉光脂艳，端端正正坐在那里，手内拿着小铜火箸儿拨手炉内的灰。平儿站在炕沿边，捧着小小的一…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐笑道：“亲戚们不大走动，都疏远了。知道的呢，说你们弃嫌我们，不肯常来。不知道的那起小人，还只当我们眼里没人似的。”刘老老忙念佛道：“我们家道艰难，走不起。来到这里，没的给姑奶奶打嘴，就是管家爷们瞧着也不象。”凤姐笑道：“这话没的叫人恶心。不过托赖着祖父的虚名，作个穷官儿罢咧，谁家有什么？不过也是个空架子。俗语儿说的好，‘朝廷还有三门子穷亲’呢，何况你我。”说着，又问周瑞家的：“回了太太了没有？”周瑞家的道：“等奶奶的示下。”凤姐儿道…","so":0,"eo":0},{"surface":"凤姐","text":"这里凤姐叫人抓了些果子给板儿吃，刚问了几句闲话时，就有家下许多媳妇儿管事的来回话。平儿回了，凤姐道：“我这里陪客呢，晚上再来回。要有紧事，你就带进来现办。”平儿出去，一会进来说：“我问了，没什么要紧的。我叫他们散了。”凤姐点头。只见周瑞家的回来，向凤姐道：“太太说：‘今日不得闲儿，二奶奶陪着也是一样，多谢费心想着。要是白来逛逛呢便罢；有什么说的，只管告诉二奶奶。’”刘老老道：“也没甚的说，不过来瞧瞧姑太太、姑奶奶，也是亲戚们的情分”周瑞…","so":0,"eo":0},{"surface":"凤姐","text":"那贾蓉请了安，笑回道：“我父亲打发来求婶子，上回老舅太太给婶子的那架玻璃炕屏，明儿请个要紧的客，略摆一摆就送来。”凤姐道：“你来迟了，昨儿已经给了人了。”贾蓉听说，便笑嘻嘻的在炕沿上下个半跪道：“婶子要不借，我父亲又说我不会说话了，又要挨一顿好打。好婶子，只当可怜我罢！”凤姐笑道：“也没见我们王家的东西都是好的？你们那里放着那些好东西，只别看见我的东西才罢，一见了就想拿了去。”贾蓉笑道：“只求婶娘开恩罢！”凤姐道：“碰坏一点儿，你可仔细…","so":0,"eo":0},{"surface":"凤姐","text":"这刘老老方安顿了，便说道：“我今日带了你侄儿，不为别的，因他爹娘连吃的没有，天气又冷，只得带了你侄儿奔了你老来。”说着，又推板儿道：“你爹在家里怎么教你的？打发咱们来作煞事的？只顾吃果子！”凤姐早已明白了，听他不会说话，因笑道：“不必说了，我知道了。”因问周瑞家的道：“这老老不知用了早饭没有呢？”刘老老忙道：“一早就往这里赶咧，那里还有吃饭的工夫咧？”凤姐便命快传饭来。一时周瑞家的传了一桌客馔，摆在东屋里，过来带了刘老老和板儿过去吃饭。…","so":0,"eo":0}]},{"chap":7,"ctitle":"第7章 送宫花贾琏戏熙凤 宴宁府宝玉会秦钟","deeds":[{"surface":"凤姐","text":"周瑞家的还说话时，忽听王夫人问道：“谁在里头？”周瑞家的忙出来答应了，便回了刘老老之事。略待半刻，见王夫人无话，方欲退出去，薛姨妈忽又笑道：“你且站住。我有一件东西，你带了去罢。”说着便叫：“香菱！”帘拢响处，才和金钏儿玩的那个小丫头进来，问：“太太叫我做什么？”薛姨妈道：“把那匣子里的花儿拿来。”香菱答应了，向那边棒了个小锦匣儿来。薛姨妈道：“这是宫里头作的新鲜花样儿堆纱花，十二枝。昨儿我想起来，白放着可惜旧了，何不给他们姐妹们戴去。…","so":0,"eo":0},{"surface":"凤姐","text":"那周瑞家的又和智能儿唠叨了一回，便往凤姐处来。穿过了夹道子，从李纨后窗下越过西花墙，出西角门，进凤姐院中。走至堂屋，只见小丫头丰儿坐在房门槛儿上，见周瑞家的来了，连忙的摆手儿，叫他往东屋里去。周瑞家的会意，忙着蹑手蹑脚儿的往东边屋里来，只见奶子拍着大姐儿睡觉呢。周瑞家的悄悄儿问道：“二奶奶睡中觉吗？也该清醒了。”奶子笑着，撇着嘴摇头儿。正问着，只听那边微有笑声儿，却是贾琏的声音。接着房门响，平儿拿着大铜盆出来，叫人舀水。平儿便进这边来，…","so":0,"eo":0},{"surface":"凤姐","text":"原来周瑞家的女婿便是雨村的好友冷子兴，近日因卖古董，和人打官司，故叫人来讨情。周瑞家的仗着主子的势，把这些事也不放在心上，晚上只求求凤姐便完了。","so":0,"eo":0},{"surface":"凤姐","text":"至掌灯时，凤姐卸了妆，来见王夫人，回说：“今儿甄家送了来的东西，我已收了。咱们送他的，趁着他家有年下送鲜的船，交给他带了去了。”王夫人点点头儿。凤姐又道：“临安伯老太太生日的礼已经打点了，太太派谁送去？”王夫人道：“你瞧谁闲着，叫四个女人去就完了，又来问我。”凤姐道：“今日珍大嫂子来，请我明日去逛逛，明日有什么事没有？”王夫人道：“有事没事都碍不着什么。每常他来请，有我们，你自然不便，他不请我们单请你，可知是他的诚心，叫你散荡散荡。别辜…","so":0,"eo":0},{"surface":"凤姐","text":"次日凤姐梳洗了，先回王夫人毕，方来辞贾母。宝玉听了，也要逛去，凤姐只得答应着。立等换了衣裳，姐儿两个坐了车。一时进入宁府，早有贾珍之妻尤氏与贾蓉媳妇秦氏，婆媳两个带着多少侍妾丫鬟等接出仪门。那尤氏一见凤姐，必先嘲笑一阵，一手拉了宝玉，同入上房里坐下。秦氏献了茶。凤姐便说：“你们请我来作什么？拿什么孝敬我？有东西就献上来罢，我还有事呢。”尤氏未及答应，几个媳妇们先笑道：“二奶奶今日不来就罢，既来了，就依不得你老人家了。”正说着，只见贾蓉进…","so":0,"eo":0},{"surface":"凤姐","text":"说着出去一会儿，果然带了个后生来：比宝玉略瘦些，眉清目秀，粉面朱唇，身材俊俏，举止风流，似更在宝玉之上，只是怯怯羞羞有些女儿之态，腼腆含糊的向凤姐请安问好。凤姐喜的先推宝玉笑道：“比下去了！”便探身一把攥了这孩子的手，叫他身旁坐下，慢慢问他年纪读书等事，方知他的学名叫秦钟。早有凤姐跟的丫鬟媳妇们，看见凤姐初见秦钟并未备得表礼来，遂忙过那边去告诉平儿。平儿素知凤姐和秦氏厚密，遂自作主意，拿了一匹尺头，两个“状元及第”的小金锞子，交付来人送…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉、秦钟二人随便起坐说话儿。那宝玉自一见秦钟，心中便如有所失，痴了半日，自己心中又起了个呆想，乃自思道：“天下竟有这等的人物！如今看了，我竟成了泥猪癞狗了。可恨我为什么生在这侯门公府之家？要也生在寒儒薄宦的家里，早得和他交接，也不枉生了一世。我虽比他尊贵，但绫锦纱罗，也不过裹了我这枯株朽木；羊羔美酒，也不过填了我这粪窟泥沟。‘富贵’二字，真真把人荼毒了。”那秦钟见了宝玉，形容出众，举止不凡，更兼金冠绣服，艳婢娇童，“果然怨不得姐姐素日…","so":0,"eo":0},{"surface":"凤姐","text":"一时凤姐尤氏又打发人来问宝玉：“要吃什么，只管要去。”宝玉只答应着，也无心在饮食上，只问秦钟近日家务等事。秦钟因言：“业师于去岁辞馆，家父年纪老了，残疾在身，公务繁冗，因此尚未议及延师，目下不过在家温习旧课而已。再，读书一事，也必须有一二知己为伴，时常大家讨论才能有些进益。”宝玉不待说完，便道：“正是呢！我们家却有个家塾，合族中有不能延师的便可入塾读书，亲戚子弟可以附读。我因上年业师回家去了，也现荒废着。家父之意亦欲暂送我去，且温习着旧…","so":0,"eo":0}]},{"chap":8,"ctitle":"第8章 贾宝玉奇缘识金锁 薛宝钗巧合认通灵","deeds":[{"surface":"凤姐","text":"话说宝玉和凤姐回家，见过众人，宝玉便回明贾母要约秦钟上家塾之事，自己也有个伴读的朋友，正好发愤。又着实称赞秦钟人品行事，最是可人怜爱的。凤姐又在一旁帮着说：“改日秦钟还来拜见老祖宗呢。”说的贾母喜欢起来。凤姐又趁势请贾母一同过去看戏。贾母虽年高，却极有兴头。后日，尤氏来请，遂带了王夫人、黛玉、宝玉等过去看戏。至晌午，贾母便回来歇息。王夫人本好清净，见贾母回来，也就回来了。然后凤姐坐了首席，尽欢至晚而罢。","so":0,"eo":0}]},{"chap":10,"ctitle":"第10章 金寡妇贪利权受辱 张太医论病细穷源","deeds":[{"surface":"凤姐","text":"且说他姑妈原给了贾家“玉”字辈的嫡派，名唤贾璜，但其族人那里皆能象宁荣二府的家势？原不用细说。这贾璜夫妻守着些小小的产业，又时常到宁荣二府里去请安，又会奉承凤姐儿并尤氏，所以凤姐儿尤氏也时常资助资助他，方能加此度日。今日正遇天气晴朗，又值家中无事，遂带了一个婆子，坐上车，来家里走走，瞧瞧嫂子和侄儿。说起话儿来，金荣的母亲偏提起昨日贾家学房里的事，从头至尾，一五一十，都和他小姑子说了。这璜大奶奶不听则已，听了怒从心上起，说道：“这秦钟小杂…","so":0,"eo":0},{"surface":"凤姐","text":"到了宁府，进了东角门，下了车，进去见了尤氏，那里还有大气儿？殷殷勤勤叙过了寒温，说了些闲话儿，方问道：“今日怎么没见蓉大奶奶？”尤氏说：“他这些日子不知些日子不知怎么了，经期有两个多月没有来。叫大夫瞧了，又说并不是喜。那两日到下半日就懒怠动了，话也懒怠说，神也发涅。我叫他：‘你且不必拘礼，早晚不必照例上来，你竟养养儿罢。就有亲戚来，还有我呢。别的长辈怪你，等我替你告诉。’连蓉哥儿我都嘱咐了，我说：‘你不许累他，不许招他生气，叫他静静儿的…","so":0,"eo":0},{"surface":"凤姐","text":"尤氏因叫了贾蓉来：“吩咐赖升照例预备两日的筵席，要丰丰富富的。你再亲自到西府里请老太太．大太太，二太太和你琏二婶子来逛逛。你父亲今日又听见一个好大夫，已经打发人请去了，想明日必来。你可将他这些日子的病症细细的告诉他。”贾蓉一一答应着出去了。正遇着刚才到冯紫英家去请那先生的小子回来了，因回道：“奴才方才到了冯大爷家，拿了老爷名帖请那先生去，那先生说是：‘方才这里大爷也和我说了，但只今日拜了一天的客，才回到家，此时精神实在不能支持，就是去到…","so":0,"eo":0}]},{"chap":11,"ctitle":"第11章 庆寿辰宁府排家宴 见熙凤贾瑞起淫心","deeds":[{"surface":"凤姐","text":"这里渐渐的就有人来。先是贾琏、贾蔷来看了各处的座位，并问：“有什么玩意儿没有？”家人答道：“我们爷算计，本来请太爷今日来家，所以并未敢预备玩意儿。前日听见太爷不来了，现叫奴才们找了一班小戏儿并一档子打十番的，都在园子里戏台上预备着呢。”次后邢夫人、王夫人、凤姐儿、宝玉都来了，贾珍并尤氏接了进去。尤氏的母亲已先在这里，大家见过了，彼此让了坐。贾珍、尤氏二人递了茶，因笑道：“老太太原是个老祖宗，我父亲又是侄儿，这样年纪，这个日子，原不敢请他…","so":0,"eo":0},{"surface":"凤姐","text":"王夫人说：“前听见你大妹妹说，蓉哥媳妇身上有些不大好，到底是怎么样？”尤氏道：“他这个病得的也奇。上月中秋还跟着老太太、太太玩了半夜，回家来好好的。到了二十日以后，一日比一日觉懒了，又懒怠吃东西，这将近有半个多月。经期又有两个月没来。”邢夫人接着说道：“不要是喜罢？”正说着，外头人回道：“大老爷、二老爷并一家的爷们都来了，在厅上呢。”贾珍连忙出去了。这里尤氏复说：“从前大夫也有说是喜的。昨日冯紫英荐了他幼时从学过的一个先生，医道很好，瞧…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，贾蓉进来，给邢夫人、王夫人、凤姐儿都请了安，方回尤氏道：“方才我给太爷送吃食去，并说我父亲在家伺候老爷们，款待一家子爷们，遵太爷话，并不敢来。太爷听了很喜欢，说：‘这才是。’叫告诉父亲母亲，好生伺候太爷太太们。叫我好生伺候叔叔婶子并哥哥们。还说：‘那《阴骘文》叫他们急急刻出来，印一万张散人。’我将这话都回了我父亲了。我这会子还得快出去打发太爷们并合家爷们吃饭。”凤姐儿说：“蓉哥儿，你且站着。你媳妇今日到底是怎么着？”贾蓉皱皱眉儿…","so":0,"eo":0},{"surface":"凤姐","text":"尤氏的母亲并邢夫人、王夫人、凤姐儿都吃了饭，批口净了手。才说要往园子里去，贾蓉进来向尤氏道：“老爷们并各位叔叔哥哥们都吃了饭了。大老爷说家里有事，二老爷是不爱听戏，又怕人闹的慌，都去了。别的一家子爷们被琏二叔并蔷大爷都让过去听戏去了。方才南安郡王、东平郡王、西宁郡王、北静郡王四家王爷，并镇国公牛府等六家、忠靖侯史府等人家，都差人持名帖送寿礼来，俱回了我父亲，收在账房里。礼单都上了档子了，领谢名帖都交给各家的来人了，来人也各照例赏过，都让…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉也要跟着凤姐儿去瞧秦氏。王夫人道：“你看看就过来罢，那是侄儿媳妇呢。”于是尤氏请了王夫人、邢夫人并他母亲，都过会芳园去了，凤姐儿宝玉方和贾蓉到秦氏这边来。进了房门，悄悄的走到里间房内，秦氏见了要站起来。凤姐儿说：“快别起来，看头晕。”于是凤姐儿紧行了两步，拉住了秦氏的手，说道：“我的奶奶！怎么几日不见，就瘦的这样了！”于是就坐在秦氏坐的褥子上。宝玉也问了好，在对面椅子上坐了。贾蓉叫：“快倒茶来，婶子和二叔在上房还未吃茶呢。”","so":0,"eo":0},{"surface":"凤姐","text":"秦氏拉着凤姐儿的手，强笑道：“这都是我没福。这样人家，公公婆婆当自家的女孩儿似的待。婶娘你侄儿虽说年轻，却是他敬我，我敬他，从来没有红过脸儿。就是一家子的长辈同辈之中，除了婶子不用说了，别人也从无不疼我的，也从无不和我好的。如今得了这个病，把我那要强心一分也没有。公婆面前未得孝顺一天，婶娘这样疼我，我就有十分孝顺的心，如今也不能够了。我自想着，未必熬得过年去。”","so":0,"eo":0},{"surface":"凤姐","text":"宝玉正把眼瞅着那《海棠春睡图》并那秦太虚写的“嫩寒锁梦因春冷，芳气袭人是酒香”的对联，不觉想起在这里睡晌觉时梦到“太虚幻境”的事来，正在出神。听得秦氏说了这些话，如万箭攒心，那眼泪不觉流下来了。凤姐儿见了，心中十分难过，但恐病人见了这个样子反添心酸，倒不是来开导他的意思了，因说：“宝玉，你忒婆婆妈妈的了。他病人不过是这样说，那里就到这个田地？况且年纪又不大，略病病儿就好了。”又回向秦氏道：“你别胡思乱想，岂不是自己添病了么？”贾蓉道：“…","so":0,"eo":0},{"surface":"凤姐","text":"这里凤姐儿又劝解了一番，又低低说许多衷肠话儿。尤氏打发人来两三遍，凤姐儿才向秦氏说道：“你好生养着，我再来看你罢。合该你这病要好了，所以前日遇着这个好大夫，再也是不怕的了。”秦氏笑道：“任凭他是神仙，‘治了病治不了命’。婶子，我知道这病不过是挨日子的。”凤姐说道：“你只管这么想，这那里能好呢？总要想开了才好。况且听得大夫说，若是不治，怕的是春天不好。咱们若是不能吃人参的人家，也难说了；你公公婆婆听见治得好，别说一日二钱人参，就是二斤也吃…","so":0,"eo":0}]},{"chap":12,"ctitle":"第12章 王熙凤毒设相思局 贾天祥正照风月鉴","deeds":[{"surface":"凤姐","text":"话说凤姐正与平儿说话，只见有人回说：“瑞大爷来了。”凤姐命：“请进来罢。”贾瑞见请，心中暗喜，见了凤姐，满面陪笑，连连问好。凤姐儿也假意殷勤让坐让茶。贾瑞见凤姐如此打扮，越发酥倒，因饧了眼问道：“二哥哥怎么还不回来？”凤姐道：“不知什么缘故。”贾瑞笑道：“别是路上有人绊住了脚，舍不得回来了罢？”凤姐道：“可知男人家见一个爱一个也是有的。”贾瑞笑道：“嫂子这话错了，我就不是这样人。”凤姐笑道：“象你这样的人能有几个呢，十个里也挑不出一个来…","so":0,"eo":0},{"surface":"凤姐","text":"贾瑞听这话，越发撞在心坎上，由不得又往前凑一凑，觑着眼看凤姐的荷包，又问：“戴着什么戒指？”凤姐悄悄的道：“放尊重些，别叫丫头们看见了。”贾瑞如听纶音佛语一般，忙往后退。凤姐笑道：“你该去了。”贾瑞道：“我再坐一坐儿，好狠心的嫂子！”凤姐儿又悄俏的道：“大天白日人来人往，你就在这里也不方便。你且去，等到晚上起了更你来，悄悄的在西边穿堂儿等我。”贾瑞听了，如得珍宝，忙问道：“你别哄我。但是那里人过的多，怎么好躲呢？”凤姐道：“你只放心，我…","so":0,"eo":0},{"surface":"凤姐","text":"盼到晚上，果然黑地里摸人荣府，趁掩门时钻入穿堂。果见漆黑无一人来往，贾母那边去的门已倒锁了，只有向东的门未关。贾瑞侧耳听着，半日不见人来。忽听咯噔一声，东边的门也关上了。贾瑞急的也不敢则声，只得悄悄出来，将门撼了撼，关得铁捅一般，此时要出去亦不能了，南北俱是大墙，要跳也无攀援。这屋内又是过堂风，空落落的。现是腊月天气，夜又长，朔风凛凛，侵肌裂骨，一夜几乎不曾冻死。好容易盼到早晨，只见一个老婆子先将东门开了进来，去叫西门，贾瑞瞅他背着脸，…","so":0,"eo":0},{"surface":"凤姐","text":"那贾瑞只盼不到晚，偏偏家里亲戚又来了，吃了晚饭才去，那天已有掌灯时候；又等他祖父安歇，方溜进荣府，往那夹道中屋子里来等着，热锅上蚂蚁一般。只是左等不见人影，右听也没声响，心中害怕，不住猜疑道：“别是不来了，又冻我一夜不成？”正自胡猜，只见黑黝黝的进来一个人。贾瑞便打定是凤姐，不管青红皂白，那人刚到面前，便如饿虎扑食，猫儿捕鼠的一般抱住，叫道：“亲嫂子，等死我了！”说着，抱到屋里炕上就亲嘴扯裤子，满口里“亲爹”“亲娘”的乱叫起来。那人只不…","so":0,"eo":0},{"surface":"凤姐","text":"贾瑞不看则已，看了时真羞的无地可入。你道是谁？却是贾蓉。贾瑞回身要跑，被贾蔷一把揪住道：“别走！如今琏二婶子已经告到太太眼前，说你调戏他，他暂时稳住你在这里。太太听见气死过去了，这会子叫我来拿你。快跟我走罢！”贾瑞听了，魂不附体，只说：“好侄儿！你只说没有我，我明日重重的谢你！”贾蔷道：“放你不值什么，只不知你谢我多少？况且口说无凭，写一张文契才算。”贾瑞道：“这怎么落纸呢？”贾蔷道：“这也不妨，写个赌钱输了，借银若干两就完了。”贾瑞道…","so":0,"eo":0},{"surface":"凤姐","text":"贾瑞此时身不由己，只得蹲在那台阶下。正要盘算，只听头顶上一声响，哗喇喇一净桶尿粪从上面直泼下来，可巧浇了他一身一头。贾瑞掌不住“嗳哟”一声，忙又掩住口，不敢声张，满头满脸皆是尿屎，浑身冰冷打战。只见贾蔷跑来叫：“快走，快走！”贾瑞方得了命，三步两步从后门跑到家中，天已三更，只得叫开了门。家人见他这般光景，问：“是怎么了？”少不得撒谎说：“天黑了，失脚掉在茅厕里了。”一面即到自己房中更衣洗濯。心下方想到凤姐玩他，因此发一回狠。再想想凤姐的…","so":0,"eo":0},{"surface":"凤姐","text":"贾蓉等两个常常来要银子，他又怕祖父知道。正是相思尚且难禁，况又添了债务，日间工课又紧，他二十来岁的人，尚末娶亲，想着凤姐不得到手，自不免有些“指头儿告了消乏”，更兼两回冻恼奔波。因此，三五下里夹攻，不觉就得了一病。心内发膨胀，口内无滋味，脚下如绵，眼中似醋，黑夜作烧，白日常倦，下溺遗精，嗽痰带血，诸如此症，不上一年都添全了。于是不能支持，一头躺倒，合上眼还只梦魂颠倒，满口胡话，惊怖异常。百般请医疗治，诸如肉桂、附子、鳖甲、麦冬、玉竹等药…","so":0,"eo":0},{"surface":"凤姐","text":"倏又腊尽春回，这病更加沉重。代儒也着了忙，各处请医疗治，皆不见效。因后来吃“独参汤”，代儒如何有这力量，只得往荣府里来寻。王夫人命凤姐秤二两给他。凤姐回说：“前儿新近替老太太配了药，那整的太太又说留着送杨提督的太太配药，偏偏昨儿我已经叫人送了去了。”王夫人道：“就是咱们这边没了，你叫个人往你婆婆那里问问，或是你珍大哥哥那里有，寻些来凑着给人家。吃好了，救人一命，也是你们的好处。”凤姐应了，也不遣人去寻。只将些渣末凑了几钱，命人送去，只说…","so":0,"eo":0}]},{"chap":13,"ctitle":"第13章 秦可卿死封龙禁尉 王熙凤协理宁国府","deeds":[{"surface":"凤姐","text":"话说凤姐儿，自贾琏送黛玉往扬州去后，心中实在无趣，每到晚间不过同平儿说笑一回，就胡乱睡了。这日夜间和平儿灯下拥炉，早命浓熏绣被，二人睡下，屈指计算行程该到何处。不知不觉已交三鼓，平儿已睡熟了。凤姐方觉睡眼微蒙，恍惚只见秦氏从外走进来，含笑说道：“婶娘好睡！我今日回去，你也不送我一程。因娘儿们素日相好，我舍不得婶娘，故来别你一别。还有一件心愿未了，非告诉婶娘，别人未必中用。”凤姐听了，恍惚问道：“有何心愿？只管托我就是了。”秦氏道：“婶娘…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐还欲问时，只听二门上传出云板，连叩四下，正是丧音，将凤姐惊醒。人回：“东府蓉大奶奶没了。”凤姐吓了一身冷汗，出了一回神，只得忙穿衣服往王夫人处来。彼时合家皆知，无不纳闷，都有些伤心。那长一辈的想他素日孝顺，平辈的想他素日和睦亲密，下一辈的想他素日慈爱，以及家中仆从老小想他素日怜贫惜贱、爱老慈幼之恩，莫不悲号痛哭。闲言少叙，却说宝玉因近日林黛玉回去，剩得自己落单，也不和人玩耍，每到晚间，便索然睡了。如今从梦中听见说秦氏死了，连忙翻身爬…","so":0,"eo":0},{"surface":"凤姐","text":"接着又吆喝道之声，原来是忠靖侯史鼎的夫人，带着侄女史湘云来了。王夫人、邢夫人、凤姐等刚迎入正房，又见锦乡侯、川宁侯、寿山伯三家祭礼也摆在灵前。少时，三人下轿，贾珍接上大厅。如此亲朋你来我去，也不能计数。只这四十九日，宁国府街上一条白漫漫人来人往，花簇簇官去官来。","so":0,"eo":0},{"surface":"凤姐","text":"可巧这日非正经日期，亲友来的少，里面不过几位近亲堂客，邢夫人、王夫人、凤姐并合族中的内眷陪坐。闻人报：“大爷进来了。”唬的众婆娘“唿”的一声，往后藏之不迭。独凤姐款款站了起来。贾珍此时也有些病症在身，二则过于悲痛，因拄个拐踱了进来。邢夫人等因说道：“你身上不好，又连日多事，该歇歇才是，又进来做什么？”贾珍一面拄拐，扎挣着要蹲身跪下请安道乏，邢夫人等忙叫宝玉搀住，命人拿椅子与他坐。贾珍不肯坐，因勉强陪笑道：“侄儿进来有一件事要求二位婶娘、…","so":0,"eo":0},{"surface":"凤姐","text":"王夫人心中为的是凤姐未经过丧事，怕他料理不起，被人见笑。今见贾珍苦苦的说，心中已活了几分，却又眼看着凤姐出神。那凤姐素日最喜揽事，好卖弄能干，今见贾珍如此央他，心中早已允了。又见王夫人有活动之意，便向王夫人道：“大哥说得如此恳切，太太就依了罢。”王夫人悄悄的问道：“你可能么？”凤姐道：“有什么不能的。外面的大事已经大哥哥料理清了，不过是里面照管照管。便是我有不知的，问太太就是了。”王夫人见说得有理，便不出声。贾珍见凤姐允了，又陪笑道：“…","so":0,"eo":0},{"surface":"凤姐","text":"贾珍便命人取了宁国府的对牌来，命宝玉送与凤姐，说道：“妹妹爱怎么就怎么样办，要什么，只管拿这个取去，也不必问我。只求别存心替我省钱，要好看为上；二则也同那府里一样待人才好，不要存心怕人抱怨。只这两件外，我再没不放心的了。”凤姐不敢就接牌，只看着王夫人，王夫人道：“你大哥既这么说，你就照看照看罢了。只是别自作主意，有了事打发人问你哥哥嫂子一声儿要紧。”宝玉早向贾珍手里接过对牌来，强递与凤姐了。贾珍又问：“妹妹还是住在这里，还是天天来呢？若…","so":0,"eo":0},{"surface":"凤姐","text":"一时女眷散后，王夫人因问凤姐：“你今儿怎么样？”凤姐道：“太太只管请回去；我须得先理出一个头绪来才回得去呢。”王夫人听说，便先同邢夫人回去，不在话下。这里凤姐来至三间一所抱厦中坐了。因想，头一件是人口混杂，遗失东西；二件，事无专管，临期推委；三件，需用过费，滥支冒领；四件，任无大小，苦乐不均；五件，家人豪纵，有脸者不能服钤束，无脸者不能上进。此五件实是宁府中风俗。","so":0,"eo":0},{"surface":"凤姐","text":"不知凤姐如何处治，且听下回分解。","so":0,"eo":0}]},{"chap":14,"ctitle":"第14章 林如海灵返苏州郡 贾宝玉路遏北静王","deeds":[{"surface":"凤姐","text":"话说宁国府中都总管赖升闻知里面委请了凤姐，因传齐同事人等，说道：“如今请了西府里琏二奶奶管理内事，倘或他来支取东西，或是说话，小心伺候才好。每日大家早来晚散，宁可辛苦这一个月，过后再歇息，别把老脸面扔了。那是个有名的烈货，脸酸心硬，一时恼了不认人的。”众人都道：“说的是。”又有一个笑道：“论理，我们里头也得他来整治整治，都忒不象了。”正说着，只见来旺媳妇拿了对牌来领呈文经文榜纸，票上开着数目。众人连忙让坐倒茶，一面命人按数取纸。来旺抱着…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐即命彩明钉造册簿，即时传了赖升媳妇，要家花名册查看，又限明日一早传齐家人媳妇进府听差。大概点了一点数目单册，问了赖升媳妇几句话，便坐车回家。至次日卯正二刻，便过来了。那宁国府中老婆媳妇早已到齐，只见凤姐和赖升媳妇分派众人执事，不敢擅入，在窗外打听。听见凤姐和赖升媳妇道：“既托了我，我就说不得要你们嫌了。我可比不得你们奶奶好性儿，造事由得你们。再别说你们‘这府里原是这么样’的话，如今可要依着我行。错我一点儿，管不得谁是有脸的，谁是没脸…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐自己威重令行，心中十分得意。因见尤氏犯病，贾珍也过于悲哀，不大进饮食，自己每日从那府中熬了各样细粥，精美小菜，令人送过来。贾珍也另外吩咐，每日送上等菜到抱厦内，单预备凤姐。凤姐不畏勤劳，天天按时刻过来，点卯理事，独在抱厦内起坐，不与众妯娌合群，便有女眷来往也不迎送。","so":0,"eo":0},{"surface":"凤姐","text":"这日乃五七正五日上，那应佛僧正开方破狱，传灯照亡，参阎君，拘都鬼，延请地藏王，开金桥，引幢蟠；那道士们正伏章申表，朝三清，叩玉帝；神僧们行香，放焰口，拜水忏；又有十二众青年尼僧，搭绣衣，红鞋，在灵前默诵接引诸咒，十分热闹。那凤姐知道今日的客不少，寅正便起来梳洗。及收拾完备，更衣盥手，喝了几口奶子，漱口已毕，正是卯正二刻了。来旺媳妇率领众人伺候已久。凤姐出至厅前，上了车，前面一对明角灯，上写“荣国府”三个大字。来至宁府大门首，门灯朗挂，两…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐方欲说话，只见荣国府的四个执事人进来，都是支取东西领牌的，凤姐问他们要了帖，念过听了，一共四件，因指两件道：“这个开销错了，再算清了来领。”说着将帖子摔下来。那二人扫兴而去。凤姐因见张材家的在旁，便问：“你有什么事？”张材家的忙取帖子回道：“就是方才车轿围子做成，领取裁缝工银若干两。”凤姐听了，收了帖子，命彩明登记，待王兴交过，得了买办的回押相符，然后与张材家的去领。一面又命念那一件，是为宝玉外书房完竣，支领买纸料糊裱祷，凤姐听了，…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐便说道：“明儿他也来迟了，后儿我也来迟了，将来都没有人了。本来要饶你，只是我头一次宽了，下次就难管别人了，不如开发了好。”登时放下脸来，叫“带出去打他二十板子！”众人见凤姐动怒，不敢怠慢，拉出去照数打了，进来回覆。凤姐又掷下宁府对牌：“说与赖升，革他一个月的钱粮。”吩咐“散了罢。”众人方各自办事去了。那被打的也含羞饮泣而去。彼时荣宁两处领牌交牌人往来不绝，凤姐又一一开发了。于是宁府中人才知凤姐利害，彼此俱各兢兢业业，不敢偷安，不在话…","so":0,"eo":0},{"surface":"凤姐","text":"如今且说宝玉，因见人众，恐秦钟受委曲，遂同他往凤姐处坐坐。凤姐正吃饭，见他们来了，笑道：“好长腿子，快上来罢。”宝玉道：“我们偏了。”凤姐道：“在这边外头吃的，还是那边吃的？”宝玉道：“同那些浑人吃什么！还是那边跟着老太太吃了来的。”说着，一面归坐。","so":0,"eo":0},{"surface":"凤姐","text":"凤姐饭毕，就有宁府一个媳妇来领牌，为支取香灯，凤姐笑道：“我算着你今儿该来支取，想是忘了。要终久忘了，自然是你包出来，都便宜了我。”那媳妇笑道：“何尝不是忘了，方才想起来，再迟一步也领不成了。”说毕，领牌而去。一时登记交牌。秦钟因笑道：“你们两府里都是这牌，倘别人私造一个，支了银子去．怎么好！”凤姐笑道：“依你说，都没王法了！”宝玉因道：“怎么咱们家没人来牌子支东西？”凤姐道：“他们来领的时候，你还做梦呢。我且问你，你们多早晚才念夜书呢…","so":0,"eo":0}]},{"chap":15,"ctitle":"第15章 王凤姐弄权铁槛寺 秦鲸卿得趣馒头庵","deeds":[{"surface":"凤姐","text":"且说宁府送殡，一路热闹非常。刚至城门，又有贾赦、贾政、贾珍诸同寅属下各家祭棚接祭，一一的谢过，然后出城，竟奔铁槛寺大路而来。彼时贾珍带着贾蓉来到诸长辈前让坐轿上马，因而贾赦一辈的各自上了车轿，贾珍一辈的也将要上马。凤姐因惦记着宝玉，怕他在郊外纵性不服家人的话，贾政管不着，惟恐有闪失，因此命小厮来唤他。宝玉只得到他车前。凤姐笑道：“好兄弟，你是个尊贵人，和女孩儿似的人品，别学他们猴在马上。下来，咱们姐儿两个同坐车好不好？”宝玉听说，便下了…","so":0,"eo":0},{"surface":"凤姐","text":"不一时，只见那边两骑马直奔凤姐车来，下马扶车回道：“这里有下处，奶奶请歇歇更衣。”凤姐命请邢、王二夫人示下，那二人回说：“太太们说不歇了，叫奶奶自便罢。”凤姐便命歇歇再走。小厮带着轿马岔出人群，往北而来。宝玉忙命人去请秦钟。那时秦钟正骑着马随他父亲的轿，忽见宝玉的小厮跑来请他去打尖。秦钟远看着宝玉所骑的马，搭着鞍笼，随着凤姐的车往北而去，便知宝玉同凤姐一车，自己也带马赶上来，同入一庄门内。","so":0,"eo":0},{"surface":"凤姐","text":"那庄农人家，无多房舍，妇女无处回避。那些村姑野妇见了凤姐、宝玉、秦钟的人品衣服，几疑天人下降。凤姐进入茅屋，先命宝玉等出去玩玩。宝玉会意，因同秦钟带了小厮们各处游玩。凡庄家动用之物，俱不曾见过的，宝玉见了，都以为奇，不知何名何用。小厮中有知道的，一一告诉了名色并其用处。宝玉听了，因点头道：“怪道古人诗上说：‘谁知盘中餐，粒粒皆辛苦。’正为此也。”一面说，一面又到一间房内。见炕上有个纺车儿，越发以为稀奇。小厮们又说：“是纺线织布的。”宝玉…","so":0,"eo":0},{"surface":"凤姐","text":"说笑间，已赶上大殡。早又前面法鼓金铙，幢幢宝盖，铁槛寺中僧众摆列路旁。少时到了寺中，另演佛事，重设香坛。安灵于内殿偏室之中，宝珠安理寝室为伴。外面贾珍款待一应亲友，也有坐住的，也有告辞的，一一谢了乏，从公、侯、伯、子、男，一起一起的散，至未末方散尽了。里面的堂客皆是凤姐接待，先从诰命散起，也到未正上下方散完了。只有几个近亲本族，等做过三日道场方去的。那时邢、王二夫人知凤姐必不能回家，便要带了宝玉同进城去。那宝玉乍到郊外，那里肯回去？只要…","so":0,"eo":0},{"surface":"凤姐","text":"原来这铁槛寺是宁、荣二公当日修造的，现今还有香火地亩，以备京中老了人口，在此停灵。其中阴阳两宅俱是预备妥贴的，好为送灵人口寄居。不想如今后人繁盛，其中贫富不一，或性情参商。有那家道艰难的，便住在这里了，有那有钱有势尚排场的，只说这里不方便，一定另外或村庄或尼庵寻个下处，为事毕宴退之所。即今秦氏之丧，族中诸人，也有在铁槛寺的，也有别寻下处的。凤姐也嫌不方便，因遣人来和馒头庵的姑子静虚说了，腾出几间房来预备。原来这馒头庵和水月寺一势，因他庙…","so":0,"eo":0},{"surface":"凤姐","text":"不言老尼陪着凤姐。且说那秦钟宝玉二人正在殿上玩耍，因见智能儿过来，宝玉笑道：“能儿来了。”秦钟说：“理他作什么？”宝玉笑道：“你别弄鬼儿，那一日在老太太屋里，一个人没有，你搂着他作什么呢？这会子还哄我！”秦钟笑道：“这可是没有的话。”宝玉道：“有没有也不管你，你只叫他倒碗茶来我喝，就撂过手。”秦钟笑道：“这又奇了，你叫他倒去，还怕他不倒？何用我说呢！”宝玉道：“我叫他倒的是无情意的，不及你叫他倒的是有情意的。”秦钟没法，只得说道：“能儿…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐也便回至净室歇息，老尼相伴。此时众婆子媳妇见无事，都陆续散了自去歇息，跟前不过几个心腹小丫头，老尼便趁机说道：“我有一事，要到府里求太太，先请奶奶的示下。”凤姐问道：“什么事？”老尼道：“阿弥陀佛！只因当日我先在长安县善才庵里出家的时候儿，有个施主姓张，是大财主。他的女孩儿小名金哥，那年都往我庙里来进香，不想遇见长安府太爷的小舅子李少爷。那李少爷一眼看见金哥就爱上了，立刻打发人来求亲，不想金哥已受了原任长安守备公子的聘定。张家欲待退…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐听了这话，便发了兴头，说道：“你是素日知道我的，从来不信什么阴司地狱报应的，凭是什么事，我说要行就行。你叫他拿三千两银子来，我就替他出这口气。”老尼听说，喜之不胜，忙说：“有！有！这个不难。”凤姐又道：“我比不得他们扯篷拉纤的图银子。这三千两银子，不过是给打发说去的小厮们作盘缠，使他赚几个辛苦钱儿，我一个钱也不要。就是三万两我此刻还拿的出来。”老尼忙答应道：“既如此，奶奶明天就开恩罢了。”凤姐道：“你瞧瞧我忙的，那一处少的了我？我既…","so":0,"eo":0}]},{"chap":16,"ctitle":"第16章 贾元春才选凤藻宫 秦鲸卿夭逝黄泉路","deeds":[{"surface":"凤姐","text":"且说秦钟、宝玉二人跟着凤姐自铁槛寺照应一番，坐车进城，到家见过贾母、王夫人等，回到自己房中，一夜无话。至次日，宝玉见收拾了外书房，约定了和秦钟念夜书。偏偏那秦钟秉赋最弱，因在郊外受了些风霜，又与智能儿几次偷期缱绻，未免失于检点，回来时便咳嗽伤风，饮食懒进，大有不胜之态，只在家中调养，不能上学。宝玉便扫了兴，然亦无法，只得候他病痊再议。","so":0,"eo":0},{"surface":"凤姐","text":"那凤姐却已得了云光的回信，俱已妥协，老尼达知张家，那守备无奈何，忍气吞声受了前聘之物。谁知爱势贪财的父母，却养了一个知义多情的女儿，闻得退了前夫，另许李门，他便一条汗巾悄悄的寻了自尽。那守备之子谁知也是个情种，闻知金哥自溢，遂投河而死。可怜张、李二家没趣，真是“人财两空”。这里凤姐却安享了三千两。王夫人连一点消息也不知。自此凤姐胆识愈壮，以后所作所为，诸如此类，不可胜数。","so":0,"eo":0},{"surface":"凤姐","text":"贾母等合家人心俱惶惶不定，不住的使人飞马来往探信。有两个时辰，忽见赖大等三四个管家喘吁吁跑进仪门，报喜，又说：“奉老爷的命，就请老太太率领太太等进宫谢恩呢。”那时贾母心神不定，在大堂廊下伫候，邢、王二夫人、尤氏、李执、凤姐、迎春妹妹以及薛姨妈等，皆聚在一处打听信息。贾母又唤进赖大来细问端底，赖大道：“奴才们只在外朝房伺候着，里头的信息一概不知。后来夏太监出来道喜，说咱们家的大姑奶奶封为凤藻宫尚书，加封贤德妃。后来老爷出来也这么吩咐。如今…","so":0,"eo":0},{"surface":"凤姐","text":"且说贾琏自回家见过众人，回至房中，正值凤姐事繁，无片刻闲空，见贾琏远路归来，少不得拨冗接待。因房内别无外人，便笑道：“国舅老爷大喜！国舅老爷一路风尘辛苦！小的听见昨日的头起报马来说，今日大驾归府，略预备了一杯水酒掸尘，不知可赐光谬领否？”贾琏笑道：“岂敢，岂敢！多承，多承！”一面平儿与众丫鬟参见毕，端上茶来。贾琏遂问别后家中诸事，又谢凤姐的辛苦。凤姐道：“我那里管的上这些事来！见识又浅，嘴又笨，心又直，人家给个棒槌，我就拿着认作针了。脸…","so":0,"eo":0},{"surface":"凤姐","text":"说着，只听外间有人说话，凤姐便问：“是谁？”平儿进来回道：“姨太太打发香菱妹子来问我一句话，我已经说了，打发他回去了。”贾琏笑道：“正是呢。我才见姨妈去，和一个年轻的小媳妇子刚走了个对脸儿，长得好齐整模样儿。我想咱们家没这个人哪，说话时问姨妈，才知道是打官司的那小丫头子，叫什么香菱，竟给薛大傻子作了屋里人。开了脸，越发出挑的标致了。那薛大傻子真玷辱了他！”凤姐把嘴一撇，道：“哎！往苏杭走了一趟回来，也该见点世面了，还是这么眼馋肚饱的。你…","so":0,"eo":0},{"surface":"凤姐","text":"这里凤姐因问平儿：“方才姑妈有什么事，巴巴儿的打发香菱来？”平儿道：“那里来的香菱！是我借他暂撒个谎儿。奶奶瞧，旺儿嫂子越发连个算计儿也没了。”说着，又走至凤姐身边，悄悄说道：“那项利银早不送来，晚不送来，这会子二爷在家，他偏送这个来了。幸亏我在堂屋里碰见了，不然他走了来回奶奶，叫二爷要是知道了，咱们二爷那脾气，油锅里的还要捞出来花呢，知道奶奶有了体己，他还不大着胆子花么？所以我赶着接过来，叫我说了他两句，谁知奶奶偏听见了。为什么当着二…","so":0,"eo":0},{"surface":"凤姐","text":"说着贾琏已进来了，凤姐命摆上酒馔来，夫妻对坐。凤姐虽善饮，却不敢任兴。正喝着，见贾琏的乳母赵嬷嬷走来。贾琏、凤姐忙让吃酒，叫他上炕去。赵嬷嬷执意不肯。平儿等早于炕沿设下一几，摆一脚踏，赵嬷嬷在脚踏上坐了，贾琏向桌上拣两盘肴馔与他，放在几上自吃。凤姐又道：“妈妈很嚼不动那个，没的倒硌了他的牙。”因问平儿道：“早起我说那一碗火腿炖的肘子很烂，正好给妈妈吃，你怎么不拿了去赶着叫他们热来？”又道：“妈妈，你尝一尝你儿子带来的惠泉酒。”赵嬷嬷道：…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏此时不好意思，只是讪笑道：“你们别胡说了，快盛饭来吃，还要到珍大爷那边去商量事呢。”凤姐道：“可是，别误了正事。才刚老爷叫你说什么？”贾琏道：“就为省亲的事。”凤姐忙问道：“省亲的事竟准了？”贾琏笑道：“虽不十分准，也有八九分了。”凤姐笑道：“可是当今的恩典呢！从来听书听戏，古时候儿也没有的。”赵嬷嬷又接道：“可是呢，我也老糊涂了！我听见上上下下吵嚷了这些日子，什么省亲不省亲，我也不理论；如今又说省亲，到底是怎么个缘故呢？”贾琏道：…","so":0,"eo":0}]},{"chap":18,"ctitle":"第18章 皇恩重元妃省父母 天伦乐宝玉呈才藻","deeds":[{"surface":"凤姐","text":"话说彼时有人回，工程上等着糊东西的纱绫，请凤姐去开库。又有人来回，请凤姐收金银器皿。王夫人并上房丫鬟等皆不得空儿。宝钗因说道：“咱们别在这里碍手碍脚。”说着，和宝玉等便往迎春房中来。","so":0,"eo":0},{"surface":"凤姐","text":"至十五日五鼓，自贾母等有爵者，俱各按品大妆。此时园内帐舞蟠龙，帘飞绣凤，金银焕彩，珠宝生辉，鼎焚百合之香，瓶插长春之蕊，静悄悄无一人咳嗽。贾赦等在西街门外，贾母等在荣府大门外。街头巷口，用围幕挡严。正等的不耐烦，忽见一个太监骑着匹马来了，贾政接着，问其消息。太监道：“早多着呢！未初用晚膳，末正还到宝灵宫拜佛，酉初进大明宫领宴看灯方请旨。只怕戌初才起身呢。”凤姐听了道：“既这样，老太太和太太且请回房，等到了时候再来也还不迟。”于是贾母等自…","so":0,"eo":0},{"surface":"凤姐","text":"尤氏、凤姐等上来启道：“筵宴齐备，请贵妃游幸。”元妃起身，命宝玉导引，遂同诸人步至园门前。早见灯光之中，诸般罗列，进园先从“有凤来仪”、“红香绿玉”、“杏帘在望”、“蘅芷清芬”等处，登楼步阁，涉水缘山，眺览徘徊。一处处铺陈华丽，一桩桩点缀新奇。元妃极加奖赞，又劝：“以后不可太奢了，此皆过分。”既而来至正殿，降谕免礼归坐，大开筵宴，贾母等在下相陪，尤氏、李纨、凤姐等捧羹把盏。","so":0,"eo":0},{"surface":"凤姐","text":"少时，太监跪启：“赐物俱齐，请验按例行赏。”乃呈上略节。元妃从头看了无话，即命照此而行。太监下来，一一发放。原来贾母的是金玉如意各一柄，沉香拐杖一根，伽楠念珠一串，“富贵长春”宫缎四匹，“福寿长春“宫绸四匹，紫金“笔锭如意”锞十锭，“吉庆有余”银锞十锭。邢夫人等二分，只减了如意、拐、珠四样。贾敬、贾赦、贾政等每分御制新书二部，宝墨二匣．金银盏各二只，表礼按前。宝钗、黛玉诸妹妹等，每人新书一部，宝砚一方，新样格式金银锞二对。宝玉和贾兰是金…","so":0,"eo":0}]},{"chap":19,"ctitle":"第19章 情切切良宵花解语 意绵绵静日玉生香","deeds":[{"surface":"凤姐","text":"且说荣、宁二府中连日用尽心力，真是人人力倦，各各神疲，又将园中一应陈设动用之物，收拾了两三天方完。第一个凤姐事多任重，别人或可偷闲躲静，独他是不能脱得的，二则本性要强，不肯落人褒贬，只扎挣着与无事的人一样。第一个宝玉是极无事最闲暇的。偏这一早，袭人的母亲又亲来回过贾母，接袭人家去吃年茶，晚上才得回来。因此，宝玉只和众丫头们掷骰子赶围棋作戏。正在房内玩得没兴头，忽见丫头们来回说：“东府里珍大爷来请过去看戏，放花灯。”宝玉听了，便命换衣裳。…","so":0,"eo":0}]},{"chap":20,"ctitle":"第20章 王熙凤正言弹妒意 林黛玉俏语谑娇音","deeds":[{"surface":"凤姐","text":"可巧凤姐正在上房算了输赢账，听见后面一片声嚷，便知是李嬷嬷老病发了，又值他今儿输了钱，迁怒于人，排揎宝玉的丫头。便连忙赴过来拉了李嬷嬷，笑道：“妈妈别生气。大节下，老太太刚喜欢了一日。你是个老人家，别人吵，你还要管他们才是，难道你倒不知规矩，在这里嚷起来，叫老太太生气不成？你说谁不好，我替你打他；我屋里烧的滚热的野鸡，快跟了我喝酒去罢。”一面说，一面拉着走，又叫：“丰儿，替你李奶奶拿着拐棍子、擦眼泪的绢子。”那李嬷嬷脚不沾地跟了凤姐儿走…","so":0,"eo":0},{"surface":"凤姐","text":"贾环听了，只得回来。赵姨娘见他这般，因问：“是那里垫了踹窝来了？”贾环便说：“同宝姐姐玩来着。莺儿欺负我，赖我的钱；宝玉哥哥撵了我来了。”赵姨娘啐道：“谁叫你上高台盘了？下流没脸的东西！那里玩不得，谁叫你跑了去讨这没意思？”正说着，可巧凤姐在窗外过，都听到耳内，便隔着窗户说道：“大正月里，怎么了？兄弟们小孩子家，一半点儿错了，你只教导他，说这样话做什么？凭他怎么着，还有老爷太太管他呢，就大口家啐他？他现是主子，不好，横竖有教导他的人，与…","so":0,"eo":0}]},{"chap":21,"ctitle":"第21章 贤袭人娇嗔箴宝玉 俏平儿软语救贾琏","deeds":[{"surface":"凤姐","text":"话说史湘云说着笑着跑出来，怕黛玉赶上。宝玉在后忙说：“绊倒了！那里就赶上了？”黛玉赶到门前，被宝玉叉手在门框上拦住，笑道：“饶他这一遭儿罢。”黛玉拉着手说道：“我要饶了云儿，再不活着。”湘云见宝玉拦着门，料黛玉不能出来，便立住脚，笑道：“好姐姐，饶我这遭儿罢！”却值宝钗来在湘云身背后，也笑道：“我劝你们两个看宝兄弟面上，都撂开手罢。”黛玉道：“我不依。你们是一气的，都来戏弄我。”宝玉劝道：“罢哟，谁敢戏弄你？你不打趣他，他就敢说你了？”…","so":0,"eo":0},{"surface":"凤姐","text":"谁知凤姐之女大姐儿病了，正乱着请大夫诊脉。大夫说：“替太太奶奶们道喜，姐儿发热是见喜了，并非别症。”王夫人凤姐听了，忙遣人问：“可好不好？”大夫回道：“症虽险，却顺，倒还不妨。预备桑虫、猪尾要紧。”凤姐听了，登时忙将起来。一面打扫房屋，供奉“痘疹娘娘”；一而传与家人忌煎炒等物；一面命平儿打点铺盖衣服与贾琏隔房；一面又拿大红尺头给奶子丫头亲近人等裁衣裳。外面打扫净室，款留两位医生，轮流斟酌诊脉下药，十二日不放家去。贾琏只得搬出外书房来安歇…","so":0,"eo":0},{"surface":"凤姐","text":"那贾琏只离了凤姐，便要寻事，独寝了两夜十分难熬，只得暂将小厮内清俊的选来出火。不想荣国府内有一个极不成材破烂酒头厨子，名叫多官儿，因他懦弱无能，人都叫他作“多浑虫”。二年前他父亲给他娶了个媳妇，今年才二十岁，也有几分人材，又兼生性轻薄，最喜拈花惹草。多浑虫又不理论，只有酒有肉有钱，就诸事不管了，所以宁、荣二府之人都得入手。因这媳妇妖调异常，轻狂无比，众人都叫他“多姑娘儿”。如今贾琏在外熬煎，往日也见过这媳妇，垂涎久了，只是内惧娇妻，外惧…","so":0,"eo":0},{"surface":"凤姐","text":"一日大姐毒尽癍回，十二日后送了“娘娘”，合家祭天祀祖，还愿焚香，庆贺放赏已毕，贾琏仍复搬进卧室。见了凤姐，正是俗语云“新婚不如远别。”是夜更有无限恩爱，自不必说。次日早起，凤姐往上屋里去后，平儿收拾外边拿进来的衣服铺盖，不承望枕套中抖出一绺青丝来。平儿会意，忙藏在袖内，便走到这边房里，拿出头发来，向贾琏笑道：“这是什么东西？”贾琏一见，连忙上来要抢。平儿就跑，被贾琏一把揪住，按在炕上，从手中来夺。平儿笑道：“你这个没良心的，我好意瞒着他…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，凤姐走进院来，因见平儿在窗外，便问道：“要说话，怎么不在屋里说，又跑出来隔着窗户闹，这是什么意思？”贾琏在内接口道：“你可问他么，倒象屋里有老虎吃他呢。”平儿道：“屋里一个人没有，我在他跟前作什么？”凤姐笑道：“没人才便宜呢。”平儿听说，便道：“这话是说我么？”凤姐便笑道：“不说你说谁？”平儿道：“别叫我说出好话来了！”说着也不打帘子，赌气往那边去了。凤姐自己掀帘进来，说道：“平儿丫头疯魔了，这蹄子认真要降服起我来了！仔细你的皮…","so":0,"eo":0}]},{"chap":22,"ctitle":"第22章 听曲文宝玉悟禅机 制灯迷贾政悲谶语","deeds":[{"surface":"凤姐","text":"话说贾琏听凤姐儿说有话商量，因止步问：“什么话？”凤姐道：“二十一是薛妹妹的生日，你到底怎么样？”贾琏道：“我知道怎么样？你连多少大生日都料理过了，这会子倒没有主意了！”凤姐道：“大生日是有一定的则例。如今他这生日，大又不是，小又不是，所以和你商量。”贾琏听了，低头想了半日，道：“你竟糊涂了。现有比例，那林妹妹就是例。往年怎么给林妹妹做的，如今也照样给薛妹妹做就是了。”凤姐听了冷笑道：“我难道这个也不知道？我也这么想来着。但昨日听老太太…","so":0,"eo":0},{"surface":"凤姐","text":"谁想贾母自见宝钗来了，喜他稳重和平，正值他才过第一个生辰，便自己捐资二十两，唤了凤姐来，交与他备酒戏。凤姐凑趣，笑道：“一个老祖宗，给孩子们作生日，不拘怎么着，谁还敢争？又办什么酒席呢？既高兴，要热闹，就说不得自己花费几两老库里的体已。这早晚找出这霉烂的二十两银子来做东，意思还叫我们赔上！果然拿不出来也罢了，金的银的圆的扁的压塌了箱子底，只是累我们。老祖宗看看，谁不是你老人家的儿女？难道将来只有宝兄弟顶你老人家上五台山不成？那些东西只留…","so":0,"eo":0},{"surface":"凤姐","text":"吃了饭，点戏时，贾母，一面先叫宝钗点，宝钗推让一遍，无法，只得点了一出《西游记》，贾母自是喜欢。又让薛姨妈，薛姨妈见宝钗点了，不肯再点。贾母便特命凤姐点。凤姐虽有邢王二夫人在前，但因贾母之命，不敢违拗，且知贾母喜热闹更喜谑笑科诨，便先点了一出，却是《刘二当衣》。贾母果真更又喜欢。然后便命黛玉点，黛玉又让王夫人等先点。贾母道：“今儿原是我特带着你们取乐，咱们只管咱们的，别理他们。我巴巴儿的唱戏摆酒，为他们呢！他们白听戏白吃已经便宜了，还让…","so":0,"eo":0},{"surface":"凤姐","text":"贾母深爱那做小旦的和那做小丑的，因命人带进来，细看时，益发可怜见的。因问他年纪，那小旦才十一岁，小丑才九岁，大家叹息了一回。贾母令人另拿些肉果给他两个，又另赏钱。凤姐笑道：“这个孩子扮上活象一个人，你们再瞧不出来。”宝钗心内也知道，却点头不说；宝玉也点了点头儿不敢说。湘云便接口道：“我知道，是象林姐姐的摸样儿。”宝玉听了，忙把湘云瞅了一眼。众人听了这话，留神细看，都笑起来了，说：“果然象他！”一时散了。","so":0,"eo":0},{"surface":"凤姐","text":"这里贾母见贾政去了，便道：“你们乐一乐罢。”一语未了，只见宝玉跑至围屏灯前，指手画脚，信口批评：“这个这一句不好。”“那个破的不恰当。”如同开了锁的猴儿一般。黛玉便道：“还象方才大家坐着，说说笑笑，岂不斯文些儿？”凤姐儿自里间屋里出来，插口说道：“你这个人，就该老爷每日合你寸步儿不离才好。刚才我忘了，为什么不当着老爷，撺掇着叫你作诗谜儿？这会子不怕你不出汗呢。”说的宝玉急了，扯着凤姐儿厮缠了一会。贾母又和李宫裁并众秭妹等说笑了一会子，也…","so":0,"eo":0}]},{"chap":23,"ctitle":"第23章 西厢记妙词通戏语 牡丹亭艳曲警芳心","deeds":[{"surface":"凤姐","text":"且说那玉皇庙并达摩庵两处，一班的十二个小沙弥并十二个小道士，如今挪出大观园来，贾政正想发到各去分住。不想后街上住的贾芹之母杨氏，正打算到贾政这边谋一个大小事件与儿子管管，也好弄些银钱使用，可巧听见这事，便坐车来求凤姐。凤姐因见他素日嘴头儿乖滑，便依允了。想了几句话，便回了王夫人说：“这些小和尚小道士万不可打发到别处去，一时娘娘出来，就要应承的。倘或散了，若再用时，可又费事。依我的主意，不如将他们都送到家庙铁槛寺去，月间不过派一个人拿几两…","so":0,"eo":0},{"surface":"凤姐","text":"走到前面见了贾政，果然为小和尚的事。贾琏便依着凤姐的话，说道：“看来芹儿倒出息了，这件事竟交给他去管，横竖照里头的规例，每月支领就是了。”贾政原不大理论这些小事，听贾琏如此说，便依允了。贾琏回房告诉凤姐，凤姐即命人去告诉杨氏，贾芹便来见贾琏夫妻，感谢不尽。凤姐又做情先支三个月的费用，叫他写了领字，贾琏画了押，登时发了对牌出去，银库上按数发出三个月供给来，白花花三百两。贾芹随手拈了一块与掌平的人，叫他们“喝了茶罢”。于是命小厮拿了回家，与…","so":0,"eo":0}]},{"chap":24,"ctitle":"第24章 醉金刚轻财尚义侠 痴女儿遗帕惹相思","deeds":[{"surface":"凤姐","text":"话说黛玉正在情思萦逗、缠绵固结之时，忽有人从背后拍了一下，说道：“你作什么一个人在这里？”黛玉唬了一跳，回头看时，不是别人，却是香菱。黛玉道：“你这个傻丫头，冒冒失失的唬我一跳。这会子打那里来？”香菱嘻嘻的笑道：“我来找我们姑娘，总找不着。你们紫鹃也找你呢，说琏二奶奶送了什么茶叶来了。回家去坐着罢。”一面说，一面拉着黛玉的手，回潇湘馆来，果然凤姐送了两小瓶上用新茶叶来。黛玉和香菱坐了，谈讲些这一个绣的好，那一个扎的精，又下一回棋，看两句…","so":0,"eo":0},{"surface":"凤姐","text":"那天已是掌灯时候，贾芸吃了饭，收拾安歇，一宿无话。次日起来，洗了脸，便出南门大街，在香铺买了冰麝，往荣府来。打听贾琏出了门，贾芸便往后面来。到贾琏院门前，只见几个小厮，拿着大高的苕帚在那里扫院子呢。忽见周瑞家的从门里出来叫小厮们：“先别扫，奶奶出来了。”贾芸忙上去笑问道：“二婶娘那里去？”周瑞家的道：“老太太叫，想必是裁什么尺头。”正说着，只见一群人簇拥着凤姐出来了。贾芸深知凤姐是喜奉承爱排场的，忙把手逼着，恭恭敬敬抢上来请安。凤姐连正…","so":0,"eo":0},{"surface":"凤姐","text":"那贾芸一径回来。至次日，来至大门前，可巧遇见凤姐往那边去请安，才上了车，见贾芸过来，便命人叫住，隔着窗子笑道：“芸儿，你竟有胆子在我跟前弄鬼！怪道你送东西给我，原来你有事求我。昨儿你叔叔才告诉我，说你求他。”贾芸笑道：“求叔叔的事，婶娘别提，我这里正后悔呢。早知这样，我一起头儿就求婶娘，这会子早完了，谁承望叔叔竟不能的。”凤姐笑道：“哦！你那边没成儿，昨儿又来找我了？”贾芸道：“婶娘辜负了我的孝心。我并没有这个意思，要有这个意思，昨儿还…","so":0,"eo":0},{"surface":"凤姐","text":"贾芸喜不自禁，来至绮散斋打听宝玉，谁知宝玉一早便往北静王府里去了。贾芸便呆呆的坐到晌午。打听凤姐回来，去写个领票来领对牌，至院外，命人通报了，彩明走出来要了领票，进去批了银数、年月，一并连对牌交给贾芸。贾芸接来看那批上批着二百两银子，心中喜悦，翻身走到银库上领了银子，回家告诉他母亲，自是母子俱喜。次日五更，贾芸先找了倪二还了银子，又拿了五十两银子出西门找到花儿匠方椿家里去买树，不在话下。","so":0,"eo":0},{"surface":"凤姐","text":"秋纹、碧痕，一个抱怨“你湿了我的衣裳”，一个又说“你踹了我的鞋”。忽见走出一个人来接水，二人看时，不是别人，原来是小红。二人便都诧异，将水放下，忙进来看时，并没别人，只有宝玉，便心中俱不自在，只得且预备下洗澡之物。待宝玉脱了衣裳，二人便带上门出来，走到那边房内，找着小红，问他：“方才在屋里做什么？”小红道：“我何曾在屋里呢？因为我的绢子找不着，往后头找去，不想二爷要茶喝。叫姐姐们，一个儿也没有，我赶着进去倒了碗茶，姐姐们就来了。”秋纹兜…","so":0,"eo":0}]},{"chap":25,"ctitle":"第25章 魇魔法叔嫂逢五鬼 通灵玉蒙蔽遇双真","deeds":[{"surface":"凤姐","text":"过了一日，原来次日是王子腾夫人的寿诞，那里原打发人来请贾母、王夫人，王夫人见贾母不去，也不便去了。倒是薛姨妈同着凤姐儿并贾家三个妹妹、宝钗、宝玉，一齐都去了。至晚方回。","so":0,"eo":0},{"surface":"凤姐","text":"两人正说着，只见凤姐跟着王夫人都过来了。王夫人便一长一短问他今日是那几位堂客，戏文好歹，酒席如何。不多时，宝玉也来了，见了王夫人，也规规矩矩说了几句话，便命人除去了抹额，脱了袍服，拉了靴子，就一头滚在王夫人怀里。王夫人便用手摩掌抚弄他，宝玉也扳着王夫人的脖子说长说短的。王夫人道：“我的儿，又吃多了酒，脸上滚热的。你还只是揉搓，一会子闹上酒来！还不在那里静静的躺一会子去呢。”说着，便叫人拿枕头。宝玉因就在王夫人身后倒下，又叫彩霞来替他拍着…","so":0,"eo":0},{"surface":"凤姐","text":"只听宝玉“嗳哟”的一声，满屋里人都唬了一跳。连忙将地下的绰灯移过来一照，只见宝玉满脸是油。王夫人又气又急，忙命人替宝玉擦洗，一面骂贾环。凤姐三步两步上炕去替宝玉收拾着，一面说：“这老三还是这么‘毛脚鸡’似的。我说你上不得台盘！赵姨娘平时也该教导教导他！”一句话提醒了王夫人，遂叫过赵姨娘来，骂道：“养出这样黑心种子来，也不教训教训！几番几次我都不理论，你们一发得了意了，一发上来了！”那赵姨娘只得忍气吞声，也上去帮着他们替宝玉收拾。只见宝玉…","so":0,"eo":0},{"surface":"凤姐","text":"却说黛玉，因宝玉烫了脸不出门，倒常在一处说话儿。这日饭后，看了两篇书，又和紫鹃作了一会针线，总闷闷不舒，便出来看庭前才迸出的新笋。不觉出了院门，来到园中，四望无人，惟见花光鸟语，信步便往怡红院来。只见几个丫头舀水，都在游廊上看画眉洗澡呢。听见房内笑声，原来是李纨、凤姐、宝钗都在这里。一见他进来，都笑道：“这不又来了两个？”黛玉笑道：“今日齐全，谁下帖子请的？”凤姐道：“我前日打发人送了两瓶茶叶给姑娘，可还好么？”黛玉道：“我正忘了，多谢…","so":0,"eo":0},{"surface":"凤姐","text":"黛玉听了，笑道：“你们听听，这是吃了他一点子茶叶，就使唤起人来了。”凤姐笑道：“你既吃了我们家的茶，怎么还不给我们家作媳妇儿？”众人都大笑起来。黛玉涨红了脸，回过头去，一声儿不言语。宝钗笑道：“二嫂子的诙谐真是好的。”黛玉道：“什么诙谐！不过是贫嘴贱舌的讨人厌罢了！”说着又啐了一口。凤姐笑道：“你给我们家做了媳妇，还亏负你么？”指着宝玉道：“你瞧瞧人物儿配不上？门第儿配不上？根基儿家私儿配不上？那一点儿玷辱你？”黛玉起身便走。宝钗叫道：…","so":0,"eo":0},{"surface":"凤姐","text":"这里宝玉拉了黛玉的手，只是笑，又不说话。黛玉不觉又红了脸，挣着要走。宝玉道：“嗳哟！好头疼！”黛玉道：“该，阿弥陀佛！”宝玉大叫一声，将身一跳，离地有三四尺，口内乱嚷，尽是胡话。黛玉并众丫要都唬慌了，忙报知王夫人与贾母。此时王子腾的夫人也在这里，都一齐来看。宝玉一发拿刀弄杖，寻死觅活的，闹的天翻地覆。贾母、王夫人一见，唬的抖衣乱战，儿一声肉一声，放声大哭。于是惊动了众人，连贾赦，邢夫人、贾珍、贾政并琏、蓉、芸、萍、薛姨妈、薛蟠并周瑞家的…","so":0,"eo":0},{"surface":"凤姐","text":"看看三日光阴，凤姐宝玉躺在床上，连气息都微了。合家都说没了指望了，忙的将他二人的后事都治备下了，贾母、王夫人、贾琏、平儿、袭人等更哭的死去活来。只有赵姨娘外面假作忧愁，心中称愿。","so":0,"eo":0},{"surface":"凤姐","text":"凤姐、宝玉果一日好似一日的，渐渐醒来，知道饿了，贾母、王夫人才放心了。众妹妹都在外间听消息。黛玉先念了一声佛，宝钗笑而不言。惜春道：“宝姐姐笑什么？”宝钗道：“我笑如来佛比人还忙，又要度化众生，又要保佑人家病痛，都叫他速好。又要管人家的婚姻，叫他成就。你说可忙不忙？可好笑不好笑？”一时黛玉红了脸，啐了一口道：“你们都不是好人！再不跟着好人学，只跟着凤丫头学的贫嘴贱舌的。”一面说，一面掀帘子出去了。","so":0,"eo":0}]},{"chap":27,"ctitle":"第27章 滴翠亭杨妃戏彩蝶 埋香冢飞燕泣残红","deeds":[{"surface":"凤姐","text":"且说宝钗、迎春、探春、惜春、李执、凤姐等并大姐儿、香菱与众丫环们，都在园里玩耍，独不见黛玉，迎春因说道：“林妹妹怎么不见？好个懒丫头，这会子难道还睡觉不成？”宝钗道：“你们等着，等我去闹了他来。”说着，便撂下众人，一直往潇湘馆来。正走着，只见文官等十二个女孩子也来了，上来问了好，说了一回闲话儿，才走开。宝钗回身指道：“他们都在那里呢，你们找他们去，我找林姑娘去就来。”说着，逶迤往潇湘馆来。忽然抬头见宝玉进去了，宝钗便站住，低头想了一想：…","so":0,"eo":0},{"surface":"凤姐","text":"谁知小红听了宝钗的话，便信以为真，让宝钗去远，便拉坠儿道：“了不得了，林姑娘蹲在这里，一定听了话去了！”坠儿听了，也半日不言语。小红又道：“这可怎么样呢？”坠儿道：“听见了，管谁筋疼！各人干各人的就完了。”小红道：“要是宝姑娘听见还罢了。那林姑娘嘴里又爱克薄人，心里又细，他一听见了，倘或走露了，怎么样呢？”二人正说着，只见香菱、臻儿、司棋、侍书等上亭子来了。二人只得掩住这话，且和他们玩笑。只见凤姐站在山坡上招手儿，小红便连忙弃了众人，跑…","so":0,"eo":0},{"surface":"凤姐","text":"不多时回来，不见凤姐在山坡上了，因见司棋从山洞里出来，站着系带子，便起来问道：“姐姐，不知道二奶奶往那里去了？”司棋道：“没理论。”小红听了，回身又往四下里一看，只见那边探春、宝钗在池边看鱼，小红上来陪笑道：“姑娘们可知道二奶奶刚才那里去了？”探春道：“往你大奶奶院里找去。”小红听了，再往稻香村来，顶头见晴雯、绮霞、碧痕、秋纹、麝月、侍书、入画、莺儿等一群人来了。晴雯一见小红，便说道：“你只是疯罢！院子里花儿也不浇雀儿也不喂，茶炉子也不…","so":0,"eo":0},{"surface":"凤姐","text":"这里小红听了，不便分证，只得忍气来找凤姐。到了李氏房中，果见凤姐在这里和李氏说话儿呢。小红上来问道：“平姐姐说：奶奶刚出来了，他就把银子收起来了！才张材家的来取，当面秤了给他拿了去了。”说着，将荷包递上去。又道：“平姐姐叫我来回奶奶，才旺儿进来讨奶奶的示下，好往那家子去，平姐姐就把那话按着奶奶的主意打发他去了。”凤姐笑道：“他怎么按着我的主意打发去了呢？”小红道：“平姐姐说：‘我们奶奶问这里奶奶好。我们二爷没在家。虽然迟了两天，只管请奶…","so":0,"eo":0},{"surface":"凤姐","text":"小红听了，“扑哧”一笑。凤姐道：“你怎么笑？你说我年轻，比你能大几岁，就做你的妈了？你做春梦呢！你打听打听，这些人比你大的赶着我叫妈，我还不理呢，今儿抬举了你了。”小红笑道：“我不是笑这个，我笑奶奶认错了辈数儿了。我妈是奶奶的干女孩儿，这会子又认我做干女孩儿！”凤姐道：“谁是你妈？”李纨笑道：“你原来不认的他，他是林之孝的女孩儿。”凤姐听了十分诧异，因说道：“哦，是他的丫头啊。”又笑道：“林之孝两口子，都是锥子扎不出一声儿来的。我成日家…","so":0,"eo":0}]},{"chap":28,"ctitle":"第28章 蒋玉函情赠茜香罗 薛宝钗羞笼红麝串","deeds":[{"surface":"凤姐","text":"这里宝玉悲恸了一回，见黛玉去了，便知黛玉看见他躲开了，自己也觉无味。抖抖土起来，下山寻归旧路，往怡红院来。可巧看见黛玉在前头走．连忙赶上去，说道：“你且站着。我知道你不理我，我只说一句话，从今以后撩开手。”熏玉回头见是宝玉，待要不理他，听他说只说一句话，便道：“请说。”宝玉笑道：“两句话，说了你听不听呢？”黛玉听说，回头就走。宝玉在身后面叹道：“既有今日，何必当初？”黛玉听见这话，由不得站住，回头道：“当初怎么样？今日怎么样？”宝玉道：…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐因在里间屋里看着人放桌子，听如此说，便走来笑道：“宝兄弟不是撒谎，这倒是有的。前日薛大爷亲自和我来寻珍珠，我问他做什么，他说配药。他还抱怨说：‘不配也罢了，如今那里知道这么费事！’我问：‘什么药？’他说是宝兄弟说的方子，说了多少药，我也不记得。他又说：‘不是我就买几颗珍珠了，只是必要头上戴过的，所以才来寻几颗。要没有散的花儿，就是头上戴过的拆下来也使得。过后儿我拣好的再给穿了来。’我没法儿儿，只得把两枝珠子花儿现拆了给他。还要一块三…","so":0,"eo":0},{"surface":"凤姐","text":"一时吃过饭，宝玉一则怕贾母惦记，二则也想着黛玉，忙忙的要茶漱口。探春惜春都笑道：“二哥哥，你成日家忙的是什么？吃饭吃茶也是这么忙碌碌的。”宝钗笑道：“你叫他快吃了瞧黛玉妹妹去罢。叫他在这里胡闹什么呢？”宝玉吃了茶便出来，一直往西院来。可巧走到凤姐儿院前，只见凤姐儿在门前站着，蹬着门槛子，拿耳挖子剔牙，看着十来个小厮们挪花盆呢。见宝玉来了，笑道：“你来的好，进来，进来，替我写几个字儿。”宝玉只得跟了进来。到了房里，凤姐命人取过笔砚纸来，向…","so":0,"eo":0}]},{"chap":29,"ctitle":"第29章 享福人福深还祷福 多情女情重愈斟情","deeds":[{"surface":"凤姐","text":"一时凤姐儿来了。因说起初一日在清虚观打醮的事来，约着宝钗、宝玉、黛玉等看戏去。宝钗笑道：“罢，罢，怪热的，什么没看过的戏！我不去。”凤姐道：“他们那里凉快，两边又有楼。咱们要去，我头几天先打发人去，把那些道士都赶出去，把楼上打扫了，挂起帘子来，一个闲人不许放进庙去，才是好呢。我已经回了太太了，你们不去，我自家去。这些日子也闷的很了，家里唱动戏，我又不得舒舒服服的看。”贾母听说，就笑道：“既这么着，我和你去。”凤姐听说，笑道：“老祖宗也去…","so":0,"eo":0},{"surface":"凤姐","text":"单表到了初一这一日，荣国府门前车辆纷纷，人马簇簇，那底下执事人等，听见是贵妃做好事，贾母亲去拈香，况是端阳佳节，因此凡动用的物件，一色都是齐全的，不同往日。少时贾母等出来，贾母坐一乘八人大轿，李氏、凤姐、薛姨妈每人一乘四人轿，宝钗、黛玉二人共坐一辆翠盖珠缨八宝车，迎春、探春、惜春三人共坐一辆朱轮华盖车。然后贾母的丫头鸳鸯、鹦鹉、琥珀、珍珠，黛玉的丫头紫鹃、雪雁、鹦哥，宝钗的丫头莺儿、文杏，迎春的丫头司棋、绣橘，探春的丫头侍书、翠墨，惜春…","so":0,"eo":0},{"surface":"凤姐","text":"不多时，已到了清虚观门口。只听钟鸣鼓响，早有张法官执香披衣，带领众道土在路旁迎接。宝玉下了马，贾母的轿刚至山门以内，见了本境城隆土地各位泥塑圣像，便命往轿。贾珍带领各子弟上来迎接。凤姐儿的轿子却赶在头里先到了，带着鸳鸯等迎接上来，见贾母下了轿，忙要搀扶。可巧有个十二三岁的小道士儿，拿着个剪筒照管各处剪蜡花儿，正欲得便且藏出去，不想一头撞在凤姐儿怀里。凤姐便一扬手照脸打了个嘴巴，把那小孩子打了一个斤斗，骂道：“小野杂种！往那里跑？”那小道…","so":0,"eo":0},{"surface":"凤姐","text":"说毕，只见凤姐儿笑道：“张爷爷，我们丫头的寄名符儿你也不换去，前儿亏你还有那么大脸，打发人和我要鹅黄缎子去！要不给你，又恐怕你那老脸上下不来。”张道士哈哈大笑道：“你瞧，我眼花了！也没见奶奶在这里，也没道谢。寄名符早已有了，前日原想送去，不承望娘娘来做好事，也就混忘了。还在佛前镇着呢。等着我取了来。”说着跑到大殿上，一时拿了个茶盘，搭着大红蟒缎经袱子，托出符来。大姐儿的奶子接了符。张道士才要抱过大姐儿来，只见凤姐笑道：“你就手里拿出来罢…","so":0,"eo":0},{"surface":"凤姐","text":"这里贾母和众人上了楼，在正面楼上归坐。凤姐等上了东楼。众丫头等在西楼轮流伺候。一时贾珍上来回道：“神前拈了戏，头一本是《白蛇记》。”贾母便问：“是什么故事？”贾珍道：“汉高祖斩蛇起首的故事。第二本是《满床笏》。”贾母点头道：“倒是第二本也还罢了。神佛既这样，也只得如此。”又问：“第三本？”贾珍道：“第三本是《南柯梦》。”贾母听了，便不言语。贾珍退下来，走至外边，预备着申表、焚钱粮、开戏，不在话下。","so":0,"eo":0},{"surface":"凤姐","text":"刚要悦话，只见贾珍之妻尤氏和贾蓉续娶的媳妇胡氏，婆媳两个来了，见过贾母。贾母道：“你们又来做什么，我不过没事来逛逛。”一句话说了，只见人报：“冯将军家有人来了。”原来冯紫英家听见贾府在庙里打醮，连忙预备猪羊，香烛、茶食之类，赶来送礼。凤姐听了，忙赶过正楼来，拍手笑道：“嗳呀！我却没防着这个。只说咱们娘儿们来闲逛逛，人家只当咱们大摆斋坛的来送礼。都是老太太闹的！这又不得预备赏封儿。”刚说了，只见冯家的两个管家女人上楼来了。冯家两个未去，接…","so":0,"eo":0}]},{"chap":30,"ctitle":"第30章 宝钗借扇机带双敲 椿龄画蔷痴及局外","deeds":[{"surface":"凤姐","text":"一句话没说完，只听嚷道：“好了！”宝、黛两个不防，都唬了一跳。回头看时，只见凤姐儿跑进来，笑道：“老太太在那里抱怨天，抱怨地，只叫我来瞧瞧你们好了没有，我说：‘不用瞧，过不了三天，他们自己就好了。’老太太骂我，说我懒，我来了，果然应了我的话了。也没见你们两个！有些什么可拌的，三日好了，两日恼了，越大越成了孩子了。有这会子拉着手哭的，昨儿为什么又成了‘乌眼鸡’似的呢？还不跟着我到老太太跟前，叫老人家也放点儿心呢。”说着，拉了黛玉就走。黛玉…","so":0,"eo":0},{"surface":"凤姐","text":"出了园门，到了贾母跟前，凤姐笑道：“我说他们不用人费心，自己就会好的，老祖宗不信，一定叫我去说和。赶我到那里说和，谁知两个人在一块儿对赔不是呢，倒象‘黄鹰抓住鹞子的脚’，两个人都‘扣了环’了！那里还要人去说呢？”说的满屋里都笑起来。","so":0,"eo":0},{"surface":"凤姐","text":"黛玉听见宝玉奚落宝钗，心中着实得意，才要搭言，也趁势取个笑儿，不想靓儿因找扇子，宝钗又发了两句话，他便改口说道：“宝姐姐，你听了两出什么戏？”宝钗因见黛玉面上有得意之态，一定是听了宝玉方才奚落之言，遂了他的心愿。忽又见他问这话，便笑道：“我看的是李逵骂了宋江，后来又赔不是。”宝玉便笑道：“姐姐通今博古，色色都知道，怎么连这一出戏的名儿也不知道，就说了这么一套。这叫做《负荆请罪》。”宝钗笑道：“原来这叫‘负荆请罪’！你们通今博古，才知道‘…","so":0,"eo":0},{"surface":"凤姐","text":"一时宝钗、凤姐去了，黛玉向宝玉道：“你也试着比我利害的人了。谁都象我，心拙口夯的，由着人说呢！”宝玉正因宝钗多心，自己没趣儿，又见黛玉问着他，越发没好气起来。欲待要说两句，又怕黛玉多心，说不得忍气，无精打彩，一直出来。","so":0,"eo":0},{"surface":"凤姐","text":"谁知目今盛暑之际，又当早饭已过，各处主仆人等多半都因日长神倦，宝玉背着手，到一处，一处鸦雀无声。从贾母这里出来往西，走过了穿堂便是凤姐的院落。到他院门前，只见院门掩着，知道凤姐素日的规矩，每到天热，午间要歇一个时辰的，进去不便。遂进角门，来到王夫人上房。只见几个丫头手里拿着针线，却打盹儿。王夫人在里间凉床上睡着，金钏儿坐在旁边捶腿，也斜着眼乱恍。宝玉轻轻的走到跟前，把他耳朵上的坠子一摘。金钏儿睁眼，见是宝玉，宝玉便悄俏的笑道：“就困的这…","so":0,"eo":0}]},{"chap":31,"ctitle":"第31章 撕扇子作千金一笑 因麒麟伏白首双星","deeds":[{"surface":"凤姐","text":"这日正是端阳佳节，蒲艾簪门，虎符系臂。午间王夫人治了酒席，请薛家母女等过节。宝玉见宝钗淡淡的，也不和他说话，自知是昨日的原故。王夫人见宝玉没精打彩，也只当是昨日金钏儿之事，他没好意思的，越发不理他。黛玉见宝玉懒懒的，只当是他因为得罪了宝钗的原故，心中不受用，形容也就懒懒的。凤姐昨日晚上王夫人就告诉了他宝玉、金钏儿的事，知道王夫人不喜欢，自己如何敢说笑，也就随着王夫人的气色行事，更觉淡淡的。迎春姐妹见众人没意思，也都没意思了。因此，大家坐…","so":0,"eo":0},{"surface":"凤姐","text":"贾母因向湘云道：“喝了茶歇歇儿，瞧瞧你嫂子们去罢。园里也凉快，和你姐姐们去逛逛。”湘云答应了，因将三个戒指儿包上，歇了歇，便起身要瞧凤姐等去。众奶娘丫头跟着，到了凤姐那里，说笑了一回。出来便往大观园来见过了李纨。少坐片时，便往怡红院来找袭人。因回头说道：“你们不必跟着，只管瞧你们的亲戚去。留下缕儿伏侍就是了。”众人应了，自去寻姑觅嫂，单剩下湘云、翠缕两个。","so":0,"eo":0}]},{"chap":33,"ctitle":"第33章 手足眈眈小动唇舌 不肖种种大承苔挞","deeds":[{"surface":"凤姐","text":"贾政听了此话，不觉长叹一声，向椅上坐了，泪如雨下。王夫人抱着宝玉，只见他面白气弱，底下穿着一条绿纱小衣，一片皆是血渍。禁不住解下汗巾去，由腿看至臀股，或青或紫，或整或破，竟无一点好处，不觉失声大哭起“苦命的儿”来。因哭出“苦命儿”来，又想起贾珠来，便叫着贾珠哭道：“若有你活着，便死一百个我也不管了！”此时里面的人闻得王夫人出来，李纨、凤姐及迎、探妹妹两个也都出来了。王夫人哭着贾珠的名字，别人还可，惟有李纨禁不住也抽抽搭搭的哭起来了。贾政…","so":0,"eo":0},{"surface":"凤姐","text":"贾母一面说，一面来看宝玉。只见今日这顿打不比往日，又是心疼，又是生气，也抱着哭个不了。王夫人与凤姐等解劝了一会，方渐浙的止住。早有丫鬟媳妇等上来要搀宝玉。凤姐便骂：“糊涂东西，也不睁开眼瞧瞧，这个样儿，怎么搀着走的？还不快进去把那藤屉子春凳抬出来呢！”众人听了，连忙飞跑进去，果然抬出春凳来，将宝玉放上，随着贾母、王夫人等进去，送至贾母屋里。","so":0,"eo":0}]},{"chap":34,"ctitle":"第34章 情中情因情感妹妹 错里错以错劝哥哥","deeds":[{"surface":"凤姐","text":"一句话未了，只见院外人说：“二奶奶来了。”黛玉便知是凤姐来了，连忙立起身，说道：“我从后院子里去罢，回来再来。”宝玉一把拉住道：“这又奇了，好好的怎么怕起他来了？”黛玉急得跺脚，悄悄的说道：“你瞧瞧我的眼睛！又该他们拿咱们取笑儿了。”宝玉听说，赶忙的放了手。黛玉三步两步转过床后，刚出了后院，凤姐从前头已进来了，问宝玉：“可好些了？想什么吃？叫人往我那里取去。”接着薛姨妈又来了。一时贾母又打发了人来。","so":0,"eo":0}]},{"chap":35,"ctitle":"第35章 白玉钏亲尝莲叶羹 黄金莺巧结梅花络","deeds":[{"surface":"凤姐","text":"话说宝钗分明听见黛玉克薄他，因惦记着母亲哥哥，并不回头，一径去了。这里黛玉仍旧立于花阴之下，远远的却向怡红院内望着。只见李纨、迎春、探春、惜春并丫鬟人等，都向怡红院内去过之后，一起一起的散尽了，只不见凤姐儿来。心里自己盘算说道：“他怎么不来瞧瞧宝玉呢？便是有事缠住了，他必定也是要来打个花胡哨，讨老太太、太太的好儿才是呢。今儿这早晚不来，必有原故。”一面猜疑，一面抬头再看时，只见花花簇簇一群人，又向恰红院内来了。定睛看时，却是贾母搭着凤姐…","so":0,"eo":0},{"surface":"凤姐","text":"这里薛姨妈和宝钗进园来看宝玉。到了怡红院中，只见抱厦里外回廊上许多丫头老婆站着，便知贾母等都在这里。母女两个进来，大家见过了。只见宝玉躺在榻上，薛姨妈问他：“可好些？”宝玉忙欲欠身，口里答应着：“好些。”又说：“只管惊动姨娘、姐姐，我当不起。”薛姨妈忙扶他睡下，又问他：“想什么，只管告诉我。”宝玉笑道：“我想起来，自然和姨娘要去。”王夫人又问：“你想什么吃？回来好给你送来。”宝玉笑道：“也倒不想什么吃。倒是那一回做的那小荷叶儿小莲蓬儿的…","so":0,"eo":0},{"surface":"凤姐","text":"薛姨妈先接过来瞧时，原来是个小匣子，里面装着四副银模子，都有一尺多长，一寸见方。上面凿着豆子大小，也有菊花的，也有梅花的，也有莲蓬的，也有菱角的：共有三四十样，打的十分精巧。因笑向贾母王夫人道：“你们府上也都想绝了，吃碗汤还有这些样子。要不说出来，我见了这个，也不认得是做什么用的。”凤姐儿也不等人说话，便笑道：“姑妈不知道：这是旧年备膳的时候儿，他们想的法儿。不知弄什么面印出来，借点新荷叶的清香，全仗着好汤，我吃着究竟也没什么意思。谁家…","so":0,"eo":0},{"surface":"凤姐","text":"宝钗旁笑道：“我来了这么几年，留神看起来，二嫂子凭他怎么巧，再巧不过老太太。”贾母听说，便答道：“我的儿，我如今老了，那里还巧什么？当日我象凤丫头这么大年纪，比他还来得呢。他如今虽说不如我，也就算好了。比你姨娘强远了！你姨娘可怜见的，不大说话，和木头似的，公婆跟前就不献好儿。凤儿嘴乖，怎么怨得人疼他。”宝玉笑道：要这么说，不大说话的就不疼了？”贾母道：“不大说话的，又有不大说话的可疼之处，嘴乖的也有一宗可嫌的，倒不如不说的好。”宝玉笑道…","so":0,"eo":0},{"surface":"凤姐","text":"忽有人来请吃饭，贾母方立起身来，命宝玉：“好生养着罢。”把丫头们又嘱咐了一回，方扶着凤姐儿，让着薛姨妈，大家出房去了。犹问：“汤好了不曾？”又问薛姨妈等：“想什么吃，只管告诉我，我有本事叫凤丫头弄了来咱们吃。”薛姨妈笑道：“老太太也会怄他，时常他弄了东西来孝敬，究竟又吃不多儿。”凤姐儿笑道：“姑妈倒别这么说。我们老祖宗只是嫌人肉酸，要不嫌人肉酸，早已把我还吃了呢！”一句话没说了，引的贾母众人都哈哈的大笑起来。宝玉在屋里也掌不住笑了。袭人…","so":0,"eo":0},{"surface":"凤姐","text":"少顷出至园外，王夫人恐贾母乏了，便欲让至上房内坐，贾母也觉脚酸，便点头依允。王未人便命丫头忙先去铺设坐位。那时赵姨娘推病，只有周姨娘与那老婆丫头们忙着打帘子，立靠背，铺褥子。贾母扶着凤姐儿进来，与薛姨妈分宾主坐了，宝钗、湘云坐在下面。王夫人亲自捧了茶来，奉与贾母，李宫裁捧与薛姨妈。贾母向王夫人道：“让他们小妯娌伏侍罢，在那里坐下，好说话儿。”王夫人方向一张小机子上坐下，便吩咐凤姐儿道：“老太太的饭放在这里，添了东西来。”凤姐儿答应出去，…","so":0,"eo":0},{"surface":"凤姐","text":"少顷饭至，众人调放了桌子。凤姐儿用手巾裹了一把牙箸，站在地下，笑道：“老祖宗和姨妈不用让，还听我说就是了。”贾母笑向薛姨妈道：“我们就是这样。”薛姨妈笑着应了。于是凤姐放下四双箸：上面两双是贾母、薛姨妈，两边是宝钗湘云的。王夫人、李宫裁等都站在地下，看着放菜。凤姐先忙着要干净家伙来，替宝玉拣菜。少顷，莲叶汤来了，贾母看过了，王夫人回头见玉钏儿在那里，便命玉钏儿与宝玉送去。凤姐道：“他一个人难拿。”可巧莺儿和同喜都来了，宝钗知道他们已吃了…","so":0,"eo":0}]},{"chap":36,"ctitle":"第36章 绣鸳鸯梦兆绛芸轩 识分定情悟梨香院","deeds":[{"surface":"凤姐","text":"闲言少述。如今且说凤姐，自见金钏儿死后，忽见几家仆人常来孝敬他些东西，又不时的来请安奉承，自己倒生了疑惑，不知何意。这日又见人来孝敬他东西，因晚间无人时笑问平儿。平儿冷笑道：“奶奶连这个都想不起来了？我猜他们的女孩儿都必是太太屋里的丫头，如今太太屋里有四个大的，一个月一两银的分例，下剩的都是一个月只几百钱。如今金钏儿死了，必定他们要弄这一两银子的窝儿呢。”凤姐听了，笑道：“是了，是了，倒是你想的不错。只是这起人也太不知足。钱也赚够了，苦…","so":0,"eo":0},{"surface":"凤姐","text":"这日午间，薛姨妈、宝钗、黛玉等正在王夫人屋里，大家吃西瓜。凤姐儿得便回王夫人道：“自从玉钏儿的姐姐死了，太太跟前少着一个人，太太或看准了那个丫头，就吩咐了，下月好发放月钱。”王夫人听了，想了一想道：“依我说，什么是例，必定四个五个的？够使就罢了，竟可以免了罢。”凤姐笑道：“论理，太太说的也是。只是原是旧例，别人屋里还有两个呢，太太倒不按例了。况且省下一两银子，也有限的。”王夫人听了，又想了想道：“也罢，这个分例只管关了来，不用补人，就把…","so":0,"eo":0},{"surface":"凤姐","text":"王夫人又问道：“正要问你：如今赵姨娘、周姨娘的月例多少？”凤姐道：“那是定例，每人二两。赵姨娘有环兄弟的二两，共是四两，另外四串钱。”王夫人道：“月月可都按数给他们？”凤姐见问得奇，忙道：“怎么不按数给呢！”王夫人道：“前儿恍惚听见有人抱怨，说短了一串钱，什么原故？”凤姐忙笑道：“姨娘们的丫头月例，原是人各一吊钱，从旧年他们外头商量的，姨娘们每位丫头，分例减半，人各五百钱。每位两个丫头，所以短了一吊钱。这事其实不在我手里，我倒乐得给他们…","so":0,"eo":0},{"surface":"凤姐","text":"薛姨妈笑道：“你们只听凤丫头的嘴，倒象倒了核桃车子似的。账也清楚，理也公道。”凤姐笑道：“姑妈，难道我说错了吗？”薛姨妈笑道：“说的何尝错，只是你慢着些儿说不省力些？”凤姐才要笑，忙又忍住了，听王夫人示下。王夫人想了半日，向凤姐道：“明儿挑一个丫头送给老太太使唤，补袭人，把袭人的一分裁了。把我每月的月例，二十两银子里拿出二两银子一吊钱来，给袭人去。以后凡事有赵姨娘、周姨娘的，也有袭人的，只是袭人的这一分，都从我的分例上匀出来，不必动官中…","so":0,"eo":0},{"surface":"凤姐","text":"说毕，凤姐见无话，便转身出来。刚至廊檐下，只见有几个执事的媳妇子正等他回事呢，见他出来，都笑道：“奶奶今儿回什么事，说了这半天？可别热着罢。”凤姐把袖子挽了几挽，着那角门的门槛子，笑道：“这里过堂风，倒凉快，吹一吹再走。”又告诉众人道：“你们说我回了这半日的话，太太把二百年的事都想起来问我，难道我不说罢？”又冷笑道：“我从今以后，倒要干几件刻薄事了。抱怨给太太听，我也不怕！糊涂油蒙了心、烂了舌头、不得好死的下作娼妇们，别做娘的春梦了！明…","so":0,"eo":0},{"surface":"凤姐","text":"这里宝钗只刚做了两三个花瓣，忽见宝玉在梦中喊骂，说：“和尚道士的话如何信得？什么‘金玉姻缘’？我偏说‘木石姻缘’！”宝钗听了这话，不觉怔了。忽见袭人走进来，笑道：“还没醒呢吗？”宝钗摇头。袭人又笑道：“我才碰见林姑娘、史大姑娘，他们进来了么？”宝钗道：“没见他们进来。”因向袭人笑道：“他们没告诉你什么？”袭人红了脸，笑道：“总不过是他们那些玩话，有什么正经说的。”宝钗笑道：“今儿他们说的可不是玩话，我正要告诉你呢，你又忙忙的出去了。”一…","so":0,"eo":0}]},{"chap":38,"ctitle":"第38章 林潇湘魁夺菊花诗 薛蘅芜讽和螃蟹咏","deeds":[{"surface":"凤姐","text":"话说宝钗湘云计议已定，一宿无话。次日湘云便请贾母等赏桂花。贾母等都说道：“到是他有兴头，须要扰他这雅兴。”至午，果然贾母带了王夫人、凤姐兼请薛姨妈等进园来。贾母因问。“那一处好？”王夫人道：“凭老太太爱在那一处，就在那一处。”凤姐道：“藕香榭已经摆下了。那山坡下两棵桂花开的又好，河里的水又碧清，坐在河当中亭子上，不敞亮吗？看看水，眼也清亮。”贾母听了，说：“很好。”说着，引了众人往藕香榭来。原来这藕香榭盖在池中，四面有窗，左右有回廊，也…","so":0,"eo":0},{"surface":"凤姐","text":"贾母听了，又抬头看匾，因回头向薛姨妈道：“我先小时，家里也有这么一个亭子，叫做什么枕霞阁。我那时也只象他姐妹们这么大年纪，同着几个人，天天玩去。谁知那日一下子失了脚掉下去，几乎没淹死，好容易救上来了，到底叫那木钉把头碰破了。如今这鬃角上那指头顶儿大的一个坑儿，就是那碰破的。众人都怕经了水，冒了风，说了不得了，谁知竟好了。”凤姐不等人说，先笑道：“那时要活不得，如今这么大福可叫谁享呢？可知老祖宗从小儿福寿就不小，神差鬼使，碰出那个坑儿来好…","so":0,"eo":0},{"surface":"凤姐","text":"说着，一齐进了亭子。献过茶，凤姐忙安放杯箸。上面一桌，贾母、薛姨妈、宝钗、黛玉、宝玉；东边一桌，湘云、王夫人、迎、探、惜。西边靠门一小桌，李纨和凤姐，虚设坐位，二人皆不敢坐，只在贾母、王夫人两桌上伺候。凤姐吩咐：“螃蟹不可多拿来，仍旧放在蒸笼里，拿十个来，吃了再拿。”一面又要水洗了手，站在贾母跟前剥蟹肉。头次让薛姨妈，薛姨妈道：“我自己掰着吃香甜，不用人让。”凤姐便奉与贾母。二次的便与宝玉。又说：“把酒烫得滚热的拿来。”又命小丫头们去取…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐仍旧下来张罗。一时出至廊上，鸳鸯等正吃得高兴，见他来了，鸳鸯等站起来道：“奶奶又出来做什么？让我们也受用一会子。”凤姐笑道：“鸳鸯丫头越发坏了，我替你当差，倒不领情，还抱怨我，还不快斟一种酒来我喝呢。”鸳鸯笑着，忙斟了一杯酒，送至凤姐唇边，凤姐一挺脖子喝了。琥珀彩霞二人也斟上一杯送至凤姐唇边，那凤姐也吃了。平儿早剔了一壳黄子送来，凤姐道：“多倒些姜醋。”一回也吃了，笑道：“你们坐着吃罢，我可去了。”鸳鸯笑道：“好没脸，吃我们的东西！…","so":0,"eo":0}]},{"chap":39,"ctitle":"第39章 村老老是信口开河 情哥哥偏寻根究底","deeds":[{"surface":"凤姐","text":"众人都道：“这又何必伤心，不如散了倒好。”说着，便都洗了手，大家约着往贾母王夫人处问安。众婆子丫头打扫亭子，收洗杯盘。袭人便和平儿一同往前去。袭人因让平儿到屋里坐坐，再喝碗茶去。平儿回说：“不喝茶了，再来罢。”一面说，一面便要出去。袭人又叫住，问道：“这个月的月钱，连老太太、太太屋里还没放，是为什么？”平儿见问，忙转身至袭人跟前，又见无人，俏悄悦道：“你快别问！横竖再迟两天就放了。”袭人笑道：“这是为什么，唬的你这个样儿？”平儿悄声告诉…","so":0,"eo":0},{"surface":"凤姐","text":"平儿答应着，一径出了园门，只见凤姐那边打发人来找平儿，说：“奶奶有事等你。”平儿道：“有什么事这么要紧？我叫大奶奶拉住说话儿，我又没逃了，这么连三接四的叫人来找！”那丫头说道：“这又不是我的主意，姑娘这话自己和奶奶说去。”平儿哼道：“好了，你们越发上脸了！”说着走来。只见凤姐儿不在屋里，忽见上回来打抽丰的刘老老和板儿来了，坐在那边屋里，还有张材家的周瑞家的陪着。又有两三个丫头在地下，倒口袋里的枣儿、倭瓜并些野菜。众人见他进来，都忙站起来…","so":0,"eo":0},{"surface":"凤姐","text":"平儿等来至贾母房中。彼时大观园中姐妹们都在贾母前承奉，刘老老进去，只见满屋里珠围翠绕、花枝招展的，并不知都系何人。只见一张榻上，独歪着一位老婆婆，身后坐着一个纱罗裹的美人一般的个丫鬟在那里捶腿，凤姐儿站着正说笑。刘老老便知是贾母，忙上来，陪着笑，拜了几拜，口里说：“请老寿星安！”贾母也忙欠身问好，又命周瑞家的端过椅子来坐着。那板儿仍是怯人，不知问候。贾母道：“老亲家，你今年多大年纪了？”刘老老忙起身答道：“我今年七十五了。”贾母向众人道…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐知道合了贾母的心，吃了饭便又打发过来。鸳鸯忙命老婆子带了刘老老去洗了澡，自己去挑了两件随常的衣裳叫给刘老老换上。那刘老老那里见过这般行事？忙换了衣裳出来，坐在贾母榻前，又搜寻些话出来说。彼时宝玉姐妹们也都在这里坐着，他们何曾听见过这些话，自觉比那些瞽目先生说的书还好听。那刘老老虽是个村野人，却生来的有些见识，况且年纪老了，世情上经历过的，见头一件贾母高兴，第二件这些哥儿姐儿都爱听，便没话也编出些话来讲。因说道：“我们村庄上种地种菜，…","so":0,"eo":0}]},{"chap":40,"ctitle":"第40章 史太君两宴大观园 金鸳鸯三宣牙牌令","deeds":[{"surface":"凤姐","text":"次日清早起来，可喜这日天气清朗。李纨清晨起来，看着老婆子丫头们扫那些落叶，并擦抹桌椅，预备茶酒器皿。只见丰儿带了刘老老板儿进来，说：“大奶奶倒忙的很。”李纨笑道：“我说你昨儿去不成，只忙着要去。”刘老老笑道：“老太太留下我，叫我也热闹一天去。”丰儿拿了几把大小钥匙，说道：“我们奶奶说了，外头的高几儿怕不够使，不如开了楼，把那收的拿下来使一天罢。奶奶原该亲自来，因和太太说话呢，请大奶奶开了，带着人搬罢。”李氏便命素云接了钥匙。又命婆子出去…","so":0,"eo":0},{"surface":"凤姐","text":"正乱着，只见贾母已带了一群人进来了，李纨忙迎上去，笑道：“老太太高兴，倒进来了，我只当还没梳头呢，才掐了菊花要送去。”一面说，一面碧月早已捧过一个大荷叶式的翡翠盘子来，里面养着各色折枝菊花。贾母便拣了一朵大红的簪在鬓上，因回头看见了刘老老，忙笑道：“过来带花儿。”一语末完，凤姐儿便拉过刘老老来，笑道：“让我打扮你。”说着，把一盘子花，横三竖四的插了一头。贾母和众人笑的了不得。刘老老也笑道：“我这头也不知修了什么福，今儿这样体面起来。”众…","so":0,"eo":0},{"surface":"凤姐","text":"紫鹃早打起湘帘，贾母等进来坐下。黛玉亲自用小茶盘儿捧了一盖碗茶来奉与贾母。王夫人道：“我们不吃茶，姑娘不用倒了。”黛玉听说，便命丫头把自己窗下常坐的一张椅子挪到下手，请王夫人坐了。刘老老因见窗下案上设着笔砚，又见书架上放着满满的书，刘老老道：“这必定是那一位哥儿的书房了？”贾母笑指黛玉道：“这是我这外孙女儿的屋子。”刘老老留神打量了黛玉一番，方笑道：“这那里象个小姐的绣房？竟比那上等的书房还好呢。”贾母因问：“宝玉怎么不见？”众丫头们答…","so":0,"eo":0},{"surface":"凤姐","text":"贾母听了笑道：“呸，人人都说你没有没经过没见过的，连这个纱还不能认得，明儿还说嘴。”薛姨妈等都笑说：“凭他怎么经过见过，怎么敢比老太太呢！老太太何不教导了他，连我们也听听。”凤姐儿也笑说：“好祖宗，教给我罢。”贾母笑向薛姨妈众人道：“那个纱，比你们的年纪还大呢，怪不得他认做蝉翼纱，原也有些象。不知道的都认做蝉翼纱。正经名字叫‘软烟罗’。”凤姐儿道：“这个名儿也好听，只是我这么大了，纱罗也见过几百样，从没听见过这个名色。”贾母笑道：“你能…","so":0,"eo":0},{"surface":"凤姐","text":"薛姨妈笑道：“别说凤丫头没见，连我也没听见过。”凤姐儿一面说话，早命人取了一匹来了，贾母说：“可不是这个！先时原不过是糊窗屉，后来我们拿这做被做帐子试试，也竟好。明日就找出几匹来，拿银红的替他糊窗户。”凤姐答应着。众人看了，都称赞不已。刘老老也觑着眼看，口里不住的念佛，说道：“我们想做衣裳也不能，拿着糊窗子，岂不可惜？”贾母道：“倒是做衣裳不好看。”凤姐忙把自己身上穿的一件大红棉纱袄的襟子拉出来，向贾母薛姨妈道：“看我的这袄儿。”贾母、…","so":0,"eo":0},{"surface":"凤姐","text":"贾母便笑道：“这屋里窄，再往别处逛去罢。”刘老老笑道：“人人都说：‘大家子住大房。’昨儿见了老太太正房，配上大箱、大柜、大桌子、大床，果然威武。那柜子比我们一间房子还大还高。怪道后院子里有个梯子，我想又不上房晒东西，预备这梯子做什么？后来我想起来，一定是为开顶柜取东西，离了那梯子怎么上得去呢？如今又见了这小屋子，更比大的越发齐整了。满屋里东西都只好看，可不知叫什么。我越看越舍不得离了这里了！”凤姐道：“还有好的呢，我都带你去瞧瞧。”","so":0,"eo":0},{"surface":"凤姐","text":"说着，一径离了潇湘馆，远远望见池中一群人在那里撑船。贾母道：“他们既备下船，咱们就坐一回。”说着，向紫菱洲蓼溆一带走来。未至池前，只见几个婆子手里都捧着一色摄丝戗俄金五彩大盒子走来，凤姐忙问王夫人：“早饭在那里摆？”王夫人道：“问老太太在那里就在那里罢了。”贾母听说，便回头说：“你三妹妹那里好，你就带了人摆去，我们从这里坐了船去。”凤姐儿听说，便回身和李纨、探春、鸳鸯、琥珀带着端饭的人等，抄着近路到了秋爽斋，就在晓翠堂上调开桌案。鸳鸯笑…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，只见贾母等来了，各自随便坐下。先有丫鬟挨人递了茶。大家吃毕，凤姐手里拿着西洋布手巾，裹着一把乌木三镶银箸，按席摆下。贾母因说：“把那一张小楠木桌子抬过来，让刘亲家挨着我这边坐。”众人听说，忙抬过来。凤姐一面递眼色与鸳鸯，鸳鸯便忙拉刘老老出去，悄悄的嘱咐了刘老老一席话，又说：“这是我们家的规矩，要错了，我们就笑话呢。”调停巳毕，然后归坐。薛姨妈是吃过饭来的，不吃了，只坐在一边吃茶。贾母带着宝玉、湘云、黛玉、宝钗一桌，王夫人带着迎春…","so":0,"eo":0}]},{"chap":41,"ctitle":"第41章 贾宝玉品茶栊翠庵 刘老老醉卧怡红院","deeds":[{"surface":"凤姐","text":"话说刘老老两只手比着说道：“花儿落了结个大倭瓜。”众人听了，哄堂大笑起来。于是吃过门杯，因又斗趣笑道：“今儿实说罢，我的手脚子粗，又喝了酒，仔细失手打了这磁杯。有木头的杯取个来，我就失了手，掉了地下也无碍。”众人听了又笑起来。凤姐儿听如此说，便忙笑道：“果真要木头的，我就取了来，可有一句话先说下，这木头的可比不得磁的，那都是一套，定要吃遍一套才算呢。”刘老老听了，心下道：“我方才不过是趣话取笑儿，谁知他果真竟有。我时常在乡绅大家也赴过席…","so":0,"eo":0},{"surface":"凤姐","text":"鸳鸯果命人取来。刘老老一看，又惊又喜。惊的是一连十个挨次大小分下来，那大的足足的象个小盆子，极小的还有手里的杯子两个大；喜的是雕楼奇绝，一色山水树木人物，并有草字以及图印。因忙说道：“拿了那小的来就是了。”凤姐儿笑道：“这个杯，没有这大量的，所以没人敢使他。老老既要，好容易找出来，必定要挨次吃一遍才使得。”刘老老吓的忙道：“这个不敢！好姑奶奶，饶了我罢。”贾母、薛姨妈、王夫人知道他有年纪的人，禁不起，忙笑道：“说是说，笑是笑，不可多吃了…","so":0,"eo":0},{"surface":"凤姐","text":"只见一个婆子走来，请问贾母说：“姑娘们都到了藕香榭，请示下，就演罢，还是再等一会儿呢？”贾母忙笑道：“可是倒忘了，就叫他们演罢。”那婆子答应去了。不一时，只听得萧管悠扬，笙笛并发；正值风清气爽之时，那乐声穿林度水而来，自然使入神恰心旷。宝玉先禁不住，拿起壶来斟了一杯，一口饮尽，复又斟上，才要饮，只见王夫人也要饮，命人换暖酒，宝玉连忙将自己的杯捧了过来，送到王夫人口边，王夫人便就他手内吃了两口。一时暖酒来了，宝玉仍归旧坐。王夫人提了暖壶下…","so":0,"eo":0},{"surface":"凤姐","text":"一时只见丫头们来请用点心，贾母道：“吃了两杯酒，倒也不饿。也罢，就拿了来这里，大家随便吃些罢。”丫头听说，便去抬了两张几来，又端了两个小捧盒。揭开看时，每个盒内两样。这盒内是两样蒸食：一样是藕粉桂花糖糕，一样是松瓤鹅油卷。那盒内两样炸的：一样是只有一寸来大的小饺儿。贾母因问：“什么馅子？”婆子们忙回：“是螃蟹的。”贾母听了，皱眉说道：“这会子油腻腻的，谁吃这个。”又看那一样，是奶油炸的各色小面果子。也不喜欢，因让薛姨妈，薛姨妈只拣了块糕…","so":0,"eo":0},{"surface":"凤姐","text":"且说贾母因觉身上乏倦，便命王夫人和迎春姐妹陪着薛姨妈去吃酒，自己便往稻香村来歇息。凤姐忙命人将小竹椅抬来，贾母坐上，两个婆子抬起，凤姐、李纨和众丫头婆子围随去了，不在话下。这里薛姨妈也就辞出。王夫打发文官等出去，将攒盒散给众丫头们吃去，自己便也乘空歇着，随便歪在方才贾母坐的榻上，命一个小丫头放下帘子来，又命捶着腿，吩咐他：“老太太那里有信，你就叫我。”说着也歪着睡着了。宝玉、湘云等看着丫头们将攒盒搁在山石上，也有坐在山石上的，也有坐在草…","so":0,"eo":0},{"surface":"凤姐","text":"一时贾母醒了，就在稻香村摆晚饭。贾母因觉懒懒的，也没吃饭，便坐了竹椅小敞轿，回至房中歇息，命凤姐儿等去吃饭。他姐妹方复进园来。未知如何，且看下回分解。","so":0,"eo":0}]},{"chap":42,"ctitle":"第42章 蘅芜君兰言解疑癖 潇湘子雅谑补馀音","deeds":[{"surface":"凤姐","text":"话说贾母王夫人去后，姐妹们复进园来吃饭。那刘老老带着板儿，先来见凤姐儿说：“明日一早定要家去了。虽然住了两三天，日子却不多，把古往今来没见过的、没吃过的、没听见的都经验过了。难得老太太和姑奶奶并那些小姐们，连各房里的姑娘们，都这样怜贫惜老照看我。我这一回去没别的报答，惟有请些高香，天天给你们念佛，保佑你们长命百岁的，就算我的心了。”凤姐儿笑道：“你别喜欢，都是为你，老太太也叫风吹病了，躺着嚷不舒服；我们大姐儿也着了凉了，在那里发热呢。”…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿笑道：“到底是你们有年纪的经历的多。我们大姐儿时常肯病，也不知是什么原故。”刘老老道：“这也有的。富贵人家养的孩子都娇嫩，自然禁不得一些儿委屈。再他小人儿家，过于尊贵了也禁不起。以后姑奶奶倒少疼他些就好了。”凤姐儿道：“也是有的。我想起来，他还没个名字，你就给他起个名字，借借你的寿；二则你们是庄家人，不怕你恼，到底贫苦些，你们贫苦人起个名字只怕压的住。”刘老老听说，便想了一想，笑道：“不知他是几时养的？”凤姐儿道：“正是养的日子不…","so":0,"eo":0},{"surface":"凤姐","text":"平儿说一样，刘老老念一句佛，已经念了几千佛了；又见平儿也送他这些东西，又如此谦逊，忙笑道：“姑娘说那里话？这样好东西，我还弃嫌！我就有银子，没处买这样的去呢。只是我怪臊的，收了不好，不收又辜负了姑娘的心。”平儿笑道：“别说外话，咱们都是自己，我才这么着。你放心收了罢，我还和你要东西呢。到年下，你只把你们晒的那个灰条菜和豇豆、扁豆、茄子干子、葫芦条儿，各样干菜带些来——我们这里上上下下都爱吃这个——就算了，别的一概不要，别罔费了心。”刘老…","so":0,"eo":0},{"surface":"凤姐","text":"这里王夫人和李纨、凤姐儿、宝钗姐妹等，见大夫出去，方从厨后出来。王夫人略坐一坐，也回房去了。刘老老见无事，方上来和贾母告辞。贾母说：“闲了再来。”又命鸳鸯来：“好生打发刘老老出去。我身上不好，不能送你。”刘老老道了谢，又作辞，方同鸳鸯出来。到了下房，鸳鸯指炕上一个包袱说道：“这是老太太的几件衣裳，都是往年间生日节下众人孝敬的。老太太从不穿人家做的，收着也可惜，却是一次也没穿过的，昨日叫我拿出两套来送你带了去，或送人，或自己家里穿罢。这盒…","so":0,"eo":0},{"surface":"凤姐","text":"忽见素云进来说：“我们奶奶请二位姑娘商议要紧的事呢。二姑娘、三姑娘、四姑娘、史姑娘、宝二爷，都等着呢。”宝钗说：“又是什么事？”黛玉道：“咱们到了那里就知道了。”说着，便和宝钗往稻香村来，果见众人都在那里。李纨见了他两个，笑道：“社还没起，就有脱滑儿的了，四丫头要告一年的假呢。”黛玉笑道：“都是老太太昨儿一句话，又叫他画什么园子图儿，惹的他乐得告假了。”探春笑道：“也别怪老太太，都是刘老老一句话。”黛玉忙笑接道：“可是呢，都是他一句话。…","so":0,"eo":0},{"surface":"凤姐","text":"宝钗道：“我说你是‘无事忙’，说了一声，你就问他去，也等着商议定了再去。如今且说拿什么画？”宝玉道：“家里有雪浪纸，又大，又托墨。”宝钗冷笑道：“我说你不中用，那雪浪纸写字、画写意画儿，或是会山水的画南宗山水，托墨，禁得皴染。拿了画这个，又不托色，又难烘，画也不好，纸也可惜。我教给你一个法子，原先盖这园子就有一张细致图样，虽是画工描的，那地步方向是不错的。你和太太要出来，也比着那纸的大小，和凤姐姐要一块重绢，交给外边相公们，叫他照着这图…","so":0,"eo":0}]},{"chap":43,"ctitle":"第43章 闲取乐偶攒金庆寿 不了情暂撮土为香","deeds":[{"surface":"凤姐","text":"话说王夫人因见贾母那日在大观园不过着了些风寒，不是什么大病，请医生吃了两剂药也就好了，命凤姐来，吩咐他预备给贾政带送东西。正商议着，只见贾母打发人来叫，王夫人忙引着凤姐儿过来。王夫人又请问：“这会子可又觉大安些？”贾母道：“今日可大好了。方才你们送来野鸡崽子汤，我尝了一尝，倒有味儿，又吃了两块肉，心里很受用。”王夫人笑道：“这是凤丫头孝敬老太太的，算他的孝心虔，不枉了素日老太太疼他。”贾母点头笑道：“难为他想着。若是还有生的，再炸上两块…","so":0,"eo":0},{"surface":"凤姐","text":"这里贾母又向王夫人笑道：“我打发人找你来，不为别的，初二日是凤丫头的生日。上两年我原想着替他做生日，偏到跟前又有事就混过去了。今年人又齐全，料着又没事，咱们大家好生乐一天。”王夫人笑道：“我也想着呢。既是老太太高兴，何不就商议定了？”贾母笑道：“我想往年不拘谁做生日，都是各自送各自的礼，这个也俗了，也觉太生分。今儿我出个新法子，又不生分，又可以取乐儿。”王夫人忙道：“老太太怎么想着好，就是怎么样行。”贾母笑道：“我想着咱们也学那小家子，…","so":0,"eo":0},{"surface":"凤姐","text":"贾母笑着把方才一夕话说与众人听了，众人谁不凑这趣儿呢。再也有和凤姐儿好，情愿这样的。也有怕凤姐儿，巴不得奉承他的。况且都是拿的出来的，所以一闻此言都欣然应诺。贾母先道：“我出二十两。”薛姨妈笑道：“我随着老太太，也是二十两。”邢夫人王夫人笑道：“我们不敢和老太太并肩，自然矮一等，每人十六两罢了。”尤氏李纨也笑道：“我们自然又矮一等，每人十二两罢。”贾母忙和李纨道：“你寡妇失业的，那里还拉你出这个钱，我替你出了罢。”凤姐忙笑道：“老太太别…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐又笑道：“上下都全了，还有二位姨奶奶，他出不出也问一声儿。尽到他们是理，不然他们只当小看了他们了。”贾母听说，忙说：“可是呢。怎么倒忘了他们？只怕他们不得闲儿，叫个丫头问问去。”说着，早有丫头去了。半日回来说道：“每位也出二两。”贾母喜欢道：“拿笔砚来算明，共计多少。”尤氏因悄悄的骂凤姐道：“我把你这没足够的小蹄子儿，这么些婆婆婶子凑银子给你做生日，你还不够，又拉上两个苦瓠子。”凤姐也悄悄的笑道：“你少胡说，一会子离了这里，我才和你…","so":0,"eo":0},{"surface":"凤姐","text":"说着早已早已合了，共凑了一百五十两有零。贾母道：“一天戏酒用不了。”尤氏道：“既不请客，酒席又不多，两三日的用度都够了。头等，戏不用钱，省在这上头。”贾母道：“凤丫头说那一班好，就传那一班。”凤姐道：“咱们家的班子都听熟了，倒是花几个钱叫一班来听听罢。”贾母道：“这件事我交给珍哥媳妇了，越发叫凤丫头别操一点心儿，受用一日才算。”尤氏答应着。又说了一回话，都知贾母乏了，才浙渐的散出来。","so":0,"eo":0},{"surface":"凤姐","text":"尤氏等送出邢夫人王夫人二人散去，因往凤姐房里来，商议怎么办生日的话。凤姐儿道：“你不用问我，你只看老太太的眼色儿行事就完了。”尤氏笑道：“你这么个阿物儿，也忒行了大运了。我当有什么事叫我们去，原来单为这个。出了钱不算，还叫我操心，你怎么谢我？”凤姐笑道：“别扯臊，我又没叫你来，谢你什么？你怕操心，你这会子就回老太太去，再派一个就是了。”尤氏笑道：“你瞧瞧，把他兴的这个样儿，我劝你收着些儿好，太满了就要流出来了。”二人又说了一回方散。","so":0,"eo":0},{"surface":"凤姐","text":"说着，尤氏梳洗了，命人伺候车辆。一时来至荣府，先来见凤姐，只见凤姐已将银子封好，正要送去。尤氏问：“都齐了么？”凤姐笑道：“都有了，快拿去罢，丢了我不管。”尤氏笑道：“我有些信不及，倒要当面点一点。”说着，果然按数一点，只没有李纨的一分。尤氏笑道：“我说你闹鬼呢，怎么你大嫂子的没有？”凤姐笑道：“那么些还不够？就短一分儿也罢了。等不够了，我再找给你。”尤氏道：“昨儿你在人跟前做情，今儿又来和我赖，这我可不依你。我只和老太太要去。”凤姐笑…","so":0,"eo":0},{"surface":"凤姐","text":"”尤氏笑道：“只这一分儿不给也罢了，要不看你素日孝敬我，我本来依你么？”说着，把平儿的一分也拿出来，说道：“平儿来，把你的收了去，等不够了，我替你添上。”平儿会意，笑道：“奶奶先使着，若剩下了，再赏我一样。”尤氏笑道：“只许你主子作弊，就不许我作情吗？”平儿只得收了。尤氏又道：“我看着你主子这么细致，弄这些钱，那里使去？使不了，明儿带了棺材里使去？”一面说着，一面又往贾母处来。先请了安，大概说了两句话，便走到鸳鸯房中，和鸳鸯商议，只听鸳…","so":0,"eo":0}]},{"chap":44,"ctitle":"第44章 变生不测凤姐泼醋 喜出望外平儿理妆","deeds":[{"surface":"凤姐","text":"且说贾母心想，今日不比往日，定要教凤姐痛乐一日。本自己懒怠坐席，只在里间屋里榻上歪着和薛姨妈看戏，随心爱吃的拣几样放在小几上，随意吃着说话儿。将自己两桌席面，赏那没有席面的大小丫头并那应着差的妇人等，命他们在窗外廊檐下，也只管坐着随意吃喝，不必拘礼。王夫人和邢夫人在地下高桌上坐着，外面几席是他们姐妹们坐。贾母不时吩咐尤氏等，“让凤丫头坐上面，你们好生替我待东，难为他一年到头辛苦。”尤氏答应了，又笑回道：“他说坐不惯首席，坐在上头，横不是…","so":0,"eo":0},{"surface":"凤姐","text":"接着众姐妹也来，凤姐也只得每人的喝了两口，赖嬷嬷见贾母尚且这等高兴，也少不得来凑趣儿，领着些嬷嬷们也来敬酒。凤姐儿也难推脱，只得喝了两口。鸳鸯等也都来敬，凤姐儿真不能了，忙央告道：“好姐姐们饶了我罢！我明儿再喝罢。”鸳鸯笑道：“真个的，我们是没脸的了？就是我们在太太跟前，太太还赏个脸儿呢。往常倒有些体面，今儿当着这些人，倒做起主子的款儿来了。我原不该来，不喝，我们就走。”说着真个回去了。凤姐儿忙忙拉住，笑道：“好姐姐，我喝就是了。”说着…","so":0,"eo":0},{"surface":"凤姐","text":"然后又入席，凤姐儿自觉酒沉了，心里突突的往上撞，要往家去歇歇。只见那耍百戏的上来，便和尤氏说：“预备赏钱，我要洗洗脸去。”尤氏点头。凤姐儿瞅人不防，便出了席，往房门后檐下走来。平儿留心，也忙跟了来，凤姐便扶着他。才至穿廊下，只见他屋里的一个小丫头子正在那里站着，见他两个来了，回身就跑。凤姐儿便疑心，忙叫：那丫头先只装听不见，无奈后面连声儿叫，也只得回来。凤姐儿越发起了疑心，忙和平儿进了穿廊。叫那小丫头子也进来，把格扇开了，凤姐坐在当院子…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐听了，已气的浑身发软，忙立起身来，一径来家。刚至院门，只见有一个小丫头在门前探头儿，一见了凤姐也缩头就跑。凤姐儿提着名字喝住，那丫头本来伶俐，见躲不过了，越发的跑出来了，笑道：“我正要告诉奶奶去呢，可巧奶奶来了。”凤姐道：“告诉我什么？”那丫头便说：“二爷在家……”这般如此，将方才的话也说了一遍。凤姐啐道：“你早做什么了？这会子我看见你了，你来推干净儿！”说着，扬手一下，打的那丫头一个趔趄，便蹑脚儿走了。","so":0,"eo":0},{"surface":"凤姐","text":"凤姐来至窗前，往里听时，只听里头说笑道：“多早晚你那阎王老婆死了就好了。”贾琏道：“他死了，再娶一个也这么着，又怎么样呢？”那个又道：“他死了，你倒是把平儿扶了正，只怕还好些。”贾琏道：“如今连平儿他也不叫我沾一沾了。平儿也是一肚子委屈，不敢说。我命里怎么就该犯了夜叉星！”凤姐听了，气的浑身乱战，又听他们都赞平儿，便疑平儿素日背地里自然也有怨言了，那酒越发涌上来了。也并不忖夺，回身把平儿先打了两下子。一脚踢开了门，进去也不容分说，抓着鲍…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏也因吃多了酒，进来高兴，不曾做的机密，一见凤姐来了，早没了主意。又见平儿也闹起来，把酒也气上来了。凤姐儿打鲍二家的，他已又气又愧，只不好说的，今见平儿也打，便上来踢骂道：“好娼妇，你也动手打人！”平儿气怯，忙住了手，哭道：“你们背地里说话，为什么拉我呢？”凤姐见平儿怕贾琏，越发气了，又赶上来打着平儿，偏叫打鲍二家的。平儿急了，便跑出来找刀子要寻死。外面众婆子丫头忙拦住解劝。这里凤姐见平儿寻死去，便一头撞在贾琏怀里，叫道：“他们一条藤…","so":0,"eo":0},{"surface":"凤姐","text":"正闹的不开交，只见尤氏等一群人来了，说：“这是怎么说？才好好的，就闹起来。”贾琏见了人，越发倚酒三分醉逞起威风来，故意要杀凤姐儿。凤姐儿见人来了，便不似先前那般泼了，撂下众人，便哭着往贾母那边跑。此时戏已散了，凤姐跑到贾母跟前，爬在贾母怀里，只说：“老祖宗救我，琏二爷要杀我呢！”贾母、邢夫人、王夫人等忙问：“怎么了？”凤姐儿哭道：“我才家去换衣裳，不防琏二爷在家和人说话。我只当是有客来了，唬的我不敢进去在窗户外头听了一听，原来是鲍二家的…","so":0,"eo":0},{"surface":"凤姐","text":"这里邢夫人、王夫人也说凤姐，贾母道：“什么要紧的事，小孩子们年轻，馋嘴猫儿似的，那里保的住呢？从小儿人人都打这么过。这都是我的不是，叫你多喝了两口酒，又吃起醋来了！”说的众人都笑了。贾母又道：“你放心，明儿我叫你女婿替你赔不是，你今儿别过去臊着他。”因又骂：“平儿那蹄子，素日我倒看他好，怎么背地里这么坏！”尤氏等笑道：“平儿没有不是，是凤丫头拿着人家出气。两口子生气，都拿着平儿煞性子，平儿委屈的什么儿似的，老太太还骂人家。”贾母道：“这…","so":0,"eo":0}]},{"chap":45,"ctitle":"第45章 金兰契互剖金兰语 风雨夕闷制风雨词","deeds":[{"surface":"凤姐","text":"话说凤姐儿正抚恤平儿，忽见众姐妹进来，忙让了坐，平儿斟上茶来。凤姐儿笑道：“今儿来的这些人，倒象下帖子请了来的。”探春先笑道：“我们有两件事，一件是我的，一件是四妹妹的，还夹着老太太的话。”凤姐儿笑道：“有什么事这么要紧？”探春笑道：“我们起了个诗社，头一社就不齐全，众人脸软，所以就乱了例了。我想必得你去做个‘监社御史’，铁面无私才好。再四妹妹为画园子，用的东西这般那般不全，回了老太太，老太太说：‘只怕后头楼底下还有先剩下的，找一找。若…","so":0,"eo":0},{"surface":"凤姐","text":"李纨笑道：“你们听听，我说了一句，他就说了两车无赖的话！真真泥腿光棍，专会打细算盘、分金辩两的。你这个东西，亏了还托生在诗书仕宦人家做小姐，又是这么出了嫁，还是这么着。要生在贫寒小门小户人家，做了小子丫头，还不知怎么下作呢？天下都叫你算计了去！昨儿还打平儿，亏你伸的出手来。那黄汤难道灌丧了狗肚子里去了？气的我只要替平儿打抱不平儿。忖夺了半日，好容易‘狗长尾巴尖儿’的好日子，又怕老太太心里不受用，因此没来。究竟气还不平，你今儿倒招我来了。…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿笑道：“好嫂子，你且同他们去园子里去。才要把这米账合他们算一算，那边大太太又打发人来叫，又不知有什么话说，须得过去走一走。还有你们年下添补的衣裳，打点给人做去呢。”李纨笑道：“这些事情我都不管，你只把我的事完了，我好歇着去，省了这些姑娘们闹我。”凤姐儿忙笑道：“好嫂子，赏我一点空儿。你是最疼我的，怎么今儿为平儿就不疼我了？往常你还劝我说：‘事情虽多，也该保全身子，检点着偷空儿歇歇。’你今儿倒反逼起我的命来了。况且误了别人年下的衣裳…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿道：“过会子我开了楼房，所有这些东西，叫人搬出来你们瞧，要使得，留着使；要少什么，照你们的单子，我叫人赶着买去就是了。画绢我就裁出来。那图样没有在老太太那里，那边珍大爷收着呢。说给你们，省了碰钉子去。我去打发人取了来，一并叫人连绢交给相公们矾去，好不好呢？”李纨点头笑道：“这难为你。果然这么着还罢了。那么着，咱们家去罢，等着他不送了去，再来闹他。”说着便带了他姐妹们就走。凤姐儿道：“这些事再没别人，都是宝玉生出来的。”李纨听了，忙…","so":0,"eo":0},{"surface":"凤姐","text":"说着才要回去，只见一个小丫头扶着赖嬷嬷进来。凤姐等忙站起来，笑道：“大娘坐下。”又都向他道喜。赖嬷嬷向炕沿上坐了，笑道：“我也喜，主子们也喜。要不是主子们的恩典，我这喜打那里来呢。昨儿奶奶又打发彩哥赏东西，我孙子在门上朝上磕了头了。”李纨笑道：“多早晚上任去？”赖嬷嬷叹道：“我那里管他们，由他们去罢。前儿在家里给我磕头，我没好话。我说：‘小子，别说你是官了，横行霸道的！你今年活了三十岁，虽然是人家的奴才，一落娘胎胞儿，主子的恩典，放你出…","so":0,"eo":0},{"surface":"凤姐","text":"说着，只见赖大家的来了，接着周瑞家的张材家的都进来回事情。凤姐儿笑道：“媳妇来接婆婆来了。”赖大家的笑道：“不是接他老人家来的，倒是打听打听奶奶、姑娘们赏脸不赏脸？”赖嬷嬷听了，笑道：“可是我糊涂了，正经说的都没说，且说些陈谷子烂芝麻的。因为我们小子选出来了，众亲友要给他贺喜，少不得家里摆个酒。我想摆一日酒，请这个不请那个也不是。又想了一想，托主子的洪福，想不到的这么荣耀光彩，就倾了家我也愿意的。因此吩咐了他老子连摆三日酒：头一日在我们…","so":0,"eo":0},{"surface":"凤姐","text":"周瑞家的忙跪下央求。赖嬷嬷忙道：“什么事？说给我评评。”凤姐儿道：“前儿我的生日，里头还没喝酒，他小子先醉了。老娘那边送了礼来，他不在外头张罗，倒坐着骂人，礼也不送进来。两个女人进来了，他才带领小么儿们往里端。小幺儿们倒好好的，他拿的一盒子倒失了手，撒了一院子馒头。人去了，我打发彩明去说他，他倒骂了彩明一顿。这样无法无天的忘八羔子．还不撵了做什么！”赖嬷嬷道：“我当什么事情，原来为这个。奶奶听我说，他有的不是，打他骂他，叫他改过就是了，…","so":0,"eo":0},{"surface":"凤姐","text":"李纨等也就回园中来。至晚，果然凤姐命人找了许多旧收的画具出来，送至园中。宝钗等选了一回。各色东西可用的只有一半，将那一半开了单子，给凤姐去照样置买，不必细说。","so":0,"eo":0}]},{"chap":46,"ctitle":"第46章 尴尬人难免尴尬事 鸳鸯女誓绝鸳鸯偶","deeds":[{"surface":"凤姐","text":"如今且说凤姐儿，因见邢夫人叫他，不知何事，忙另穿戴了一番，坐车过来。邢夫人将房内人遣出，悄悄向凤姐儿道：“叫你来不为别的，有一件为难的事，老爷托我，我不得主意，先和你商议。老爷看上了老太太屋里的鸳鸯，要他在房里，叫我和老太太讨去。我想这倒是常有的事，就怕老太太不给。你可有法子办这件事么？”凤姐儿听了，忙陪笑道：“依我说，竟别碰这个钉子去。老太太离了鸳鸯，饭也吃不下去，那里就舍得了？况且平日说起闲话来，老太太常说老爷：‘如今上了年纪，做什…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐知道邢夫人禀性愚弱，只知奉承贾赦以自保，次则婪取财货为自得，家下一应大小事务俱由贾赦摆布。凡出入银钱一经他的手，便克扣异常，以贾赦浪费为名，“须得我就中俭省，方可偿补”。儿女奴仆，一人不靠，一言不听。如今又听说如此的话，便知他又弄左性子，劝也不中用了，连忙陪笑说道：“太太这话说的极是。我能活了多大，知道什么轻重？想来父母跟前，别说一个丫头，就是那么大的一个活宝贝，不给老爷给谁？背地里的话，那里信的，我竟是个傻子。拿着二爷说起，或有日…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿暗想：“鸳鸯素昔是个极有心胸气性的丫头，虽如此说，保不严他愿意不愿意。我先过去了，太太后过去，他要依了，便没的话说；倘或不依，太太是多疑的人，只怕疑我走了风声，叫他拿腔作势的。那时太太又见应了我的话，羞恼变成怒，拿我出起气来倒没意思。不如同着一齐过去了，他依也罢，不依也罢，就疑不到我身上了。”想毕，因笑道：“才我临来，舅母那边送了两笼子鹌鹑，我吩咐他们炸了，原要赶太太晚饭上送过来，我才进大门时，见小子们抬车，说太太的车拔了缝，拿去…","so":0,"eo":0},{"surface":"凤姐","text":"鸳鸯红了脸，夺手不行。邢夫人知他害臊，便又说道：“这有什么臊的，又不用你说话，只跟着我就是了。”鸳鸯只低头不动身。邢夫人见他这般、便又说道：“难道你还不愿意不成？若果然不愿意，可真是个傻丫头了。放看主子奶奶不做，倒愿意做丫头。三年两年不过配上个小子，还是奴才。你跟我们去，你知道我的性子又好，又不是那不容人的人，老爷待你们又好。过一年半载生个一男半女，你就和我并肩了。家里的人，你要使唤谁，谁还不动？现成主子不做去，错过了机会，后悔就迟了。…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿早换了衣裳，因屋内无人，便将此话告诉了平儿。平儿也摇头笑道：“据我看来、未必妥当。平常我们背着人说起话来，听他那个主意，未必肯。也只说着瞧罢了。”凤姐儿道：“太太必来这屋里商量。依了还犹可，要是不依，白讨个没趣儿，当着你们，岂不脸上不好看。你说给他们炸些鹌鹑，再有什么配几样，预备吃饭，你且别处逛逛去，估量着走了你再来。”平儿听说，照样传给婆子们，便逍遣遥自在的园子里来。","so":0,"eo":0},{"surface":"凤姐","text":"这里鸳鸯见邢夫人去了，必到凤姐房里商议去了，还必定有人来问他，不如躲了这里，因找了琥珀道：“老太太要问我，只说我病了，没吃早饭，往园子里逛逛就来。”琥珀答应了。鸳鸯便往园子里来各处游玩。不想正遇见平儿。平儿见无人，便笑道：“新姨娘来了。”鸳鸯听了，便红了脸，说道：“怪道你们串通一气来算计我！等着我和你主子闹去就是了。”平儿见鸳鸯满脸恼意，自悔失言，便拉到枫树底下，坐在一块石上，把方才凤姐过去回来所有的形景言词、始末原由，都告诉了他。鸳鸯…","so":0,"eo":0},{"surface":"凤姐","text":"那边邢夫人因问凤姐儿鸳鸯的父亲，凤姐因说：“他爹的名字叫金彩，两口子都在南京看房子，不大上来，他哥哥文翔，现在是老太太的买办。他嫂子也是老太太那边浆洗上的头儿。”邢夫人便命人叫了他嫂子金文翔的媳妇来，细细说给他。那媳妇自是喜欢，兴兴头头去找鸳鸯，指望一说必妥，不想披鸳鸯抢白了一顿，又被袭人、平儿说了几句，羞恼回来。便对邢夫人说：“不中用，他骂了我一场。”因凤姐儿在旁，不敢提平儿，说：“袭人也帮着抢白我，说了我许多不知好歹的话，回不得主子…","so":0,"eo":0},{"surface":"凤姐","text":"邢夫人无计，吃了饭回家，晚上告诉了贾赦。贾赦想了一想，即刻叫贾琏来，说：“南京的房子还有人看着，不止一家，即刻叫金彩来。”贾琏回道：“上次南京信来，金彩已经得了痰迷心窍，那边连棺材银子都赏了，不知如今是死是活。即便活着，人事不知，叫来无用。他老婆子又是个聋子。”贾赦听了，喝了一声，又骂：“混账！没天理的囚攘的，偏你这么知道！还不离了我这里！”唬的贾琏退出。一时又叫传金文翔。贾琏在外书房伺候着，又不敢家去，又不敢见他父亲，只得听着。一时金…","so":0,"eo":0}]},{"chap":47,"ctitle":"第47章 呆霸王调情遭苦打 冷郎君惧祸走他乡","deeds":[{"surface":"
