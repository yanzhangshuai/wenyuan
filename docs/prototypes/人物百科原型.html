,"dir":"in"},{"id":"cd9df95d-5525-4a81-aaff-f445e48ecb86","code":"夫妻","sc":55,"ec":null,"status":"ACTIVE","other":"二奶奶","dir":"out"},{"id":"8bd7857f-06ab-4a44-8890-a446dc7aea61","code":"主仆","sc":55,"ec":null,"status":"ACTIVE","other":"秋纹","dir":"out"},{"id":"394483bd-cc11-4fd4-a617-2e293a8b7edb","code":"主仆","sc":64,"ec":71,"status":"ACTIVE","other":"林之孝","dir":"out"},{"id":"8915edd0-6557-47cb-8217-3149404d3ca8","code":"主仆","sc":68,"ec":null,"status":"ACTIVE","other":"庆儿","dir":"out"},{"id":"ceae12a8-bdb5-4909-8103-477d5de8dc68","code":"主仆","sc":68,"ec":null,"status":"ACTIVE","other":"善姐","dir":"out"},{"id":"0079985d-aabd-43f4-bd58-47f07149cb2b","code":"主仆","sc":68,"ec":null,"status":"ACTIVE","other":"王信","dir":"out"},{"id":"5b26f3cf-1dc0-4f18-87f6-563a541236bf","code":"主仆","sc":68,"ec":null,"status":"ACTIVE","other":"兴儿","dir":"out"},{"id":"4c40fc7f-1654-4065-8a85-4b91d57b99fa","code":"仇敌","sc":69,"ec":null,"status":"ACTIVE","other":"尤二","dir":"out"},{"id":"e8d51edd-ac76-477a-a81f-30a84d71e661","code":"朋友","sc":70,"ec":null,"status":"ACTIVE","other":"王子腾","dir":"in"},{"id":"9327efbb-078b-45b9-a073-b21f41b2faf6","code":"主仆","sc":88,"ec":null,"status":"ACTIVE","other":"秋桐","dir":"out"},{"id":"2a8879ab-d847-435c-9f22-f16ba7ef32b8","code":"仇敌","sc":112,"ec":null,"status":"ACTIVE","other":"赵姨娘","dir":"in"}]},{"id":"e017d314-6e05-4e4e-95e1-6aa5c89862de","name":"贾母","type":"PERSON","mentionCount":558,"chapterCount":102,"firstChapter":2,"lastChapter":120,"aliases":["史老夫人","外祖母","太夫人","太婆婆","老寿星","老祖宗","荣国太君","贾门史氏"],"density":"rich","timeline":[{"chap":2,"ctitle":"第2章 贾夫人仙逝扬州城 冷子兴演说荣国府","deeds":[{"surface":"贾母","text":"再说荣府你听：方才所说异事就出在这里。自荣公死后，长子贾代善袭了官，娶的是金陵世家史侯的小姐为妻。生了两个儿子，长名贾赦，次名贾政。如今代善早已去世，太夫人尚在。长子贾赦袭了官，为人却也中平，也不管理家事，惟有次子贾政，自幼酷喜读书，为人端方正直。祖父钟爱，原要他从科甲出身，不料代善临终遗本一上，皇上怜念先臣，即叫长子袭了官。又问还有几个儿子，立刻引见，又将这政老爷赐了个额外主事职衔，叫他入部习学，如今现已升了员外郎。这政老爷的夫人王氏…","so":0,"eo":0},{"surface":"贾母","text":"子兴道：“便是贾府中现在三个也不错。政老爷的长女名元春，因贤孝才德，选入宫作女史去了。二小姐乃是赦老爷姨娘所出，名迎春。三小姐政老爷庶出，名探春。四小姐乃宁府珍爷的胞妹，名惜春。因史老夫人极爱孙女，都跟在祖母这边，一处读书，听得个个不错。”雨村道：“更妙在甄家风俗，女儿之名亦皆从男子之名，不似别人家里另外用这些‘春’‘红’‘香’‘玉’等艳字。何得贾府亦落此俗套？”子兴道：“不然。只因现今大小姐是正月初一所生，故名‘元春’，馀者都从了‘春…","so":0,"eo":0}]},{"chap":3,"ctitle":"第3章 托内兄如海荐西宾 接外孙贾母惜孤女","deeds":[{"surface":"贾母","text":"那女学生原不忍离亲而去，无奈他外祖母必欲其往，且兼如海说：“汝父年已半百，再无续室之意，且汝多病，年又极小，上无亲母教养，下无妹妹扶持。今去依傍外祖母及舅氏姊妹，正好减我内顾之忧，如何不去？”黛玉听了，方洒泪拜别，随了奶娘及荣府中几个老妇登舟而去。雨村另有船只，带了两个小童，依附黛玉而行。","so":0,"eo":0},{"surface":"贾母","text":"且说黛玉，自那日弃舟登岸时，便有荣府打发轿子并拉行李车辆伺候。这黛玉尝听得母亲说，他外祖母家与别人家不同。他近日所见的这几个三等的仆妇，吃穿用度已是不凡，何况今至其家，都要步步留心，时时在意，不要多说一句话，不多行一步路，恐被人耻笑了去。自上了轿，进了城，从纱窗中瞧了一瞧，其街市之繁华，人烟之阜盛，自非别处可比。又行了半日，忽见街北蹲着两个大石狮子，三间兽头大门，门前列坐着十来个华冠丽服之人，正门不开，只东西两角门有人出入。正门之上有一…","so":0,"eo":0},{"surface":"贾母","text":"黛玉方进房，只见两个人扶着一位鬓发如银的老母迎上来。黛玉知是外祖母了，正欲下拜，早被外祖母抱住，搂人怀中，“心肝儿肉”叫着大哭起来。当下侍立之人无不下泪，黛玉也哭个不休。众人慢慢解劝，那黛玉方拜见了外祖母，贾母方一一指与黛玉道：“这是你大舅母。这是二舅母。这是你先前珠大哥的媳妇珠大嫂子。”黛玉一一拜见。贾母又叫：“请姑娘们。今日远客来了，可以不必上学去。”众人答应了一声，便去了两个。不一时，只见三个奶妈并五六个丫鬟，拥着三位姑娘来了。第…","so":0,"eo":0},{"surface":"贾母","text":"众人见黛玉年纪虽小，其举止言谈不俗，身体面貌虽弱不胜衣，却有一段风流态度，便知他有不足之症。因问：“常服何药？为何不治好了？”黛玉道：“我自来如此，从会吃饭时便吃药，到如今了，经过多少名医，总未见效。那一年我才三岁，记得来了一个癞头和尚，说要化我去出家。我父母自是不从，他又说：‘既舍不得他，但只怕他的病一生也不能好的。若要好时，除非从此以后总不许见哭声，除父母之外，凡有外亲一概不见，方可平安了此一生。’这和尚疯疯癫癫说了这些不经之谈，也…","so":0,"eo":0},{"surface":"贾母","text":"一语未完，只听后院中有笑语声，说：“我来迟了，没得迎接远客！”黛玉思忖道：“这些人个个皆敛声屏气如此，这来者是谁，这样放诞无礼？”心下想时，只见一群媳妇丫鬟拥着一个丽人从后房进来。这个人打扮与姑娘们不同，彩绣辉煌，恍若神妃仙子。头上戴着金丝八宝攒珠髻，绾朝阳五凤挂珠钗，项上戴着赤金盘螭缨络圈，身上穿着缕金百蝶穿花大红云缎窄裉袄，外罩五彩刻丝石青银鼠褂，下着翡翠撒花洋绉裙。一双丹凤三角眼，两弯柳叶掉捎眉，身量苗条，体格风骚，粉面含春威不露…","so":0,"eo":0},{"surface":"贾母","text":"这熙凤携着黛玉的手，上下细细打量一回，便仍送至贾母身边坐下，因笑道：“天下真有这样标致人儿！我今日才算看见了。况且这通身的气派，竟不象老祖宗的外孙女儿，竟是嫡亲的孙女儿似的，怨不得老祖宗天天嘴里心里放不下。只可怜我这妹妹这么命苦，怎么姑妈偏就去世了呢！”说着便用帕拭泪。贾母笑道：“我才好了，你又来招我。你妹妹远路才来，身子又弱，也才劝住了，快别再提了。”熙凤听了，忙转悲为喜道：“正是呢！我一见了妹妹，一心都在他身上，又是喜欢，又是伤心，…","so":0,"eo":0},{"surface":"贾母","text":"当下茶果已撤，贾母命两个老嬷嬷带黛玉去见两个舅舅去。维时贾赦之妻邢氏忙起身笑回道：“我带了外甥女儿过去，到底便宜些。”贾母笑道：“正是呢。你也去罢，不必过来了。”那邢夫人答应了，遂带着黛玉和王夫人作辞，大家送至穿堂。垂花门前早有众小厮拉过一辆翠幄清油车来，邢夫人携了黛玉坐上，众老婆们放下车帘，方命小厮们抬起。拉至宽处，驾上驯骡，出了西角门往东，过荣府正门，入一黑油漆大门内，至仪门前方下了车。邢夫人挽着黛玉的手进入院中，黛玉度其处，必是荣…","so":0,"eo":0},{"surface":"贾母","text":"茶未吃了，只见一个穿红绩袄青绸掐牙背心的一个丫鬟走来笑道：“太太说：请林姑娘到那边坐罢。”老嬷嬷听了，于是又引黛玉出来，到了东南三间小正房内。正面炕上横设一张炕桌，上面堆着书籍茶具，靠东壁面西设着半旧的青缎靠背引枕。王夫人却坐在西边下首，亦是半旧青缎靠背坐褥。见黛玉来了，便往东让。黛玉心中料定这是贾政之位，因见挨炕一溜三张椅子上也搭着半旧的弹花椅袱，黛玉便向椅上坐了。王夫人再三让他上炕，他方挨王夫人坐下。王夫人因说：“你舅舅今日斋戒去了…","so":0,"eo":0}]},{"chap":4,"ctitle":"第4章 薄命女偏逢簿命郎 葫芦僧判断葫芦案","deeds":[{"surface":"贾母","text":"那时王夫人巳知薛蟠官司一事亏贾雨村就中维持了，才放了心。又见哥哥升了边缺，正愁少了娘家的亲戚来往，略加寂寞。过了几日，忽家人报：“姨太太带了哥儿姐儿合家进京在门外下车了。”喜的王夫人忙带了人接到大厅上，将薛姨妈等接进去了。妹妹们一朝相见，悲喜交集，自不必说。叙了一番契阔，又引着拜见贾母，将人情土物各种酬献了。合家俱厮见过，又治席接风。薛蟠拜见过贾政贾琏，又引着见了贾赦贾珍等。贾政便使人进来对王夫人说：“姨太太已有了年纪，外甥年轻，不知庶…","so":0,"eo":0},{"surface":"贾母","text":"原来这梨香院乃当日荣公暮年养静之所，小小巧巧，约有十馀间房舍，前厅后舍俱全。另有一门通街，薛蟠的家人就走此门出入：西南上又有一个角门，通着夹道子，出了夹道便是王夫人正房的东院了。每日或饭后或晚间，薛姨妈便过来，或与贾母闲谈，或与王夫人相叙。宝钗与黛玉、迎春妹妹等一处，或看书下棋，或做针黹，倒也十分相安。只是薛蟠起初原不欲在贾府中居住，生恐姨父管束，不得自在；无奈母亲执意在此，且贾宅中又十分殷勤苦留，只得暂且住下，一面使人打扫出自家的房屋…","so":0,"eo":0}]},{"chap":5,"ctitle":"第5章 贾宝玉神游太虚境 警幻仙曲演红楼梦","deeds":[{"surface":"贾母","text":"第四回中既将薛家母子在荣府中寄居等事略已表明，此回暂可不写了。如今且说林黛玉自在荣府，一来贾母万般怜爱，寝食起居一如宝玉，把那迎春、探春、惜春三个孙女儿倒且靠后了；就是宝玉黛玉二人的亲密友爱，也较别人不同，日则同行同坐，夜则同止同息，真是言和意顺，似漆如胶。不想如今忽然来了一个薛宝钗，年纪虽大不多，然品格端方，容貌美丽，人人都说黛玉不及。那宝钗却又行为豁达，随分从时，不比黛玉孤高自许，目无下尘，故深得下人之心，就是小丫头们亦多和宝钗亲近…","so":0,"eo":0},{"surface":"贾母","text":"因东边宁府花园内梅花盛开，贾珍之妻尤氏乃治酒具，请贾母、邢夫人、王夫人等赏花，是日先带了贾蓉夫妻二人来面请。贾母等于早饭后过来，就在会芳园游玩，先茶后酒。不过是宁荣二府眷属家宴，并无别样新文趣事可记。","so":0,"eo":0},{"surface":"贾母","text":"一时宝玉倦怠，欲睡中觉。贾母命人：“好生哄着，歇息一回再来。”贾蓉媳妇秦氏便忙笑道：“我们这里有给宝二叔收拾下的屋子，老祖宗放心，只管交给我就是了。”因向宝玉的奶娘丫鬟等道：“嬷嬷、姐姐们，请宝二叔跟我这里来。”贾母素知秦氏是极妥当的人，因他生得袅娜纤巧，行事又温柔和平，乃重孙媳中第一个得意之人。见他去安置宝玉，自然是放心的了。","so":0,"eo":0}]},{"chap":6,"ctitle":"第6章 贾宝玉初试云雨情 刘老老一进荣国府","deeds":[{"surface":"贾母","text":"却说秦氏因听见宝玉梦中唤他的乳名，心中纳闷，又不好细问。彼时宝玉迷迷惑惑，若有所失，遂起身解怀整衣。袭人过来给他系裤带时，刚伸手至大腿处，只觉冰冷粘湿的一片，吓的忙褪回手来，问：“是怎么了？”宝玉红了脸，把他的手一捻。袭人本是个聪明女子，年纪又比宝玉大两岁，近来也渐省人事。今见宝玉如此光景，心中便觉察了一半，不觉把个粉脸羞的飞红，遂不好再问。仍旧理好衣裳，随至贾母处来，胡乱吃过晚饭，过这边来，趁众奶娘丫鬟不在旁时，另取出一件中衣与宝玉换…","so":0,"eo":0}]},{"chap":7,"ctitle":"第7章 送宫花贾琏戏熙凤 宴宁府宝玉会秦钟","deeds":[{"surface":"贾母","text":"一时周瑞家的携花至王夫人正房后。原来近日贾母说孙女们太多，一处挤着倒不便，只留宝玉、黛玉二人在这边解闷，却将迎春、探春、惜春三人移到王夫人这边房后三间抱厦内居住，令李纨陪伴照管。如今周瑞家的故顺路先往这里来，只见几个小丫头都在抱厦内默坐，听着呼唤。迎春的丫鬟司棋和探春的丫鬟侍书二人，正掀帘子出来，手里都捧着茶盘茶钟，周瑞家的便知他姐妹在一处坐着，也进入房内。只见迎春、探春二人正在窗下围棋。周瑞家的将花送上，说明原故，二人忙住了棋，都欠身…","so":0,"eo":0},{"surface":"贾母","text":"周瑞家的这才往贾母这边来，过了穿堂，顶头忽见他的女孩儿打扮着才从他婆家来。周瑞家的忙问：“你这会子跑来作什么？”他女孩儿说：“妈，一向身上好？我在家里等了这半日，妈竟不去，什么事情这么忙的不回家？我等烦了，自己先到了老太太跟前请了安了，这会子请太太的安去，妈还有什么不了的差事？手里是什么东西？”周瑞家的笑道：“嗳！今儿偏偏来了个刘老老，我自己多事，为他跑了半日。这会子叫姨太太看见了，叫送这几枝花儿给姑娘奶奶们去，这还没有送完呢。你今儿来…","so":0,"eo":0},{"surface":"贾母","text":"次日凤姐梳洗了，先回王夫人毕，方来辞贾母。宝玉听了，也要逛去，凤姐只得答应着。立等换了衣裳，姐儿两个坐了车。一时进入宁府，早有贾珍之妻尤氏与贾蓉媳妇秦氏，婆媳两个带着多少侍妾丫鬟等接出仪门。那尤氏一见凤姐，必先嘲笑一阵，一手拉了宝玉，同入上房里坐下。秦氏献了茶。凤姐便说：“你们请我来作什么？拿什么孝敬我？有东西就献上来罢，我还有事呢。”尤氏未及答应，几个媳妇们先笑道：“二奶奶今日不来就罢，既来了，就依不得你老人家了。”正说着，只见贾蓉进…","so":0,"eo":0}]},{"chap":8,"ctitle":"第8章 贾宝玉奇缘识金锁 薛宝钗巧合认通灵","deeds":[{"surface":"贾母","text":"话说宝玉和凤姐回家，见过众人，宝玉便回明贾母要约秦钟上家塾之事，自己也有个伴读的朋友，正好发愤。又着实称赞秦钟人品行事，最是可人怜爱的。凤姐又在一旁帮着说：“改日秦钟还来拜见老祖宗呢。”说的贾母喜欢起来。凤姐又趁势请贾母一同过去看戏。贾母虽年高，却极有兴头。后日，尤氏来请，遂带了王夫人、黛玉、宝玉等过去看戏。至晌午，贾母便回来歇息。王夫人本好清净，见贾母回来，也就回来了。然后凤姐坐了首席，尽欢至晚而罢。","so":0,"eo":0},{"surface":"贾母","text":"却说宝玉送贾母回来，待贾母歇了中觉，还要回去看戏，又恐搅的秦氏等人不便。因想起宝钗近日在家养病，未去看视，意欲去望他。若从上房后角门过去，恐怕遇见别事缠绕，又怕遇见他父亲，更为不妥，宁可绕个远儿。当下众嬷嬷丫鬟伺候他换衣服，见不曾换，仍出二门去了，众嬷嬷丫鬟只得跟随出来。还只当地去那边府中看戏，谁知到了穿堂儿，便向东北边绕过厅后而去。偏顶头遇见了门下清客相公詹光、单聘仁二人走来，一见了宝玉，便都赶上来笑着，一个抱着腰，一个拉着手，道：“…","so":0,"eo":0},{"surface":"贾母","text":"他二人道了扰，一径回至贾母房中。贾母尚末用晚饭，知是薛姨妈处来，更加喜欢。因见宝玉吃了酒，遂叫他自回房中歇着，不许再出来了。又令人好生招呼着。忽想起跟宝玉的人来，遂问众人：“李奶子怎么不见？”众人不敢直说他家去了，只说：“才进来了，想是有事，又出去了。”宝玉踉跄着回头道：“他比老太太还受用呢，问他作什么！没有他只怕我还多活两日儿。”一面说，一面来至自己卧室。只见笔墨在案。晴雯先接出来，笑道：“好啊，叫我研了墨，早起高兴，只写了三个字，扔…","so":0,"eo":0},{"surface":"贾母","text":"一时黛玉来了，宝玉笑道：“好妹妹，你别撒谎，你看这三个字那一个好？”黛玉仰头看见是“绛芸轩”三字，笑道：“个个都好，怎么写的这样好了！明儿也替我写个匾。”宝玉笑道：“你又哄我了。”说着又问：“袭人姐姐呢？”晴雯向里间炕上努嘴儿。宝玉看时，见袭人和衣睡着。宝玉笑道：“好啊！这么早就睡了。”又问晴雯道：“今我那边吃早饭，有一碟子豆腐皮儿的包子。我想着你爱吃，和珍大奶奶要了，只说我晚上吃，叫人送来的。你可见了没有？晴雯道：“快别提了。一送来我…","so":0,"eo":0},{"surface":"贾母","text":"原来袭人未睡，不过是故意儿装睡，引着宝玉来怄他玩耍。先听见说字问包子，也还可以不必起来；后来摔了茶钟动了气，遂连忙起来解劝。早有贾母那边的人来问：“是怎么了？”袭人忙道：“我才倒茶，叫雪滑倒了，失手砸了钟子了。”一面又劝宝玉道：“你诚心要撵他也好，我们都愿意出去，不如就势儿连我们一齐撵了，你也不愁没有好的来伏侍你。”宝玉听了，方才不言语了。袭人等便搀至炕上，脱了衣裳，不知宝玉口内还说些什么，只觉口齿缠绵，眉眼愈加饧涩，忙伏侍他睡下。袭人…","so":0,"eo":0},{"surface":"贾母","text":"次日醒来，就有人回：“那边小蓉大爷带了秦钟来拜。”宝玉忙接出去，领了拜见贾母。贾母见秦钟形容标致，举止温柔，堪陪宝玉读书，心中十分喜欢，便留茶留饭，又叫人带去见王夫人等。众人因爱秦氏，见了秦钟是这样人品，也都欢喜，临去时都有表礼。贾母又给了一个荷包和一个金魁星，取“文星和合”之意。又嘱咐他道：“你家住的远，或一时冷热不便，只管住在我们这里。只和你宝二叔在一处，别跟着那不长进的东西们学。”秦钟一一的答应，回家禀知他父亲。他父亲秦邦业现任营…","so":0,"eo":0}]},{"chap":9,"ctitle":"第9章 训劣子李贵承申饬 嗔顽童茗烟闹书房","deeds":[{"surface":"贾母","text":"话说秦邦业父子专候贾家人来送上学之信。原来宝玉急于要和秦钟相遇，遂择了后日一定上学，打发人送了信。到了这天，宝玉起来时，袭人早已把书笔文物收拾停妥，坐在床沿上发闷，见宝玉起来，只得伏侍他梳洗。宝玉见他闷闷的，问道：“好姐姐，你怎么又不喜欢了？难道怕我上学去，撂的你们冷清了不成？”袭人笑道：“这是那里的话？念书是很好的事，不然就潦倒一辈子了，终久怎么样呢？但只一件，只是念书的时候儿想着书，不念的时候儿想着家，总别和他们玩闹，碰见老爷不是玩…","so":0,"eo":0},{"surface":"贾母","text":"说着又至贾母这边，秦钟早已来了，贾母正和他说话儿呢。于是二人见过，辞了贾母。宝玉忽想起未辞黛玉，又忙至黛玉房中来作辞。彼时黛玉在窗下对镜理妆听宝玉说上学去，因笑道：“好！这一去，可是要‘蟾宫折桂’了！我不能送你了。”宝玉道：“好妹妹，等我下学再吃晚饭。那胭脂膏子也等我来再制。”唠叨了半日，方抽身去了。黛玉忙又叫住，问道：“你怎么不去辞你宝姐姐来呢？”宝玉笑而不答，一径同秦钟上学去了。","so":0,"eo":0},{"surface":"贾母","text":"原来这义学也离家不远，原系当日始祖所立，恐族中子弟有力不能延师者，即入此中读书。凡族中为官者皆有帮助银两，以为学中膏火之费，举年高有德之人为师塾。如今秦、宝二人来了，一一的都互相拜见过，读起书来。自此后，二人同来同往同起同坐，愈加亲密。兼贾母爱惜，也常留下秦钟一住三五天，和自己重孙一般看待。因见秦钟家中不甚宽裕，又助些衣服等物。不上一两月工夫，秦钟在荣府里便惯熟了。宝玉终是个不能安分守理的人，一味的随心所欲，因此发了脾性，又向秦钟悄说：…","so":0,"eo":0}]},{"chap":11,"ctitle":"第11章 庆寿辰宁府排家宴 见熙凤贾瑞起淫心","deeds":[{"surface":"贾母","text":"这里渐渐的就有人来。先是贾琏、贾蔷来看了各处的座位，并问：“有什么玩意儿没有？”家人答道：“我们爷算计，本来请太爷今日来家，所以并未敢预备玩意儿。前日听见太爷不来了，现叫奴才们找了一班小戏儿并一档子打十番的，都在园子里戏台上预备着呢。”次后邢夫人、王夫人、凤姐儿、宝玉都来了，贾珍并尤氏接了进去。尤氏的母亲已先在这里，大家见过了，彼此让了坐。贾珍、尤氏二人递了茶，因笑道：“老太太原是个老祖宗，我父亲又是侄儿，这样年纪，这个日子，原不敢请他…","so":0,"eo":0},{"surface":"贾母","text":"且说贾瑞到荣府来了几次，偏都值凤姐儿往宁府去了。这年正是十一月三十日冬至。到交节的那几日，贾母、王夫人、凤姐儿日日差人去看秦氏。回来的人都说：“这几日没见添病，也没见大好。”王夫人向贾母说：“这个症候遇着这样节气，不添病就有指望了。”贾母说：“可是呢。好个孩子，要有个长短，岂不叫人疼死。”说着，一阵心酸，向凤姐儿说道：“你们娘儿们好了一场，明日大初一，过了明日，你再看看他去。你细细的瞧瞧他的光景，倘或好些儿，你回来告诉我。那孩子素日爱吃…","so":0,"eo":0},{"surface":"贾母","text":"于是凤姐儿起身回到家中，见了贾母，说：“蓉哥媳妇请老太太安，给老太太磕头，说他好些了。求老祖宗放心罢。他再略好些，还给老太太磕头请安来呢。”贾母道：“你瞧他是怎么样？”凤姐儿说：“暂且无妨，精神还好呢。”贾母听了，沉吟了半日，因向凤姐说：“你换换衣裳歇歇去罢。”","so":0,"eo":0}]},{"chap":12,"ctitle":"第12章 王熙凤毒设相思局 贾天祥正照风月鉴","deeds":[{"surface":"贾母","text":"盼到晚上，果然黑地里摸人荣府，趁掩门时钻入穿堂。果见漆黑无一人来往，贾母那边去的门已倒锁了，只有向东的门未关。贾瑞侧耳听着，半日不见人来。忽听咯噔一声，东边的门也关上了。贾瑞急的也不敢则声，只得悄悄出来，将门撼了撼，关得铁捅一般，此时要出去亦不能了，南北俱是大墙，要跳也无攀援。这屋内又是过堂风，空落落的。现是腊月天气，夜又长，朔风凛凛，侵肌裂骨，一夜几乎不曾冻死。好容易盼到早晨，只见一个老婆子先将东门开了进来，去叫西门，贾瑞瞅他背着脸，…","so":0,"eo":0},{"surface":"贾母","text":"谁知这年冬底，林如海因为身染重疾，写书来特接黛玉回去。贾母听了，未免又加忧闷，只得忙忙的打点黛玉起身。宝玉大不自在，争奈父女之情，也不好拦阻。于是贾母定要贾琏送他去，仍叫带回来。一应土仪盘费，不消絮说，自然要妥帖的。作速择了日期，贾琏同着黛玉辞别了众人，带领仆从，登舟往扬州去了。","so":0,"eo":0}]},{"chap":13,"ctitle":"第13章 秦可卿死封龙禁尉 王熙凤协理宁国府","deeds":[{"surface":"贾母","text":"凤姐还欲问时，只听二门上传出云板，连叩四下，正是丧音，将凤姐惊醒。人回：“东府蓉大奶奶没了。”凤姐吓了一身冷汗，出了一回神，只得忙穿衣服往王夫人处来。彼时合家皆知，无不纳闷，都有些伤心。那长一辈的想他素日孝顺，平辈的想他素日和睦亲密，下一辈的想他素日慈爱，以及家中仆从老小想他素日怜贫惜贱、爱老慈幼之恩，莫不悲号痛哭。闲言少叙，却说宝玉因近日林黛玉回去，剩得自己落单，也不和人玩耍，每到晚间，便索然睡了。如今从梦中听见说秦氏死了，连忙翻身爬…","so":0,"eo":0}]},{"chap":15,"ctitle":"第15章 王凤姐弄权铁槛寺 秦鲸卿得趣馒头庵","deeds":[{"surface":"贾母","text":"话说宝玉，举目见北静王世荣，头上戴着净白簪缨银翅王帽，穿着江牙海水五爪龙白蟒袍，系着碧玉红带，面如美玉，目似明星，真好秀丽人物。宝玉忙抢上来参见，世荣从轿内伸手搀住。见宝玉戴着束发银冠，勒着双龙出海抹额，穿着白蟒箭袖，围着攒珠银带，面若春花，目如点漆。北静王笑道：“名不虚传，果然如‘宝’似‘玉’。”问：“衔的那宝贝在那里？”宝玉见问，连忙从衣内取出，递与北静王细细看了，又念了那上头的字，因问：“果灵验否？”贾政忙道：“虽如此说，只是未曾…","so":0,"eo":0},{"surface":"贾母","text":"且说次日一早，便有贾母、王夫人打发了人来看宝玉，命多穿两件衣服，无事宁可回去。宝玉那里肯？又兼秦钟恋着智能儿，调唆宝玉求凤姐再住一天。凤姐想了一想，丧仪大事虽妥，还有些小事，也可以再住一日。一则贾珍跟前送了满情，二则又可以完了静虚的事，三则顺了宝玉的心。因此便向宝玉道：“我的事都完了。你要在这里逛，少不得索性辛苦了。明儿是一定要走的了。”宝玉听说，千姐姐万姐姐的央求：“只住一日，明儿必回去的。”于是又住了一夜。凤姐便命悄悄将昨日老尼之事…","so":0,"eo":0}]},{"chap":16,"ctitle":"第16章 贾元春才选凤藻宫 秦鲸卿夭逝黄泉路","deeds":[{"surface":"贾母","text":"且说秦钟、宝玉二人跟着凤姐自铁槛寺照应一番，坐车进城，到家见过贾母、王夫人等，回到自己房中，一夜无话。至次日，宝玉见收拾了外书房，约定了和秦钟念夜书。偏偏那秦钟秉赋最弱，因在郊外受了些风霜，又与智能儿几次偷期缱绻，未免失于检点，回来时便咳嗽伤风，饮食懒进，大有不胜之态，只在家中调养，不能上学。宝玉便扫了兴，然亦无法，只得候他病痊再议。","so":0,"eo":0},{"surface":"贾母","text":"贾母等合家人心俱惶惶不定，不住的使人飞马来往探信。有两个时辰，忽见赖大等三四个管家喘吁吁跑进仪门，报喜，又说：“奉老爷的命，就请老太太率领太太等进宫谢恩呢。”那时贾母心神不定，在大堂廊下伫候，邢、王二夫人、尤氏、李执、凤姐、迎春妹妹以及薛姨妈等，皆聚在一处打听信息。贾母又唤进赖大来细问端底，赖大道：“奴才们只在外朝房伺候着，里头的信息一概不知。后来夏太监出来道喜，说咱们家的大姑奶奶封为凤藻宫尚书，加封贤德妃。后来老爷出来也这么吩咐。如今…","so":0,"eo":0},{"surface":"贾母","text":"宁、荣两处上下内外人等，莫不欢天喜地，独有宝玉置若罔闻。你道什么缘故？原来近日水月庵的智能私逃入城来找秦钟，不意被秦邦业知觉，将智能逐出，将秦钟打了一顿，自己气的老病发了，三五日，便呜呼哀哉了。秦钟本自怯弱，又带病未痊受了笞杖，今见老父气死，悔痛无及，又添了许多病症。因此，宝玉心中怅怅不乐。虽有元春晋封之事，那解得他的愁闷？贾母等如何谢恩，如何回家，亲友如何来庆贺，宁荣两府近日如何热闹，众人如何得意，独他一个皆视有如无，毫不介意。因此众…","so":0,"eo":0},{"surface":"贾母","text":"且说宝玉近因家中有这等大事，贾政不来问他的书，心中自是畅快。无奈秦钟之病日重一日，也着实悬心，不能快乐。这日一早起来，才梳洗了，意欲回了贾母去望候秦钟，忽见茗烟在二门影壁前探头缩脑。宝玉忙出来问他：“做什么？”茗烟道：“秦大爷不中用了！”宝玉听了，吓了一跳，忙问道：“我昨儿才瞧了他，还明明白白的，怎么就不中用了呢？”茗烟道：“我也不知道，刚才是他家的老头子来特告诉我的。”宝玉听毕，忙转身回明贾母。贾母吩咐：“派妥当人跟去，到那里尽一尽同…","so":0,"eo":0}]},{"chap":17,"ctitle":"第17章 大观园试才题对额 荣国府归省庆元宵","deeds":[{"surface":"贾母","text":"话说秦钟既死，宝玉痛哭不止，李贵等好容易劝解半日方住，归时还带馀哀。贾母帮了几十两银子，外又另备奠仪，宝玉去吊祭。七日后便送殡掩埋了，别无记述。只有宝玉日日感悼，思念不已，然亦无可如何了。又不知过了几时才罢。","so":0,"eo":0},{"surface":"贾母","text":"可巧近日宝玉因思念秦钟，忧伤不已，贾母常命人带他到新园子里来玩耍。此时也才进去，忽见贾珍来了，和他笑道：“你还不快出去呢，一会子老爷就来了。”宝玉听了，带着奶娘小厮们，一溜烟跑出园来。方转过弯，顶头看见贾政引着众客来了，躲之不及，只得一旁站住。贾政近来闻得代儒称赞他专能对对，虽不喜读书，却有些歪才，所以此时便命他跟入园中，意欲试他一试。宝玉未知何意，只得随往。","so":0,"eo":0},{"surface":"贾母","text":"说着，大家出来。走不多远，则见崇阁巍峨，层楼高起，面面琳宫合抱，迢迢复道萦纡。青松拂檐，玉兰绕砌；金辉兽面，彩焕螭头。贾政道：“这是正殿了。只是太富丽了些。”众人都道：“要如此方是。虽然贵妃崇尚节俭，然今日之尊，礼仪如此，不为过也。”一面说，一面走，只见正面现出一座玉石牌坊，上面龙蟠螭护，玲拢凿就。贾政道：“此处书以何文？”众人道：“必是‘蓬莱仙境’方妙。”贾政摇头不语。宝玉见了这个所在，心中忽有所动，寻思起来，倒象在那里见过的一般，却…","so":0,"eo":0},{"surface":"贾母","text":"那宝玉一心只记挂着里边姊妹们，又不见贾政吩咐，只得跟到书房。贾政忽想起来道：“你还不去，看老太太惦记你。难道还逛不足么？”宝玉方退了出来。至院外，就有跟贾政的小厮上来抱住，说道：“今日亏了老爷喜欢，方才老太太打发人出来问了几遍，我们回说老爷喜欢；要不然，老太太叫你进去了，就不得展才了。人人都说你才那些诗比众人都强，今儿得了彩头，该赏我们了。”宝玉笑道：“每人一吊。”众人道：“谁没见那一吊钱！把这荷包赏了罢。”说着，一个个都上来解荷包，解…","so":0,"eo":0},{"surface":"贾母","text":"前面贾母一片声找宝玉。众人回说：“在林姑娘房里。”贾母听说道：“好，好！让他姐妹们一处玩玩儿罢。才他老子拘了他这半天，让他松泛一会子罢。只别叫他们拌嘴。”众人答应着。","so":0,"eo":0}]},{"chap":18,"ctitle":"第18章 皇恩重元妃省父母 天伦乐宝玉呈才藻","deeds":[{"surface":"贾母","text":"王夫人日日忙乱，直到十月里才全备了：监办的都交清账目；各处古董文玩，俱已陈设齐备；采办鸟雀，自仙鹤、鹿、兔以及鸡、鹅等，亦已买全，交于园中各处饲养；贾蔷那边也演出二三十出杂戏来：一班小尼姑、道姑也都学会念佛诵经。于是贾政略觉心中安顿。遂请贾母到园中，色色斟酌，点缀妥当，再无些微不合之处，贾政才敢题本。本上之日，奉旨：“于明年正月十五日上元之日贵妃省亲”贾府奉了此旨，一发日夜不闲，连年也不能好生过了。","so":0,"eo":0},{"surface":"贾母","text":"至十五日五鼓，自贾母等有爵者，俱各按品大妆。此时园内帐舞蟠龙，帘飞绣凤，金银焕彩，珠宝生辉，鼎焚百合之香，瓶插长春之蕊，静悄悄无一人咳嗽。贾赦等在西街门外，贾母等在荣府大门外。街头巷口，用围幕挡严。正等的不耐烦，忽见一个太监骑着匹马来了，贾政接着，问其消息。太监道：“早多着呢！未初用晚膳，末正还到宝灵宫拜佛，酉初进大明宫领宴看灯方请旨。只怕戌初才起身呢。”凤姐听了道：“既这样，老太太和太太且请回房，等到了时候再来也还不迟。”于是贾母等自…","so":0,"eo":0},{"surface":"贾母","text":"忽听外面马跑之声不一，有十来个太监，喘吁吁跑来拍手儿。这些太监都会意，知道是来了，各按方向站立。贾赦领合族子弟在西街门外，贾母领合族女眷在大门外迎接，半日静悄悄的。忽见两个太监骑马缓缓而来，至西街门下了马，将马赶出围幕之外，便面西站立；半日又是一对，亦是如此。少时便来了十来对，方闻隐隐鼓乐之声。一对对凤龙旌，稚雉羽宫扇，又有销金提炉，焚着御香，然后一把曲柄七凤金黄伞过来，便是冠袍带履，又有执事太监捧着香巾、绣帕、漱盂、拂尘等物。一队队过…","so":0,"eo":0},{"surface":"贾母","text":"已而入一石港，港上一面匾灯，明现着“蓼汀花溆”四字。看官听说：这“蓼汀花溆”及“有凤来仪”等字，皆系上回贾政偶试宝玉之才，何至便认真用了？想贾府世代诗书，自有一二名手题咏，岂似暴富之家，竟以小儿语搪塞了事呢？只因当日这贾妃未入宫时，自幼亦系贾母教养。后来添了宝玉，贾妃乃长姊，宝玉为幼弟，贾妃念母年将迈，始得此弟，是以独爱怜之。且同侍贾母，刻不相离。那宝玉未入学之先，三四岁时，已得元妃口传教授了几本书，识了数千字在腹中。虽为姊弟，有如母子…","so":0,"eo":0},{"surface":"贾母","text":"贾妃乃问：“此殿何无匾额？”随侍太监跪启道：“此系正殿，外臣未敢擅拟。”贾妃点头。礼仪太监请升座受礼，两阶乐起。二太监引赦、政等于月台下排班上殿，昭容传谕曰：“免。”乃退。又引荣国太君及女眷等自东阶升月台上排班，昭容再谕曰：“免。”于是亦退。","so":0,"eo":0},{"surface":"贾母","text":"茶三献，贾妃降座，乐止，退入侧室更衣，方备省亲车驾出园。至贾母正室，欲行家礼，贾母等俱跪止之。贾妃垂泪，彼此上前厮见，一手挽贾母，一手挽王夫人，三人满心皆有许多话，但说不出，只是呜咽对泣而已。邢夫人、李纨、王熙凤、迎春、探春、惜春等，俱在旁垂泪无言。半日，贾妃方忍悲强笑，安慰道：“当日既送我到那不得见人的去处，好容易今日回家，娘儿们这时不说不笑，反倒哭个不了，一会子我去了，又不知多早晚才能一见！”说到这句，不禁又哽咽起来。刑夫人忙上来劝…","so":0,"eo":0},{"surface":"贾母","text":"又有贾政至帘外问安行参等事。元妃又向其父说道：“田舍之家，齑盐布帛，得遂天伦之乐；今虽富贵，骨肉分离，终无意趣。”贾政亦含泪启道：“臣草芥寒门，鸠群鸦属之中，岂意得征凤鸾之瑞。今贵人上锡天恩，下昭祖德，此皆山川日月之精华，祖宗之远德，钟于一人，幸及政夫妇。且今上体天地生生之大德，垂古今未有之旷恩，虽肝脑涂地，岂能报效万一！惟朝乾夕惕，忠于厥职。伏愿圣君万岁千秋，乃天下苍生之福也。贵妃切勿以政夫妇残年为念。更祈自加珍爱，惟勤慎肃恭以侍上，…","so":0,"eo":0},{"surface":"贾母","text":"尤氏、凤姐等上来启道：“筵宴齐备，请贵妃游幸。”元妃起身，命宝玉导引，遂同诸人步至园门前。早见灯光之中，诸般罗列，进园先从“有凤来仪”、“红香绿玉”、“杏帘在望”、“蘅芷清芬”等处，登楼步阁，涉水缘山，眺览徘徊。一处处铺陈华丽，一桩桩点缀新奇。元妃极加奖赞，又劝：“以后不可太奢了，此皆过分。”既而来至正殿，降谕免礼归坐，大开筵宴，贾母等在下相陪，尤氏、李纨、凤姐等捧羹把盏。","so":0,"eo":0}]},{"chap":19,"ctitle":"第19章 情切切良宵花解语 意绵绵静日玉生香","deeds":[{"surface":"贾母","text":"且说荣、宁二府中连日用尽心力，真是人人力倦，各各神疲，又将园中一应陈设动用之物，收拾了两三天方完。第一个凤姐事多任重，别人或可偷闲躲静，独他是不能脱得的，二则本性要强，不肯落人褒贬，只扎挣着与无事的人一样。第一个宝玉是极无事最闲暇的。偏这一早，袭人的母亲又亲来回过贾母，接袭人家去吃年茶，晚上才得回来。因此，宝玉只和众丫头们掷骰子赶围棋作戏。正在房内玩得没兴头，忽见丫头们来回说：“东府里珍大爷来请过去看戏，放花灯。”宝玉听了，便命换衣裳。…","so":0,"eo":0},{"surface":"贾母","text":"至次日清晨，袭人起来，便觉身体发重，头疼目胀，四肢火热。先时还扎挣的住，次后捱不住，只要睡，因而和衣躺在炕上。宝玉忙回了贾母，传医诊视，说道：“不过偶感风寒，吃一两剂药疏散疏散就好了。”开方去后，令人取药来煎好，刚服下去，命他盖上被窝渥汗，宝玉自去黛玉房中来看视。","so":0,"eo":0}]},{"chap":20,"ctitle":"第20章 王熙凤正言弹妒意 林黛玉俏语谑娇音","deeds":[{"surface":"贾母","text":"宝玉点头叹道：“这个不知是那里的账，只拣软的欺负！又不知是那个姑娘得罪了，上在他账上了。”一句未完，睛雯在旁说道：“谁又没疯了，得罪他做什么？既得罪了他，就有本事承任，犯不着带累别人！”袭人一面哭，一面拉着宝玉道：“为我得罪了老奶奶，你这会子又为我得罪这些人，这还不够我受的，还只是拉扯人！”宝玉见他这般病势，又添了这些烦恼，连忙忍气吞声，安慰他仍旧睡下出汗。只见他汤烧火热，自己守着他，歪在旁边，劝他只养病，别想那些没要紧的事。袭人冷笑道…","so":0,"eo":0},{"surface":"贾母","text":"饭毕，贾母犹欲和那几个老管家的嬷嬷斗牌。宝玉掂记袭人，便回至房中。见袭人朦胧睡去，自己要睡，天气尚早。彼时睛雯、绮霞、秋纹、碧痕都寻热闹，找鸳鸯，琥珀。等耍戏去了。见麝月一人在外间屋里灯下抹骨牌。宝玉笑道：“你怎么不和他们去？”麝月道“没有钱。”宝玉道：“床下堆着钱，还不够你输的？”麝月道：“都乐去了，这屋子交给谁呢？那一个又病了，满屋里上头是灯，下头是火，那些老婆子们都老天拔地伏侍了一天，也该叫他们歇歇儿了。小丫头们也伏侍了一天，这会…","so":0,"eo":0},{"surface":"贾母","text":"宝钗不等说完，连忙喝住了。贾环道：“我拿什么比宝玉？你们怕他，都和他好，都欺负我不是太太养的！”说着便哭。宝钗忙劝他：“好兄弟，快别说这话，人家笑话。”又骂莺儿。正值宝玉走来，见了这般景况，问：“是怎么了？”贾环不敢则声。宝钗素知他家规矩，凡做兄弟的怕哥哥。却不知那宝玉是不要人怕他的，他想着：“兄弟们一并都有父母教训，何必我多事，反生疏了。况且我是正出，他是庶出，饶这样看待，还有人背后谈论，还禁得辖治了他？”更有个呆意思存在心里。你道是…","so":0,"eo":0},{"surface":"贾母","text":"且说宝玉正和宝钗玩笑，忽见人说：“史大姑娘来了。”宝玉听了，连忙就走。宝钗笑道：“等看，咱们两个一齐儿走，瞧瞧他去。”说着，下了炕，和宝玉来至贾母这边。只见史湘云大说大笑的，见了他两个，忙站起来问好。正值黛玉在旁，因问宝玉：“打那里来？”宝玉便说：“打宝姐姐那里来。”黛玉冷笑道：“我说呢！亏了绊往，不然，早就飞了来了。”宝玉道：“只许和你玩，替你解闷儿，不过偶然到他那里，就说这些闲话。”黛玉道：“好没意思的话！去不去，管我什么事？又没叫…","so":0,"eo":0}]},{"chap":21,"ctitle":"第21章 贤袭人娇嗔箴宝玉 俏平儿软语救贾琏","deeds":[{"surface":"贾母","text":"话说史湘云说着笑着跑出来，怕黛玉赶上。宝玉在后忙说：“绊倒了！那里就赶上了？”黛玉赶到门前，被宝玉叉手在门框上拦住，笑道：“饶他这一遭儿罢。”黛玉拉着手说道：“我要饶了云儿，再不活着。”湘云见宝玉拦着门，料黛玉不能出来，便立住脚，笑道：“好姐姐，饶我这遭儿罢！”却值宝钗来在湘云身背后，也笑道：“我劝你们两个看宝兄弟面上，都撂开手罢。”黛玉道：“我不依。你们是一气的，都来戏弄我。”宝玉劝道：“罢哟，谁敢戏弄你？你不打趣他，他就敢说你了？”…","so":0,"eo":0},{"surface":"贾母","text":"正闹着，贾母遣人来叫他吃饭，方往前边来胡乱吃了一碗，仍回自己房中。只见袭人睡在外头炕上，麝月在旁抹牌。宝玉素知他两个亲厚，并连麝月也不理，揭起软帘自往里间来。麝月只得跟进来。宝玉便推他出去说：“不敢惊动。”麝月便笑着出来，叫了两个小丫头进去。宝玉拿了本书，歪着看了半天，因要茶，抬头见两个小丫头在地下站着，那个大两岁清秀些的，宝玉问他道：“你不是叫什么‘香’吗？那丫头答道：“叫蕙香。”宝玉又问：“是谁起的名字？”惠香道：“我原叫芸香，是花…","so":0,"eo":0},{"surface":"贾母","text":"题毕，也往上房来见贾母，后往王夫人处来。","so":0,"eo":0}]},{"chap":22,"ctitle":"第22章 听曲文宝玉悟禅机 制灯迷贾政悲谶语","deeds":[{"surface":"贾母","text":"且说湘云住了两日，便要回去，贾母因说：“等过了你宝姐姐的生日，看了戏再回去。”湘云听了，只得住下，又一面遣人回去，将自己旧日作的两件针线活计取来，为宝钗生辰之仪。","so":0,"eo":0},{"surface":"贾母","text":"谁想贾母自见宝钗来了，喜他稳重和平，正值他才过第一个生辰，便自己捐资二十两，唤了凤姐来，交与他备酒戏。凤姐凑趣，笑道：“一个老祖宗，给孩子们作生日，不拘怎么着，谁还敢争？又办什么酒席呢？既高兴，要热闹，就说不得自己花费几两老库里的体已。这早晚找出这霉烂的二十两银子来做东，意思还叫我们赔上！果然拿不出来也罢了，金的银的圆的扁的压塌了箱子底，只是累我们。老祖宗看看，谁不是你老人家的儿女？难道将来只有宝兄弟顶你老人家上五台山不成？那些东西只留…","so":0,"eo":0},{"surface":"贾母","text":"吃了饭，点戏时，贾母，一面先叫宝钗点，宝钗推让一遍，无法，只得点了一出《西游记》，贾母自是喜欢。又让薛姨妈，薛姨妈见宝钗点了，不肯再点。贾母便特命凤姐点。凤姐虽有邢王二夫人在前，但因贾母之命，不敢违拗，且知贾母喜热闹更喜谑笑科诨，便先点了一出，却是《刘二当衣》。贾母果真更又喜欢。然后便命黛玉点，黛玉又让王夫人等先点。贾母道：“今儿原是我特带着你们取乐，咱们只管咱们的，别理他们。我巴巴儿的唱戏摆酒，为他们呢！他们白听戏白吃已经便宜了，还让…","so":0,"eo":0},{"surface":"贾母","text":"至上酒席时，贾母又命宝钗点，宝钗点了一出《山门》。宝玉道：“你只好点这些戏。”宝钗道：“你白听了这几年，那里知道这出戏，排场词藻都好呢。”宝玉道：“我从来怕这些热闹戏。”宝钗笑道：“要说这一出‘热闹’，你更不知戏了。你过来．我告诉你，这一出戏是一套《北点绛唇》，铿锵顿挫，那音律不用说是好了，那词藻中有只《寄生草》，极妙，你何曾知道！”宝玉见说的这般好，便凑近来央告：“好姐姐，念给我听听。”宝钗便念给他听道：","so":0,"eo":0},{"surface":"贾母","text":"贾母深爱那做小旦的和那做小丑的，因命人带进来，细看时，益发可怜见的。因问他年纪，那小旦才十一岁，小丑才九岁，大家叹息了一回。贾母令人另拿些肉果给他两个，又另赏钱。凤姐笑道：“这个孩子扮上活象一个人，你们再瞧不出来。”宝钗心内也知道，却点头不说；宝玉也点了点头儿不敢说。湘云便接口道：“我知道，是象林姐姐的摸样儿。”宝玉听了，忙把湘云瞅了一眼。众人听了这话，留神细看，都笑起来了，说：“果然象他！”一时散了。","so":0,"eo":0},{"surface":"贾母","text":"晚间，湘云便命翠缕把衣包收拾了。翠缕道：“忙什么，等去的时候包也不迟。”湘云道：“明早就走，还在这里做什么？——看人家的脸子！”宝玉听了这话，忙近前说道：“好妹妹，你错怪了我。林妹妹是个多心的人。别人分明知道，不肯说出来，也皆因怕他恼。谁知你不防头就说出来了，他岂不恼呢。我怕你得罪了人，所以才使眼色。你这会子恼了我，岂不辜负了我？要是别人，那怕他得罪了人，与我何干呢？”湘云摔手道：“你那花言巧语别望着我说，我原不及你林妹妹。别人拿他取笑…","so":0,"eo":0},{"surface":"贾母","text":"忽然人报，娘娘差人送出一个灯谜来，命他们大家去猜，猜后每人也作一个送进去。四人听说，忙出来至贾母上房，只见一个小太监，拿了一盏四角平头白纱灯，专为灯谜而制，上面已有了一个，众人都争看乱猜。小太监又下谕道：“众小姐猜着，不要说出来，每人只暗暗的写了，一齐封送进去，候娘娘自验是否。”宝钗听了，近前一看，是一首七言绝句，并无新奇，口中少不得称赞，只说“难猜”，故意寻思。其实一见早猜着了。宝玉、黛玉、湘云、探春四个人也都解了，各自暗暗的写了。一…","so":0,"eo":0},{"surface":"贾母","text":"贾母见元春这般有兴，自己一发喜乐，便命速作一架小巧精致围屏灯来，设于堂屋，命他姊妹们各自暗暗的做了，写出来粘在屏上；然后预备下香茶细果以及各色玩物，为猜着之贺。贾政朝罢，见贾母高兴，况在节间，晚上也来承欢取乐。上面贾母、贾政，宝玉一席；王夫人、宝钗、黛玉、湘云又一席，迎春、探春、惜春三人又一席，俱在下面。地下老婆丫鬟站满。李宫裁、王熙凤二人在里间又一席。贾政因不见贾兰，便问：”怎么不见兰哥儿？”地下女人们忙进里间问李氏，李氏起身笑着回道…","so":0,"eo":0}]},{"chap":23,"ctitle":"第23章 西厢记妙词通戏语 牡丹亭艳曲警芳心","deeds":[{"surface":"贾母","text":"话说贾母次日仍领众人过节。那元妃却自幸大观园回宫去后，便命将那日所有的题咏，命探春抄录妥协，自己编次优劣，又令在大观园勒石，为千古风流雅事。因此贾政命人选拔精工，大观园磨石镌字。贾珍率领贾蓉、贾蔷等监工。因贾蔷又管着文官等十二个女戏子并行头等事，不得空闲，因此又将贾菖、贾菱、贾萍唤来监工。一日烫蜡钉朱，动起手来。这也不在话下。","so":0,"eo":0},{"surface":"贾母","text":"如今且说那元妃，在宫中编次《大观园题咏》，忽然想起那园中的景致，自从幸过之后，贾政必定敬谨封锁，不叫人进去，岂不辜负此园。况家中现有几个能诗会赋的姊妹们，何不命他们进去居住，也不使佳人落魄，花柳无颜。却又想宝玉自幼在姊妹丛中长大，不比别的兄弟，若不命他进去，又怕冷落了他，恐贾母、王夫人心上不喜，须得也命他进去居住方妥。命太监夏忠到荣府下一道谕：“命宝钗等在园中居住，不可封锢；命宝玉也随进去读书。”贾政王夫人接了谕命。夏忠去后，便回明贾母…","so":0,"eo":0},{"surface":"贾母","text":"别人听了，还犹自可，惟宝玉喜之不胜。正和贾母盘算着要这个要那个，忽见丫鬟来说：“老爷叫宝玉。”宝玉呆了半晌，登时扫了兴，脸上转了色，便拉着贾母扭的扭股儿糖似的，死也不敢去。贾母只得安慰他道：“好宝贝，你只管去，有我呢。他不敢委屈了你。况你做了这篇好文章，想必娘娘叫你进园去住，他吩咐你几句话，不过是怕你在里头淘气。他说什么，你只好生答应着就是了。”一面安慰，一面唤了两个老嬷嬷来，吩咐：“好生带了宝玉去，别叫他老子唬着他。”老嬷嬷答应了。宝…","so":0,"eo":0},{"surface":"贾母","text":"宝玉答应了，慢慢的退出去，向金钏儿笑着伸伸舌头，带着两个老嬷嬷，一溜烟去了。刚至穿堂门前，只见袭人倚门而立，见宝玉平安回来，堆下笑来，问道：“叫你做什么？”宝玉告诉：“没有什么，不过怕我进园淘气，吩咐吩咐”一面说，一面回至贾母跟前回明原委。只见黛玉正在那里，宝玉便问他：“你住在那一处好？”黛玉正盘算这事，忽见宝玉一问，便笑道：“我心里想着潇湘馆好。我爱那几竿竹子，隐着一道曲栏，比别处幽静些。”宝玉听了，拍手笑道：“合了我的主意了，我也要…","so":0,"eo":0}]},{"chap":24,"ctitle":"第24章 醉金刚轻财尚义侠 痴女儿遗帕惹相思","deeds":[{"surface":"贾母","text":"见过贾母，出至外面，人马俱已齐备。刚欲上马，只见贾琏请安回来正下马。二人对面，彼此问了两句话，只见旁边转过一个人来，说：“请宝叔安。”宝玉看时，只见这人生的容长脸儿，长挑身材，年纪只有十八九岁，甚实斯文清秀。虽然面善，却想不起是那一房的，叫什么名字。贾琏笑道：“你怎么发呆，连他也不认得？他是廊下住的五嫂子的儿子芸儿。”宝玉笑道：“是了，我怎么就忘了。”因问他：“你母亲好？这会子什么勾当？”贾芸指贾琏道：“找二叔说句话。”宝玉笑道：“你倒…","so":0,"eo":0},{"surface":"贾母","text":"见了贾赦，不过是偶感些风寒。先述了贾母问的话，然后自己请了安，贾赦先站起来回了贾母问的话，便唤人来：“带进哥儿去太太屋里坐着。”宝玉退出来，至后面，到上房，邢夫人见了，先站起来请过贾母的安，宝玉方请安。邢夫人拉他上炕坐了，方问别人，又命人倒茶。茶未吃完，只见贾琮来问宝玉好。邢夫人道：“那里找活猴儿去！你那奶妈子死绝了，也不收拾收拾。弄的你黑眉乌嘴的，那里还象个大家子念书的孩子？”正说着，只见贾环、贾兰小叔侄两个也来请安。邢夫人叫他两人在…","so":0,"eo":0},{"surface":"贾母","text":"宝玉见他们起身，也就要一同回去。邢夫人笑道：“你且坐着，我还和你说话。”宝玉只得坐了。邢夫人向他两个道：“你们回去，各人替我问各人的母亲好罢。你姑姑姐姐们都在这里呢，闹的我头晕，今儿不留你们吃饭了。”贾环等答应着便出去了。宝玉笑道：“可是姐姐们都过来了，怎么不见？”邢夫人道：“他们坐了会子，都往后头不知那屋里去了。”宝玉说：“大娘说‘有话说’，不知是什么话？”邢夫人笑道：“那里什么话，不过叫你等着同姐妹们吃了饭去，还有一个好玩的东西给你…","so":0,"eo":0},{"surface":"贾母","text":"那天已是掌灯时候，贾芸吃了饭，收拾安歇，一宿无话。次日起来，洗了脸，便出南门大街，在香铺买了冰麝，往荣府来。打听贾琏出了门，贾芸便往后面来。到贾琏院门前，只见几个小厮，拿着大高的苕帚在那里扫院子呢。忽见周瑞家的从门里出来叫小厮们：“先别扫，奶奶出来了。”贾芸忙上去笑问道：“二婶娘那里去？”周瑞家的道：“老太太叫，想必是裁什么尺头。”正说着，只见一群人簇拥着凤姐出来了。贾芸深知凤姐是喜奉承爱排场的，忙把手逼着，恭恭敬敬抢上来请安。凤姐连正…","so":0,"eo":0},{"surface":"贾母","text":"贾芸自然也难提，只得回来。因昨日见了宝玉，到外书房等着，故此吃了饭，又进来，到贾母那边仪门外绮散斋书房里来。只见茗烟在那里掏小雀儿呢。贾芸在他身后，把脚一跺，道：“茗烟小猴儿又淘气了！”茗烟回头，见是贾芸，便笑道：“何苦二爷唬我们这么一跳。”因又笑说：“我不叫茗烟了，我们宝二爷嫌‘烟’字不好，改了叫‘焙茗’了。二爷明儿只叫我焙茗罢。”贾芸点头笑着同进书房，便坐下问：“宝二爷下来了没有？”焙茗道：“今日总没下来。二爷说什么，我替你探探去。…","so":0,"eo":0},{"surface":"贾母","text":"且说宝玉自这日见了贾芸，曾说过明日着他进来说话，这原是富贵公子的口角，那里还记在心上，因而便忘怀了。这日晚上，却从北静王府里回来，见过贾母、王夫人等回至园内。换了衣服，正要洗澡，袭人被宝钗烦了去打结子去了，秋纹、碧痕两个去催水。檀云又因他母亲病了接出去了，麝月现在家中病着，还有几个做粗活听使唤的丫头，料是叫不着他，都出去寻伙觅伴的去了。不想这一刻的工夫，只剩了宝玉在屋内。偏偏的宝玉要喝茶，一连叫了两三声，方见两三个老婆子走进来。宝玉见了…","so":0,"eo":0}]},{"chap":25,"ctitle":"第25章 魇魔法叔嫂逢五鬼 通灵玉蒙蔽遇双真","deeds":[{"surface":"贾母","text":"过了一日，原来次日是王子腾夫人的寿诞，那里原打发人来请贾母、王夫人，王夫人见贾母不去，也不便去了。倒是薛姨妈同着凤姐儿并贾家三个妹妹、宝钗、宝玉，一齐都去了。至晚方回。","so":0,"eo":0},{"surface":"贾母","text":"只听宝玉“嗳哟”的一声，满屋里人都唬了一跳。连忙将地下的绰灯移过来一照，只见宝玉满脸是油。王夫人又气又急，忙命人替宝玉擦洗，一面骂贾环。凤姐三步两步上炕去替宝玉收拾着，一面说：“这老三还是这么‘毛脚鸡’似的。我说你上不得台盘！赵姨娘平时也该教导教导他！”一句话提醒了王夫人，遂叫过赵姨娘来，骂道：“养出这样黑心种子来，也不教训教训！几番几次我都不理论，你们一发得了意了，一发上来了！”那赵姨娘只得忍气吞声，也上去帮着他们替宝玉收拾。只见宝玉…","so":0,"eo":0},{"surface":"贾母","text":"次日，宝玉见了贾母，虽自己承认自己烫的，贾母免不得又把跟从的人骂了一顿。过了一日，有宝玉寄名的干娘马道婆到府里来，见了宝玉，唬了一大跳，问其缘由，知是烫的，便点头叹息，一面向宝玉脸上用指头画了几画，口内嘟嘟囔囔的，又咒诵了一回，说道：“包管好了。这不过是一时飞灾。”又向贾母道：“老祖宗，老菩萨，那里知道那佛经上说的利害！大凡王公卿相人家的子弟，只一生长下来，暗里就有多少促狭鬼跟着他，得空儿就拧他一下，或掐他一下，或吃饭时打下他的饭碗来，…","so":0,"eo":0},{"surface":"贾母","text":"这里宝玉拉了黛玉的手，只是笑，又不说话。黛玉不觉又红了脸，挣着要走。宝玉道：“嗳哟！好头疼！”黛玉道：“该，阿弥陀佛！”宝玉大叫一声，将身一跳，离地有三四尺，口内乱嚷，尽是胡话。黛玉并众丫要都唬慌了，忙报知王夫人与贾母。此时王子腾的夫人也在这里，都一齐来看。宝玉一发拿刀弄杖，寻死觅活的，闹的天翻地覆。贾母、王夫人一见，唬的抖衣乱战，儿一声肉一声，放声大哭。于是惊动了众人，连贾赦，邢夫人、贾珍、贾政并琏、蓉、芸、萍、薛姨妈、薛蟠并周瑞家的…","so":0,"eo":0},{"surface":"贾母","text":"次日，王子腾也来问候。接着小史侯家、邢夫人弟兄并各亲戚都来瞧看，也有送符水的，也有荐僧道的，也有荐医的。他叔嫂二人一发糊涂，不省人事，身热如火，在床上乱说。到夜里更甚，因此那些丫环不敢上前，故将他叔嫂二人都搬到王夫人的上房内，着人轮班守视。贾母、王夫人、邢夫人并薛姨妈寸步不离，只围着哭。此时贾赦、贾政又恐哭坏了贾母，日夜熬油费火，闹的上下不安。贾赦还各处去寻觅僧道。贾政见不效验，因阻贾赦道：“儿女之数总由天命，非人力可强。他二人之病百般…","so":0,"eo":0},{"surface":"贾母","text":"看看三日光阴，凤姐宝玉躺在床上，连气息都微了。合家都说没了指望了，忙的将他二人的后事都治备下了，贾母、王夫人、贾琏、平儿、袭人等更哭的死去活来。只有赵姨娘外面假作忧愁，心中称愿。","so":0,"eo":0},{"surface":"贾母","text":"至第四日早，宝玉忽睁开眼向贾母说道：“从今以后，我可不在你家了，快打发我走罢。”贾母听见这话，如同摘了心肝一般。赵姨娘在旁劝道：“老太太也不必过于悲痛，哥儿已是不中用了，不如把哥儿的衣服穿好，让他早些回去，也省他受些苦。只管舍不得他，这口气不断，他在那里也受罪不安。”这些话没说完，被贾母照脸啐了一口唾沫，骂道：“烂了舌头的混账老婆！怎么见得不中用了？你愿意他死了有什么好处？你别作梦！他死了，我只合你们要命！都是你们素日调唆着，逼他念书写…","so":0,"eo":0},{"surface":"贾母","text":"忽听见空中隐隐有木鱼声，念了一句“南无解冤解结菩萨！有那人口不利、家宅不安、中邪祟、逢凶险的，找我们医治。”贾母、王夫人都听见了，便命人向街上找寻去。原来是一个癞和尚同一个破道士。那和尚是怎的模样？但见：","so":0,"eo":0}]},{"chap":28,"ctitle":"第28章 蒋玉函情赠茜香罗 薛宝钗羞笼红麝串","deeds":[{"surface":"贾母","text":"正说着，见贾母房里的丫头找宝玉和黛玉去吃饭。黛玉也不叫宝玉，便起身带着那丫头走。那丫头说：“等着宝二爷一块儿走啊。”黛玉道：“他不吃饭，不和咱们走，我先走了。”说着，便出去了。宝玉道：“我今儿还跟着太太吃罢。”王夫人道：“罢罢，我今儿吃斋，你正经吃你的去罢。”宝玉道：“我也跟着吃斋。”说着，便叫那丫头：“去罢。”自己跑到桌于上坐了。王夫人向宝钗等笑道：“你们只管吃你们的，由他去罢。”宝钗因笑道：“你正经去罢。吃不吃，陪着林妹妹走一趟，他…","so":0,"eo":0},{"surface":"贾母","text":"一时吃过饭，宝玉一则怕贾母惦记，二则也想着黛玉，忙忙的要茶漱口。探春惜春都笑道：“二哥哥，你成日家忙的是什么？吃饭吃茶也是这么忙碌碌的。”宝钗笑道：“你叫他快吃了瞧黛玉妹妹去罢。叫他在这里胡闹什么呢？”宝玉吃了茶便出来，一直往西院来。可巧走到凤姐儿院前，只见凤姐儿在门前站着，蹬着门槛子，拿耳挖子剔牙，看着十来个小厮们挪花盆呢。见宝玉来了，笑道：“你来的好，进来，进来，替我写几个字儿。”宝玉只得跟了进来。到了房里，凤姐命人取过笔砚纸来，向…","so":0,"eo":0},{"surface":"贾母","text":"说着，便至贾母这边。只见都已吃完了饭了。贾母因问道：“跟着你娘吃了什么好的了？”宝玉笑道：“也没什么好的，我倒多吃了一碗饭。”因问：“林姑娘在那里？”贾母道：“里头屋里呢。”宝玉进来，只见地下一个丫头吹熨斗，炕上两个丫头打粉线，黛玉弯着腰拿剪子裁什么呢。宝玉走进来，笑道：“哦！这是做什么呢？才吃了饭，这么控着头，一会子又头疼了。”黛玉并不理，只管裁他的。有一个丫头说道：“那块绸子角儿还不好呢，再熨熨罢。”黛玉便把剪子一撂，说道：“‘理他…","so":0,"eo":0},{"surface":"贾母","text":"刚洗了脸出来，要往贾母那里请安去，只见黛玉顶头来了，宝玉赶上去笑道：“我的东西叫你拣，你怎么不拣？”黛玉昨日所恼宝玉的心事，早又丢开，只顾今日的事了，因说道：“我没这么大福气禁受，比不得宝姑娘，什么‘金’哪‘玉’的，我们不过是个草木人儿罢了！”宝玉听他提出“金玉”二字来，不觉心里疑猜，便说道：“除了别人说什么金什么玉，我心里要有这个想头，天诛地灭，万世不得人身！”黛玉听他这话，便知他心里动了疑了，忙又笑道：“好没意思，白白的起什么誓呢？…","so":0,"eo":0},{"surface":"贾母","text":"宝钗分明看见，只装没看见，低头过去了。到了王夫人那里，坐了一回，然后到贾母这边，只见宝玉也在这里呢。宝钗因往日母亲对王夫人曾提过“金锁是个和尚给的，等日后有玉的方可结为婚姻”等语，所以总远着宝玉。昨日见元春所赐的东西，独他和宝玉一样，心里越发没意思起来。幸亏宝玉被一个黛玉缠绵住了，心心念念只惦记着黛玉，并不理论这事。此刻忽见宝玉笑道：“宝姐姐，我瞧瞧你的那香串子呢？”可巧宝钗左腕上笼着一串，见宝玉问他，少不得褪了下来。宝钗原生的肌肤丰泽…","so":0,"eo":0}]},{"chap":29,"ctitle":"第29章 享福人福深还祷福 多情女情重愈斟情","deeds":[{"surface":"贾母","text":"一时凤姐儿来了。因说起初一日在清虚观打醮的事来，约着宝钗、宝玉、黛玉等看戏去。宝钗笑道：“罢，罢，怪热的，什么没看过的戏！我不去。”凤姐道：“他们那里凉快，两边又有楼。咱们要去，我头几天先打发人去，把那些道士都赶出去，把楼上打扫了，挂起帘子来，一个闲人不许放进庙去，才是好呢。我已经回了太太了，你们不去，我自家去。这些日子也闷的很了，家里唱动戏，我又不得舒舒服服的看。”贾母听说，就笑道：“既这么着，我和你去。”凤姐听说，笑道：“老祖宗也去…","so":0,"eo":0},{"surface":"贾母","text":"贾母又打发人去请了薛姨妈，顺路告诉王夫人，要带了他们姊妹去。王夫人因一则身上不好，二则预备元春有人出来，早已回了不去的，听贾母如此说，笑道：“还是这么高兴。打发人去到园里告诉，有要逛去的，只管初一跟老太太逛去。”这个话一传开了，别人还可已，只是那些丫头们，天天不得出门槛儿，听了这话，谁不要去，就是各人的主子懒怠去，他也百般的撺掇了去。因此李纨等都说去。贾母心中越发喜欢，早已吩咐人去打扫安置，不必细说。","so":0,"eo":0},{"surface":"贾母","text":"单表到了初一这一日，荣国府门前车辆纷纷，人马簇簇，那底下执事人等，听见是贵妃做好事，贾母亲去拈香，况是端阳佳节，因此凡动用的物件，一色都是齐全的，不同往日。少时贾母等出来，贾母坐一乘八人大轿，李氏、凤姐、薛姨妈每人一乘四人轿，宝钗、黛玉二人共坐一辆翠盖珠缨八宝车，迎春、探春、惜春三人共坐一辆朱轮华盖车。然后贾母的丫头鸳鸯、鹦鹉、琥珀、珍珠，黛玉的丫头紫鹃、雪雁、鹦哥，宝钗的丫头莺儿、文杏，迎春的丫头司棋、绣橘，探春的丫头侍书、翠墨，惜春…","so":0,"eo":0},{"surface":"贾母","text":"不多时，已到了清虚观门口。只听钟鸣鼓响，早有张法官执香披衣，带领众道土在路旁迎接。宝玉下了马，贾母的轿刚至山门以内，见了本境城隆土地各位泥塑圣像，便命往轿。贾珍带领各子弟上来迎接。凤姐儿的轿子却赶在头里先到了，带着鸳鸯等迎接上来，见贾母下了轿，忙要搀扶。可巧有个十二三岁的小道士儿，拿着个剪筒照管各处剪蜡花儿，正欲得便且藏出去，不想一头撞在凤姐儿怀里。凤姐便一扬手照脸打了个嘴巴，把那小孩子打了一个斤斗，骂道：“小野杂种！往那里跑？”那小道…","so":0,"eo":0},{"surface":"贾母","text":"这里贾母带着众人，一层一层的瞻拜观玩。外面小厮们见贾母等进入二层山门，忽见贾珍领了个小道士出来，叫人：“来带了去，给他几百钱、别难为了他。”家人听说，忙上来领去。贾珍站在台阶上，因问：“管家在那里？”底下站的小厮们见问，都一齐喝声说：“叫管家！”登时林之孝，一手整理着帽子，跑进来，到了贾珍跟前。贾珍道：“虽然这里地方儿大，今儿咱们的人多，你使的人，你就带了在这院里罢，使不着的，打发到那院里去。把小么儿们多挑几个在这二层门上和两边的角门上…","so":0,"eo":0},{"surface":"贾母","text":"贾珍到贾母跟前，控身陪笑，说道：“张爷爷进来请安。”贾母听了，忙道：“请他来。”贾珍忙去搀过来。那张道士先呵呵笑道：“无量寿佛！老祖宗一向福寿康宁，众位奶奶姑娘纳福！一向没到府里请安，老太太气色越发好了。”贾母笑道：“老神仙你好？”张道士笑道：“托老太太的万福，小道也还康健。别的倒罢了，只记挂着哥儿，一向身上好？前日四月二十六，我这里做遮天大五的圣诞，人也来的少，东西也很干净，我说请哥儿来逛逛，怎么说不在家？”贾母说道：“果真不在家。”…","so":0,"eo":0},{"surface":"贾母","text":"谁知宝玉解手儿去了，才来，忙上前问：“张爷爷好！”张道士也抱住问了好，又向贾母笑道：“哥儿越发发福了。”贾母道：“他外头好，里头弱。又搭着他老子逼着他念书，生生儿的把个孩子逼出病来了。”张道士道：“前日我在好几处看见哥儿写的字，做的诗，都好的了不得。怎么老爷还抱怨哥儿不大喜欢念书呢？依小道看来，也就罢了。”又叹道：“我看见哥儿的这个形容身段，言谈举动，怎么就和当日国公爷一个稿子！”说着两眼酸酸的。贾母听了，也由不得有些戚惨，说道：“正是…","so":0,"eo":0},{"surface":"贾母","text":"说毕，只见凤姐儿笑道：“张爷爷，我们丫头的寄名符儿你也不换去，前儿亏你还有那么大脸，打发人和我要鹅黄缎子去！要不给你，又恐怕你那老脸上下不来。”张道士哈哈大笑道：“你瞧，我眼花了！也没见奶奶在这里，也没道谢。寄名符早已有了，前日原想送去，不承望娘娘来做好事，也就混忘了。还在佛前镇着呢。等着我取了来。”说着跑到大殿上，一时拿了个茶盘，搭着大红蟒缎经袱子，托出符来。大姐儿的奶子接了符。张道士才要抱过大姐儿来，只见凤姐笑道：“你就手里拿出来罢…","so":0,"eo":0}]},{"chap":30,"ctitle":"第30章 宝钗借扇机带双敲 椿龄画蔷痴及局外","deeds":[{"surface":"贾母","text":"出了园门，到了贾母跟前，凤姐笑道：“我说他们不用人费心，自己就会好的，老祖宗不信，一定叫我去说和。赶我到那里说和，谁知两个人在一块儿对赔不是呢，倒象‘黄鹰抓住鹞子的脚’，两个人都‘扣了环’了！那里还要人去说呢？”说的满屋里都笑起来。","so":0,"eo":0},{"surface":"贾母","text":"此时宝钗正在这里，那黛玉只一言不发，挨着贾母坐下。宝玉没什么说的，便向宝钗笑道：“大哥哥好日子，偏我又不好，没有别的礼送，连个头也不磕去。大哥哥不知道我病，倒象我推故不去似的。倘或明儿姐姐闲了，替我分辩分辩。”宝钗笑道：“这也多事，你就要去，也不敢惊动，何况身上不好。弟兄们常在一处，要存这个心倒生分了。”宝玉又笑道：“姐姐知道体谅我就好了。”又道：“姐姐怎么不听戏去？”宝钗道：“我怕热。听了两出，热的很，要走呢，客又不散；我少不得推身上…","so":0,"eo":0},{"surface":"贾母","text":"谁知目今盛暑之际，又当早饭已过，各处主仆人等多半都因日长神倦，宝玉背着手，到一处，一处鸦雀无声。从贾母这里出来往西，走过了穿堂便是凤姐的院落。到他院门前，只见院门掩着，知道凤姐素日的规矩，每到天热，午间要歇一个时辰的，进去不便。遂进角门，来到王夫人上房。只见几个丫头手里拿着针线，却打盹儿。王夫人在里间凉床上睡着，金钏儿坐在旁边捶腿，也斜着眼乱恍。宝玉轻轻的走到跟前，把他耳朵上的坠子一摘。金钏儿睁眼，见是宝玉，宝玉便悄俏的笑道：“就困的这…","so":0,"eo":0}]},{"chap":31,"ctitle":"第31章 撕扇子作千金一笑 因麒麟伏白首双星","deeds":[{"surface":"贾母","text":"至次日午间，王夫人、宝钗、黛玉众姐妹正在贾母房中坐着，有人回道：“史大姑娘来了。”一时，果见史湘云带领众多丫环媳妇走进院来。宝钗、黛玉等忙迎至阶下相见。青年妹妹经月不见，一旦相逢自然是亲密的，一时进入房中，请安问好，都见过了。贾母因说：“天热，把外头的衣裳脱脱罢。”湘云忙起身宽衣。王夫人因笑道：“也没见穿上这些做什么！”湘云笑道：“都是二婶娘叫穿的，谁愿意穿这些！”宝钗一旁笑道：“姨妈不知道，他穿衣裳，还更爱穿别人的。可记得旧年三四月里…","so":0,"eo":0},{"surface":"贾母","text":"宝钗笑问那周奶妈道：“周妈，你们姑娘还那么淘气不淘气了？”周奶妈也笑了。迎春笑道：“淘气也罢了，我就嫌他爱说话，也没见睡在那里还是哈哈呱呱，笑一阵，说一阵，也不知是那里来的那些谎话。”王夫人道：“只怕如今好了。前日有人家来相看，眼见有婆婆家了，还是那么着？”贾母因问：“今日还是住着，还是家去呢？”周奶奶笑道：“老太太没有看见，衣裳都带了来了，可不住两天。”湘云问宝玉道：“宝哥哥不在家么？”宝钗笑道：“他再不想别人，只想宝兄弟。两个人好玩…","so":0,"eo":0},{"surface":"贾母","text":"贾母因向湘云道：“喝了茶歇歇儿，瞧瞧你嫂子们去罢。园里也凉快，和你姐姐们去逛逛。”湘云答应了，因将三个戒指儿包上，歇了歇，便起身要瞧凤姐等去。众奶娘丫头跟着，到了凤姐那里，说笑了一回。出来便往大观园来见过了李纨。少坐片时，便往怡红院来找袭人。因回头说道：“你们不必跟着，只管瞧你们的亲戚去。留下缕儿伏侍就是了。”众人应了，自去寻姑觅嫂，单剩下湘云、翠缕两个。","so":0,"eo":0}]},{"chap":33,"ctitle":"第33章 手足眈眈小动唇舌 不肖种种大承苔挞","deeds":[{"surface":"贾母","text":"宝玉急的手脚正没抓寻处，只见贾政的小厮走来，逼着他出去了。贾政一见，眼都红了，也不暇问他在外流荡优伶，表赠私物，在家荒疏学业，逼淫母婢，只喝命：“堵起嘴来，着实打死！”小厮们不敢违，只得将宝玉按在凳上，举起大板，打了十来下。宝玉自知不能讨饶，只是呜呜的哭。贾政还嫌打的轻，一脚踢开掌板的，自己夺过板子来，狠命的又打了十几下。宝玉生来未经过这样苦楚，起先觉得打的疼不过还乱嚷乱哭，后来渐渐气弱声嘶，呜咽不出。众门客见打的不祥了，赶着上来，恳求…","so":0,"eo":0},{"surface":"贾母","text":"正没开交处，忽听丫鬟来说：“老太太来了！”一言未了，只听窗外颤巍巍的声气说道：“先打死我，再打死他，就干净了！”贾政见母亲来了，又急又痛，连忙迎出来。只见贾母扶着丫头，摇头喘气的走来。贾政上前躬身陪笑说道：“大暑热的天，老太太有什么吩咐，何必自己走来，只叫儿子进去吩咐便了。”贾母听了，便止步喘息，一面厉声道：“你原来和我说话！我倒有话吩咐，只是我一生没养个好儿子，却叫我和谁说去！”贾政听这话不象，忙跪下含泪说道：“儿子管他，也为的是光宗…","so":0,"eo":0},{"surface":"贾母","text":"贾母一面说，一面来看宝玉。只见今日这顿打不比往日，又是心疼，又是生气，也抱着哭个不了。王夫人与凤姐等解劝了一会，方渐浙的止住。早有丫鬟媳妇等上来要搀宝玉。凤姐便骂：“糊涂东西，也不睁开眼瞧瞧，这个样儿，怎么搀着走的？还不快进去把那藤屉子春凳抬出来呢！”众人听了，连忙飞跑进去，果然抬出春凳来，将宝玉放上，随着贾母、王夫人等进去，送至贾母屋里。","so":0,"eo":0},{"surface":"贾母","text":"彼时贾政见贾母怒气未消，不敢自便，也跟着进来。看看宝玉果然打重了，再看看王夫人一声“肉”一声“儿”的哭道：“你替珠儿早死了，留着珠儿，也免你父亲生气，我也不白操这半世的心了！这会子你倘或有个好歹，撂下我，叫我靠那一个？”数落一场，又哭“不争气的儿”。贾政听了，也就灰心自己不该下毒手打到如此地步。先劝贾母，贾母含泪说道：“儿子不好，原是要管的，不该打到这个分儿。你不出去，还在这里做什么，难道于心不足，还要眼看着他死了才算吗？”贾政听说，方…","so":0,"eo":0},{"surface":"贾母","text":"此时薛姨妈、宝钗、香菱、袭人、湘云等也都在这里。袭人满心委屈，只不好十分使出来。见众人围着，灌水的灌水，打扇的打扇，自己插不下手去，便索性走出门，到二门前，命小厮们找了焙茗来细问：“方才好端端的，为什么打起来？你也不早来透个信儿！”焙茗急的说：“偏我没在跟前，打到半中间，我才听见了。忙打听原故，却是为琪官儿和金钏儿姐姐的事。”袭人道：“老爷怎么知道了？”焙茗道：“那琪官儿的事，多半是薛大爷素昔吃醋，没法儿出气，不知在外头挑唆了谁来，在老…","so":0,"eo":0}]},{"chap":34,"ctitle":"第34章 情中情因情感妹妹 错里错以错劝哥哥","deeds":[{"surface":"贾母","text":"话说袭人见贾母、王夫人等去后，便走来宝玉身边坐下，含泪问他：“怎么就打到这步田地？”宝玉叹气说道：“不过为那些事，问他做什么！只是下半截疼的很，你瞧瞧，打坏了那里？”袭人听说，便轻轻的伸手进去，将中衣脱下，略动一动，宝玉便咬着牙嗳哟，袭人连忙停住手，如此三四次，才褪下来了。袭人看时，只见腿上半段青紫，都有四指阔的僵痕高起来。袭人咬着牙说道：“我的娘，怎么下这般的狠手！你但凡听我一句话，也不到这个分儿。幸而没动筋骨，倘或打出个残疾来，可叫…","so":0,"eo":0},{"surface":"贾母","text":"一句话未了，只见院外人说：“二奶奶来了。”黛玉便知是凤姐来了，连忙立起身，说道：“我从后院子里去罢，回来再来。”宝玉一把拉住道：“这又奇了，好好的怎么怕起他来了？”黛玉急得跺脚，悄悄的说道：“你瞧瞧我的眼睛！又该他们拿咱们取笑儿了。”宝玉听说，赶忙的放了手。黛玉三步两步转过床后，刚出了后院，凤姐从前头已进来了，问宝玉：“可好些了？想什么吃？叫人往我那里取去。”接着薛姨妈又来了。一时贾母又打发了人来。","so":0,"eo":0}]},{"chap":35,"ctitle":"第35章 白玉钏亲尝莲叶羹 黄金莺巧结梅花络","deeds":[{"surface":"贾母","text":"话说宝钗分明听见黛玉克薄他，因惦记着母亲哥哥，并不回头，一径去了。这里黛玉仍旧立于花阴之下，远远的却向怡红院内望着。只见李纨、迎春、探春、惜春并丫鬟人等，都向怡红院内去过之后，一起一起的散尽了，只不见凤姐儿来。心里自己盘算说道：“他怎么不来瞧瞧宝玉呢？便是有事缠住了，他必定也是要来打个花胡哨，讨老太太、太太的好儿才是呢。今儿这早晚不来，必有原故。”一面猜疑，一面抬头再看时，只见花花簇簇一群人，又向恰红院内来了。定睛看时，却是贾母搭着凤姐…","so":0,"eo":0},{"surface":"贾母","text":"这里薛姨妈和宝钗进园来看宝玉。到了怡红院中，只见抱厦里外回廊上许多丫头老婆站着，便知贾母等都在这里。母女两个进来，大家见过了。只见宝玉躺在榻上，薛姨妈问他：“可好些？”宝玉忙欲欠身，口里答应着：“好些。”又说：“只管惊动姨娘、姐姐，我当不起。”薛姨妈忙扶他睡下，又问他：“想什么，只管告诉我。”宝玉笑道：“我想起来，自然和姨娘要去。”王夫人又问：“你想什么吃？回来好给你送来。”宝玉笑道：“也倒不想什么吃。倒是那一回做的那小荷叶儿小莲蓬儿的…","so":0,"eo":0},{"surface":"贾母","text":"薛姨妈先接过来瞧时，原来是个小匣子，里面装着四副银模子，都有一尺多长，一寸见方。上面凿着豆子大小，也有菊花的，也有梅花的，也有莲蓬的，也有菱角的：共有三四十样，打的十分精巧。因笑向贾母王夫人道：“你们府上也都想绝了，吃碗汤还有这些样子。要不说出来，我见了这个，也不认得是做什么用的。”凤姐儿也不等人说话，便笑道：“姑妈不知道：这是旧年备膳的时候儿，他们想的法儿。不知弄什么面印出来，借点新荷叶的清香，全仗着好汤，我吃着究竟也没什么意思。谁家…","so":0,"eo":0},{"surface":"贾母","text":"宝钗旁笑道：“我来了这么几年，留神看起来，二嫂子凭他怎么巧，再巧不过老太太。”贾母听说，便答道：“我的儿，我如今老了，那里还巧什么？当日我象凤丫头这么大年纪，比他还来得呢。他如今虽说不如我，也就算好了。比你姨娘强远了！你姨娘可怜见的，不大说话，和木头似的，公婆跟前就不献好儿。凤儿嘴乖，怎么怨得人疼他。”宝玉笑道：要这么说，不大说话的就不疼了？”贾母道：“不大说话的，又有不大说话的可疼之处，嘴乖的也有一宗可嫌的，倒不如不说的好。”宝玉笑道…","so":0,"eo":0},{"surface":"贾母","text":"忽有人来请吃饭，贾母方立起身来，命宝玉：“好生养着罢。”把丫头们又嘱咐了一回，方扶着凤姐儿，让着薛姨妈，大家出房去了。犹问：“汤好了不曾？”又问薛姨妈等：“想什么吃，只管告诉我，我有本事叫凤丫头弄了来咱们吃。”薛姨妈笑道：“老太太也会怄他，时常他弄了东西来孝敬，究竟又吃不多儿。”凤姐儿笑道：“姑妈倒别这么说。我们老祖宗只是嫌人肉酸，要不嫌人肉酸，早已把我还吃了呢！”一句话没说了，引的贾母众人都哈哈的大笑起来。宝玉在屋里也掌不住笑了。袭人…","so":0,"eo":0},{"surface":"贾母","text":"宝玉伸手拉着袭人笑道：“你站了这半日，可乏了。”一面说，一面拉他身旁坐下。袭人笑道：“可是又忘了，趁宝姑娘在院子里，你和他说，烦他们莺儿来打上几根绦子。”宝玉笑道：“亏了你提起来。”说着，便仰头向窗外道：“宝姐姐，吃过饭叫莺儿来，烦他打几根绦子，可得闲儿？”宝钗听见，回头道：“是了，一会儿就叫他来。”贾母等尚未听真，都止步问宝钗何事。宝钗说明了，贾母便说道：“好孩子，你叫他来替你兄弟打几根罢。你要人使，我那里闲的丫多着的呢。你喜欢谁，只…","so":0,"eo":0},{"surface":"贾母","text":"少顷出至园外，王夫人恐贾母乏了，便欲让至上房内坐，贾母也觉脚酸，便点头依允。王未人便命丫头忙先去铺设坐位。那时赵姨娘推病，只有周姨娘与那老婆丫头们忙着打帘子，立靠背，铺褥子。贾母扶着凤姐儿进来，与薛姨妈分宾主坐了，宝钗、湘云坐在下面。王夫人亲自捧了茶来，奉与贾母，李宫裁捧与薛姨妈。贾母向王夫人道：“让他们小妯娌伏侍罢，在那里坐下，好说话儿。”王夫人方向一张小机子上坐下，便吩咐凤姐儿道：“老太太的饭放在这里，添了东西来。”凤姐儿答应出去，…","so":0,"eo":0},{"surface":"贾母","text":"少顷饭至，众人调放了桌子。凤姐儿用手巾裹了一把牙箸，站在地下，笑道：“老祖宗和姨妈不用让，还听我说就是了。”贾母笑向薛姨妈道：“我们就是这样。”薛姨妈笑着应了。于是凤姐放下四双箸：上面两双是贾母、薛姨妈，两边是宝钗湘云的。王夫人、李宫裁等都站在地下，看着放菜。凤姐先忙着要干净家伙来，替宝玉拣菜。少顷，莲叶汤来了，贾母看过了，王夫人回头见玉钏儿在那里，便命玉钏儿与宝玉送去。凤姐道：“他一个人难拿。”可巧莺儿和同喜都来了，宝钗知道他们已吃了…","so":0,"eo":0}]},{"chap":36,"ctitle":"第36章 绣鸳鸯梦兆绛芸轩 识分定情悟梨香院","deeds":[{"surface":"贾母","text":"话说贾母自王夫人处回来，见宝玉一日好似一日，心中自是欢喜。因怕将来贾政又叫他，遂命人将贾政的亲随小厮头儿唤来，吩咐：“以后倘有会人待客诸样的事，你老爷要叫宝玉，你不用上来传话，就回他说我说的，一则打重了，得着实将养几个月才走得，二则他的星宿不利，祭了星，不见外人，过了八月，才许出二门。”那小厮头儿听了，领命而去。贾母又命李嬷嬷、袭人等来，将此话说与宝玉，使他放心。那宝玉素日本就懒与士大夫诸男人接谈，又最厌峨冠礼服贺吊往还等事，今日得了这…","so":0,"eo":0},{"surface":"贾母","text":"说毕，凤姐见无话，便转身出来。刚至廊檐下，只见有几个执事的媳妇子正等他回事呢，见他出来，都笑道：“奶奶今儿回什么事，说了这半天？可别热着罢。”凤姐把袖子挽了几挽，着那角门的门槛子，笑道：“这里过堂风，倒凉快，吹一吹再走。”又告诉众人道：“你们说我回了这半日的话，太太把二百年的事都想起来问我，难道我不说罢？”又冷笑道：“我从今以后，倒要干几件刻薄事了。抱怨给太太听，我也不怕！糊涂油蒙了心、烂了舌头、不得好死的下作娼妇们，别做娘的春梦了！明…","so":0,"eo":0},{"surface":"贾母","text":"这里宝钗只刚做了两三个花瓣，忽见宝玉在梦中喊骂，说：“和尚道士的话如何信得？什么‘金玉姻缘’？我偏说‘木石姻缘’！”宝钗听了这话，不觉怔了。忽见袭人走进来，笑道：“还没醒呢吗？”宝钗摇头。袭人又笑道：“我才碰见林姑娘、史大姑娘，他们进来了么？”宝钗道：“没见他们进来。”因向袭人笑道：“他们没告诉你什么？”袭人红了脸，笑道：“总不过是他们那些玩话，有什么正经说的。”宝钗笑道：“今儿他们说的可不是玩话，我正要告诉你呢，你又忙忙的出去了。”一…","so":0,"eo":0}]},{"chap":37,"ctitle":"第37章 秋爽斋偶结海棠社 蘅芜院夜拟菊花题","deeds":[{"surface":"贾母","text":"且说贾政，自元妃归省之后，居官更加勤慎，以期仰答皇恩。皇上见他人品端方，风声清肃，虽非科第出身，却是书香世代，因特将他点了学差，也无非是选拔真才之意。这贾政只得奉了旨，择于八月二十日起身。是日拜别过宗祠及贾母，便起身而去。宝玉等如何送行，以及贾政出差外面诸事，不及细述。","so":0,"eo":0},{"surface":"贾母","text":"单表宝玉，自贾政起身之后，每日在园中任意纵性游荡，真把光阴虚度，岁月空添，这日甚觉无聊，便往贾母、王夫人处来混了一混，仍旧进园来了。刚换了衣裳，只见翠墨进来，手里拿着一幅花笺，送与他看。宝玉因道：“可是我忘了，才要瞧瞧三妹妹去，你来的正好。可好些了？”翠墨道：“姑娘好了，今儿也不吃药了，不过是冷着一点儿。”宝玉听说，便展开花笺看时，上面写道：","so":0,"eo":0},{"surface":"贾母","text":"众人看了，都道：“是这首为上。”李纨道：“若论风流别致，自是这首，若论含蓄浑厚，终让蘅稿。”探春道：“这评的有理。潇湘妃子当居第二。”李纨道：“怡红公子是压尾，你服不服？”宝玉道：“我的那首原不好，这评的最公。”又笑道：“只是蘅、潇二首，还要斟酌。”李纨道：“原是依我评论，不与你们相干，再有多说者必罚。”宝玉听说，只得罢了。李执道：“从此后，我定于每月初二、十六这两日开社，出题限韵都要依我。这其间你们有高兴的，只管另择日子补开，那怕一个…","so":0,"eo":0},{"surface":"贾母","text":"一时宝玉回来，先忙着看了一回海棠，至屋里告诉袭人起诗社的事，袭人也把打发宋妈妈给史湘云送东西去的话告诉了宝玉。宝玉听了，拍手道：“偏忘了他！我只觉心里有件事，只是想不起来，亏你提起来，正要请他去。这诗社里要少了他，还有个什么意思！”袭人劝道：“什么要紧，不过玩意儿。他比不得你们自在，家里又作不得主儿。告诉他，他要来又由不得他，要不来他又牵肠挂肚的，没的叫他不受用。”宝玉道：“不妨事，我回老太太，打发人接他去。”正说着，宋妈妈已经回来道生…","so":0,"eo":0}]},{"chap":38,"ctitle":"第38章 林潇湘魁夺菊花诗 薛蘅芜讽和螃蟹咏","deeds":[{"surface":"贾母","text":"话说宝钗湘云计议已定，一宿无话。次日湘云便请贾母等赏桂花。贾母等都说道：“到是他有兴头，须要扰他这雅兴。”至午，果然贾母带了王夫人、凤姐兼请薛姨妈等进园来。贾母因问。“那一处好？”王夫人道：“凭老太太爱在那一处，就在那一处。”凤姐道：“藕香榭已经摆下了。那山坡下两棵桂花开的又好，河里的水又碧清，坐在河当中亭子上，不敞亮吗？看看水，眼也清亮。”贾母听了，说：“很好。”说着，引了众人往藕香榭来。原来这藕香榭盖在池中，四面有窗，左右有回廊，也…","so":0,"eo":0},{"surface":"贾母","text":"一时进入榭中，只见栏杆外另放着两张竹案，一个上面设着杯箸酒具，一个上头设着茶筅茶具各色盏碟。那边有两三个丫头煽风炉煮茶，这边另有几个丫头也煽风炉烫酒呢。贾母忙笑问：“这茶想的很好，且是地方东西都干净。”湘云笑道：“这是宝姐姐帮着我预备的。”贾母道：“我说那孩子细致，凡事想的妥当。”一面说，一面又看见柱子上挂的黑漆嵌蚌的对子，命湘云念道：","so":0,"eo":0},{"surface":"贾母","text":"贾母听了，又抬头看匾，因回头向薛姨妈道：“我先小时，家里也有这么一个亭子，叫做什么枕霞阁。我那时也只象他姐妹们这么大年纪，同着几个人，天天玩去。谁知那日一下子失了脚掉下去，几乎没淹死，好容易救上来了，到底叫那木钉把头碰破了。如今这鬃角上那指头顶儿大的一个坑儿，就是那碰破的。众人都怕经了水，冒了风，说了不得了，谁知竟好了。”凤姐不等人说，先笑道：“那时要活不得，如今这么大福可叫谁享呢？可知老祖宗从小儿福寿就不小，神差鬼使，碰出那个坑儿来好…","so":0,"eo":0},{"surface":"贾母","text":"说着，一齐进了亭子。献过茶，凤姐忙安放杯箸。上面一桌，贾母、薛姨妈、宝钗、黛玉、宝玉；东边一桌，湘云、王夫人、迎、探、惜。西边靠门一小桌，李纨和凤姐，虚设坐位，二人皆不敢坐，只在贾母、王夫人两桌上伺候。凤姐吩咐：“螃蟹不可多拿来，仍旧放在蒸笼里，拿十个来，吃了再拿。”一面又要水洗了手，站在贾母跟前剥蟹肉。头次让薛姨妈，薛姨妈道：“我自己掰着吃香甜，不用人让。”凤姐便奉与贾母。二次的便与宝玉。又说：“把酒烫得滚热的拿来。”又命小丫头们去取…","so":0,"eo":0},{"surface":"贾母","text":"凤姐仍旧下来张罗。一时出至廊上，鸳鸯等正吃得高兴，见他来了，鸳鸯等站起来道：“奶奶又出来做什么？让我们也受用一会子。”凤姐笑道：“鸳鸯丫头越发坏了，我替你当差，倒不领情，还抱怨我，还不快斟一种酒来我喝呢。”鸳鸯笑着，忙斟了一杯酒，送至凤姐唇边，凤姐一挺脖子喝了。琥珀彩霞二人也斟上一杯送至凤姐唇边，那凤姐也吃了。平儿早剔了一壳黄子送来，凤姐道：“多倒些姜醋。”一回也吃了，笑道：“你们坐着吃罢，我可去了。”鸳鸯笑道：“好没脸，吃我们的东西！…","so":0,"eo":0},{"surface":"贾母","text":"黛玉独不敢多吃，只吃了一点夹子肉就下来了。贾母一时也不吃了。大家都洗了手。也有看花的，也有弄水看鱼的，游玩了一回。王夫人因问贾母：“这里风大，才又吃了螃蟹，老太太还是回屋里去歇歇罢。若高兴，明日再来逛逛。”贾母听了，笑道：“正是呢。我怕你们高兴，我走了，又怕扫了你们的兴，既这么说，咱们就都去罢。”回头嘱咐湘云：“别让你宝哥哥多吃了。”湘云答应着。又嘱咐湘云、宝钗二人说：“你们两个也别多吃了。那东西虽好吃，不是什么好的，吃多了肚子疼。”二…","so":0,"eo":0}]},{"chap":39,"ctitle":"第39章 村老老是信口开河 情哥哥偏寻根究底","deeds":[{"surface":"贾母","text":"众人都道：“这又何必伤心，不如散了倒好。”说着，便都洗了手，大家约着往贾母王夫人处问安。众婆子丫头打扫亭子，收洗杯盘。袭人便和平儿一同往前去。袭人因让平儿到屋里坐坐，再喝碗茶去。平儿回说：“不喝茶了，再来罢。”一面说，一面便要出去。袭人又叫住，问道：“这个月的月钱，连老太太、太太屋里还没放，是为什么？”平儿见问，忙转身至袭人跟前，又见无人，俏悄悦道：“你快别问！横竖再迟两天就放了。”袭人笑道：“这是为什么，唬的你这个样儿？”平儿悄声告诉…","so":0,"eo":0},{"surface":"贾母","text":"平儿因问：“想是见过奶奶了？”刘老老道：“见过了，叫我们等着呢。”说着，又往窗外看天气，说道：“天好早晚了，我们也去罢，别出不去城才是饥荒呢。”周瑞家的道：“等着我替你瞧瞧去。”说着，一径去了，半日方来，笑道：“可是老老的福来了，竟投了这两个人的缘了。”平儿等问：“怎么样？”周瑞家的笑道：“二奶奶在老太太跟前呢，我原是悄悄的告诉二奶奶：‘刘老老要家去呢，怕晚了赶不出城去。’二奶奶说：‘大远的，难为他扛了些东西来，晚了就住一夜，明日再去。…","so":0,"eo":0},{"surface":"贾母","text":"平儿等来至贾母房中。彼时大观园中姐妹们都在贾母前承奉，刘老老进去，只见满屋里珠围翠绕、花枝招展的，并不知都系何人。只见一张榻上，独歪着一位老婆婆，身后坐着一个纱罗裹的美人一般的个丫鬟在那里捶腿，凤姐儿站着正说笑。刘老老便知是贾母，忙上来，陪着笑，拜了几拜，口里说：“请老寿星安！”贾母也忙欠身问好，又命周瑞家的端过椅子来坐着。那板儿仍是怯人，不知问候。贾母道：“老亲家，你今年多大年纪了？”刘老老忙起身答道：“我今年七十五了。”贾母向众人道…","so":0,"eo":0},{"surface":"贾母","text":"凤姐知道合了贾母的心，吃了饭便又打发过来。鸳鸯忙命老婆子带了刘老老去洗了澡，自己去挑了两件随常的衣裳叫给刘老老换上。那刘老老那里见过这般行事？忙换了衣裳出来，坐在贾母榻前，又搜寻些话出来说。彼时宝玉姐妹们也都在这里坐着，他们何曾听见过这些话，自觉比那些瞽目先生说的书还好听。那刘老老虽是个村野人，却生来的有些见识，况且年纪老了，世情上经历过的，见头一件贾母高兴，第二件这些哥儿姐儿都爱听，便没话也编出些话来讲。因说道：“我们村庄上种地种菜，…","so":0,"eo":0},{"surface":"贾母","text":"宝玉且忙问刘老老：“那女孩儿大雪地里做什么抽柴火？倘或冻出病来呢？”贾母道：“都是才说抽柴火，惹出事来了，你还问呢！别说这个了，说别的罢。“宝玉听说，心内虽不乐，也只得罢了。刘老老便又想了想，说道：“我们庄子东边庄上有个老奶奶子，今年九十多岁了。他天天吃斋念佛，谁知就感动了观音菩萨，夜里来托梦，说：‘你这么虚心，原来你该绝后的，如今奏了玉皇，给你个孙子。’原来这老奶奶只有一个儿子，这儿子也只一个儿子，好容易养到十七八岁上死了，哭的什么儿…","so":0,"eo":0}]},{"chap":40,"ctitle":"第40章 史太君两宴大观园 金鸳鸯三宣牙牌令","deeds":[{"surface":"贾母","text":"话说宝玉听了，忙进来看时，只见琥珀站在屏风跟前，说：“快去罢，立等你说话呢。”宝玉来至上房，只见贾母正和王夫人众姐妹商议给史湘云还席。宝玉因说：“我有个主意：既没有外客，吃的东西也别定了样数，谁素日爱吃的，拣样儿做几样。也不必按桌席，每人跟前摆一张高几，各人爱吃的东西一两样，再一个十锦攒心盒子，自斟壶，岂不别致？”贾母听了，说：“很是。”即命人传与厨房：“明日就拣我们爱吃的东西做了，按着人数，再装了盒子来。早饭也摆在园里吃。”商议之间，…","so":0,"eo":0},{"surface":"贾母","text":"正乱着，只见贾母已带了一群人进来了，李纨忙迎上去，笑道：“老太太高兴，倒进来了，我只当还没梳头呢，才掐了菊花要送去。”一面说，一面碧月早已捧过一个大荷叶式的翡翠盘子来，里面养着各色折枝菊花。贾母便拣了一朵大红的簪在鬓上，因回头看见了刘老老，忙笑道：“过来带花儿。”一语末完，凤姐儿便拉过刘老老来，笑道：“让我打扮你。”说着，把一盘子花，横三竖四的插了一头。贾母和众人笑的了不得。刘老老也笑道：“我这头也不知修了什么福，今儿这样体面起来。”众…","so":0,"eo":0},{"surface":"贾母","text":"说话间，已来到沁芳亭上，丫鬟们抱了个大锦褥子来，铺在栏杆榻板上。贾母倚栏坐下，命刘老老也坐在旁边，因问他：“这园子好不好？”刘老老念佛说道：“我们乡下人，到了年下，都上城来买画儿贴。闲了的时候儿大家都说：‘怎么得到画儿上逛逛！’想着画儿也不过是假的，那里有这个真地方儿？谁知今儿进这园里一瞧，竟比画儿还强十倍！怎么得有人也照着这个园子画一张，我带了家去给他们见见，死了也得好处。”贾母听说，指着惜春笑道：“你瞧我这个小孙女儿，他就会画，等明…","so":0,"eo":0},{"surface":"贾母","text":"歇了歇，又领着刘老老都见识见识。先到了潇湘馆。一进门，只见两边翠竹夹路，土地下苍苔布满。中间羊肠一条石子漫的甬路，刘老老让出来与贾母众人走，自己却走土地。琥珀拉他道：“老老你上来走，看青苔滑倒了。”刘老老道：“不相干，我们走熟了，姑娘们只管走罢。可惜你们的那鞋，别沾了泥。”他只顾上头和人说话，不防脚底下果踩滑了，“咕咚”一交跌倒，众人都拍手呵呵的大笑。贾母笑骂道：“小蹄子们，还不搀起来，只站着笑！”说话时，刘老老已爬起来了，自己也笑了，…","so":0,"eo":0},{"surface":"贾母","text":"紫鹃早打起湘帘，贾母等进来坐下。黛玉亲自用小茶盘儿捧了一盖碗茶来奉与贾母。王夫人道：“我们不吃茶，姑娘不用倒了。”黛玉听说，便命丫头把自己窗下常坐的一张椅子挪到下手，请王夫人坐了。刘老老因见窗下案上设着笔砚，又见书架上放着满满的书，刘老老道：“这必定是那一位哥儿的书房了？”贾母笑指黛玉道：“这是我这外孙女儿的屋子。”刘老老留神打量了黛玉一番，方笑道：“这那里象个小姐的绣房？竟比那上等的书房还好呢。”贾母因问：“宝玉怎么不见？”众丫头们答…","so":0,"eo":0},{"surface":"贾母","text":"贾母听了笑道：“呸，人人都说你没有没经过没见过的，连这个纱还不能认得，明儿还说嘴。”薛姨妈等都笑说：“凭他怎么经过见过，怎么敢比老太太呢！老太太何不教导了他，连我们也听听。”凤姐儿也笑说：“好祖宗，教给我罢。”贾母笑向薛姨妈众人道：“那个纱，比你们的年纪还大呢，怪不得他认做蝉翼纱，原也有些象。不知道的都认做蝉翼纱。正经名字叫‘软烟罗’。”凤姐儿道：“这个名儿也好听，只是我这么大了，纱罗也见过几百样，从没听见过这个名色。”贾母笑道：“你能…","so":0,"eo":0},{"surface":"贾母","text":"薛姨妈笑道：“别说凤丫头没见，连我也没听见过。”凤姐儿一面说话，早命人取了一匹来了，贾母说：“可不是这个！先时原不过是糊窗屉，后来我们拿这做被做帐子试试，也竟好。明日就找出几匹来，拿银红的替他糊窗户。”凤姐答应着。众人看了，都称赞不已。刘老老也觑着眼看，口里不住的念佛，说道：“我们想做衣裳也不能，拿着糊窗子，岂不可惜？”贾母道：“倒是做衣裳不好看。”凤姐忙把自己身上穿的一件大红棉纱袄的襟子拉出来，向贾母薛姨妈道：“看我的这袄儿。”贾母、…","so":0,"eo":0},{"surface":"贾母","text":"贾母便笑道：“这屋里窄，再往别处逛去罢。”刘老老笑道：“人人都说：‘大家子住大房。’昨儿见了老太太正房，配上大箱、大柜、大桌子、大床，果然威武。那柜子比我们一间房子还大还高。怪道后院子里有个梯子，我想又不上房晒东西，预备这梯子做什么？后来我想起来，一定是为开顶柜取东西，离了那梯子怎么上得去呢？如今又见了这小屋子，更比大的越发齐整了。满屋里东西都只好看，可不知叫什么。我越看越舍不得离了这里了！”凤姐道：“还有好的呢，我都带你去瞧瞧。”","so":0,"eo":0}]},{"chap":41,"ctitle":"第41章 贾宝玉品茶栊翠庵 刘老老醉卧怡红院","deeds":[{"surface":"贾母","text":"鸳鸯果命人取来。刘老老一看，又惊又喜。惊的是一连十个挨次大小分下来，那大的足足的象个小盆子，极小的还有手里的杯子两个大；喜的是雕楼奇绝，一色山水树木人物，并有草字以及图印。因忙说道：“拿了那小的来就是了。”凤姐儿笑道：“这个杯，没有这大量的，所以没人敢使他。老老既要，好容易找出来，必定要挨次吃一遍才使得。”刘老老吓的忙道：“这个不敢！好姑奶奶，饶了我罢。”贾母、薛姨妈、王夫人知道他有年纪的人，禁不起，忙笑道：“说是说，笑是笑，不可多吃了…","so":0,"eo":0},{"surface":"贾母","text":"只见一个婆子走来，请问贾母说：“姑娘们都到了藕香榭，请示下，就演罢，还是再等一会儿呢？”贾母忙笑道：“可是倒忘了，就叫他们演罢。”那婆子答应去了。不一时，只听得萧管悠扬，笙笛并发；正值风清气爽之时，那乐声穿林度水而来，自然使入神恰心旷。宝玉先禁不住，拿起壶来斟了一杯，一口饮尽，复又斟上，才要饮，只见王夫人也要饮，命人换暖酒，宝玉连忙将自己的杯捧了过来，送到王夫人口边，王夫人便就他手内吃了两口。一时暖酒来了，宝玉仍归旧坐。王夫人提了暖壶下…","so":0,"eo":0},{"surface":"贾母","text":"须臾乐止，薛姨妈笑道：“大家的酒也都有了，且出去散散再坐罢。”贾母也正要散散，于是大家出席，都随着贾母游玩。贾母因要带着刘老老散闷，遂携了刘老老至山前树下，盘桓了半晌，又说给他这是什么树，这是什么石，这是什么花。刘老老一一领会，又向贾母道：“谁知城里不但人尊贵，连雀儿也是尊贵的。偏这雀儿到了你们这里，他也变俊了，也会说话了。”众人不解，因问：“什么雀儿变俊了会说话？”刘老老道：“那廊上金架子上站的绿毛红嘴是鹦哥儿，我是认得的。那笼子里的…","so":0,"eo":0},{"surface":"贾母","text":"一时只见丫头们来请用点心，贾母道：“吃了两杯酒，倒也不饿。也罢，就拿了来这里，大家随便吃些罢。”丫头听说，便去抬了两张几来，又端了两个小捧盒。揭开看时，每个盒内两样。这盒内是两样蒸食：一样是藕粉桂花糖糕，一样是松瓤鹅油卷。那盒内两样炸的：一样是只有一寸来大的小饺儿。贾母因问：“什么馅子？”婆子们忙回：“是螃蟹的。”贾母听了，皱眉说道：“这会子油腻腻的，谁吃这个。”又看那一样，是奶油炸的各色小面果子。也不喜欢，因让薛姨妈，薛姨妈只拣了块糕…","so":0,"eo":0},{"surface":"贾母","text":"当下贾母等吃过了茶，又带了刘老老至栊翠庵来。妙玉相迎进去。众人至院中，见花木繁盛，贾母笑道：“到底是他们修行的人，没事常常修理，比别处越发好看。”一面说，一面便往东禅堂来。妙玉笑往里让，贾母道：“我们才都吃了酒肉，你这里头有菩萨，冲了罪过。我们这里坐坐，把你的好茶拿来，我们吃一杯就去了。”宝玉留神看他是怎么行事，只见妙玉亲自捧了一个海棠花式雕漆填金“云龙献寿”的小茶盘，里面放一个成窑五彩小盖钟，捧与贾母。贾母道：“我不吃六安茶。”妙玉笑…","so":0,"eo":0},{"surface":"贾母","text":"黛玉因问：“这也是旧年的雨水？”妙玉冷笑道：“你这么个人，竟是大俗人，连水也尝不出来！这是五年前我在玄墓蟠香寺住着，收的梅花上的雪，统共得了那一鬼脸青的花瓮一瓮，总舍不得吃，埋在地下，今年夏天才开了。我只吃过一回，这是第二回了。你怎么尝不出来？隔年蠲的雨水，那有这样清淳？如何吃得！”宝钗知他天性怪僻，不好多话，亦不好多坐，吃过茶，便约着黛玉走出来。宝玉和妙玉陪笑说道：“那茶杯虽然腌了，白撩了岂不可惜？依我说，不如就给了那贫婆子罢，他卖了…","so":0,"eo":0},{"surface":"贾母","text":"且说贾母因觉身上乏倦，便命王夫人和迎春姐妹陪着薛姨妈去吃酒，自己便往稻香村来歇息。凤姐忙命人将小竹椅抬来，贾母坐上，两个婆子抬起，凤姐、李纨和众丫头婆子围随去了，不在话下。这里薛姨妈也就辞出。王夫打发文官等出去，将攒盒散给众丫头们吃去，自己便也乘空歇着，随便歪在方才贾母坐的榻上，命一个小丫头放下帘子来，又命捶着腿，吩咐他：“老太太那里有信，你就叫我。”说着也歪着睡着了。宝玉、湘云等看着丫头们将攒盒搁在山石上，也有坐在山石上的，也有坐在草…","so":0,"eo":0},{"surface":"贾母","text":"一时贾母醒了，就在稻香村摆晚饭。贾母因觉懒懒的，也没吃饭，便坐了竹椅小敞轿，回至房中歇息，命凤姐儿等去吃饭。他姐妹方复进园来。未知如何，且看下回分解。","so":0,"eo":0}]},{"chap":42,"ctitle":"第42章 蘅芜君兰言解疑癖 潇湘子雅谑补馀音","deeds":[{"surface":"贾母","text":"话说贾母王夫人去后，姐妹们复进园来吃饭。那刘老老带着板儿，先来见凤姐儿说：“明日一早定要家去了。虽然住了两三天，日子却不多，把古往今来没见过的、没吃过的、没听见的都经验过了。难得老太太和姑奶奶并那些小姐们，连各房里的姑娘们，都这样怜贫惜老照看我。我这一回去没别的报答，惟有请些高香，天天给你们念佛，保佑你们长命百岁的，就算我的心了。”凤姐儿笑道：“你别喜欢，都是为你，老太太也叫风吹病了，躺着嚷不舒服；我们大姐儿也着了凉了，在那里发热呢。”…","so":0,"eo":0},{"surface":"贾母","text":"平儿说一样，刘老老念一句佛，已经念了几千佛了；又见平儿也送他这些东西，又如此谦逊，忙笑道：“姑娘说那里话？这样好东西，我还弃嫌！我就有银子，没处买这样的去呢。只是我怪臊的，收了不好，不收又辜负了姑娘的心。”平儿笑道：“别说外话，咱们都是自己，我才这么着。你放心收了罢，我还和你要东西呢。到年下，你只把你们晒的那个灰条菜和豇豆、扁豆、茄子干子、葫芦条儿，各样干菜带些来——我们这里上上下下都爱吃这个——就算了，别的一概不要，别罔费了心。”刘老…","so":0,"eo":0},{"surface":"贾母","text":"因贾母欠安，众人都过来请安，出去传请大夫。一时婆子回：“大夫来了。”老嬷嬷请贾母进幔子去坐，贾母道：“我也老了，那里养不出那阿物儿来，还怕他不成，不用放幔子，就这样瞧罢。”众婆子听了，便拿过一张小桌子来，放下一个小枕头，便命人请。一时只见贾珍、贾琏、贾蓉三个人，将王太医领来。王太医不敢走甬路，只走旁阶，跟着贾珍到了台阶上。早有两个婆子在两边打起帘子，两个婆子在前导引进去，又见宝玉迎接出来。见贾母穿着青绉绸一斗珠儿的羊皮褂子，端坐在榻上。…","so":0,"eo":0},{"surface":"贾母","text":"这里王夫人和李纨、凤姐儿、宝钗姐妹等，见大夫出去，方从厨后出来。王夫人略坐一坐，也回房去了。刘老老见无事，方上来和贾母告辞。贾母说：“闲了再来。”又命鸳鸯来：“好生打发刘老老出去。我身上不好，不能送你。”刘老老道了谢，又作辞，方同鸳鸯出来。到了下房，鸳鸯指炕上一个包袱说道：“这是老太太的几件衣裳，都是往年间生日节下众人孝敬的。老太太从不穿人家做的，收着也可惜，却是一次也没穿过的，昨日叫我拿出两套来送你带了去，或送人，或自己家里穿罢。这盒…","so":0,"eo":0},{"surface":"贾母","text":"且说宝钗等吃过早饭，又往贾母处问安，回园至分路之处，宝钗便叫黛玉道：“颦儿跟我来，有一句话问你。”黛玉便笑着跟了来。至蘅芜院中，进了房，宝钗便坐下，笑道：“你还不给我跪下！我要审你呢。”黛玉不解何故，因笑道：“你瞧宝丫头疯了！审我什么？”宝钗冷笑道：“好个千金小姐，好个不出屋门的女孩儿！满嘴里说的是什么？你只实说罢。”黛玉不解，只管发笑，心里也不免疑惑，口里只说：“我何曾说什么？你不过要捏我的错儿罢咧。你倒说出来我听听。”宝钗笑道：“你…","so":0,"eo":0},{"surface":"贾母","text":"大家又说了一回闲话儿。至晚饭后，又往贾母处来请安。贾母原没有大病，不过是劳乏了，兼着了些凉，温存了一日，又吃了一两剂药，发散了发散，至晚也就好了。","so":0,"eo":0}]},{"chap":43,"ctitle":"第43章 闲取乐偶攒金庆寿 不了情暂撮土为香","deeds":[{"surface":"贾母","text":"话说王夫人因见贾母那日在大观园不过着了些风寒，不是什么大病，请医生吃了两剂药也就好了，命凤姐来，吩咐他预备给贾政带送东西。正商议着，只见贾母打发人来叫，王夫人忙引着凤姐儿过来。王夫人又请问：“这会子可又觉大安些？”贾母道：“今日可大好了。方才你们送来野鸡崽子汤，我尝了一尝，倒有味儿，又吃了两块肉，心里很受用。”王夫人笑道：“这是凤丫头孝敬老太太的，算他的孝心虔，不枉了素日老太太疼他。”贾母点头笑道：“难为他想着。若是还有生的，再炸上两块…","so":0,"eo":0},{"surface":"贾母","text":"这里贾母又向王夫人笑道：“我打发人找你来，不为别的，初二日是凤丫头的生日。上两年我原想着替他做生日，偏到跟前又有事就混过去了。今年人又齐全，料着又没事，咱们大家好生乐一天。”王夫人笑道：“我也想着呢。既是老太太高兴，何不就商议定了？”贾母笑道：“我想往年不拘谁做生日，都是各自送各自的礼，这个也俗了，也觉太生分。今儿我出个新法子，又不生分，又可以取乐儿。”王夫人忙道：“老太太怎么想着好，就是怎么样行。”贾母笑道：“我想着咱们也学那小家子，…","so":0,"eo":0},{"surface":"贾母","text":"贾母笑着把方才一夕话说与众人听了，众人谁不凑这趣儿呢。再也有和凤姐儿好，情愿这样的。也有怕凤姐儿，巴不得奉承他的。况且都是拿的出来的，所以一闻此言都欣然应诺。贾母先道：“我出二十两。”薛姨妈笑道：“我随着老太太，也是二十两。”邢夫人王夫人笑道：“我们不敢和老太太并肩，自然矮一等，每人十六两罢了。”尤氏李纨也笑道：“我们自然又矮一等，每人十二两罢。”贾母忙和李纨道：“你寡妇失业的，那里还拉你出这个钱，我替你出了罢。”凤姐忙笑道：“老太太别…","so":0,"eo":0},{"surface":"贾母","text":"赖大的母亲因又问道：“少奶奶们十二两，我们自然也该矮一等了？”贾母听说，道：“这使不得。你们虽该矮一等，我知道你们这几个都是财主，位虽低些，钱却比他们多。你们和他们一例才使得。“众嬷嬷听了，连忙答应。贾母又道：“姑娘们不过应个景儿，每人照一个月的月例就是了。”又回头叫鸳鸯来：“你们也凑几个人，商议凑了来。”鸳鸯答应着，去不多时，带了平儿、袭人、彩霞等，还有几个丫头来，也有二两的，也有一两的。贾母因问平儿：“你难道不替你主子做生日？还入在…","so":0,"eo":0},{"surface":"贾母","text":"凤姐又笑道：“上下都全了，还有二位姨奶奶，他出不出也问一声儿。尽到他们是理，不然他们只当小看了他们了。”贾母听说，忙说：“可是呢。怎么倒忘了他们？只怕他们不得闲儿，叫个丫头问问去。”说着，早有丫头去了。半日回来说道：“每位也出二两。”贾母喜欢道：“拿笔砚来算明，共计多少。”尤氏因悄悄的骂凤姐道：“我把你这没足够的小蹄子儿，这么些婆婆婶子凑银子给你做生日，你还不够，又拉上两个苦瓠子。”凤姐也悄悄的笑道：“你少胡说，一会子离了这里，我才和你…","so":0,"eo":0},{"surface":"贾母","text":"说着早已早已合了，共凑了一百五十两有零。贾母道：“一天戏酒用不了。”尤氏道：“既不请客，酒席又不多，两三日的用度都够了。头等，戏不用钱，省在这上头。”贾母道：“凤丫头说那一班好，就传那一班。”凤姐道：“咱们家的班子都听熟了，倒是花几个钱叫一班来听听罢。”贾母道：“这件事我交给珍哥媳妇了，越发叫凤丫头别操一点心儿，受用一日才算。”尤氏答应着。又说了一回话，都知贾母乏了，才浙渐的散出来。","so":0,"eo":0},{"surface":"贾母","text":"”尤氏笑道：“只这一分儿不给也罢了，要不看你素日孝敬我，我本来依你么？”说着，把平儿的一分也拿出来，说道：“平儿来，把你的收了去，等不够了，我替你添上。”平儿会意，笑道：“奶奶先使着，若剩下了，再赏我一样。”尤氏笑道：“只许你主子作弊，就不许我作情吗？”平儿只得收了。尤氏又道：“我看着你主子这么细致，弄这些钱，那里使去？使不了，明儿带了棺材里使去？”一面说着，一面又往贾母处来。先请了安，大概说了两句话，便走到鸳鸯房中，和鸳鸯商议，只听鸳…","so":0,"eo":0},{"surface":"贾母","text":"转眼已是九月初二日，园中人都打听得尤氏办得十分热闹，不但有戏，连耍百戏并说书的女先儿全有，都打点着取乐玩耍。李纨又向众姐妹道：“今儿是正经社日，可别忘了。宝玉也不来，想必他不知，又贪住什么玩意儿，把这事又忘了。”说着，便命丫头：“去瞧做什么呢，快请了来。”丫头去了半日，回说：“花大姐姐说，今儿一早就出门去了。”众人听了都诧异，说：“再没有出门之理。这丫头糊涂！”因又命翠墨去。一时翠墨回来，说：“可不真出门了。说有个朋友死了，出去探丧去了…","so":0,"eo":0}]},{"chap":44,"ctitle":"第44章 变生不测凤姐泼醋 喜出望外平儿理妆","deeds":[{"surface":"贾母","text":"且说贾母心想，今日不比往日，定要教凤姐痛乐一日。本自己懒怠坐席，只在里间屋里榻上歪着和薛姨妈看戏，随心爱吃的拣几样放在小几上，随意吃着说话儿。将自己两桌席面，赏那没有席面的大小丫头并那应着差的妇人等，命他们在窗外廊檐下，也只管坐着随意吃喝，不必拘礼。王夫人和邢夫人在地下高桌上坐着，外面几席是他们姐妹们坐。贾母不时吩咐尤氏等，“让凤丫头坐上面，你们好生替我待东，难为他一年到头辛苦。”尤氏答应了，又笑回道：“他说坐不惯首席，坐在上头，横不是…","so":0,"eo":0},{"surface":"贾母","text":"接着众姐妹也来，凤姐也只得每人的喝了两口，赖嬷嬷见贾母尚且这等高兴，也少不得来凑趣儿，领着些嬷嬷们也来敬酒。凤姐儿也难推脱，只得喝了两口。鸳鸯等也都来敬，凤姐儿真不能了，忙央告道：“好姐姐们饶了我罢！我明儿再喝罢。”鸳鸯笑道：“真个的，我们是没脸的了？就是我们在太太跟前，太太还赏个脸儿呢。往常倒有些体面，今儿当着这些人，倒做起主子的款儿来了。我原不该来，不喝，我们就走。”说着真个回去了。凤姐儿忙忙拉住，笑道：“好姐姐，我喝就是了。”说着…","so":0,"eo":0},{"surface":"贾母","text":"正闹的不开交，只见尤氏等一群人来了，说：“这是怎么说？才好好的，就闹起来。”贾琏见了人，越发倚酒三分醉逞起威风来，故意要杀凤姐儿。凤姐儿见人来了，便不似先前那般泼了，撂下众人，便哭着往贾母那边跑。此时戏已散了，凤姐跑到贾母跟前，爬在贾母怀里，只说：“老祖宗救我，琏二爷要杀我呢！”贾母、邢夫人、王夫人等忙问：“怎么了？”凤姐儿哭道：“我才家去换衣裳，不防琏二爷在家和人说话。我只当是有客来了，唬的我不敢进去在窗户外头听了一听，原来是鲍二家的…","so":0,"eo":0},{"surface":"贾母","text":"这里邢夫人、王夫人也说凤姐，贾母道：“什么要紧的事，小孩子们年轻，馋嘴猫儿似的，那里保的住呢？从小儿人人都打这么过。这都是我的不是，叫你多喝了两口酒，又吃起醋来了！”说的众人都笑了。贾母又道：“你放心，明儿我叫你女婿替你赔不是，你今儿别过去臊着他。”因又骂：“平儿那蹄子，素日我倒看他好，怎么背地里这么坏！”尤氏等笑道：“平儿没有不是，是凤丫头拿着人家出气。两口子生气，都拿着平儿煞性子，平儿委屈的什么儿似的，老太太还骂人家。”贾母道：“这…","so":0,"eo":0},{"surface":"贾母","text":"原来平儿早被李纨拉入大观园去了。平儿哭的哽咽难言，宝钗劝道：“你是个明白人，你们奶奶素日何等待你。今儿不过他多吃了一口酒，他可不拿你出气，难道拿别人出气不成？别人又笑话他是假的了。”正说着，只见琥珀走来，说了贾母的话，平儿自觉面上有了光辉，方才浙渐的好了，也不往前头来。宝钗等歇息了一回，方来看贾母凤姐。宝玉便让了平儿到怡红院中来，袭人忙接着，笑道：“我先原要让你的，只因大奶奶和姑娘们都让你，我就不好让的了。”平儿也陪笑说：“多谢。”因又…","so":0,"eo":0},{"surface":"贾母","text":"平儿就在李纨处歇了一夜，凤姐只跟着贾母睡。贾琏晚间归房，冷清清的，又不好去叫，只得胡乱睡了一夜。次日醒了，想昨日之事，大没意思．后悔不来。邢夫人惦记着昨日贾琏醉了，忙一早过来，叫了贾琏过贾母这边来。贾琏只得忍愧前来，在贾母面前跪下。贾母问他：“怎么了？”贾琏忙陪笑说：“昨儿原是吃了酒，惊了老太太的驾，今儿来领罪。”贾母啐道：“下流东西！灌了黄汤，不说安分守己的挺尸去，倒打起老婆来了！凤丫头成日家说嘴，霸王似的一个人，昨儿唬的可怜。要不是…","so":0,"eo":0},{"surface":"贾母","text":"贾琏听说，爬起来，便与凤姐儿作了一个揖，笑道：“原是我的不是，二奶奶别生气了。”满屋里的人都笑了。贾母笑道：“凤丫头不许恼了。再恼，我就恼了。”说着，又命人去叫了平儿来，命凤姐儿和贾琏安慰平儿。贾琏见了平儿，越发顾不得了，所谓“妻不如妾”，听贾母一说，便赶上来说道：“姑娘昨日受了屈了，都是我的不是。奶奶得罪了你，也是因我而起。我赔了不是不算外，还替你奶奶赔个不是。”说着也作了一个揖，引的贾母笑了，凤姐儿也笑了。贾母又命凤姐来安慰平儿，平…","so":0,"eo":0}]},{"chap":45,"ctitle":"第45章 金兰契互剖金兰语 风雨夕闷制风雨词","deeds":[{"surface":"贾母","text":"平儿斟上茶来，赖嬷嬷忙站起来道：“姑娘，不管叫那孩子倒来罢了，又生受你。”说着，一面吃茶，一面又道：“奶奶不知道，这小孩子们全要管的严。饶这么严，他们还偷空儿闹个乱子来，叫大人操心。知道的，说小孩子们淘气，不知道的人，人家就说仗着财势欺人，连主子名声也不好。恨的我没法儿．常把他老子叫了来，骂一顿才好些。”因又指宝玉道：“不怕你嫌我，如今老爷不过这么管你一管，老太太就护在头里。当日老爷小时，你爷爷那个打，谁没看见的！老爷小时，何曾象你这么…","so":0,"eo":0},{"surface":"贾母","text":"一日，外面矾了绢，起了稿子进来。宝玉每日便在惜春那边帮忙，探春、李纨、迎春、宝钗等也都往那里来闲坐，一则观画，二则便于会面。宝钗因见天气凉爽，夜复渐长，遂至贾母房中商议，打点些针线来。日间至贾母、王夫人处两次省候，不免又承色陪坐，闲时园中姐妹处，也要不时闲话一回。故日间不大得闲，每夜灯下女工，必至三更方寝。黛玉每岁至春分，秋分后必犯旧疾，今秋又遇着贾母高兴，多游玩了两次，未免过劳了神，近日又复嗽起来，觉得比往常又重，所以总不出门，只在自…","so":0,"eo":0}]},{"chap":46,"ctitle":"第46章 尴尬人难免尴尬事 鸳鸯女誓绝鸳鸯偶","deeds":[{"surface":"贾母","text":"邢夫人听了有理，便自往贾母处来。和贾母说了一回闲话儿，便出来，假托往王夫人屋里去，从后屋门出去，打鸳鸯的卧房门前过。只见鸳鸯正坐在那里做针线，见了邢夫人站起来。邢夫人笑道：“做什么呢？”一面说，一面便过来接他手内的针线，道：“我看看你扎的花儿。”看了一看，又道：“越发好了。”遂放下针线，又浑身打量。只见他穿着半新的藕色绫袄，青缎掐牙坎肩儿，下面水绿裙于，蜂腰削背，鸭蛋脸，乌油头发，高高的鼻子，两边腮上微微的几点雀瘢。鸳鸯见这般看他，自己…","so":0,"eo":0},{"surface":"贾母","text":"且说鸳鸯一夜没睡。至次日，他哥哥回贾母，接他家去逛逛，贾母允了，叫他家去。鸳鸯意欲不去，只怕贾母疑心，只得勉强出来。他哥哥只得将贾赦的话说给他，又许他怎么体面，又怎么当家做姨娘，鸳鸯只咬定牙不愿意。他哥哥无法，少不得回去回复贾赦。贾赦恼起来，因说道：“我说给你，叫你女人和他说去。就说我的话：‘自古嫦娥爱少年’，他必定嫌我老了。大约他恋着少爷们，多半是看上了宝玉，只怕也有贾琏。若有此心，叫他早早歇了。我要他不来，以后谁敢收他？这是一件。第…","so":0,"eo":0},{"surface":"贾母","text":"可巧王夫人、薛姨妈、李纨、凤姐儿、宝钗等姊妹并外头的几个执事有头脸的媳妇，都在贾母跟前凑趣儿呢。鸳鸯看见，忙拉了他嫂子，到贾母跟前跪下，一面哭，一面说，把邢夫人怎么来说，园子里他嫂子怎么说，今儿他哥哥又怎么说，“因为不依，方才大老爷越发说我‘恋着宝玉’，不然，要等着往外聘，凭我到天上，这一辈子也跳不出他的手心去，终久要报仇。我是横了心的，当着众人在这里，我这一辈子，别说是宝玉，就是宝金、宝银、宝天王、宝皇帝，横竖不嫁人就完了！就是老太太…","so":0,"eo":0},{"surface":"贾母","text":"贾母听了，气的浑身打战，口内只说：“我通共剩了这么一个可靠的人，他们还要来算计！”因见王夫人在旁，便向王夫人道：“你们原来都是哄我的！外头孝顺，暗地里盘算我！有好东西也来要，有好人也来要。剩了这个毛丫头，见我待他好了，你们自然气不过，弄开了他，好摆弄我！”王夫人忙站起来，不敢还一言。薛姨妈见连王夫人怪上，反不好劝的了。李纨一听见鸳鸯这话，早带了姊妹们出去。探春有心的人，想王夫人虽有委屈，如何敢辩，薛姨妈现是亲妹妹，自然也不好辩，宝钗也不…","so":0,"eo":0},{"surface":"贾母","text":"话未说完，贾母笑道：“可是我老糊涂了。姨太太别笑话我。你这个姐姐，他极孝顺，不象我们那大太太，一味怕老爷，婆婆跟前不过应景儿。可是我委屈了他。”薛姨妈只答应“是”，又说：“老太太偏心，多疼小儿子媳妇，也是有的。”贾母道：“不偏心。”因又说：“宝玉，我错怪了你娘，你怎么也不提我，看着你娘受委屈。”宝玉笑道：“我偏着母亲说大爷大娘不成？通共一个不是，我母亲要不认，却推谁去？我倒要认是我的不是，老太太不信。”贾母笑道：“这也有理。你快给你娘跪…","so":0,"eo":0},{"surface":"贾母","text":"贾母又笑道：“凤姐儿也不提我！”凤姐笑道：“我倒不派老太太的不是，老太太倒寻上我了。”贾母听了，和众人都笑道：“这可奇了，倒要听听这个不是？”凤姐道：“谁叫老太太会调理人？调理的水葱儿似的，怎么怨得人要？我幸亏是孙子媳妇，我若是孙子，我早要了，还等到这会子呢。”贾母笑道：“这倒是我的不是了？”凤姐笑道：“自然是老太太的不是了。”贾母笑道：“这么着，我也不要了，你带了去罢。”凤姐儿道：“等着修了这辈子，来生托生男人，我再要罢。”贾母笑道：…","so":0,"eo":0}]},{"chap":47,"ctitle":"第47章 呆霸王调情遭苦打 冷郎君惧祸走他乡","deeds":[{"surface":"贾母","text":"话说王夫人听见邢夫人来了，连忙迎着出去。邢夫人犹不知贾母已知鸳鸯之事，正还又来打听信息，进了院门，早有几个婆子悄悄的回了他，他才知道。待要回去，里面已知，又见王夫人接出来了，少不得进来。先与贾母请安，贾母一声儿不言语，自己也觉得愧悔。凤姐儿早指一事回避了。鸳鸯也自回房去生气。薛姨妈、王夫人等恐碍着邢夫人的脸面，也都渐浙退了。邢夫人且不敢出去。贾母见无人，方说道：“我听见你替你老爷说媒来了。你倒也‘三从四德’的，只是这贤惠也太过了！你们如…","so":0,"eo":0},{"surface":"贾母","text":"说毕，命人来：“请了姨太太你姑娘们来。才高兴说个话儿，怎么又都散了？”丫头忙答应找去了。众人赶忙的又来。只有薛姨妈向那丫鬟道：“我才来了，又做什么去？你就说我睡了。”那丫头道：“好亲亲的姨太太，姨祖宗！我们老太太生气呢。你老人家不去，没个开交了。只当疼我们罢，你老人家怕走，我背了你老人家去。”薛姨妈笑道：“小鬼头儿，你怕什么？不过骂几句就完了。”说着，只得和这小丫头子走来。贾母忙让坐，又笑道：“咱们斗牌罢？姨太太的牌也生了，咱们一处坐着…","so":0,"eo":0},{"surface":"贾母","text":"一时鸳鸯来了，便坐在贾母下首。鸳鸯之下，便是凤姐儿。铺下红毡，洗牌告么，五人起牌，斗了一回。鸳鸯见贾母的牌已十成，只等一张二饼，便递了暗号儿与凤姐儿。凤姐儿正该发牌，便故意踌躇了半晌，笑道：“我这一张牌定在姨妈手里扣着呢，我若不发这一张牌，再顶不下来的。”薛姨妈道：“我手里并没有你的牌。”凤姐儿道：“我回来是要查的。”薛姨妈道：“你只管查。你且发下来，我瞧瞧是张什么。”凤姐儿便送在薛姨妈跟前，薛姨妈一看，是个二饼，便笑道：“我倒不稀罕他…","so":0,"eo":0},{"surface":"贾母","text":"平儿依言放下钱，也笑了一回，方回来。至院门前，遇见贾琏，问他：“太太在那里呢？老爷叫我请过去呢。”平儿忙笑道：“在老太太跟前站了这半日，还没动呢。趁早儿丢开手罢。老太太生了半日气，这会子亏二奶奶凑了半日的趣儿，才略好了些。”贾琏道：“我过去，只说讨老太太示下，十四往赖大家去不去，好预备轿子。又请了太太，又凑了趣儿，岂不好呢。”平儿笑道：“依我说，你竟别过去罢。合家子连太太、宝玉都有了不是，这会子你又填限去了。”贾琏道：“已经完了，难道还…","so":0,"eo":0},{"surface":"贾母","text":"邢夫人将方才的话只略说了几句，贾赦无法，又且含愧，自此便告了病，且不敢见贾母，只打发邢夫人及贾琏每日过去请安。只得又各处遣人购求寻觅，终久费了五百两银子买了一个十七岁女孩子来，名唤嫣红，收在屋里，不在话下。这里斗了半日牌，吃晚饭才罢。此一二日间无话。","so":0,"eo":0},{"surface":"贾母","text":"转眼到了十四，黑早，赖大的媳妇又进来请。贾母高兴，便带了王夫人、薛姨妈及宝玉姐妹等至大花园中，坐了半日。那花园虽不及大观园，却也十分齐整宽阔、泉石林木，楼台亭轩，也有好几处动人的。外面大厅上，薛蟠、贾珍，贾琏、贾蓉并几个近族的都来了。那赖大家内，也请了几个现任的官长并几个大家子弟作陪。因其中有个柳湘莲，薛蟠自上次会过一次，已念念不忘。又打听他最喜串戏，且都串的是生旦风月戏文，不免错会了意，误认他做了风月子弟，正要与他相交，恨没有个引进，…","so":0,"eo":0},{"surface":"贾母","text":"贾母等回来各自归家时，薛姨妈与宝钗见香菱哭的眼睛肿了，问起原故，忙来瞧薛蟠时，脸上身上虽见伤痕，并未伤筋动骨。薛姨妈又是心疼，又是发恨，骂一回薛蟠，又骂一回湘莲，意欲告诉王夫人，遣人寻拿湘莲。宝钗忙劝道：“这不是什么大事，不过他们一处吃酒，酒后反脸常情。谁醉了，多挨几下打，也是有的。况且咱们家的无法无天的人，也是人所共知的。妈妈不过是心疼的原故，要出气也容易。等三五天哥哥好了出得去的时候，那边珍大爷琏二爷这干人也未必白丢开手，自然备个东…","so":0,"eo":0}]},{"chap":48,"ctitle":"第48章 滥情人情误思游艺 慕雅女雅集苦吟诗","deeds":[{"surface":"贾母","text":"香菱向宝钗道：“我原要和太太说的，等大爷去了，我和姑娘做伴去。我又恐怕太太多心，说我贪着园里来玩，谁知你竟说了。”宝钗笑道：“我知道你心里羡慕这园子不是一日两日的了，只是没有个空儿。每日来一趟，慌慌张张的，也没趣儿。所以趁着机会，越发住上一年，我也多个做伴的，你也遂了你的心。”香菱笑道：“好姑娘！趁着这个功夫，你教给我做诗罢！”宝钗笑道：“我说你‘得陇望蜀’呢。我劝你且缓一缓，今儿头一日进来，先出园东角门，从老太太起，各处各人，你都瞧瞧…","so":0,"eo":0},{"surface":"贾母","text":"且说香菱见了众人之后，吃过晚饭，宝钗等都往贾母处去了，自己便往潇湘馆中来。此时黛玉已好了大半了，见香菱也进园来住，自是喜欢。香菱因笑道：“我这一进来了，也得空儿，好歹教给我做诗，就是我的造化了。”黛玉笑道：“既要学做诗，你就拜我为师。我虽不通，大略也还教的起你。”香菱笑道：“果然这样，我就拜你为师，你可不许腻烦的。”黛玉道：“什么难事，也值得去学？不过是起、承、转、合，当中承、转是两副对子，平声的对仄声，虚的对实的，实的对虚的。若是果有…","so":0,"eo":0},{"surface":"贾母","text":"香菱满心中正是想诗，至晚间，对灯出了一回神，至三更以后，上床躺下，两眼睁睁直到五更，方才朦胧着了。一时天亮，宝钗醒了。听了一听，他安稳睡了，心下想：“他翻腾了一夜，不知可做成了？这会子乏了，且别叫他。”正想着，只见香菱从梦中笑道：“可是有了，难道这一首还不好吗？”宝钗听了，又是可叹，又是可笑，连忙叫醒了他，问他：“得了什么？你这诚心都通了仙了。学不成诗，弄出病来呢！”一面说，一面梳洗了，和姐妹往贾母处来。","so":0,"eo":0}]},{"chap":49,"ctitle":"第49章 琉璃世界白雪红梅 脂粉香娃割腥啖膻","deeds":[{"surface":"贾母","text":"大家来至王夫人上房，只见黑压压的一地。又有邢夫人的嫂子，带了女儿岫烟进京来投邢夫人的，可巧凤姐之兄王仁也正进京，两亲家一处搭帮来了。走至半路泊船时，遇见李纨寡婶，带着两个女儿，长名李纹，次名李绮，也上京，大家叙起来，又是亲戚，因此三家一路同行。后有薛蟠之从弟薛蝌，因当年父亲在京时，已将胞妹薛宝琴许配都中梅翰林之子为妻，正欲进京聘嫁，闻得王仁进京，他也随后带了妹子赶来。所以今日会齐了，来访投各人亲戚。于是大家见礼叙过，贾母、王夫人都欢喜非…","so":0,"eo":0},{"surface":"贾母","text":"宝玉听了，喜的眉开眼笑，忙说道：“倒是你明白。我终久是个糊涂心肠，空喜欢了一会子，却想不到这上头。”说着，兄妹两个一齐往贾母处来。果然王夫人已认了薛宝琴做干女儿。贾母喜欢非常，不命往园中住，晚上跟着贾母一处安寝。薛蝌自向薛蟠书房中住下了。贾母和邢夫人说：“你侄女儿也不必家去了，园里住几天，逛逛再去。”邢夫人兄嫂家中原艰难，这一上京原仗的是邢夫人与他们治房舍帮盘缠，听如此说，岂不愿意。邢夫人便将邢岫烟交与凤姐儿。凤姐儿算着园中妹妹多，性情…","so":0,"eo":0},{"surface":"贾母","text":"当下安插既定，谁知忠靖侯史鼎又迁委了外省大员，不日要带家眷去上任，贾母因舍不得湘云，便留下他了，接到家中。原要命凤姐儿另设一处与他住，史湘云执意不肯，只要和宝钗一处住，因此也就罢了。","so":0,"eo":0},{"surface":"贾母","text":"此时大观园中、比先又热闹了多少，李纨为首，徐者迎春、探春、惜春、宝钗、黛玉、湘云、李纹、李绮、宝琴、邢岫烟，再添上凤姐儿和宝玉，一共十三人。叙起年庚，除李纨年纪最长，凤姐次之，馀者皆不过十五六七岁，大半同年异月，连他们自己也不能记清谁长谁幼，并贾母、王夫人及家中婆子丫头也不能细细分清，不过是“姐”“妹”“兄”“弟”四个字，随便乱叫。","so":0,"eo":0},{"surface":"贾母","text":"说话之间，宝玉、黛玉进来了，宝钗犹自嘲笑。湘云因笑道：“宝姐姐，你这话虽是玩，却有人真心是这样想呢。”琥珀笑道：“真心恼的再没别人，就只是他。”口里说，手抬着宝玉。宝钗、湘云都笑道：“他倒不是这样人。”琥珀又笑道：“不是他，就是他。”说着，又指黛玉。湘云便不作声。宝钗笑道：“更不是了。我的妹妹和他的妹妹一样，他喜欢的比我还甚呢，他那里还恼？你信云儿混说，他那嘴有什么正经。”宝玉素昔深知黛玉有些小性儿，尚不知近日黛玉和宝钗之事，正恐贾母疼…","so":0,"eo":0},{"surface":"贾母","text":"一时宝钗姊妹往薛姨妈房内去后，湘云往贾母处来，林黛玉回房歇着。宝玉便找了黛玉来，笑道：“我虽看了《西厢记》，也曾有明白的几句说了取笑，你还曾恼过。如今想来，竟有一句不解，我念出来，你讲讲我听。”黛玉听了，便知有文章，因笑道：“你念出来我听听。”宝玉笑道：“那《闹简》上有一句说的最好：‘是几时孟光接了梁鸿案？’这五个字不过是现成的典，难为他‘是几时’三个虚字，问的有趣。是几时接了？你说说我听听。”黛玉听了，禁不住也笑起来，因笑道：“这原问…","so":0,"eo":0},{"surface":"贾母","text":"正说着，只见他屋里的小丫头子送了猩猩毡斗篷来，又说：“大奶奶才打发人来说，下了雪，要商议明日请人做诗呢。”一语未了，只见李纨的丫头走来请黛玉。宝玉便邀着黛玉同往稻香村来。黛玉换上掐金挖云红香羊皮小靴，罩了一件大红羽笺面白狐狸皮的鹤氅，系一条青金闪绿双环四合如意绦，上罩了雪帽。二人一齐踏雪行来，只见众妹妹都在那里，都是一色大红猩猩毡与羽毛缎斗篷，独李纨穿一件哆罗呢对襟褂子，薛宝钗穿一件莲青斗纹锦上添花洋线番丝的鹤氅。邢岫烟仍是家常旧衣，…","so":0,"eo":0},{"surface":"贾母","text":"湘云笑道：“快商议做诗。我听听是谁的东家？”李纨道：“我的主意。想来昨儿的正日已自过了。再等正日还早呢，可巧又下雪，不如咱们大家凑个热闹，又给他们接风，又可以做诗。你们意思怎么样？”宝玉先道：“这话很是，只是今儿晚了，若到明儿，晴了又无趣。”众人都道：“这雪未必晴。纵晴了，这一夜下的也够赏了。”李纨道：“我这里虽然好，又不如芦雪庭好。我已经打发人笼地炕去了，咱们大家拥炉做诗。老太太想来未必高兴。况且咱们小玩意儿，单给凤丫头个信儿就是了。…","so":0,"eo":0}]},{"chap":50,"ctitle":"第50章 芦雪庭争联即景诗 暖香坞雅制春灯谜","deeds":[{"surface":"贾母","text":"黛玉写毕，湘云大家才评论时，只见几个丫鬟跑进来道：“老太太来了。”众人忙迎出来，大家又笑道：“怎么这等高兴！”说着，远远见贾母围了大斗篷，带着灰鼠暖兜，坐着小竹轿，打着青绸油伞，鸳鸯、琥珀等五六个丫鬟，每人都是打着伞，拥轿而来。李纨等忙往上迎。贾母命人止住，说：“只站在那里就是了。”来至跟前，贾母笑道：“我瞒着你太太和凤丫头来了。大雪地下，我坐着这个无妨，没的叫他娘儿们踩雪吗。”众人忙上前来接斗篷，搀扶着，一面答应着。","so":0,"eo":0},{"surface":"贾母","text":"贾母来至室中，先笑道：“好俊梅花！你们也会乐，我也不饶你们！”说着，李纨早命人拿了一个大狼皮褥子来，铺在当中。贾母坐了，因笑道：“你们只管照旧玩笑吃喝。我因为天短了，不敢睡中觉，抹了一会牌，想起你们来了，我也来凑个趣儿。”李纨早又捧过手炉来。探春另拿了一副杯箸来，亲自斟了暖酒奉给贾母。贾母便饮了一口，问：“那个盘子是什么东西？”众人忙捧了过来回说：“是糟鹌鹑。”贾母道：“这倒罢了，撕一点子腿儿来。”李纨忙答应了，要水洗手，亲自来撕。贾母…","so":0,"eo":0},{"surface":"贾母","text":"说着，仍坐了竹椅轿，大家围随，过了藕香榭，穿入一条夹道，东西两边皆是过街门，门楼上里外都嵌着石头匾。如今进的是西门，向外的匾上凿着“穿云”二字，向里的凿着“度月”两字。来至堂中，进了向南的正门，贾母下了轿，惜春已接出来了。从里面游廊过去，便是惜春卧房，厦檐下挂着“暖香坞”的匾，早有几个人打起猩红毡帘，已觉暖气拂脸。大家进入屋里，贾母并不归坐，只问惜春：“画到那里了？”借春因笑回：“天气寒冷了，胶性都凝涩不润，画了恐不好看，故此收起来了。…","so":0,"eo":0},{"surface":"贾母","text":"他一行说，众人一行笑。凤姐儿也不等贾母说话，便命人抬过轿来。贾母笑着挽了凤姐儿的手，仍上了轿，带着众人，说笑出了夹道东门。一看四面，粉妆银砌，忽见宝琴披着凫靥裘，站在山坡背后遥等，身后一个丫鬟，抱着一瓶红梅。众人都笑道：“怪道少了两个，他却在这里等着，也弄梅花去了！”贾母喜的忙笑道：“你们瞧，这雪坡儿上，配上他这个人物儿，又是这件衣裳，后头又是这梅花，象个什么？”众人都笑道：“就象老太太屋里挂的仇十洲画的《艳雪图》。”贾母摇头笑道：“那…","so":0,"eo":0},{"surface":"贾母","text":"说话之间，已出了园门，来至贾母房中。吃毕饭大家又说笑了一回，忽见薛姨妈也来了，说：“好大雪，一日也没过来望候老太太。今日老太太倒不高兴？正该赏雪才是。”贾母笑道：“何曾不高兴了！我找了他们姐妹去玩了一会子。”薛姨妈笑道：“昨儿晚上我原想着今日要和我们姨太太借一天园子，摆两桌粗酒，请老太太赏雪的；又见老太太安歇的早，我听见宝儿说：‘老太太心里不大爽。’因此如今也不敢惊动。早知如此，我竟该请了才是呢。”贾母笑道：“这才是十月，是头场雪，往后…","so":0,"eo":0},{"surface":"贾母","text":"贾母因又说及宝琴雪下折梅，比画儿上还好，又细问他的年庚八字并家内景况。薛姨妈度其意思，大约是要给他求配。薛姨妈心中因也遂意，只是已许过梅家了，因贾母尚未说明，自己也不好拟定，遂半吐半露告诉贾母道：“可惜了这孩子没福，前年他父亲就没了。他从小儿见的世面倒多，跟他父亲四山五岳都走遍了。他父亲好乐的，各处因有买卖，带了家眷这一省逛一年，明年又到那一省逛半年，所以天下十停走了有五六停了。那年在这里，把他许了梅翰林的儿子，偏第二年他父亲就辞世了。…","so":0,"eo":0}]},{"chap":51,"ctitle":"第51章 薛小妹新编怀古诗 胡庸医乱用虎狼药","deeds":[{"surface":"贾母","text":"说着，只见老婆子取了药来。宝玉命把煎药的银铞子找了出来，就命在火盆上煎。晴雯因说：“正经给他们茶房里煎去罢咧，弄的这屋里药气，如何使得？”宝玉道：“药气比一切的花香还香呢。神仙采药烧药，再者高人逸士采药治药，最妙的一件东西。这屋里我正想各色都齐了，就只少药香，如今恰全了。”一面说，一面早命人俱上。又嘱咐麝月打点些东西，叫个老嬷嬷去看袭人，劝他少哭。一一妥当，方过前边来贾母、王夫人处请安吃饭。","so":0,"eo":0},{"surface":"贾母","text":"正值凤姐儿和贾母、王夫人商议说：“天又短，又冷，不如以后大嫂子带着姑娘们在园子里吃饭。等天暖和了，再来回的跑也不妨。”王夫人笑道：“这也是好主意，刮风下雪倒便宜。吃东西受了冷气也不好，空心走来，一肚子冷气，压上些东西也不好。不如园子后门里的五间大屋子，横竖有女人们上夜的，挑两个女厨子在那里单给他姐妹弄饭。新鲜菜蔬是有分例的，在总管账房里大了去，或要钱要东西。那些野鸡獐狍各样野味，分些给他们就是了。”贾母道：“我也正想着呢，就怕又添厨房事…","so":0,"eo":0},{"surface":"贾母","text":"凤姐儿说毕，未知贾母何言，且听下回分解。","so":0,"eo":0}]},{"chap":52,"ctitle":"第52章 俏平儿情掩虾须镯 勇晴雯病补孔雀裘","deeds":[{"surface":"贾母","text":"话说贾母道：“正是这个了。上次我要说这话，我见你们大事多，如今又添出些事来，你们固然不敢抱怨，未免想着我只顾疼这些小孙子、孙女儿们，就不体贴你们这当家人了。你既这么说出来，便好了。”因此时薛姨妈、李婶娘都在座，邢夫人及尤氏等也都过来请安，还未过去，贾母因向王夫人等说道：“今日我才说这话，素日我不说。一则怕逞了凤丫头的脸，二则众人不服。今日你们都在这里，都是经过妯娌姑嫂的，还有他这么想得到的没有？”薛姨妈、李婶娘、尤氏齐笑道：“真个少有，…","so":0,"eo":0},{"surface":"贾母","text":"至次日天未明，晴雯便叫醒麝月道：“你也该醒了，只是睡不够。你出去叫人给他预备茶水，我叫醒他就是了。”麝月忙披衣起来道：“咱们叫他起来，穿好衣裳，抬过这火箱去，再叫他们进来。老妈妈们已经说过，不叫他在这屋里，怕过了病气；如今他们见咱们挤在一处，又该唠叨了。”晴雯道：“我也是这么说。”二人才叫时，宝玉已醒了，忙起身披衣。麝月先叫进小丫头子来收拾妥了，才命秋纹等进来，一同伏侍。宝玉梳洗已毕，麝月道：“天又阴阴的，只怕下雪，穿一套毡子的罢。”宝…","so":0,"eo":0},{"surface":"贾母","text":"贾母犹未起来，知道宝玉出门，便开了屋门，命宝玉进去。宝玉见贾母身后宝琴面向里睡着未醒。贾母见宝玉身上穿着荔色哆罗呢的箭袖，大红猩猩毡盘金彩绣石青妆缎沿边的排穗褂。贾母道：“下雪呢么？”宝玉道：“天阴着，还没下呢。”贾母便命：“鸳鸯来，把昨儿那一件孔雀毛的氅衣给他罢。”鸳鸯答应走去，果取了一件来。宝玉看时，金翠辉煌，碧彩闪灼，又不似宝琴所披之凫靥裘。只听贾母笑道：“这叫做‘雀金呢’，这是俄罗斯国拿孔雀毛拈了线织的。前儿那件野鸭子的给了你小…","so":0,"eo":0}]},{"chap":53,"ctitle":"第53章 宁国府除夕祭宗祠 荣国府元宵开夜宴","deeds":[{"surface":"贾母","text":"这日宁府中尤氏正起来，同贾蓉之妻打点送贾母这边的针线礼物，正值丫头捧了一茶盘押岁锞子进来，回说：“兴儿回奶奶；前儿那一包碎金子，共是一百五十三两六钱七分，里头成色不等，总倾了二百二十个锞子。”说着递上去。尤氏看了一看，只见也有梅花式的，也有海棠式的，也有“笔锭如意”的，也有“八宝联春”的。尤氏命：“收拾起来，就叫兴儿将银锞子快快交进来。”丫鬟答应去了。","so":0,"eo":0},{"surface":"贾母","text":"贾珍看了，吃过饭，盥漱毕，换了靴帽，命贾蓉捧着银子跟了来，回过贾母、王夫人，又至这边回过贾赦、邢夫人，方回家去，取出银子，命将口袋向宗祠大炉内焚了。又命贾蓉道：“你去问问你那边二婶娘，正月里请吃年酒的日子拟了没有？若拟定了，叫书房里明白开了单子来，咱们再请时，就不能重复了。旧年不留神重了几家，人家不说咱们不留心，倒象两家商议定了，送虚情怕费事的一样。”贾蓉忙答应去了。一时，拿了请人吃年酒的日期单子来了，贾珍看了，命“交给赖升去看了，请人…","so":0,"eo":0},{"surface":"贾母","text":"已到了腊月二十九日了，各色齐备，两府中都换了门神、联对、挂牌，新油了桃符，焕然一新。宁国府从大门、仪门、大厅、暖阁、内厅、内三门、内仪门并内垂门，直到正堂，一路正门大开，两边阶下一色朱红大高烛，点的两条金龙一般。次日由贾母有封诰者，皆按品级着朝服，先坐八人大轿，带领众人进宫朝贺行礼。领宴毕回来，便到宁府暖阁下轿。诸子弟有未随入朝者，皆在宁府门前排班伺候，然后引人宗祠。","so":0,"eo":0},{"surface":"贾母","text":"只见贾府人分了昭穆，排班立定。贾敬主祭，贾赦陪祭，贾珍献爵，贾琏贾琮献帛，宝玉捧香，贾菖、贾菱展拜垫、守焚池。青衣乐奏，三献爵，兴拜毕，焚帛，奠酒。礼毕，乐止，退出。众人围随贾母至正堂上，影前锦帐高挂，彩屏张护，香烛辉煌，上面正居中悬着荣、宁二祖遗像，皆是披蟒腰玉，两边还有几轴列祖遗像。贾荇、贾芷等从内仪门挨次站列，直到正堂廊下，槛外方是贾敬、贾赦，槛内是各女眷。众家人小厮皆在仪门之外。每一道菜至，传至仪门，贾荇、贾芷等便接了，按次传至…","so":0,"eo":0},{"surface":"贾母","text":"一时礼毕，贾敬、贾赦等便忙退出至荣府，专候与贾母行礼。尤氏上房地下，铺满红毡，当地放着象鼻三足泥鳅流金珐琅大火盆，正面炕上铺着新猩红毡子，设着大红彩绣云龙捧寿的靠背、引枕、坐褥，外另有黑狐皮的袱子搭在上面。大白狐皮坐褥，请贾母上去坐了。两边又铺皮褥，请贾母一辈的两三位妯娌坐了。这边横头排插之后小炕上，也铺了皮褥，让邢夫人等坐下。地下两面相对十二张雕漆椅上，都是一色灰鼠椅搭小褥，每一张椅下一个大铜脚炉，让宝琴等姐妹坐。尤氏用茶盘亲捧茶与贾…","so":0,"eo":0},{"surface":"贾母","text":"茶毕，邢夫人等便先起身来侍贾母吃茶。贾母与年老妯娌们闲话了两三句，便命看轿，凤姐儿忙上去搀起来。尤氏笑回说：“已经预备下老太太的晚饭。每年都不肯赏些体面，用过晚饭再过去。果然我们就不济凤丫头了？”凤姐儿搀着贾母笑道：“老祖宗走罢。咱们家去吃去，别理他。”贾母笑道：“你这是供着祖宗，忙得什么儿似的，那里还搁的住我闹？况且我每年不吃，你们也要送去的。不如还送了来，我吃不了，留着明儿再吃，岂不多吃些？”说的众人都笑了。又吩咐他：“好生派妥当人…","so":0,"eo":0},{"surface":"贾母","text":"一时来至荣府，也是大门正门一直开到里头。如今便不在暖阁下轿了，过了大厅，转弯向西，至贾母这边正厅上下轿。众人围随同至贾母正堂中间，亦是锦祖绣屏，焕然一新。当地火盆内焚着松柏香，百合草。贾母归了坐，老嬷嬷来回：“老太太们来行礼。”贾母忙起身要迎，只见两三个老妯娌已进来了。大家挽手笑了一回，让了一回。吃茶去后，贾母只送至内仪门就回来，归了正坐。贾敬、贾赦等领了诸子弟进来。贾母笑道：“一年家难为你们，不行礼罢。”一面男一起，女一起，一起一起俱…","so":0,"eo":0},{"surface":"贾母","text":"至次日五鼓，贾母等人按品上妆，摆全副执事进宫朝贺，兼祝元春千秋。领宴回来，又至宁府祭过列祖，方回来。受礼毕，便换衣歇息。所有贺节来的亲友，一概不会，只和薛姨妈、李婶娘二人说话随便，或和宝玉、宝钗等姐妹赶围棋摸牌作戏。王夫人和凤姐天天忙着请人吃年酒，那边厅上和院内皆是戏酒，亲友络绎不绝。","so":0,"eo":0}]},{"chap":54,"ctitle":"第54章 史太君破陈腐旧套 王熙凤效戏彩斑衣","deeds":[{"surface":"贾母","text":"却说贾珍、贾琏暗暗预备下大笸箩的钱，听见贾母说赏，忙命小厮们快撒钱，只听满台钱响，贾母大悦。二人遂起身，小厮们将一把新暖银壶捧来，递与贾琏手内，随了贾珍趋至里面。贾珍先到李婶娘席上，躬身取下杯来，回身，贾琏忙斟了一盏，然后便至薛姨妈席上也斟了。二人忙起来笑说：“二位爷请坐着罢了，何必多礼。”于是除邢、王二夫人，满席都离了席，也俱垂手旁站。贾珍等至贾母榻前，因榻矮，二人便屈膝跪了，贾珍在前捧杯，贾琏在后捧壶。虽只二人捧酒，那贾琮弟兄等却都…","so":0,"eo":0},{"surface":"贾母","text":"当下天有二鼓，戏演的是《白义·观灯》八出，正在热闹之际。宝玉因下席往外走。贾母问：“往那里去？外头炮仗利害，留神天上吊下火纸来烧着。”宝玉笑回说：“不往远去，只出去就来。”贾母命婆子们：“好生跟着。”于是宝玉出来，只有麝月、秋纹几个小丫头随着。贾母因说：“袭人怎么不见？他如今也有些拿大了，单支使小女孩儿出来。”王夫人忙起身笑说道：“他妈前日没了，因有热孝，不便前头来。”贾母点头，又笑道：“跟主子，却讲不起这孝与不孝。要是他还跟我，难道这…","so":0,"eo":0},{"surface":"贾母","text":"宝玉便要了一壶暖酒，也从李婶娘斟起。他二人也笑让坐。贾母便说：“他小人家儿，让他斟去。大家倒要干过这杯。”说着，便自己干了。邢、王二夫人也忙干了，薛姨娘、李婶娘也只得于了。贾母又命宝玉道：“你连姐姐妹妹的一齐斟上，不许乱斟，都要叫他干了。”宝玉听说，答应着，一一按次斟上了。至黛玉前，偏他不饮，拿起杯来，放在宝玉唇边。宝玉一气饮干，黛玉笑说：“多谢。”宝玉替他斟上一杯。风姐儿便笑道：“宝玉别喝冷酒。仔细手颤，明儿写不的字、拉不的弓。”宝玉…","so":0,"eo":0},{"surface":"贾母","text":"一时上汤之后，又接着献元宵。贾母便命：“将戏暂歇，小孩子们可怜见的，也给他们些滚汤热菜的吃了再唱。”又命将各样果子元宵等物拿些给他们吃。一时歇了戏，便有婆子带了两个门下常走的女先儿进来，放了两张杌子在那一边，贾母命他们坐了，将弦子琵琶递过去。贾母便问李、薛二人：“听什么书？”他二人都回说：“不拘什么都好。”贾母便问：“近来可又添些什么新书？”两个女先回说：“倒有一段新书，是残唐五代的故事。”贾母问是何名，女先儿回说：“这叫做《凤求鸾》。…","so":0,"eo":0},{"surface":"贾母","text":"众人听了，都笑说：“老太太这一说，是谎都批出来了。”贾母笑道：“有个原故：编这样书的人，有一等妒人家富贵的，或者有求不遂心，所以编出来遭塌人家。再有一等人，他自己看了这些书，看邪了，想着得一个佳人才好，所以编出来取乐儿。他何尝知道那世宦读书人家儿的道理！——别说那书上那些大家子，如今眼下拿着咱们这中等人家说起，也没那样的事。别叫他诌掉了下巴颏子罢。所以我们从不许说这些书，连丫头们也不懂这些话。这几年我老了，他们姐儿们住的远，我偶然闷了，…","so":0,"eo":0},{"surface":"贾母","text":"凤姐儿走上来斟酒，笑道：“罢，罢！酒冷了，老祖宗喝一口润润嗓子再掰谎罢。这一回就叫做《掰谎记》，就出在本朝，本地，本年，本月，本日，本时。老祖宗‘一张口难说两家话’，‘花开两朵，各表一枝’。‘是真是谎且不表，再整观灯看戏的人’。老祖宗且让这二位亲戚吃杯酒、看两出戏着，再从逐朝话言掰起，如何？”一面说，一面斟酒，一面笑。未说完，众人俱已笑倒了。两个女先儿也笑个不住，都说：“奶奶好刚口，奶奶要一说书，真连我们吃饭的地方都没了。”薛姨妈笑道：…","so":0,"eo":0},{"surface":"贾母","text":"”凤姐儿笑道：“外头只有一位珍大哥哥，我们还是论哥哥妹妹，从小儿一处淘气淘了这么大。这几年因做了亲，我如今立了多少规矩了！便不是从小儿兄妹，只论大伯子小婶儿，那二十四孝上‘斑衣戏彩’，他们不能来戏彩引老祖宗笑一笑，我这里好容易引的老祖宗笑一笑，多吃了一点东西，大家喜欢，都该谢我才是，难道反笑我不成？”贾母笑道：“可是这两日我竟没有痛痛的笑一场，倒是亏他才一路说，笑的我这里痛快了些。我再吃钟酒。”吃着酒，又命宝玉：“来敬你姐姐一杯。”凤姐…","so":0,"eo":0},{"surface":"贾母","text":"女先儿回说：“老祖宗不听这书，或者弹一套曲子听听罢。”贾母道：“你们两个对一套《将军令》罢。”二人听说，忙合弦按调拨弄起来。贾母因问：“天有几更了？”众婆子忙回：“三更了。”贾母道：“怪道寒浸浸的起来。”早有众丫鬟拿了添换的衣裳送来。王夫人起身陪笑说道：“老太太不如挪进暖阁里地炕上，倒也罢了。这二位亲戚也不是外人，我们陪着就是了。”贾母听说，笑道：“既这样说，不如大家都挪进去，岂不暖和？”王夫人道：“恐里头坐不下。”贾母道：“我有道理：…","so":0,"eo":0}]},{"chap":55,"ctitle":"第55章 辱亲女愚妾争闲气 欺幼主刁奴蓄险心","deeds":[{"surface":"贾母","text":"探春气方渐平，因向平儿道：“我有一件大事，早要和你奶奶商议，如今可巧想起来。你吃了饭快来。宝姑娘也在这里，咱们四个人商议了，再细细的问你奶奶可行可止。”平儿答应回去。凤姐因问：“为何去这半日？”平儿便笑着将方才原故细细说与他听了。凤姐儿笑道：“好，好，好！好个三姑娘，我说不错，只可惜他命薄，没托生在太太肚里。”平儿笑道：“奶奶也说糊涂话了。他就不是太太养的，难道谁敢小看他，不和别的一样看待么？”凤姐叹道：“你那里知道？虽然正出庶出是一样…","so":0,"eo":0}]},{"chap":56,"ctitle":"第56章 敏探春兴利除宿弊 贤宝钗小惠全大体","deeds":[{"surface":"贾母","text":"刚说着，只见林之孝家的进来，说：“江南甄府里家眷昨日到京，今日进宫朝贺，此刻先遣人送礼请安。”说着便将礼单送上去。探春接了，看道是：“上用的妆缎蟒缎十二匹。上用杂色缎十二匹。上用各色纱十二匹。上用宫绸十二匹。宫用各色缎纱绸绫二十四匹。”李纨，探春看过，说：“用上等封儿赏他。”因又命人去回了贾母。贾母命人叫李纨、探春、宝钗等都过来，将礼物看了。李纨收过一边，吩咐内库上的人说：“等太太回来看了再收。”贾母因说：“甄家又不与别家相同。上等封儿…","so":0,"eo":0},{"surface":"贾母","text":"一语未了，果然人回：“甄府四个女人来请安。”贾母听了，忙命人带进来。那四个人都是四十往上年纪，穿带之物皆比主子不大差别。请安问好毕，贾母便命拿了四个脚踏来。他四人谢了坐，等着宝钗等坐了，方都坐下。贾母便问：“多早晚进京的？”四人忙起身回说：“昨儿进的京，今儿太太带了姑娘进宫请安去了，所以叫女人们来请安，问候姑娘们。”贾母笑问道：“这些年没进京，也不想到就来。”四人也都笑回道：“正是。今年是奉旨唤进京的。”贾母问道：“家眷都来了？”四人回…","so":0,"eo":0},{"surface":"贾母","text":"众媳妇听了，忙去了半刻，围了宝玉进来。四人一见，忙起身笑道：“唬了我们一跳！要是我们不进府来，倘若别处遇见，还只当我们的宝玉后赶着也进了京呢。”一面说，一面都上来拉他的手，问长问短。宝玉也笑问个好。贾母笑道：“比你们的长的如何？”李纨等笑道：“四位妈妈才一说，可知是模样儿相仿了。”贾母笑道：“那有这样巧事。大家子孩子们，再养的娇嫩，除了脸上有残疾十分丑的，大概看去都是一样齐整，这也没有什么怪处。”四人笑道：“如今看来，模样是一样！据老太…","so":0,"eo":0},{"surface":"贾母","text":"这里贾母喜得逢人便告诉：也有一个宝玉，也都一般行景。众人都想着天下的世宦人家，同名的这也很多，祖母溺爱孙子也是常事，不是什么罕事，皆不介意。独宝玉是个迂阔呆公子的心性，自为是那四人承悦贾母之词。后至园中去看湘云病去，湘云因说他：“你放心闹罢，先还‘单丝不成线，独树不成林’，如今有了个对子了。闹利害了，再打急了，你好逃到南京找那个去。”宝玉道：“那里的谎话，你也信了？偏又有个宝玉了？”湘云道：“怎么列国有个蔺相如，汉朝又有个司马相如呢？”…","so":0,"eo":0}]},{"chap":57,"ctitle":"第57章 慧紫鹃情辞试莽玉 慈姨妈爱语慰痴颦","deeds":[{"surface":"贾母","text":"宝玉听了，便如头顶上响了一个焦雷一般。紫鹃看他怎么回答，等了半天，见他只不作声。才要再问，只见晴雯找来说：“老太太叫你呢。谁知在这里。”紫鹃笑道：“他这里问姑娘的病症，我告诉了他半天，他只不信，你倒拉他去罢。”说着，自己便走回房去了。晴雯见他呆呆的，一头热汗，满腔紫胀，忙拉他的手一直到怡红院中。袭人见了这般，慌起来了，只说时气所感，热身被风扑了。无奈宝玉发热事犹小可，更觉两个眼珠儿直直的起来，口角边津液流出，皆不知觉。给他个枕头，他便睡…","so":0,"eo":0},{"surface":"贾母","text":"紫鹃忙上来捶背。黛玉伏枕喘息了半晌，推紫鹃道：“你不用捶！你竟拿绳子来勒死我。是正经！”紫鹃说道：“我并没说什么，不过是说了几句玩话，他就认真了。”袭人道：“你还不知道他那傻子，每每玩话认了真？”黛玉道：“你说了什么话？趁早儿去解说，他只怕就醒过来了。”紫鹃听说，忙下床，同袭人到怡红院。谁知贾母、王夫人等已都在那里了。贾母一见了紫鹃，便眼内出火，骂道：“你这小蹄子，和他说了什么？”紫鹃忙道：“并没敢说什么，不过说几句玩语。”谁知宝玉见了…","so":0,"eo":0},{"surface":"贾母","text":"正说着，人回：“林之孝家的，赖大家的，都来瞧哥儿来了。”贾母道：“难为他们想着，叫他们来瞧瞧。”宝玉听了一个“林”字，便满床闹起来说：“了不得了，林家的人接他们来了！快打出去罢！”贾母听了，也忙说：“打出去罢！”又忙安慰说：“那不是林家的人，林家的人都死绝了，再没人来接他，你只管放心罢！”宝玉道：“凭他是谁，除了林妹妹，都不许姓林了！”贾母道：“没姓林的来，凡姓林的都打出去了。”一面吩咐众人：“以后别叫林之孝家的进园来，你们也别说‘林’…","so":0,"eo":0},{"surface":"贾母","text":"一时人回：“大夫来了。”贾母忙命快进来。王夫人、薛姨妈、宝钗等暂避入里间，贾母便端坐在宝玉身旁。王太医进来，见许多的人，忙上去请了贾母的安，拿了宝玉的手，诊了一回。那紫鹃少不得低了头。王太医也不解何意，起身说道：“世兄这症，乃是急痛迷心。古人曾云，痰迷有别，有气血亏柔饮食不能熔化痰迷者，有怒恼中痰急而迷者，有急痛壅塞者。此亦痰迷之症，系急痛所致，不过一时壅蔽，较别的似轻些。”贾母道：“你只说怕不怕，谁和你背药书呢？”王太医忙躬身笑道：“…","so":0,"eo":0},{"surface":"贾母","text":"一时按方煎药，药来服下，果觉比先安静。无奈宝玉只不肯放紫鹃，只说：“他去了，就是要回苏州去了。”贾母、王夫人无法，只得命紫鹃守着他，另将琥珀去伏侍黛玉。黛玉不时遣雪雁来探消息。这晚间宝玉稍安，贾母、王夫人等方回去了，一夜还遣人来问几次信。李妈妈带宋妈等几个年老人用心看守，紫鹃、袭人、晴雯等日夜相伴。有时宝玉睡去，必从梦中惊醒，不是哭了，说黛玉已去，便是说有人来接。每一惊时，必得紫鹃安慰一番方罢。彼时贾母又命将祛邪守灵丹及开窍通神散各样上…","so":0,"eo":0},{"surface":"贾母","text":"黛玉近日闻得宝玉如此形景，未免又添些病症，多哭几场。今儿紫鹃来了，问其原故，已知大愈，仍遣琥珀去伏侍贾母。夜间人静后，紫鹃已宽衣卧下之时，悄向黛玉笑道：“宝玉的心倒实，听见咱们去，就这么病起来。”黛玉不答。紫鹃停了半晌，自言自语的说道：“一动不如一静。我们这里就算好人家，别的都容易，最难得的是从小儿一处长大，脾气情性都彼此知道的了。”黛玉啐道：“你这几天还不乏，趁这会子不歇一歇，还嚼什么蛆？”紫鹃笑道：“倒不是白嚼咀，我倒是一片真心为姑…","so":0,"eo":0},{"surface":"贾母","text":"黛玉听了，便说道：“这丫头今日可疯了！怎么去了几日，忽然变了一个人？我明日必回老太太，退回你去，我不敢要你了。”紫鹃笑道：“我说的是好话，不过叫你心里留神，并没叫你去为非作歹。何苦回老太太，叫我吃了亏，又有什么好处。”说着，竟自己睡了。黛玉听了这话，口内虽如此说，心内未尝不伤感。待他睡了，便直哭了一夜，至天明，方打了一个盹儿。次日，勉强盥漱了，吃了些燕窝粥。便有贾母等亲来看视了，又嘱咐了许多话。","so":0,"eo":0},{"surface":"贾母","text":"目今是薛姨妈的生日，自贾母起，诸人皆有祝贺之礼，黛玉也只得备了两色针线送去。是日也定了一班小戏，请贾母与王夫人等。独有宝玉与黛玉二人不曾去。至晚散时，贾母等顺路又瞧了他二人一遍，方回房去了。次日，薛姨妈家又命薛蝌陪诸伙计吃了一天酒。忙了三四天，方才完结。","so":0,"eo":0}]},{"chap":58,"ctitle":"第58章 杏子阴假凤泣虚凰 茜纱窗真情揆痴理","deeds":[{"surface":"贾母","text":"谁知上回所表的那位老太妃已薨，凡诰命等皆入朝随班，按爵守制，敕谕天下，凡有爵之家，一年内不得筵宴音乐，庶民皆三月不得婚姻。贾母婆媳祖孙等俱每日入朝随祭，至未正以后方回。在大偏宫二十一日后，方请灵人先陵，地名孝慈县。这陵离都来往得十来日之功，如今请灵至此，还要停放数日，方入地宫，故得一月光景。宁府贾珍夫妻二人，也少不得是要去的。两府无人，因此大家计议，家中无主，便报了“尤氏产育”，将他腾挪出来，协理宁、荣两处事件。因托了薛姨妈在园内照管他…","so":0,"eo":0},{"surface":"贾母","text":"又见各官宦家凡养优伶男女者，一概蠲免遣发，尤氏等便议定，待王夫人回家回明，也欲遣发十二个女孩子，又说：“这些人原是买的，如今虽不学唱，尽可留着使唤，只令其教习们自去也罢了。”王夫人因说：“这学戏的倒比不得使唤的，他们也是好人家的女儿，因无能，卖了做这事，装丑弄鬼的几年。如今有这机会，不如给他们几两银子盘费，各自去罢。当日祖宗手里都是有这例的。咱们如今损阴坏德，而且还小器。如今虽有几个老的还在，那是他们各有原故不肯回去的，所以才留下使唤，…","so":0,"eo":0},{"surface":"贾母","text":"一日正是朝中大祭，贾母等五更便去了。下处用些点心小食，然后入朝，早膳已毕，方退至下处歇息。用过午饭，略歇片刻，复入朝侍中晚二祭，方出至下处歇息；用过晚饭方回家。可巧这下处乃是一个大官的家庙，是比丘尼焚修，房舍极多极净。东西二院，荣府便赁了东院，北静王府便赁了西院。太妃少妃每日晏息，见贾母等在东院，彼此同出同入，都有照应。外面诸事不消细述。","so":0,"eo":0},{"surface":"贾母","text":"且说大观园内贾母王夫人天天不在家内，又送灵去一月方回，各丫鬟婆子皆有空闲，多在园内游玩。更又将梨香院内伏侍的众婆子一概撤回，并散在园内听使，更觉园内人多了几十个。因文官等一干人，或心性高傲，或倚势凌下，或拣衣挑食，或一角锋芒，大概不安分守己者多，因此众婆子含怨，只是口中不敢与他们分争。如今散了学，大家趁了愿，也有丢开手的，也有心地狭窄犹怀旧怨的，因将众人皆分在各房名下，不敢来厮侵。","so":0,"eo":0}]},{"chap":62,"ctitle":"第62章 憨湘云醉眠芍药裀 呆香菱情解石榴裙","deeds":[{"surface":"贾母","text":"这日宝玉清晨起来梳洗已毕，便冠带了来至前厅院中，已有李贵等四个人在那里设下天地香烛。宝玉炷了香，行了礼，奠茶烧纸后，便至宁府中宗祠、祖先堂两处行毕了礼。出至月台上，又朝上遥拜过了贾母、贾政、王夫人等。一顺到尤氏上房，行过礼，坐了一回，方向荣府。先至薛姨妈处，再三拉着，然后又见过薛蝌，让一回，方进园来。晴雯、麝月二人跟随，小丫头夹着毡子，从李氏起，一一挨着，比自己长的房中到过，复出二门，至四个奶奶家让了一回，方进来。虽众人要行礼，也不曾受…","so":0,"eo":0},{"surface":"贾母","text":"大家又该对点搳拳，这些人因贾母、王夫人不在家，没了管束，便任意取乐，呼三喝四，喊七叫八。满厅中红飞翠舞，玉动珠摇，真是十分热闹。玩了一回，大家方起席散了。却忽然不见了湘云。只当他外头自便就来，谁知越等越没了影儿。使人各处去找，那里找的着。","so":0,"eo":0}]},{"chap":63,"ctitle":"第63章 寿怡红群芳开夜宴 死金丹独艳理亲丧","deeds":[{"surface":"贾母","text":"贾蓉巴不得一声儿，便先骑马跑来。到家，忙命前厅收桌椅，下扇，挂孝慢子，门前起鼓手棚、牌楼等事。又忙着进来看外祖母、两个姨娘。原来尤老安人年高喜睡，常常歪着；他二姨娘三姨娘都和丫头们做活计，见他来了，都道烦恼。贾蓉且嘻嘻的望他二姨娘笑说：“二姨娘，你又来了？我父亲正想你呢。”二姨娘红了脸，骂道：“好蓉小子！我过两日不骂你几句，你就过不得了，越发连个体统都没了。还亏你是大家公子哥儿，每日念书学礼的，越发连那小家子的也跟不上。”说着顺手拿起一…","so":0,"eo":0}]},{"chap":64,"ctitle":"第64章 幽淑女悲题五美吟 浪荡子情遗九龙佩","deeds":[{"surface":"贾母","text":"仍欲往下说时，只见有人回道：“琏二爷回来了。适才外头传说，往东府里去了，好一会了，想必就回来的。”宝玉听了，连忙起身，迎至大门以内等待，恰好贾琏自外下马进来。于是宝玉先迎着贾琏打千儿，口中给贾母、王夫人等请了安，又给贾琏请了安。二人携手走进来。只见李纨、凤姐、宝钗、黛玉、迎、探、惜等早在中堂等候，一一相见已毕。因听贾琏说道：“老太太明日一早到家，一路身体甚好。今日先打发了我来，回家看视，明日五更，仍要出城迎接。”说毕，众人又问了些路途的…","so":0,"eo":0},{"surface":"贾母","text":"至次日饭时前后，果见贾母、王夫人等到来。众人接见已毕，略坐了一坐，吃了一杯茶，便领了王夫人等人过宁府中来。只听见里面哭声震天，却是贾赦、贾琏送贾母到家，即过这边来了。当下贾母进入里面，早有贾赦、贾琏率领族中人哭着迎出来了。他父子一边一个，挽了贾母，走至灵前，又有贾珍、贾蓉跪着，扑入贾母怀中痛哭。贾母暮年人，见此光景，亦搂了珍、蓉等痛哭不己。贾赦、贾琏在旁苦劝，方略略止住。又转至灵右，见了尤氏婆媳，不免又相持大痛一场。哭毕，众人方上前，一…","so":0,"eo":0},{"surface":"贾母","text":"又过了数日，乃贾敬送殡之期，贾母犹未大愈，遂留宝玉在家侍奉。凤姐因未曾甚好，亦未去。其余贾赦、贾琏、邢夫人、王夫人等，率领家人仆妇，都送至铁槛寺，至晚方回。贾珍、尤氏并贾蓉仍在寺中守灵，等过百日后，方扶柩回籍。家中仍托尤老娘并二姐儿三姐儿照管。","so":0,"eo":0},{"surface":"贾母","text":"说着，已至宁府门首，贾蓉说道：“叔叔进去向我老娘要出银子来，就交给俞禄罢。我先给老太太请安去。”贾琏含笑点头道：“老太太跟前，别说我和你一同来的。”贾蓉说：“知道。”又附耳向贾琏道：“今儿要遇见二姨儿，可别性急了，闹出事来，往后倒难办了。”贾琏笑道：“少胡说。你快去罢。我在这里等你。”于是贾蓉自去给贾母请安。","so":0,"eo":0},{"surface":"贾母","text":"只听得院内是贾蓉的声音说话。须臾进来，给他老娘姨娘请了安，又向贾琏笑道：“才刚老爷还问叔叔呢，说是有什么事情要使唤，原要使人到庙里去叫。我回老爷说：‘叔叔就来’。老爷还吩咐我，路上遇着叔叔，叫快去呢。”贾琏听了，忙要起身。又听贾蓉和他老娘说道：“那一次我和老太太说的，我父亲要给二姨儿说的姨父，就和我这叔叔的面貌身量差不多儿。老太太说好不好？”一面说着，又悄捎的用手指着贾琏，和他二姨儿努嘴。二姐儿倒不好意思说什么，只见三姐儿似笑非笑、似恼…","so":0,"eo":0}]},{"chap":67,"ctitle":"第67章 见土仪颦卿思故里 闻秘事凤姐讯家童","deeds":[{"surface":"贾母","text":"话犹未了，外面小厮进来回说：“管总的张大爷差人送了两箱子东西来，说：‘这是爷各自买的，不在货账里面。本要早送来，因货物箱子压着，没得拿；昨儿货物发完了，所以今日才送来了。’”一面说，一面又见两个小厮搬进了两个夹板夹的大棕箱。薛蟠一见，说：“嗳哟，可是我怎么就糊涂到这步田地了。特特的给妈合妹妹带来的东西，都忘了，没拿了家里来，还是伙计送了来了。”宝钗说：“亏你说还是‘特特的带来’的，才放了一二十天。要不是‘特特的带来’，大约要放到年底下才…","so":0,"eo":0}]},{"chap":68,"ctitle":"第68章 苦尤娘赚入大观园 酸凤姐大闹宁国府","deeds":[{"surface":"贾母","text":"谁知凤姐早已心下算定，只得贾琏前脚走了，回来便传各色匠役，收拾东厢房三间，照依自己正室一样，装饰陈设。至十四日，便回明贾母王夫人，说十五日一早要到姑子庙进香去。只带了平儿、丰儿、周瑞媳妇、旺儿媳妇四人。未曾上车，便将原故告诉了众人，又吩咐众男人，素衣素盖，一径前来。兴儿引路，一直到了门前扣门。鲍二家的开了，兴儿笑道：“快回二奶奶去，大奶奶来了。”鲍二家的听了这句，顶梁骨走了真魂，忙飞跑进去报与尤二姐。尤二姐虽也一惊，但已来了，只得以礼相…","so":0,"eo":0}]},{"chap":69,"ctitle":"第69章 弄小巧用借剑杀人 觉大限吞生金自逝","deeds":[{"surface":"贾母","text":"话说尤二姐听了，又感谢不尽，只得跟了他来。尤氏那边怎好不过来呢，少不得也过来，跟着凤姐去回。凤姐笑说：“你只别说话，等我去说。”尤氏道：“这个自然。但有了不是，往你身上推就是了。”说着，大家先至贾母屋里。正值贾母和园里姐妹们说笑解闷儿，忽见凤姐带了一个绝标致的小媳妇儿进来，忙觑着眼瞧说：“这是谁家的孩子？好可怜见儿的。”凤姐上来笑道：“老祖宗细细的看看，好不好？”说着，忙拉二姐儿说：“这是太婆婆了，快磕头。”二姐儿忙行了大礼。凤姐又指着…","so":0,"eo":0},{"surface":"贾母","text":"贾母上下瞧了瞧，仰着脸，想了想，因又笑问：“这孩子我倒象那里见过他，好眼熟啊。”凤姐忙又笑说：“老祖宗且别讲那些，只说比我俊不俊。”贾母又带上眼镜，命鸳鸯琥珀：“把那孩子拉过来，我瞧瞧肉皮儿。”众人都抿着嘴儿笑，推他上去。贾母细瞧了一遍，又命琥珀：“拿出他的手来我瞧瞧。”贾母瞧毕，摘下眼镜来，笑说道：“很齐全，我看比你还俊呢。”凤姐听说，笑着忙跪下，将尤氏那边所编之话，一五一十细细的说了一遍，“少不得老祖宗发慈心，先许他进来住，一年后再…","so":0,"eo":0},{"surface":"贾母","text":"凤姐一面吓的来回贾母说，如此这般：“都是珍大嫂子干事不明，那家并没退准，惹人告了。如此官断。”贾母听了，忙唤尤氏过来，说他做事不妥：“既你妹子从小与人指腹为婚，又没退断，叫人告了，这是什么事？”尤氏听了，只得说：“他连银子都收了，怎么没准？”凤姐在旁说：“张华的口供上现说没见银子，也没见人去。他老子又说：‘原是亲家说过一次，并没应准；亲家死了，你们就接进去做二房。’如此没对证的话，只好由他去混说。幸而琏二爷不在家，不曾圆房，这还无妨。只…","so":0,"eo":0},{"surface":"贾母","text":"贾蓉打听的真了，来回了贾母凤姐，说：“张华父子妄告不实，惧罪逃走，官府亦知此情，也不追究，大事完毕。“姐听了，心中一想：“若必定着张华带回二姐儿去，未免贾琏回来，再花几个钱包占住，不怕张华不依。还是二姐儿不去，自己拉绊着还妥当，且再作道理。只是张华此去，不知何往，倘或他再将此事告诉了别人，或日后再寻出这由头来翻案，岂不是自己害了自己？原先不该如此把刀靶儿递给外人哪！”因此，后悔不迭。复又想了一个主意出来，悄命旺儿遣人寻着了他，或讹他做贼…","so":0,"eo":0},{"surface":"贾母","text":"那贾琏一日事毕回来，先到了新房中，已经静悄悄的关锁，只有一个看房子的老头儿。贾琏问起原故，老头子细说原委，贾琏只在镫中跌足。少不得来见贾赦和邢夫人，将所完之事回明。贾赦十分欢喜，说他中用，赏了他一百两银子，又将房中一个十七岁的丫鬟名唤秋桐赏他为妾。贾琏叩头领去，喜之不尽。见了贾母合家众人。回来见了凤姐，未免脸上有些愧色。谁知凤姐反不似往日容颜，同尤二姐一同出来，叙了寒温。贾琏将秋桐之事说了，未免脸上有些得意骄矜之色。凤姐听了，忙命两个媳…","so":0,"eo":0},{"surface":"贾母","text":"他现是二房奶奶，你爷心坎儿上的人，我还让他三分，你去硬碰他，岂不是自寻其死？”那秋桐听了这话越发恼了，天天大口乱骂，说：“奶奶是软弱人，那等贤惠，我却做不来！奶奶把素日的威风怎么都没了？奶奶宽洪大量，我却眼里揉不下沙子去。让我和这娼妇做一回，他才知道呢。”凤姐儿在屋里，只装不敢出声儿。气的尤二姐在房里哭泣，连饭也不吃，又不敢告诉贾琏。次日，贾母见他眼睛红红的肿了，问他，又不敢说。秋桐正是抓乖卖俏之时，他便悄悄的告诉贾母王夫人等说：“他专…","so":0,"eo":0},{"surface":"贾母","text":"凤姐儿见抬了出去，推有病，回老太太：“太太说我病着，忌三房，不许我去，我因此也不出来穿孝。”且往大观园中来，绕过群山，至北界墙根下，往外听了一言半语，回来又回贾母说，如此这般。贾母道：“信他胡说！谁家痨病死的孩子不烧了？也认真开丧破土起来！既是二房一场，也是夫妻情分，停五七日，抬出来，或一烧，或乱葬埂上埋了完事。”凤姐笑道：“可是这话，我又不敢劝他。”正说着，丫鬟来请凤姐，说：“二爷在家，等着奶奶拿银子呢。”凤姐儿只得来了，便问他：“什…","so":0,"eo":0},{"surface":"贾母","text":"贾琏收了银子，命人买板进来，连夜赶造，一面分派了人口守灵。晚上自己也不进去，只在这里伴宿。放了七日，想着二姐旧情，虽不大敢作声势，却也不免请些僧道超度亡灵。一时，贾母忽然来唤。","so":0,"eo":0}]},{"chap":70,"ctitle":"第70章 林黛玉重建桃花社 史湘云偶填柳絮词","deeds":[{"surface":"贾母","text":"话说贾琏自在梨香院伴宿七日夜，天天僧道不断做佛事。贾母唤了他去，吩咐不许送往家庙中，贾琏无法，只得又和时觉说了，就在尤三姐之上，点了一个穴，破土埋葬。那日送殡，只不过族中人与王姓夫妇、尤氏婆媳而已。","so":0,"eo":0},{"surface":"贾母","text":"凤姐一应不管，只凭他自去办理。又因年近岁逼，诸事烦杂不算外，又有林之孝开了一个人单子来回：“共有八个二十五岁的单身小厮，应该娶妻成房的，等里面有该放的丫头，好求指配。”凤姐看了，先来问贾母和王夫人。大家商议，虽有几个应该发配的，奈各人皆有缘故：第一个鸳鸯，发誓不去。自那日之后，一向未与宝玉说话，也不盛妆浓饰。众人见他志坚，也不好相强。第二个琥珀，现又有病，这次不能了。彩云因近日和贾环分崩，也染了无医之症。只有凤姐儿和李纨房中粗使的大丫头…","so":0,"eo":0},{"surface":"贾母","text":"原来这一向因凤姐儿病了，李纨探春料理家务，不得闲暇。接着过年过节，许多杂事，竟将诗社搁起。如今仲春天气，虽得了工夫，争奈宝玉因柳湘莲遁迹空门，又闻得尤三姐自刎，尤二姐被凤姐逼死，又兼柳五儿自那夜监禁之后，病越重了：连连接接，闲愁胡恨，一重不了一重添，弄的情色若痴，语言常乱，似染怔仲之病。慌的袭人等又不敢回贾母，只百般逗他玩笑。","so":0,"eo":0},{"surface":"贾母","text":"这日，众妹妹皆在房中侍早膳毕，便有贾政书信到了。宝玉请安，将请贾母的安禀拆开，念与贾母听。上面不过是请安的话，说六月准进京等语。其馀家信事物之帖，自有贾琏和王夫人开读。众人听说六七月回京，都喜之不尽。偏生这日王子腾将侄女许与保宁侯之子为妻，择于五月间过门，凤姐儿又忙着张罗，常三五日不在家。这日王子腾的夫人又来接凤姐儿，一并请众甥男甥女乐一日。贾母和王夫人命宝玉、探春、黛玉、宝钗四人同凤姐儿去，众人不敢违拗，只得回房去另妆饰了起来。五人去…","so":0,"eo":0},{"surface":"贾母","text":"贾母因不见他，只当病了，忙使人来问。宝玉方去请安，便说：“写字之故，因此出来迟了。”贾母听说，十分喜欢，就吩咐他：“以后只管写字，念书，不用出来也使得。你去回你太太知道。”宝玉听说，遂到王夫人屋里来说明。王夫人便道：“临阵磨枪也不中用。有这会子着急，天天写写念念，有多少完不了的？这一赶，又赶出病来才罢。”宝玉回说：“不妨事。”宝钗、探春等都笑说：“太太不用着急。书虽替不得他，字却替得的。我们每日每人临一篇给他，搪塞过这一步儿去就完了，一…","so":0,"eo":0},{"surface":"贾母","text":"展眼已是夏末秋初。一日，贾母处两个丫头，匆匆忙忙来叫宝玉。","so":0,"eo":0}]},{"chap":71,"ctitle":"第71章 嫌隙人有心生嫌隙 鸳鸯女无意遇鸳鸯","deeds":[{"surface":"贾母","text":"话说贾母处两个丫头，匆匆忙忙来找宝玉，口里说道：“二爷快跟着我们走罢，老爷家来了。”宝玉听了，又喜又愁，只得忙忙换了衣服，前来请安。贾政正在贾母房中，连衣服未换，看见宝玉进来请安，心中自是喜欢，却又有些伤感之意。又叙了些任上的事情，贾母便说：“你也乏了，歇歇去罢。”贾政忙站起来，笑着答应了个“是”，又略站着说了几句话，才退出来。宝玉等也都跟过来。贾政自然问问他的工课，也就散了。","so":0,"eo":0},{"surface":"贾母","text":"原来贾政回京复命，因是学差，故不敢先到家中。珍、琏、宝玉头一天便迎出一站去，接见了。贾政先请了贾母的安，便命都回家伺候。次日面圣，诸事完毕，才回家来。又蒙恩赐假一月，在家歇息。因年景渐老，事重身衰，又近因在外几年，骨肉离异，今得宴然复聚，自觉喜幸不尽。一应大小事务，一概亦付之度外，只是看书，闷了便与清客们下棋吃酒，或日间在里边，母子夫妻，共叙天伦之乐。","so":0,"eo":0},{"surface":"贾母","text":"因今岁八月初三日乃贾母八旬大庆，又因亲友全来，恐筵宴排设不开，便早同贾赦及贾琏等商议，议定于七月二十八日起至八月初五日止，宁荣两处齐开筵宴。宁国府中单请官客，荣国府中单请堂客。大观园中收拾出缀锦阁并嘉荫堂等几处大地方来做退居。二十八日，请皇亲、驸马、王公、诸王、郡主、王姑、公主、国君、太君、夫人等，二十九日，便是阁府督镇及诰命等；三十日，便是诸官长及诰命并远近亲友及堂客。初一日，是贾赦的家宴；初二日，是贾政；初三日，是贾珍、贾琏；初四日…","so":0,"eo":0},{"surface":"贾母","text":"自七月上旬，送寿礼者便络绎不绝。礼部奉旨：钦赐金玉如意一柄，彩缎四端，金玉杯各四件，帑银五百两。元春又命太监送出金寿星一尊，沉香拐一支，伽楠珠一串，福寿香一盒，金锭一对，银锭四对，彩缎十二匹，玉杯四只。馀者自亲王驸马以及大小文武官员家，凡所来往者，莫不有礼，不能胜记。堂屋内设下大桌案，铺了红毡，将凡有精细之物都摆上，请贾母过目。先一二日，还高兴过来瞧瞧，后来烦了，也不过目，只说：“凤丫头收了，改日闷了再瞧。”","so":0,"eo":0},{"surface":"贾母","text":"至二十八日，两府中俱悬灯结彩，屏开鸾凤，褥设芙蓉，笙萧鼓乐之音，通衢越巷。宁府中，本日只有北静王、南安郡王、永昌驸马、乐善郡王并几位世交公侯荫袭；荣府中，南安王太姑、北静王妃并世交公侯诰命。贾母等皆是按品大妆迎接。大家厮见，先请至大观园内嘉荫堂，茶毕更衣，方出至荣庆堂上拜寿入席。大家谦逊半日，方才入座。上面两席是南北王妃，下面依序便是众公侯命妇。左边下手一席，陪客是锦乡侯诰命与临昌伯诰命；右边下手方是贾母主位。邢夫人、王夫人带领尤氏凤姐…","so":0,"eo":0},{"surface":"贾母","text":"少时，菜已四献，汤始一道，跟来各家的放了赏，大家便更衣服入园来，另献好茶。南安太妃因问宝玉。贾母笑道：“今日几处庙里念保安延寿经，他跪经去了。”又问众小姐们。贾母笑道：“他们姊妹们病的病，弱的弱，见人腼腆，所以叫他们给我看屋子去了。有的是小戏子传了一班在那边厅上，陪着他姨娘家秭妹们也看戏呢。”南安太妃笑道：“既这样，叫人请来。”贾母回头命了凤姐儿，“去把史、薛、林四位姑娘带来。再只叫你三妹妹陪着来罢。”凤姐答应了，来至贾母这边，只见他姊…","so":0,"eo":0},{"surface":"贾母","text":"吃了茶，园中略逛了一逛，贾母等因又让入席。南安太妃便告辞，说：“身上不快。今日若不来，实在使不得。因此，恕我竟先要告别了。”贾母等听说，也不便强留，大家又让了一回，送至园门，坐轿而去。接着北静王妃坐了一坐，也就告辞了。馀者也有终席的，也有不终席的。贾母劳乏了一日，次日便不见人，一应都是邢夫人款待。有那些世家子弟拜寿的，只到厅上行礼，贾赦、贾政、贾珍还礼看待，至宁府坐席，不在话下。","so":0,"eo":0},{"surface":"贾母","text":"这几日尤氏晚间也不回那府去，白日间待客，晚上陪贾母玩笑，又帮着凤姐料理出入大小器皿以及收放礼物。晚上往园内李氏房中歇宿。这日伏侍过贾母晚饭后，贾母因说：“你们乏了，我也乏了，早些找点子什么吃了，歇歇去罢。明儿还要起早呢。”尤氏答应着，退出去，到凤姐儿屋里来吃饭。凤姐儿正在楼上看着人收送来的围屏呢，只有平儿在屋里，给凤姐叠衣服。尤氏想起二姐儿在时多承平儿照应，便点着头儿，说道：“好丫头，你这么个好心人，难为在这里熬。”平儿把眼圈儿一红，忙…","so":0,"eo":0}]},{"chap":72,"ctitle":"第72章 王熙凤恃强羞说病 来旺妇倚势霸成亲","deeds":[{"surface":"贾母","text":"且说鸳鸯出了角门，脸上犹热，心内突突的乱跳，真是意外之事。因想这事非常，若说出来奸盗相连，关系人命，还保不住带累旁人。横竖与自己无干，且藏在心内，不说给人知道。回房复了贾母的命，大家安息不提。","so":0,"eo":0},{"surface":"贾母","text":"贾琏忙也立起身来，说道：“好姐姐，略坐一坐儿，兄弟还有一事相求。”说着，便骂小丫头：“怎么不沏好茶来？快拿干净盖碗，把昨日进上的新茶沏一碗来！”说着，向鸳鸯道：“这两日，因老太太千秋，所有的几千两都使了。几处房租、地租，统在九月才得，这会子竟接不上。明儿又要送南安府里的礼，又要预备娘娘的重阳节，还有几家红白大礼，至少还得三二千两银子用，一时难去支借。俗语说的好：‘求人不如求己。’说不得姐姐担个不是，暂且把老太太查不着的金银家伙，偷着运出…","so":0,"eo":0},{"surface":"贾母","text":"一语未了，人回：“夏太监打发了一个小内家来说话。”贾琏听了，忙皱眉道：“又是什么话？一年他们也搬够了。”凤姐道：“你藏起来，等我见他。若是小事罢了，若是大事，我自有回话。”贾琏便躲入内套间去。这里凤姐命人带进小太监来，让他椅上坐了吃茶，因问何事。那小太监便说：“夏爷爷因今儿偶见一所房子，如今竟短二百两银子，打发我来问舅奶奶家里，有现成的银子暂借一二百，这一两日就送来。”凤姐儿听了，笑道：“什么是送来？有的是银子，只管先兑了去。改日等我们…","so":0,"eo":0}]},{"chap":73,"ctitle":"第73章 痴丫头误拾绣春囊 懦小姐不问累金凤","deeds":[{"surface":"贾母","text":"贾母闻知宝玉被吓，细问原由，众人不敢再隐，只得回明。贾母道：“我不料有此事。如今各处上夜的都不小还是小事，只怕他们就是贼也未可知。”当下邢夫人、尤氏等都过来请安，李纨、凤姐及妹妹等皆陪侍，听贾母如此说，都默无所答。独探春出位笑道：“近因凤姐姐身子不好几日，园里的人，比先放肆许多。先前不过是大家偷着一时半刻，或夜里坐更时三四个人聚在一处，或掷骰，或斗牌，小玩意儿，不过为着熬困起见。如今渐次放诞，竟开了赌局，甚至头家局主，或三十吊五十吊的大…","so":0,"eo":0},{"surface":"贾母","text":"林之孝家的等见贾母动怒，谁敢徇私，忙去园内传齐，又一一盘查。虽然大家赖一回，终不免水落石出。查得大头家三人，小头家八人，聚赌者统共二十多人，都带来见贾母，跪在院内，磕响头求饶。贾母先问大头家名姓，和钱之多少。原来这大头家，一个是林之孝家的两姨亲家，一个是园内厨房内柳家媳妇之妹，一个是迎春之乳母。这是三个为首的，馀者不能多记。贾母便命将骰子纸牌一并烧毁，所有的钱入官，分散与从人；将为首者每人打四十大板，撵出去，总不许再入；从者每人打二十板…","so":0,"eo":0},{"surface":"贾母","text":"邢夫人在王夫人处坐了一回，也要到园内走走。刚至园门前，只见贾母房内的小丫头子名唤傻大姐的，笑嘻嘻走来，手内拿着个花红柳绿的东西，低头瞧着只管走。不防迎头撞见邢夫人，抬头看见，方才站住。邢夫人因说：“这傻丫头又得个什么爱巴物儿，这样喜欢？拿来我瞧瞧。”原来这傻大姐年方十四岁，是新挑上来给贾母这边专做粗活的。因他生的体肥面阔，两只大脚，做粗活很爽利简捷，且心性愚顽，一无知识，出言可以发笑。贾母喜欢，便起名为“傻大姐”，若有错失，也不苛责他。…","so":0,"eo":0}]},{"chap":74,"ctitle":"第74章 惑奸谗抄检大观园 避嫌隙杜绝宁国府","deeds":[{"surface":"贾母","text":"至晚饭后，待贾母安寝了，宝钗等入园时，王家的便请了凤姐一并进园，喝命将角门皆上锁，便从上夜的婆子处来抄检起。不过抄检些多馀攒下蜡烛灯油等物。王善保家的道：“这也是赃，不许动的，等明日回过太太再动。”于是先就到怡红院中，喝命关门。当下宝玉正因晴雯不自在，忽见这一干人来，不知为何直扑了丫头们的房门去。因迎出凤姐来，问是何故。凤姐道：“丢了一件要紧的东西，因大家混赖，恐怕有丫头们偷了，所以大家都查一查，去疑儿。”一面说，一面坐下吃茶。王家的等…","so":0,"eo":0}]},{"chap":75,"ctitle":"第75章 开夜宴异兆发悲音 赏中秋新词得佳谶","deeds":[{"surface":"贾母","text":"尤氏辞了李纨，往贾母这边来。贾母歪在榻上，王夫人正说甄家因何获罪，如今抄没了家产，来京治罪等话。贾母听了，心中甚不自在。恰好见他妹妹来了，因问：“从那里来的？可知凤姐儿妯娌两个病着，今日怎么样？”尤氏等忙回道：“今日都好些。”贾母点头叹道：“咱们别管人家的事，且商量咱们八月十五赏月是正经。”王夫人笑道：“已预备下了，不知老太太拣那里好？只是园里恐夜晚风凉。”贾母笑道：“多穿两件衣服何妨？那里正是赏月的地方，岂可倒不去的？”说话之间，媳妇…","so":0,"eo":0},{"surface":"贾母","text":"贾母因问：“拿稀饭来吃些罢。”尤氏早捧过一碗来，说是红稻米粥。贾母接来吃了半碗，便吩咐：“将这粥送给凤姐儿吃去。”又指着这一盘果子：“独给平儿吃去。”又向尤氏道：“我吃了，你就来吃了罢。”尤氏答应着，待贾母漱口洗手毕。贾母便下地，和王夫人说闲话行食，尤氏告坐吃饭。贾母又命鸳鸯等来陪吃。贾母见尤氏吃的仍是白米饭，因问说：“怎么不盛我的饭？”丫头们回道：“老太太的饭完了。今日添了一位姑娘，所以短了些。”鸳鸯道：“如今都是‘可着头做帽子’了，…","so":0,"eo":0},{"surface":"贾母","text":"一时王夫人也去用饭。这里尤氏直陪贾母说话取笑到起更的时候，贾母说：“你也过去罢。”尤氏方告辞出来。走至二门外，上了车，众媳妇放下帘子来，四个小厮拉出来，套上牲口，几个媳妇带着小丫头子们先走，到那边大门口等着去了。这里送的丫鬟们也回来了。","so":0,"eo":0},{"surface":"贾母","text":"贾珍夫妻至晚饭后方过荣府来。只见贾赦、贾政都在贾母房里坐着说闲话儿，与贾母取笑呢。贾琏、宝玉、贾环、贾兰皆在地下侍立。贾珍来了，都一一见过，说了两句话，贾珍方在挨门小杌子上告了坐，侧着身子坐下。贾母笑问道：“这两日你宝兄弟的箭如何了？”贾珍忙起身笑道：“大长进了，不但式样好，而且弓也长了一个劲。”贾母道：“这也够了，且别贪力，仔细努伤着。”贾珍忙答应了几个“是”。贾母又道：“你昨日送来的月饼好。西瓜看着倒好，打开却也不怎么样。”贾珍陪笑…","so":0,"eo":0},{"surface":"贾母","text":"当下园子正门俱已大开，挂着羊角灯。嘉荫堂月台上，焚着斗香，秉着烛，陈设着瓜果月饼等物。邢夫人等皆在里面久候。真是月明灯彩，人气香烟，晶艳氤氲，不可名状。地下铺着拜毡锦褥，贾母手上香拜毕，于是大家皆拜过。贾母便说：“赏月在山上最好。”因命在那山上的大花厅上去，众人听说，就忙着在那里铺设。贾母且在嘉荫堂中吃茶少歇，说些闲话。一时人回：“都齐备了。”贾母方扶着人上山来。王夫人等因回说：“恐石上苔滑，还是坐竹椅上去。”贾母道：“天天打扫，况且极…","so":0,"eo":0},{"surface":"贾母","text":"于是先从贾母起，次贾赦，一一接过。鼓声两转，恰恰在贾政手中住了，只得饮了酒。众妹妹弟兄都你悄悄的扯我一下，我暗暗的又捏你一把，都含笑心里想着，倒要听是何笑话儿。贾政见贾母欢喜，只得承欢。方欲说时，贾母又笑道：“要说的不笑了，还要罚。”贾政笑道：“只得一个，若不说笑了，也只好愿罚。”贾母道：“你就说这一个。”贾政因说道：“一家子，一个人最怕老婆，只说了这一句，大家都笑了，因从没听见贾政说过所以才笑。贾母笑道：“这必是好的。”贾政笑道：“若…","so":0,"eo":0},{"surface":"贾母","text":"于是贾政又说道：“这个怕老婆的人，从不敢多走一步。偏偏那日是八月十五，到街上买东西，便见了几个朋友，死活拉到家里去吃酒。不想吃醉了，便在朋友家睡着了。第二日醒了，后悔不及，只得来家赔罪。他老婆正洗脚，说：‘既是这样，你替我舔舔就饶你。’这男人只得给他舔，未免恶心要吐。他老婆便恼了，要打，说：‘你这样轻狂！’吓得他男人忙跪下求说：‘并不是奶奶的脚腌，只因昨儿喝多了黄酒，又吃了月饼馅子，所以今日有些作酸呢。’”说得贾母和众人都笑了。贾政忙又…","so":0,"eo":0},{"surface":"贾母","text":"于是又击鼓，便从贾政起，可巧到宝玉鼓止。宝玉因贾政在坐，早已不安，偏又在他手中，因想：“说笑话，倘或说不好了，又说没口才；说好了，又说正经的不会，只惯贫嘴，更有不是。不如不说。”乃起身辞道：“我不能说，求限别的罢。”贾政道：“既这样，限个‘秋’字，就即景做一首诗。好便赏你，若不好，明日仔细！”贾母忙道：“好好的行令，怎么又做诗？”贾政陪笑道：“他能的。”贾母听说：“既这样，就做。快命人取纸笔来。”贾政道：“只不许用这些‘水’‘晶’‘冰’…","so":0,"eo":0}]},{"chap":76,"ctitle":"第76章 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞","deeds":[{"surface":"贾母","text":"话说贾赦、贾政带领贾珍等散去不提。且说贾母这里命将围屏撤去，两席并作一席。众媳妇另行擦桌整果，更杯洗箸，陈设一番。贾母等都添了衣，盥漱吃茶，方又坐下，团团围绕。贾母看时，宝钗姊妹二人不在坐内，知他家去圆月，且李纨、凤姐二人又病，少了这四个人，便觉冷清了好些。贾母因笑道：“往年你老爷们不在家，咱们都是请过姨太太来大家赏月，却十分热闹。忽一时想起你老爷来，又不免想到母子夫妻儿女不能一处，也都没兴。及至今年你老爷来了，正该大家团圆取乐，又不便…","so":0,"eo":0},{"surface":"贾母","text":"贾母因见月至天中，比先越发精彩可爱，因说：“如此好月，不可不闻笛。”因命又将十番上女子传来。贾母道：“音乐多了，反失雅致，只用吹笛的远远的吹起来，就够了。”说毕，刚才去吹时，只见跟邢夫人的媳妇走来向邢夫人说了两句话。贾母便问：“什么事？”邢夫人便回说：“方才大老爷出去，被石头绊了一下，歪了腿。”贾母听说，忙命两个婆子快看去，又命邢夫人快去。邢夫人遂告辞起身。贾母便又说：“珍哥媳妇也趁便儿就家去罢，我也就睡了。”尤氏笑道：“我今日不回去了…","so":0,"eo":0},{"surface":"贾母","text":"这里众人赏了一回桂花，又入席换暖酒来。正说着闲话，猛不防那壁里桂花树下，呜咽悠扬，吹出笛声来。趁着这明月清风，天空地静，真令人烦心顿释，万虑齐除，肃然危坐，默然相赏。听约两盏茶时，方才止住。大家称赞不已，于是遂又斟上暖酒来，贾母笑道：“果然好听么？”众人笑道：“实在好听。我们也想不到这样，须得老太太带领着，我们也得开些心儿。”贾母道：“这还不大好，须得拣那曲谱越慢的吹来越好听。”便命斟一大杯酒送给吹笛之人，慢慢的吃了再细细的吹一套来。媳…","so":0,"eo":0},{"surface":"贾母","text":"说着，鸳鸯拿巾兜与大斗篷来，说：“夜深了，恐露水下了，风吹了头，坐坐也该歇了。”贾母道：“偏今儿高兴，你又来催。难道我醉了不成？偏要坐到天亮。”因命再斟来，一面戴上兜巾，披了斗篷，大家陪着又饮，说些笑话。只听桂花阴里又发出一缕笛音来，果然比先越发凄凉，大家都寂然而坐。夜静月明，众人不禁伤感，忙转身陪笑发语解释，又命换酒止笛。尤氏笑说道：“我也就学了一个笑话，说给老太太解闷儿。”贾母勉强笑道：“这样更好，快说来我听。”尤氏乃说道：“一家子…","so":0,"eo":0},{"surface":"贾母","text":"这里众媳妇收拾杯盘，却少了个细茶杯，各处寻觅不见。又问众人：“必是失手打了。撂在那里？告诉我，拿了磁瓦去交，好作证见。不然，又说偷起来了。”众人都说，没有打碎。只怕跟姑娘的人打了，也未可知。你细想想，或问问他们去？”一语提醒了那媳妇，笑道：“是了。那一会记得是翠缕拿着的，我去问他。”说着便找时，刚到了甬道，就遇见紫鹃和翠缕来了。翠缕便问道：“老太太散了？可知我们姑娘那里去了？”这媳妇道：“我来问你一个茶钟那里去了，你倒问我要姑娘。”翠缕…","so":0,"eo":0},{"surface":"贾母","text":"原来黛玉和湘云二人并未去睡。只因黛玉见贾府中许多人赏月，贾母犹叹人少，又想宝钗姐妹家去，母女弟兄自去赏月，不觉对景感怀，自去倚栏垂泪。宝玉近因晴雯病势甚重，诸务无心，王夫人再四遣他去睡，他从此去了。探春又因近日家事恼着，无心游玩。虽有迎春、惜春二人，偏又素日不大甚合，所以只剩湘云一人宽慰他。因说：“你是个明白人，还不自己保养。可恨宝姐姐、琴妹妹天天说亲道热，早已说今年中秋要大家一处赏月，必要起诗社，大家联句。到今日，便扔下咱们自己赏月去…","so":0,"eo":0}]},{"chap":77,"ctitle":"第77章 俏丫鬟抱屈夭风流 美优怜斩情归水月","deeds":[{"surface":"贾母","text":"话说王夫人见中秋已过，凤姐病也比先减了，虽未大愈，然亦可以出入行走得了，仍命大夫每日诊脉服药。又开了丸药方来，配“调经养荣丸”。因用上等人参二两，王夫人取时，翻寻了半日，只向小匣内寻了几枝簪挺粗细的。王夫人看了嫌不好，命再找去，又找了一大包须沫出来。王夫人焦躁道：“用不着偏有，但用着了，再找不着！成日家我叫你们查一查，都归拢一处，你们白不听，就随手混撂。”彩云道：“想是没了，就只有这个。上次那边的太太来寻了去了。”王夫人道：“没有的话。…","so":0,"eo":0},{"surface":"贾母","text":"袭人细揣，此话只是宝玉有疑他之意，竟不好再劝，因叹道：“天知道罢了。此时也查不出人来了。白哭一会子，也无益了。”宝玉冷笑道：“原是想他自幼娇生惯养的，何尝受过一日委屈？如今是一盆才透出嫩箭的兰花送到猪圈里去一般。况又是一身重病，里头一肚子闷气。他又没有亲爹热娘，只有一个醉泥鳅姑舅哥哥，他这一去，那里还等得一月半月？再不能见一面两面的了！”说着，越发心痛起来。袭人笑道：“可是你‘只许州官放火，不许百姓点灯’。我们偶说一句妨碍的话，你就说不…","so":0,"eo":0},{"surf
