湘云的多，都笑道：“这都是那块鹿肉的功劳。”李纨笑道：“逐句评去，却还一气，只是宝玉又落了第了。”宝玉笑道：“我原不会联句，只好担待我罢。”李纨笑道：“也没有社社担待的：又说‘韵险’了，又整误了，又‘不会联句’，今日必罚你。我才看见栊翠庵的红梅有趣，我要折一技插在瓶。可厌妙玉为人，我不理他，如今罚你取一技来插着玩儿。”众人都道：“这罚的又雅又有趣…","so":0,"eo":0},{"surface":"宝玉","text":"李纨命人好好跟着，黛玉忙拦说：“不必，有了反不得了。”李纨点头道是，一面命丫鬟将一个美女耸肩瓶拿来，贮了水准备插梅。因又笑道：“回来该吟红梅了。”湘云忙道：“我先作一首。”宝钗笑道：“今日断不容你再作了，你都抢了去，别人都闲着也没趣。回来罚宝玉。他说不会联句，如今就叫他自己做去。”黛玉笑道：“这话很是。我还有主意，方才联句不够，莫若拣那联得少的人作红梅诗。”宝钗笑道：“这话极是。方才邢、李三位屈才，且又是客，琴儿和颦儿云儿抢了他们许多。…","so":0,"eo":0},{"surface":"宝玉","text":"众人看了，都笑着称赞了一回，又指末一首更好。宝玉见宝琴年纪最小，才又敏捷；黛玉、湘云二个斟了一小杯酒，都贺宝琴。宝钗笑道：“三首各有好处。你们两个天天捉弄厌了我，如今又捉弄他来了。”","so":0,"eo":0},{"surface":"宝玉","text":"李纨又问宝玉：“你可有了？”宝玉忙道：“我倒有了，才一看见这三首，又唬忘了。等我再想。”湘云听了，便拿了一支铜火箸击着手炉，笑道：“我击了，若鼓绝不成，又要罚的。”宝玉笑道：“我已有了。”黛玉提起笔来，笑道：“你念我写。”湘云便击了一下，笑道：“一鼓绝。”宝玉笑道：“有了，你写罢。”众人听他念道：","so":0,"eo":0},{"surface":"宝玉","text":"黛玉写了，摇头笑道：“起的平平。”湘云又道：“快着。”宝玉笑道：","so":0,"eo":0},{"surface":"宝玉","text":"黛玉、湘云都点头笑道：“有些意思了。”宝玉又道：","so":0,"eo":0}]},{"chap":51,"ctitle":"第51章 薛小妹新编怀古诗 胡庸医乱用虎狼药","deeds":[{"surface":"宝玉","text":"这里凤姐又将怡红院的嬷嬷唤了两上来，吩咐道：“袭人只怕不来家了。你们素日知道那个大丫头知好歹，派出来在宝玉屋里上夜。你们也好生照管着，别由着宝玉胡闹。”两个嬷嬷答应着去了，一时来回说：“派了晴雯和麝月在屋里，我们四个人原是轮流着带管上夜的。”凤姐听了点头，又说道：“晚上催他早睡，早上催他早起。”嬷嬷们答应了，自回园去。一时果有周瑞家的带了信回凤姐说：“袭人之母业已停床，不能回来。”凤姐回明了王夫人，一面着人往大观园去取他的铺盖妆奁。宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"送去之后，晴雯、麝月皆卸罢残妆，脱换过裙袄。睛雯只在熏笼上围坐，麝月笑道：“你今儿别装小姐了，我劝你也动一动儿。”晴雯道：“等你们都去净了，我再动不迟。有你们一日，我且受用一日。”麝月笑道：“好姐姐，我铺床，你把那穿衣镜的套子放下来，上头的划子划上。你的身量比我高些。”说着，便去给宝玉铺床。晴雯了一声，笑道：“人家才坐暖和了，你就来闹。”此时宝玉正坐着纳闷，想袭人之母不知是死是活，忽听见睛雯如此说，便自己起身出去，放下镜套，划上消息。进…","so":0,"eo":0},{"surface":"宝玉","text":"至三更以后，宝玉睡梦之中，便叫袭人。叫了两声，无人答应，自己醒了，方想起袭人不在家，自己也好笑起来。睛雯已醒，因唤麝月道：“连我都醒了，他守在旁边还不知道，真是挺死尸呢！”麝月翻身打个哈什，笑道：“他叫袭人，与我什么相干！”因问：“做什么？”宝玉说要吃茶。麝月忙起来，单穿着红绸小绵袄儿。宝玉道：“披了我的皮袄再去，仔细冷着。”麝月听说，回手便把宝玉披着起来的一件貉颏满襟暖袄披上，下去向盆内洗洗手，先倒了一钟温水，拿了大漱盂，宝玉漱了口。…","so":0,"eo":0},{"surface":"宝玉","text":"麝月笑道：“越发上脸儿了！”睛雯道：“好妹妹，明儿晚上你别动，我伏侍你一夜，如何？”麝月听说，只得也伏侍他漱了口，倒了半碗茶给他吃了。麝月笑道：“你们两个别睡，说着话儿，我出去走走回来。”晴雯笑道：“外头有个鬼等着呢。”宝玉道：“外头自然有大月亮的。我们说着话，你只管去。”一面说，一面便嗽了两声。麝月便开了后房门，揭起毡帘一看果然好月色。晴雯等他出去，便欲唬他玩耍，仗着素日比别人气壮，不畏寒冷，也不披衣，只穿着小袄便蹑手蹑脚的下了熏笼，…","so":0,"eo":0},{"surface":"宝玉","text":"晴雯忙回身进来，笑道：“那里就唬死了他了？偏惯会这么蝎蝎螫螫老婆子的样儿。”宝玉笑道：“倒不是怕唬坏了他。头一件你冻着也不好，二则他不防，不免一喊，倘或惊醒了别人，不说咱们是玩意儿，倒反说袭人才去了一夜，你们就见神见鬼的。你来把我这边的被掖掖罢。”睛雯听说，就上来掖了一掖，伸手进去就渥一渥。宝玉笑道：“好冷手，我说看冻着。”一面又见晴雯两腮如胭脂一般，用手摸一摸，也觉冰冷。宝玉道：“快进被来渥渥罢。”一语未了，只听咯噔的一声门响，麝月慌…","so":0,"eo":0},{"surface":"宝玉","text":"晴雯因方才一冷，如今又一暖，不觉打了两个嚏喷。宝玉叹道：“如何？到底伤了风了。”麝月笑道：“他早起就嚷不受用，一日也没吃碗正经饭。他这会子不说保养着些，还要捉弄人，明儿病了，叫他自作自受。”宝玉问道：“头上热不热？”晴雯嗽了两声，说道：“不相干，那里这么娇嫩起来了。”说着，只听外间屋里上的自鸣钟“当当”的两声，外间值宿的老嬷嬷嗽了两声，因说道：“姑娘们睡罢，明儿再说笑罢。”宝玉方悄悄的笑道：“咱们别说话了，看又惹他们说话。”说着，方大家…","so":0,"eo":0},{"surface":"宝玉","text":"至次日起来，睛雯果觉有些鼻塞重，懒怠动弹。宝玉道：“快别声张．太太知道了，又要叫你搬回家去养着。家里纵好，到底冷些，不如在这里。你就在里间屋里躺着，我叫人请了大夫，悄悄从后门进来瞧瞧就是了。”晴雯道：“虽这么说，你到底要告诉大奶奶一声儿。不然一时大夫来了，人问起来怎么说呢？”宝玉听了有理，便唤一个老嬷嬷来吩咐道：“你回大奶奶去，就说晴雯白冷着了些，不是什么大病。袭人又不在家，他若家去养病，这里更没有人了。传一个大夫，从后门悄悄的进来瞧瞧…","so":0,"eo":0},{"surface":"宝玉","text":"正说时，人回大夫来了。宝玉便走过来，避在书架后面。只见两三个后门口的老婆子带了一个太医进来。这里的丫头都回避了，有三四个老嬷嬷放下暖阁上的大红绣幔，晴雯从幔中单伸出手来。那大夫见这只手上有两根指甲，足有二三寸长，尚有金凤仙花染的通红的痕迹，便回过头来。有一个老嬷嬷忙拿了一块绢子掩上了。那大夫方诊了一回脉，起身到外间，向嬷嬷们说道：“小姐的症是外感内滞。近日时气不好，竟算是个小伤寒。幸亏是小姐素日饮食有限，风寒也不大，不过是气血原弱，偶然…","so":0,"eo":0}]},{"chap":52,"ctitle":"第52章 俏平儿情掩虾须镯 勇晴雯病补孔雀裘","deeds":[{"surface":"宝玉","text":"话说贾母道：“正是这个了。上次我要说这话，我见你们大事多，如今又添出些事来，你们固然不敢抱怨，未免想着我只顾疼这些小孙子、孙女儿们，就不体贴你们这当家人了。你既这么说出来，便好了。”因此时薛姨妈、李婶娘都在座，邢夫人及尤氏等也都过来请安，还未过去，贾母因向王夫人等说道：“今日我才说这话，素日我不说。一则怕逞了凤丫头的脸，二则众人不服。今日你们都在这里，都是经过妯娌姑嫂的，还有他这么想得到的没有？”薛姨妈、李婶娘、尤氏齐笑道：“真个少有，…","so":0,"eo":0},{"surface":"宝玉","text":"说着，果从后门出去，至窗下潜听。麝月悄悄问道：“你怎么就得了的？”平儿道：“那日彼时洗手时不见了，二奶奶就不许吵嚷，出了园子，即刻就传给园里各处的妈妈们，小心访查。我们只疑惑邢姑娘的丫头，本来又穷，只怕小孩子家没见过，拿起来是有的，再不料定是你们这里的。幸而二奶奶没有在屋里，你们这里的宋妈去了，拿着这支镯子，说是小丫头坠儿偷起来的，被他看见，来回二奶奶的。我赶忙接了镯子，想了一想：宝玉是偏在你们身上留心用意、争胜要强的，那一年有个良儿偷…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，又喜又气又叹。喜的是平儿竟能体贴自己的心，气的是坠儿小窃，叹的是坠儿那样伶俐，做出这丑事来。因而回至房中，把平儿之话一长一短告诉了睛雯，又说：“他说你是个要强的，如今病了，听了这话，越发要添病的，等好了再告诉你。”晴雯听了，果然气的蛾眉倒蹙，凤眼园睁，即时就叫坠儿。宝玉忙劝道：“这一喊出来，岂不辜负了平儿待你我的心呢？不如领他这个情，过后打发他出去就完了。”晴雯道：“虽如此说，只是这气如何忍得住！”宝玉道：“这有什么气的，你只…","so":0,"eo":0},{"surface":"宝玉","text":"睛雯服了药，至晚间又服了二和，夜间虽有些汗，还未见效，仍是发烧头疼鼻塞声重。次日，王太医又来诊视，另加减汤剂。虽然稍减了烧，仍是头疼。宝玉便命麝月取鼻烟来：“给他闻些，痛打几个嚏喷就通快了。”麝月果真去取了一个金镶双金星玻璃小扁盒儿来递给宝玉。宝玉便揭开盒盖，里面是个西洋珐琅的黄发赤身女子，两肋又有肉翅，里面盛着些真正上等洋烟。睛雯只顾看画儿，宝玉道：“闻些，走了气就不好了。”睛雯听说，忙用指甲挑了些抽入鼻中。不见怎么，便又多多挑了些抽…","so":0,"eo":0},{"surface":"宝玉","text":"刚到院门外边，忽见宝琴小丫头名小螺的从那边过去。宝玉忙赶上问：“那里去？”小螺笑道：“我们二位姑娘都在林姑娘屋里呢，我如今也往那里去。”宝玉听了，转步也便和他往潇湘馆来。不但宝钗姐妹在此，且连岫烟也在那里。四人团坐在熏笼上叙家常。紫鹃倒坐在暖阁里，临窗户做针线。一见他来，都笑说：“又来了一个！没了你的坐处了。”宝玉笑道：“好一幅‘冬闺集艳图’，可惜我迟来了。横竖这屋子比各屋子暖，这椅子坐着并不冷。”说着，便坐在黛玉常坐的地方，上搭着灰鼠…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉笑道：“咱们明儿下一社又有了题目了，就咏水仙、腊梅。”黛玉听了，笑道：“罢，罢！再不敢做诗了。做一回，罚一回，没的怪羞的。”说着，便两手握起脸来。宝玉笑道：“何苦来，又打起我做什么，我还不怕臊呢，你倒握起脸来了。”宝钗因笑道：“下次我邀一社，四个诗题，四个词题。每人四首诗，四首词。头一个诗题《咏太极图》，限‘一先’的韵，五言排律；要把‘一先’的韵都用尽了，一个不许剩。”宝琴笑道：“这一说，可知是姐姐不是真心起社了，这分明是难人。要论…","so":0,"eo":0},{"surface":"宝玉","text":"众人听了，都道：“难为他，竟比我们中国人还强。”一语未了，只见麝月走来，说：“太太打发了人来告诉二爷，明儿一早往舅舅那里去，就说太太身上不大好，不得亲身来。”宝玉忙站起来答应道：“是。”因问宝钗宝琴：“你们二位可去？”宝钗道：“我们不去。昨儿单送了礼去了。”大家说了一回方散。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉因让诸姐妹先行，自己在后面。黛玉便又叫住他，问道：“袭人到底多早晚回来？”宝玉道：“自然等送了殡才来呢。”黛玉还有话说，又不能出口，出了一回神，便说道：“你去罢。”宝玉也觉心里有许多话，只是口里不知要说什么，想了一想，也笑道：“明儿再说罢。”一面下台阶，低头正欲迈步，复又忙回身问道：“如今夜越发长了，你一夜咳嗽几次？醒几遍？”黛玉道：“昨儿夜里好了，只咳嗽两遍，却只睡了四更一个更次，就再不能睡了。”宝玉又笑道：“正是有句要紧的话，这…","so":0,"eo":0}]},{"chap":53,"ctitle":"第53章 宁国府除夕祭宗祠 荣国府元宵开夜宴","deeds":[{"surface":"宝玉","text":"话说宝玉见晴雯将雀裘补完，已使得力尽神危，忙命小丫头子来替他捶着，彼此捶打了一会。歇下没一顿饭的工夫，天已大亮，且不出门，只叫快请大夫。一时王大夫来了，诊了脉，疑惑说道：“昨日已好了些，今日如何反虚浮微缩起来？敢是吃多了饮食？不然就是劳了神思。外感却倒轻了，这汗后失调养，非同小可。”一面说，一面出去开了药方进来。宝玉看时，已将疏散驱邪诸药减去，倒添茯苓、地黄、当归等益神养血之剂。宝玉一面忙命人煎去，一面叹说：“这怎么处？倘或各个好歹，都…","so":0,"eo":0},{"surface":"宝玉","text":"袭人送母殡后，业已回来，麝月便将坠儿一事，并“睛雯撵逐出去，也曾回过宝玉”等语，一一的告诉袭人。袭人也没说别的，只说：“太性急了。”","so":0,"eo":0},{"surface":"宝玉","text":"只因李纨亦因时气感冒；邢夫人正害火眼，迎春、岫烟皆过去朝夕侍药；李婶之弟又接了李婶娘、李纹、李绮家去住几天。宝玉又见袭人常常思母含悲，晴雯又未大愈，因此诗社一事，皆未有人作兴，便空了几社。","so":0,"eo":0},{"surface":"宝玉","text":"只见贾府人分了昭穆，排班立定。贾敬主祭，贾赦陪祭，贾珍献爵，贾琏贾琮献帛，宝玉捧香，贾菖、贾菱展拜垫、守焚池。青衣乐奏，三献爵，兴拜毕，焚帛，奠酒。礼毕，乐止，退出。众人围随贾母至正堂上，影前锦帐高挂，彩屏张护，香烛辉煌，上面正居中悬着荣、宁二祖遗像，皆是披蟒腰玉，两边还有几轴列祖遗像。贾荇、贾芷等从内仪门挨次站列，直到正堂廊下，槛外方是贾敬、贾赦，槛内是各女眷。众家人小厮皆在仪门之外。每一道菜至，传至仪门，贾荇、贾芷等便接了，按次传至…","so":0,"eo":0},{"surface":"宝玉","text":"至次日五鼓，贾母等人按品上妆，摆全副执事进宫朝贺，兼祝元春千秋。领宴回来，又至宁府祭过列祖，方回来。受礼毕，便换衣歇息。所有贺节来的亲友，一概不会，只和薛姨妈、李婶娘二人说话随便，或和宝玉、宝钗等姐妹赶围棋摸牌作戏。王夫人和凤姐天天忙着请人吃年酒，那边厅上和院内皆是戏酒，亲友络绎不绝。","so":0,"eo":0},{"surface":"宝玉","text":"这里贾母花厅上摆了十来席酒，每席旁边设一几，几上设炉瓶三事，焚着御赐百合宫香；又有八寸来长、四五寸宽、二三寸高、点缀着山石的小盆景，俱是新鲜花卉。又有小洋漆茶盘放着旧窑十锦小茶杯，又有紫檀雕嵌的大纱透绣花草诗字的缨络。各色旧窑小瓶中，都点缀着“岁寒三友”、“玉堂富贵”等鲜花。上面两席是李婶娘薛姨妈坐，东边单设一席，乃是雕夔龙护屏矮足短榻，靠背、引枕、皮褥俱全。榻上设一个轻巧洋漆描金小几，几上放着茶碗、漱盂、洋巾之类，又有一个眼镜匣子。贾…","so":0,"eo":0}]},{"chap":54,"ctitle":"第54章 史太君破陈腐旧套 王熙凤效戏彩斑衣","deeds":[{"surface":"宝玉","text":"却说贾珍、贾琏暗暗预备下大笸箩的钱，听见贾母说赏，忙命小厮们快撒钱，只听满台钱响，贾母大悦。二人遂起身，小厮们将一把新暖银壶捧来，递与贾琏手内，随了贾珍趋至里面。贾珍先到李婶娘席上，躬身取下杯来，回身，贾琏忙斟了一盏，然后便至薛姨妈席上也斟了。二人忙起来笑说：“二位爷请坐着罢了，何必多礼。”于是除邢、王二夫人，满席都离了席，也俱垂手旁站。贾珍等至贾母榻前，因榻矮，二人便屈膝跪了，贾珍在前捧杯，贾琏在后捧壶。虽只二人捧酒，那贾琮弟兄等却都…","so":0,"eo":0},{"surface":"宝玉","text":"当下天有二鼓，戏演的是《白义·观灯》八出，正在热闹之际。宝玉因下席往外走。贾母问：“往那里去？外头炮仗利害，留神天上吊下火纸来烧着。”宝玉笑回说：“不往远去，只出去就来。”贾母命婆子们：“好生跟着。”于是宝玉出来，只有麝月、秋纹几个小丫头随着。贾母因说：“袭人怎么不见？他如今也有些拿大了，单支使小女孩儿出来。”王夫人忙起身笑说道：“他妈前日没了，因有热孝，不便前头来。”贾母点头，又笑道：“跟主子，却讲不起这孝与不孝。要是他还跟我，难道这…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉一径来至园中，众婆子见他回房，便不跟去，只坐在园门里茶房里烤火，和管茶的女人偷空饮酒斗牌。宝玉至院中，虽是灯火灿烂，却无人声。麝月道：“他们都睡了不成？咱们悄悄进去吓他们一跳。”于是大家蹑手蹑脚，潜踪进镜壁去一看，只见袭人和一个人对歪在地炕上，那一头有两个老嬷嬷打吨。宝玉只当地两个睡着了，才要进去，忽听鸳鸯嗽了一声，说道：“天下事可知难定。论理你单身在这里，父母在外头，每年他们东去西来，没个定准，想来你是再不能送终的了，偏生今年…","so":0,"eo":0},{"surface":"宝玉","text":"这里宝玉刚过来，只见两个媳妇迎面来了，又问：“是谁？”秋纹道：“宝玉在这里呢，大呼小叫，留神吓着罢！”那媳妇们忙笑道：“我们不知，大节下来惹祸了。姑娘们可连日辛苦了！”说着，已到跟前。麝月等问：“手里拿着什么？”媳妇道：“是老太太赏金、花二位姑娘吃的。”秋纹笑道：“外头唱的是《八义》。没唱《混元盒》，那里又跑出‘金花娘娘’来了？”宝玉命：“揭起来我瞧瞧。”秋纹、麝月忙上去将两个盒子揭开，两个媳妇忙蹲下身子。宝玉看了两个盒内都是席上所有的…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉便要了一壶暖酒，也从李婶娘斟起。他二人也笑让坐。贾母便说：“他小人家儿，让他斟去。大家倒要干过这杯。”说着，便自己干了。邢、王二夫人也忙干了，薛姨娘、李婶娘也只得于了。贾母又命宝玉道：“你连姐姐妹妹的一齐斟上，不许乱斟，都要叫他干了。”宝玉听说，答应着，一一按次斟上了。至黛玉前，偏他不饮，拿起杯来，放在宝玉唇边。宝玉一气饮干，黛玉笑说：“多谢。”宝玉替他斟上一杯。风姐儿便笑道：“宝玉别喝冷酒。仔细手颤，明儿写不的字、拉不的弓。”宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"”凤姐儿笑道：“外头只有一位珍大哥哥，我们还是论哥哥妹妹，从小儿一处淘气淘了这么大。这几年因做了亲，我如今立了多少规矩了！便不是从小儿兄妹，只论大伯子小婶儿，那二十四孝上‘斑衣戏彩’，他们不能来戏彩引老祖宗笑一笑，我这里好容易引的老祖宗笑一笑，多吃了一点东西，大家喜欢，都该谢我才是，难道反笑我不成？”贾母笑道：“可是这两日我竟没有痛痛的笑一场，倒是亏他才一路说，笑的我这里痛快了些。我再吃钟酒。”吃着酒，又命宝玉：“来敬你姐姐一杯。”凤姐…","so":0,"eo":0},{"surface":"宝玉","text":"女先儿回说：“老祖宗不听这书，或者弹一套曲子听听罢。”贾母道：“你们两个对一套《将军令》罢。”二人听说，忙合弦按调拨弄起来。贾母因问：“天有几更了？”众婆子忙回：“三更了。”贾母道：“怪道寒浸浸的起来。”早有众丫鬟拿了添换的衣裳送来。王夫人起身陪笑说道：“老太太不如挪进暖阁里地炕上，倒也罢了。这二位亲戚也不是外人，我们陪着就是了。”贾母听说，笑道：“既这样说，不如大家都挪进去，岂不暖和？”王夫人道：“恐里头坐不下。”贾母道：“我有道理：…","so":0,"eo":0},{"surface":"宝玉","text":"凤姐儿笑道：“外头已经四更多了，依我说：老祖宗也乏了，咱们也该‘聋子放炮仗——散了’罢？”尤氏等用绢子握着嘴，笑的前仰后合，指他说道：“这个东西真会数贫嘴！”贾母笑道：“真真这凤丫头，越发炼贫了！”一面说，一面吩咐道：“他提起炮仗来，咱们也把烟火放了，解解酒。”贾蓉听了，忙出去带着小厮们就在院子里安下屏架，将烟火设吊齐备。这烟火俱系各处进贡之物，虽不甚大，却极精致，各色故事俱全，夹着各色的花炮。黛玉禀气虚弱，不禁劈拍之声，贾母便搂他在怀…","so":0,"eo":0}]},{"chap":55,"ctitle":"第55章 辱亲女愚妾争闲气 欺幼主刁奴蓄险心","deeds":[{"surface":"宝玉","text":"探春笑道：“我一肚子气，正要拿他奶奶出气去，偏他碰了来，说了这些话，叫我也没了主意了。”一面说，一面叫进方才那媳妇来问：“环爷和兰哥家学里这一年的银子，是做那一项用的？”那媳妇便回说；“一年学里吃点心或者买纸笔，每位有八两银子的使用。”探春道：“凡爷们的使用，都是各屋里月钱之内。环哥的是姨娘领二两；宝玉的，老太太屋里袭人领二两；兰哥儿是大奶奶屋里领。怎么学里每人多这八两？原来上学去的是为这八两银子！从今日起，把这一项蠲了。平儿回去，告诉…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，只见秋纹走来，众媳妇们忙赶着问好，又说：“姑娘也且歇歇，里头摆饭呢。等撤下桌子来，再回话去罢。”秋纹笑道：“我比不得你们，我那里等得？”说着，便直要上厅去。平儿忙叫：“快回来！”秋纹回头，见了平儿，笑道：“你又在这里充什么‘外围子的防护’？”一面回身便坐在平儿褥上。平儿悄问：“回什么？”秋纹道：“问一问宝玉的月钱、我们的月钱，多早晚才领？”平儿道：“这什么大事！你快回去告诉袭人，说我的话，凭有什么事，今日都别回。若回一件管驳一件…","so":0,"eo":0},{"surface":"宝玉","text":"探春气方渐平，因向平儿道：“我有一件大事，早要和你奶奶商议，如今可巧想起来。你吃了饭快来。宝姑娘也在这里，咱们四个人商议了，再细细的问你奶奶可行可止。”平儿答应回去。凤姐因问：“为何去这半日？”平儿便笑着将方才原故细细说与他听了。凤姐儿笑道：“好，好，好！好个三姑娘，我说不错，只可惜他命薄，没托生在太太肚里。”平儿笑道：“奶奶也说糊涂话了。他就不是太太养的，难道谁敢小看他，不和别的一样看待么？”凤姐叹道：“你那里知道？虽然正出庶出是一样…","so":0,"eo":0}]},{"chap":56,"ctitle":"第56章 敏探春兴利除宿弊 贤宝钗小惠全大体","deeds":[{"surface":"宝玉","text":"一语未了，果然人回：“甄府四个女人来请安。”贾母听了，忙命人带进来。那四个人都是四十往上年纪，穿带之物皆比主子不大差别。请安问好毕，贾母便命拿了四个脚踏来。他四人谢了坐，等着宝钗等坐了，方都坐下。贾母便问：“多早晚进京的？”四人忙起身回说：“昨儿进的京，今儿太太带了姑娘进宫请安去了，所以叫女人们来请安，问候姑娘们。”贾母笑问道：“这些年没进京，也不想到就来。”四人也都笑回道：“正是。今年是奉旨唤进京的。”贾母问道：“家眷都来了？”四人回…","so":0,"eo":0},{"surface":"宝玉","text":"众媳妇听了，忙去了半刻，围了宝玉进来。四人一见，忙起身笑道：“唬了我们一跳！要是我们不进府来，倘若别处遇见，还只当我们的宝玉后赶着也进了京呢。”一面说，一面都上来拉他的手，问长问短。宝玉也笑问个好。贾母笑道：“比你们的长的如何？”李纨等笑道：“四位妈妈才一说，可知是模样儿相仿了。”贾母笑道：“那有这样巧事。大家子孩子们，再养的娇嫩，除了脸上有残疾十分丑的，大概看去都是一样齐整，这也没有什么怪处。”四人笑道：“如今看来，模样是一样！据老太…","so":0,"eo":0},{"surface":"宝玉","text":"这里贾母喜得逢人便告诉：也有一个宝玉，也都一般行景。众人都想着天下的世宦人家，同名的这也很多，祖母溺爱孙子也是常事，不是什么罕事，皆不介意。独宝玉是个迂阔呆公子的心性，自为是那四人承悦贾母之词。后至园中去看湘云病去，湘云因说他：“你放心闹罢，先还‘单丝不成线，独树不成林’，如今有了个对子了。闹利害了，再打急了，你好逃到南京找那个去。”宝玉道：“那里的谎话，你也信了？偏又有个宝玉了？”湘云道：“怎么列国有个蔺相如，汉朝又有个司马相如呢？”…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉心中便又疑惑起来：若说必无，也似必有，若说必有，又并无目睹。心中闷闷，回至房中榻上，默默盘算，不觉昏昏睡去，竟到一座花园之内。宝玉诧异道：“除了我们大观园，竟又有这一个园子？”正疑惑间，忽然那边来了几个女孩儿，都是丫鬟，宝玉又诧异道：“除了鸳鸯、袭人、平儿之外，也竟还有这一干人？”只见那些丫鬟笑道：“宝玉怎么跑到这里来？”宝玉只当是说他，忙来陪笑说道：“因我偶步到此，不知是那位世交的花园？姐姐们带我逛逛。”众丫鬟都笑道：”原来不是咱…","so":0,"eo":0},{"surface":"宝玉","text":"一面想，一面顺步早到了一所院内。宝玉诧异道：“除了怡红院，也竟还有这么一个院落？”忽上了台阶，进入屋内，只见榻上有一个人卧着，那边有几个女儿做针线，或有嬉笑玩耍的。只见榻上那个少年叹了一声，一个丫鬟笑问道：“宝玉，你不睡，又叹什么？想必为你妹妹病了，你又胡愁乱恨呢。”宝玉听说，心下也便吃惊，只见榻上少年说道：“我听见老太太说，长安都中也有个宝玉，和我一样的性情，我只不信。我才做了一个梦，竟梦中到了都中一个大花园子里头，遇见几个姐姐，都叫…","so":0,"eo":0},{"surface":"宝玉","text":"袭人在旁听他梦中自唤，忙推醒他，笑问道：“宝玉在那里？”此时宝玉虽醒，神意尚自恍惚，因向门外指说：“才去不远。”袭人笑道：“那是你梦迷了。你揉眼细瞧，是镜子里照的你的影儿。”宝玉向前瞧了一瞧，原是那嵌的大镜对面相照，自己也笑了。早有丫鬟捧过漱盂茶卤来漱了口。麝月道：“怪道老太太常嘱咐说：‘小人儿屋里不可多有镜子，人小魂不全，有镜子照多了，睡觉惊恐做胡梦。’如今倒在大镜子那里安了一张床！有时放下镜套还好，往前去天热困倦，那里想的到放他？比…","so":0,"eo":0}]},{"chap":57,"ctitle":"第57章 慧紫鹃情辞试莽玉 慈姨妈爱语慰痴颦","deeds":[{"surface":"宝玉","text":"话说宝玉听王夫人唤他，忙至前边来，原来是王夫人要带他拜甄夫人去。宝玉自是欢喜，忙去换衣服，跟了王夫人到那里。见甄家的形景，自与荣宁不甚差别，或有一二稍盛的。细问，果有一宝玉。甄夫人留席，竟日方回。宝玉方信。因晚间回家来，王夫人又吩咐预备上等的席面，定名班大戏，请过甄夫人母女。后二日，他母女便不作辞，回任去了，无话。","so":0,"eo":0},{"surface":"宝玉","text":"这日宝玉因见湘云渐愈，然后去看黛玉。正值黛玉才歇午觉，宝玉不敢惊动，因紫鹃正在回廊上手里做针线，便上来问他：“昨天夜里咳嗽的可好些？”紫鹃道：“好些了。”宝玉笑道：“阿弥陀佛！宁可好了罢。”紫鹃笑道：“你也念起佛来，真是新闻。”宝玉笑道：“所谓‘病急乱投医’了。”一面说，一面见他穿着弹墨绫薄绵袄，外面只穿着青缎夹背心，宝玉便伸手向他身上抹了一抹，说道：“穿这样单薄，还在风口里坐着，时气又不好，你再病了，越发难了。”紫鹃便说道：“从此咱们…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉见了这般景况，心中象浇了一盆冷水一般，只瞅着竹子发了一回呆。因祝妈正在那里刨土种竹，扫竹叶子。顿觉一时魂魄失守，随便坐在一块山石上出神，不觉滴下泪来。直呆了一顿饭的工夫，千思万想，总不知如何是可。偶值雪雁从王夫人屋里取了人参来，从此经过，忽扭头看见桃花树下石上一人，手托着腮颊，正出神呢：不是别人，却是宝玉。雪雁疑惑道：“怪冷的，他一个人在这里做什么？春天凡有残疾的人肯犯病，敢是他也犯了呆病了？”一边想，一边就走过来，蹲着笑道：“你在…","so":0,"eo":0},{"surface":"宝玉","text":"雪雁听了，只当是他又受了黛玉的委屈，只得回至屋里。黛玉未醒，将人参交给紫鹃。紫鹃因问他：“太太做什么呢？”雪雁道：“也睡中觉呢，所以等了这半天。姐姐，你听笑话儿。我因等太太的工夫，和玉钏儿姐姐坐在下屋里说话儿，谁知赵姨奶奶招手儿叫我。我只当有什么话说，原来他和太太告了假，出去给他兄弟伴宿坐夜，明儿送殡去。跟他的小丫头子小吉祥儿没衣裳，要借我的月白绫子袄儿。我想他们一般也有两件子的，往这地方去，恐怕弄坏了，自己的舍不得穿，故此借别人的穿。…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃听了，忙放下针，又嘱咐雪雁：“好生听叫。要问我，答应我就来。”说着，便出了潇湘馆，一径来寻宝玉。走至宝玉跟前，含笑说道：“我不过说了那么句话，为的是大家好。你就一气跑了这风地里来哭，弄出病来还了得！”宝玉忙笑道：“谁赌气了！我因为听你说的有理，我想你们既这样说，自然别人也是这样说，将来渐渐的都不理我了。我所以想到这里，自己伤起心来了。”紫鹃也便挨他坐着。宝玉笑道：“方才对面说话，你还走开，这会子怎么又来挨着我坐？”紫鹃道：“你都忘了…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，吃了一惊，忙问：“谁家去？”紫鹃道：“妹妹回苏州去。”宝玉笑道：“你又说白话。苏州虽是原籍，因没了姑母，无人照看才接了来的。明年回去找谁？可见撒谎了。”紫鹃冷笑道：“你太看小了人。你们贾家独是大族，人口多的，除了你家，别人只得一父一母，房族中真个再无人了不成？我们姑娘来时，原是老太太心疼他年小，虽有叔伯，不如亲父母，故此接来往几年。大了该出阁时，自然要送还林家的，终不成林家女儿在你贾家一世不成？林家虽贫到没饭吃，也是世代书香人…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，便如头顶上响了一个焦雷一般。紫鹃看他怎么回答，等了半天，见他只不作声。才要再问，只见晴雯找来说：“老太太叫你呢。谁知在这里。”紫鹃笑道：“他这里问姑娘的病症，我告诉了他半天，他只不信，你倒拉他去罢。”说着，自己便走回房去了。晴雯见他呆呆的，一头热汗，满腔紫胀，忙拉他的手一直到怡红院中。袭人见了这般，慌起来了，只说时气所感，热身被风扑了。无奈宝玉发热事犹小可，更觉两个眼珠儿直直的起来，口角边津液流出，皆不知觉。给他个枕头，他便睡…","so":0,"eo":0},{"surface":"宝玉","text":"袭人因他年老多知，所以请他来看，如今见他这般一说，都信以为实，也哭起来了。晴雯便告诉袭人方才如此这般。袭人听了，便忙到潇湘馆来，见紫鹃正伏侍黛玉吃药，也顾不得什么，便走上来问紫鹃道：“你才和我们宝玉说了些什么话？你瞧瞧他去！你回老太太去，我也不管了！”说着，便坐在椅上。黛玉忽见袭人满面急怒，又有泪痕，举止大变，更不免也着了忙，因问怎么了。袭人定了一回，哭道：“不知紫鹃姑奶奶说了些什么话，那个呆子眼也直了，手脚也冷了，话也不说了，李妈妈掐…","so":0,"eo":0}]},{"chap":58,"ctitle":"第58章 杏子阴假凤泣虚凰 茜纱窗真情揆痴理","deeds":[{"surface":"宝玉","text":"又见各官宦家凡养优伶男女者，一概蠲免遣发，尤氏等便议定，待王夫人回家回明，也欲遣发十二个女孩子，又说：“这些人原是买的，如今虽不学唱，尽可留着使唤，只令其教习们自去也罢了。”王夫人因说：“这学戏的倒比不得使唤的，他们也是好人家的女儿，因无能，卖了做这事，装丑弄鬼的几年。如今有这机会，不如给他们几两银子盘费，各自去罢。当日祖宗手里都是有这例的。咱们如今损阴坏德，而且还小器。如今虽有几个老的还在，那是他们各有原故不肯回去的，所以才留下使唤，…","so":0,"eo":0},{"surface":"宝玉","text":"可巧这日乃是清明之日，贾琏已备下年例祭祀，带领贾环、贾琮、贾兰三人去往铁槛寺祭柩烧纸，宁府贾蓉也同族中人各办祭祀前往。因宝玉病未大愈，故不曾去得。饭后发倦，袭人因说：“天气甚好，你且出去逛逛，省的撂下粥碗就睡，存在心里。”宝玉听说，只得拄了一支杖，着鞋走出院来。因近日将园中分与众婆子料理，各司各业，皆在忙时。也有修竹的，也有树的，也有栽花的，也有种豆的，池中间又有驾娘们行着船夹泥的，种藕的。湘云、香菱、宝琴与些丫鬟等都坐在山石上瞧他们取…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉也正要去瞧黛玉，起身拄拐，辞了他们，从沁芳桥一带堤上走来。只见柳垂金线，桃吐丹霞，山石之后一株大杏树，花已全落，叶稠阴翠，上面巳结了豆子大小的许多小杏。宝玉因想道：“能病了几天，竟把杏花辜负了，不觉到‘绿叶成阴于满枝’了。”因此仰望杏子不舍。又想起邢岫烟已择了夫婿一事，虽说男女大事不可不行，但未免又少了一个好女儿，不过二年，便也要“绿叶成阴子满枝”了。再过几日，这杏树子落枝空；再几年，岫烟也不免乌发如银，红颜似缟。因此，不免伤心，只…","so":0,"eo":0},{"surface":"宝玉","text":"正自胡思间，忽见一股火花从山石那边发出，将雀儿惊飞。宝玉吃了一惊，又听外边有人喊道：“藕官你要死！怎么弄些纸钱进来烧？我回奶奶们去，仔细你的肉！”宝玉听了，益发疑惑起来，忙转过山石看时，只见藕官满面泪痕，蹲在那里，手内还拿着火，守着些纸钱灰作悲。宝玉忙问道：“你给谁烧纸？快别在这里烧！你或是为父母兄弟，你告诉我姓儿，外头去叫小厮们打了包袱写上名姓去烧。”","so":0,"eo":0},{"surface":"宝玉","text":"藕官见了宝玉，只不做一声，宝玉数问不答。忽见一个婆子恶狠狠的走来拉藕官，口内说道：“我已经回了奶奶们，奶奶们气的了不得！”藕官听了，终是孩气，怕去受辱没脸，便不肯去。婆子道：“我说你们别太兴头过馀了。如今还比得你们在外头乱闹呢！这是尺寸地方儿。”指着宝玉道：“连我们的爷还守规矩呢，你是什么阿物儿，跑了这里来胡闹！—怕也不中用，跟我快走罢！”宝玉忙道：“他并没烧纸，原是林姑娘叫他烧那烂字纸，你没看真，反错告了他。”藕官正没了主意，见了宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"这里宝玉细问藕官：“为谁烧纸？必非父母兄弟，定有私自的情理。”藕官因方才护庇之情，心中感激，知他是自己一流人物，况再难隐瞒，便含泪说道：“我这事、除了你屋里的芳官合宝姑娘的蕊官，并没第三个人知道。今日忽然被你撞见，这意思少不得也告诉了你，只不许再对一人言讲。”又哭道：“我也不便和你面说，你只回去，背人悄悄问芳官就知道了。”说毕怏怏而去。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了心下纳闷，只得踱到潇湘馆。瞧黛玉越发瘦得可怜，问起来，比往日大好了些。黛玉见他也比先大瘦了，想起往日之事，不免流下泪来。些微谈了一谈，便催宝玉去歇息调养。宝玉只得回来。因惦记着要问芳官原委，偏有湘云、香菱来了，正和袭人、芳官一处说笑，不好叫他，恐人又盘诘，只得耐着。","so":0,"eo":0},{"surface":"宝玉","text":"一时芳官又跟了他干娘去洗头，他干娘偏又先叫他亲女儿洗过才叫芳官洗。芳官见了这样，便说他偏心：“把你女儿的剩水给我洗？我一个月的月钱都是你拿着，沾我的光不算，反倒给我剩东西的。”他干娘羞恼变成怒，便骂他：“不识抬举的东西！怪不得人人都说戏子没一个好缠的，凭你什么好的，入了这一行，都学坏了！这一点子小崽子也挑么挑六，咸嘴淡舌，咬群的骡子似的。”娘儿两个吵起来。袭人忙打发人去说：“少乱唤，瞅着老太太不在家，一个个连句安静话也都不说了！”睛雯因…","so":0,"eo":0}]},{"chap":59,"ctitle":"第59章 柳叶渚边嗔莺叱燕 绛芸轩里召将飞符","deeds":[{"surface":"宝玉","text":"话说宝玉闻听贾母等回来，随多添了一件衣裳，拄了杖前边来，都见过了。贾母等因每日辛苦，都要早些歇息，一宿无话。次日五鼓，又往朝中去。","so":0,"eo":0},{"surface":"宝玉","text":"这里莺儿正编，只见何妈的女儿春燕走来，笑问：“姐姐编什么呢？”正说着，蕊官、藕官也到了，春燕便向藕官道：“前日你到底烧了什么纸？叫我姨妈看见了，要告你没告成，倒被宝玉赖了他好些不是，气得他一五一十告诉我妈。你们在外头二三年了，积了些什么仇恨，如今还不解开？”藕官冷笑道：“有什么仇恨？他们不知足，反怨我们。在外头这两年，不知赚了我们多少东西，你说说可有的没的？”春燕也笑道：“他是我的姨妈，也不好向着外人反说他的。怨不得宝玉说：‘女孩儿未出…","so":0,"eo":0},{"surface":"宝玉","text":"却说春燕一直跑进院中，顶头遇见袭人往黛玉处问安去，春燕便一把抱住袭人说：“姑娘救我，我妈又打我呢！”袭人见他娘来了，不免生气，便说道：“三日两头儿，打了干的打亲的。还是卖弄你女孩儿多，还是认真不知王法？”这婆子来了几日，见袭人不言不语，是好性儿的，便说道：“姑娘，你不知道，别管我们的闲事。都是你们纵的，还管什么？”说着，便又赶着打。袭人气的转身进来，见麝月正在海棠下晾手巾，听如此喊闹，便说：“姐姐别管，看他怎么着。”一面使眼色给春燕。春…","so":0,"eo":0},{"surface":"宝玉","text":"那婆子见他女儿奔到宝玉身边去，又见宝玉拉了春燕的手，说：“你别怕，有我呢。”春燕一行哭，一行将方才莺儿等事都说出来。宝玉越发急起来，说：“你只在这里闹倒罢了，怎么把你妈也都得罪起来？”麝月又向婆子及众人道：“怨不得这嫂子说我们管不着他们的事。我们原无知，错管了，如今请出一个管得着的人来管一管，嫂子就心服口服，也知道规矩了。”便回头命小丫头子：“去把平儿给我叫来，平儿不得闲，就把林大娘叫了来。”那小丫头子应了便走。众媳妇上来笑道：“嫂子快…","so":0,"eo":0}]},{"chap":60,"ctitle":"第60章 茉莉粉替去蔷薇硝 玫瑰露引出茯苓霜","deeds":[{"surface":"宝玉","text":"话说袭人因问平儿：“何事这等忙乱？”平儿笑道：“都是世人想不到的，说来也好笑，等过几日告诉你。如今没头绪呢，且也不得闲儿。”一语未了，只见李纨的丫鬟来了，说：“平姐姐可在这里？奶奶等你，你怎么不去了？”平儿忙转身出来，口内笑说：“来了来了。”袭人等笑道：“他奶奶病了，他又成了‘香饽饽’了，都抢不到手。”平儿去了不提。这里宝玉便叫春燕：“你跟了你妈去，到宝姑娘房里，把莺儿安伏安伏，也不可白得罪了他。”春燕一面答应了，和他妈出去。宝玉又隔窗…","so":0,"eo":0},{"surface":"宝玉","text":"娘儿两个应了出来，一面走着，一面说闲话儿。春燕因向他娘道：“我素日劝你老人家，再不信。何苦闹出没趣来才罢。”他娘笑道：“小蹄子，你走罢！俗语说：‘不经一事，不长一智。’我如今知道了，你又该来支问着我了。”春燕笑道：“妈，你若好生安分守己，在这屋里长久了，自有许多好处。我且告诉你句话：宝玉常说，这屋里的人，无论家里外头的，一应我们这些人，他都要回太太全放出去，与本人父母自便呢。你只说这一件可好不好？”他娘听说，喜的忙问：“这话果真？”春燕…","so":0,"eo":0},{"surface":"宝玉","text":"当下来至蘅芜院中，正值宝钗、黛玉、薛姨妈等吃饭。莺儿自去沏茶。春燕便和他妈一径到莺儿前，陪笑说：“方才言语冒撞，姑娘莫嗔莫怪，特来陪罪。”莺儿也笑了，让他坐，又倒茶，他娘儿两个说有事，便作辞回来。忽见蕊官赶出，叫：“妈妈，姐姐略站一站。”一面走上，递了一个纸包儿给他们，说是蔷薇硝，带给芳官去擦脸。春燕笑道：“你们也太小气了，还怕那里没这个给他？巴巴儿的又弄一包给他去。”蕊官道：“他是他的，我送的是我送的，姐姐千万带回去罢。”春燕只得接了…","so":0,"eo":0},{"surface":"宝玉","text":"春燕进来，宝玉知道回复了，便先点头。春燕知意，也不再说一语，略站了一站，便转身出来，使眼色给芳官。芳官出来，春燕方悄悄的说给他蕊官之事，并给了他硝，宝玉并无和琮环可谈之语，因笑问芳官：“手里是什么？”芳官便忙递给宝玉瞧，又说：“是擦春癣的蔷薇硝。”宝玉笑道：“难为他想的到。”贾环听了，便伸着头瞧了一瞧，又闻得一股清香，便弯腰向靴筒内掏出一张纸来，托着笑道：“好哥哥，给我一半儿。”宝玉只得要给他。芳官心中因是蕊官之赠，不肯给别人，连忙拦住…","so":0,"eo":0},{"surface":"宝玉","text":"原来贾政不在家，且王夫人等又不在家，贾环连日也便装病逃学。如今得了硝，兴兴头头来找彩云。正值彩云和赵姨娘闲谈，贾环笑嘻嘻向彩云道：“我也得了一包好的，送你擦脸。你常说蔷薇硝擦癣比外头买的银硝强，你看看是这个不是？”彩云打开一看，“嗤”的一笑，说道：“你是和谁要来的？”贾环便将方才之事说了一遍。彩云笑道：“这是他们哄你这乡老儿呢。这不是硝，这是茉莉粉。”贾环看了一看，果见比先的带些红色，闻闻也是喷香，因笑道：“这是好的，硝粉一样，留着擦罢…","so":0,"eo":0},{"surface":"宝玉","text":"赵姨娘直进园子，正是一头火，顶头遇见藕官的干娘夏婆子走来，瞧见赵姨娘气的眼红面青的走来，因问：“姨奶奶，那里去？”赵姨娘拍着手道：“你瞧瞧！这屋里连三日两日进来唱戏的小粉头们都三般两样，掂人的分量，放小菜儿了！要是别的人我还不恼，要叫这些小娼妇捉弄了，还成了什么了？”夏婆子听了，正中己怀，忙问：“因什么事？”赵姨娘遂将以粉作硝、轻侮贾环之事说了一回。夏婆子道：“我的奶奶，你今日才知道？这算什么事。连昨日这个地方，他们私自烧纸钱，宝玉还拦…","so":0,"eo":0},{"surface":"宝玉","text":"赵姨娘听了，越发得了意，仗着胆子，便一径到了怡红院中。可巧宝玉往黛玉那里去了，芳官正和袭人等吃饭，见赵姨娘来了，忙都起身让：“姨奶奶吃饭。什么事情这么忙？“赵姨娘也不答话，走上来，便将粉照芳官脸上摔来，手指着芳官骂道：“小娼妇养的，你是我们家银子钱买了来学戏的，不过娼妇粉头之流，我家里下三等奴才也比你高贵些。你都会‘看人下菜碟儿’！宝玉要给东西，你拦在头里，莫不是要了你的了？拿这个哄他，你只当他不认得呢。好不好，他们是手足，都是一样的主…","so":0,"eo":0},{"surface":"宝玉","text":"这里柳家的见人散了，忙出来和芳官说：“前日那话说了没有？”芳官道：“说了。等一两天，再提这事。偏那赵不死的又和我闹了一场。前日那玫瑰露，姐姐吃了没有？他到底可好些？”柳家的道：“可不都吃了。他爱的什么儿似的，又不好合你再要。”芳官道：“不值什么，等我再要些来给他就是了。”原来柳家的有个女孩儿，今年十六岁，虽是厨役之女，却生得人物与平、袭、鸳、紫相类。因他排行第五，便叫他五儿。只是素有弱疾，故没得差使。近因柳家的见宝玉房中丫鬟，差轻人多，…","so":0,"eo":0}]},{"chap":61,"ctitle":"第61章 投鼠忌器宝王瞒赃 判冤决狱平儿行权","deeds":[{"surface":"宝玉","text":"这里五儿被人软禁起来，一步不敢多走。又兼众媳妇也有劝他说：“不该做这没行止的事。”也有抱怨说：“正经更还坐不上来，又弄个贼来给我们看守。倘或眼不见，寻了死，或逃走了，都是我们的不是。”又有素日一于与柳家不睦的人，见了这般十分趁愿，都来奚落嘲戏他。这五儿心内又气又委屈，竟无处可诉！且本来怯弱有病，这一夜思茶无茶，思水无水，思睡无衾枕，呜呜咽咽直哭了一夜。谁知和他母女不和的那些人，巴不得一时就撵他出门去。生恐次日有变，大家先起个清早，都悄悄…","so":0,"eo":0},{"surface":"宝玉","text":"平儿便命一个人叫了他两个来，说道：“不用慌，贼已有了。”玉钏儿先问：“贼在那里？”平儿道：“现在二奶奶屋里呢，问他什么应什么。我心里明白，知道不是他偷的，可怜他害怕，都承认了。这里宝二爷不过意，要替他认一半。我要说出来呢，但只是这做贼的，素日又是和我好的一个姐妹；窝主却是平常，里面又伤了一个好人的体面，因此为难。少不得央求宝二爷应了，大家无事。如今反要问你们两个还是怎么样。要从此以后，大家小心存体面呢，就求宝二爷应了，要不然，我就回了二…","so":0,"eo":0},{"surface":"宝玉","text":"于是大家商议妥贴，平儿带了他两个并芳官来至上夜房中，叫了五儿，将茯苓霜一节也悄悄的教他说系芳官给的，五儿感激不尽。平儿带他们来至自己这边，已见林之孝家的带领了几个媳妇，押解着柳家的等够多时了。林之孝家的又向平儿说：“今日一早押了他来，怕园里没有人伺候早饭，我暂且将秦显的女人派了去伺候姑娘们的饭呢。”平儿道：“秦显的女人是谁？我不大相熟啊。”林之孝家的道：“他是园里南角子上夜的，白日里没什么事，所以姑娘不认识。高高儿的孤拐，大大的眼睛，最…","so":0,"eo":0}]},{"chap":62,"ctitle":"第62章 憨湘云醉眠芍药裀 呆香菱情解石榴裙","deeds":[{"surface":"宝玉","text":"赵姨娘正因彩云私赠了许多东西，被玉钏儿吵出，生恐查问出来，每日捏着一把汗，偷偷的打听信儿。忽见彩云来告诉，说都是宝玉应了，从此无事，赵姨娘方把心放下来。谁知贾环听如此说，便起了疑心，将彩云凡私赠之物都拿出来了，照着彩云脸上摔了来，说：“你这两面三刀的东西，我不稀罕！你不和宝玉好，他怎么肯替你应？你既有担当给了我，原该不叫一个人知道，如今你既然告诉了他，我再要这个也没趣儿！”彩云见如此，急的赌咒起誓，至于哭了。百般解说，贾环执意不信，说：…","so":0,"eo":0},{"surface":"宝玉","text":"当下又值宝玉生日已到。原来宝琴也是这日，二人相同。王夫人不在家，也不曾象往年热闹，只有张道士送了四样礼，换的寄名符儿，还有几处僧尼庙的和尚姑子送了供尖儿并寿星、纸马、疏头，并本宫星官、值年太岁、周岁换的锁。家中常走的男女，先一日来上寿。王子腾那边，仍是一套衣服，一双鞋袜，一百寿桃，一百束上用银丝挂面。薛姨妈处减一半。其余家中尤氏仍是一双鞋袜，凤姐儿是一个宫制四面扣合堆绣荷包装一个金寿星，一件波斯国的玩器。各庙中遣人去放堂舍钱。又另有宝琴…","so":0,"eo":0},{"surface":"宝玉","text":"这日宝玉清晨起来梳洗已毕，便冠带了来至前厅院中，已有李贵等四个人在那里设下天地香烛。宝玉炷了香，行了礼，奠茶烧纸后，便至宁府中宗祠、祖先堂两处行毕了礼。出至月台上，又朝上遥拜过了贾母、贾政、王夫人等。一顺到尤氏上房，行过礼，坐了一回，方向荣府。先至薛姨妈处，再三拉着，然后又见过薛蝌，让一回，方进园来。晴雯、麝月二人跟随，小丫头夹着毡子，从李氏起，一一挨着，比自己长的房中到过，复出二门，至四个奶奶家让了一回，方进来。虽众人要行礼，也不曾受…","so":0,"eo":0},{"surface":"宝玉","text":"一时贾环、贾兰来了，袭人连忙拉住，坐了一坐，便去了。宝玉笑道：“走乏了！”便歪在床上。方吃了半盏茶，只听外头咭咭呱呱，一群丫头笑着进来，原来是翠墨、小螺、翠缕、入画，邢岫烟的丫头篆儿，并奶子抱着巧姐儿，彩鸾、绣鸾八九个人，都抱着红毡子来了，笑说道：“拜寿的挤破了门了，快拿面来我们吃。”刚进来时，探春、湘云、宝琴、岫烟、惜春也都来了。宝玉忙迎出来，笑说：“不敢起动。快预备好茶！”进入房中，不免推让一回，大家归坐。袭人等捧过茶来，才吃了一口…","so":0,"eo":0},{"surface":"宝玉","text":"探春笑道：“倒有些意思。一年十二个月，月月有几个生日。人多了就这样巧，也有三个一日的，两个一日的。大年初一也不白过，大姐姐占了去，怨不得他福大，生日比别人都占先。又是大祖太爷的生日冥寿。过了灯节，就是大太太和宝姐姐，他们娘儿两个遇的巧。三月初一是太太的，初九是琏二哥哥。二月没人。”袭人道：“二月十二是林姑娘，怎么没人？只不是咱们家的。”探春笑道：“你看我这个记性儿。”宝玉笑指袭人道：“他和林妹妹是一日，他所以记得。”探春笑道：“原来你两…","so":0,"eo":0},{"surface":"宝玉","text":"探春一面遣人去请李纨、宝钗、黛玉，一面遣人去传柳家的进来，吩咐他内厨房中快收拾两桌酒席。柳家的不知何意，因说：“外厨房都预备了。”探春笑道：“你原来不知道，今日是平姑娘的好日子，外头预备的是上头的，这如今我们私下又凑了分子，单为平姑娘预备两桌请他。你只管拣新巧的菜蔬预备了来，开了账我那里领钱。”柳家的笑道：“今日又是平姑娘的千秋？我们竟不知道。”说着，便给平儿磕头，慌得平儿拉起他来。柳家的忙去预备酒席。这里探春又邀了宝玉同到厅上去吃面，…","so":0,"eo":0},{"surface":"宝玉","text":"谁知薛蝌又送了巾扇香帛四色寿礼给宝玉，宝玉于是过去陪他吃面。两家皆办了寿酒，互相酬送，彼此同领。至午间，宝玉又陪薛蝌吃了两杯酒。宝钗带了宝琴过来给薛蝌行礼，把盏毕，宝钗因嘱咐薛蝌：“家里的酒也不用送过那边去，这虚套竟收了。你只请伙计们吃罢。我们和宝兄弟进去，还要待人去呢，也不能陪你了。”薛蝌忙说：“姐姐兄弟只管请，只怕伙计们也就好来了。”宝玉忙又告过罪，方同他妹妹回来。一进角门，宝钗便命婆子将门锁上，把钥匙要了，自己拿着。宝玉忙说：“这…","so":0,"eo":0},{"surface":"宝玉","text":"薛姨妈说：“我老天拔地，不合你们的群儿，我倒拘的慌，不如我到厅上随便躺躺去倒好。我又吃不下什么去，又不大吃酒，这里让他们倒便宜。”尤氏等执意不从。宝钗道：“这也罢了，倒是让妈妈在厅上歪着自如些。有爱吃的送些过去，倒还自在。且前头没人在那里，又可照看了。”探春笑道：“既这样，恭敬不如从命。”因大家送到议事厅上，眼看着命小丫头们铺了一个锦褥并靠背引枕之类，又嘱咐：“好生给姨太太捶腿。要茶要水，别推三拉四的。回来送了东西来，姨太太吃了，赏你们…","so":0,"eo":0}]},{"chap":63,"ctitle":"第63章 寿怡红群芳开夜宴 死金丹独艳理亲丧","deeds":[{"surface":"宝玉","text":"话说宝玉回至房中洗手，因和袭人商议：“晚间吃酒，大家取乐，不可拘泥。如今吃什么好？早说给他们备办去。”袭人笑道：“你放心，我和晴雯、麝月、秋纹四个人，每人五钱银子，共是二两；芳官、碧痕、春燕、四儿四个人，每人三钱银子，他们告假的不算：共是三两二钱银子，早已交给了柳嫂子，预备四十碟果子。我和平儿说了，已经抬了一罐好绍兴酒藏在那边了。我们八个人单替你做生日。”宝玉听了，喜的忙说：“他们是那里的钱？不该叫他们出才是。”晴雯道：“他们没钱，难道…","so":0,"eo":0},{"surface":"宝玉","text":"已是掌灯时分，听得院门前有一群人进来。大家隔窗悄视，果见林之孝家的和几个管事的女人走来，前头一人提着大灯笼。晴雯悄笑道：“他们查上夜的人来了。这一出去，咱们就好关门了。”只见怡红院凡上夜的人，都迎出去了。林之孝家的看了不少，又吩咐：“别耍钱吃酒，放倒头睡到大天亮。我听见是不依的。”众人都笑说：“那里有这么大胆子的人。”林之孝家的又问：“宝二爷睡下了没有？”众人都回：“不知道。”袭人忙推宝玉。宝玉了鞋，便迎出来，笑道：“我还没睡呢。妈妈进…","so":0,"eo":0},{"surface":"宝玉","text":"这里晴雯等忙命关了门，进来笑说：“这位奶奶那里吃了一杯来了？唠三叨四的，又排场了我们一顿去了。”麝月笑道：“他也不是好意的？少不得也要常提着些儿，也堤防着，怕走了大褶儿的意思。”说着，一面摆上酒果。袭人道：“不用高桌，咱们把那张花梨圆炕桌子放在炕上坐，又宽绰，又便宜。”说着，大家果然抬来。麝月和四儿那边去搬果子，用两个大茶盘，做四五次方搬运了来。两个老婆子蹲在外面火盆上筛酒。宝玉说：“天热，咱们都脱了大衣裳才好。”众人笑道：“你要脱，你…","so":0,"eo":0},{"surface":"宝玉","text":"于是先不上坐，且忙着卸妆宽衣。一时将正妆卸去，头上只随便挽着儿，身上皆是紧身袄儿。宝玉只穿着大红绵纱小袄儿，下面绿绫弹墨夹裤，散着裤脚，系着一条汗巾，靠着一个各色玫瑰芍药花瓣装的玉色夹纱新枕头，和芳官两个先拳。当时芳官满口嚷热，只穿着一件玉色红青驼绒三色缎子拼的水田小夹袄，束着一条柳绿汗巾，底下是水红洒花夹裤，也散着裤腿。头上齐额编着一圈小辫，总归至顶心，结一根粗辫，拖在脑后，右耳根内只塞着米粒大小的一个小玉塞子，左耳上单一个白果大小的…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉因说：“咱们也该行个令才好。”袭人道：“斯文些才好，别大呼小叫，叫人听见。二则我们不识字，可不要那些文的。”麝月笑道：“拿骰子咱们抢红罢。”宝玉道：“没趣，不好。咱们占花名儿好。”晴雯笑道：“正是，早已想弄这个玩意儿。”袭人道：“这个玩意虽好，人少了没趣。”春燕笑道：“依我说，咱们竟悄悄的把宝姑娘、云姑娘、林姑娘请了来，玩一会子，到二更天再睡不迟。”袭人道：“又开门合户的闹，倘或遇见巡夜的问？”宝玉道：“怕什么！咱们三姑娘也吃酒，再…","so":0,"eo":0},{"surface":"宝玉","text":"晴雯、麝月、袭人三人又说：“他两个去请，只怕不肯来，须得我们去请，死活拉了来。”于是袭人、晴雯忙又命老婆子打个灯笼，二人又去。果然宝钗说夜深了，黛玉说身上不好。他二人再三央求：“好歹给我们一点体面，略坐坐再来。”众人听了，却也欢喜。因想不请李纨，倘或被他知道了倒不好，便命翠墨同春燕也再三的请了李纨和宝琴二人，会齐先后都到了怡红院中。袭人又死活拉了香菱来。炕上又并了一张桌子，方坐开了。宝玉忙说：“林妹妹怕冷，过这边靠板壁坐。”又拿了个靠背…","so":0,"eo":0},{"surface":"宝玉","text":"又注着：“在席共贺一杯。此为群芳之冠，随意命人，不拘诗词雅谑，或新曲一支为贺。”众人都笑说：“巧得很，你也原配牡丹花。”说着大家共贺了一杯。宝钗吃过，便笑说：“芳官唱一只我们听罢。”芳官道：“既这样，大家吃了门杯好听。”于是大家吃酒，芳官便唱：“寿筵开处风光好……”众人都道：“快打回去，这会子很不用你来上寿。拣你极好的唱来。”芳官只得细细的唱了一只《赏花时》“翠凤翎毛扎帚，闲踏天门扫落花……”才罢。宝玉却只管拿着那签，口内颠来倒去念“任…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉笑道：“‘夜深’二字改‘石凉’两个字倒好。”众人知他打趣日间湘云醉眠的事，都笑了。湘云笑指那自行船给黛玉看，又说：“快坐上那船家去罢，别多说了。”众人都笑了。因看注云：“既云香梦沉酣，掣此签者，不便饮酒，只令上下两家各饮一杯。”湘云拍手笑道：“阿弥陀佛，真真好签！”恰好黛玉是上家，宝玉是下家，二人斟了两杯，只得要饮。宝玉先饮了半杯，瞅人不见递与芳官。芳官即便端起来，一仰脖喝了。黛玉只管和人说话，将酒全折在漱孟内了。","so":0,"eo":0}]},{"chap":64,"ctitle":"第64章 幽淑女悲题五美吟 浪荡子情遗九龙佩","deeds":[{"surface":"宝玉","text":"话说贾蓉见家中诸事已妥，连忙赶至寺中，回明贾珍。于是连夜分派各项执事人役，并预备一切应用幡杠等物，择于初四日卯时请灵柩进城，一面使人知会诸位亲友。是日丧仪耀，宾客如云，自铁槛寺至宁府，夹路看的何止数万人。内中有嗟叹的，也有羡慕的，又有一等半瓶醋的读书人，说是丧礼与其奢易莫若俭戚的，一路纷纷议论不一。至未申时方到，将灵柩停放正堂之内，供奠举哀已毕，亲友渐次散回，只剩族中人分理迎宾送客等事。近亲只有邢舅太爷相伴未去。贾珍、贾蓉此时为礼法所拘…","so":0,"eo":0},{"surface":"宝玉","text":"一日供毕早饭，因天气尚长，贾珍等连日劳倦，不免在灵旁假寐。宝玉见无客至，遂欲回家看视黛玉，因先回至怡红院中。进入门来，只见院中寂静无人，有几个老婆子和那小丫头们在回廊下取便乘凉，也有睡卧的，也有坐着打盹的。宝玉也不去惊动。只有四儿看见，连忙上前来打帘子。将掀起时，只见芳官自内带笑跑出，几乎和宝玉撞个满怀。一见宝玉，方含笑站着，说道：“你怎么来了？你快给我拦住晴雯，他要打我呢。”一语未了，只听见屋里唏哗喇的乱响，不知是何物撒了一地。随后晴…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听说，一面笑，一面走至里间。只见袭人坐在近窗床上，手中拿着一根灰色绦子，正在那里打结子呢，见宝玉进来，连忙站起，笑道：“晴雯这东西编派我什么呢！我因要赶着打完了这结子，没工夫和他们瞎闹，因哄他说：‘你们玩去罢。趁着二爷不在家，我要在这里静坐一坐，养一养神。’他就编派了我这些个话，什么‘面壁了’、‘参禅了’的。等一会我不撕他那嘴！”宝玉笑着挨近袭人坐下，瞧他打结子，问道：“这么长天，你也该歇息歇息，或和他们玩笑，要不瞧瞧林妹妹去也好。…","so":0,"eo":0},{"surface":"宝玉","text":"于是一径往潇湘馆来看黛玉。将过了沁芳桥，只见雪雁领了两个老婆子，手中都拿着菱藕瓜果之类。宝玉忙问雪雁道：“你们姑娘从来不吃这些凉东西，拿这些瓜果作什么？不是要请那位姑娘奶奶么？”雪雁笑道：“我告诉你，可不许你对姑娘说去。”宝玉点头应允。雪雁便命两个婆子：“先将瓜果送去，交与紫鹃姐姐。他要问我，你就说我做什么呢，就来。”那婆子答应着去了。雪雁方说道：“我们姑娘这两日方觉身上好些了。今日饭后，三姑娘来会着要瞧二奶奶去，姑娘也没去，又不知想起…","so":0,"eo":0},{"surface":"宝玉","text":"想毕，遂别了雪雁，出了园门，一径到凤姐处来。正有许多婆子们回事毕，纷纷散出，凤姐倚着门和平儿说话呢。一见了宝玉，笑道：“你回来了么？我才吩咐了林之孝家的叫他使人告诉跟你的小厮，若没什么事，趁便请你回来歇息歇息。再者那里人多，你那里禁的住那些气味？不想恰好你倒来了。”宝玉笑道：“多谢姐姐惦记。我也因今日没事，又见姐姐这两日没往那府里去，不知身上可大愈了，所以回来看看。”凤姐道：“左右也不过是这么着，三日好两日不好的。老太太、太太不在家，这…","so":0,"eo":0},{"surface":"宝玉","text":"进了潇湘馆院门看时，只见炉袅残烟，奠馀玉醴，紫鹃正看着人往里收桌子，搬陈设呢。宝玉便知已经奠祭完了。走入屋内，只见黛玉面向里歪着，病体恹恹，大有不胜之态。紫鹃连忙说道：“宝二爷来了。”黛玉方慢慢的起来。含笑让坐。宝玉道：“妹妹这两天可大好些了？气色倒觉静些，只是为何又伤心了？”黛玉道：“可是你没的说了。好好的，我多早晚又伤心了？”宝玉笑道：“妹妹脸上现有泪痕，如何还哄我呢？只是我想妹妹素日本来多病，凡事当各自宽解，不可过作无益之悲。若作…","so":0,"eo":0},{"surface":"宝玉","text":"却说紫鹃端了茶来，打量二人又为何事口角，因说道：“姑娘身上才好些，宝二爷又来怄气了。到底是怎么样？”宝玉一面拭泪，笑道：“谁敢怄妹妹了？”一面搭讪着起来闲步，只见砚台底下微露一纸角，不禁伸手拿起。黛玉忙要起身来夺，已被宝玉揣在怀内，笑央道：“好妹妹，赏我看看罢！”黛玉道：“不管什么，来了就混翻。”一语未了，只见宝钗走来，笑道：“宝兄弟要看什么？”宝玉未见上面是何言词，又不知黛玉心中如何，未敢造次回答，却望着黛玉笑。黛玉一面让宝钗坐，一面…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，方自怀内取出，凑至宝钗身旁，一同细看。只见写道：","so":0,"eo":0}]},{"chap":65,"ctitle":"第65章 贾二舍偷娶尤二姨 尤三姐思嫁柳二郎","deeds":[{"surface":"宝玉","text":"至次日，二姐儿另备了酒，贾琏也不出门，至午间，特请他妹妹过来和他母亲上坐。三姐儿便知其意，刚斟上酒，也不用他姐姐开口，便先滴泪说道：“姐姐今儿请我，自然有一番大道理要说。但只我也不是糊涂人，也不用絮絮叨叨的。从前的事，我已尽知了，说也无益。既如今姐姐也得了好处安身，妈妈也有了安身之处，我也要自寻归结去，才是正礼。但终身大事，一生至一死，非同儿戏。向来人家看着咱们娘儿们微息，不知都安着什么心，我所以破着没脸，人家才不敢欺负。这如今要办正事…","so":0,"eo":0}]},{"chap":66,"ctitle":"第66章 情小妹耻情归地府 冷二郎一冷入空门","deeds":[{"surface":"宝玉","text":"话说兴儿说怕吹倒了林姑娘，吹化了薛姑娘，大家都笑了。那鲍二家的打他一下子，笑道：“原有些真，到了你嘴里，越发没了捆儿了。你倒不象跟二爷的人，这些话倒象是宝玉的人。”尤二姐才要又问，忽见尤三姐笑问道：“可是，你们家那宝玉，除了上学他做些什么？”兴儿笑道：“三姨儿别问他。说起来，三姨儿也未必信。他长了这么大，独他没有上过正经学。我们家从祖宗直到二爷，谁不是学里的师老爷严严的管着念书？偏他不爱念书，是老太太的宝贝。老爷先还管，如今也不敢管了。…","so":0,"eo":0},{"surface":"宝玉","text":"这里尤二姐命掩了门，早睡下了，盘问他妹子一夜。至次日午后贾琏方来了，尤二姐因劝他，说：“既有正事，何必忙忙又来？千万别为我误事。”贾琏道：“也没什么事，只是偏偏的又出来了一件远差。出了月儿就起身，得半月工夫才来。”尤二姐道：“既如此，你只管放心前去，这里一应不用你惦记。三妹妹他从不会朝更暮改的。他已择定了人，你只要依他就是了。”贾琏忙问：“是谁？”二姐笑道：“这人此刻不在这里，不知多早晚才来呢。也难为他的眼力。他自己说了：这人一年不来，…","so":0,"eo":0},{"surface":"宝玉","text":"次日，又来见宝玉。二人相会，如鱼得水。湘莲因问贾琏偷娶二房之事。宝玉笑道：“我听见焙茗说，我却未见。我也不敢多管。我又听见焙茗说，琏二哥哥着实问你。不知有何话说？”湘莲就将路上所有之事，一概告诉了宝玉。宝玉笑道：“大喜，大喜！难得这个标致人！果然是个古今绝色，堪配你之为人。”湘莲道：“既是这样，他那少了人物？如何只想到我？况且我又素日不甚和他相厚，也关切不至于此。路上忙忙的就那样再三要求定下，难道女家反赶着男家不成？我自己疑惑起来，后悔…","so":0,"eo":0}]},{"chap":67,"ctitle":"第67章 见土仪颦卿思故里 闻秘事凤姐讯家童","deeds":[{"surface":"宝玉","text":"紫鹃正在这里劝解，只听见小丫头子在院内说：“宝二爷来了。”紫鹃忙说：“请二爷进来罢。”只见宝玉进房来。黛玉让坐毕，宝玉见黛玉泪痕满面，便问：“妹妹，又是谁气着你了？”黛玉勉强笑道：“谁生什么气。”旁边紫鹃将嘴向床后桌上一努。宝玉会意，往那里一瞧，见堆着许多东西，就知道是宝钗送来的，便取笑说道：“那里这些东西？不是妹妹要开杂货铺啊？”黛玉也不答言。紫鹃笑着道：“二爷还提东西呢。因宝姑娘送了些东西来，姑娘一看，就伤起心来了。我正在这里劝解，…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉忙走到床前挨着黛玉坐下，将那些东西一件一件拿起来，摆弄着细瞧，故意问：“这是什么，叫什么名字？”“那是什么做的，这样齐整？”“这是什么，要他做什么使用？”又说：“这一件可以摆在面前。”又说：“那一件可以放在条桌上，当古董儿倒好呢。”一味的将些没要紧的话来厮混。黛玉见宝玉如此，自己心里倒过不去，便说：“你不用在这里混搅了，咱们到宝姐姐那边去罢。”宝玉巴不的黛玉出去散散闷解了悲痛，便道：“宝姐姐送咱们东西，咱们原该谢谢去。”黛玉道：“自…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉和着黛玉到宝钗处来，宝玉见了宝钗，便说道：“大哥哥辛辛苦苦的带了东西来，姐姐留着使罢，又送我们。”宝钗笑道：“原不是什么好东西，不过是远路带来的土物儿，大家看着新鲜些就是了。”黛玉道：“这些东西，我们小时候倒不理会，如今看见，真是新鲜物儿了。”宝钗因笑道：“妹妹知道，这就是俗语说的‘物离乡贵’，其实可算什么呢！”宝玉听了这话，正对了黛玉方才的心事，连忙拿话岔道：“明年好歹大哥哥再去时，替我们多带些来。”黛玉瞅了他一眼，便道：“你…","so":0,"eo":0},{"surface":"宝玉","text":"三个人又闲话了一回，因提起黛玉的病来，宝钗劝了一回，因说道：“妹妹若觉着身上不爽快，倒要自己勉强扎挣着出来，各处走走逛逛，散散心，比在屋里闷坐着到底好些。我那两日，不是觉着发懒，浑身发热，只是要歪着？也因为时气不好，怕病，因此寻些事情，自己混着，这两日才觉得好些了。”黛玉道：“姐姐说的何尝不是？我也是这么想着呢。”大家又坐了一会子方散。宝玉仍把黛玉送至潇湘馆门首，才各自回去了。","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉送了黛玉回来，想着黛玉的孤苦，不免也替他伤感起来，因要将这话告诉袭人。进来时，却只有麝月、秋纹在屋里，因问：“你袭人姐姐那里去了？”麝月道：“左不过在这几个院里，那里就丢了他？一时不见就这样找。”宝玉笑着道：“不是怕丢了他。因我方才到林姑娘那边，见林姑娘又正伤心呢。问起来，却是为宝姐姐送了他东西，他看见是他家乡的土物，不免对景伤情。我要告诉你袭人姐姐，叫他过去劝劝。”正说着，晴雯进来了，因问宝玉道：“你回来了，你又要叫劝谁？”宝…","so":0,"eo":0},{"surface":"宝玉","text":"却说袭人因宝玉出门，自己作了回活计。忽想起凤姐身上不好，这几天也没有过去看看，况闻贾琏出门，正好大家说说话儿，便告诉晴雯：“好生在屋里，别都出去了，叫二爷回来抓不着人。”晴雯道：“嗳哟！这屋里单你一个人惦记着他，我们都是白闲着混饭吃的。”袭人笑着，也不答言，就走了。刚来到沁芳桥畔，那里正是夏末秋初，池中莲藕新残相间，红绿离披。袭人走着，沿堤看玩了一回，猛抬头，看见那边葡萄架底下，有人拿着掸子在那里掸什么呢。走到跟前，却是老祝妈。那老婆子…","so":0,"eo":0},{"surface":"宝玉","text":"说着，遂一径出了园门，来到凤姐这边。一到院里，只听凤姐说道：“天理良心，我在这屋里熬的越发成了贼了！”袭人听见这话，知道有原故了，又不好回来，又不好进去，遂把脚步放重些，隔着窗子问道：“平姐姐在家里呢么？”平儿忙答应着迎出来。袭人便问：“二奶奶也在家里呢么？身上可大安了？”说着，已走进来。凤姐装着在床上歪着呢，见袭人进来，也笑着站起来，说：“好些了，叫你惦着。怎么这几日不过我们这边坐坐？”袭人道：“奶奶身上欠安，本该天天过来请安才是。但…","so":0,"eo":0}]},{"chap":69,"ctitle":"第69章 弄小巧用借剑杀人 觉大限吞生金自逝","deeds":[{"surface":"宝玉","text":"平儿进来瞧见，不禁大哭。众人虽素昔惧怕凤姐，然合想二姐儿实在温和怜下，如今死去，谁不伤心落泪？只不敢与凤姐看见。当下合宅皆知。贾琏进来。搂尸大哭不止。凤姐也假意哭道：“狠心的妹妹！你怎么丢下我去了？辜负了我的心！”尤氏贾蓉等也都来哭了一场，劝住贾琏。贾琏便回了王夫人，讨了梨香院，停放五日，挪到铁槛寺去。王夫人依允。贾琏忙命人去往梨香院收拾停灵，将二姐儿抬上去，用衾单盖了，八个小厮和八个妇女围随，抬往梨香院来。那里已请下天文生，择定明日寅…","so":0,"eo":0}]},{"chap":70,"ctitle":"第70章 林黛玉重建桃花社 史湘云偶填柳絮词","deeds":[{"surface":"宝玉","text":"凤姐一应不管，只凭他自去办理。又因年近岁逼，诸事烦杂不算外，又有林之孝开了一个人单子来回：“共有八个二十五岁的单身小厮，应该娶妻成房的，等里面有该放的丫头，好求指配。”凤姐看了，先来问贾母和王夫人。大家商议，虽有几个应该发配的，奈各人皆有缘故：第一个鸳鸯，发誓不去。自那日之后，一向未与宝玉说话，也不盛妆浓饰。众人见他志坚，也不好相强。第二个琥珀，现又有病，这次不能了。彩云因近日和贾环分崩，也染了无医之症。只有凤姐儿和李纨房中粗使的大丫头…","so":0,"eo":0},{"surface":"宝玉","text":"原来这一向因凤姐儿病了，李纨探春料理家务，不得闲暇。接着过年过节，许多杂事，竟将诗社搁起。如今仲春天气，虽得了工夫，争奈宝玉因柳湘莲遁迹空门，又闻得尤三姐自刎，尤二姐被凤姐逼死，又兼柳五儿自那夜监禁之后，病越重了：连连接接，闲愁胡恨，一重不了一重添，弄的情色若痴，语言常乱，似染怔仲之病。慌的袭人等又不敢回贾母，只百般逗他玩笑。","so":0,"eo":0},{"surface":"宝玉","text":"这日清晨方醒，只听得外间屋内咭咭呱呱，笑声不断。袭人因笑说：“你快出去拉拉罢，晴雯和麝月两人按住芳官那里隔肢呢。”宝玉听了，忙披上灰鼠长袄出来一瞧，只见他三人被褥尚未叠起，大衣也未穿：那晴雯只穿着葱绿杭绸小袄，红绸子小衣儿，披着头发，骑在芳官身上，麝月是红绫抹胸，披着一身旧衣，在那里抓芳官的肋肢，芳官却仰在炕上，穿着撒花紧身儿，红裤绿袜，两脚乱蹬，笑的喘不过气来。宝玉忙笑说：“两个大的欺负一个小的！等我来挠你们。”说着也上床来隔肢晴雯。…","so":0,"eo":0},{"surface":"宝玉","text":"果见黛玉、宝钗、湘云、宝琴、探春，都在那里，手里拿着一篇诗看。见他来时，都笑道：“这会子还不起来！咱们的诗社散了一年，也没有一个人作兴作兴。如今正是初春时节，万物更新，正该鼓舞另立起来才好。”湘云笑道：“一起诗社时是秋天，就不发达。如今却好万物逢春，咱们重新整理起这个社来，自然要有生趣了。况这首‘桃花诗’又好，就把海棠社改作桃花社，岂不大妙呢？”宝玉听着点头，说：“很好。”且忙着要诗看。众人都又说：“咱们此时就访稻香老农去，大家议定好起…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看了，并不称赞，痴痴呆呆，竟要滚下泪来。又怕众人看见，忙自己拭了。因问：“你们怎么得来？”宝琴笑道：“你猜是谁做的？”宝玉笑道：“自然是潇湘子的稿子了。”宝琴笑道：“现在是我做的呢。”宝玉笑道：“我不信。这声调口气，迎乎不象。”宝琴笑道：“所以你不通。难道杜工部首首都作‘丛菊两开他日泪’不成？一般的也有‘红绽雨肥梅’、‘水荇牵风翠带长’等语。”宝玉笑道：“固然如此，但我知道姐姐断不许妹妹有此伤悼之句。妹妹本有此才，却也断不肯做的。比…","so":0,"eo":0},{"surface":"宝玉","text":"这日，众妹妹皆在房中侍早膳毕，便有贾政书信到了。宝玉请安，将请贾母的安禀拆开，念与贾母听。上面不过是请安的话，说六月准进京等语。其馀家信事物之帖，自有贾琏和王夫人开读。众人听说六七月回京，都喜之不尽。偏生这日王子腾将侄女许与保宁侯之子为妻，择于五月间过门，凤姐儿又忙着张罗，常三五日不在家。这日王子腾的夫人又来接凤姐儿，一并请众甥男甥女乐一日。贾母和王夫人命宝玉、探春、黛玉、宝钗四人同凤姐儿去，众人不敢违拗，只得回房去另妆饰了起来。五人去…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉进入怡红院，歇了半刻，袭人便乘机劝他收一收心，闲时把书理一理，好预备着。宝玉屈指算了一算，说：“还早呢。”袭人道：“书还是第二件。到那里纵然你有了书，你的字写的在那里呢？”宝玉笑道：“我时常也有写了的好些，难道都没收着？”袭人道：“何曾没收着。你昨儿不在家，我就拿出来，统共数了一数，才有五百六十几篇。这二三年的工夫，难道只有这几张字不成？依我说，明日起把别的心先都收起来。天天快临几张字补上。虽不能按日都有，也要大概看的过去。”宝玉听…","so":0,"eo":0},{"surface":"宝玉","text":"贾母因不见他，只当病了，忙使人来问。宝玉方去请安，便说：“写字之故，因此出来迟了。”贾母听说，十分喜欢，就吩咐他：“以后只管写字，念书，不用出来也使得。你去回你太太知道。”宝玉听说，遂到王夫人屋里来说明。王夫人便道：“临阵磨枪也不中用。有这会子着急，天天写写念念，有多少完不了的？这一赶，又赶出病来才罢。”宝玉回说：“不妨事。”宝钗、探春等都笑说：“太太不用着急。书虽替不得他，字却替得的。我们每日每人临一篇给他，搪塞过这一步儿去就完了，一…","so":0,"eo":0}]},{"chap":71,"ctitle":"第71章 嫌隙人有心生嫌隙 鸳鸯女无意遇鸳鸯","deeds":[{"surface":"宝玉","text":"话说贾母处两个丫头，匆匆忙忙来找宝玉，口里说道：“二爷快跟着我们走罢，老爷家来了。”宝玉听了，又喜又愁，只得忙忙换了衣服，前来请安。贾政正在贾母房中，连衣服未换，看见宝玉进来请安，心中自是喜欢，却又有些伤感之意。又叙了些任上的事情，贾母便说：“你也乏了，歇歇去罢。”贾政忙站起来，笑着答应了个“是”，又略站着说了几句话，才退出来。宝玉等也都跟过来。贾政自然问问他的工课，也就散了。","so":0,"eo":0},{"surface":"宝玉","text":"原来贾政回京复命，因是学差，故不敢先到家中。珍、琏、宝玉头一天便迎出一站去，接见了。贾政先请了贾母的安，便命都回家伺候。次日面圣，诸事完毕，才回家来。又蒙恩赐假一月，在家歇息。因年景渐老，事重身衰，又近因在外几年，骨肉离异，今得宴然复聚，自觉喜幸不尽。一应大小事务，一概亦付之度外，只是看书，闷了便与清客们下棋吃酒，或日间在里边，母子夫妻，共叙天伦之乐。","so":0,"eo":0},{"surface":"宝玉","text":"少时，菜已四献，汤始一道，跟来各家的放了赏，大家便更衣服入园来，另献好茶。南安太妃因问宝玉。贾母笑道：“今日几处庙里念保安延寿经，他跪经去了。”又问众小姐们。贾母笑道：“他们姊妹们病的病，弱的弱，见人腼腆，所以叫他们给我看屋子去了。有的是小戏子传了一班在那边厅上，陪着他姨娘家秭妹们也看戏呢。”南安太妃笑道：“既这样，叫人请来。”贾母回头命了凤姐儿，“去把史、薛、林四位姑娘带来。再只叫你三妹妹陪着来罢。”凤姐答应了，来至贾母这边，只见他姊…","so":0,"eo":0},{"surface":"宝玉","text":"至次日一早，见过贾母。众族人到齐，开戏。贾母高兴，又今日都是自己族中子侄辈，只便妆出来堂上受礼。当中独设一榻，引枕、靠背、脚踏俱全，自己歪在榻上。榻之前后左右，皆是一色的矮凳。宝钗、宝琴、黛玉、湘云、迎春、探春、惜春姊妹等围绕。因贾之母也带了女儿喜鸾，贾琼之母也带了女儿四姐儿，还有几房的孙女儿，大小共有二十来个，贾母独见喜鸾、四姐儿生得又好，说话行事与众不同，心中欢喜，便叫他两个也坐在榻前。宝玉却在榻上，与贾母捶腿。首席便是薛姨妈，下边…","so":0,"eo":0},{"surface":"宝玉","text":"贾母因问道：“前儿这些人家送礼来的，共有几家有围屏？”凤姐儿道：“共有十六家。有十二架大的，四架小的炕屏。内中只有甄家一架大屏，十二扇大红缎子刻丝‘满床笏’、一面泥金‘面寿图’的是头等。还有粤海将军邬家的一架玻璃的还罢了。”贾母道：“既这么样，这两架别动，好生搁着，我要送人的。”凤姐答应了。鸳鸯忽过来，向凤姐脸上细瞧。引的贾母问说：“你不认得他？只管瞧什么？”鸳鸯笑道：“我看他的眼肿肿的，所以我诧异。”贾母便叫“过来”，也细细的看。凤姐…","so":0,"eo":0},{"surface":"宝玉","text":"贾母忽想起留下的喜姐儿、四姐儿，叫人吩咐园中婆子们：“要和家里的姑娘一样照应。倘有人小看了他们，我听见可不饶。”婆子答应了，方要走时，鸳鸯道：“我说去罢。他们那里听他的话？”说着，便一径往园里来。先到稻香村中，李纨与尤氏都不在这里。问丫鬟们，都说：“在三姑娘那里呢。”鸳鸯回身，又来至晓翠堂，果见那园中人都在那里说笑。见他来了，都笑说：“你这会子又跑到这里做什么？”又让坐。鸳鸯笑道：“不许我逛逛么？”于是把方才的话说了一遍。李纨忙起身听了…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉道：“谁都象三妹妹多心多事？我常劝你总别听那些俗语、想那些俗事，只管安富尊荣才是，比不得我们，没这清福，应该混闹的。”尤氏道：“谁都象你是一心无挂碍，只知道和姊妹们玩笑，饿了吃，困了睡，再过几年，不过是这样，一点后事也不虑。”宝玉笑道：“我能够和姊妹们过一日，是一日，死了就完了，什么后事不后事。”李纨等都笑道：“这可又是胡说了。就算你是个没出息的，终老在这里，难道他姐儿们都不出门子罢？”尤氏笑道：“怨不得都说你空长了个好胎子，真真是…","so":0,"eo":0}]},{"chap":72,"ctitle":"第72章 王熙凤恃强羞说病 来旺妇倚势霸成亲","deeds":[{"surface":"宝玉","text":"且说彩霞因前日出去等父母择人，心中虽与贾环有旧，尚未作准。今日又见旺儿每每来求亲，早闻得旺儿之子酗酒赌博，而且容颜丑陋，不能如意。自此，心中越发懊恼，惟恐旺儿仗势作成，终身不遂，未免心中急躁。至晚间，悄命他妹子小霞进二门来找赵姨娘，问个端底。赵姨娘素日深与彩霞好，巴不得给了贾环，方有个膀臂，不承望王夫人又放出去了。每每调唆贾环去讨，一则贾环羞口难开，二则贾环也不在意，不过是个丫头，他去了将来自然还有好的，遂迁延住不肯说去，意思便丢开了手…","so":0,"eo":0}]},{"chap":73,"ctitle":"第73章 痴丫头误拾绣春囊 懦小姐不问累金凤","deeds":[{"surface":"宝玉","text":"却说怡红院中宝玉方才睡下，丫鬟们正欲各散安歇，忽听有人来敲院门。老婆子开了，见是赵姨娘房内的丫头名唤小鹊的，问他作什么，小鹊不答，直往里走，来找宝玉。只见宝玉才睡下，晴雯等犹在床边坐着，大家玩笑。见他来了，都问：“什么事，这时候又跑了来？”小鹊连忙悄向宝玉道：“我来告诉你个信儿，方才我们奶奶咕咕唧唧的，在老爷前不知说了你些个什么，我只听见‘宝玉’二字。我来告诉你，仔细明儿老爷和你说话罢。”一面说着，回身就走。袭人命人留他吃茶，因怕关门，…","so":0,"eo":0},{"surface":"宝玉","text":"自己读书，不值紧要，却累着一房丫鬟们都不能睡。袭人等在旁剪烛斟茶，那些小的都困倦起来，前仰后合。晴雯骂道：“什么小蹄子们！一个个黑家白日挺尸挺不够，偶然一次睡迟了些，就装出这个腔调儿来了。再这么着，我拿针扎你们两下子！”话犹未了，只听外间咕咚一声，急忙看时，原来是个小丫头坐着打腕，一头撞到壁上，从梦中惊醒。却正是晴雯说这话之时，他怔怔的只当是晴雯打了他一下子，遂哭着央说：“好姐姐，我再不敢了！”众人都笑起来。宝玉忙劝道：“饶他罢。原该叫…","so":0,"eo":0},{"surface":"宝玉","text":"话犹未了，只听春燕秋纹从后房门跑进来，口内喊说：“不好了！一个人打墙上跳下来了。”众人听说，忙问：“在那里？”即喝起人来，各处寻找。晴雯因见宝玉读书苦恼，劳费一夜神思，明日也未必妥当，心下正要替宝玉想个主意，好脱此难。忽然碰着这一惊，便生计向宝玉道：“趁这个机会，快装病，只说吓着了。”这话正中宝玉心怀。因叫起上夜的来，打着灯笼各处搜寻，并无踪迹，都说：“小姑娘们想是睡花了眼出去，风摇的树枝儿，错认了人。”晴雯便道：“别放屁！你们查的不严…","so":0,"eo":0},{"surface":"宝玉","text":"贾母闻知宝玉被吓，细问原由，众人不敢再隐，只得回明。贾母道：“我不料有此事。如今各处上夜的都不小还是小事，只怕他们就是贼也未可知。”当下邢夫人、尤氏等都过来请安，李纨、凤姐及妹妹等皆陪侍，听贾母如此说，都默无所答。独探春出位笑道：“近因凤姐姐身子不好几日，园里的人，比先放肆许多。先前不过是大家偷着一时半刻，或夜里坐更时三四个人聚在一处，或掷骰，或斗牌，小玩意儿，不过为着熬困起见。如今渐次放诞，竟开了赌局，甚至头家局主，或三十吊五十吊的大…","so":0,"eo":0},{"surface":"宝玉","text":"谁知迎春的乳母之媳玉儿媳妇为他婆婆得罪，来求迎春去讨情，他们正说金凤一事，且不进去。也因素日迎春懦弱，他们都不放在心上。如今见绣橘立意去回凤姐，又看这事脱不过去，只得进来，陪笑先向绣橘说：“姑娘，你别去生事。姑娘的金丝凤，原是我们老奶奶老糊涂了，输了几个钱，没的捞梢，所以借去，不想今日弄出事来。虽然这祥，到底主子的东西，我们不敢迟误，终久是要赎的。如今还要求姑娘看着从小儿吃奶的情，往老太太那边去讨一个情儿，救出他来才好。”迎春便说道：“…","so":0,"eo":0}]},{"chap":74,"ctitle":"第74章 惑奸谗抄检大观园 避嫌隙杜绝宁国府","deeds":[{"surface":"宝玉","text":"话说平儿听迎春说了，正自好笑，忽见宝玉也来了。原来管厨房柳家媳妇的妹子也因放头开赌，得了不是，因这园中有素和柳家的不好的，便又告出柳家的来，说和他妹子是伙计，赚了平分。因此凤姐要治柳家之罪。那柳家的听得此言，便慌了手脚，因思素与恰红院的人最为深厚，故走来悄悄的央求晴雯芳官等人，转告诉了宝玉。宝玉因思内中迎春的嬷嬷也现有此罪，不若来约同迎春去讨情，比自己独去单为柳家的说情又更妥当，故此前来。忽见许多人在此，见他来时，都问道：“你的病可好了…","so":0,"eo":0},{"surface":"宝玉","text":"凤姐即唤平儿进来，吩咐出去。一时，周瑞家的与吴兴家的、郑华家的、来旺家的、来喜家的现在五家陪房进来。王夫人正嫌人少，不能勘察，忽见邢夫人的陪房王善保家的走来，正是方才是他送香袋来的。王夫人向来看视邢夫人之得力心腹人等原无二意，今见他来打听此事，便向他说：“你去回了太太，也进园来照管照管，比别人强些。”王善保家的因素日进园去，那些丫鬟们不大趋奉他，他心里不自在，要寻他们的故事又寻不着，恰好生出这件事来，以为得了把柄！又听王夫人委托他，正碰…","so":0,"eo":0},{"surface":"宝玉","text":"小丫头答应了，走入怡红院，正值晴雯身上不好，睡中觉才起来，发闷呢，听如此说，只得跟了他来。素日晴雯不敢出头，因连日不自在，并没十分妆饰，自为无碍。及到了凤姐房中，王夫人一见他钗鬓松，衫垂带褪，大有春睡捧心之态，而且形容面貌恰是上月的那人，不觉勾起方才的火来。王夫人便冷笑道：“好个美人儿，真象个‘病西施’了。你天天作这轻狂样儿给谁看！你干的事，打量我不知道呢。我且放着你，自然明儿揭你的皮！宝玉今日可好些？”晴雯一听如此说，心内大异，便知有…","so":0,"eo":0},{"surface":"宝玉","text":"至晚饭后，待贾母安寝了，宝钗等入园时，王家的便请了凤姐一并进园，喝命将角门皆上锁，便从上夜的婆子处来抄检起。不过抄检些多馀攒下蜡烛灯油等物。王善保家的道：“这也是赃，不许动的，等明日回过太太再动。”于是先就到怡红院中，喝命关门。当下宝玉正因晴雯不自在，忽见这一干人来，不知为何直扑了丫头们的房门去。因迎出凤姐来，问是何故。凤姐道：“丢了一件要紧的东西，因大家混赖，恐怕有丫头们偷了，所以大家都查一查，去疑儿。”一面说，一面坐下吃茶。王家的等…","so":0,"eo":0},{"surface":"宝玉","text":"说着，一径出来，向王善保家的道：“我有一句话，不知是不是：要抄检只抄检咱们家的人，薛大姑娘屋里，断乎抄检不得的。”王善保家的笑道：“这个自然，岂有抄起亲戚家来的。”凤姐点头道：“我也这样说呢。”一头说，一头到了潇湘馆内。黛玉已睡了，忽报这些人来，不知为甚事。才要起来，只见凤姐巳走进来，忙按住他不叫起来，只说：“睡着罢，我们就走的。”这边且说些闲话。那王善保家的带了众人到了丫鬟房中，也一一开箱倒笼抄检了一番，因从紫鹃房中搜出两副宝玉往常换…","so":0,"eo":0}]},{"chap":75,"ctitle":"第75章 开夜宴异兆发悲音 赏中秋新词得佳谶","deeds":[{"surface":"宝玉","text":"原来贾珍近因居丧，不得游玩，无聊之极，便生了个破闷的法子，日间以习射为由，请了几位世家弟兄及诸富贵亲友来较射。因说：“白白的只管乱射终是无益，不但不能长进，且坏了式样；必须立了罚约，赌个利物，大家才有勉力之心。”因此，天香楼下箭道内立了鹄子，皆约定每日早饭后时射鹄子。贾珍不好出名，便命贾蓉做局家。这些都是少年，正是斗鸡走狗、问柳评花的一干游侠纨。因此大家议定，每日轮流做晚饭之主。天天宰猪割羊，屠鹅杀鸭，好似临潼斗宝的一般，都要卖弄自己家…","so":0,"eo":0},{"surface":"宝玉","text":"贾珍夫妻至晚饭后方过荣府来。只见贾赦、贾政都在贾母房里坐着说闲话儿，与贾母取笑呢。贾琏、宝玉、贾环、贾兰皆在地下侍立。贾珍来了，都一一见过，说了两句话，贾珍方在挨门小杌子上告了坐，侧着身子坐下。贾母笑问道：“这两日你宝兄弟的箭如何了？”贾珍忙起身笑道：“大长进了，不但式样好，而且弓也长了一个劲。”贾母道：“这也够了，且别贪力，仔细努伤着。”贾珍忙答应了几个“是”。贾母又道：“你昨日送来的月饼好。西瓜看着倒好，打开却也不怎么样。”贾珍陪笑…","so":0,"eo":0},{"surface":"宝玉","text":"当下园子正门俱已大开，挂着羊角灯。嘉荫堂月台上，焚着斗香，秉着烛，陈设着瓜果月饼等物。邢夫人等皆在里面久候。真是月明灯彩，人气香烟，晶艳氤氲，不可名状。地下铺着拜毡锦褥，贾母手上香拜毕，于是大家皆拜过。贾母便说：“赏月在山上最好。”因命在那山上的大花厅上去，众人听说，就忙着在那里铺设。贾母且在嘉荫堂中吃茶少歇，说些闲话。一时人回：“都齐备了。”贾母方扶着人上山来。王夫人等因回说：“恐石上苔滑，还是坐竹椅上去。”贾母道：“天天打扫，况且极…","so":0,"eo":0},{"surface":"宝玉","text":"于是贾政又说道：“这个怕老婆的人，从不敢多走一步。偏偏那日是八月十五，到街上买东西，便见了几个朋友，死活拉到家里去吃酒。不想吃醉了，便在朋友家睡着了。第二日醒了，后悔不及，只得来家赔罪。他老婆正洗脚，说：‘既是这样，你替我舔舔就饶你。’这男人只得给他舔，未免恶心要吐。他老婆便恼了，要打，说：‘你这样轻狂！’吓得他男人忙跪下求说：‘并不是奶奶的脚腌，只因昨儿喝多了黄酒，又吃了月饼馅子，所以今日有些作酸呢。’”说得贾母和众人都笑了。贾政忙又…","so":0,"eo":0},{"surface":"宝玉","text":"于是又击鼓，便从贾政起，可巧到宝玉鼓止。宝玉因贾政在坐，早已不安，偏又在他手中，因想：“说笑话，倘或说不好了，又说没口才；说好了，又说正经的不会，只惯贫嘴，更有不是。不如不说。”乃起身辞道：“我不能说，求限别的罢。”贾政道：“既这样，限个‘秋’字，就即景做一首诗。好便赏你，若不好，明日仔细！”贾母忙道：“好好的行令，怎么又做诗？”贾政陪笑道：“他能的。”贾母听说：“既这样，就做。快命人取纸笔来。”贾政道：“只不许用这些‘水’‘晶’‘冰’…","so":0,"eo":0},{"surface":"宝玉","text":"当下贾兰见奖励宝玉，他便出席，也做一首，呈与贾政看。贾政看了，更觉欣喜。遂并讲与贾母听时，贾母也十分欢喜，也忙令贾政赏他。于是大家归坐，复行起令来。","so":0,"eo":0},{"surface":"宝玉","text":"贾母亦不好再提，且行令。不料这花却在贾环手里。贾环近日读书稍进，亦好外务。今见宝玉做诗受奖，他便技痒，只当着贾政，不敢造次。如今可巧花在手中，便也索纸笔来，立就一绝，呈与贾政。贾政看了，亦觉罕异，只见词句中终带着不乐读书之意，遂不悦道：“可见是弟兄了：发言吐意，总属邪派。古人中有‘二难’，你两个也可以称‘二难’了。就只不是那一个‘难’字，却是做‘难以教训’‘难’字讲才好。哥哥是公然温飞卿自居，如今兄弟又自为曹唐再世了。”说得众人都笑了。…","so":0,"eo":0}]},{"chap":76,"ctitle":"第76章 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞","deeds":[{"surface":"宝玉","text":"原来黛玉和湘云二人并未去睡。只因黛玉见贾府中许多人赏月，贾母犹叹人少，又想宝钗姐妹家去，母女弟兄自去赏月，不觉对景感怀，自去倚栏垂泪。宝玉近因晴雯病势甚重，诸务无心，王夫人再四遣他去睡，他从此去了。探春又因近日家事恼着，无心游玩。虽有迎春、惜春二人，偏又素日不大甚合，所以只剩湘云一人宽慰他。因说：“你是个明白人，还不自己保养。可恨宝姐姐、琴妹妹天天说亲道热，早已说今年中秋要大家一处赏月，必要起诗社，大家联句。到今日，便扔下咱们自己赏月去…","so":0,"eo":0}]},{"chap":77,"ctitle":"第77章 俏丫鬟抱屈夭风流 美优怜斩情归水月","deeds":[{"surface":"宝玉","text":"可巧正值宝玉从外头进来，一见带了司棋出去，又见后面抱着许多东西，料着此去再不能来了，因听见上夜的事，并晴雯的病也因那日加重，细问晴雯，又不说是为何。今见司棋亦走，不觉如丧魂魄，因忙拦住问道：“那里去？”周瑞家的等皆知宝玉素昔行为，又恐唠叨误事，因笑道：“不干你事，快念书去罢。”宝玉笑道：“姐姐们且站一站，我有道理。”周瑞家的便道：“太太吩咐不许少捱时刻。又有什么道理？我们只知道太太的话，管不得许多。”司棋见了宝玉，因拉住哭道：“他们做不…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉又恐他们去告舌，恨的只瞪着他们，看走远了，方指着恨道：“奇怪，奇怪！怎么这些人只一嫁了汉子，染了男人的气味，就这样混账起来，比男人更可杀了！”守园门的婆子听了，也不禁好笑起来，因问道：“这样说，凡女儿个个是好的了，女人个个是坏的了？”宝玉发恨道：“不错，不错！”正说着，只见几个老婆子走来，忙说道：“你们小心传齐了伺候着。此刻太太亲自到园里查人呢。”又吩咐：“快叫怡红院晴雯姑娘的哥嫂来，在这里等着，领出他妹子去。”因又笑道：“阿弥陀佛…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉及到了怡红院，只见一群人在那里。王夫人在屋里坐着，一脸怒色，见宝玉也不理。晴雯四五日水米不曾沾牙，如今现打炕上拉下来，蓬头垢面的，两个女人搀架起来去了。王夫人吩咐：“把他贴身的衣服撂出去，馀者留下，给好的丫头们穿。”又命：“把这里所有的丫头们都叫来！”一一过目。","so":0,"eo":0},{"surface":"宝玉","text":"原来王夫人惟怕丫头们教坏了宝玉，乃从袭人起以至于极小的粗活小丫头们，个个亲自看了一遍。因问：“谁是和宝玉一日的生日？”本人不敢答言。李嬷嬷指道：“这一个蕙香，又叫做四儿的，是同宝玉一日生日的。”王夫人细看了一看，虽比不上晴雯一半，却有几分水秀，视其行止，聪明皆露在外面，且也打扮的不同。王夫人冷笑道：“这也是个没廉耻的货！他背地里说的同日生日就是夫妻，这可是你说的？打量我隔的远，都不知道呢。可知我身子虽不大来，我的心耳神意时时都在这里。","so":0,"eo":0},{"surface":"宝玉","text":"难道我统共一个宝玉，就白放心凭你们勾引坏了不成？”这个四儿见王夫人说着他素日和宝玉的私话，不禁红了脸，低头垂泪。王夫人即命：“也快把他家人叫来，领出去配人。”又问：“那芳官呢？”芳官只得过来。王夫人道：“唱戏的女孩子，自然更是狐狸精了！上次放你们，你们又不愿去，可就该安分守己才是。你就成精鼓捣起来，调唆宝玉，无所不为！”芳官等辩道：“并不敢调唆什么了。”王夫人笑道：“你还强嘴！你连你干娘都压倒了，岂止别人。”因喝命：“唤他干娘来领去！就…","so":0,"eo":0},{"surface":"宝玉","text":"王夫人又满屋里搜检宝玉之物。凡略有眼生之物，一并命收卷起来，拿到自己房里去了。因说：“这才干净，省得旁人口舌。”又吩咐袭人、麝月等人：“你们小心，往后再有一点分外之事，我一概不饶！因叫人查看了，今年不宜迁挪，暂且挨过今年，明年一并给我仍旧搬出去，才心净。”说毕，茶也不吃，遂带领众人，又往别处去阅人。","so":0,"eo":0},{"surface":"宝玉","text":"暂且说不到后文，如今且说宝玉，只道王夫人不过来搜检搜检，无甚大事，谁知竟这样雷嗔电怒的来了。所责之事，皆系平日私语，一字不爽，料必不能挽回的。虽心下恨不能一死，但王夫人盛怒之际，自不敢多言。一直跟送王夫人到沁芳亭，王夫人命：“回去好生念念那书！仔细明儿问你。才已发下狠了。”宝玉听如此说，才回来。一路打算：“谁这样犯舌？况这里事也无人知道，如何就都说着了？”一面想，一面进来，只见袭人在那里垂泪。且去了第一等的人，岂不伤心？便倒在床上大哭起…","so":0,"eo":0},{"surface":"宝玉","text":"袭人知他心里别的犹可，独有晴雯是第一件大事，乃劝道：“哭也不中用。你起来，我告诉你：晴雯已经好了，他这一家去，倒心净养几天。你果然舍不得他，等太太气消了，你再求老太太，慢慢的叫进来，也不难。太太不过偶然听了别人的闲言，在气头上罢了。”宝玉道：“我究竟不知晴雯犯了什么迷天大罪！”袭人道：“太太只嫌他生的太好了，未免轻狂些。太太是深知这样美人似的人，心里是不能安静的，所以很嫌他。象我们这粗粗笨笨的倒好。”宝玉道：“美人似的，心里就不安静么？…","so":0,"eo":0}]},{"chap":78,"ctitle":"第78章 老学士闲征姽婳词 痴公子杜撰芙蓉诔","deeds":[{"surface":"宝玉","text":"话说两个尼姑领了芳官等去后，王夫人便往贾母处来。见贾母喜欢，便趁便回道：“宝玉屋里有个晴雯，那个丫头也大了，而且一年之间病不离身。我常见他比别人分外淘气，也懒，前日又病倒了十几天，叫大夫瞧，说是女儿痨，所以我就赶着叫他下去了。若养好了，也不用叫他进来，就赏他家配人去也罢了。再那几个学戏的女孩子，我也做主放了。一则他们都会戏，口里没轻没重，只会混说，女孩儿们听了，如何使得？二则他们唱会子戏，白放了他们，也是应该的。况丫头们也太多，若说不够…","so":0,"eo":0},{"surface":"宝玉","text":"一时，只见迎春妆扮了前来告辞过去。凤姐也来请早安，伺候早饭。又说笑一回，贾母歇晌，王夫人便唤了凤姐，问他丸药可曾配来。凤姐道：“还不曾呢，如今还是吃汤药，太太只管放心，我已大好了。”王夫人见他精神复初，也就信了，因告诉撵逐晴雯等事。又说：“宝丫头怎么私自回家去了？你们都不知道。我前儿顺路都查了一查，谁知兰小子的这一个新进来的奶子，也十分的妖调，也不喜欢他。我说给你大嫂子了，好不好，叫他各自去罢。我因问你大嫂子，‘宝丫头出去，难道你们不知…","so":0,"eo":0},{"surface":"宝玉","text":"说话之间，只见宝玉已回来了，因说：“老爷还未散，恐天黑了，所以先叫我们回来了。”王夫人忙问：“今日可丢了丑了没有？”宝玉笑道：“不但不丢丑，拐了许多东西来。”接着就有老婆子们从二门上小厮手内接进东西来。王夫人一看时，只见扇子三把，扇坠三个，笔墨共六匣，香珠三串，玉绦环三个。宝玉说道：“这是梅翰林送的，那是杨侍郎送的，这是李员外送的：每人一分。”说着，又向怀中取出一个檀香小护身佛来，说：“这是庆国公单给我的。”王夫人又问在席何人，做何诗词…","so":0,"eo":0},{"surface":"宝玉","text":"当下麝月、秋纹已带了两个丫头来等候。见宝玉辞了贾母出来，秋纹便将墨笔等物拿着，随宝玉进园来。宝玉满口里说：“好热。”一壁走一面便摘冠解带，将外面的大衣服都脱下来，麝月拿着，只穿着一件松花绫子夹袄，襟内露出血点般大红裤子来。秋纹见这条红裤是晴雯针线，因叹道：“真是‘物在人亡’了！”麝月将秋纹拉了一把，笑道：“这裤子配着松花色袄儿、石青靴子，越显出靛青的头、雪白的脸来了。”宝玉在前，只装没听见，又走了两步便止步道：“我要走一走，这怎么好？”…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，正中心怀，便让他二人去了。他便带了两个小丫头到一块山子石后头，悄问他二人道：“自我去了，你袭人姐姐打发人去瞧晴雯姐姐没有？”这一个答道：“打发宋妈瞧去了。”宝玉道：“回来说什么？”小丫头道：“回来说，晴雯姐姐直着脖子叫了一夜，今日早起，就闭了眼住了口，世事不知，只有倒气的分儿了。”宝玉忙道：“一夜叫的是谁？”小丫头道：“一夜叫的是娘。”宝玉拭泪道：“还叫谁？”小丫头说：“没有听见叫别人了。”宝玉道：“你糊涂。想必没有听真。”旁…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了这话，不但不为怪，亦且去悲生喜，便回过头来，看着那芙蓉笑道：“此花也须得这样一个人去主管。我就料定他那样的人必有一番事业！虽然超生苦海，从此再不能相见了。”免不得伤感思念。因又想：“虽然临终未见，如今且去灵前一拜，也算尽这五六年的情意。”想毕，忙至屋里，正值麝月、秋纹找来。宝玉又自穿戴了，只说去看黛玉，遂一人出园，往前次看望之处来。意为停柩在内，谁知他哥嫂见他一咽气，便回了进去，希图早早些得几两发送例银。王夫人闻知，便命赏了十两…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉走来扑了一个空，站了半天，并无别法，只得复身进入园中。及回至房中，甚觉无味，因顺路来找黛玉，不在房里。问其何往，丫鬟们回说：“往宝姑娘那里去了。”宝玉又至蘅芜院中，只见寂静无人，房内搬出，空空落落，不觉吃一大惊，才想起前日仿佛听见宝钗要搬出去，只因这两日工课忙就混忘了，这时看见如此，才知道果然搬出。怔了半天，因转念一想：“不如还是和袭人厮混，再与黛玉相伴。只这两三个人，只怕还是同死同归。”想毕，仍往潇湘馆来。偏黛玉还未回来。正在不知…","so":0,"eo":0},{"surface":"宝玉","text":"说话间，宝玉、贾环、贾兰俱起身来看了题目。贾政命他三人各吊一首，谁先做成者赏，佳者额外加赏。贾环、贾兰二人近日当着许多人皆做过几首了，胆量愈壮。今看了题目，遂自去思索。一时贾兰先有了，贾环生恐落后，也就有了。二人皆已录出，宝玉尚自出神。","so":0,"eo":0}]},{"chap":79,"ctitle":"第79章 薛文起悔娶河东吼 贾迎春误嫁中山狼","deeds":[{"surface":"宝玉","text":"话说宝玉才祭完了晴雯，只听花阴中有个人声，倒吓了一跳。细看不是别人，却是黛玉，满面含笑，口内说道：“好新奇的祭文！可与《曹娥碑》并传了。”宝玉听了，不觉红了脸，笑答道：“我想着世上这些祭文，都过于熟烂了，所以改个新样。原不过是我一时的玩意儿，谁知被你听见了。有什么大使不得的，何不改削改削？”黛玉道：“原稿在那里？倒要细细的看看。长篇大论，不知说的是什么。只听见中间两句，什么‘红绡帐里，公子情深；黄土陇中，女儿命薄’这一联意思却好。只是‘…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉听了，陡然变色。虽有无限狐疑，外面却不肯露出，反连忙含笑点头称妙，说：“果然改得好。再不必乱改了，快去干正经事罢。刚才太太打发人叫你，说明儿一早过大舅母那边去呢。你二姐姐已有人家求准了，所以叫你们过去呢。”宝玉忙道：“何必如此忙？我身上也不大好，明儿还未必能去呢。”黛玉道：“又来了，我劝你把脾气改改罢。一年大，二年小，……”一面说话一面咳嗽起来。宝玉忙道：“这里风冷，咱们只顾站着，凉着呢可不是玩的，快回去罢。”黛玉道：“我也家去歇息…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉却未曾会过这孙绍祖一面的，次日只得过去，聊以塞责。只听见那娶亲的日子甚近，不过今年就要过门的，又见邢夫人等回了贾母，将迎春接出大观园去，越发扫兴。每每痴痴呆呆的，不知作何消遣。又听说要陪四个丫头过去，更又跌足道：“从今后这世上又少了五个清净人了！”因此天天到紫菱洲一带地方徘徊瞻顾。见其轩窗寂寞，屏帐倏然，不过只有几个该班上夜的老妪。再看那岸上的蓼花苇叶，也都觉摇摇落落，似有追忆故人之态，迥非素常逞妍斗色可比。所以情不自禁，乃信口吟成…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉方才吟罢，忽闻背后有人笑道：“你又发什么呆呢？”宝玉回头忙看是谁，原来是香菱。宝玉忙转身笑问道：“我的姐姐，你这会子跑到这里来做什么？许多日子也不进来逛逛。”香菱拍手笑嘻嘻的说道：“我何曾不要来。如今你哥哥回来了，那里比先时自由自在的了。才刚我们太太使人找你凤姐姐去，竟没有找着，说往园子里来了。我听见这个话，我就讨了这个差进来找他。遇见他的丫头，说在稻香村呢。如今我往稻香村去，谁知又遇见了你。我还要问你，袭人姐姐这几日可好？怎么忽然…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉见他这样，便怅然如有所失，呆呆的站了半日，只得没精打彩，还入怡红院来。一夜不曾安睡，种种不宁。次日便懒进饮食，身体发热。也因近日抄检大观园、逐司棋、别迎春、悲晴雯等羞辱、惊恐、悲凄所致，兼以风寒外感，遂致成疾，卧床不起。贾母听得如此，天天亲来看视。王夫人心中自悔，不合因晴雯过于逼责了他。心中虽如此，脸上却不露出，只吩咐众奶娘等好生伏侍看守。一日两次带进医生来诊脉下药。一月之后，方才渐渐的痊愈。好生保养过百日，方许动荤腥油面，方可出门…","so":0,"eo":0},{"surface":"宝玉","text":"且说香菱，自那日抢白了宝玉之后，自为宝玉有意唐突，“从此倒要远避他些才好。”因此，以后连大观园也不轻易进来了，日日忙乱着。薛蟠娶过亲，因为得了护身符，自己身上分去责任，到底比这样安静些；二则又知是个有才有貌的佳人，自然是典雅和平的。因此，心里盼过门的日子，比薛蟠还急十倍呢。好容易盼得一日娶过来，他便十分殷勤小心伏侍。","so":0,"eo":0}]},{"chap":80,"ctitle":"第80章 美香菱屈受贪夫棒 王道士胡诌妒妇方","deeds":[{"surface":"宝玉","text":"此时宝玉已过了百日，出门行走。亦曾过来见过金桂，举止形容也不怪厉，一般是鲜花嫩柳，与众姊妹不差上下，焉得这等情性，可为奇事。因此，心中纳闷。这日，与王夫人请安去，又正遇见迎春奶娘来家请安，说起孙绍祖甚属不端，“姑娘惟有背地里淌眼泪，只要接了家来，散荡两日。”王夫人因说：“我正要这两日接他去，只是七事人事的都不遂心，所以就忘了。前日宝玉去了，回来也曾说过的。明日是个好日子，就接他去。”正说时，贾母打发人来找宝玉，说：“明儿一早往天齐庙还愿…","so":0,"eo":0},{"surface":"宝玉","text":"次日一早，梳洗穿戴已毕，随了两三个老嬷嬷，坐车出西城门外天齐庙烧香还愿。这庙里已于昨日预备停妥的。宝玉天性怯懦，不敢近狰狞神鬼之像，是以忙忙的焚过纸马钱粮，便退至道院歇息。一时吃饭毕，众嬷嬷和李贵等围随宝玉到各处玩耍了一回，宝玉困倦，复回至净室安歇。众嬷嬷生恐他睡着了，便请了当家的老王道士来陪他说话儿。这老道士专在江湖上卖药，弄些海上方治病射利，庙外现挂着招牌，丸散膏药，色色俱备。亦长在宁、荣二府走动惯熟，都给他起了个混号，唤他做“王一…","so":0,"eo":0},{"surface":"宝玉","text":"王一贴道：“这叫做‘疗妒汤’：用极好的秋梨一个，二钱冰搪，一钱陈皮，水三碗，梨熟为度。每日清晨吃这一个梨，吃来吃去就好了。”宝玉道：“这也不值什么。只怕未必见效。”王一贴道：“一剂不效，吃十剂，今日不效，明日再吃；今年不效，明年再吃。横竖这三味药都是润肺开胃不伤人的，甜丝丝的，又止咳嗽，又好吃。吃过一百岁，人横竖是要死的，死了还妒什么？那时就见效了。”说着，宝玉、焙茗都大笑不止，骂“油嘴的牛头”。王一贴道：“不过是闲着解午盹罢了，有什么…","so":0,"eo":0},{"surface":"宝玉","text":"那时迎春已来家好半日，孙家婆娘媳妇等人已待晚饭，打发回家去了。迎春方哭哭啼啼，在王夫人房中诉委屈，说：“孙绍祖一味好色，好赌，酗酒，家中所有的媳妇丫头，将及淫遍。略劝过两三次，便骂我是‘醋汁子老婆拧出来的’。又说老爷曾收着五千银子，不该使了他的。如今他来要了两三次不得，便指着我的脸说道：‘你别和我充夫人娘子！你老子使了我五千银子，把你准折卖给我的。好不好，打你一顿。撵到下房里睡去。当日有你爷爷在时，希冀上我们的富贵，赶着相与的。论理我和…","so":0,"eo":0}]},{"chap":81,"ctitle":"第81章 占旺相四美钓游鱼 奉严词两番入家塾","deeds":[{"surface":"宝玉","text":"且说迎春归去之后，邢夫人象没有这事，倒是王夫人抚养了一场，却甚实伤感，在房中自己叹息了一回。只见宝玉走来请安，看见王夫人脸上似有泪痕，也不敢坐，只在傍边站着。王夫人叫他坐下，宝玉才捱上炕来，就在王夫人身旁坐了。王夫人见他呆呆的瞅着，似有欲言不言的光景，便道：“你又为什么这样呆呆的？”宝玉道：“并不为什么。只是昨儿听见二姐姐这种光景，我实在替他受不得。虽不敢告诉老太太，却这两夜只是睡不着。我想咱们这样人家的姑娘，那里受得这样的委屈？况且二…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉正在梳洗才毕，见宝玉这个光景倒吓了一跳，问：“是怎么了？合谁怄了气了？”连问几声。宝玉低着头，伏在桌子上呜呜咽咽，哭的说不出话来。黛玉便在椅子上怔怔的瞅着他，一会子问道：“到底是别人合你怄了气了，还是我得罪了你呢？”宝玉摇手道：“都不是，都不是。”黛玉道：“那么着，为什么这么伤心起来？”宝玉道：“我只想着，咱们大家越早些死的越好，活着真真没有趣儿。”黛玉听了这话，更觉惊讶，道：“这是什么话？你真正发了疯不成？”宝玉道：“也并不是我发…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃刚进茶来，见他两个这样，正在纳闷，只见袭人进了，进来看见宝玉，便道：“二爷在这里呢么，老太太那里叫呢。我估量着二爷就是在这里。”黛玉听见是袭人，便欠身起来让坐。黛玉的两个眼圈儿已经哭的通红了。宝玉看见，道：“妹妹，我刚才说的，不过是些呆话，你也不用伤心了。要想我的话时，身子更要保重才好。你歇歇儿罢。老太太那边叫我，我看看去就来。”说着，往外走了。袭人悄问黛玉道：“你两个又为什么？”黛玉道：“他为他二姐姐伤心，我是刚才眼睛发痒揉的，并…","so":0,"eo":0},{"surface":"宝玉","text":"到了午后，宝玉睡了中觉起来．甚觉无聊，随手拿了一本书看。袭人见他看书，忙去沏茶伺候。谁知宝玉拿的那本书却是《古乐府》，随手翻来，正看见曹孟德“对酒当歌，人生几何”一首，不觉刺心。因放下这一本，又拿一本看时，却是晋文。翻了几页，忽然把书掩上，托着腮只管痴痴的坐着。袭人倒了茶来，见他这般光景，便道：“你为什么又不看了？”宝玉也不答言，接过茶来，喝了一口，便放下了。袭人一时摸不着头脑，也只管站在傍边，呆呆的看着他。忽见宝玉站起来，嘴里咕咕哝哝…","so":0,"eo":0},{"surface":"宝玉","text":"一时走到沁芳亭，但见萧疏景象，人去房空。又来至蘅芜院，更是香草依然，门窗掩闭。转过藕香榭来，远远的只见几个人，在蓼溆一带栏干上靠着，有几个小丫头蹲在地下找东西。宝玉轻轻的走在假山背后听着。只听一个说道：“看他上来不上来。”好似李纹的语音。一个笑道：“好，下去了。我知道他不上来的。”这个却是探春的声音。一个又道：“是了。姐姐你别动，只管等着，他横竖上来。”一个又说：“上来了。”这两个是李绮、邢岫烟的声儿。宝玉忍不住，拾了一块小砖头儿，往那…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉道：“咱们大家今儿钓鱼，占占谁的运气好？看谁钓得着就是他今年的运气好，钓不着就是他今年运气不好。咱们谁先钓？”探春便让李纹，李纹不肯。探春笑道：“这样就是我先钓。”回头向宝玉说道：“二哥哥，你再赶走了我的鱼，我可不依了。”宝玉道：“头里原是我要唬你们玩，这会子你只管钓罢。”探春把丝绳抛下，没十来句话的工夫，就有一个杨叶窜儿吞着钩子，把漂儿坠下去。探春把竿一挑，往地下一撩，却是活迸的。侍书在满地上乱抓，两手捧着搁在小磁坛内，清水养着。…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，只见麝月慌慌张张的跑来说：“二爷，老太太醒了，叫你快去呢。”五个人都唬了一跳。探春便问麝月道：“老太太叫二爷什么事？”麝月道：“我也不知道。就只听见说是什么闹破了，叫宝玉来问；还要叫琏二奶奶一块儿查问呢。”吓得宝玉发了一回呆，说道：“不知又是那个丫头遭了瘟了。”探春道：“不知什么事，二哥哥你快去。有什么信儿，先叫麝月来告诉我们一声儿。”说着便同李纹、李绮、岫烟走了。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉走到贾母房中，只见王夫人陪着贾母摸牌。宝玉看见无事，才把心放下了一半。贾母见他进来，便问道：“你前年那一次得病的时候，后来亏了一个疯和尚和个瘸道士治好了的。那会子病里你觉得是怎么样？”宝玉想了一回道：“我记得得病的时候儿，好好的站着，倒象背地里有人把我拦头一棍，疼的眼睛前头漆黑，看见满屋子里都是些青面獠牙，拿刀举棒的恶鬼。躺在炕上，觉着脑袋上加了几个脑箍似的。以后便疼的任什么不知道了。到好的时候．又记得堂屋里一片金光，直照到我床上来…","so":0,"eo":0}]},{"chap":82,"ctitle":"第82章 老学究讲义警顽心 病潇湘痴魂惊恶梦","deeds":[{"surface":"宝玉","text":"话说宝玉下学回来，见了贾母。贾母笑道：“好了，如今野马上了笼头了。去罢，见见你老爷去来，散散儿去罢。”宝玉答应着，去见贾政。贾政道：“这早晚就下学了么？师父给你定了工课没有？”宝玉道：“定了，早起理书，饭后写字，晌午讲书念文章。”贾政听了，点点头儿，因道：“去罢，还到老太太那边陪着坐坐去。你也该学些人功道理，别一味的贪玩。晚上早些睡，天天上学，早些起来。你听见了？”宝玉连忙答应几个“是”，退出来，忙忙又去见王夫人，又到贾母那边打了个照面…","so":0,"eo":0},{"surface":"宝玉","text":"刚进门口，便拍着手笑道：“我依旧回来了。”猛可里倒唬了黛玉一跳。紫鹃打起帘子，宝玉进来坐下。黛玉道：“我恍惚听见你念书去了，这么早就回来了？”宝玉道：“嗳呀了不得！我今儿不是被老爷叫了念书去了么？心上倒象没有和你们见面的日子了。好容易熬了一天，这会子瞧见你们，竟如死而复生一样。真真古人说‘一日三秋’，这话再不错的。“黛玉道：“你上头去过了没有？”宝玉道：“都去过了。”黛玉道：“别处呢？”宝玉道：“没有。”黛玉道：“你也该瞧瞧他们去。”宝…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，忽听外面两个人说话，却是秋纹和紫鹃。只听秋纹说：“袭人姐姐叫我老太太那里接去，谁知却在这。”紫鹃道：“我们这里才沏了茶，索性让他喝了再去。”说着，二人一齐进来。宝玉和秋纹笑道：“我就过去。又劳动你来找。”秋纹未及答言，只见紫鹃道：“你快喝了茶去罢。人家都想了一天了。”秋纹啐道：“呸！好混账丫头。”说的大家都笑了。宝玉起身，才辞了出来。黛玉送到屋门口儿，紫鹃在台阶下站着，宝玉出去，才回房里来。","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉回到怡红院中，进了屋子，只见袭人从里间迎出来，便问：“回来了么？”秋纹应道：“二爷早来了，在林姑娘那边来着。”宝玉道：“今日有事没有？”袭人道：“事却没有。方才太太叫鸳鸯姐姐来吩咐我们，如今老爷发狠叫你念书，如有丫鬟们再敢和你玩笑，都要照着晴雯、司棋的例办。我想伏侍你一场，赚了这些言语，也没什么趣儿。”说着，便伤起心来。宝玉忙道：“好姐姐，你放心，我只好生念书，太太再不说你们了。我今儿晚上还要看书，明日师父叫我讲书呢。我要使唤，…","so":0,"eo":0},{"surface":"宝玉","text":"直到红日高升，方才起来。宝玉道：“不好了，晚了。”急忙梳洗毕，问了安，就往学里来了。代儒已经变着脸，说：“怪不得你老爷生气，说你没出息。第二天你就懒惰。这是什么时候才来？”宝玉把昨儿发烧的话说了一遍，方过去了，原旧念书。到了下晚，代儒道：“宝玉，有一章书，你来讲讲。”宝玉过来一看，却是“后生可畏”章。宝玉心上说：“这还好，幸亏不是《学》《庸》。”问道：“怎么讲呢？”代儒道：“你把节旨句子细细儿讲来。”宝玉把这章先朗朗的念了一遍，说：“这…","so":0,"eo":0},{"surface":"宝玉","text":"代儒道：“还有一章，你也讲一讲。”代儒往前提了一篇，指给宝玉。宝玉看时：“吾未见好德如好色者也”。宝玉觉得这一章却有些刺心，便陪笑道：“这句话没有什么讲头。”代儒道：“胡说。譬如场中出了这个题目，也说没有做头么？”宝玉不得已，讲道：“是圣人看见人不肯好德，见了色，便好的了不得，殊不想德是性中本有的东西，人偏都不肯好他。至于那个色呢，虽也是从先天中带来，无人不好的，但是德乃天理，色是人欲，人那里肯把天理好的象人欲似的？孔子虽是叹息的话，又…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉上学之后，怡红院中甚觉清净闲暇，袭人倒可做些活计，拿着针线要绣个槟榔包儿。想这如今宝玉有了功课，丫头们可也没有饥荒了，早要如此，晴雯何至弄到没有结果？兔死狐悲，不觉叹起气来。忽又想到自己终身，本不是宝玉的正配，原是偏房。宝玉的为人却还拿得住，只怕娶了一个利害的，自己便是尤二姐、香菱的后身。素来看着贾母，王夫人光景，及凤姐儿往往露出话来，自然是黛玉无疑了。那黛玉就是个多心人。想到此际，脸红心热，拿着针不知戳到那里去了。便把活计放下…","so":0,"eo":0},{"surface":"宝玉","text":"”说着，将一个瓶儿递给雪雁，又回头看看黛玉，因笑着向袭人说：“怨不得我们太太说，这林姑娘和你们宝二爷是一对儿，原来真是天仙似的！”袭人见他说话造次，连忙岔道：“妈妈，你乏了，坐坐吃茶罢。”那婆子笑嘻嘻的道：“我们那里忙呢。都张罗琴姑娘的事呢。姑娘还有两瓶荔枝，叫给宝二爷送去。”说着，颤颤巍巍告辞出去。黛玉虽恼这婆子方才冒撞，但因是宝钗使来的，也不好怎么样他，等他出了屋门，才说一声道：“给你们姑娘道费心。”那老婆子还只管嘴里咕咕哝哝的说：…","so":0,"eo":0}]},{"chap":83,"ctitle":"第83章 省宫闱贾元妃染恙 闹闺阃薛宝钗吞声","deeds":[{"surface":"宝玉","text":"只听窗外悄悄问道：“紫鹃妹妹在家么？”雪雁连忙出来，见是袭人，因悄悄说道：“姐姐屋里坐着。”袭人也便悄悄问道：“姑娘怎么着？”一面走，一面雪雁告诉夜间及方才之事。袭人听了这话，也唬怔了，因说道：“怪道刚才翠缕到我们那边说你们姑娘病了，唬的宝二爷连忙打发我来，看看是怎么样。”正说着，只见紫鹃从里间掀起帘子，望外看见袭人，招手儿叫他。袭人轻轻走过来，问道：“姑娘睡着了吗？”紫鹃点点头儿，问道：“姐姐才听见说了？”袭人也点点头儿，蹙着眉道：“…","so":0,"eo":0},{"surface":"宝玉","text":"且说探春湘云出了潇湘馆，一路往贾母这边来。探春因嘱咐湘云道：“妹妹回来见了老太太，别象刚才那样冒冒失失的了。”湘云点头笑道：“知道了。我头里是叫他唬的忘了神了。”说着已到贾母那边。探春因提起黛玉的病来。贾母听了，自是心烦，因说道：“偏是这两个‘玉’儿多病多灾的。林丫头一来二去的大了，他这个身子也要紧。我看那孩子太是个心细。”众人也不敢答言。贾母便向鸳鸯道：“你告诉他们，明儿大夫来，瞧了宝玉，叫他再到林姑娘那屋里去。”鸳鸯答应着出来，告诉…","so":0,"eo":0},{"surface":"宝玉","text":"到了次日，大夫来了。瞧了宝玉，不过说饮食不调，着了点儿风邪，没大要紧，疏散疏散就好了。这里王夫人凤姐等，一面遣人拿了方子回贾母，一面使人到潇湘馆，告诉说：“大夫就过来。”紫鹃答应了，连忙给黛玉盖好被窝，放下帐子，雪雁赶着收拾房里的东西。一时贾琏陪着大夫进来了，便说道：“这位老爷是常来的，姑娘们不用回避。”老婆子打起帘子，贾琏让着，进入房中坐下。贾琏道：“紫鹃姐姐，你先把姑娘的病势向王老爷说说。”王大夫道：“且慢说。等我诊了脉，听我说了，…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾家的车辆轿马在外西垣门口歇下等着。一会儿，有两个内监出来，说道：“贾府省亲的太太奶奶们着令入宫探问。爷们俱着令内宫门外请安，不得入见。”门上人叫：“快进去。”贾府中四乘轿子跟着小内监前行，贾家爷们在轿后步行跟着，令众家人在外等候。走近宫门口，只见几个老公在门上坐着，见他们来了，便站起来说道：“贾府爷们至此。”贾赦、贾政便捱次立定。轿子抬至宫门口，便都出了轿，早有几个小内监引路，贾母等各有丫头扶着步行。走至元妃寝宫，只见奎壁辉煌，琉…","so":0,"eo":0}]},{"chap":84,"ctitle":"第84章 试文字宝玉始提亲 探惊风贾环重结怨","deeds":[{"surface":"宝玉","text":"这里贾母忽然想起，合贾政笑道：“娘娘心里却甚实惦记着宝玉，前儿还特特的问他来着呢。”贾政陪笑道：“只是宝玉不大肯念书，辜负了娘娘的美意。”贾母道：“我倒给他上了个好儿，说他近日文章都做上来了。”贾政笑道：“那里能象老太太的话呢。”贾母道：“你们时常叫他出去作诗作文，难道他都没作上来么？小孩子家，慢慢的教导他。可是人家说的：‘胖子也不是一口儿吃的。’”贾政听了这话，忙陪笑道：“老太太说的是。”贾母又道：“提起宝玉，我还有一件事和你商量：如…","so":0,"eo":0},{"surface":"宝玉","text":"几句话说得贾政心中甚实不安，连忙陪笑道：“老太太看的人也多了，既说他好，有造化，想来是不错的。只是儿子望他成人的性儿太急了一点，或者竟合古人的话相反，倒是‘莫知其子之美’了。”一句话把贾母也怄笑了，众人也都陪着笑了。贾母因说道：“你这会子也有了几岁年纪，又居着官，自然越历练越老成。”说到这里，回头瞅着邢夫人合王夫人，笑道：“想他那年轻的时候，那一种古怪脾气，比宝玉还加一倍呢。直等娶了媳妇，才略略的懂了些人事儿。如今只抱怨宝玉。这会子，我…","so":0,"eo":0},{"surface":"宝玉","text":"却说邢夫人自去了。贾政同王夫人进入房中。贾政因提起贾母方才的话来，说道：“老太太这么疼宝玉。毕竟要他有些实学，日后可以混得功名才好，不枉老太太疼他一场，也不至遭塌了人家的女儿。”王夫人道：“老爷这话自然是该当的。”贾政因派个屋里的丫头传出去告诉李贵：“宝玉放学回来，索性吃饭后再叫他过来，说我还要问他话呢。”李贵答应了“是”。至宝玉放了学，刚要过来请安，只见李贵道：“二爷先不用过去。老爷吩咐了，今日叫二爷吃了饭就过去呢。听见还有话问二爷呢…","so":0,"eo":0},{"surface":"宝玉","text":"一会儿，焙茗拿了来，递给宝玉，宝玉呈与贾政。贾政翻开看时，见头一篇写着题目是“吾十有五而志于学”。他原本破的是“圣人有志于学，幼而已然矣”。代儒却将“幼”字抹去，明用“十五”。贾政道：“你原本‘幼’字，便扣不清题目了。幼字是从小起，至十六以前都是‘幼’。这章书是圣人自言学问工夫与年俱进的话，所以十五、三十、四十、五十、六十、七十、俱要明点出来，才见得到了几时有这么个光景，到了几时又有那么个光景。师父把你幼字改了十五，便明白了好些。”看到…","so":0,"eo":0},{"surface":"宝玉","text":"又看第二艺，题目是“人不知而不愠”。便先看代儒的改本云：“不以不知而愠者，终无改其说乐矣。”方觑着眼看那抹去的底本，说道：“你是什么？‘能无愠人之心，纯乎学者也。’上一句似单做了‘而不愠’三个字的题目，下一句又犯了下文君子的分界；必如改笔，才合题位呢。且下句找清上文，方是书理。须要细心领略。”宝玉答应着。贾政又往下看：“夫不知，未有不愠者也；而竟不然。是非由说而乐者，曷克臻此？”原本末句“非纯学者乎”。贾政道：“这也与破题同病的。这改的…","so":0,"eo":0},{"surface":"宝玉","text":"第三艺是“则归墨”。贾政看了题目，自己扬着头想了一想，因问宝玉道：“你的书讲到这里了么？”宝玉道：“师父说，《孟子》好懂些，所以倒先讲《孟子》，大前日才讲完了。如今讲上《论语》呢。”贾政因看这个破承，倒没大改。破题云：“言于舍杨之外，若别无所归者焉。”贾政道：“第二句倒难为你。”“夫墨，非欲归者也，而墨之言已半天下矣，则舍杨之外，欲不归于墨，得乎？”贾政道：“这是你做的么？”宝玉答应道：“是。”贾政点点头儿，因说道：“这也并没有什么出色…","so":0,"eo":0},{"surface":"宝玉","text":"贾政背着手，也在门口站着作想。只见一个小小厮往外飞走，看见贾政，连忙侧身垂手站住。贾政便问道：“作什么？”小厮回道；“老太太那边姨太太来了，二奶奶传出话来，叫预备饭呢。”贾政听了，也没言语，那小厮自去了。谁知宝玉自从宝钗搬回家去，十分想念，听见薛姨妈来了，只当宝钗同来，心中早已忙了，便乍着胆子回道：“破题倒作了一个，但不知是不是？”贾政道：“你念来我听。”宝玉念道：“天下不皆士也，能无产者亦仅矣。”贾政听了，点着头道：“也还使得。以后作…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉答应了个“是”，只得拿捏着慢慢的退出。刚过穿廊月洞门影屏，便一溜烟跑到贾母院门口。急得焙茗在后头赶着叫道：“看跌倒了！老爷来了。”宝玉那里听的见？刚进得门来，便听见王夫人、凤姐、探春等笑语之声。丫鬟们见宝玉来了，连忙打起帘子，悄悄告诉道：“姨太太在这里呢。”宝玉赶忙进来给薛姨妈请安，过来才给贾母请了晚安。贾母便问：“你今儿怎么这早晚才散学？”宝玉悉把贾政看文章并命作破题的话述了一遍。贾母笑容满面。宝玉因问众人道：“宝姐姐在那里坐着呢…","so":0,"eo":0}]},{"chap":85,"ctitle":"第85章 贾存周报升郎中任 薛文起复惹放流刑","deeds":[{"surface":"宝玉","text":"一日，林之孝进来回道：“今日是北静郡王生日，请老爷的示下。”贾政吩咐道：“只按向年旧例办了，回大老爷知道，送去就是了。”林之孝答应了，自去办理。不一时贾赦过来，同贾政商议带了贾珍、贾琏、宝玉去给北静王拜寿。别人还不理论，惟有宝玉素日仰慕北静王的容貌威仪，巴不得常见才好，遂连忙换了衣服，跟着来过北府。贾赦、贾政递了职名候谕。不多时，里面出来了一个太监，手里掐着数珠儿。见了贾赦、贾政，笑嘻嘻的说道：“二位老爷好？”贾赦、贾政也都赶忙问好，他…","so":0,"eo":0},{"surface":"宝玉","text":"那贾赦等复肃敬退出，北静王吩咐太监等让在众戚旧一处，好生款待。却单留宝玉在这里说话儿，又赏了坐。宝玉又磕头谢了恩，在挨门边绣墩上侧坐，说了一回读书作文诸事。北静王甚加爱惜，又赏了茶。因说道：“昨儿巡抚吴大人来陛见，说起令尊翁前任学政时，秉公办事，凡属生童，俱心服之至。他陛见时，万岁爷也曾问过，他也十分保举，可知是令尊翁的喜兆。”宝玉连忙站起，听毕这一段话，才回启道：“此是王爷的恩典，吴大人的盛情。”正说着，小太监进来回道：“外面诸位大人…","so":0,"eo":0},{"surface":"宝玉","text":"贾赦见过贾母，便各自回去。这里贾政带着他三人请过了贾母的安，又说了些府里遇见什么人。宝玉又回了贾政吴大人陛见保举的话。贾政道：“这吴大人本来咱们相好，也是我辈中人，还倒是有骨气的。”又说了几句闲话儿，贾母便叫：“歇着去罢。”贾政退出，珍、琏、宝玉都跟到门口。贾政道：“你们都回去陪老太太坐着去罢。”说着便回房去。刚坐了一坐，只见一个小丫头回道：“外面林之孝请老爷回话。”说着递上个红单帖来，写着吴巡抚的名字。贾政知道来拜，便叫小丫头叫林之孝…","so":0,"eo":0},{"surface":"宝玉","text":"且说珍、琏、宝玉三人回去，独有宝玉到贾母那边，一面述说北静王待他的光景，并拿出那块玉来。大家看着，笑了一回，贾母因命人：“给他收起去罢，别丢了。”因问：“你那块玉好生带着罢？别闹混了。”宝玉便在项上摘下来，说：“这不是我那一块玉？那里就掉了呢。比起来，两块玉差远着呢，那里混得过？我正要告诉老太太：前儿晚上，我睡的时候，把玉摘下来挂在帐子里，他竟放起光来了，满帐子都是红的。”贾母说道：“又胡说了。帐子的檐是红的，火光照着，自然红是有的。”…","so":0,"eo":0},{"surface":"宝玉","text":"不说贾母处谈论亲事。且说宝玉回到自己房中，告诉袭人道：“老太太和凤姐姐方才说话，含含糊糊，不知是什么意思？”袭人想了想，笑了一笑道：“这个我也猜不着。但只刚才说这些话时，林姑娘在跟前没有？”宝玉道：“林姑娘才病起来，这些时何曾到老太太那边去呢？”正说着，只听外间屋里麝月与秋纹拌嘴。袭人道：“你两个又闹什么？”麝月道：“我们两个斗牌，他赢了我的钱，他拿了去；他输了钱，就不肯拿出来。这也罢了，他倒把我的钱都抢了去了。”宝玉笑道：“几个钱什么…","so":0,"eo":0},{"surface":"宝玉","text":"却说袭人听了宝玉方才的话，也明知是给宝玉提亲的事，因恐宝玉每有痴想，这一提起，不知又招出他多少呆话来，所以故作不知。自己心上，却也是头一件关切的事。夜间躺着，想了个主意，不如去见见紫鹃，看他有什么动静，自然就知道了。次日一早起来，打发宝玉上了学，自己梳洗了，便慢慢的去到潇湘馆来。只见紫鹃正在那里掐花呢，见袭人进来，便笑嘻嘻的道：“姐姐屋里坐着。”袭人道：“坐着，妹妹掐花儿呢吗？姑娘呢？”紫鹃道：“姑娘才梳洗完了，等着温药呢。”紫鹃一面说…","so":0,"eo":0},{"surface":"宝玉","text":"晚间宝玉回房，袭人便回道：“今日廊下小芸二爷来了。”宝玉道：“作什么？”袭人道：“他还有个帖儿呢。”宝玉道：“在那里？拿来我看看。”麝月便走去，在里间屋里书稿子上头拿了来。宝玉接过看时、上面皮儿上写着：“叔父大人安禀。”宝玉道：“这孩子怎么又不认我作父亲了？”袭人道：“怎么？”宝玉道：“前年他送我白海棠时，称我作父亲大人，今日这帖子封皮上写着叔父，可不是又不认了么。”袭人道：“他也不害臊，你也不害臊，他那么大了，倒认你这么大儿的作父亲，…","so":0,"eo":0},{"surface":"宝玉","text":"一时小丫头们摆上饭来，宝玉只是怔怔的坐着。袭人连哄带怄，催着吃了一口儿饭，便搁下了，仍是闷闷的歪在床上。一时间忽然掉下泪来。此时袭人麝月都摸不着头脑，麝月道：“好好儿的，这又是为什么？都是什么‘芸儿’‘雨儿’的！不知什么事，弄了这么个浪帖子来，惹的这么傻了的似的，哭一会子，笑一会子。要天长日久，闹起这闷葫芦来，可叫人怎么受呢。”说着，竟伤起心来。袭人旁边由不得要笑，便劝道：“好妹妹你也别怄人了。他一个人就够受了，你又这么着。他那帖子上的…","so":0,"eo":0}]},{"chap":86,"ctitle":"第86章 受私贿老官翻案牍 寄闲情淑女解琴书","deeds":[{"surface":"宝玉","text":"到了那里，只有李纨、探春等在家接着，便问道：“大爷的事怎么样了？”薛姨妈道：“等详了上司才定，看来也到不了死罪。”这才大家放心。探春便道：“昨晚太太想着说：‘上回家里有事，全仗姨太太照应，如今自己有事，也难提了。’心里只是不放心。”薛姨妈道：“我在家里，也是难过。只是你大哥遭了这事，你二兄弟又办事去了，家里你姐姐一个人，中什么用？况且我们媳妇儿又是个不大晓事的，所以不能脱身过来。目今那里知县也正为预备周贵妃的差使，不得了结案件，所以你二…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，贾母等回来，见了薛姨妈，也顾不得问好，便问薛蟠的事。薛姨妈细述了一遍。宝玉在旁听见什么蒋玉函一段，当着人不问，心里打量是：“他既回了京，怎么不来瞧我？”又见宝钗也不过来，不知是怎么个原故。心内正自呆呆的想呢，恰好黛玉也来请安。宝玉稍觉心里喜欢，便把想宝钗来的念头打断，同着妹妹们在老太太那里吃了晚饭。大家散了，薛姨妈将就住在老太太的套间屋里。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉回到自己房中，换了衣裳，忽然想起蒋玉函给的汗巾，便向袭人道：“你那一年没有系的那条红汗巾子，还有没有？”袭人道：“我搁着呢，问他做什么？”宝玉道：“我白问问。”袭人道：“你没有听见薛大爷相与这些混账人，所以闹到人命关天，你还提那些做什么？有这样白操心，倒不如静静儿的念念书，把这些个没要紧的事撂开了也好。”宝玉道：“我并不闹什么，偶然想起，有也罢没也罢。我白问一声，你们就有这些话。”袭人笑道：“并不是我多话。一个人知书达礼，就该往上巴…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉也不答言，低着头，一径走到潇湘馆来。只见黛玉靠在桌上看书。宝玉走到跟前，笑说道：“妹妹早回来了？”黛玉也笑道：“你不理我，我还在那里做什么？”宝玉一面笑说：“他们人多说话，我插不下嘴去，所以没有和你说话。”一面瞧着黛玉看的那本书，书上的字一个也不认得。有的象“芍”字；有的象“茫”字；也有一个“大”字旁边“九”字加上一勾，中间又添个“五”字；也有上头“五”字“六”字又添一个“木”字，底下又是一个“五”字。看着又奇怪，又纳闷，便说：“妹…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉正听得高兴，便道：“好妹妹，你才说的实在有趣。只是我才见上头的字都不认得，你教我几个呢。”黛玉道：“不用教的，一说便可以知道的。”宝玉道：“我是个糊涂人，得教我那个‘大’字加一勾，中间一个‘五’字的。”黛玉笑道：这‘大’字‘九’字是用左手大拇指按琴上的‘九徽’，这一勾加‘五’字是右手钩‘五弦’，并不是一个字，乃是一声，是极容易的。还有吟、揉、绰、注、撞、走、飞、推等法，是讲究手法的。”宝玉乐得手舞足蹈的说：“好妹妹，你既明琴理，我们…","so":0,"eo":0},{"surface":"宝玉","text":"两个人正说着，只见紫鹃进来，看见宝玉，笑说道：“宝二爷今日这样高兴！”宝玉笑道：“听见妹妹讲究的，叫人顿开茅塞，所以越听越爱听。”紫鹃道：“不是这个高兴，说的是二爷到我们这边来的话。”宝玉道：“先时妹妹身上不舒服，我怕闹的他烦。再者我又上学，因此显着就疏远了似的。”紫鹃不等说完，便道：“姑娘也是才好。二爷既这么说，坐坐也该让姑娘歇歇儿了，别叫姑娘只是讲究劳神了。”宝玉笑道：“可是我只顾爱听，也就忘了妹妹劳神了。”黛玉笑道：“说这些倒也开…","so":0,"eo":0},{"surface":"宝玉","text":"于是走出门来。只见秋纹带着小丫头，捧着一小盆兰花来，说：“太太那边有人送了四盆兰花来。因里头有事，没有空儿玩他，叫给二爷一盆，林姑娘一盆。”黛玉看时，却有几枝双朵儿的，心中忽然一动，也不知是喜是悲，便呆呆的呆看。那宝玉此时却一心只在琴上，便说：“妹妹有了兰花，就可以做《猗兰操》了。”黛玉听了，心里反不舒服。回到房中，看着花，想到：“草木当春，花鲜叶茂，想我年纪尚小，便象三秋蒲柳。若是果能随愿，或者渐渐的好来的。不然只恐似那花柳残春，怎禁…","so":0,"eo":0}]},{"chap":87,"ctitle":"第87章 感秋声抚琴悲往事 坐禅寂走火入邪魔","deeds":[{"surface":"宝玉","text":"这里黛玉添了香，自己坐着，才要拿本书看，只听得园内的风自西边直透到东边，穿过树枝，都在那里唏哗喇不住的响。一会儿，檐下的铁马也只管叮叮当当的乱敲起来。一时雪雁先吃完了，进来伺候。黛玉便问道：“天气冷了，我前日叫你们把那小毛儿衣裳晾晾，可曾晾过没有？”雪雁道：“都晾过了。”黛玉道：“你拿一件来我披披。”雪雁走去，将一包小毛衣裳抱来，打开毡包，给黛玉自拣。只见内中夹着个绢包儿。黛玉伸手拿起，打开看时，却是宝玉病时送来的旧绢子，自己题的诗，上…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃刚从外间进来，只见雪雁正捧着一毡包衣裳，在旁边呆立，小几上却搁着剪破了的香囊和两三截儿扇袋并那铰拆了的穗子。黛玉手中却拿着两方旧帕子，上边写着字迹，在那里对着滴泪呢。正是：失意人逢失意事，新啼痕间旧啼痕。紫鹃见了这样，知是他触物伤情，感怀旧事，料道劝也无益，只得笑着道：“姑娘，还看那些东西作什么？那都是那几年宝二爷和姑娘小时，一时好了，一时恼了，闹出来的笑话儿。要象如今这样厮抬厮敬的，那里能把这些东西白遭塌了呢。”紫鹃这话原给黛玉开…","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉这日起来，梳洗了，带着焙茗正往书房中来，只见墨雨笑嘻嘻的跑来，迎头说道：“二爷今日便宜了。太爷不在书房里，都放了学了。”宝玉道：“当真的么？”墨雨道：“二爷不信，那不是三爷和兰哥来了？”宝玉看时，只见贾环、贾兰跟着小厮们，两个笑嘻嘻的，嘴里咭咭呱呱不知说些什么，迎头来了。见了宝玉，都垂手站住。宝玉问道：“你们两个怎么就回来了？”贾环道：“今日太爷有事，说是放一天学，明儿再去呢。”宝玉听了，方回身到贾母、贾政处去禀明了，然后回到怡…","so":0,"eo":0},{"surface":"宝玉","text":"走到门口，只见雪雁在院中晾绢子呢。宝玉因问：“姑娘吃了饭了么？”雪雁道：“早起喝了半碗粥，懒怠吃饭，这时候打盹儿呢。二爷且到别处走走，回来再来罢。”宝玉只得回来。无处可去，忽然想起惜春有好几天没见，便信步走到蓼风轩来。刚到窗下．只见静悄悄一无人声，宝玉打量他也睡午觉，不便进去。才要走时，只听屋里微微一响，不知何声；宝玉站往再听，半日，又“拍”的一响。宝玉还未听出，只见一个人道：“你在这里下了一个子儿，那里你不应么？”宝玉方知是下棋呢。但…","so":0,"eo":0},{"surface":"宝玉","text":"惜春尚未答言，宝玉在旁情不自禁，哈哈一笑，把两个人都唬了一大跳。惜春道：“你这是怎么说？进来也不言语。这么使促狭唬人！你多早晚进来的？”宝玉道：“我头里就进来了，看着你们两个争这个畸角儿。”说着，一面与妙玉施礼，一面又笑问道：“妙公轻易不出禅关，今日何缘下凡一走？”妙玉听了，忽然把脸一红，也不答言，低了头自看那棋。宝玉自觉造次，连忙陪笑道：“倒是出家人比不得我们在家的俗人。头一件，心是静的。静则灵，灵则慧。”宝玉尚未说完，只见妙玉微微的…","so":0,"eo":0},{"surface":"宝玉","text":"妙玉道：“这又是一拍。何忧思之深也！”宝玉道：“我虽不懂得，但听他声音，也觉得过悲了。”里头又调了一回弦。妙玉道：“君弦太高了，与无射律只怕不配呢。”里边又吟道：","so":0,"eo":0},{"surface":"宝玉","text":"妙玉听了，呀然失色道：“如何忽作变徵之声？音韵可裂金石矣！只是太过。”宝玉道：“太过便怎么？”妙玉道：“恐不能持久。”正议论时，听得君弦“蹦”的一声断了。妙玉站起来，连忙就走。宝玉道：“怎么样？”妙玉道：“日后自知，你也不必多说。”竟自走了。弄得宝玉满肚疑团，没精打采的，归至怡红院中，不表。","so":0,"eo":0},{"surface":"宝玉","text":"且说妙玉归去，早有道婆接着，掩了庵门，坐了一回，把《禅门日诵》念了一遍。吃了晚饭，点上香，拜了菩萨，命道婆子自去歇着。自己的禅床靠背俱已整齐，屏息垂帘，跏跌坐下，断除妄想，趁向真如。坐到三更以后，听得房上一片响声，妙玉恐有贼来，下了禅床，出到前轩，但见云影横空，月华如水。那时天气尚不很凉，独自一个凭栏站了一回，忽听房上两个猫儿一递一声厮叫。那妙玉忽想起日间宝玉之言，不觉一阵心跳耳热，自己连忙收摄心神，走进掸房，仍到禅床上坐了。怎奈神不守…","so":0,"eo":0}]},{"chap":88,"ctitle":"第88章 博庭欢宝玉赞孤儿 正家法贾珍鞭悍仆","deeds":[{"surface":"宝玉","text":"鸳鸯遂辞了出来，同小丫头来至贾母房中，回了一遍。看见贾母与李纨打双陆，鸳鸯旁边瞧着。李纨的骰子好，掷下去把老太太的锤打下了好几个去。鸳鸯抿着嘴儿笑。忽见宝玉进来，手中提了两个细蔑丝的小笼子，笼内有几个蝈蝈儿，说道：“我听说老太太夜里睡不着，我给老太太留下解解闷。”贾母笑道：“你别瞅着你老子不在家，你只管淘气。”宝玉笑道：“我没有淘气。”贾母道：“你没淘气，不在学房里念书，为什么又弄这个东西呢。”宝玉道：“不是我自己弄的。今儿因师父叫环儿…","so":0,"eo":0},{"surface":"宝玉","text":"贾母又问道：“兰小子呢，做上来了没有？这该环儿替他了，他又比他小了。是不是？”宝玉笑道：“他倒没有，却是自己对的。”贾母道：“我不信，不然就也是你闹了鬼了。如今你还了得，‘羊群里跑出骆驼来了，就只你大。’你又会做文章了。”宝玉笑道：“实在是他作的。师父还夸他明儿一定大有出息呢。老太太不信，就打发人叫了他来亲自试试，老太太就知道了。”贾母道：“果然这么着我才喜欢。我不过怕你撒谎。既是他做的，这孩子明儿大概还有一点儿出息。”因看着李纨，又想…","so":0,"eo":0},{"surface":"宝玉","text":"只见贾环、贾兰也都进来给贾母请了安。贾兰又见过他母亲，然后过来，在贾母傍边侍立。贾母道：“我刚才听见你叔叔说你对的好对子，师父夸你来着。”贾兰也不言语，只管抿着嘴儿笑。鸳鸯过来说道：“请示老太太，晚饭伺候下了。”贾母道：“请你姨太太去罢。”琥珀接着便叫人去王夫人那边请薛姨妈。这里宝玉、贾环退出，素云和小丫头们过来把双陆收起，李纨尚等着伺候贾母的晚饭。贾兰便跟着他母亲站着。贾母道：“你们娘儿两个跟着我吃罢。”李纨答应了。一时，摆上饭来，丫…","so":0,"eo":0},{"surface":"宝玉","text":"小红进来回道：“芸二爷在外头要见奶奶。”凤姐一想：“他又来做什么？”便道：“叫他进来罢。”小红出来，瞅着贾芸微微一笑。贾芸赶忙凑近一步，问道：“姑娘替我回了没有？”小红红了脸，说道：“我就是见二爷的事多！”贾芸道：“何曾有多少事能到里头来劳动姑娘呢？就是那一年姑娘在宝二叔房里，我才和姑娘……”小红怕人撞见，不等说完，连忙问道：“那年我换给二爷的一块绢子，二爷见了没有？”那贾芸听了这句话，喜的心花俱开，才要说话，只见一个小丫头从里面出来，…","so":0,"eo":0}]},{"chap":89,"ctitle":"第89章 人亡物在公子填词 蛇影杯弓颦卿绝粒","deeds":[{"surface":"宝玉","text":"却说凤姐正自起来纳闷，忽听见小丫头这话，又唬了一跳，连忙又问：“什么官事？”小丫头道：“也不知道。刚才二门上小厮回进来，回老爷有要紧的官事，所以太太叫我请二爷来了。”凤姐听了工部里的事，才把心略略的放下。因说道：“你回去回太太，就说二爷昨日晚上出城有事没有回来，打发人先回珍大爷去罢。”那丫头答应着去了。一时贾珍过来见了部里的人，问明了。进来见了王夫人回道：“部中来报，昨日总河奏到，河南一带决了河口，湮没了几府州县。又要开销国策，修理城工…","so":0,"eo":0},{"surface":"宝玉","text":"那时已到十月中旬，宝玉起来，要往学房中去。这日天气陡寒，只见袭人早已打点出一包衣裳，向宝玉道：“今日天气很凉，早晚宁可暖些。”说着，把衣裳拿出来，给宝玉挑了一件穿。又包了一件，叫小丫头拿出，交给焙茗，嘱咐道：“天气冷，二爷要换时，好生预备着。”焙茗答应了，抱着毡包，跟着宝玉自去。宝玉到了学房中，做了自己的工课，忽听得纸窗呼喇喇一派风声。代儒道：“天气又变了。”把风门推开一看，只见西北上一层层的黑云，渐渐往东南扑上来。焙茗走进来回宝玉道：…","so":0,"eo":0},{"surface":"宝玉","text":"晚间放学时，宝玉便往代儒托病告假一天。代儒本来上年纪的人，也不过伴着几个孩子解闷儿，时常也八病九痛的，乐得去一个少操一日心。况且明知贾政事忙，贾母溺爱，便点点头儿。宝玉一径回来，见过贾母王夫人，也是这么说，自然没有不信的。略坐一坐，便回园中去了。见了袭人等，也不似往日有说有笑的，便和衣躺在炕上。袭人道：“晚饭预备下了，这会儿吃，还是等一等儿？”宝玉道：“我不吃了，心里不舒服。你们吃去罢。”袭人道：“那么着，你也该把这件衣裳换下来了。那个…","so":0,"eo":0},{"surface":"宝玉","text":"此时袭人麝月也都起来。袭人道：“昨夜听着你翻腾到五更天，我也不敢问你。后来我就睡着了，不知到底你睡着了没有？”宝玉道：“也睡了一睡，不知怎么就醒了。”袭人道：“你没有什么不受用？”宝玉道：“没有，只是心上发烦。”袭人道：“今日学房里去不去？”宝玉道：“我昨儿已经告了一天假了，今儿我要想园里逛一天，散散心，只是怕冷。你叫他们收拾一间屋子，备了一炉香，搁下纸墨笔砚，你们只管于你们的，我自己静坐半天才好，别叫他们来搅我。”麝月接着道：“二爷要…","so":0,"eo":0},{"surface":"宝玉","text":"一时小丫头来请，说：“笔砚都安放妥当了。”宝玉道：“知道了。”又一个小丫头回道：“早饭得了，二爷在那里吃？”宝玉道：“就拿了来罢，不必累赘了。”小丫头答应了自去，一时端上饭来。宝玉笑了一笑，向麝月袭人道：“我心里闷得很，自己吃只怕又吃不下去，不如你们两个同我一块儿吃，或者吃的香甜，我也多吃些。”麝月笑道：“这是二爷的高兴，我们可不敢。”袭人道：“其实也使得，我们一处喝酒，也不止今日。只是偶然替你解闷儿还使得，若认真这样，还有什么规矩体统…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉略坐了一坐，便过这间屋子来。亲自点了一枝香，摆上些果品，便叫人出去，关上门。外面袭人等都静悄无声。宝玉拿了一幅泥金角花的粉红笺出来，口中祝了几句，便提起笔来写道：","so":0,"eo":0},{"surface":"宝玉","text":"写毕，就在香上点个火，焚化了。静静儿等着，直待一炷香点尽了，才开门出来。袭人道：“怎么出来了？想来又闷的慌了？”宝玉笑了一笑，假说道：“我原是心里烦，才找个清静地方儿坐坐。这会子好了，还要外头走走去呢。”","so":0,"eo":0},{"surface":"宝玉","text":"说着一径出来到了潇湘馆里。在院里问道：“林妹妹在家里呢么？”紫鹃接应道：“是谁？”掀帘看时，笑道：“原来是宝二爷。姑娘在屋里呢，请二爷到屋里坐着。”宝玉同着紫鹃走进来。黛玉却在里间呢，说道：“紫鹃，请二爷屋里坐罢。”宝玉走到里间门口，看见新写的一副紫墨色泥金云龙笺的小对，上写着：“绿窗明月在，青史古人空。”宝玉看见，笑了一笑，走人门去，笑问道：“妹妹做什么呢？”黛玉站起来，迎了两步，笑着让道：“请坐。我在这里写经，只剩得两行了。等写完了…","so":0,"eo":0}]},{"chap":90,"ctitle":"第90章 失绵衣贫女耐嗷嘈 送果品小郎惊叵测","deeds":[{"surface":"宝玉","text":"这里雪雁正在屋里伴着黛玉，见他昏昏沉沉，小孩子家那里见过这个样儿，只打量如此便是死的光景了，心中又痛又怕，恨不得紫鹃一时回来才好。正怕着，只听窗外脚步走响，雪雁知是紫鹃回来，才放下心了，连忙站起来，掀着里间帘子等他。只见外面帘子响处，进来了一个人，却是侍书。那侍书是探春打发来看黛玉的，见雪雁在那里掀着帘子，便问道：“姑娘怎么样？”雪雁点点头儿，叫他进来。侍书跟进来，见紫鹃不在屋里，瞧了瞧黛玉，只剩得残喘微延，唬的惊疑不止。因问：“紫鹃姐…","so":0,"eo":0},{"surface":"宝玉","text":"不言黛玉病渐减退。且说雪雁、紫鹃背地里都念佛。雪雁向紫鹃说道：“亏他好了！只是病的奇怪，好的也奇怪。”紫鹃道：“病的倒不怪，就只好的奇怪。想来宝玉和姑娘必是姻缘。人家说的：‘好事多磨。’又说道：‘是姻缘棒打不回。’这么看起来，人心天意，他们两个竟是天配的了。再者，你想那一年，我说了林姑娘要回南去，把宝玉没急死了，闹得家翻宅乱；如今一句话又把这一个弄的死去活来：可不说的三生石上百年前结下的么？”说着，两个悄悄的抿着嘴笑了一回。雪雁又道：“…","so":0,"eo":0},{"surface":"宝玉","text":"不但紫鹃和雪雁在私下里讲究，就是众人也都知道黛玉的病也病的奇怪，好也好得奇怪，三三两两，唧唧哝哝议论着。不多几时，连凤姐儿也知道了，邢、王二夫人也有些疑惑，倒是贾母略猜着了八九。那时正值邢、王二夫人、凤姐等在贾母房中说闲话，说起黛玉的病来。贾母道：“我正要告诉你们。宝玉和林丫头是从小儿在一处的，我只说小孩子们怕什么。以后时常听得林丫头忽然病，忽然好，都为有了些知觉了。所以我想他们若尽着搁在一块儿，毕竟不成体统。你们怎么说？”王夫人听了，…","so":0,"eo":0}]},{"chap":91,"ctitle":"第91章 纵淫心宝蟾工设计 步疑阵宝玉妄谈禅","deeds":[{"surface":"宝玉","text":"薛姨妈听了，又哭了一场。宝钗和薛蝌一面劝慰，一面说道：“事不宜迟。”薛姨妈没法，只得叫薛蝌到那里去照料，命人即忙收拾行李，兑了银子，同着当铺中一个伙计连夜起程。那时手忙脚乱，虽有下人办理，宝钗怕他们思想不到，亲来帮着收拾，直闹到四更才歇。到底富家女子娇养惯了的，心上又急，又劳苦了一夜，到了次日就发起烧来，汤水都吃不下去。莺儿忙回了薛姨妈。薛姨妈急来看时，只见宝钗满面通红，身如燔灼，话都不说。薛姨妈慌了手脚，便哭得死去活来。宝琴扶着劝解。…","so":0,"eo":0},{"surface":"宝玉","text":"到了次日，王夫人将贾政的话向薛姨妈说了，薛姨妈想着也是。到了饭后，王夫人陪着来到贾母房中，大家让了坐。贾母道：“姨太太才过来？”薛姨妈道：“还是昨儿过来的，因为晚了，没得过来给老太太请安。”王夫人便把贾政昨夜所说的话向贾母述了一遍，贾母甚喜。说着，宝玉进来了，贾母便问道：“吃了饭了没有？”宝玉道：“才打学房里回来，吃了，要往学房里去，先见见老太太。又听见说姨妈来了，过来给姨妈请请安。”因问：“宝姐姐大好了？”薛姨妈笑道：“好了。”原来方…","so":0,"eo":0},{"surface":"宝玉","text":"晚上回来，都见过了，便往潇湘馆来。掀帘进去，紫鹃接着。见里间屋内无人，宝玉道：“姑娘那里去了？”紫鹃道：“上屋里去了。听见说姨太太过来，姑娘请安去了。二爷没有到上屋里去么？”宝玉道：“我去了来的，没有见你们姑娘。”紫鹃道：“没在那里吗？”宝玉道：“没有。到底那里去了？”紫鹃道：“这就不定了。”宝玉刚要出来，只见黛玉带着雪雁，冉冉而来。宝玉道：“妹妹回来了。”缩身退步，仍跟黛玉回来。黛玉进来，走入里屋内，便请宝玉里头坐。紫鹃拿了一件外罩换…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，瞪着眼呆了半晌。黛玉看见宝玉这样光景，也不睬他，只是自己叫人添了香，又翻出书来，看了一会。只见宝玉把眉一皱，把脚一跺，道：“我想这个人生他做什么！天地间没有了我，倒也干净。”黛玉道：“原是有了我便有了人，有了人便有无数烦恼生出来：恐怖，颠倒，梦想，更有许多缠碍。才刚我说的，都是玩话。你不过是看见姨妈没精打彩，如何便疑到宝姐姐身上去？姨妈过来原为他的官司事情，心绪不宁，那里还来应酬你？都是你自己心上胡思乱想，钻人魔道里去了。”宝…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉乘此机会，说道：“我便问你一句话，你如何回答？”宝玉盘着腿，合着手，闭着眼，撅着嘴，道：“讲来。”黛玉道：“宝姐姐和你好，你怎么样？宝姐姐不和你好，你怎么样？宝姐姐前儿和你好，如今不和你好，你怎么样？今儿和你好，后来不和你好，你怎么样？你和他好，他偏不和你好，你怎么样？”宝玉呆了半晌，忽然大笑道：“任凭弱水三千，我只取一瓢饮。”黛玉道：“瓢之漂水，奈何？”宝玉道：“非瓢漂水，水自流，瓢自漂耳。”黛玉道：“水止珠沉，奈何？”宝玉道：“…","so":0,"eo":0}]},{"chap":92,"ctitle":"第92章 评女传巧姐慕贤良 玩母珠贾政参聚散","deeds":[{"surface":"宝玉","text":"话说宝玉从潇湘馆出来，连忙问秋纹道：“老爷叫我作什么？”秋纹笑道：“没有叫。袭人姐姐叫我请二爷，我怕你不来，才哄你的。”宝玉听了，才把心放下，因说：“你们请我也罢了，何苦来唬我？”说着，回到怡红院内。袭人便问道：“你这好半天到那里去了？”宝玉道：“在林姑娘那边，说起姨妈家宝姐姐的事来，就坐住了。”袭人又问道：“说些什么？”宝玉将打禅语的话述了一遍。袭人道：“你们再没个计较。正经说些家常闲话儿，或讲究些诗句，也是好的，怎么又说到禅语上了？…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉点头道：“我也知道。如今且不用说那个。我问你：老太太那里打发人来说什么来着没有？”袭人道：“没有说什么。”宝玉道：“必是老太太忘了。明儿不是十一月初一日么？年年老太太那里必是个老规矩，要办消寒会，齐打伙儿坐下喝酒说笑。我今日已经在学房里告了假了。这会子没有信儿，明儿可是去不去呢？若去了呢，白白的告了假；若不去，老爷知道了，又说我偷懒。”袭人道：“据我说，你竟是去的是。才念的好些儿了，又想歇着。我劝你也该上点紧儿了。昨儿听见太太说，兰…","so":0,"eo":0},{"surface":"宝玉","text":"袭人正要骂他，只见老太太那里打发人来，说道：”老太太说了，叫二爷明儿不用上学呢。明儿请了姨太太来给他解闷，只怕姑娘们都来家里的。史姑娘、邢姑娘、李姑娘们都请了，明儿来赴什么消寒会呢。”宝玉没有听完，便喜欢道：“可不是？老太太最高兴的。明目不上学，是过了明路的了。”袭人也不便言语了。那丫头回去。宝玉认真念了几天书，巴不得玩这一天，又听见薛姨妈过来，想着宝姐姐自然也来，心里喜欢。便说：“快睡罢，明日早些起来。”于是一夜无话。","so":0,"eo":0},{"surface":"宝玉","text":"到了次日，果然一早到老太太那里请了安。又到贾政、王大人那里请了安，回明了老太太今儿不叫上学，贾政也没言语，便慢慢退出来。走了几步，便一溜烟跑到贾母房中。见众人都没来，只有凤姐那边的奶妈子，带了巧姐儿，跟着几个小丫头过来，给老太太请了安，说：“我妈妈先叫我来请安，陪着老太太说说话儿。妈妈回来就来。”贾母笑着道：“好孩子，我一早就起来了，等他们总不来。只有你二叔叔来了。”那奶妈子便说：“姑娘，给叔叔请安。”巧姐便请了安。宝玉也问了一声“妞妞…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉便道：“那文王后妃不必说了。那姜后脱簪待罪和齐国的无盐安邦定国，是后妃里头的贤能的。”巧姐听了，答应个“是”。宝玉又道：“若说有才的，是曹大姑、班婕妤、蔡文姬、谢道韫诸人。”巧姐问道：“那贤德的呢？”宝玉道：“孟光的荆钗布裙，鲍宣妻的提瓮出汲，陶侃母的截发留宾，这些不厌贫的，就是贤德了。”巧姐欣然点头。宝玉道：“还有苦的，象那乐昌破镜，苏蕙回文；那孝的，木兰代父从军，曹娥投水寻尸等类，也难尽说。”巧姐听到这些，却默默如有所思。宝玉又…","so":0,"eo":0},{"surface":"宝玉","text":"巧姐道：“我还听见我妈妈说：我们家的小红，头里是二叔叔那里的，我妈妈要了来，还没有补上人呢。我妈妈想着要把什么柳家的五儿补上，不知二叔叔要不要。”宝玉听了更喜欢，笑着道：“你听你妈妈的话！要补谁就补谁罢咧，又问什么要不要呢。”因又向贾母笑道：“我瞧大妞妞这个小模样儿，又有这个聪明儿，只怕将来比凤姐姐还强呢，又比他认的字。”贾母道：“女孩儿家认得字也好，只是女工针黹倒是要紧的。”巧姐儿道：“我也跟着刘妈妈学着做呢。什么扎花吻，拉锁子例，我…","so":0,"eo":0},{"surface":"宝玉","text":"贾母等着那些人，见这时候还不来，又叫丫头去请。回来李纨同着他妹子、探春、惜春、史湘云、黛玉都来了。大家请了贾母的安，众人厮见。独有薛姨妈未到，贾母又叫请去。果然薛姨妈带着宝琴过来。宝玉请了安，问了好，只不见宝钗邢岫烟二人。黛玉便问起：“宝姐姐为何不来？”薛姨妈假说身上不好。邢岫烟知道薛姨妈在坐，所以不来。宝玉虽见宝钗不来，心中纳闷，因黛玉来了，便把想宝钗的心暂且搁开。不多时，邢、王二夫人也来了。凤姐听见婆婆们先到了，自己不好落后，只得打…","so":0,"eo":0}]},{"chap":93,"ctitle":"第93章 甄家仆投靠贾家门 水月庵掀翻风月案","deeds":[{"surface":"宝玉","text":"且说临安伯第二天又打发人来请。贾政告诉贾赦道：“我是衙门里有事。琏儿要在家等候拿车的事情，也不能去。倒是大老爷带着宝玉应酬一天也罢了。”贾赦点头道：“也使得。”贾政遣人去叫宝玉，说：“今儿跟大爷到临安伯那里听戏去。”宝玉喜欢的了不得，便换上衣服，带了焙茗、扫红、锄药三个小子，出来见了贾赦，请了安，上了车，来到临安伯府里。门上人回进去，一会子出来说：“老爷请。”于是贾赦带着宝玉走入院内，只见宾客喧闻。贾赦宝玉见了临安伯，又与众宾客都见过了…","so":0,"eo":0},{"surface":"宝玉","text":"那时开了戏，也有昆腔，也有高腔，也有弋腔、平腔，热闹非常。到了晌午，便摆开桌子吃酒。又看了一回，贾赦便欲起身。临安伯过来留道：“天色尚早。听见说琪官儿还有一出《占花魁》，他们顶好的首戏。”宝玉听了，巴不得贾赦不走。于是贾赦又坐了一会。果然蒋玉函扮了秦小官，伏侍花魁醉后神情，把那一种怜香惜玉的意思，做得极情尽致。以后对饮对唱，缠绵缱绻。宝玉这时不看花魁，只把两支眼睛独射在秦小官身上。更加蒋玉函声音响亮，口齿清楚，按腔落板，宝玉的神魂都唱的…","so":0,"eo":0},{"surface":"宝玉","text":"到了家中，贾赦自回那边去了。宝玉来见贾政。贾政才下衙门，正向贾琏问起拿车之事。贾琏道：“今儿叫人拿帖儿去，知县不在家。他的门上说了：‘这是本官不知道的，并无牌票出去拿车，都是那些混账东西在外头撒野挤讹头。既是老爷府里的，我便立刻叫人去追办，包管明儿连车连东西一并送来。如有半点差迟，再行禀过本官，重重处治。此刻本官不在家，求这里老爷看破些，可以不用本官知道更好。’”贾政道：“既无官票，到底是何等样人在那里作怪？”贾琏道：“老爷不知，外头都…","so":0,"eo":0},{"surface":"宝玉","text":"门上出去，带进人来，见贾政，便磕了三个头，起来道：“家老爷请老爷安。”自己又打个千儿，说：“包勇请老爷安。”贾政回问了甄老爷的好，便把他上下一瞧。但见包勇身长五尺有零，肩背宽肥，浓眉爆眼，磕额长髯，气色粗黑，垂着手站着。便问道：“你是向来在甄家的，还是住过几年的？”包勇道：“小的向在甄家的。”贾政道：“你如今为什么要出来呢？”包勇道：“小的原不肯出来，只是家老爷再四叫小的出来，说别处你不肯去，这里老爷家里和在咱们自己家里一样的，所以小的…","so":0,"eo":0}]},{"chap":94,"ctitle":"第94章 宴海棠贾母赏花妖 失宝玉通灵知奇祸","deeds":[{"surface":"宝玉","text":"且说紫鹃因黛玉渐好，园中无事，听见女尼等预备宫内使唤，不知何事便到贾母那边打听打听。恰遇着鸳鸯下来闲着，坐下说闲话儿，提起女尼的事，鸳鸯诧异道：“我并没有听见。回来问问二奶奶就知道了。”正说着，只见傅试家两个女人过来请贾母的安，鸳鸯要陪了上去。那两个女人因贾母正睡晌觉，就与鸳鸯说了一声儿，回去了。紫鹃问：“这是谁家差来的？”鸳鸯道：“好讨人嫌！家里有了一个女孩儿，长的好些儿，就献宝的似的，常在老太太跟前夸他们姑娘怎么长的好，心地儿怎么好…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃听了一呆，便假意道：“若老太太喜欢，为什么不就给宝玉定了呢？”鸳鸯正要说出原故，听见上头说：“老太太醒了。”鸳鸯赶着上去，紫鹃只得起身出来。回到园里，一面走，一头想道，“天下莫非只有一个宝玉？你也想他，我也想他。我们家的那一位，越发痴心起来了！看他的那个神情儿，是一定在宝玉身上的了，三番两次的病，可不是为着这个是什么？这家里‘金’的‘银’的还闹不清，再添上一个什么傅姑娘，更了不得了。我看宝玉的心也在我们那一位的身上啊，听着鸳鸯的话，…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃也心里暗笑，出来倒茶。只听园里一叠声乱嚷，不知何故。一面倒茶，一面叫人去打听。回来说道：“怡红院里的海棠本来萎了几棵，也没人去浇灌他。昨日宝玉走去瞧，见枝头上好象有了朵儿似的。人都不信，没有理他。忽然今日开的很好的海棠花，众人诧异，都争着去看，连老太太、太太都哄动了，来瞧花儿呢。所以大奶奶叫人收拾园里的树叶子，这些人在那里传唤。”黛玉也听见了，知道老太太来，便更了衣，叫雪雁去打听：“若是老太太来了，即来告诉我。”雪雁去不多时，便跑来…","so":0,"eo":0},{"surface":"宝玉","text":"大家说笑了一回，讲究这花开得古怪。贾母道：“这花儿应在三月里开的，如今虽是十一月，因节气迟，还算十月，应着小阳春的天气，因为和暖，开花也是有的。”王夫人道：“老太太见的多，说得是，也不为奇。”邢夫人道：“我听见这花已经萎了一年，怎么这回不应时候儿开了？必有个原故。”李纨笑道：“老太太和太太说的都是。据我的糊涂想头，必是宝玉有喜事来了，此花先来报信。”探春虽不言语，心里想道：“必非好兆。大凡顺者昌，逆者亡；草木知运，不时而发，必是妖孽。”…","so":0,"eo":0},{"surface":"宝玉","text":"那贾母高兴，叫人传话到厨房里：“快快预备酒席，大家赏花。”叫宝玉、环儿、兰儿：“各人做一首诗志喜。林姑娘的病才好，别叫他费心，若高兴，给你们改改。”对着李纨道：“你们都陪我喝酒。”李纨答应了是，便笑对探春笑道：“都是你闹的。”探春道：“饶不叫我们做诗，怎么我们闹的？”李纨道：“海棠社不是你起的么？如今那棵海棠也要来入社了。”大家听着都笑了。","so":0,"eo":0},{"surface":"宝玉","text":"一时摆上酒菜，一面喝着，彼此都要讨老太太的喜欢，大家说些兴头话。宝玉上来斟了酒，便立成了四句诗，写出来念与贾母听，道：","so":0,"eo":0},{"surface":"宝玉","text":"贾母听毕，便说：“我不大懂诗，听去倒是兰儿的好，环儿做的不好。都上来吃饭罢。”宝玉看见贾母喜欢，更是兴头，因想起：“晴雯死的那年，海棠死的；今日海棠复荣，我们院内这些人，自然都好，但是晴雯不能象花的死而复生了。”顿觉转喜为悲。忽又想起前日巧姐提凤姐要把五儿补入。“或此花为此而开，也未可知。”却又转悲为喜，依旧说笑。","so":0,"eo":0},{"surface":"宝玉","text":"且说那日宝玉本来穿着一裹圆的皮袄在家歇息，因见花开，只管出来看一回、赏一回、叹一回、爱一回的，心中无数悲喜离合，都弄到这株花上去了。忽然听说贾母要来，便去换了一件狐腋箭袖，罩一件玄狐腿外褂，出来迎接贾母。匆匆穿换，未将“通灵宝玉”挂上。及至后来贾母去了，仍旧换衣，袭人见宝玉脖子上没有挂着，便问：“那块玉呢？”宝玉道：“刚才忙乱换衣，摘下来放在炕桌上，我没有带。”袭人回看桌上，并没有玉，便向各处找寻，踪影全无，吓得袭人满身冷汗。宝玉道：“…","so":0,"eo":0}]},{"chap":95,"ctitle":"第95章 因讹成实元妃薨逝 以假混真宝玉疯癫","deeds":[{"surface":"宝玉","text":"话说焙茗在门口和小丫头子说宝玉的玉有了，那小丫头急忙回来告诉宝玉。众人听了，都推着宝玉出去问他。众人在廊下听着。宝玉也觉放心，便走到门口，问道：“你那里得了？快拿来。”焙茗道：“拿是拿不来的，还得托人做保去呢。”宝玉道：“你快说是怎么得的，我好叫人取去。”焙茗道：“我在外头，知道林爷爷去测宇，我就跟了去。我听见说在当铺里找，我没等他说完，便跑到几个当铺里去。我比给他们瞧，有一家便说‘有’。我说：‘给我罢。’那铺子里要票子。我说：”当多少…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉正笑道，只见岫烟来了。原来岫烟走到栊翠庵，见了妙玉，不及闲话，便求妙玉扶乩。妙玉冷笑几声，说道：“我与姑娘来往，为的是姑娘不是势利场中的人。今日怎么听了那里的谣言，过来缠我？况且我并不晓得什么叫‘扶乩’。”说着，将要不理。岫烟懊悔此来，知他脾气是这么着的，“一时我已说出，不好白回去。”又不好与他质证他会扶乩的话，只得陪着笑将袭人等性命关系的话说了一遍。见妙玉略有活动，便起身拜了几拜。妙玉叹道：“何必为人作嫁？但是我进京以来，素无人知…","so":0,"eo":0},{"surface":"宝玉","text":"进入院中，各人都问：“怎么样？”岫烟不及细说，便将所录乩语递与李纨。众姊妹及宝玉争看，都解的是：“一时要找是找不着的，然而丢是丢不了的，不知几时不找便出来了。但是青埂峰不知在那里？”李纨道：“这是仙机隐语。咱们家里那里跑出青埂峰来？必是谁怕查出，撂在有松树的山子石底下，也未可定。独是‘入我门来’这句，到底是入谁的门呢？”黛玉道：“不知请的是谁？”岫烟道：“拐仙。”探春道：“若是仙家的门，便难入了。”袭人心里着忙，便捕风捉影的混找，没一块…","so":0,"eo":0},{"surface":"宝玉","text":"且说黛玉先自回去，想起“金”“石”的旧话来，反自欢喜，心里也道：“和尚道士的话真个信不得。果真‘金’‘玉’有缘，宝玉如何能把这玉丢了呢？或者因我之事，拆散他们的‘金玉’，也未可知。”想了半天，更觉安心，把这一天的劳乏竟不理会，重新倒看起书来。紫鹃倒觉身倦，连催黛玉睡下。黛玉虽躺下，又想到海棠花上，说：“这块玉原是胎里带来的，非比寻常之物，来去自有关系。若是这花主好事呢，不该失了这玉呀。看来此花开的不祥，莫非他有不吉之事？”不觉又伤起心来…","so":0,"eo":0},{"surface":"宝玉","text":"次日，王夫人等早派人到当铺里去查问，凤姐暗中设法找寻。一连闹了几天、总无下落。还喜贾母、贾政未知。袭人等每日提心吊胆。宝玉也好几天不上学，只是怔怔的，不言不语，没心没绪的。王夫人只知他因失玉而起，也不大着意。那日正在纳闷，忽见贾琏进来请安，嘻嘻的笑道：“今日听得雨村打发人来告诉咱们二老爷，说舅太爷升了内阁大学士，奉旨进京，已定于明年正月二十日宣麻，有三百里的文书去了。想舅太爷昼夜趱行，半个多月就要到了。侄儿特来回太太知道。”王夫人听说，…","so":0,"eo":0},{"surface":"宝玉","text":"朝门内官员有信。不多时，只见太监出来，立传钦天监。贾母便知不好，尚未敢动。稍刻，小太监传谕出来，说：“贾娘娘薨逝。”是年甲寅年十二月十八日立春，元妃薨日，是十二月十九日，已交卯年寅月，存年四十三岁。贾母含悲起身，只得出宫上轿回家。贾政等亦已得信，一路悲戚。到家中，邢夫人、李纨、凤姐、宝玉等出厅，分东西迎着贾母，请了安，并贾政、王夫人请安，大家哭泣不提。","so":0,"eo":0},{"surface":"宝玉","text":"独有宝玉原是无职之人，又不念书，代儒学里知他家里有事，也不来管他；贾政正忙，自然没有空儿查他。想来宝玉趁此机会，竟可与妹妹们天天畅乐：不料他自失了玉后，终日懒怠，说话也糊涂了。贾母等出门回来，有人叫他去请安，便去；没人叫他，他也不动。袭人等怀着鬼胎，又不敢去招惹他，恐他生气。每天茶饭，端到面前便吃，不来也不要。袭人看这光景，不象是有气，竟象是有病的。袭人偷着空儿到潇馆告诉紫鹃，说是：“二爷这么着，求姑娘给他开导开导。”紫鹃虽即告诉黛玉，…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗也知失玉。因薛姨妈那日应了宝玉的亲事，回去便告诉了宝钗。薛姨妈还说：“虽是你姨妈说了，我还没有应准，说等你哥哥回来再定。你愿意不愿意？”宝钗反正色的对母亲道：“妈妈这话说错了，女孩儿家的事情是父母作主的，如今我父亲没了，妈妈应该作主的，再不然问哥哥，怎么问我来？”所以薛姨妈更爱惜他，说他虽是从小娇生惯养的，却也生来的贞静，因此在他面前反不提起宝玉了。宝钗自从听此一说，把“宝玉”两字自然更不提起了。如今虽然听见失了玉，心里也甚惊疑，倒…","so":0,"eo":0}]},{"chap":96,"ctitle":"第96章 瞒消息凤姐设奇谋 泄机关颦儿迷本性","deeds":[{"surface":"宝玉","text":"话说贾琏拿了那块假玉忿忿走出，到了书房。那个人看见贾琏的气色不好，心里先发了虚了，连忙站起来迎着。刚要说话，只见贾琏冷笑道：“好大胆，我把你这个混账东西！这里是什么地方儿，你敢来掉鬼！”回头便问：“小厮们呢？”外头轰雷一般，几个小厮齐声答应。贾琏道：“取绳子去捆起他来！等老爷回来回明了，把他送到衙门里去。”众小厮又一齐答应：“预备着呢。”嘴里虽如此，却不动身。那人先唬的手足无措，见这般势派，知道难逃公道，只得跪下给贾琏碰头，一口声声只叫…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾政那日拜客回来，众人因为灯节底下，恐怕贾政生气，巳过去的事了，便也都不肯回。只因元妃的事，忙碌了好些时、近日宝玉又病着，虽有旧例家宴，大家无兴、也无有可记之事。","so":0,"eo":0},{"surface":"宝玉","text":"王夫人不免暗里落泪，悲女哭弟，又为宝玉耽忧。如此连三接二，都是不随意的事，那里搁得住？便有些心口疼痛起来。又加贾琏打听明白了，来说道：“舅太爷是赶路劳乏，偶然感冒风寒，到了十里屯地方，延医调治，无奈这个地方没有名医，误用了药，一剂就死了。但不知家眷可到了那里没有。”王夫人听了，一阵心酸，便心口疼得坐不住，叫彩云等扶了上炕，还扎挣看叫贾琏去回了贾政：“即速收拾行装，迎到那里，帮着料理完毕，即刻回来告诉我们，好叫你媳妇儿放心。”贾琏不敢违拗…","so":0,"eo":0},{"surface":"宝玉","text":"贾政早已知道，心里很不受用，又知宝玉失玉以后，神志昏愦，医药无效，又值王夫人心疼。那年正值京察，工部将贾政保列一等，二月，吏部带领引见。皇上念贾政勤俭谨慎，即放了江西粮道。即日谢恩，已奏明起程日期。虽有众亲朋贺喜，贾政也无心应酬。只念家中人口不宁，又不敢耽延在家。正在无计可施，只听见贾母那边叫：“请老爷。”贾政即忙进去。看见王夫人带着病也在那里，便向贾母请了安。贾母叫他坐下，便说：“你不日就要赴任，我有多少话与你说，不知你听不听？”说着…","so":0,"eo":0},{"surface":"宝玉","text":"王夫人见贾政说着也有些眼圈儿红，知道心里是疼的，便叫袭人扶了宝玉来。宝玉见了他父亲，袭人叫他请安，他便请了个安。贾政见他脸面很瘦，目光无神，大有疯傻之状，便叫人扶了进去，便想到：“自己也是望六的人了，如今又放外任，不知道几年回来。倘或这孩子果然不好，一则年老无嗣，虽说有孙子，到底隔了一层；二则老太太最疼的是宝玉，若有差错，可不是我的罪名更重了？”瞧瞧王夫人一包眼泪，又想到他身上，复站起来说：“老太太这么大年纪，想法儿疼孙子，做儿子的还敢…","so":0,"eo":0},{"surface":"宝玉","text":"贾政听了，原不愿意，只是贾母做主，不敢违命，勉强陪笑说道：“老太太想得极是，也很妥当。只是要吩咐家下众人，不许吵嚷得里外皆知，这要耽不是的。姨太太那边只怕不肯，若是果真应了，也只好按着老太太的主意办去。”贾母道：“姨太太那里有我呢，你去罢。”贾政答应出来，心中好不自在。因赴任事多，部里领凭，亲友们荐人，种种应酬不绝，竟把宝玉的事听凭贾母交与王夫人凤姐儿了。惟将荣禧堂后身王夫人内屋旁边一大跨所二十余间房屋指与宝玉，余者一概不管。贾母定了主…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉见过贾政，袭人扶回里间炕上。因贾政在外，无人敢与宝玉说话，宝玉便昏昏沉沉的睡去，贾母与贾政所说的话，宝玉一句也没有听见。袭人等却静静儿的听得明白。头里虽也听得些风声，到底影响，只不见宝钗过来，却也有些信真。今日听了这些话，心里方才水落归漕，倒也喜欢。心里想道：“果然上头的眼力不错，这才配的是，我也造化！若他来了，我可以卸了好些担子。但是这一位的心里只有一个林姑娘，幸亏他没有听见，若知道了，又不知要闹到什么分儿了。”袭人想到这里，…","so":0,"eo":0},{"surface":"宝玉","text":"那袭人同了王夫人到了后间，便跪下哭了。王夫人不知何意，把手拉着他说：“好端端的，这是怎么说？有什么委屈，起来说。”袭人道：“这话奴才是不该说的，这会子因为没有法儿了！”王夫人道：“你慢慢的说。”袭人道：“宝玉的亲事，老太太、太太已定了宝姑娘了，自然是极好的一件事。只是奴才想着，太太看去，宝玉和宝姑娘好，还是和林姑娘好呢？”王夫人道：“他两个因从小儿在一处，所以宝玉和林姑娘又好些。”袭人道：“不是‘好些’。”便将宝玉素与黛玉这些光景一一的…","so":0,"eo":0}]},{"chap":97,"ctitle":"第97章 林黛玉焚稿断痴情 薛宝钗出闺成大礼","deeds":[{"surface":"宝玉","text":"话说黛玉到潇湘馆门口，紫鹃说了一句话，更动了心，一时吐出血来，几乎晕倒，亏了紫鹃还同着秋纹，两个人搀扶着黛玉到屋里来。那时秋纹去后，紫鹃雪雁守着，见他渐渐苏醒过来，问紫鹃道：“你们守着哭什么？”紫鹃见他说话明白，倒放了心了，因说：“姑娘刚才打老太太那边回来，身上觉着不大好，唬的我们没了主意，所以哭了。”黛玉笑道：“我那里就能够死呢。”这一句话没完，又喘成一处。原来黛玉因今日听得宝玉宝钗的事情，这本是他数年的心病，一时急怒，所以迷惑了本性…","so":0,"eo":0},{"surface":"宝玉","text":"且说次日凤姐吃了早饭过来，便要试试宝玉，走进屋里说道：“宝兄弟大喜！老爷已择了吉日，要给你娶亲了。你喜欢不喜欢？”宝玉听了，只管瞅着凤姐笑，微微的点点头儿。凤姐笑道：“给你娶林妹妹过来，好不好？”宝玉却大笑起来。凤姐看着，也断不透他是明白，是糊涂，因又问道：“老爷说：你好了就给你娶林妹妹呢。若还是这么傻，就不给你娶了。”宝玉忽然正色道：“我不傻，你才傻呢。”说着，便站起来说：“我去瞧瞧林妹妹，叫他放心。”凤姐忙扶住了，说：“林妹妹早知道…","so":0,"eo":0},{"surface":"宝玉","text":"说着，王夫人也来。大家到了薛姨妈那里，只说：“惦记着这边的事，来瞧瞧。”薛姨妈感激不尽，说些薛蟠的话。喝了茶，薛姨妈要叫人告诉宝钗，凤姐连忙拦住，说：“姑妈不必告诉宝妹妹。”又向薛姨妈陪笑说道：“老太太此来，一则为瞧姑妈，二则也有句要紧的话，特请姑妈到那边商议。”薛姨妈听了，点点头儿说：“是了。”于是大家又说些闲话，便回来了。当晚薛姨妈果然过来，见过了贾母，到王夫人屋里来，不免说起王子腾来，大家落了一回泪。薛姨妈便问道：“刚才我到老太太…","so":0,"eo":0},{"surface":"宝玉","text":"次日，贾琏过来见了薛姨妈，请了安，便说：“明日就是上好的日子。今日过来回姨太太，就是明日过礼罢。只求姨太太不要挑饬就是了。”说着，捧过通书来。薛姨妈也谦逊了几句，点头应允。贾琏赶着回去，回明贾政。贾政便道：“你回老太太说：既不叫亲友们知道，诸事宁可简便些。若是东西上，请老太太瞧了就是了，不必告诉我。”贾琏答应，进内将话回明贾母。这里王夫人叫了凤姐命人将过礼的物件都送与贾母过目，并叫袭人告诉宝玉。那宝玉又嘻嘻的笑道：“这里送到园里，回来园…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉认以为真，心里大乐，精神便觉的好些，只是语言总有些疯傻。那过札的回来，都不提名说姓，因此上下人等虽都知道，只因凤姐吩咐，都不敢走漏凤声。","so":0,"eo":0},{"surface":"宝玉","text":"且说黛玉虽然服药，这病日重一日。紫鹃等在旁苦劝，说道：“事情到了这个分儿，不得不说了。姑娘的心事，我们也都知道。至于意外之事，是再没有的。姑娘不信，只拿宝玉的身子说起，这样大病，怎么做得亲呢？姑娘别听瞎话，自己安心保重才好。”黛玉微笑一笑，也不答言，又咳嗽数声，吐出好些血来。紫鹃等看去，只有一息奄奄，明知劝不过来，惟有守着流泪。天天三四趟去告诉贾母，鸳鸯测度贾母近日比前疼黛玉的心差了些，所以不常去回。况贾母这几日的心都在宝钗、宝玉身上，…","so":0,"eo":0},{"surface":"宝玉","text":"雪雁料是要他前日所理的诗稿，因找来送到黛玉跟前。黛玉点点头儿，又抬眼看那箱子。雪雁不解，只是发怔。黛玉气的两眼直瞪，又咳嗽起来，又吐了一口血。雪雁连忙回身取了水来，黛玉漱了，吐在盂内。紫鹃用绢子给他拭了嘴，黛玉便拿那绢子指着箱子，又喘成一处，说不上来，闭了眼。紫鹃道：“姑娘歪歪儿罢。”黛玉又摇摇头儿。紫鹃料是要绢子，便叫雪雁开箱，拿出一块白绫绢子来。黛玉瞧了，撂在一边，使劲说道：“有字的。”紫鹃这才明白过来要那块题诗的旧帕，只得叫雪雁拿…","so":0,"eo":0},{"surface":"宝玉","text":"到了次日早起，觉黛玉又缓过一点儿来。饭后，忽然又嗽又吐，又紧起来。紫鹃看着不好了，连忙将雪雁等都叫进来看守，自己却来回贾母。那知到了贾母上房，静悄悄的，只有两三个老妈妈和几个做粗活的丫头在那里看屋子呢。紫鹃因问道：“老太太呢？”那些人都说：“不知道。”紫鹃听这话诧异，遂到宝玉屋里去看，竟也无人。遂问屋里的丫头，也说不知。紫鹃巳知八九：“但这些人怎么竟这样狠毒冷淡！”又想到黛玉这几天竟连一个人问的也没有，越想越悲，索性激起一腔闷气来，一扭…","so":0,"eo":0}]},{"chap":98,"ctitle":"第98章 苦绛珠魂归离恨天 病神瑛泪洒相思地","deeds":[{"surface":"宝玉","text":"话说宝玉见了贾政，回至房中，更觉头昏脑闷，懒怠动弹，连饭也没吃，便昏沉睡去。仍日日延医诊治，服药不效，索性连人也认不明白了。大家扶着他坐起来，还是象个好人。一连闹了几天。那日恰是回九之期，说是若不过去，薛姨妈脸上过不去；若说去呢，宝玉这般光景，明知是为黛玉而起，欲要告诉明白。又恐气急生变。宝钗是新媳妇，又难劝慰，必是姨妈过来才好。若不回九，姨妈嗔怪。便与王夫人、凤姐商议道：“我看宝玉竟是魂不守舍，起动是不怕的。用两乘小轿，叫人扶着，从园…","so":0,"eo":0},{"surface":"宝玉","text":"回家，宝玉越加沉重。次日连起坐都不能了，日重一日，甚至汤水不进。薛姨妈等忙了手脚，各处遍请名医，皆不识病源。只有城外破寺中住着个穷医姓毕别号知庵的，诊得病源是悲喜激射，冷暖失调，饮食失时，忧忿滞中，正气壅闭，此内伤外感之症。于是度量用药，至晚服了，二更后，果然省些人事，便要喝水，贾母、王夫人等才放了心，请了薛姨妈带了宝钗，都到贾母那里，暂且歇息。宝玉片时清楚，自料难保，见诸人散后，房中只有袭人，因唤袭人至跟前，拉着手哭道：“我问你，宝姐…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗恰好同着莺儿过来，也听见了。便说道：“你放着病不保养，何苦说这些不吉利的话呢？老太太才安慰了些，你又生出事来。老太太一生疼你一个，如今八十多岁的人了，虽不图你的诰封，将来你成了人，老太太也看着乐一天，也不枉了老人家的苦心。太太更是不必说了，一生的心血精神，抚养了你这一个儿子，若是半途死了，太太将来怎么样呢？我虽是薄命，也不至于此。据此三件看来，你就要死，那天也不容你死的，所以你是不能死的。只管安稳着养个四五天后，风邪散了，太和正气一…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，不禁放声大哭，倒在床上，忽然眼前漆黑，辨不出方向。心中正自恍惚，只见眼前好象有人走来。宝玉茫然问道：“借问此是何处？”那人道：“此阴司泉路。你寿未终，何故至此？”宝玉道：“适闻有一故人已死，遂寻访至此，不觉迷途。”那人道：“故人是谁？”宝玉道：“姑苏林黛玉。”那人冷笑道：“林黛玉生不同人，死不同鬼，无魂无魄，何处寻访？凡人魂魄，聚而成形，散而为气，生前聚之，死则散焉。常人尚无可寻访，何况林黛玉呢？汝快回去罢。”宝玉听了，呆了半…","so":0,"eo":0},{"surface":"宝玉","text":"起初宝钗早知黛玉已死，因贾母等不许众人告诉宝玉知道，恐添病难治。自己却深知宝玉之病实因黛玉而起，失玉次之，故趁势说明，使其痛决绝，神魂一归，庶可疗治。贾母、王夫人等不知宝钗的用意，深怪他造次，后来见宝玉醒了过来，方才放心，立刻到外书房请了毕大夫进来诊视。那大夫进来诊了脉，便道奇怪：“这回脉气沉静，神安郁散，明日进调理的药，就可以望好了。”说着出去。众人各自安心散去。袭人起初深怨宝钗不该告诉，惟是口中不好说出。莺儿背地也说宝钗道：“姑娘忒…","so":0,"eo":0},{"surface":"宝玉","text":"那宝钗任人诽谤，并不介意，只察宝玉心病，暗下针砭。一日，宝玉渐觉神志安定，虽一时想起黛玉，尚有糊涂。更有袭人缓缓的将“老爷选定的宝姑娘为人和厚，嫌林姑娘秉性古怪，原恐早夭。老太太恐你不知好歹，病中着急，所以叫雪雁过来哄你”的话，时常劝解。宝玉终是心酸落泪。欲待寻死，又想着梦中之言，又恐老太太、太太生气，又不得撩开。又想黛玉已死，宝钗又是第一等人物，方信“金石姻缘”有定，自己也解了好些。宝钗看来不妨大事，于是自己心也安了，只在贾母、王夫人…","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉成家的那一日，黛玉白日已经昏晕过去，却心头口中一丝微气不断，把个李纨和紫鹃哭的死去活来。到了晚间，黛玉却又缓过来了，微微睁开眼，似有要水要汤的光景。此时雪雁已去，只有紫鹃和李纨在旁。紫鹃便端了一盏桂圆汤和的梨汁，用小银匙灌了两三匙。黛玉闭着眼，静养了一会子，觉得心里似明似暗的。此时李纨见黛玉略缓，明知是回光返照的光景，却料着还有一半天耐头，自己回到稻香村，料理了一回事情。","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃忙了，连忙叫人请李纨。可巧探春来了。紫鹃见了，忙悄悄的说道：“三姑娘，瞧瞧林姑娘罢。”说着，泪如雨下。探春过来，摸了摸黛玉的手，已经凉了，连目光也都散了。探春、紫鹃正哭着叫人端水来给黛玉擦洗，李纨赶忙进来了。三个人才见了，不及说话。刚擦着，猛听黛玉直声叫道：“宝玉！宝玉！你好……”说到“好”字，便浑身冷汗，不作声了。紫鹃等急忙扶住，那汗愈出，身子便渐渐的冷了。探春、李纨叫人乱着拢头穿衣，只见黛玉两眼一翻，呜呼！","so":0,"eo":0}]},{"chap":99,"ctitle":"第99章 守官箴恶奴同破例 阅邸报老舅自担惊","deeds":[{"surface":"宝玉","text":"话说凤姐见贾母和薛姨妈为黛玉伤心，便说：“有个笑话儿说给老太太和姑妈听。”未从开口，先自笑了。因说道：“太太和姑妈打谅是那里的笑话儿？就是咱们家的新姑爷新媳妇啊。”贾母道：“怎么了？”凤姐拿手比着道：“一个这么坐着，一个这么站着；一个这么扭过去，一个这么转过来，一个又……”说到这里，贾母已经大笑起来，说道：“你好生说罢。倒不是他们两口儿，你倒把人怄的受不得了。”薛姨蚂也笑道：“你往下直说罢，不用比了。”凤姐才说道：“刚才我到宝兄弟屋里，…","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉虽然病好，宝钗有时高兴，翻书观看，谈论起来，宝玉所有常见的尚可记忆，若论灵机儿大不似先，连他自己也不解。宝钗明知是“通灵”失去，所以如此。倒是袭人时常说他：“你为什么把从前的灵机儿都没有了？倒是忘了旧毛病也好，怎么脾气还照旧，独道理上更糊涂了呢？”宝玉听了，并不生气，反是嘻嘻的笑。有时宝玉顺性胡闹，亏宝钗劝着，略觉收敛些。袭人倒可小费些唇舌，惟知悉心伏侍。别的丫头素仰宝钗贞静和平，各人心服，无不安静。只有宝玉到底是爱动不爱静的，…","so":0,"eo":0}]},{"chap":100,"ctitle":"第100章 破好事香菱结深恨 悲远嫁宝玉感离情","deeds":[{"surface":"宝玉","text":"是日，宝钗在贾母屋里，听得王夫人告诉老太太要聘探春一事。贾母说道：“既是同乡的人，很好。只是听见说那孩子到过我们家里，怎么你老爷没有提起？”王夫人道：“连我们也不知道。”贾母道：“好是好，但只道儿太远。虽然老爷在那里，倘或将来老爷调任，可不是我们孩子太单了吗？”王夫人道：“两家都是做官的，也是拿不定。或者那边还调进来，即不然，终有个叶落归根。况且老爷既在那里做官，上司已经说了，好意思不给么？想来老爷的主意定了，只是不敢做主，故遣人来回老…","so":0,"eo":0},{"surface":"宝玉","text":"这里探春又气又笑又伤心，也不过自己掉泪而已。坐了一回，闷闷的走到宝玉这边来。宝玉问道：“三妹妹，我听见林妹妹死的时候，你在那里来着。我还听见说：林妹妹死的时候，远远的有音乐之声。或者他是有来历的，也未可知。”探春笑道：“那是你心里想着罢了。但只那夜却怪，不象人家鼓乐的声儿，你的话或者也是。”宝玉听了，更以为实。又想前日自己神魂飘荡之时，曾见一人，说是黛玉生不同人，死不同鬼，必是那里的仙子临凡。又想起那年唱戏做的嫦娥，飘飘艳艳，何等风致。…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉本想念黛玉，因此及彼，又想跟黛玉的人已经云散，更加纳闷。闷到无可如何，忽又想黛玉死的这样清楚，必是离凡返仙去了，反又欢喜。忽然听见袭人和宝钗那里讲究探春出嫁之事，宝玉听了，“啊呀”的一声，哭倒在炕上。唬得宝钗袭人都来扶起，说：“怎么了？”宝玉早哭的说不出来。定了一回子神，说道：“这日子过不得了，我姊妹们都一个一个的散了！林妹妹是成了仙去了。大姐姐呢，已经死了。这也罢了，没天天在一块儿。二姐姐碰着了一个混账不堪的东西。三妹妹又要远嫁，…","so":0,"eo":0}]},{"chap":101,"ctitle":"第101章 大观园月夜警幽魂 散花寺神签惊异兆","deeds":[{"surface":"宝玉","text":"凤姐听了，气的干咽，要和他分证，想了一想，又忍住了，勉强陪笑道：“何苦来生这么大气？大清早起，和我叫喊什么？谁叫你应了人家的事？你既应了，只得耐烦些，少不得替人家办办，也没见这个人自己有为难的事，还有心肠唱戏摆酒的闹。”贾琏道：“你可说么！你明儿倒也问问他。”凤姐诧异道：“问谁！”贾琏道：“问谁？问你哥哥！”凤姐道：“是他吗？”贾琏道：“可不是他，还有谁呢。”凤姐忙问道：“他又有什么事，叫你替他跑？”贾琏道：“你还在坛子里呢。”凤姐道：…","so":0,"eo":0},{"surface":"宝玉","text":"且说凤姐梳了头，换了衣服，想了想，虽然自己不去，也该带个信儿；再者宝钗还是新媳妇出门子，自然要过去照应照应的。于是见过王夫人，支吾了一件事，便过来到宝玉房中。只见宝玉穿着衣服，歪在炕上，两个眼睛呆呆的看宝钗梳头。凤姐站在门口，还是宝钗一回头看见了，连忙起身让坐。宝玉也爬起来，凤姐才笑嘻嘻的坐下。宝钗因说麝月道：“你们瞧着二奶奶进来，也不言语声儿。”麝月笑着道：“二奶奶头里进来就摆手儿不叫言语么。”凤姐因向宝玉道：“你还不走，等什么呢？没…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉一面也搭讪着，找这个弄那个。凤姐道：“你先去罢，那里有个爷们等着奶奶们一块儿走的理呢。”宝玉道：“我只是嫌我这衣裳不大好，不如前年穿着老太太给的那件雀金呢好。”凤姐因怄他道：“你为什么不穿？”宝玉道：“穿着太早些。”凤姐忽然想起，自悔失言。幸亏宝钗也和王家是内亲，只是那些丫头们跟前，已经不好意思了。袭人却接着说道：“二奶奶还不知道呢，就是穿得，他也不穿了。”凤姐儿道：“这是什么原故？”袭人道：“告诉二奶奶，真真的我们这位爷行的事都是…","so":0,"eo":0},{"surface":"宝玉","text":"凤姐儿看他两口儿这般恩爱缠绵，想起贾琏方才那种光景，甚实伤心，坐不住，便起身向宝钗笑道：“我和你上太太屋里去罢。”笑着出了房门，一同来见贾母。宝玉正在那里回贾母往舅舅家去。贾母点头说道：“去罢，只是少吃酒，早些回来，你身子才好些。”宝玉答应着出来，刚走到院内，又转身回来，向宝钗耳边说了几句，不知什么。宝钗笑道：“是了，你快去罢。”将宝玉催着去了。这里贾母和风姐、宝钗说了没三句话，只见秋纹进来传说：“二爷打发焙茗回来说，请二奶奶。”宝钗道…","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉这一日正睡午觉，醒来不见宝钗，正要问时，只见宝钗进来。宝玉问道：“那里去了，半日不见？”宝钗笑道：“我给凤姐姐瞧一回签。”宝玉听说，便问是怎么样的。宝钗把签帖念了一回，又道：“家中人人都说好的，据我看，这‘衣锦还乡’四字里头，还有缘故。后来再瞧罢了。”宝玉道：“你又多疑了，妄解圣意。‘衣锦还乡’四字，从古至今都知道是好的，今儿你又偏生看出缘故来了。依你说这‘衣锦还乡’还有什么别的解说？”宝钗正要解说，只见王夫人那边打发丫头过来请…","so":0,"eo":0}]},{"chap":102,"ctitle":"第102章 宁国府骨肉病灾襟 大观园符水驱妖孽","deeds":[{"surface":"宝玉","text":"话说王夫人打发人来唤宝钗，宝钗连忙过来请了安。王夫人道：“你三妹妹如今要出嫁了，你们作嫂子的大家开导开导他，也是你们姊妹之情。况且他也是个明白孩子，我看你们两个也很合的来。只是我听见说，宝玉听见他三妹妹出门子，哭的了不的。你也该劝劝他才是。如今我的身子是十病九痛的，你二嫂子也是三日好两日不好。你还心地明白些，诸事该管的，也别说只管吞着，不肯得罪人。将来这一番家事都是你的担子。”宝钗答应着。王夫人又说道：“还有一件事，你二嫂子昨儿带了柳家…","so":0,"eo":0},{"surface":"宝玉","text":"次日，探春将要起身，又来辞宝玉。宝玉自然难割难分。探春倒将纲常大体的话，说的宝玉始而低头不语，后来转悲作喜，似有醒悟之意。于是探春放心辞别众人，竟上轿登程，水舟陆车而去。","so":0,"eo":0},{"surface":"宝玉","text":"先前众姊妹们都住在大观园中，后来贾妃薨后，也不修葺。到了宝玉娶亲，林黛玉一死，史湘云回去，宝琴在家住着，园中人少，况兼天气寒冷，李纨自妹、探春、惜春等俱挪回旧所。到了花朝月夕，依旧相约玩耍。如今探春一去，宝玉病后不出屋门，益发没有高兴的人了。所以园中寂寞，只有几家看园的人住着。","so":0,"eo":0},{"surface":"宝玉","text":"贾蓉奉上卦金，送了出去，回禀贾珍，说是：“母亲的病，是在旧宅傍晚得的，为撞着什么‘伏尸白虎’。”贾珍道：“你说你母亲前日从园里走回来的，可不是那里撞着的！你还记得你二婶娘到园里去，回来就病了？他虽没有见什么，后来那些丫头老婆们都说是山子上一个毛烘烘的东西，眼睛有灯笼大，还会说话，他把二奶奶赶回来了，唬出一场病来。”贾蓉道：“怎么不记得！我还听见宝二叔家的焙茗说，睛雯做了园里芙蓉花的神了；林姑娘死了，半空里有音乐，必定他也是管什么花儿了。…","so":0,"eo":0},{"surface":"宝玉","text":"却说晴雯的表兄吴贵，正住在园门口。他媳妇自从晴雯死后，听见说作了花神，每日晚间便不敢出门。这一日，吴贵出门买东西，回来晚了。那媳妇子本有些感冒着了，日间吃错了药，晚上吴贵到家，已死在炕上。外面的人因那媳妇子不大妥当，便说妖怪爬过墙来吸了精去死的。于是老太太着急的了不得，另派了好些人将宝玉的住房围往，巡逻打更。这些小丫头们还说，有看见红脸的，有看见很俊的女人的，吵嚷不休，唬的宝玉天天害怕。亏得宝钗有把持，
