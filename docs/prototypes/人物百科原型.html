凤姐","text":"话说王夫人听见邢夫人来了，连忙迎着出去。邢夫人犹不知贾母已知鸳鸯之事，正还又来打听信息，进了院门，早有几个婆子悄悄的回了他，他才知道。待要回去，里面已知，又见王夫人接出来了，少不得进来。先与贾母请安，贾母一声儿不言语，自己也觉得愧悔。凤姐儿早指一事回避了。鸳鸯也自回房去生气。薛姨妈、王夫人等恐碍着邢夫人的脸面，也都渐浙退了。邢夫人且不敢出去。贾母见无人，方说道：“我听见你替你老爷说媒来了。你倒也‘三从四德’的，只是这贤惠也太过了！你们如…","so":0,"eo":0},{"surface":"凤姐","text":"说毕，命人来：“请了姨太太你姑娘们来。才高兴说个话儿，怎么又都散了？”丫头忙答应找去了。众人赶忙的又来。只有薛姨妈向那丫鬟道：“我才来了，又做什么去？你就说我睡了。”那丫头道：“好亲亲的姨太太，姨祖宗！我们老太太生气呢。你老人家不去，没个开交了。只当疼我们罢，你老人家怕走，我背了你老人家去。”薛姨妈笑道：“小鬼头儿，你怕什么？不过骂几句就完了。”说着，只得和这小丫头子走来。贾母忙让坐，又笑道：“咱们斗牌罢？姨太太的牌也生了，咱们一处坐着…","so":0,"eo":0},{"surface":"凤姐","text":"一时鸳鸯来了，便坐在贾母下首。鸳鸯之下，便是凤姐儿。铺下红毡，洗牌告么，五人起牌，斗了一回。鸳鸯见贾母的牌已十成，只等一张二饼，便递了暗号儿与凤姐儿。凤姐儿正该发牌，便故意踌躇了半晌，笑道：“我这一张牌定在姨妈手里扣着呢，我若不发这一张牌，再顶不下来的。”薛姨妈道：“我手里并没有你的牌。”凤姐儿道：“我回来是要查的。”薛姨妈道：“你只管查。你且发下来，我瞧瞧是张什么。”凤姐儿便送在薛姨妈跟前，薛姨妈一看，是个二饼，便笑道：“我倒不稀罕他…","so":0,"eo":0},{"surface":"凤姐","text":"平儿依言放下钱，也笑了一回，方回来。至院门前，遇见贾琏，问他：“太太在那里呢？老爷叫我请过去呢。”平儿忙笑道：“在老太太跟前站了这半日，还没动呢。趁早儿丢开手罢。老太太生了半日气，这会子亏二奶奶凑了半日的趣儿，才略好了些。”贾琏道：“我过去，只说讨老太太示下，十四往赖大家去不去，好预备轿子。又请了太太，又凑了趣儿，岂不好呢。”平儿笑道：“依我说，你竟别过去罢。合家子连太太、宝玉都有了不是，这会子你又填限去了。”贾琏道：“已经完了，难道还…","so":0,"eo":0}]},{"chap":49,"ctitle":"第49章 琉璃世界白雪红梅 脂粉香娃割腥啖膻","deeds":[{"surface":"凤姐","text":"大家来至王夫人上房，只见黑压压的一地。又有邢夫人的嫂子，带了女儿岫烟进京来投邢夫人的，可巧凤姐之兄王仁也正进京，两亲家一处搭帮来了。走至半路泊船时，遇见李纨寡婶，带着两个女儿，长名李纹，次名李绮，也上京，大家叙起来，又是亲戚，因此三家一路同行。后有薛蟠之从弟薛蝌，因当年父亲在京时，已将胞妹薛宝琴许配都中梅翰林之子为妻，正欲进京聘嫁，闻得王仁进京，他也随后带了妹子赶来。所以今日会齐了，来访投各人亲戚。于是大家见礼叙过，贾母、王夫人都欢喜非…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉听了，喜的眉开眼笑，忙说道：“倒是你明白。我终久是个糊涂心肠，空喜欢了一会子，却想不到这上头。”说着，兄妹两个一齐往贾母处来。果然王夫人已认了薛宝琴做干女儿。贾母喜欢非常，不命往园中住，晚上跟着贾母一处安寝。薛蝌自向薛蟠书房中住下了。贾母和邢夫人说：“你侄女儿也不必家去了，园里住几天，逛逛再去。”邢夫人兄嫂家中原艰难，这一上京原仗的是邢夫人与他们治房舍帮盘缠，听如此说，岂不愿意。邢夫人便将邢岫烟交与凤姐儿。凤姐儿算着园中妹妹多，性情…","so":0,"eo":0},{"surface":"凤姐","text":"当下安插既定，谁知忠靖侯史鼎又迁委了外省大员，不日要带家眷去上任，贾母因舍不得湘云，便留下他了，接到家中。原要命凤姐儿另设一处与他住，史湘云执意不肯，只要和宝钗一处住，因此也就罢了。","so":0,"eo":0},{"surface":"凤姐","text":"此时大观园中、比先又热闹了多少，李纨为首，徐者迎春、探春、惜春、宝钗、黛玉、湘云、李纹、李绮、宝琴、邢岫烟，再添上凤姐儿和宝玉，一共十三人。叙起年庚，除李纨年纪最长，凤姐次之，馀者皆不过十五六七岁，大半同年异月，连他们自己也不能记清谁长谁幼，并贾母、王夫人及家中婆子丫头也不能细细分清，不过是“姐”“妹”“兄”“弟”四个字，随便乱叫。","so":0,"eo":0},{"surface":"凤姐","text":"到了次日清早，宝玉因心里惦记者，这一夜没好生得睡，天亮了就爬起来。掀起帐子一看，虽然门窗尚掩，只是窗上光辉夺目，心内早踌躇起来，埋怨定是晴了，日光已出。一面忙起来揭起窗屉，从玻璃窗内往外一看，原来不是日光，竟是一夜的雪，下的将有一尺厚，天上仍是搓绵扯絮一般。宝玉此时喜欢非常，忙唤起人来，盥漱已毕，只穿一件茄色哆罗呢狐狸皮袄，罩一件海龙小鹰膀褂子，束了腰；披上玉针蓑，带了金藤笠，登上沙棠屐，忙忙的往芦雪庭来。出了院门，四顾一望，并无二色，…","so":0,"eo":0},{"surface":"凤姐","text":"宝琴正在里间房内梳洗更衣。一时众姐妹来齐，宝玉只嚷饿了，连连催饭。好容易等摆上饭来，头一样菜是牛乳蒸羊羔，贾母就说：“这是我们有年纪人的药，没见天日的东西，可惜你们小孩子吃不得。今儿另外有新鲜鹿肉，你们等着吃罢。”众人答应了。宝玉却等不得，只拿茶泡了一碗饭，就着野鸡瓜子忙忙的爬拉完了。贾母道：“我知道你们今儿又有事情，连饭也不顾吃了。”就叫：“留着鹿肉给他晚上吃罢。”凤姐儿忙说：“还有呢，吃残了的倒罢了。”湘云就和宝玉计较道：“有新鹿肉…","so":0,"eo":0},{"surface":"凤姐","text":"那边凤姐打发平儿回复不来，为发放年例正忙着呢。湘云见了平儿，那里肯放？平儿也是个好玩的，素日跟着凤姐儿无所不至，见如此有趣，乐得玩笑，因而退去手上的镯子，三个人围着火，平儿便要先烧三块吃。那边宝钗、黛玉平素看惯了，不以为异，宝琴及李婶娘深为罕事。探春和李纨等已议定了题韵。探春笑道：“你们闻闻，香气这里都闻见了，我也吃去。”说着，也找了他们来。李纨也随来，说：“客已齐了，你们还吃不够吗？”湘云一面吃，一面说道：“我吃这个方爱吃酒，吃了酒才…","so":0,"eo":0}]},{"chap":50,"ctitle":"第50章 芦雪庭争联即景诗 暖香坞雅制春灯谜","deeds":[{"surface":"凤姐","text":"话说薛宝钗道：“到底分个次序，让我写出来。”说着，便令众人拈阄为序。起首恰是李氏，然后按次各各开出。凤姐儿道：“既这么说，我也说一句在上头。”众人都笑起来了，说：“这么更妙了。”宝钗将“稻香老农”之上补了一个“凤”字，李纨又将题目讲给他听。凤姐儿想了半天，笑道：“你们别笑话我，我只有了一句粗话，可是五个字的。下剩的我就不知道了。”众人都笑道：“越是粗话越好。你说了，就只管干正事去罢。”凤姐儿笑道：“想下雪必刮北风，昨夜听见一夜的北风，我…","so":0,"eo":0},{"surface":"凤姐","text":"说着，仍坐了竹椅轿，大家围随，过了藕香榭，穿入一条夹道，东西两边皆是过街门，门楼上里外都嵌着石头匾。如今进的是西门，向外的匾上凿着“穿云”二字，向里的凿着“度月”两字。来至堂中，进了向南的正门，贾母下了轿，惜春已接出来了。从里面游廊过去，便是惜春卧房，厦檐下挂着“暖香坞”的匾，早有几个人打起猩红毡帘，已觉暖气拂脸。大家进入屋里，贾母并不归坐，只问惜春：“画到那里了？”借春因笑回：“天气寒冷了，胶性都凝涩不润，画了恐不好看，故此收起来了。…","so":0,"eo":0},{"surface":"凤姐","text":"他一行说，众人一行笑。凤姐儿也不等贾母说话，便命人抬过轿来。贾母笑着挽了凤姐儿的手，仍上了轿，带着众人，说笑出了夹道东门。一看四面，粉妆银砌，忽见宝琴披着凫靥裘，站在山坡背后遥等，身后一个丫鬟，抱着一瓶红梅。众人都笑道：“怪道少了两个，他却在这里等着，也弄梅花去了！”贾母喜的忙笑道：“你们瞧，这雪坡儿上，配上他这个人物儿，又是这件衣裳，后头又是这梅花，象个什么？”众人都笑道：“就象老太太屋里挂的仇十洲画的《艳雪图》。”贾母摇头笑道：“那…","so":0,"eo":0},{"surface":"凤姐","text":"说话之间，已出了园门，来至贾母房中。吃毕饭大家又说笑了一回，忽见薛姨妈也来了，说：“好大雪，一日也没过来望候老太太。今日老太太倒不高兴？正该赏雪才是。”贾母笑道：“何曾不高兴了！我找了他们姐妹去玩了一会子。”薛姨妈笑道：“昨儿晚上我原想着今日要和我们姨太太借一天园子，摆两桌粗酒，请老太太赏雪的；又见老太太安歇的早，我听见宝儿说：‘老太太心里不大爽。’因此如今也不敢惊动。早知如此，我竟该请了才是呢。”贾母笑道：“这才是十月，是头场雪，往后…","so":0,"eo":0},{"surface":"凤姐","text":"贾母因又说及宝琴雪下折梅，比画儿上还好，又细问他的年庚八字并家内景况。薛姨妈度其意思，大约是要给他求配。薛姨妈心中因也遂意，只是已许过梅家了，因贾母尚未说明，自己也不好拟定，遂半吐半露告诉贾母道：“可惜了这孩子没福，前年他父亲就没了。他从小儿见的世面倒多，跟他父亲四山五岳都走遍了。他父亲好乐的，各处因有买卖，带了家眷这一省逛一年，明年又到那一省逛半年，所以天下十停走了有五六停了。那年在这里，把他许了梅翰林的儿子，偏第二年他父亲就辞世了。…","so":0,"eo":0}]},{"chap":51,"ctitle":"第51章 薛小妹新编怀古诗 胡庸医乱用虎狼药","deeds":[{"surface":"凤姐","text":"冬日天短，觉得又是吃晚饭时候，一齐往前头来吃晚饭。因有人回王夫人说：“袭人的哥哥花自芳，在外头回进来说，他母亲病重了，想他女儿。他来求恩典，接袭人家去走走。”王夫人听了，便说：“人家母子一场，岂有不许他去的呢。”一面就叫了凤姐来告诉了，命他酌量办理。凤姐儿答应了，回至屋里，便命周瑞家的去告诉袭人原故。吩咐周瑞家的：“再将跟着出门的媳妇传一个，你们两个人，再带两个小丫头子，跟了袭人去。分头派四个有年纪的跟车。要一辆大车，你们带着坐，一辆小…","so":0,"eo":0},{"surface":"凤姐","text":"半日，果见袭人穿戴了，两个丫头和周瑞家的拿着手炉和衣包。凤姐看袭人头上戴着几枝金钗珠钏，倒也华丽，又看身上穿着桃红百花刻丝银鼠袄，葱绿盘金彩绣绵裙，外面穿着青缎灰鼠褂。凤姐笑道：“这三件衣裳都是太太的，赏了你倒是好的。但这褂子太素了些，如今穿着也冷，你该穿一件大毛的。”袭人笑道：“太太就给了这件灰鼠的，还有件银鼠的。说赶年下再给大毛的呢。”凤姐笑道：“我倒有一件大毛的，我嫌风毛出的不好了，正要改去，也罢，先给你穿去罢。等年下太太给你做的…","so":0,"eo":0},{"surface":"凤姐","text":"平儿走去拿了出来，一件是件旧大红猩猩毡的，一件是半旧大红羽缎的。袭人道：“一件就当不起了。”平儿笑道：“你拿这猩猩毡的。把这件顺手带出来，叫人给邢大姑娘送去，昨儿那么大雪，人人都穿着不是猩猩毡、就是羽缎的，十来件大红衣裳，映着大雪，好不齐整。只有他穿着那几件旧衣裳，越发显的拱肩缩背，好不可怜见的，如今把这件给他罢。”凤姐笑道：“我的东西，他私自就要给人。我一个还花不够，再添上你提着，更好了。”众人笑道：“这都是奶奶素日孝敬太太，疼爱下人…","so":0,"eo":0},{"surface":"凤姐","text":"这里凤姐又将怡红院的嬷嬷唤了两上来，吩咐道：“袭人只怕不来家了。你们素日知道那个大丫头知好歹，派出来在宝玉屋里上夜。你们也好生照管着，别由着宝玉胡闹。”两个嬷嬷答应着去了，一时来回说：“派了晴雯和麝月在屋里，我们四个人原是轮流着带管上夜的。”凤姐听了点头，又说道：“晚上催他早睡，早上催他早起。”嬷嬷们答应了，自回园去。一时果有周瑞家的带了信回凤姐说：“袭人之母业已停床，不能回来。”凤姐回明了王夫人，一面着人往大观园去取他的铺盖妆奁。宝玉…","so":0,"eo":0},{"surface":"凤姐","text":"正值凤姐儿和贾母、王夫人商议说：“天又短，又冷，不如以后大嫂子带着姑娘们在园子里吃饭。等天暖和了，再来回的跑也不妨。”王夫人笑道：“这也是好主意，刮风下雪倒便宜。吃东西受了冷气也不好，空心走来，一肚子冷气，压上些东西也不好。不如园子后门里的五间大屋子，横竖有女人们上夜的，挑两个女厨子在那里单给他姐妹弄饭。新鲜菜蔬是有分例的，在总管账房里大了去，或要钱要东西。那些野鸡獐狍各样野味，分些给他们就是了。”贾母道：“我也正想着呢，就怕又添厨房事…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿说毕，未知贾母何言，且听下回分解。","so":0,"eo":0}]},{"chap":52,"ctitle":"第52章 俏平儿情掩虾须镯 勇晴雯病补孔雀裘","deeds":[{"surface":"凤姐","text":"话说贾母道：“正是这个了。上次我要说这话，我见你们大事多，如今又添出些事来，你们固然不敢抱怨，未免想着我只顾疼这些小孙子、孙女儿们，就不体贴你们这当家人了。你既这么说出来，便好了。”因此时薛姨妈、李婶娘都在座，邢夫人及尤氏等也都过来请安，还未过去，贾母因向王夫人等说道：“今日我才说这话，素日我不说。一则怕逞了凤丫头的脸，二则众人不服。今日你们都在这里，都是经过妯娌姑嫂的，还有他这么想得到的没有？”薛姨妈、李婶娘、尤氏齐笑道：“真个少有，…","so":0,"eo":0}]},{"chap":53,"ctitle":"第53章 宁国府除夕祭宗祠 荣国府元宵开夜宴","deeds":[{"surface":"凤姐","text":"当下已是腊月，离年日近，王夫人和凤姐儿治办年事。王子腾升了九省都检点，贾雨村补授了大司马，协理军机，参赞朝政，不提。","so":0,"eo":0},{"surface":"凤姐","text":"只见贾府人分了昭穆，排班立定。贾敬主祭，贾赦陪祭，贾珍献爵，贾琏贾琮献帛，宝玉捧香，贾菖、贾菱展拜垫、守焚池。青衣乐奏，三献爵，兴拜毕，焚帛，奠酒。礼毕，乐止，退出。众人围随贾母至正堂上，影前锦帐高挂，彩屏张护，香烛辉煌，上面正居中悬着荣、宁二祖遗像，皆是披蟒腰玉，两边还有几轴列祖遗像。贾荇、贾芷等从内仪门挨次站列，直到正堂廊下，槛外方是贾敬、贾赦，槛内是各女眷。众家人小厮皆在仪门之外。每一道菜至，传至仪门，贾荇、贾芷等便接了，按次传至…","so":0,"eo":0},{"surface":"凤姐","text":"一时礼毕，贾敬、贾赦等便忙退出至荣府，专候与贾母行礼。尤氏上房地下，铺满红毡，当地放着象鼻三足泥鳅流金珐琅大火盆，正面炕上铺着新猩红毡子，设着大红彩绣云龙捧寿的靠背、引枕、坐褥，外另有黑狐皮的袱子搭在上面。大白狐皮坐褥，请贾母上去坐了。两边又铺皮褥，请贾母一辈的两三位妯娌坐了。这边横头排插之后小炕上，也铺了皮褥，让邢夫人等坐下。地下两面相对十二张雕漆椅上，都是一色灰鼠椅搭小褥，每一张椅下一个大铜脚炉，让宝琴等姐妹坐。尤氏用茶盘亲捧茶与贾…","so":0,"eo":0},{"surface":"凤姐","text":"茶毕，邢夫人等便先起身来侍贾母吃茶。贾母与年老妯娌们闲话了两三句，便命看轿，凤姐儿忙上去搀起来。尤氏笑回说：“已经预备下老太太的晚饭。每年都不肯赏些体面，用过晚饭再过去。果然我们就不济凤丫头了？”凤姐儿搀着贾母笑道：“老祖宗走罢。咱们家去吃去，别理他。”贾母笑道：“你这是供着祖宗，忙得什么儿似的，那里还搁的住我闹？况且我每年不吃，你们也要送去的。不如还送了来，我吃不了，留着明儿再吃，岂不多吃些？”说的众人都笑了。又吩咐他：“好生派妥当人…","so":0,"eo":0},{"surface":"凤姐","text":"至次日五鼓，贾母等人按品上妆，摆全副执事进宫朝贺，兼祝元春千秋。领宴回来，又至宁府祭过列祖，方回来。受礼毕，便换衣歇息。所有贺节来的亲友，一概不会，只和薛姨妈、李婶娘二人说话随便，或和宝玉、宝钗等姐妹赶围棋摸牌作戏。王夫人和凤姐天天忙着请人吃年酒，那边厅上和院内皆是戏酒，亲友络绎不绝。","so":0,"eo":0},{"surface":"凤姐","text":"一连忙了七八天，才完了，早又元宵将近。宁、荣二府皆张灯结彩。十一日是贾赦请贾母等，次日贾珍又请贾母。王夫人和凤姐儿也连日被人请去吃年酒，不能胜记。至十五这一晚上，贾母便在大花厅上命摆几席酒，定一班小戏，满挂各色花灯，带领荣、宁二府各子侄孙男孙媳等家宴。贾敬素不饮酒茹荤，因此不去请他。十七日祀祖已完，他就出城修养；就是这几天在家，也只静室默处，一概无闻，不在话下。贾赦领了贾母之赏，告辞而去。贾母知他在此不便，也随他去了。贾赦到家中，和众门…","so":0,"eo":0},{"surface":"凤姐","text":"这里贾母花厅上摆了十来席酒，每席旁边设一几，几上设炉瓶三事，焚着御赐百合宫香；又有八寸来长、四五寸宽、二三寸高、点缀着山石的小盆景，俱是新鲜花卉。又有小洋漆茶盘放着旧窑十锦小茶杯，又有紫檀雕嵌的大纱透绣花草诗字的缨络。各色旧窑小瓶中，都点缀着“岁寒三友”、“玉堂富贵”等鲜花。上面两席是李婶娘薛姨妈坐，东边单设一席，乃是雕夔龙护屏矮足短榻，靠背、引枕、皮褥俱全。榻上设一个轻巧洋漆描金小几，几上放着茶碗、漱盂、洋巾之类，又有一个眼镜匣子。贾…","so":0,"eo":0},{"surface":"凤姐","text":"贾母也曾差人去请众族中男女，奈他们有年老的懒于热闹。有家内没有人，又有疾病淹留，要来竟不能来。有一等妒富愧贫，不肯来的。更有憎畏凤姐之为人，赌气不来的。更有羞手羞脚，不惯见人，不敢来的。因此族中虽多，女眷来者不过贾蓝之母娄氏带了贾蓝来，男人只有贾芹、贾芸、贾菖、贾菱四个现在凤姐麾下办事的来了。当下人虽不全，在家庭小宴，也算热闹的。","so":0,"eo":0}]},{"chap":54,"ctitle":"第54章 史太君破陈腐旧套 王熙凤效戏彩斑衣","deeds":[{"surface":"凤姐","text":"当下天有二鼓，戏演的是《白义·观灯》八出，正在热闹之际。宝玉因下席往外走。贾母问：“往那里去？外头炮仗利害，留神天上吊下火纸来烧着。”宝玉笑回说：“不往远去，只出去就来。”贾母命婆子们：“好生跟着。”于是宝玉出来，只有麝月、秋纹几个小丫头随着。贾母因说：“袭人怎么不见？他如今也有些拿大了，单支使小女孩儿出来。”王夫人忙起身笑说道：“他妈前日没了，因有热孝，不便前头来。”贾母点头，又笑道：“跟主子，却讲不起这孝与不孝。要是他还跟我，难道这…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉便要了一壶暖酒，也从李婶娘斟起。他二人也笑让坐。贾母便说：“他小人家儿，让他斟去。大家倒要干过这杯。”说着，便自己干了。邢、王二夫人也忙干了，薛姨娘、李婶娘也只得于了。贾母又命宝玉道：“你连姐姐妹妹的一齐斟上，不许乱斟，都要叫他干了。”宝玉听说，答应着，一一按次斟上了。至黛玉前，偏他不饮，拿起杯来，放在宝玉唇边。宝玉一气饮干，黛玉笑说：“多谢。”宝玉替他斟上一杯。风姐儿便笑道：“宝玉别喝冷酒。仔细手颤，明儿写不的字、拉不的弓。”宝玉…","so":0,"eo":0},{"surface":"凤姐","text":"一时上汤之后，又接着献元宵。贾母便命：“将戏暂歇，小孩子们可怜见的，也给他们些滚汤热菜的吃了再唱。”又命将各样果子元宵等物拿些给他们吃。一时歇了戏，便有婆子带了两个门下常走的女先儿进来，放了两张杌子在那一边，贾母命他们坐了，将弦子琵琶递过去。贾母便问李、薛二人：“听什么书？”他二人都回说：“不拘什么都好。”贾母便问：“近来可又添些什么新书？”两个女先回说：“倒有一段新书，是残唐五代的故事。”贾母问是何名，女先儿回说：“这叫做《凤求鸾》。…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿走上来斟酒，笑道：“罢，罢！酒冷了，老祖宗喝一口润润嗓子再掰谎罢。这一回就叫做《掰谎记》，就出在本朝，本地，本年，本月，本日，本时。老祖宗‘一张口难说两家话’，‘花开两朵，各表一枝’。‘是真是谎且不表，再整观灯看戏的人’。老祖宗且让这二位亲戚吃杯酒、看两出戏着，再从逐朝话言掰起，如何？”一面说，一面斟酒，一面笑。未说完，众人俱已笑倒了。两个女先儿也笑个不住，都说：“奶奶好刚口，奶奶要一说书，真连我们吃饭的地方都没了。”薛姨妈笑道：…","so":0,"eo":0},{"surface":"凤姐","text":"”凤姐儿笑道：“外头只有一位珍大哥哥，我们还是论哥哥妹妹，从小儿一处淘气淘了这么大。这几年因做了亲，我如今立了多少规矩了！便不是从小儿兄妹，只论大伯子小婶儿，那二十四孝上‘斑衣戏彩’，他们不能来戏彩引老祖宗笑一笑，我这里好容易引的老祖宗笑一笑，多吃了一点东西，大家喜欢，都该谢我才是，难道反笑我不成？”贾母笑道：“可是这两日我竟没有痛痛的笑一场，倒是亏他才一路说，笑的我这里痛快了些。我再吃钟酒。”吃着酒，又命宝玉：“来敬你姐姐一杯。”凤姐…","so":0,"eo":0},{"surface":"凤姐","text":"当下贾蓉夫妻二人捧酒一巡。凤姐儿因贾母十分高兴，便笑道：“趁着女先儿们在这里．不如咱们传梅，行一套‘春喜上眉梢’的令，如何？”贾母笑道：“这是个好令啊！正对时景儿。”忙命了人取了黑漆铜钉花腔令鼓来，给女先儿击着。席上取了一枝红梅，贾母笑道：“到了谁手里住了鼓，吃一杯，也要说些什么才好。”凤姐儿笑道：“依我说，谁象老祖宗要什么有什么呢？我们这不会的不没意思吗？怎么能雅俗共赏才好。不如谁住了，谁说个笑话儿罢。”众人听了，都知道他素日善说笑话…","so":0,"eo":0},{"surface":"凤姐","text":"说毕，大家都笑起来。凤姐儿笑道：“好的呀！幸而我们都是夯嘴夯腮的，不然，也就吃了猴儿尿了！”尤氏、娄氏都笑向李纨道：“咱们这里头谁是吃过猴儿尿的，别装没事人儿！”薛姨妈笑道：“笑话儿在对景就发笑。”","so":0,"eo":0},{"surface":"凤姐","text":"说着，又击起鼓来。小丫头子们只要听凤姐儿的笑话，便悄悄的和女先儿说明，以咳嗽为记。须臾传至两遍，刚到了凤姐儿手里，小丫头子们故意咳嗽，女先儿便住了。众人齐笑道：“这可拿住他了！快吃了酒，说一个好的去，别太逗人笑的肠子疼！”","so":0,"eo":0}]},{"chap":55,"ctitle":"第55章 辱亲女愚妾争闲气 欺幼主刁奴蓄险心","deeds":[{"surface":"凤姐","text":"且说荣府中刚将年事忙过，凤姐儿因年内外操劳太过，一时不及检点，便小月了，不能理事，天天两三个大夫用药。凤姐儿自持强壮，虽不出门，然筹画计算，想起什么事来，就叫平儿去回王夫人，任人谏劝，他只不听。王夫人便觉失了膀臂，一人能有多少精神？凡有了大事就自己主张，将家中琐碎之事，一应都暂令李纨协理。李纨本是个尚德不尚才的，未免逞纵了下人，王夫人便命探春合同李纨裁处，只说过了一月，凤姐将养好了，仍交给他。谁知凤姐禀赋气血不足，兼年幼不知保养，平生争…","so":0,"eo":0},{"surface":"凤姐","text":"众人先听见李纨独办，各各心中暗喜，因为李纨素日是个厚道多恩无罚的人，自然比凤姐儿好搪塞些，便添了一个探春，都想着不过是个未出闺阁的年轻小姐，且素日也最平和恬淡，因此都不在意，比凤姐儿前便懈怠了许多。只三四天后，几件事过手，渐觉探春精细处不让凤姐，只不过是言语安静、性情和顺而已。可巧连日有王公侯伯世袭官员十几处，皆系荣宁非亲即世交之家，或有升迁，或有黜降，或有婚丧红白等事，王夫人贺吊迎送，应酬不暇，前边更无人照管。他二人便一日皆在厅上起坐…","so":0,"eo":0},{"surface":"凤姐","text":"这日王夫人正是往锦乡侯府去赴席，李纨与探春早已梳洗，伺候出门去后，回至厅上坐了。刚吃茶时，只见吴新登的媳妇进来回说：“赵姨娘的兄弟赵国基昨儿出了事，已回过老太太、太太，说知道了，叫回姑娘来。”说毕，便垂手旁侍，再不言语。彼时来回话者不少，都打听他二人办事如何。若办得妥当，大家则安个畏惧之心，若少有嫌隙不当之处，不但不畏服，一出二门，还说出许多笑话来取笑。吴新登的媳妇心中已有主意，若是凤姐前，他便早已献勤，说出许多主意、又查出许多旧例来，…","so":0,"eo":0},{"surface":"凤姐","text":"探春一面匀脸，一面向平儿冷笑道：“你迟了一步，没见还有可笑的。连吴姐姐这么个办老了事的，也不查清楚了就来混我们。幸亏我们问他，他竟有脸说‘忘了’，我说二奶奶事也忘了再找去？我料着你主子未必有耐性儿等他去找！”平儿笑道：“他有这么一次，包管腿上的筋早折了两根。姑娘别信他们。那是他们瞅着大奶奶是个菩萨，姑娘又是腼腆小姐，固然是托懒来混。”说着，又向门外说道：“你们只管撒野，等奶奶大安了，咱们再说。”门外的众媳妇们都笑道：“姑娘，你是个最明白…","so":0,"eo":0},{"surface":"凤姐","text":"探春气方渐平，因向平儿道：“我有一件大事，早要和你奶奶商议，如今可巧想起来。你吃了饭快来。宝姑娘也在这里，咱们四个人商议了，再细细的问你奶奶可行可止。”平儿答应回去。凤姐因问：“为何去这半日？”平儿便笑着将方才原故细细说与他听了。凤姐儿笑道：“好，好，好！好个三姑娘，我说不错，只可惜他命薄，没托生在太太肚里。”平儿笑道：“奶奶也说糊涂话了。他就不是太太养的，难道谁敢小看他，不和别的一样看待么？”凤姐叹道：“你那里知道？虽然正出庶出是一样…","so":0,"eo":0},{"surface":"凤姐","text":"平儿不等说完，便笑道：“你太把人看糊涂了！我才已经行在先了，这会子才嘱咐我。”凤姐儿笑道：“我是恐怕你心里眼里只有了我、一概没有他人之故，不得不嘱咐，既已行在先，更比我明白了。这不是你又急了。满嘴里‘你’呀‘我’的起来了！”平儿道：“偏说‘你’！你不依，这不是嘴巴子？再打一顿。难道这脸上还没尝过的不成？”凤姐儿笑道：“你这小蹄子儿，要掂多少过儿才罢？你看我病的这个样儿，还来怄我呢。过来坐下，横竖没人来，咱们一处吃饭是正经。”说着，丰儿等…","so":0,"eo":0}]},{"chap":56,"ctitle":"第56章 敏探春兴利除宿弊 贤宝钗小惠全大体","deeds":[{"surface":"凤姐","text":"话说平儿陪着凤姐吃了饭，伏侍盥漱毕，方往探春处来，只见院中寂静，只有丫鬟婆子一个个都站在窗外听候。平儿进入厅中，他姐妹姑嫂三人正商议些家务，说的便是年内赖大家请吃酒，他家中花园中事故。见他来了，探春便命他脚踏上坐了，因说道：“我想的事，不为别的，只想着我们一月所用的头油脂粉又是二两的事。我想咱们一月已有了二两月银，丫头们又另有月钱，可不是又同刚才学里的八两一样重重叠叠？这事虽小，钱有限，看起来也不妥当，你奶奶怎么就没想到这个呢？”平儿笑…","so":0,"eo":0},{"surface":"凤姐","text":"平儿道：“这件事须得姑娘说出来。我们奶奶虽有此心，未必好出口。此刻姑娘们在园里住着，不能多弄些玩意儿陪衬，反叫人去监管修理，图省钱，这话断不好出口。”宝钗忙走过来，摸着他的脸笑道：“你张开嘴，我瞧瞧你的牙齿舌头是什么做的？从早起来到这会子，你说了这些话，一套一个样子，也不奉承三姑娘，也不说你们奶奶才短想不到；三姑娘说一套话出来，你就有一套话回奉，总是三姑娘想到的，你们奶奶也想到了，只是必有个不可办的原故。这会子又是因姑娘们住在园子，不好…","so":0,"eo":0},{"surface":"凤姐","text":"众婆子听了这个议论，又去了帐房受辖制，又不与凤姐儿去算账，一年不过多拿出若干吊钱来，各各欢喜异常，都齐声说：“愿意！强如出去被他们揉搓着，还得拿出钱来呢。那不得管地的，听了每年终无故得钱，更都喜欢起来，口内说：“他们辛苦收拾，是该剩些钱粘补的；我们怎么好‘稳吃三注’呢？”宝钗笑道：“妈妈们也别推辞了，这原是分内应当的。你们只要日夜辛苦些，别躲懒纵放人吃酒赌钱就是了。不然，我也不该管这事。你们也知道，我姨娘亲口嘱托我三五回，说大奶奶如今又…","so":0,"eo":0}]},{"chap":57,"ctitle":"第57章 慧紫鹃情辞试莽玉 慈姨妈爱语慰痴颦","deeds":[{"surface":"凤姐","text":"紫鹃听了，忙放下针，又嘱咐雪雁：“好生听叫。要问我，答应我就来。”说着，便出了潇湘馆，一径来寻宝玉。走至宝玉跟前，含笑说道：“我不过说了那么句话，为的是大家好。你就一气跑了这风地里来哭，弄出病来还了得！”宝玉忙笑道：“谁赌气了！我因为听你说的有理，我想你们既这样说，自然别人也是这样说，将来渐渐的都不理我了。我所以想到这里，自己伤起心来了。”紫鹃也便挨他坐着。宝玉笑道：“方才对面说话，你还走开，这会子怎么又来挨着我坐？”紫鹃道：“你都忘了…","so":0,"eo":0},{"surface":"凤姐","text":"因薛姨妈看见邢岫烟生得端雅稳重，且家道贫寒，是个钗荆裙布的女儿，便欲说给薛蟠为妻。因薛蟠素昔行止浮奢，又恐遭塌了人家女儿。正在踌躇之际，忽想起薛蝌未娶，看他二人，恰是一对天生地设的夫妻，因谋之于凤姐儿。凤姐儿笑道：“姑妈素知我们太太有些左性的，这事等我慢谋。”因贾母去瞧凤姐儿时，凤姐儿便和贾母说：“姑妈有一件事要求老祖宗，只是不好启齿。”贾母忙问何事，凤姐儿便将求亲一事说了。贾母笑道：“这有什么不好启齿的，这是极好的好事，等我和你婆婆说…","so":0,"eo":0},{"surface":"凤姐","text":"这日宝钗因来瞧黛玉，恰值岫烟也来瞧黛玉，二人在半路相遇。宝钗含笑唤他到跟前，二人同走。至一块石壁后，宝钗笑问他：“这天还冷的很，你怎么倒全换了夹的了？”岫烟见问，低头不答。宝钗便知道又有了原故，因又笑问道：“必定是这个月的月钱又没得，凤姐姐如今也这样没心没计了。”岫烟道：“他倒想着不错日子给的。因姑妈打发人和我说道，一个月用不了二两银子，叫我省一两给爹妈送出去，要使什么，横竖有二姐姐的东西，能着些搭着就使了。姐姐想，二姐姐是个老实人，也…","so":0,"eo":0},{"surface":"凤姐","text":"宝钗也就往潇湘馆来。恰正值他母亲也来瞧黛玉，正说闲话呢。宝钗笑道：“妈妈多早晚来的？我竟不知道。”薛姨妈道：“我这几日忙，总没来瞧瞧宝玉和他，所以今日瞧他两人。都也好了。”黛玉忙让宝钗坐下，因向宝钗道：“天下的事，真是人想不到的。拿着姨妈和大舅母说起，怎么又作一门亲家！”薛姨妈道：“我的儿，你们女孩儿家那里知道？自古道：‘千里姻缘一线牵。’管姻缘的有一位月下老儿，预先注定，暗里只用一根红丝，把这两个人的脚绊住。凭你两家那怕隔着海呢，若有…","so":0,"eo":0}]},{"chap":58,"ctitle":"第58章 杏子阴假凤泣虚凰 茜纱窗真情揆痴理","deeds":[{"surface":"凤姐","text":"又见各官宦家凡养优伶男女者，一概蠲免遣发，尤氏等便议定，待王夫人回家回明，也欲遣发十二个女孩子，又说：“这些人原是买的，如今虽不学唱，尽可留着使唤，只令其教习们自去也罢了。”王夫人因说：“这学戏的倒比不得使唤的，他们也是好人家的女儿，因无能，卖了做这事，装丑弄鬼的几年。如今有这机会，不如给他们几两银子盘费，各自去罢。当日祖宗手里都是有这例的。咱们如今损阴坏德，而且还小器。如今虽有几个老的还在，那是他们各有原故不肯回去的，所以才留下使唤，…","so":0,"eo":0}]},{"chap":61,"ctitle":"第61章 投鼠忌器宝王瞒赃 判冤决狱平儿行权","deeds":[{"surface":"凤姐","text":"话说那柳家的，听了这小么儿一席话，笑道：“好猴儿崽子！你亲婶子找野老儿去了，你不多得一个叔叔吗，有什么疑的？别叫我把你头上的杩子盖揪下来，还不开门让我进去呢。”那小厮且不推门，又拉着笑道：“好婶子，你这一进去，好歹偷几个杏儿出来赏我吃。我这里老等。你要忘了，日后半夜三更打酒买油的，我不给你老人家开门，也不答应你，随你干叫去。”柳氏啐道：“发了昏的！今年还比往年？把这些东西部分给了众妈妈了。一个个的不象抓破了脸的，人打树底下一过，两眼就象…","so":0,"eo":0},{"surface":"凤姐","text":"林之孝家的听他词钝意虚，又因近日玉钏儿说那边正房内失落了东西，几个丫头对赖，没主儿，心下便起了疑。可巧小蝉、莲花儿和几个媳妇子走来见了这事，便说道：“林奶奶倒要审审他。这两日他往这里头跑的不象，鬼鬼祟祟的，不知干些什么事。”小蝉又道：“正是。昨日玉钏儿姐姐说：‘太太耳房里的柜子开了，少了好些零碎东西。’琏二奶奶打发平姑娘和玉钏儿姐姐要些玫瑰露，谁知也少了一罐子，不是找还不知道呢！”莲花儿笑道：“这我没听见。今日我倒看见一个露瓶子。”林之…","so":0,"eo":0},{"surface":"凤姐","text":"那时李纨正因兰儿病了，不理事务，只命去见探春。探春已归房。人回进去，丫鬟们都在院内纳凉，探春在内盥沐，只有侍书回进去，半日出来说：“姑娘知道了，叫你们找平儿回二奶奶去。”林之孝家的只得领出来，到凤姐那边，先找着平儿进去回了凤姐。凤姐方才睡下，听见此事，便吩咐：“将他娘打四十板子，撵出去，永不许进二门。把五儿打四十板子，立刻交给庄子上，或卖或配人。”平儿听了出来，依言吩咐了林之孝家的。五儿吓得哭哭啼啼，给平儿跪着，细诉芳官之事。平儿道：“…","so":0,"eo":0},{"surface":"凤姐","text":"于是大家商议妥贴，平儿带了他两个并芳官来至上夜房中，叫了五儿，将茯苓霜一节也悄悄的教他说系芳官给的，五儿感激不尽。平儿带他们来至自己这边，已见林之孝家的带领了几个媳妇，押解着柳家的等够多时了。林之孝家的又向平儿说：“今日一早押了他来，怕园里没有人伺候早饭，我暂且将秦显的女人派了去伺候姑娘们的饭呢。”平儿道：“秦显的女人是谁？我不大相熟啊。”林之孝家的道：“他是园里南角子上夜的，白日里没什么事，所以姑娘不认识。高高儿的孤拐，大大的眼睛，最…","so":0,"eo":0}]},{"chap":62,"ctitle":"第62章 憨湘云醉眠芍药裀 呆香菱情解石榴裙","deeds":[{"surface":"凤姐","text":"当下又值宝玉生日已到。原来宝琴也是这日，二人相同。王夫人不在家，也不曾象往年热闹，只有张道士送了四样礼，换的寄名符儿，还有几处僧尼庙的和尚姑子送了供尖儿并寿星、纸马、疏头，并本宫星官、值年太岁、周岁换的锁。家中常走的男女，先一日来上寿。王子腾那边，仍是一套衣服，一双鞋袜，一百寿桃，一百束上用银丝挂面。薛姨妈处减一半。其余家中尤氏仍是一双鞋袜，凤姐儿是一个宫制四面扣合堆绣荷包装一个金寿星，一件波斯国的玩器。各庙中遣人去放堂舍钱。又另有宝琴…","so":0,"eo":0},{"surface":"凤姐","text":"一时贾环、贾兰来了，袭人连忙拉住，坐了一坐，便去了。宝玉笑道：“走乏了！”便歪在床上。方吃了半盏茶，只听外头咭咭呱呱，一群丫头笑着进来，原来是翠墨、小螺、翠缕、入画，邢岫烟的丫头篆儿，并奶子抱着巧姐儿，彩鸾、绣鸾八九个人，都抱着红毡子来了，笑说道：“拜寿的挤破了门了，快拿面来我们吃。”刚进来时，探春、湘云、宝琴、岫烟、惜春也都来了。宝玉忙迎出来，笑说：“不敢起动。快预备好茶！”进入房中，不免推让一回，大家归坐。袭人等捧过茶来，才吃了一口…","so":0,"eo":0},{"surface":"凤姐","text":"说着，来到沁芳亭边，只见袭人、香菱、侍书、晴雯、麝月、芳官、蕊官、藕官十来个人，都在那里看鱼玩呢，见他们来了，都说：“芍药栏里预备下了，快去上席罢。”宝钗等随携了他们，同到芍药栏中红香圃三间小敞厅内，连尤氏己请过来了。诸人都在那里，只没平儿。原来平儿出去，有赖、林诸家送了礼来，连三接四，上中下三等家人拜寿送礼的不少。平儿忙着打发赏钱道谢，一面又色色的回明了凤姐儿，不过留下几样，也有不受的，也有受下即刻赏给人的。忙了一回，又直等凤姐儿吃过…","so":0,"eo":0},{"surface":"凤姐","text":"当下又选了几样果菜给凤姐儿送去，凤姐儿也送了几样来。宝钗等吃过点心，大家也有坐的，也有立的，也有在外观花的，也有倚栏看鱼的，各自取便，说笑不一。探春便和宝琴下棋，宝钗、岫烟观局。黛玉和宝玉在一簇花下唧唧哝哝，不知说些什么。只见林之孝家的和一群女人，带了一个媳妇进来。那媳妇愁眉泪眼，也不敢进厅来，到阶下便朝上跪下磕头。探春因一块棋受了敌，算来算去，总得了两个眼，便折了官着儿，两眼只瞅着棋盘，一只手伸在盒内，只管抓棋子作想。林之孝家的站了半…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉听说便忙回房中，果见芳官面向里睡在床上。宝玉推他说道：“快别睡觉，咱们外头玩去。一会子好吃饭。”芳官道：“你们吃酒，不理我，叫我闷了半天，可不来睡觉罢了。”宝玉拉了他起来，笑道：“咱们晚上家里再吃。回来我叫袭人姐姐带了你桌上吃饭，何如？”芳官道：“藕官、蕊官都不上去，单我在那里也不好。我也吃不惯那个面条子，早起也没好生吃。才刚饿了，我已告诉了柳婶子，先给我做一碗汤，盛半碗粳米饭，送到我这里，吃了就完事。若是晚上吃酒，不许叫人管着我，…","so":0,"eo":0}]},{"chap":63,"ctitle":"第63章 寿怡红群芳开夜宴 死金丹独艳理亲丧","deeds":[{"surface":"凤姐","text":"忽见东府里几个人，慌慌张张跑来，说：“老爷殡天了！”众人听了，吓了一大跳，忙都说：“好好的并无疾病，怎么就没了？”家人说：“老爷天天修炼，定是功成圆满，升仙去了。”尤氏一闻此言，又见贾珍父子并贾琏等皆不在家，一时竟没个着己的男人来，未免忙了。只得忙卸了妆饰，命人先到玄真观将所有的道士都锁了起来，等大爷来家审问；一面忙忙坐车，带了赖升一干老人媳妇出城。又请大夫看视，到底系何病症。大夫们见人已死，何处诊脉来？素知贾敬导气之术，总属虚诞，更至…","so":0,"eo":0},{"surface":"凤姐","text":"贾蓉巴不得一声儿，便先骑马跑来。到家，忙命前厅收桌椅，下扇，挂孝慢子，门前起鼓手棚、牌楼等事。又忙着进来看外祖母、两个姨娘。原来尤老安人年高喜睡，常常歪着；他二姨娘三姨娘都和丫头们做活计，见他来了，都道烦恼。贾蓉且嘻嘻的望他二姨娘笑说：“二姨娘，你又来了？我父亲正想你呢。”二姨娘红了脸，骂道：“好蓉小子！我过两日不骂你几句，你就过不得了，越发连个体统都没了。还亏你是大家公子哥儿，每日念书学礼的，越发连那小家子的也跟不上。”说着顺手拿起一…","so":0,"eo":0}]},{"chap":64,"ctitle":"第64章 幽淑女悲题五美吟 浪荡子情遗九龙佩","deeds":[{"surface":"凤姐","text":"话说贾蓉见家中诸事已妥，连忙赶至寺中，回明贾珍。于是连夜分派各项执事人役，并预备一切应用幡杠等物，择于初四日卯时请灵柩进城，一面使人知会诸位亲友。是日丧仪耀，宾客如云，自铁槛寺至宁府，夹路看的何止数万人。内中有嗟叹的，也有羡慕的，又有一等半瓶醋的读书人，说是丧礼与其奢易莫若俭戚的，一路纷纷议论不一。至未申时方到，将灵柩停放正堂之内，供奠举哀已毕，亲友渐次散回，只剩族中人分理迎宾送客等事。近亲只有邢舅太爷相伴未去。贾珍、贾蓉此时为礼法所拘…","so":0,"eo":0},{"surface":"凤姐","text":"于是一径往潇湘馆来看黛玉。将过了沁芳桥，只见雪雁领了两个老婆子，手中都拿着菱藕瓜果之类。宝玉忙问雪雁道：“你们姑娘从来不吃这些凉东西，拿这些瓜果作什么？不是要请那位姑娘奶奶么？”雪雁笑道：“我告诉你，可不许你对姑娘说去。”宝玉点头应允。雪雁便命两个婆子：“先将瓜果送去，交与紫鹃姐姐。他要问我，你就说我做什么呢，就来。”那婆子答应着去了。雪雁方说道：“我们姑娘这两日方觉身上好些了。今日饭后，三姑娘来会着要瞧二奶奶去，姑娘也没去，又不知想起…","so":0,"eo":0},{"surface":"凤姐","text":"想毕，遂别了雪雁，出了园门，一径到凤姐处来。正有许多婆子们回事毕，纷纷散出，凤姐倚着门和平儿说话呢。一见了宝玉，笑道：“你回来了么？我才吩咐了林之孝家的叫他使人告诉跟你的小厮，若没什么事，趁便请你回来歇息歇息。再者那里人多，你那里禁的住那些气味？不想恰好你倒来了。”宝玉笑道：“多谢姐姐惦记。我也因今日没事，又见姐姐这两日没往那府里去，不知身上可大愈了，所以回来看看。”凤姐道：“左右也不过是这么着，三日好两日不好的。老太太、太太不在家，这…","so":0,"eo":0},{"surface":"凤姐","text":"却说紫鹃端了茶来，打量二人又为何事口角，因说道：“姑娘身上才好些，宝二爷又来怄气了。到底是怎么样？”宝玉一面拭泪，笑道：“谁敢怄妹妹了？”一面搭讪着起来闲步，只见砚台底下微露一纸角，不禁伸手拿起。黛玉忙要起身来夺，已被宝玉揣在怀内，笑央道：“好妹妹，赏我看看罢！”黛玉道：“不管什么，来了就混翻。”一语未了，只见宝钗走来，笑道：“宝兄弟要看什么？”宝玉未见上面是何言词，又不知黛玉心中如何，未敢造次回答，却望着黛玉笑。黛玉一面让宝钗坐，一面…","so":0,"eo":0},{"surface":"凤姐","text":"仍欲往下说时，只见有人回道：“琏二爷回来了。适才外头传说，往东府里去了，好一会了，想必就回来的。”宝玉听了，连忙起身，迎至大门以内等待，恰好贾琏自外下马进来。于是宝玉先迎着贾琏打千儿，口中给贾母、王夫人等请了安，又给贾琏请了安。二人携手走进来。只见李纨、凤姐、宝钗、黛玉、迎、探、惜等早在中堂等候，一一相见已毕。因听贾琏说道：“老太太明日一早到家，一路身体甚好。今日先打发了我来，回家看视，明日五更，仍要出城迎接。”说毕，众人又问了些路途的…","so":0,"eo":0},{"surface":"凤姐","text":"又过了数日，乃贾敬送殡之期，贾母犹未大愈，遂留宝玉在家侍奉。凤姐因未曾甚好，亦未去。其余贾赦、贾琏、邢夫人、王夫人等，率领家人仆妇，都送至铁槛寺，至晚方回。贾珍、尤氏并贾蓉仍在寺中守灵，等过百日后，方扶柩回籍。家中仍托尤老娘并二姐儿三姐儿照管。","so":0,"eo":0},{"surface":"凤姐","text":"方欲退出，只见贾琏走进来了。俞禄忙上前请了安。贾琏便问何事，贾珍一一告诉了。贾琏心中想道：“趁此机会，正可至宁府寻二姐儿。”一面遂说道：“这有多大事，何必向人借去？昨日我方得了一项银子，还没有使呢，莫若给他添上，岂不省事？”贾珍道：“如此甚好，你就吩咐蓉儿，一并叫他取去。”贾琏忙道：“这个必得我亲身取去。再我这几日没回家了，还要给老太太、老爷、太太们请请安去；到大哥那边查查家人们有无生事，再也给亲家太太请请安。”贾珍笑道：“只是又劳动你…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏听到这里，心花都开了，那里还有什么话说？只是一味呆笑而已。贾蓉又想了一想，笑道：“叔叔要有胆量，依我的主意，管保无妨，不过多花几个钱。”贾琏忙道：“好孩子，你有什么主意，只管说给我听听。”贾蓉道：“叔叔回家，一点声色也别露。等我回明了我父亲，向我老娘说妥，然后在咱们府后方近左右，买上一所房子及应用家伙，再拨两拨子家人过去服侍，择了日子，人不知鬼不觉娶了过去。嘱咐家人不许走漏风声，婶子在里面住着，深宅大院，那里就得知道了？叔叔两下里住…","so":0,"eo":0}]},{"chap":65,"ctitle":"第65章 贾二舍偷娶尤二姨 尤三姐思嫁柳二郎","deeds":[{"surface":"凤姐","text":"那贾琏越看越爱，越瞧越喜，不知要怎么奉承这二姐儿才过得去，乃命鲍二等人不许提三说二，直以“奶奶”称之，自己也称“奶奶”，竟将凤姐一笔勾倒。有时回家，只说在东府有事。凤姐因知他和贾珍好，有事相商，也不疑心。家下人虽多，都也不管这些事。便有那游手好闲、专打听小事的人，也都去奉承贾琏，乘机讨些便宜，谁肯去露风？于是贾琏深感贾珍不尽。贾琏一月出十五两银子，做天天的供给。若不来时，他母女三人一处吃饭；若贾琏来，他夫妻二人一处吃，他母女就回房自吃。…","so":0,"eo":0},{"surface":"凤姐","text":"二姐听见马闹，心下着实不安，只管用言语混乱贾琏。那贾琏吃了几杯，春兴发作，便命收了酒果，掩门宽衣。二姐只穿着大红小袄，散挽乌云，满脸春色，比白日更增了俏丽。贾琏搂着他笑道：“人人都说我们那夜叉婆俊，如今我看来，给你拾鞋也不要。”二姐儿道：“我虽标致，却没品行，看来倒是不标致的好。”贾琏忙说：“怎么说这个话？我不懂。”二姐滴泪说道：“你们拿我作糊涂人待，什么事我不知道？我如今和你作了两个月的夫妻，日子虽浅，我也知你不是糊涂人。我生是你的人…","so":0,"eo":0},{"surface":"凤姐","text":"三姐儿听了这话，就跳起来，站在炕上，指着贾琏冷笑道：“你不用和我花马掉嘴的！咱们‘清水下杂面，你吃我看’。‘提着影戏人子上场儿，好歹别戳破这层纸儿’。你别糊涂油蒙了心，打量我们不知道你府上的事呢！这会子花了几个臭钱，你们哥儿俩，拿着我们姊妹两个权当粉头来取乐儿，你们就打错了算盘了。我也知道你那老婆太难缠。如今把我姐姐拐了来做了二房，‘偷来的锣鼓儿打不得’。我也要会会这凤奶奶去，看他是几个脑袋？几只手？若大家好取和儿便罢，倘若有一点叫人过…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏来了，只在二姐屋里，心中也渐渐的悔上来了。无奈二姐儿倒是个多情的人，以为贾琏是终身之主了，凡事倒还知疼着热。要论温柔和顺，却较着凤姐还有些体度，就论起那标致来，及言谈行事，也不减于凤姐。但已经失了脚，有了一个“淫”字，凭他什么好处也不算了。偏这贾琏又说：“谁人无错？知过必改就好。”故不提已往之淫，只取现今之善。便如胶似漆，一心一计，誓同生死，那里还有凤、平二人在意了。二姐在枕边衾内，也常劝贾琏说：“你和珍大爷商议商议，拣个相熟的，把…","so":0,"eo":0},{"surface":"凤姐","text":"兴儿笑嘻嘻的，在炕沿下，一头喝，一头将荣府之事备细告诉他母女。又说：“我是二门上该班的人。我们共是两班，一班四个，共是八个人。有几个知奶奶的心腹，有几个知爷的心腹。奶奶的心腹，我们不敢惹；爷的心腹，奶奶敢惹。提起来，我们奶奶事，告诉不得奶奶！他心里歹毒，口里尖快。我们二爷也算是个好的，那里见的他？倒是跟前有个平姑娘，为人很好，虽然和奶奶一气，他倒背着奶奶常作些好事。我们有了不是，奶奶是容不过的，只求求他去就完了。如今合家大小，除了老太太…","so":0,"eo":0},{"surface":"凤姐","text":"尤二姐笑道：“你这小猾贼儿还不起来。说句玩话儿，就吓的这样儿。你们做什么往这里来？我还要找了你奶奶去呢。”兴儿连忙摇手，说：“奶奶千万别去！我告诉奶奶：一辈子不见他才好呢。‘嘴甜心苦，两面三刀’，‘上头笑着，脚底下就使绊子’，‘明是一盆火，暗是一把刀’：他都占全了。只怕三姨儿这张嘴还说不过他呢，奶奶这么斯文良善人，那里是他的对手？”二姐笑道：“我只以理待他，他敢怎么着我？”兴儿道：“不是小的喝了酒放肆胡说，奶奶就是让着他，他看见奶奶比他…","so":0,"eo":0}]},{"chap":66,"ctitle":"第66章 情小妹耻情归地府 冷二郎一冷入空门","deeds":[{"surface":"凤姐","text":"二人正说之间，只见三姐走来说道：“姐夫，你也不知道我们是什么人。今日和你说罢，你只放心，我们不是那心口两样的人，说什么是什么。若有了姓柳的来，我便嫁他。从今儿起，我吃常斋念佛，伏侍母亲，等来了嫁了他去；若一百年不来，我自己修行去了。”说着将头上一根玉簪拔下来，磕作两段，说：“一句不真，就合这簪子一样！”说着，回房去了，真个竟“非礼不动，非礼不言”起来。贾琏无了法，只得和二姐商议了一回家务，复回家和凤姐商议起身之事。一面着人问焙茗。焙茗说…","so":0,"eo":0},{"surface":"凤姐","text":"且说贾琏一日到平安州，见了节度，完了公事，因又嘱咐他十月前后务要还来一次。贾琏领命，次日连忙取路回家，先到尤二姐那边。且说二姐儿操持家务，十分谨肃，每日关门闭户，一点外事不闻。那三姐儿果是个斩钉截铁之人，每日侍奉母亲之馀，只和姐姐一处做些活计。虽贾珍趁贾琏不在家，也来鬼混了两次，无奈二姐儿只不兜揽，推故不见。那三姐儿的脾气，贾珍早已领过教的，那里还敢招惹他去？所以踪迹一发疏阔了。却说这日贾琏进门，看见二姐儿三姐儿这般景况，喜之不尽，深念…","so":0,"eo":0}]},{"chap":67,"ctitle":"第67章 见土仪颦卿思故里 闻秘事凤姐讯家童","deeds":[{"surface":"凤姐","text":"却说莺儿带着老婆子们送东西回来，回复了宝钗，将众人道谢的话并赏赐的银钱都回完了，那老婆子便出去了。莺儿走近前来一步，挨着宝钗，悄悄的说道：“刚才我到琏二奶奶那边，看见二奶奶一脸的怒气。我送下东西出来时，悄悄的问小红，说：‘刚才二奶奶从老太太屋里回来，不似往日欢天喜地的，叫了平儿去，唧唧咕咕的不知说了些什么。’看那个光景，倒象有什么大事的似的。姑娘没听见那边老太太有什么事？”宝钗听了，也自己纳闷，想不出凤姐是为什么有气。便道：“各人家有各…","so":0,"eo":0},{"surface":"凤姐","text":"却说袭人因宝玉出门，自己作了回活计。忽想起凤姐身上不好，这几天也没有过去看看，况闻贾琏出门，正好大家说说话儿，便告诉晴雯：“好生在屋里，别都出去了，叫二爷回来抓不着人。”晴雯道：“嗳哟！这屋里单你一个人惦记着他，我们都是白闲着混饭吃的。”袭人笑着，也不答言，就走了。刚来到沁芳桥畔，那里正是夏末秋初，池中莲藕新残相间，红绿离披。袭人走着，沿堤看玩了一回，猛抬头，看见那边葡萄架底下，有人拿着掸子在那里掸什么呢。走到跟前，却是老祝妈。那老婆子…","so":0,"eo":0},{"surface":"凤姐","text":"说着，遂一径出了园门，来到凤姐这边。一到院里，只听凤姐说道：“天理良心，我在这屋里熬的越发成了贼了！”袭人听见这话，知道有原故了，又不好回来，又不好进去，遂把脚步放重些，隔着窗子问道：“平姐姐在家里呢么？”平儿忙答应着迎出来。袭人便问：“二奶奶也在家里呢么？身上可大安了？”说着，已走进来。凤姐装着在床上歪着呢，见袭人进来，也笑着站起来，说：“好些了，叫你惦着。怎么这几日不过我们这边坐坐？”袭人道：“奶奶身上欠安，本该天天过来请安才是。但…","so":0,"eo":0},{"surface":"凤姐","text":"一面说闲话儿。只见一个小丫头子在外间屋里，悄悄的和平儿说：“旺儿来了，在二门上伺候着呢。”又听见平儿也悄俏的道：“知道了。叫他先去，回来再来。别在门口儿站着。”袭人知他们有事，又说了两句话，便起身要走。凤姐道：“闲来坐坐，说说话儿，我倒开心。”因命：“平儿，送送你妹妹。”平儿答应着，送出来。只见两三个小丫头子都在那里，屏声息气，齐齐的伺候着。袭人不知何事，便自去了。","so":0,"eo":0},{"surface":"凤姐","text":"却说平儿送出袭人，进来回道：“旺儿才来了，因袭人在这里，我叫他先到外头等等儿。这会子还是立刻叫他呢，还是等着？请奶奶的示下。”凤姐道：“叫他来！”平儿忙叫小丫头去传旺儿进来。这里凤姐又问平儿：“你到底是怎么听见说的？”平儿道：“就是头里那个丫头子的话。他说他在二门里头，听见外头两个小厮说：‘这个新二奶奶比咱们旧二奶奶还俊呢，脾气儿也好。’不知是旺儿是谁，吆喝了两个一顿，说：‘什么新奶奶旧奶奶的，还不快悄悄儿的呢！叫里头知道了，把你的舌头…","so":0,"eo":0},{"surface":"凤姐","text":"旺儿请了安，在外间门口垂手侍立。凤姐儿道：“你过来！我问你话。”旺儿才走到里间门旁站着。凤姐儿道：“你二爷在外头弄了人，你知道不知道？”旺儿又打着千儿，回道：“奴才天天在二门上听差事，如何能知道二爷外头的事呢？”凤姐冷笑道：“你自然‘不知道’！你要知道，你怎么拦人呢！”旺儿见这话，知道刚才的话已经走了风了，料着瞒不过，便又跪回道：“奴才实在不知，就是头里兴儿和喜儿两个人在那里混说，奴才吆喝了他们两句。内中深情底里，奴才不知道，不敢妄回，…","so":0,"eo":0},{"surface":"凤姐","text":"却说兴儿正在账房儿里和小厮们玩呢，听见说“二奶奶叫”，先唬了一跳。却也想不到是这件事发作了，连忙跟着旺儿进来。旺儿先进去，回说：“兴儿来了。”凤姐儿厉声道：“叫他！”那兴儿听见这个声音儿，早已没了主意了，只得乍着胆子进来。凤姐儿一见便说：“好小子啊，你和你爷办的好事啊。你只实说罢！”兴儿一闻此言，又看见凤姐儿气色，及两边丫头们的光景，早唬软了，不觉跪下，只是磕头。凤姐儿道：“论起这事来，我也听见说不与你相干，但只你不早来回我知道，这就是…","so":0,"eo":0},{"surface":"凤姐","text":"兴儿直蹶蹶的跪起来回道：“这事头里奴才也不知道。就是这一天东府里大老爷送了殡，俞禄往珍大爷庙里，去领银子，二爷同着蓉哥儿到了东府里，道儿上，爷儿两个说起珍大奶奶那边的二位姨奶奶来，二爷夸他好，蓉哥儿哄着二爷，说把二姨奶奶说给二爷。”凤姐听到这里，使劲啐道：“呸！没脸的忘八蛋！他是你那一门子的姨奶奶？”兴儿忙又磕头说：“奴才该死。”往上瞅着，不敢言语。凤姐儿道：“完了吗？怎么不说了？”兴儿方才又回道：“奶奶恕奴才，奴才才敢回。”凤姐啐道：…","so":0,"eo":0}]},{"chap":68,"ctitle":"第68章 苦尤娘赚入大观园 酸凤姐大闹宁国府","deeds":[{"surface":"凤姐","text":"谁知凤姐早已心下算定，只得贾琏前脚走了，回来便传各色匠役，收拾东厢房三间，照依自己正室一样，装饰陈设。至十四日，便回明贾母王夫人，说十五日一早要到姑子庙进香去。只带了平儿、丰儿、周瑞媳妇、旺儿媳妇四人。未曾上车，便将原故告诉了众人，又吩咐众男人，素衣素盖，一径前来。兴儿引路，一直到了门前扣门。鲍二家的开了，兴儿笑道：“快回二奶奶去，大奶奶来了。”鲍二家的听了这句，顶梁骨走了真魂，忙飞跑进去报与尤二姐。尤二姐虽也一惊，但已来了，只得以礼相…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐在上坐，二姐忙命丫头拿褥子，便行礼，说：“妹子年轻，一从到了这里，诸事都是家母和家姐商议主张。今儿有幸相会，若姐姐不弃寒微，凡事求姐姐的指教，情愿倾心吐胆，只伏侍姐姐。”说着便行下礼去。凤姐忙下坐还礼，口内忙说：“皆因我也年轻，向来总是妇人的见识，一味的只劝二爷保重，别在外边眠花宿柳，恐怕叫太爷太太耽心：这都是你我的痴心，谁知二爷倒错会了我的意。若是外头包占人家姐妹，瞒着家里也罢了；如今娶了妹妹作二房，这样正经大事，也是人家大礼，却…","so":0,"eo":0},{"surface":"凤姐","text":"二姐见了这般，也不免滴下泪来。二人对见了礼，分序坐下。平儿忙也上来要见礼。二姐见他打扮不凡，举止品貌不俗，料定必是平儿，连忙亲身搀住，只叫：“妹子快别这么着，你我是一样的人。”凤姐忙也起身笑说：“折死了他！妹妹只管受礼，他原来是咱们的丫头。以后快别这么着。”，又命周瑞家的从包袱里取出四匹上色尺头，四对金珠簪环，为拜见的礼。二姐忙拜受了。二人吃茶，对诉已往之事。凤姐口内全是自怨自错：“怨不得别人。如今只求妹妹疼我。”二姐是个实心人，便认做…","so":0,"eo":0},{"surface":"凤姐","text":"彼时大观园里的十停人已有九停人知道了。今忽见凤姐带了进来，引动众人来看问。二姐一一见过。众人见了他标致和悦，无不称扬。凤姐一一的吩咐了众人：“都不许在外走了风声。若老太太、太太知道，我先叫你们死！”园里的婆子丫头都素惧凤姐的，又系贾琏国孝家孝中所行之事，知道关系非常，都不管这事。凤姐悄悄的求李纨收养几天：“等回明了，我们自然过去。”李纨见凤姐那边已收拾房屋，况在服中不好倡扬，自是正理，只得收下权住。凤姐又便去将他的丫头一概退出，又将自己…","so":0,"eo":0},{"surface":"凤姐","text":"且说合家之人都暗暗的纳罕，说：“看他如何这等贤惠起来了？”那二姐得了这个所在，又见园里姐妹个个好，倒也安心乐业的，自为得所。谁知三日之后，丫头善姐便有些不服使唤起来。二姐因说：“没了头油了，你去回一声大奶奶，拿些个来。”善姐儿便道：“二奶奶：你怎么不知好歹，没眼色？我们奶奶天天承应了老太太，又要承应这边太太、那边太太。这些姑娘妯娌们，上下几百男女人，天天起来都等他的话，一日少说大事也有一二十件，小事还有三五十件。外头从娘娘算起，以及王公…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐一面使旺儿在外打听这二姐的底细，皆已深知：果然已有了婆家的，女婿现在才十九岁，成日在外赌博，不理世业，家私花尽了，父母撵他出来，现在赌钱场存身。父亲得了尤婆子二十两银子，退了亲的，这女婿尚不知道。原来这小伙子名叫张华。凤姐都一一尽知原委，便封了二十两银子给旺儿，悄悄命他将张华勾来养活，“着他写一张状子，只要往有司衙门里告去，就告琏二爷国孝家孝的里头，背旨瞒亲，仗财依势，强逼退亲，停妻再娶。”这张华也深知利害，先不敢造次。旺儿回了凤姐…","so":0,"eo":0},{"surface":"凤姐","text":"察院坐堂，看状子是告贾琏的事，上面有“家人来旺一人”，只得遣人去贾府传来旺儿来对词。青衣不敢擅入，只命人带信。那旺儿正等着此事，不用人带信，早在这条街上等候，见了青衣，反迎上去，笑道：“起动众位弟兄，必是兄弟的事犯了。说不得，快来套上。”众青衣不敢，只说：“好哥哥你去罢，别闹了。”于是来至堂前跪了。察院命将状子给他看。旺儿故意看了一遍，碰头说道：“这事小的尽知的，主人实有此事。但这张华素与小的有仇，故意拉小的在内，其中还有人，求老爷再问…","so":0,"eo":0},{"surface":"凤姐","text":"且说贾蓉等正忙着贾琏之事，忽有人来报信，说：“有人告你们如此如此，这般这般，快作道理！”贾蓉慌忙来回贾珍。贾珍说：“我却早防着这一着。倒难为他这么大胆子。”立刻封了二百银子，着人去打点察院，又命家人去对词。正商议间，又报：“西府二奶奶来了。”贾珍听了这话，倒吃了一惊，忙要和贾蓉藏躲，不想凤姐已经进来了，说“好大哥哥，带着兄弟们干的好事！”贾蓉忙请安。凤姐拉了他就进来。贾珍还笑说：“好生伺候你婶娘，吩咐他们杀牲口备饭。”说着，便命备马，躲…","so":0,"eo":0}]},{"chap":69,"ctitle":"第69章 弄小巧用借剑杀人 觉大限吞生金自逝","deeds":[{"surface":"凤姐","text":"话说尤二姐听了，又感谢不尽，只得跟了他来。尤氏那边怎好不过来呢，少不得也过来，跟着凤姐去回。凤姐笑说：“你只别说话，等我去说。”尤氏道：“这个自然。但有了不是，往你身上推就是了。”说着，大家先至贾母屋里。正值贾母和园里姐妹们说笑解闷儿，忽见凤姐带了一个绝标致的小媳妇儿进来，忙觑着眼瞧说：“这是谁家的孩子？好可怜见儿的。”凤姐上来笑道：“老祖宗细细的看看，好不好？”说着，忙拉二姐儿说：“这是太婆婆了，快磕头。”二姐儿忙行了大礼。凤姐又指着…","so":0,"eo":0},{"surface":"凤姐","text":"贾母上下瞧了瞧，仰着脸，想了想，因又笑问：“这孩子我倒象那里见过他，好眼熟啊。”凤姐忙又笑说：“老祖宗且别讲那些，只说比我俊不俊。”贾母又带上眼镜，命鸳鸯琥珀：“把那孩子拉过来，我瞧瞧肉皮儿。”众人都抿着嘴儿笑，推他上去。贾母细瞧了一遍，又命琥珀：“拿出他的手来我瞧瞧。”贾母瞧毕，摘下眼镜来，笑说道：“很齐全，我看比你还俊呢。”凤姐听说，笑着忙跪下，将尤氏那边所编之话，一五一十细细的说了一遍，“少不得老祖宗发慈心，先许他进来住，一年后再…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐一面使人暗暗调唆张华，只叫他要原妻，这里还有许多陪送外，还给他银子安家过活。张华原无胆无心告贾家的，后来又见贾蓉打发了人对词，那人原说的：“张华先退了亲，我们原是亲戚，接到家里住着是真，并无强娶之说。皆因张华拖欠我们的债务，追索不给，方诬赖小的主儿。”那察院都和贾王两处有瓜葛，况又受了贿，只说张华无赖，以穷讹诈，状子也不收，打了一顿赶出来。庆儿在外，替张华打点，也没打重，又调唆张华，说：“这亲原是你家定的，你只要亲事，官必还断给你。…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐一面吓的来回贾母说，如此这般：“都是珍大嫂子干事不明，那家并没退准，惹人告了。如此官断。”贾母听了，忙唤尤氏过来，说他做事不妥：“既你妹子从小与人指腹为婚，又没退断，叫人告了，这是什么事？”尤氏听了，只得说：“他连银子都收了，怎么没准？”凤姐在旁说：“张华的口供上现说没见银子，也没见人去。他老子又说：‘原是亲家说过一次，并没应准；亲家死了，你们就接进去做二房。’如此没对证的话，只好由他去混说。幸而琏二爷不在家，不曾圆房，这还无妨。只…","so":0,"eo":0},{"surface":"凤姐","text":"贾蓉打听的真了，来回了贾母凤姐，说：“张华父子妄告不实，惧罪逃走，官府亦知此情，也不追究，大事完毕。“姐听了，心中一想：“若必定着张华带回二姐儿去，未免贾琏回来，再花几个钱包占住，不怕张华不依。还是二姐儿不去，自己拉绊着还妥当，且再作道理。只是张华此去，不知何往，倘或他再将此事告诉了别人，或日后再寻出这由头来翻案，岂不是自己害了自己？原先不该如此把刀靶儿递给外人哪！”因此，后悔不迭。复又想了一个主意出来，悄命旺儿遣人寻着了他，或讹他做贼…","so":0,"eo":0},{"surface":"凤姐","text":"那贾琏一日事毕回来，先到了新房中，已经静悄悄的关锁，只有一个看房子的老头儿。贾琏问起原故，老头子细说原委，贾琏只在镫中跌足。少不得来见贾赦和邢夫人，将所完之事回明。贾赦十分欢喜，说他中用，赏了他一百两银子，又将房中一个十七岁的丫鬟名唤秋桐赏他为妾。贾琏叩头领去，喜之不尽。见了贾母合家众人。回来见了凤姐，未免脸上有些愧色。谁知凤姐反不似往日容颜，同尤二姐一同出来，叙了寒温。贾琏将秋桐之事说了，未免脸上有些得意骄矜之色。凤姐听了，忙命两个媳…","so":0,"eo":0},{"surface":"凤姐","text":"且说凤姐在家，外面待尤二姐自不必说的，只是心中又怀别意，无人处只和尤二姐说：“妹妹的名声很不好听，连老太太、太太们都知道了，说妹妹在家做女孩儿就不干净，又和姐夫来往太密，‘没人要的，你拣了来。还不休了，再寻好的！’我听见这话气的什么儿似的。后来打听是谁说的，又察不出来。日久天长，这些奴才们跟前怎么说嘴呢？我反弄了鱼头来折。”说了两遍，自己先“气病了”，茶饭也不吃。除了平儿，众丫头媳妇无不言三语四，指桑说槐，暗相讥刺。且说秋桐自以为系贾赦…","so":0,"eo":0},{"surface":"凤姐","text":"园中姊妹一干人暗为二姐耽心。虽都不敢多言，却也可怜。每常无人处说起话来，二姐便淌眼抹泪，又不敢抱怨凤姐儿，因无一点坏形。贾琏来家时，见了凤姐贤良，也不留心。况素昔见贾赦姬妾丫鬟最多，贾琏每怀不轨之心，只未敢下手，今日天缘凑巧，竟把秋桐赏了他，真是一对烈火干柴，如胶投漆，燕尔新婚，连日那里拆得开？贾琏在二姐身上之心也渐渐淡了，只有秋桐一人是命。凤姐虽恨秋桐，且喜借他先可发脱二姐，用借刀杀人之法，坐山观虎斗，等秋桐杀了尤二姐，自己再杀秋桐。…","so":0,"eo":0}]},{"chap":70,"ctitle":"第70章 林黛玉重建桃花社 史湘云偶填柳絮词","deeds":[{"surface":"凤姐","text":"凤姐一应不管，只凭他自去办理。又因年近岁逼，诸事烦杂不算外，又有林之孝开了一个人单子来回：“共有八个二十五岁的单身小厮，应该娶妻成房的，等里面有该放的丫头，好求指配。”凤姐看了，先来问贾母和王夫人。大家商议，虽有几个应该发配的，奈各人皆有缘故：第一个鸳鸯，发誓不去。自那日之后，一向未与宝玉说话，也不盛妆浓饰。众人见他志坚，也不好相强。第二个琥珀，现又有病，这次不能了。彩云因近日和贾环分崩，也染了无医之症。只有凤姐儿和李纨房中粗使的大丫头…","so":0,"eo":0},{"surface":"凤姐","text":"原来这一向因凤姐儿病了，李纨探春料理家务，不得闲暇。接着过年过节，许多杂事，竟将诗社搁起。如今仲春天气，虽得了工夫，争奈宝玉因柳湘莲遁迹空门，又闻得尤三姐自刎，尤二姐被凤姐逼死，又兼柳五儿自那夜监禁之后，病越重了：连连接接，闲愁胡恨，一重不了一重添，弄的情色若痴，语言常乱，似染怔仲之病。慌的袭人等又不敢回贾母，只百般逗他玩笑。","so":0,"eo":0},{"surface":"凤姐","text":"这日清晨方醒，只听得外间屋内咭咭呱呱，笑声不断。袭人因笑说：“你快出去拉拉罢，晴雯和麝月两人按住芳官那里隔肢呢。”宝玉听了，忙披上灰鼠长袄出来一瞧，只见他三人被褥尚未叠起，大衣也未穿：那晴雯只穿着葱绿杭绸小袄，红绸子小衣儿，披着头发，骑在芳官身上，麝月是红绫抹胸，披着一身旧衣，在那里抓芳官的肋肢，芳官却仰在炕上，穿着撒花紧身儿，红裤绿袜，两脚乱蹬，笑的喘不过气来。宝玉忙笑说：“两个大的欺负一个小的！等我来挠你们。”说着也上床来隔肢晴雯。…","so":0,"eo":0},{"surface":"凤姐","text":"这日，众妹妹皆在房中侍早膳毕，便有贾政书信到了。宝玉请安，将请贾母的安禀拆开，念与贾母听。上面不过是请安的话，说六月准进京等语。其馀家信事物之帖，自有贾琏和王夫人开读。众人听说六七月回京，都喜之不尽。偏生这日王子腾将侄女许与保宁侯之子为妻，择于五月间过门，凤姐儿又忙着张罗，常三五日不在家。这日王子腾的夫人又来接凤姐儿，一并请众甥男甥女乐一日。贾母和王夫人命宝玉、探春、黛玉、宝钗四人同凤姐儿去，众人不敢违拗，只得回房去另妆饰了起来。五人去…","so":0,"eo":0}]},{"chap":71,"ctitle":"第71章 嫌隙人有心生嫌隙 鸳鸯女无意遇鸳鸯","deeds":[{"surface":"凤姐","text":"至二十八日，两府中俱悬灯结彩，屏开鸾凤，褥设芙蓉，笙萧鼓乐之音，通衢越巷。宁府中，本日只有北静王、南安郡王、永昌驸马、乐善郡王并几位世交公侯荫袭；荣府中，南安王太姑、北静王妃并世交公侯诰命。贾母等皆是按品大妆迎接。大家厮见，先请至大观园内嘉荫堂，茶毕更衣，方出至荣庆堂上拜寿入席。大家谦逊半日，方才入座。上面两席是南北王妃，下面依序便是众公侯命妇。左边下手一席，陪客是锦乡侯诰命与临昌伯诰命；右边下手方是贾母主位。邢夫人、王夫人带领尤氏凤姐…","so":0,"eo":0},{"surface":"凤姐","text":"少时，菜已四献，汤始一道，跟来各家的放了赏，大家便更衣服入园来，另献好茶。南安太妃因问宝玉。贾母笑道：“今日几处庙里念保安延寿经，他跪经去了。”又问众小姐们。贾母笑道：“他们姊妹们病的病，弱的弱，见人腼腆，所以叫他们给我看屋子去了。有的是小戏子传了一班在那边厅上，陪着他姨娘家秭妹们也看戏呢。”南安太妃笑道：“既这样，叫人请来。”贾母回头命了凤姐儿，“去把史、薛、林四位姑娘带来。再只叫你三妹妹陪着来罢。”凤姐答应了，来至贾母这边，只见他姊…","so":0,"eo":0},{"surface":"凤姐","text":"这几日尤氏晚间也不回那府去，白日间待客，晚上陪贾母玩笑，又帮着凤姐料理出入大小器皿以及收放礼物。晚上往园内李氏房中歇宿。这日伏侍过贾母晚饭后，贾母因说：“你们乏了，我也乏了，早些找点子什么吃了，歇歇去罢。明儿还要起早呢。”尤氏答应着，退出去，到凤姐儿屋里来吃饭。凤姐儿正在楼上看着人收送来的围屏呢，只有平儿在屋里，给凤姐叠衣服。尤氏想起二姐儿在时多承平儿照应，便点着头儿，说道：“好丫头，你这么个好心人，难为在这里熬。”平儿把眼圈儿一红，忙…","so":0,"eo":0},{"surface":"凤姐","text":"尤氏已早进园来，因遇见了袭人、宝琴、湘云三人，同着地藏庵的两个姑子正说故事玩笑。尤氏因说饿了，先到怡红院，袭人装了几样荤素点心出来给尤氏吃。那小丫头子一径找了来，气狠狠的把方才的话都说了。尤氏听了，半晌冷笑道：“这是两个什么人？”两个姑子笑推这丫头道：“你这姑娘好气性大，那糊涂老妈妈们的话，你也不该来回才是。咱们奶奶万金之体，劳乏了几日，黄汤辣水没吃，咱们只有哄他欢喜的，说这些话做什么？”袭人也忙笑拉他出去，说：“好妹子，你且出去歇歇，…","so":0,"eo":0},{"surface":"凤姐","text":"说话之间，袭人早又遣了一个丫头去到园门外找人。可巧遇见周瑞家的，这小丫头子就把这话告诉他了。周瑞家的虽不管事，因他素日仗着王夫人的陪房，原有些体面，心性乖滑，专惯各处献勤讨好，所以各房主子都喜欢他。他今日听了这话，忙跑入怡红院，一面飞走，一面说：“可了不得，气坏了奶奶了。偏我不在跟前。且打他们几个耳刮子，再等过了这几天算账！”尤氏见了他，也便笑道：“周姐姐你来，有个理你说说：这早晚园门还大开着，明灯蜡烛，出入的人又杂，倘有不防的事，如何…","so":0,"eo":0},{"surface":"凤姐","text":"一时，周瑞家的出去，便把方才之事回了凤姐。凤姐便命：“将那两个的名字记上，等过了这几日，捆了送到那府里，凭大奶奶开发。或是打，或是开恩，随他就完了。什么大事！”周瑞家的听了，巴不得一声，素日因与这几个人不睦，出来了便命一个小厮到林之孝家去传凤姐的话，立刻叫林之孝家的进来见大奶奶；一面又传人立刻捆起这两个婆子来，交到马圈里，派人看守。林之孝家的不知甚么事，忙坐车进来，先见凤姐。至二门上，传进话去，丫头们出来说：“奶奶才歇下了。大奶奶在园内…","so":0,"eo":0},{"surface":"凤姐","text":"这一个小丫头子，果然过来告诉了他姐姐，和费婆子说了。这费婆子原是个大不安静的，便隔墙大骂一阵，走了来求邢夫人，说他亲家“与大奶奶的小丫头白斗了两句话，周瑞家的挑唆了二奶奶，现捆在马圈里，等过两日还要打呢。求太太和二奶奶说声，饶他一次罢”。邢夫人自为要鸳鸯讨了没意思，贾母冷淡了他，且前日南安太妃来，贾母又单令探春出来，自己心内早已怨忿。又有在侧一干小人，心内嫉妒，挟怨凤姐，便调唆的邢夫人着实憎恶凤姐。如今又听了如此一篇话，也不说长短。","so":0,"eo":0},{"surface":"凤姐","text":"至次日一早，见过贾母。众族人到齐，开戏。贾母高兴，又今日都是自己族中子侄辈，只便妆出来堂上受礼。当中独设一榻，引枕、靠背、脚踏俱全，自己歪在榻上。榻之前后左右，皆是一色的矮凳。宝钗、宝琴、黛玉、湘云、迎春、探春、惜春姊妹等围绕。因贾之母也带了女儿喜鸾，贾琼之母也带了女儿四姐儿，还有几房的孙女儿，大小共有二十来个，贾母独见喜鸾、四姐儿生得又好，说话行事与众不同，心中欢喜，便叫他两个也坐在榻前。宝玉却在榻上，与贾母捶腿。首席便是薛姨妈，下边…","so":0,"eo":0}]},{"chap":72,"ctitle":"第72章 王熙凤恃强羞说病 来旺妇倚势霸成亲","deeds":[{"surface":"凤姐","text":"鸳鸯又安慰了他一番，方出来。因知贾琏不在家中，又因这两日凤姐儿声色怠惰了些，不似往日一样，便顺路来问候。刚进入凤姐院中，二门上的人见是他来，便站立待他进去。鸳鸯来至堂屋，只见平儿从里头出来，见了他来，便忙上来悄声笑道：“才吃了一口饭，歇了中觉了。你且这屋里略坐坐。”鸳鸯听了，只得同平儿到东边房里来。小丫头倒了茶来。鸳鸯悄问道：“你奶奶这两日是怎么了？我近来看着他懒懒的。”平儿见问，因房内无人，便叹道：“他这懒懒的，也不止今日了。这有一月…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏见他去了，只得回来瞧凤姐。谁知凤姐已醒了，听他和鸳鸯借当，自己不便答话，只躺在榻上。听见鸳鸯去了，贾琏进来，凤姐因问道：“他可应准了？”贾琏笑道：“虽未应准，却有几分成了。须得你再去和他说一说，就十分成了。”凤姐笑道：“我不管这些事。倘或说准了，这会子说着好听，到了有钱的时节，你就撂在脖子后头了，谁和你打饥荒去？倘或老太太知道了，倒把我这几年的脸面都丢了。”贾琏笑道：“好人，你要说定了，我谢你。”凤姐笑道：“你说谢我什么？”贾琏笑道…","so":0,"eo":0},{"surface":"凤姐","text":"我不和你们借就罢了！这会子烦你说一句话，还要个利钱，难为你们和我……”凤姐不等说完，翻身起来说道：“我三千五千，不是赚的你的！如今里外上下，背着嚼说我的不少了，就短了你来说我了！可知‘没家亲引不出外鬼来’。我们看着你家什么石崇、邓通？把我王家的缝子扫一扫，就够你们一辈子过的了。说出来的话也不害臊！现有对证，把太太和我的嫁妆细看看，比一比，我们那一样是配不上你们的？”贾琏笑道：“说句玩话儿就急了。这有什么的呢。你要使一二百两银子值什么？多…","so":0,"eo":0},{"surface":"凤姐","text":"一语未了，只见旺儿媳妇走进来。凤姐便问：“可成了没有？”旺儿媳妇道：“竟不中用。我说须得奶奶作主就成了。”贾琏便问：“又是什么事？”凤姐儿见问，便说道：“不是什么大事。旺儿有个小子，今年十七岁了还没娶媳妇儿，因要求太太房里的彩霞，不知太太心里怎么样。前日太太见彩霞大了，二则又多病多灾的，因此开恩打发他出去了，给他老子随便自己择女婿去罢。因此旺儿媳妇来求我。我想他两家也就算门当户对了，一说去自然成的，谁知他这会子来了说不中用。”贾琏道：“…","so":0,"eo":0},{"surface":"凤姐","text":"一语戳动了凤姐和贾琏。凤姐因见贾琏在此，且不做一声，只看贾琏的光景。贾琏心中有事，那里把这点事放在心里？待要不管，只是看着凤姐儿的陪房，且素日出过力的，脸上实在过不去，因说：“什么大事？只管咕咕唧唧的！你放心且去，我明日作媒，打发两个有体面的人，一面说一面带着定礼去，就说是我的主意。他十分不依，叫他来见我。”旺儿家的看着凤姐，凤姐便努嘴儿。旺儿家的会意，忙爬下就给贾琏磕头谢恩。这贾琏忙道：“你只管给你们姑奶奶磕头。我虽说了，到底也得你们…","so":0,"eo":0},{"surface":"凤姐","text":"一语未了，人回：“夏太监打发了一个小内家来说话。”贾琏听了，忙皱眉道：“又是什么话？一年他们也搬够了。”凤姐道：“你藏起来，等我见他。若是小事罢了，若是大事，我自有回话。”贾琏便躲入内套间去。这里凤姐命人带进小太监来，让他椅上坐了吃茶，因问何事。那小太监便说：“夏爷爷因今儿偶见一所房子，如今竟短二百两银子，打发我来问舅奶奶家里，有现成的银子暂借一二百，这一两日就送来。”凤姐儿听了，笑道：“什么是送来？有的是银子，只管先兑了去。改日等我们…","so":0,"eo":0},{"surface":"凤姐","text":"晚间凤姐已命人唤了彩霞之母来说媒。那彩霞之母满心纵不愿意，见凤姐自和他说，何等体面，便心不由己的满口应了出去。凤姐又问贾琏：“可说了没有？”贾琏因说：“我原要说来着，听见他这小子大不成人，所以还没说。若果然不成人，且管教他两日，再给他老婆不迟。”凤姐笑道：“我们王家的人，连我还不中你们的意，何况奴才呢。我已经和他娘说了，他娘倒欢天喜地，难道又叫进他来不要了不成？”贾琏道：“你既说了，又何必退呢？明日说给他老子，好生管他就是了。”这里说话…","so":0,"eo":0}]},{"chap":73,"ctitle":"第73章 痴丫头误拾绣春囊 懦小姐不问累金凤","deeds":[{"surface":"凤姐","text":"却说怡红院中宝玉方才睡下，丫鬟们正欲各散安歇，忽听有人来敲院门。老婆子开了，见是赵姨娘房内的丫头名唤小鹊的，问他作什么，小鹊不答，直往里走，来找宝玉。只见宝玉才睡下，晴雯等犹在床边坐着，大家玩笑。见他来了，都问：“什么事，这时候又跑了来？”小鹊连忙悄向宝玉道：“我来告诉你个信儿，方才我们奶奶咕咕唧唧的，在老爷前不知说了你些个什么，我只听见‘宝玉’二字。我来告诉你，仔细明儿老爷和你说话罢。”一面说着，回身就走。袭人命人留他吃茶，因怕关门，…","so":0,"eo":0},{"surface":"凤姐","text":"贾母闻知宝玉被吓，细问原由，众人不敢再隐，只得回明。贾母道：“我不料有此事。如今各处上夜的都不小还是小事，只怕他们就是贼也未可知。”当下邢夫人、尤氏等都过来请安，李纨、凤姐及妹妹等皆陪侍，听贾母如此说，都默无所答。独探春出位笑道：“近因凤姐姐身子不好几日，园里的人，比先放肆许多。先前不过是大家偷着一时半刻，或夜里坐更时三四个人聚在一处，或掷骰，或斗牌，小玩意儿，不过为着熬困起见。如今渐次放诞，竟开了赌局，甚至头家局主，或三十吊五十吊的大…","so":0,"eo":0},{"surface":"凤姐","text":"林之孝家的等见贾母动怒，谁敢徇私，忙去园内传齐，又一一盘查。虽然大家赖一回，终不免水落石出。查得大头家三人，小头家八人，聚赌者统共二十多人，都带来见贾母，跪在院内，磕响头求饶。贾母先问大头家名姓，和钱之多少。原来这大头家，一个是林之孝家的两姨亲家，一个是园内厨房内柳家媳妇之妹，一个是迎春之乳母。这是三个为首的，馀者不能多记。贾母便命将骰子纸牌一并烧毁，所有的钱入官，分散与从人；将为首者每人打四十大板，撵出去，总不许再入；从者每人打二十板…","so":0,"eo":0},{"surface":"凤姐","text":"谁知迎春的乳母之媳玉儿媳妇为他婆婆得罪，来求迎春去讨情，他们正说金凤一事，且不进去。也因素日迎春懦弱，他们都不放在心上。如今见绣橘立意去回凤姐，又看这事脱不过去，只得进来，陪笑先向绣橘说：“姑娘，你别去生事。姑娘的金丝凤，原是我们老奶奶老糊涂了，输了几个钱，没的捞梢，所以借去，不想今日弄出事来。虽然这祥，到底主子的东西，我们不敢迟误，终久是要赎的。如今还要求姑娘看着从小儿吃奶的情，往老太太那边去讨一个情儿，救出他来才好。”迎春便说道：“…","so":0,"eo":0},{"surface":"凤姐","text":"三人正没开交，可巧宝钗、黛玉、宝琴、探春等，因恐迎春今日不自在，都约着来安慰。他们走到院中，听见几个人讲究，探春从纱窗内一看，只见迎春倚在床上看书，若有不闻之状，探春也笑了。小丫头们忙打起帘子报道：“姑娘们来了。”迎春放下书起身。那媳妇见有人来，且又有探春在内，不劝自止了，遂趁便就走。探春坐下，便问：“才刚谁在这里说话，倒象拌嘴似的？”迎春笑道：“没有什么，左不过他们小题大做罢了，何必问他？”探春笑道：“我才听见什么‘金凤’，又是什么‘…","so":0,"eo":0},{"surface":"凤姐","text":"谁知探春早使了眼色与侍书，侍书出去了。这里正说话，忽见平儿进来。宝琴拍手笑道：“三姐姐敢是有驱神召将的符术？”黛玉笑道：“这倒不是道家法术，倒是用兵最精的所谓‘守如处女，出如脱兔’，‘出其不备’的妙策。”二人取笑，宝钗便使眼色与二人，遂以别话岔开。探春见平儿来了，遂问：“你奶奶可好些了？真是病糊涂了，事事都不在心上，叫我们受这样委屈。”平儿忙道：“谁敢给姑娘气受？姑娘吩咐我。”那玉柱儿媳妇方慌了手脚，遂上来赶着平儿叫：“姑娘坐下，让我说…","so":0,"eo":0}]},{"chap":74,"ctitle":"第74章 惑奸谗抄检大观园 避嫌隙杜绝宁国府","deeds":[{"surface":"凤姐","text":"话说平儿听迎春说了，正自好笑，忽见宝玉也来了。原来管厨房柳家媳妇的妹子也因放头开赌，得了不是，因这园中有素和柳家的不好的，便又告出柳家的来，说和他妹子是伙计，赚了平分。因此凤姐要治柳家之罪。那柳家的听得此言，便慌了手脚，因思素与恰红院的人最为深厚，故走来悄悄的央求晴雯芳官等人，转告诉了宝玉。宝玉因思内中迎春的嬷嬷也现有此罪，不若来约同迎春去讨情，比自己独去单为柳家的说情又更妥当，故此前来。忽见许多人在此，见他来时，都问道：“你的病可好了…","so":0,"eo":0},{"surface":"凤姐","text":"平儿便出去办累金凤一事。那玉柱儿媳妇紧跟在后，口内百般央求，只说：“姑娘好歹口内超生，我横竖去赎了来。”平儿笑道：“你迟也赎，早也赎，‘既有今日，何必当初’。你的意思得过就过，既这么样，我也不好意思告诉人。趁早儿取了来，交给我，一字不提。”玉柱儿媳妇听说，方放下心来，就拜谢，又说：“姑娘自去贵干。赶晚赎了来，先回了姑娘再送去如何？”平儿道：“赶晚不来，可别怨我！”说毕，二人方分路各自散了。平儿到房，凤姐问他：“三姑娘叫你做什么？”平儿笑…","so":0,"eo":0},{"surface":"凤姐","text":"一语未了，只见贾琏进来，拍手叹气道：“好好的又生事！前儿我和鸳鸯借当，那边太太怎么知道了？刚才太太叫过我去，叫我不管那里先借二百银子，做八月十五节下用。我回没处借，太太就说：‘你没有钱就有地方挪移，我白和你商量，你就搪塞我！你就没地方儿！前儿一千银子的当是那里的？连老太太的东西你都有神通弄出来，这会二百银子你就这样难。亏我没和别人说去！’我想太太分明不短，何苦来又寻事奈何人！”凤姐儿道：“那日并没个外人，谁走了这个消息？”平儿听了，也细…","so":0,"eo":0},{"surface":"凤姐","text":"这里凤姐和平儿猜疑走风的人：“反叫鸳鸯受累，岂不是咱们之过！”正在胡想，人报：“太太来了。”凤姐听了诧异，不知何事，遂与平儿等忙迎出来。只见王夫人气色更变，只带一个贴己丫头走来，一语不发，走至里间坐下。凤姐忙捧茶，因陪笑问道：“太太今日高兴，到这里逛逛？”王夫人喝命：“平儿出去！”平儿见了这般，不知怎么了，忙应了一声，带着众小丫头一齐出去，在房门外站住。一面将房门掩了，自己坐在台阶上，所有的人一个不许进去；凤姐也着了慌，不知有何事。只见…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐听说，又急又愧，登时紫胀了面皮，便挨着炕沿双膝跪下，也含泪诉道：“太太说的固然有理，我也不敢辩。但我并无这样东西，其中还要求太太细想。这香袋儿是外头仿着内工绣的，连穗子一概都是市卖的东西。我虽年轻不尊重，也不肯要这样东西。再者，这也不是常带着的，我纵然有，也只好在私处搁着，焉肯在身上常带，各处逛去？况且又在园里去，个个姊妹，我们都肯拉拉扯扯，倘或露出来，不但在姊妹前看见，就是奴才看见，我有什么意思？三则论主子内我是年轻媳妇，算起来，…","so":0,"eo":0},{"surface":"凤姐","text":"王夫人听了这一席话，很近情理，因叹道：“你起来！我也知道你是大家子的姑娘出身，不至这样轻薄，不过我气激你的话。但只如今且怎么处？你婆婆才打发人封了这个给我瞧，把我气了个死。”凤姐道：“太太快别生气。若被众人觉察了，保不定老太太不知道。且平心静气，暗暗访察，才能得这个实在；纵然访不着，外人也不能知道。如今惟有趁着赌钱的因由革了许多人这空儿，把周瑞媳妇、旺儿媳妇等四五个贴近不能走话的人，安插在园里，以查赌为由。再如今他们的丫头也太多了，保不…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐即唤平儿进来，吩咐出去。一时，周瑞家的与吴兴家的、郑华家的、来旺家的、来喜家的现在五家陪房进来。王夫人正嫌人少，不能勘察，忽见邢夫人的陪房王善保家的走来，正是方才是他送香袋来的。王夫人向来看视邢夫人之得力心腹人等原无二意，今见他来打听此事，便向他说：“你去回了太太，也进园来照管照管，比别人强些。”王善保家的因素日进园去，那些丫鬟们不大趋奉他，他心里不自在，要寻他们的故事又寻不着，恰好生出这件事来，以为得了把柄！又听王夫人委托他，正碰…","so":0,"eo":0},{"surface":"凤姐","text":"小丫头答应了，走入怡红院，正值晴雯身上不好，睡中觉才起来，发闷呢，听如此说，只得跟了他来。素日晴雯不敢出头，因连日不自在，并没十分妆饰，自为无碍。及到了凤姐房中，王夫人一见他钗鬓松，衫垂带褪，大有春睡捧心之态，而且形容面貌恰是上月的那人，不觉勾起方才的火来。王夫人便冷笑道：“好个美人儿，真象个‘病西施’了。你天天作这轻狂样儿给谁看！你干的事，打量我不知道呢。我且放着你，自然明儿揭你的皮！宝玉今日可好些？”晴雯一听如此说，心内大异，便知有…","so":0,"eo":0}]},{"chap":75,"ctitle":"第75章 开夜宴异兆发悲音 赏中秋新词得佳谶","deeds":[{"surface":"凤姐","text":"恰好太医才诊了脉去，李纨近日也觉精爽了些，拥裘倚枕坐在床上，正欲人来说些闲话。因见尤氏进来，不似方才和蔼，只呆呆的坐着，李纨因问道：“你过来了，可吃些东西？只怕饿了？”命素云：“瞧有什么新鲜点心拿来。”尤氏忙止道：“不必不必。你这一向病着，那里有什么新鲜东西？况且我也不饿。”李纨道：“昨日人家送来的好茶面子，倒是对碗来你喝罢。”说毕，便吩咐去对茶。尤氏出神无语。跟来的丫头媳妇们因问：“奶奶今日晌午尚未洗脸，这会子趁便可净一净好？”尤氏点…","so":0,"eo":0},{"surface":"凤姐","text":"一语未了，只见人报：“宝姑娘来了。”二人忙说快请，宝钗已走进来。尤氏忙擦脸起身让坐，因问：“怎么一个人忽然走进来，别的妹妹都不见？”宝钗道：“正是，我也没有见他们。只因今日我们奶奶身上不自在，家里两个女人也都因时症未起炕，别的靠不得，我今儿要出去陪着老人家夜里作伴。要去回老太太、太太，我想又不是什么大事，且不用提，等好了，我横竖进来呢。所以来告诉大嫂子一声。”李纨听说，只看着尤氏笑，尤氏也看着李纨笑。一时尤氏盛洗已毕，大家吃面茶。李纨因…","so":0,"eo":0},{"surface":"凤姐","text":"尤氏辞了李纨，往贾母这边来。贾母歪在榻上，王夫人正说甄家因何获罪，如今抄没了家产，来京治罪等话。贾母听了，心中甚不自在。恰好见他妹妹来了，因问：“从那里来的？可知凤姐儿妯娌两个病着，今日怎么样？”尤氏等忙回道：“今日都好些。”贾母点头叹道：“咱们别管人家的事，且商量咱们八月十五赏月是正经。”王夫人笑道：“已预备下了，不知老太太拣那里好？只是园里恐夜晚风凉。”贾母笑道：“多穿两件衣服何妨？那里正是赏月的地方，岂可倒不去的？”说话之间，媳妇…","so":0,"eo":0},{"surface":"凤姐","text":"贾母因问：“拿稀饭来吃些罢。”尤氏早捧过一碗来，说是红稻米粥。贾母接来吃了半碗，便吩咐：“将这粥送给凤姐儿吃去。”又指着这一盘果子：“独给平儿吃去。”又向尤氏道：“我吃了，你就来吃了罢。”尤氏答应着，待贾母漱口洗手毕。贾母便下地，和王夫人说闲话行食，尤氏告坐吃饭。贾母又命鸳鸯等来陪吃。贾母见尤氏吃的仍是白米饭，因问说：“怎么不盛我的饭？”丫头们回道：“老太太的饭完了。今日添了一位姑娘，所以短了些。”鸳鸯道：“如今都是‘可着头做帽子’了，…","so":0,"eo":0}]},{"chap":76,"ctitle":"第76章 凸碧堂品笛感凄清 凹晶馆联诗悲寂寞","deeds":[{"surface":"凤姐","text":"话说贾赦、贾政带领贾珍等散去不提。且说贾母这里命将围屏撤去，两席并作一席。众媳妇另行擦桌整果，更杯洗箸，陈设一番。贾母等都添了衣，盥漱吃茶，方又坐下，团团围绕。贾母看时，宝钗姊妹二人不在坐内，知他家去圆月，且李纨、凤姐二人又病，少了这四个人，便觉冷清了好些。贾母因笑道：“往年你老爷们不在家，咱们都是请过姨太太来大家赏月，却十分热闹。忽一时想起你老爷来，又不免想到母子夫妻儿女不能一处，也都没兴。及至今年你老爷来了，正该大家团圆取乐，又不便…","so":0,"eo":0}]},{"chap":77,"ctitle":"第77章 俏丫鬟抱屈夭风流 美优怜斩情归水月","deeds":[{"surface":"凤姐","text":"话说王夫人见中秋已过，凤姐病也比先减了，虽未大愈，然亦可以出入行走得了，仍命大夫每日诊脉服药。又开了丸药方来，配“调经养荣丸”。因用上等人参二两，王夫人取时，翻寻了半日，只向小匣内寻了几枝簪挺粗细的。王夫人看了嫌不好，命再找去，又找了一大包须沫出来。王夫人焦躁道：“用不着偏有，但用着了，再找不着！成日家我叫你们查一查，都归拢一处，你们白不听，就随手混撂。”彩云道：“想是没了，就只有这个。上次那边的太太来寻了去了。”王夫人道：“没有的话。…","so":0,"eo":0},{"surface":"凤姐","text":"一时宝钗去后，因见无别人在室，遂唤周瑞家的，问：“前日园中搜检的事情，可得下落？”周瑞家的是已和凤姐商议停妥，一字不隐，遂回明王夫人。王夫人吃了一惊。想到司棋系迎春丫头，乃系那边的人，只得令人去回邢氏。周瑞家的回道：“前日那边太太嗔着王善保家的多事，打了几个嘴巴子，如今他也装病在家，不肯出头了。况且又是他外孙女儿，自己打了嘴，他只好装个忘了，日久平服了再说。如今我们过去回时，恐怕又多心，倒象咱们多事是的。不如直把司棋带过去，一并连赃证与…","so":0,"eo":0},{"surface":"凤姐","text":"于是周瑞家的等人带了司棋出去，又有两个婆子将司棋所有的东西都与他拿着。走了没几步，只见后头绣橘起来，一面也擦着泪，一面递给司棋一个绢包，说：“这是姑娘给你的。主仆一场，如今一旦分离，这个给你做个念心儿罢。”司棋接了，不觉更哭起来了，又和绣橘哭了一回。周瑞家的不耐烦，只管催促，二人只得散了。司棋因又哭告道：“婶子大娘们，好歹略徇个情儿：如今且歇一歇，让我到相好妹妹跟前辞一辞，也是这几年我们相好一场。”周瑞家的等人皆各有事，做这些事便是不得…","so":0,"eo":0},{"surface":"凤姐","text":"却说这晴雯当日系赖大买的。还有个姑舅哥哥，叫做吴贵，人都叫他贵儿。那时晴雯才得十岁，时常赖嬷嬷带进来，贾母见了喜欢，故此赖嬷嬷就孝敬了贾母。过了几年，赖大又给他姑舅哥哥娶了一房媳妇。谁知贵儿一味胆小老实，那媳妇却倒伶俐，又兼有几分姿色，看着贵儿无能为，便每日家打扮的妖妖调调，两只眼儿水汪汪的，招惹的赖大家人如蝇逐臭，渐渐做出些风流勾当来。那时晴雯已在宝玉屋里，他便央及了晴雯转求凤姐，合赖大家的要过来。目今两口儿就在园子后角门外居住，伺候…","so":0,"eo":0}]},{"chap":78,"ctitle":"第78章 老学士闲征姽婳词 痴公子杜撰芙蓉诔","deeds":[{"surface":"凤姐","text":"一时，只见迎春妆扮了前来告辞过去。凤姐也来请早安，伺候早饭。又说笑一回，贾母歇晌，王夫人便唤了凤姐，问他丸药可曾配来。凤姐道：“还不曾呢，如今还是吃汤药，太太只管放心，我已大好了。”王夫人见他精神复初，也就信了，因告诉撵逐晴雯等事。又说：“宝丫头怎么私自回家去了？你们都不知道。我前儿顺路都查了一查，谁知兰小子的这一个新进来的奶子，也十分的妖调，也不喜欢他。我说给你大嫂子了，好不好，叫他各自去罢。我因问你大嫂子，‘宝丫头出去，难道你们不知…","so":0,"eo":0}]},{"chap":81,"ctitle":"第81章 占旺相四美钓游鱼 奉严词两番入家塾","deeds":[{"surface":"凤姐","text":"说着凤姐也进来了，见了贾母，又回身见过了王夫人，说道：“老祖宗要问我什么？”贾母道：“你那年中了邪的时候儿，你还记得么？”凤姐儿笑道：“我也不很记得了。但觉自己身子不由自主，倒象有什么人拉拉扯扯，要我杀人才好。有什么拿什么，见什么杀什么，自己原觉很乏，只是不能住手。”贾母道：“好的时候儿呢？”凤姐道：“好的时候象空中有人说了几句话似的，却不记得说什么来着。”贾母道：“这么看起来，竟是他了。他姐儿两个病中的光景合才说的一样。这老东西竟这样…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐道：“咱们的病一准是他。我记得咱们病后，那老妖精向赵姨娘那里来过几次，和赵姨娘讨银子，见了我，就脸上变貌变色，两眼黧鸡似的。我当初还猜了几遍，总不知什么原故。如今说起来，却原来都是有因的。但只我在这里当家，自然惹人恨怨，怪不得别人治我，宝玉可合人有什么仇呢？忍得下这么毒手！”贾母道：“焉知不因我疼宝玉，不疼环儿，竟给你们种了毒了呢。”王夫人道：“这老货已经问了罪，决不好叫他来对证。没有对证，赵姨娘那里肯认账？事情又大，闹出来外面也不…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，只见玉钏儿走来对王夫人道：“老爷要找一件什么东西，请太太伺候了老太太的饭完了，自己去找一找呢。”贾母道：“你去罢，保不住你老爷有要紧的事。”王夫人答应着，便留下凤姐儿伺候，自己退了出来。回至房中，合贾政说了些闲话，把东西找出来了。贾政便问道：“迎儿已经回去了？他在孙家怎么样？”王夫人道：“迎丫头一肚子眼泪，说孙姑爷凶横的了不得。”因把迎春的话述了一遍。贾政叹道：“我原知不是对头，无奈大老爷已说定了，叫我也没法。不过迎丫头受些委屈…","so":0,"eo":0}]},{"chap":82,"ctitle":"第82章 老学究讲义警顽心 病潇湘痴魂惊恶梦","deeds":[{"surface":"凤姐","text":"且说宝玉上学之后，怡红院中甚觉清净闲暇，袭人倒可做些活计，拿着针线要绣个槟榔包儿。想这如今宝玉有了功课，丫头们可也没有饥荒了，早要如此，晴雯何至弄到没有结果？兔死狐悲，不觉叹起气来。忽又想到自己终身，本不是宝玉的正配，原是偏房。宝玉的为人却还拿得住，只怕娶了一个利害的，自己便是尤二姐、香菱的后身。素来看着贾母，王夫人光景，及凤姐儿往往露出话来，自然是黛玉无疑了。那黛玉就是个多心人。想到此际，脸红心热，拿着针不知戳到那里去了。便把活计放下…","so":0,"eo":0},{"surface":"凤姐","text":"不知不觉，只见小丫头走来说道：“外面雨村贾老爷请姑娘。”黛玉道：“我虽跟他读过书，却不比男学生，要见我做什么？况且他和舅舅往来，从未提起，我也不必见的。”因叫小丫头回复：“身上有病，不能出来，与我请安道谢就是了。”小丫头道：“只怕要与姑娘道喜，南京还有人来接。”说着，又见凤姐同邢夫人、王夫人、宝钗等都来笑道：“我们一来道喜，二来送行。”黛玉慌道：“你们说什么话？”凤姐道：“你还装什么呆？你难道不知道，林姑爷升了湖北的粮道，娶了一位继母，…","so":0,"eo":0}]},{"chap":83,"ctitle":"第83章 省宫闱贾元妃染恙 闹闺阃薛宝钗吞声","deeds":[{"surface":"凤姐","text":"到了次日，大夫来了。瞧了宝玉，不过说饮食不调，着了点儿风邪，没大要紧，疏散疏散就好了。这里王夫人凤姐等，一面遣人拿了方子回贾母，一面使人到潇湘馆，告诉说：“大夫就过来。”紫鹃答应了，连忙给黛玉盖好被窝，放下帐子，雪雁赶着收拾房里的东西。一时贾琏陪着大夫进来了，便说道：“这位老爷是常来的，姑娘们不用回避。”老婆子打起帘子，贾琏让着，进入房中坐下。贾琏道：“紫鹃姐姐，你先把姑娘的病势向王老爷说说。”王大夫道：“且慢说。等我诊了脉，听我说了，…","so":0,"eo":0},{"surface":"凤姐","text":"这里贾琏一面叫人抓药，一面回到房中去告诉凤姐，黛玉的病原与大夫用的药，述了一遍。只见周瑞家的走来，回了几件没要紧的事。贾琏听到一半，便说道：“你回二奶奶罢，我还有事呢。”说着就走了。周瑞家的回完了这件事，又说道：“我方才到林姑娘那边，看他那个病竟是不好呢。脸上一点血色也没有，摸了摸身上，只剩了一把骨头。问问他，也没有话说，只是淌眼泪。回来紫鹃告诉我说：‘姑娘现在病着，要什么自己又不肯要，我打算要问二奶奶那里支用一两个月的月钱。如今吃药虽…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐儿听了，已明白必是句不好的话了，也不便追问。因说道：“那都没要紧，只是这‘金麒麟’的话从何而来？”周瑞家的笑道：“就是那庙里的老道士送给宝二爷的小金麒麟儿。后来丢了几天，亏了史姑娘捡着，还了他，外头就造出这个谣言来了。奶奶说这些人可笑不可笑？”凤姐道：“这些话倒不是可笑，倒是可怕的。咱们一日难似一日，外面还是这么讲究。俗语儿说的，‘人怕出名猪怕壮’，况且又是个虚名儿，终久还不知怎么样呢。”周瑞家的道：“奶奶虑的也是。只是满城里茶坊酒…","so":0,"eo":0},{"surface":"凤姐","text":"贾赦、贾政送出大门，回来先禀贾母。贾母道：“亲丁四人，自然是我和你们两位太太了。那一个人呢？”众人也不敢答言。贾母想了想，道：“必得是凤姐儿，他诸事有照应。你们爷儿们各自商量去罢。”贾赦、贾政答应了出来，因派了贾琏、贾蓉看家外，凡“文”字辈至“草”字辈一应都去。遂吩咐家人预备四乘绿轿，十余辆翠盖车，明儿黎明伺候。家人答应去了。贾赦、贾政又进去回明贾母：“辰巳时进去，申酉时出来。今日早些歇歇，明日好早些起来，收拾进宫。”贾母道；“我知道，…","so":0,"eo":0},{"surface":"凤姐","text":"次日黎明，各屋子里丫头们将灯火俱已点齐，太太们各梳洗毕，爷们亦各整顿好了。一到卯初，林之孝合赖大进来，至二门口回道：“轿车俱已齐备，在门夕外伺候着呢。”不一时，贾赦、邢夫人也过来了。大家用了早饭，凤姐先扶老太太出来，众人围随，各带使女一人，缓缓前行。又命李贵等二人先骑马去外宫门接应，自己家眷随后。“文”字辈至“草”字辈各自登车骑马，跟着众家人，一齐去了。贾珍贾蓉在家中看家。","so":0,"eo":0},{"surface":"凤姐","text":"且说贾家的车辆轿马在外西垣门口歇下等着。一会儿，有两个内监出来，说道：“贾府省亲的太太奶奶们着令入宫探问。爷们俱着令内宫门外请安，不得入见。”门上人叫：“快进去。”贾府中四乘轿子跟着小内监前行，贾家爷们在轿后步行跟着，令众家人在外等候。走近宫门口，只见几个老公在门上坐着，见他们来了，便站起来说道：“贾府爷们至此。”贾赦、贾政便捱次立定。轿子抬至宫门口，便都出了轿，早有几个小内监引路，贾母等各有丫头扶着步行。走至元妃寝宫，只见奎壁辉煌，琉…","so":0,"eo":0}]},{"chap":84,"ctitle":"第84章 试文字宝玉始提亲 探惊风贾环重结怨","deeds":[{"surface":"凤姐","text":"几句话说得贾政心中甚实不安，连忙陪笑道：“老太太看的人也多了，既说他好，有造化，想来是不错的。只是儿子望他成人的性儿太急了一点，或者竟合古人的话相反，倒是‘莫知其子之美’了。”一句话把贾母也怄笑了，众人也都陪着笑了。贾母因说道：“你这会子也有了几岁年纪，又居着官，自然越历练越老成。”说到这里，回头瞅着邢夫人合王夫人，笑道：“想他那年轻的时候，那一种古怪脾气，比宝玉还加一倍呢。直等娶了媳妇，才略略的懂了些人事儿。如今只抱怨宝玉。这会子，我…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉答应了个“是”，只得拿捏着慢慢的退出。刚过穿廊月洞门影屏，便一溜烟跑到贾母院门口。急得焙茗在后头赶着叫道：“看跌倒了！老爷来了。”宝玉那里听的见？刚进得门来，便听见王夫人、凤姐、探春等笑语之声。丫鬟们见宝玉来了，连忙打起帘子，悄悄告诉道：“姨太太在这里呢。”宝玉赶忙进来给薛姨妈请安，过来才给贾母请了晚安。贾母便问：“你今儿怎么这早晚才散学？”宝玉悉把贾政看文章并命作破题的话述了一遍。贾母笑容满面。宝玉因问众人道：“宝姐姐在那里坐着呢…","so":0,"eo":0},{"surface":"凤姐","text":"这里丫头们刚捧上茶来，只见琥珀走过来向贾母耳朵旁边说了几句，贾母便向凤姐儿道：“你快去罢，瞧瞧巧姐儿去罢。”凤姐听了，还不知何故。大家也怔了。琥珀遂过来向凤姐道：“刚才平儿打发小丫头子来回二奶奶，说：‘巧姐儿身上不大好，请二奶奶忙着些过来才好呢。’”贾母因说道：“你快去罢，姨太太也不是外人。”凤姐连忙答应，在薛姨妈跟前告了辞。又见王夫人说道：“你先过去，我就去。小孩子家魂儿还不全呢，别叫丫头们大惊小怪的。屋里的猫儿狗儿，也叫他们留点神儿…","so":0,"eo":0},{"surface":"凤姐","text":"却说贾政试了宝玉一番，心里却也喜欢，走向外面和那些门客闲谈，说起方才的话来。便有新近到来最善大棋的一个王尔调名作梅的，说道：“据我们看来，宝二爷的学问已是大进了。”贾政道：“那有进益？不过略懂得些罢咧，‘学问’两个字早得很呢。”詹光道：“这是老世翁过谦的话。不但王大兄这般说，就是我们看，宝二爷必定要高发的。”贾政笑道：“这也是诸位过爱的意思。”那王尔调又道：“晚生还有一句话，不揣冒昧，合老世翁商议。”贾政道：“什么事？”王尔调陪笑道：“…","so":0,"eo":0},{"surface":"凤姐","text":"一时吃了饭，都来陪贾母到凤姐房中。凤姐连忙出来，接了进去。贾母便问：“巧姐儿到底怎么样？”凤姐儿道：“只怕是搐风的来头。”贾母道：“这么着还不请人赶着瞧？”凤姐道：“已经请去了。”贾母因同邢、王二夫人进房来看。只见奶子抱着，用桃红绫子小绵被儿裹着，脸皮趣青，眉梢鼻翅微有动意。贾母同邢、王二夫人看了看，便出外间坐下。正说间，只见一个小丫头，回凤姐道：“老爷打发人问姐儿怎么样。”凤姐道：“替我回老爷，就说请大夫去了。一会儿开了方子，就过去回…","so":0,"eo":0},{"surface":"凤姐","text":"说着，人回：“大夫来了。”贾母便坐在外间，邢王二夫人略避。那大夫同贾琏进来，给贾母请了安，方进房中。看了出来，站在地下，躬身回贾母道：“姐儿一半是内热，一半是惊风。须先用一剂发散风痰药，还要用四神散才好，因病势来的不轻。如今的牛黄都是假的，要找真牛黄方用得。”贾母道了乏。那大夫同贾琏出去，开了方子，去了。凤姐道：“人参家里常有，这牛黄倒怕未必有。外头买去，只是要真的才好。”王夫人道：“等我打发人到姨太太那边去找找。他家蟠儿向来和那些西客…","so":0,"eo":0},{"surface":"凤姐","text":"这里煎了药，给巧姐儿灌下去了，只见喀的一声，连药带痰都吐出来，凤姐才略放了一点儿心。只见王夫人那边的小丫头，拿着一点儿的小红纸包儿，说道：“二奶奶，牛黄有了。太太说了，叫二奶奶亲自把分两对准了呢。”凤姐答应着接过来，便叫平儿配齐了真珠、冰片、朱砂，快熬起来。自己用戥子按方秤了，搀在里面，等巧姐儿醒了好给他吃。只见贾环掀帘进来，说：“二姐姐，你们巧姐儿怎么了？妈叫我来瞧瞧他。”凤姐见了他母子便嫌，说：“好些了。你回去说，叫你们姨娘想着。”…","so":0,"eo":0},{"surface":"凤姐","text":"正骂着，只见丫头来找贾环。凤姐道：“你去告诉赵姨娘，说他操心也太苦了！巧姐儿死定了，不用他惦着了。”平儿急忙在那里配药再熬。那丫头摸不着头脑，便悄悄问平儿道：“二奶奶为什么生气？”平儿将环哥弄倒药铞子说了一遍。丫头道：“怪不得他不敢回来，躲了别处去了。这环哥儿明日还不知怎么样呢。平姐姐我替你收拾罢。”平儿说：“这倒不消。幸亏牛黄还有一点，如今配好了，你去罢。”丫头道：“我一准回去告诉赵姨奶奶，也省了他天天说嘴。”丫头回去，果然告诉了赵姨…","so":0,"eo":0}]},{"chap":85,"ctitle":"第85章 贾存周报升郎中任 薛文起复惹放流刑","deeds":[{"surface":"凤姐","text":"话说赵姨娘正在屋里抱怨贾环，只听贾环在外间屋里发话道：“我不过弄倒了药铞子，洒了一点子药，那丫头又没就死了，值的他也骂我你也骂我，赖我心坏，把我往死里遭塌？等着我明儿还要那小丫头子的命呢！看你们怎么着？只叫他们提防着就是了。”那赵姨娘赶忙从里间出来，握住他的嘴，说道：“你还只管信口胡，还叫人家先要了你的命呢！”娘儿两个吵了一回。赵姨娘听见凤姐的话，越想越气，也不着人来安慰凤姐一声儿。过了几天，巧姐儿也好了。因此，两边结怨比从前更加一层了…","so":0,"eo":0},{"surface":"凤姐","text":"且说珍、琏、宝玉三人回去，独有宝玉到贾母那边，一面述说北静王待他的光景，并拿出那块玉来。大家看着，笑了一回，贾母因命人：“给他收起去罢，别丢了。”因问：“你那块玉好生带着罢？别闹混了。”宝玉便在项上摘下来，说：“这不是我那一块玉？那里就掉了呢。比起来，两块玉差远着呢，那里混得过？我正要告诉老太太：前儿晚上，我睡的时候，把玉摘下来挂在帐子里，他竟放起光来了，满帐子都是红的。”贾母说道：“又胡说了。帐子的檐是红的，火光照着，自然红是有的。”…","so":0,"eo":0},{"surface":"凤姐","text":"不说贾母处谈论亲事。且说宝玉回到自己房中，告诉袭人道：“老太太和凤姐姐方才说话，含含糊糊，不知是什么意思？”袭人想了想，笑了一笑道：“这个我也猜不着。但只刚才说这些话时，林姑娘在跟前没有？”宝玉道：“林姑娘才病起来，这些时何曾到老太太那边去呢？”正说着，只听外间屋里麝月与秋纹拌嘴。袭人道：“你两个又闹什么？”麝月道：“我们两个斗牌，他赢了我的钱，他拿了去；他输了钱，就不肯拿出来。这也罢了，他倒把我的钱都抢了去了。”宝玉笑道：“几个钱什么…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉笑着进了房门。只见黛玉挨着贾母左边坐着呢，右边是湘云。地下邢王二夫人，探春、惜春、李纨、凤姐、李纹、李绮、邢岫烟一干姐妹，都在屋里，只不见宝钗、宝琴、迎春三人。宝玉此时喜的无话可说，忙给贾母道了喜，又给邢王二夫人道喜。一一见了众姐妹，便向黛玉笑道：“妹妹身体可大好了？”黛玉也微笑道：“大好了。听见说二哥哥身上也欠安，好了么？”宝玉道：“可不是！我那日夜里，忽然心里疼起来，这几天刚好些就上学去了，也没能过去看妹妹。”黛玉不等他说完，早…","so":0,"eo":0},{"surface":"凤姐","text":"这里贾母因问凤姐：“谁说送戏的话？”凤姐道：“说是二舅舅那边说：后儿日子好，送一班新出的小戏儿给老太太、老爷、太太贺喜。”因又笑着说道：“不但日子好，还是好日子呢！后日还是……”却瞅着黛玉笑。黛玉也微笑。王夫人因道：“可是呢，后日还是外甥女儿的好生日呢。”贾母想了一想，也笑道：“可见我如今老了，什么事都糊涂了。亏了有我这凤丫头，是我个‘给事中’。既这么着，很好。他舅舅家给他们贺喜，你舅舅家就给你做生日，岂不好呢？”说的大家都笑起来，说道…","so":0,"eo":0},{"surface":"凤姐","text":"如此两日，已是庆贺之期。这日一早，王子胜和亲戚家已送过一班戏来，就在贾母正厅前搭起行台。外头爷都穿着公服陪侍。亲戚来贺的，约有十余桌酒。里面为着是新戏，又见贾母高兴，便将琉璃戏屏隔在后厦，里面也摆下酒席。上首薛姨妈一桌，是王夫人宝琴陪着；对面老太太一桌，是邢夫人岫烟陪着。下面尚空两桌，贾母叫他们快来。一回儿，只见凤姐领着众丫头，都簇拥着黛玉来了。那黛玉略换了儿件新鲜衣服，打扮得宛如嫦娥下界，含羞带笑的，出来见了众人。湘云、李纹、李琦都让…","so":0,"eo":0}]},{"chap":86,"ctitle":"第86章 受私贿老官翻案牍 寄闲情淑女解琴书","deeds":[{"surface":"凤姐","text":"薛姨妈便问来人。因说道：“县里早知我们的家当充足。须得在京里谋干得大情，再送一分大礼，还可以复审，从轻定案。太太此时必得快办，再迟了就怕大爷要受苦了。”薛姨妈听了，叫小厮自去，即刻又到贾府与王夫人说明原委，恳求贾政。贾政只肯托人与知县说情，不肯提及银物。薛姨妈恐不中用，求凤姐与贾琏说了，花上几千银子，才把知县买通。","so":0,"eo":0}]},{"chap":88,"ctitle":"第88章 博庭欢宝玉赞孤儿 正家法贾珍鞭悍仆","deeds":[{"surface":"凤姐","text":"到了次日，贾珍过来料理诸事。门上小厮陆续回了几件事。又一个小厮回道：“庄头送果子来了。”贾珍道：“单子呢？”那小厮连忙呈上。贾珍看时，上面写着不过是时鲜果品，还夹带菜蔬野味若干在内。贾珍看完，问：“向来经管的是谁？”门上的回道：“是周瑞。”便叫周瑞：“照账点清，送往里头交代。等我把来账抄下一个底子，留着好对。”又叫：“告诉厨房，把下菜中添几宗，给送果子的来人，照常赏饭给钱。”周瑞答应了，一面叫人搬至凤姐儿院子里去，又把庄上的账和果子交代…","so":0,"eo":0},{"surface":"凤姐","text":"却说贾政自从在工部掌印，家人中尽有发财的。那贾芸听见了，也要插手弄一点事儿，便在外头说了几个工头，讲了成数，便买了些时新绣货，要走凤姐儿的门子。","so":0,"eo":0},{"surface":"凤姐","text":"凤姐正在屋里，听见丫头们说：“大爷、二爷都生了气，在外头打人呢。”凤姐听了，不知何故。正要叫人去问问，只见贾琏已进来了，把外面的事告诉了一遍。凤姐道：“事情虽不要紧，但这风俗儿断不可长。此刻还算咱们家里正旺的时候儿，他们就敢打架，以后小辈儿们当了家，他们越发难制伏了。前年我在东府里亲眼见过焦大吃的烂醉，躺在台阶子底下骂人，不管上上下下，一混汤子的混骂。他虽是有过功的人，到底主子奴才的名分，也要存点体统儿才好。珍大奶奶不是我说，是个老实头…","so":0,"eo":0},{"surface":"凤姐","text":"小红进来回道：“芸二爷在外头要见奶奶。”凤姐一想：“他又来做什么？”便道：“叫他进来罢。”小红出来，瞅着贾芸微微一笑。贾芸赶忙凑近一步，问道：“姑娘替我回了没有？”小红红了脸，说道：“我就是见二爷的事多！”贾芸道：“何曾有多少事能到里头来劳动姑娘呢？就是那一年姑娘在宝二叔房里，我才和姑娘……”小红怕人撞见，不等说完，连忙问道：“那年我换给二爷的一块绢子，二爷见了没有？”那贾芸听了这句话，喜的心花俱开，才要说话，只见一个小丫头从里面出来，…","so":0,"eo":0},{"surface":"凤姐","text":"贾芸笑了一笑，跟着他走进房来，见了凤姐儿，请了安，并说：“母亲叫问好。”凤姐也问了他母亲好。凤姐道：“你来有什么事？”贾芸道：“侄儿从前承婶娘疼爱，心上时刻想着，总过意不去。欲要孝敬婶娘。又怕婶娘多想。如今重阳时候，略备了一点儿东西。婶娘这里那一件没有呢？不过是侄儿一点孝心。只怕婶娘不赏脸。”凤姐儿笑道：“有话坐下说。”贾芸才侧身坐了，连忙将东西捧着搁在旁边桌上。凤姐又道：“你不是什么有馀的人，何苦又去花钱？我又不等着使。你今儿来意，是…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，只见奶妈子一大起带了巧姐儿进来。那巧姐儿身上穿得锦团花簇，手里拿着好些玩意儿，笑嘻嘻走到凤姐身边学舌。贾芸一见，便站起来，笑盈盈的赶着说道：“这就是大妹妹么？你要什么好东西不要？”那巧姐儿便“哑”的一声哭了。贾芸连忙退下。凤姐道：“乖乖不怕。”连忙将巧姐揽在怀里，道：“这是你芸大哥哥，怎么认起生来了？”贾芸道：“妹妹生得好相貌，将来又是个有大造化的。”巧姐儿回头把贾芸一瞧，又哭起来，叠连几次。贾芸看这光景坐不住，便起身告辞要走。…","so":0,"eo":0},{"surface":"凤姐","text":"却说凤姐在屋里吩咐预备晚饭，因又问道：“你们熬了粥了没有？”丫鬟们连忙去问，回来回道：“预备了。”凤姐道：“你们把那南边来的糟东西弄一两碟来罢。”秋桐答应了，叫丫头们伺候。平儿走来笑道：“我倒忘了，今儿晌午，奶奶在上头老太太那边的时候，水月庵的师父打发人来，要向奶奶讨两瓶南小菜，还要支用几个月的月钱，说是身上不受用。我问那道婆来着：‘师父怎么不受用？’他说：‘四五天了。前儿夜里，因那些小沙弥小道士里头有几个女孩子，睡觉没有吹灯，他说了几…","so":0,"eo":0},{"surface":"凤姐","text":"说着，只听见小丫头从后面喘吁吁的嚷着，直跑到院子里来。外面平儿接着，还有几个丫头们，咕咕唧唧的说话。凤姐道：“你们说什么呢？”平儿道：“小丫头子有些胆怯，说鬼话。”凤姐说：“那一个？”小丫头进来。问道：“什么鬼话？”那丫头道：“我刚才到后边去叫打杂儿的添煤，只听得三间空屋子里哗喇哗喇的响，我还道是猫儿耗子又听得嗳的一声，象个人出气儿的似的。我害怕，就跑回来了。”凤姐骂道：“胡说，我这里断不兴说神说鬼。我从来不信这些个话，快滚出去罢！”那…","so":0,"eo":0}]},{"chap":89,"ctitle":"第89章 人亡物在公子填词 蛇影杯弓颦卿绝粒","deeds":[{"surface":"凤姐","text":"却说凤姐正自起来纳闷，忽听见小丫头这话，又唬了一跳，连忙又问：“什么官事？”小丫头道：“也不知道。刚才二门上小厮回进来，回老爷有要紧的官事，所以太太叫我请二爷来了。”凤姐听了工部里的事，才把心略略的放下。因说道：“你回去回太太，就说二爷昨日晚上出城有事没有回来，打发人先回珍大爷去罢。”那丫头答应着去了。一时贾珍过来见了部里的人，问明了。进来见了王夫人回道：“部中来报，昨日总河奏到，河南一带决了河口，湮没了几府州县。又要开销国策，修理城工…","so":0,"eo":0}]},{"chap":90,"ctitle":"第90章 失绵衣贫女耐嗷嘈 送果品小郎惊叵测","deeds":[{"surface":"凤姐","text":"原来那黛玉虽则病势沉重，心里却还明白。起先侍书雪雁说话时，他也模糊听见了一半句，却只作不知，也因实无精神答理。及听了雪雁侍书的话，才明白过前头的事情原是议而未成的。又兼侍书说是凤姐说的，老太太的主意，亲上作亲，又是园中住着的，非自己而谁？因此一想，阴极阳生，心神顿觉清爽许多，所以才喝了两口水，又要想问诗书的话。恰好贾母、王夫人、李纨、凤姐听见紫鹃之言都赶着来看。黛玉心中疑团已破，自然不似先前寻死之意了。虽身骨软弱，精神短少，却也勉强答应…","so":0,"eo":0},{"surface":"凤姐","text":"不但紫鹃和雪雁在私下里讲究，就是众人也都知道黛玉的病也病的奇怪，好也好得奇怪，三三两两，唧唧哝哝议论着。不多几时，连凤姐儿也知道了，邢、王二夫人也有些疑惑，倒是贾母略猜着了八九。那时正值邢、王二夫人、凤姐等在贾母房中说闲话，说起黛玉的病来。贾母道：“我正要告诉你们。宝玉和林丫头是从小儿在一处的，我只说小孩子们怕什么。以后时常听得林丫头忽然病，忽然好，都为有了些知觉了。所以我想他们若尽着搁在一块儿，毕竟不成体统。你们怎么说？”王夫人听了，…","so":0,"eo":0},{"surface":"凤姐","text":"从此，凤姐常到园中照料。一日，刚走进大观园，到了紫菱洲畔，只听见一个老婆子在那里嚷。凤姐走到跟前，那婆子才瞧见了，早垂手侍立，口里请了安。凤姐道：“你在这里闹什么？”婆子道：“蒙奶奶们派我在这里看守花果，我也没有差错，不料邢姑娘的丫头说我们是贼。”凤姐道：“为什么呢？”婆子道：“昨儿我们家的黑儿跟着我到这里玩了一回，他不知道，又往邢姑娘那边去瞧了一瞧，我就叫他回去了。今儿早起，听见他们丫头说，丢了东西了。我问他丢了什么，他就问起我来了。…","so":0,"eo":0},{"surface":"凤姐","text":"这里二人让了坐，凤姐笑问道：“你丢了什么东西了？”岫烟笑道：“没有什么要紧的，是一件红小袄儿，已经旧了的。我原叫他们找，找不着就罢了。这小丫头不懂事，问了那婆子一声，那婆子自然不依了。这都是小丫头糊涂不懂事，我也骂了几句。已经过去了，不必再提了。”凤姐把岫烟内外一瞧，看见虽有些皮绵衣裳，已是半新不旧的，未必能暖和。他的被窝多半是薄的。至于房中桌上摆设的东西，就是老太太拿来的，却一些不动，收拾的干干净净。凤姐心上便很爱敬他，说道：“一件衣…","so":0,"eo":0},{"surface":"凤姐","text":"那时岫烟被那老婆子聒噪了一场，虽有凤姐来压住，心上终是不定。想起：“许多姐妹们在这里，没有一个下人敢得罪他的，独自我这里，他们言三语四，刚刚凤姐来碰见。”想来想去，终是没意思，又说不出来。正在吞声饮泣，看见凤姐那边的丰儿送衣裳过来。岫烟一看，决不肯受。丰儿道：“奶奶吩咐我说；‘姑娘要嫌是旧衣裳，将来送新的来。’”岫烟笑谢道：“承奶奶的好意。只是因我丢了衣裳，他就拿来，我断不敢受的。拿回去，千万谢你们奶奶！承你奶奶的情，我算领了。”倒拿个…","so":0,"eo":0},{"surface":"凤姐","text":"平儿和丰儿回去，将到凤姐那边，碰见薛家差来的一个老婆子，接着问好。平儿便问道：“你那里去的？”婆子道：“那边太太、姑娘叫我来请各位太太、奶奶、姑娘们的安。我才刚在奶奶前问起姑娘来，说姑娘到园中去了。可是从邢姑娘那里来么？”平儿道：“你怎么知道？”婆子道：“方才听见说，真真的二奶奶和姑娘们的行事叫人感念。”平儿笑了一笑说：“你回来坐着罢。”婆子道：“我还有事，改日再过来瞧姑娘罢。”说着走了。平儿回来，回覆了凤姐。不在话下。","so":0,"eo":0},{"surface":"凤姐","text":"且说薛姨妈家中被金桂搅得翻江倒海，看见婆子回来，说起岫烟的事，宝钗母女二人不免滴下泪来。宝钗道：“都为哥哥不在家，所以叫邢姑娘多吃几天苦。如今还亏凤姐姐不错。咱们底下也得留心，到底是咱们家里人。”说着，只见薛蝌进来说道：“大哥哥这几年在外头相与的都是些什么人！连一个正经的也没有。来一起子，都是些狐群狗党。我看他们那里是不放心，不过将来探探消息儿罢例。这两天都被我赶出去了。以后吩咐了门上，不许传进这种人来。”薛姨妈道：“又是蒋玉函那些人哪…","so":0,"eo":0}]},{"chap":91,"ctitle":"第91章 纵淫心宝蟾工设计 步疑阵宝玉妄谈禅","deeds":[{"surface":"凤姐","text":"薛姨妈听了，又哭了一场。宝钗和薛蝌一面劝慰，一面说道：“事不宜迟。”薛姨妈没法，只得叫薛蝌到那里去照料，命人即忙收拾行李，兑了银子，同着当铺中一个伙计连夜起程。那时手忙脚乱，虽有下人办理，宝钗怕他们思想不到，亲来帮着收拾，直闹到四更才歇。到底富家女子娇养惯了的，心上又急，又劳苦了一夜，到了次日就发起烧来，汤水都吃不下去。莺儿忙回了薛姨妈。薛姨妈急来看时，只见宝钗满面通红，身如燔灼，话都不说。薛姨妈慌了手脚，便哭得死去活来。宝琴扶着劝解。…","so":0,"eo":0}]},{"chap":92,"ctitle":"第92章 评女传巧姐慕贤良 玩母珠贾政参聚散","deeds":[{"surface":"凤姐","text":"到了次日，果然一早到老太太那里请了安。又到贾政、王大人那里请了安，回明了老太太今儿不叫上学，贾政也没言语，便慢慢退出来。走了几步，便一溜烟跑到贾母房中。见众人都没来，只有凤姐那边的奶妈子，带了巧姐儿，跟着几个小丫头过来，给老太太请了安，说：“我妈妈先叫我来请安，陪着老太太说说话儿。妈妈回来就来。”贾母笑着道：“好孩子，我一早就起来了，等他们总不来。只有你二叔叔来了。”那奶妈子便说：“姑娘，给叔叔请安。”巧姐便请了安。宝玉也问了一声“妞妞…","so":0,"eo":0},{"surface":"凤姐","text":"巧姐道：“我还听见我妈妈说：我们家的小红，头里是二叔叔那里的，我妈妈要了来，还没有补上人呢。我妈妈想着要把什么柳家的五儿补上，不知二叔叔要不要。”宝玉听了更喜欢，笑着道：“你听你妈妈的话！要补谁就补谁罢咧，又问什么要不要呢。”因又向贾母笑道：“我瞧大妞妞这个小模样儿，又有这个聪明儿，只怕将来比凤姐姐还强呢，又比他认的字。”贾母道：“女孩儿家认得字也好，只是女工针黹倒是要紧的。”巧姐儿道：“我也跟着刘妈妈学着做呢。什么扎花吻，拉锁子例，我…","so":0,"eo":0},{"surface":"凤姐","text":"贾母等着那些人，见这时候还不来，又叫丫头去请。回来李纨同着他妹子、探春、惜春、史湘云、黛玉都来了。大家请了贾母的安，众人厮见。独有薛姨妈未到，贾母又叫请去。果然薛姨妈带着宝琴过来。宝玉请了安，问了好，只不见宝钗邢岫烟二人。黛玉便问起：“宝姐姐为何不来？”薛姨妈假说身上不好。邢岫烟知道薛姨妈在坐，所以不来。宝玉虽见宝钗不来，心中纳闷，因黛玉来了，便把想宝钗的心暂且搁开。不多时，邢、王二夫人也来了。凤姐听见婆婆们先到了，自己不好落后，只得打…","so":0,"eo":0},{"surface":"凤姐","text":"且说凤姐因何不来？头里为着倒比邢、王二夫人迟了不好意思，后来旺儿家的来回说：“迎姑娘那里打发人来请奶奶安，还说并没有到上头，只到奶奶这里来。”凤姐听了纳闷，不知又是什么事，便叫那人进来，问：“姑娘在家好？”那人道：“有什么好的。奴才并不是姑娘打发来的，实在是司棋的母亲央我来求奶奶的。”凤姐道：“司棋已经出去了，为什么来求我？”那人道：“自从司棋出去，终日啼哭。忽然那一日，他表兄来了。他母亲见了，恨的什么儿似的，说他害了司棋，一把拉住要打…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐听了，诧异道：“那有这样傻丫头，偏偏的就碰见这个傻小子！怪不得那一天翻出那些东西来，他心里没事人似的，敢只是这么个烈性孩子。论起来我也没这么大工夫管他这些闲事，但只你才说的，叫人听着怪可怜见儿的。也罢了，你回去告诉他，我和你二爷说，打发旺儿给他撕掳就是了。”凤姐打发那人去了，才过贾母这边来，不提。","so":0,"eo":0},{"surface":"凤姐","text":"贾政便着人叫贾琏把这两件东西送到老太太那边去，并叫人请了邢、王二夫人、凤姐儿都来瞧着，又把两件东西一一试过。贾琏道：“他还有两件：一件是围屏，一件是乐钟。共总要卖二万银子呢。”凤姐儿接着道：“东西自然是好的，但是那里有这些闲钱？咱们又不比外任督抚要办贡。我已经想了好些年了，象咱们这种人家，必得置些不动摇的根基才好：或是祭地，或是义庄，再置些坟屋。往后子孙遇见不得意的事，还是点儿底子，不到一败涂地。我的意思是这样，不知老太太、老爷、太太们…","so":0,"eo":0}]},{"chap":93,"ctitle":"第93章 甄家仆投靠贾家门 水月庵掀翻风月案","deeds":[{"surface":"凤姐","text":"却说贾政知道这事，气的衙门也不能上了，独坐在内书房叹气。贾琏也不敢走开。忽见门上的进来禀道：“衙门里今夜该班是张老爷。因张老爷病了，有知会来请老爷补一班。”贾政正等赖大回来要办贾芹，此时又要该班，心里纳闷，也不言语。贾琏走上去说道：“赖大是饭后出去的，水月庵离城二十来里，就赶进城也得二更天。今日又是老爷的帮班，请老爷只管去。赖大来了，叫他押着，也别声张，等明儿老爷回来再发落。倘或芹儿来了，也不用说明，看他明儿见了老爷怎么样说。”贾政听来…","so":0,"eo":0},{"surface":"凤姐","text":"且说那些下人，一人传十，传到里头，先是平儿知道，即忙告诉凤姐。凤姐因那一夜不好，恹恹的总没精神，正是惦记铁槛寺的事情。听见“外头贴了匿名揭帖”的一句话，吓了一跳，忙问：“贴的是什么？”平儿随口答应，不留神，就错说了，道：“没要紧，是馒头庵里的事情。”凤姐本是心虚，听见“馒头庵的事情”，这一唬直唬怔了，一句话没说出来，急火上攻，眼前发晕，咳嗽了一阵便歪倒了，两眼却只是发怔。平儿慌了，说道：“水月庵里，不过是女沙弥女道士的事，奶奶着什么急呢…","so":0,"eo":0}]},{"chap":94,"ctitle":"第94章 宴海棠贾母赏花妖 失宝玉通灵知奇祸","deeds":[{"surface":"凤姐","text":"紫鹃也心里暗笑，出来倒茶。只听园里一叠声乱嚷，不知何故。一面倒茶，一面叫人去打听。回来说道：“怡红院里的海棠本来萎了几棵，也没人去浇灌他。昨日宝玉走去瞧，见枝头上好象有了朵儿似的。人都不信，没有理他。忽然今日开的很好的海棠花，众人诧异，都争着去看，连老太太、太太都哄动了，来瞧花儿呢。所以大奶奶叫人收拾园里的树叶子，这些人在那里传唤。”黛玉也听见了，知道老太太来，便更了衣，叫雪雁去打听：“若是老太太来了，即来告诉我。”雪雁去不多时，便跑来…","so":0,"eo":0},{"surface":"凤姐","text":"贾母听毕，便说：“我不大懂诗，听去倒是兰儿的好，环儿做的不好。都上来吃饭罢。”宝玉看见贾母喜欢，更是兴头，因想起：“晴雯死的那年，海棠死的；今日海棠复荣，我们院内这些人，自然都好，但是晴雯不能象花的死而复生了。”顿觉转喜为悲。忽又想起前日巧姐提凤姐要把五儿补入。“或此花为此而开，也未可知。”却又转悲为喜，依旧说笑。","so":0,"eo":0},{"surface":"凤姐","text":"贾母还坐了半天，然后扶了珍珠回去了，王夫人等跟着过来。只见平儿笑嘻嘻的迎上来，说：“我们奶奶知道老太太在这里赏花，自己不得来，叫奴才来伏侍老太太、太太们。还有两匹红送宝二爷包裹这花，当作贺礼。”袭人过来接了，呈与贾母看。贾母笑道：“偏是凤丫头行出点事儿来，叫人看着又体面，又新鲜，很有趣儿。”袭人笑着向平儿道：“回去替宝二爷给二奶奶道谢：要有喜，大家喜。”贾母听了，笑道：“嗳哟！我还忘了呢。凤丫头虽病着，还是他想的到，送的也巧。”一面说着…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐病中也听见宝玉失玉，知道王夫人过来，料躲不住，便扶了丰儿来到园里。正值王夫人起身要走，凤姐娇怯怯的说：“请太太安。”宝玉等过来问了凤姐好。王夫人因说道：“你也听见了么？这可不是奇事吗？刚才眼错不见就丢了，再找不着。你去想想，打老太太那边的丫头起，至你们平儿，谁的手不稳，谁的心促狭，我要回了老太太，认真的查出来才好。不然，是断了宝玉的命根子了！”凤姐回道：“咱们家人多手杂，自古说的，‘知人知面不知心’，那里保的住谁是好的？但只一吵嚷，…","so":0,"eo":0}]},{"chap":95,"ctitle":"第95章 因讹成实元妃薨逝 以假混真宝玉疯癫","deeds":[{"surface":"凤姐","text":"次日，王夫人等早派人到当铺里去查问，凤姐暗中设法找寻。一连闹了几天、总无下落。还喜贾母、贾政未知。袭人等每日提心吊胆。宝玉也好几天不上学，只是怔怔的，不言不语，没心没绪的。王夫人只知他因失玉而起，也不大着意。那日正在纳闷，忽见贾琏进来请安，嘻嘻的笑道：“今日听得雨村打发人来告诉咱们二老爷，说舅太爷升了内阁大学士，奉旨进京，已定于明年正月二十日宣麻，有三百里的文书去了。想舅太爷昼夜趱行，半个多月就要到了。侄儿特来回太太知道。”王夫人听说，…","so":0,"eo":0},{"surface":"凤姐","text":"朝门内官员有信。不多时，只见太监出来，立传钦天监。贾母便知不好，尚未敢动。稍刻，小太监传谕出来，说：“贾娘娘薨逝。”是年甲寅年十二月十八日立春，元妃薨日，是十二月十九日，已交卯年寅月，存年四十三岁。贾母含悲起身，只得出宫上轿回家。贾政等亦已得信，一路悲戚。到家中，邢夫人、李纨、凤姐、宝玉等出厅，分东西迎着贾母，请了安，并贾政、王夫人请安，大家哭泣不提。","so":0,"eo":0},{"surface":"凤姐","text":"次日早起，凡有品级的，按贵妃丧礼进内请安哭临。贾政又是工部，虽按照仪注办理，未免堂上又要周旋他些，同事又要请教他，所以两头更忙，非比从前太后与周妃的丧事了。但元妃并无所出，惟谥曰贤淑贵妃。此是王家制度，不必多赘。只讲贾府中男女，天天进宫，忙的了不得。幸喜凤姐儿近日身子好些，还得出来照应家事，又要预备王子腾进京，接风贺喜。凤姐胞兄王仁，知道叔叔入了内阁，仍带家眷来京。凤姐心里喜欢，便有些心病，有这娘家的人也便撂开，所以身子倒觉得比先好了些…","so":0,"eo":0},{"surface":"凤姐","text":"宝钗也知失玉。因薛姨妈那日应了宝玉的亲事，回去便告诉了宝钗。薛姨妈还说：“虽是你姨妈说了，我还没有应准，说等你哥哥回来再定。你愿意不愿意？”宝钗反正色的对母亲道：“妈妈这话说错了，女孩儿家的事情是父母作主的，如今我父亲没了，妈妈应该作主的，再不然问哥哥，怎么问我来？”所以薛姨妈更爱惜他，说他虽是从小娇生惯养的，却也生来的贞静，因此在他面前反不提起宝玉了。宝钗自从听此一说，把“宝玉”两字自然更不提起了。如今虽然听见失了玉，心里也甚惊疑，倒…","so":0,"eo":0},{"surface":"凤姐","text":"过了几日，元妃停灵寝庙，贾母等送殡去了几天。岂知宝玉一日呆似一日，也不发烧，也不疼痛，只是吃不象吃，睡不象睡，甚至说话都无头绪。那袭人、麝月等一发慌了，回过凤姐几次。凤姐不时过来。起先道是找不着玉生气，如今看他失魂落魄的样子，只有日日请医调治。煎药吃了好几剂，只有添病的，没有减病的。及至问他那里不舒服，宝玉也不说出来。直至元妃事毕，贾母惦记宝玉，亲自到园看视，王夫人也随过来。袭人等叫宝玉接出去请安。宝玉虽说是病，每日原起来行动，今日叫他…","so":0,"eo":0},{"surface":"凤姐","text":"这会子惊动了合家的人，都等着争看。凤姐见贾琏进来，便劈手夺去，不敢先看，送到贾母手里，贾琏笑道：“你这么一点儿事，还不叫我献功呢。”贾母打开看时，只见那玉比先前昏暗了好些，一面用手擦摸，鸳鸯拿上眼镜儿来，戴着一瞧，说：“奇怪。这块玉倒是的，怎么把头里的宝色都没了呢？”王夫人看了一会子，也认不出，便叫凤姐过来看。凤姐看了道：“象倒象，只是颜色不大对，不如叫宝兄弟自己一看，就知道了。”袭人在旁，也看着未必是那一块，只是盼得的心盛，也不敢说出…","so":0,"eo":0}]},{"chap":96,"ctitle":"第96章 瞒消息凤姐设奇谋 泄机关颦儿迷本性","deeds":[{"surface":"凤姐","text":"到了正月十七日，王夫人正盼王子腾来京，只见凤姐进来回说：“今日二爷在外听得有人传说：我们家大老爷赶着进京，离城只二百多里地，在路上没了！太太听见了没有？”王夫人吃惊道：“我没有听见，老爷昨晚也没有说起。到底在那里听见的？”凤姐道：“说是在枢密张老爷家听见的。”王夫人怔了半天，那眼泪早流下来了，因拭泪说道：“回来再叫琏儿索性打听明白了来告诉我。”凤姐答应去了。","so":0,"eo":0},{"surface":"凤姐","text":"贾政听了，原不愿意，只是贾母做主，不敢违命，勉强陪笑说道：“老太太想得极是，也很妥当。只是要吩咐家下众人，不许吵嚷得里外皆知，这要耽不是的。姨太太那边只怕不肯，若是果真应了，也只好按着老太太的主意办去。”贾母道：“姨太太那里有我呢，你去罢。”贾政答应出来，心中好不自在。因赴任事多，部里领凭，亲友们荐人，种种应酬不绝，竟把宝玉的事听凭贾母交与王夫人凤姐儿了。惟将荣禧堂后身王夫人内屋旁边一大跨所二十余间房屋指与宝玉，余者一概不管。贾母定了主…","so":0,"eo":0},{"surface":"凤姐","text":"说着，仍到贾母跟前。贾母正在那里和凤姐儿商议，见王夫人进来，便问道：“袭人丫头说什么，这么鬼鬼祟祟的？”王夫人趁问，便将宝玉的心事细细回明贾母。贾母听了，半日没言语。王夫人和凤姐也都不再说了。只见贾母叹道：“别的事都好说。林丫头倒没有什么。若宝玉真是这样，这可叫人作了难了。”只见凤姐想了一想，因说道：“难倒不难。只是我想了个主意，不知姑妈肯不肯。”王夫人道：“你有主意，只管说给老太太听，大家娘儿们商量着办罢了。”凤姐道：“依我想，这件事…","so":0,"eo":0},{"surface":"凤姐","text":"正说间，丫头传进话来，说：“琏二爷回来了。”王夫人恐贾母问及，使个眼色与凤姐。凤姐便出来迎着贾琏，努了个嘴儿，同到王夫人屋里等着去了。一会儿，王夫人进来，已见凤姐哭的两眼通红。贾琏请了安，将到十里屯料理王子腾的丧事的话说了一遍，便说：“有恩旨赏了内阁的职衔，谥了文勤公，命本家扶柩回籍，着沿途地方宫员照料。昨日起身，连家眷回南去了。舅太太叫我回来请安问好，说：‘如今想不到不能进京，有多少话不能说。听见我大舅子要进京，若是路上遇见了，便叫他…","so":0,"eo":0}]},{"chap":97,"ctitle":"第97章 林黛玉焚稿断痴情 薛宝钗出闺成大礼","deeds":[{"surface":"凤姐","text":"话说黛玉到潇湘馆门口，紫鹃说了一句话，更动了心，一时吐出血来，几乎晕倒，亏了紫鹃还同着秋纹，两个人搀扶着黛玉到屋里来。那时秋纹去后，紫鹃雪雁守着，见他渐渐苏醒过来，问紫鹃道：“你们守着哭什么？”紫鹃见他说话明白，倒放了心了，因说：“姑娘刚才打老太太那边回来，身上觉着不大好，唬的我们没了主意，所以哭了。”黛玉笑道：“我那里就能够死呢。”这一句话没完，又喘成一处。原来黛玉因今日听得宝玉宝钗的事情，这本是他数年的心病，一时急怒，所以迷惑了本性…","so":0,"eo":0},{"surface":"凤姐","text":"只见黛玉微微睁眼，看见贾母在他旁边，便喘吁吁的说道：“老太太！你白疼了我了。”贾母一闻此言，十分难受，便道：“好孩子，你养着罢！不怕的。”黛玉微微一笑，把眼又闭上了。外面丫头进来回凤姐道：“大夫来了。”于是大家略避。王大夫同着贾琏进来，诊了脉，说道：“尚不妨事。这是郁气伤肝，肝不藏血，所以神气本定。如今要用敛阴止血的药，方可望好。”王大夫说完，同着贾链出去开方取药去了。贾母看黛玉神气不好，便出来告诉凤姐等道：“我看这孩子的病，不是我咒他…","so":0,"eo":0},{"surface":"凤姐","text":"且说次日凤姐吃了早饭过来，便要试试宝玉，走进屋里说道：“宝兄弟大喜！老爷已择了吉日，要给你娶亲了。你喜欢不喜欢？”宝玉听了，只管瞅着凤姐笑，微微的点点头儿。凤姐笑道：“给你娶林妹妹过来，好不好？”宝玉却大笑起来。凤姐看着，也断不透他是明白，是糊涂，因又问道：“老爷说：你好了就给你娶林妹妹呢。若还是这么傻，就不给你娶了。”宝玉忽然正色道：“我不傻，你才傻呢。”说着，便站起来说：“我去瞧瞧林妹妹，叫他放心。”凤姐忙扶住了，说：“林妹妹早知道…","so":0,"eo":0},{"surface":"凤姐","text":"说着，王夫人也来。大家到了薛姨妈那里，只说：“惦记着这边的事，来瞧瞧。”薛姨妈感激不尽，说些薛蟠的话。喝了茶，薛姨妈要叫人告诉宝钗，凤姐连忙拦住，说：“姑妈不必告诉宝妹妹。”又向薛姨妈陪笑说道：“老太太此来，一则为瞧姑妈，二则也有句要紧的话，特请姑妈到那边商议。”薛姨妈听了，点点头儿说：“是了。”于是大家又说些闲话，便回来了。当晚薛姨妈果然过来，见过了贾母，到王夫人屋里来，不免说起王子腾来，大家落了一回泪。薛姨妈便问道：“刚才我到老太太…","so":0,"eo":0},{"surface":"凤姐","text":"次日，贾琏过来见了薛姨妈，请了安，便说：“明日就是上好的日子。今日过来回姨太太，就是明日过礼罢。只求姨太太不要挑饬就是了。”说着，捧过通书来。薛姨妈也谦逊了几句，点头应允。贾琏赶着回去，回明贾政。贾政便道：“你回老太太说：既不叫亲友们知道，诸事宁可简便些。若是东西上，请老太太瞧了就是了，不必告诉我。”贾琏答应，进内将话回明贾母。这里王夫人叫了凤姐命人将过礼的物件都送与贾母过目，并叫袭人告诉宝玉。那宝玉又嘻嘻的笑道：“这里送到园里，回来园…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉认以为真，心里大乐，精神便觉的好些，只是语言总有些疯傻。那过札的回来，都不提名说姓，因此上下人等虽都知道，只因凤姐吩咐，都不敢走漏凤声。","so":0,"eo":0},{"surface":"凤姐","text":"还未到潇湘馆，只见两个小丫头在门里往外探头探脑的，一眼看见紫鹃，那一个便嚷道：“那不是紫鹃姐姐来了吗！”紫鹃知道不好了，连忙摆手儿不叫嚷。赶忙进来看时，只见黛玉肝火上炎，两颧红赤。紫鹃觉得不妥，叫了黛玉的奶妈王奶奶来，一看，他便大哭起来。这紫鹃因王奶妈有些年纪，可以仗个胆儿，谁知竟是个没主意的人，反倒把紫鹃弄的心里七上八下。忽然想起一个人来，便命小丫头急忙去请。你道是谁？原来紫鹃想起李宫裁是个孀居，今日宝玉结亲，他自然回避；况且园中诸事…","so":0,"eo":0},{"surface":"凤姐","text":"正闹着，外边一个人慌慌张张跑进来，倒把李纨唬了一跳。看时，却是平儿，跑进来看见这样，只是呆磕磕的发怔。李纨道：“你这会子不在那边，做什么来了？”说着，林之孝家的也进来了。平儿道：“奶奶不放心，叫来瞧瞧。即有大奶奶在这里，我们奶奶就只顾那一头儿了。”李纨点点头儿。平儿道：“我也见见林姑娘。”说着，一面往里走，一面早已流下泪来。这里李纨因和林之孝家的道：“你来的正好，快出去瞧瞧去，告诉管事的预备林姑娘的后事。妥当了，叫他来回我，不用到那边去…","so":0,"eo":0}]},{"chap":98,"ctitle":"第98章 苦绛珠魂归离恨天 病神瑛泪洒相思地","deeds":[{"surface":"凤姐","text":"话说宝玉见了贾政，回至房中，更觉头昏脑闷，懒怠动弹，连饭也没吃，便昏沉睡去。仍日日延医诊治，服药不效，索性连人也认不明白了。大家扶着他坐起来，还是象个好人。一连闹了几天。那日恰是回九之期，说是若不过去，薛姨妈脸上过不去；若说去呢，宝玉这般光景，明知是为黛玉而起，欲要告诉明白。又恐气急生变。宝钗是新媳妇，又难劝慰，必是姨妈过来才好。若不回九，姨妈嗔怪。便与王夫人、凤姐商议道：“我看宝玉竟是魂不守舍，起动是不怕的。用两乘小轿，叫人扶着，从园…","so":0,"eo":0},{"surface":"凤姐","text":"一时叫了林之孝家的过来，将黛玉停放毕，派人看守，等明早去回凤姐。凤姐因见贾母、王夫人等忙乱，贾政起身，又为宝玉昏愦更甚，正在着急异常之时，若是又将黛玉的凶信回了，恐贾母、王夫人愁苦交加，急出病来，只得亲自到园。到了潇湘馆内，也不免哭了一场。见了李纨、探春，知道诸事齐备，就说：“很好。只是刚才你们为什么不言语，叫我着急？”探春道：“刚才送老爷，怎么说呢？”凤姐道：“这倒是你们两个可怜他些。这么着，我还得那边去招呼那个冤家呢。但是这件事好累…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐到了宝玉那里，听见大夫说不妨事，贾母、王夫人略觉放心，凤姐便背了宝玉，缓缓的将黛玉的事回明了。贾母、王夫人听得，都唬了一大跳。贾母眼泪交流，说道：“是我弄坏了他了。但只是这个丫头也忒傻气！”说着，便要到园里去哭他一场，又惦记着宝玉，两头难顾。王夫人等含悲共劝贾母：“不必过去，老太太身子要紧。”贾母无奈，只得叫王夫人自去。又说：“你替我告诉他的阴灵，‘并不是我忍心不来送你，只为有个亲疏。你是我的外孙女儿，是亲的了；若与宝玉比起来，可是…","so":0,"eo":0},{"surface":"凤姐","text":"自此，宝钗千回万转，想了一个主意，只不肯造次，所以过了回九，才想出这个法子来。如今果然好些，然后大家说话才不至似前留神。独是宝玉虽然病势一天好似一天，他的痴心总不能解，必要亲去哭地一场。贾母等知他病未除根，不许他胡思乱想，怎奈他郁闷难堪，病多反复，倒是大夫看出心病，索性叫他开散了再用药调理，倒可好得快些。宝玉听说，立刻要往潇湘馆来。贾母等只得叫人抬了竹椅子过来，扶宝玉坐上，贾母王夫人即便先行。到了潇湘馆内，一见黛玉灵柩，贾母已哭得泪干气…","so":0,"eo":0},{"surface":"凤姐","text":"一日，贾母特请薛姨妈过去商量，说：“宝玉的命，都亏姨太太救的。如今想来不妨了。独委屈了你的姑娘。如今宝玉调养百日，身体复旧，又过了娘娘的功服，正好圆房：要求姨太太作主，另择个上好的吉日。”薛姨妈便道：“老太太主意很好，何必问我？宝丫头虽生的粗笨，心里却还是极明白的，他的情性老太太素日是知道的。但愿他们两口儿言和意顺，从此老太太也省好些心，我姐姐也安慰些，我也放了心了。老太太就定个日子。还通知亲戚不用呢？”贾母道：“宝玉和你们姑娘生来第一…","so":0,"eo":0}]},{"chap":99,"ctitle":"第99章 守官箴恶奴同破例 阅邸报老舅自担惊","deeds":[{"surface":"凤姐","text":"话说凤姐见贾母和薛姨妈为黛玉伤心，便说：“有个笑话儿说给老太太和姑妈听。”未从开口，先自笑了。因说道：“太太和姑妈打谅是那里的笑话儿？就是咱们家的新姑爷新媳妇啊。”贾母道：“怎么了？”凤姐拿手比着道：“一个这么坐着，一个这么站着；一个这么扭过去，一个这么转过来，一个又……”说到这里，贾母已经大笑起来，说道：“你好生说罢。倒不是他们两口儿，你倒把人怄的受不得了。”薛姨蚂也笑道：“你往下直说罢，不用比了。”凤姐才说道：“刚才我到宝兄弟屋里，…","so":0,"eo":0}]},{"chap":100,"ctitle":"第100章 破好事香菱结深恨 悲远嫁宝玉感离情","deeds":[{"surface":"凤姐","text":"那贾母又想起探春远行，虽不全备妆奁，其一应动用之物俱该预备，便把凤姐叫来，将老爷的主意告诉了一遍，叫他料理去。凤姐答应。","so":0,"eo":0}]},{"chap":101,"ctitle":"第101章 大观园月夜警幽魂 散花寺神签惊异兆","deeds":[{"surface":"凤姐","text":"却说凤姐回至房中，见贾琏尚未回来，便分派那管办探春行李妆奁事的一干人。那天有黄昏以后，因忽然想起探春来，要瞧瞧他去，便叫丰儿与两个丫头跟着，头里一个丫头打着灯笼。走出门来，见月光已上，照耀如水，凤姐便命：“打灯笼的回去罢。”因而走至茶房窗下，听见里面有人嘁嘁喳喳的，又似哭，又似笑，又似议论什么的。凤姐知道不过是家下婆子们又不知搬什么是非，心内大不受用，便命小红：“进去装做无心的样子，细细打听着，用话套出原委来。”小红答应着去了。","so":0,"eo":0},{"surface":"凤姐","text":"凤姐只带着丰儿来至园门前，门尚未关，只虚虚的掩着。于是主仆二人方推门进去。只见园中月色比外面更觉明朗，满地下重重树影，沓无人声，甚是凄凉寂静。刚欲往秋爽斋这条路来，只听唿唿的一声风过，吹的那树枝上落叶，满园中唰喇喇的作响，枝梢上吱娄娄的发哨，将那些寒鸦宿鸟都惊飞起来。凤姐吃了酒，被风一吹，只觉身上发噤。丰儿后面也把头一缩，说：“好冷！”凤姐也掌不住，便叫丰儿：“快回去把那件银鼠坎肩儿拿来，我在三姑娘那里等着。”丰儿巴不得一声，也要回去穿…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐刚举步走了不远，只觉身后哧哧似有闻嗅之声，不觉头发森然直竖起来。由不得回头一看，只见黑油油一个东西在后面伸着鼻子闻他呢，那两只眼睛恰似灯光一般。凤姐吓的魂不附体，不觉失声的了一声，却是一只大狗。那狗抽头回身，拖着个扫帚尾巴，一气跑上大土山上，方站住了，回身犹向凤姐拱爪儿。凤姐此时肉跳心惊，急急的向秋爽斋来。将已来至门口，方转过山子，只见迎面有一个人影儿一恍。凤姐心中疑惑，还想着必是那一房的丫头，便问：“是谁？”问了两声，并没有人出来…","so":0,"eo":0},{"surface":"凤姐","text":"此时凤姐尚未起来，平儿因说道：“今儿夜里我听着奶奶没睡什么觉，我替奶奶捶着，好生打个盹儿罢。”凤姐也不言语。平儿料着这意思是了，便爬上炕来，坐在身边，轻轻的捶着。那凤姐刚有要睡之意，只听那边大姐儿哭了，凤姐又将眼睁开。平儿连向那边叫道：“李妈，你到底是怎么着？姐儿哭了，你到底拍着他些。你也忒爱睡了。”那边李妈从梦中惊醒，听得平儿如此说，心中没好气，狠命的拍了几下，口里嘟嘟囔囔的骂道：“真真的小短命鬼儿，放着尸不挺，三更半夜嚎你娘的丧！”…","so":0,"eo":0},{"surface":"凤姐","text":"平儿方下炕来，只听外面脚步响。谁知贾琏去迟了，那裘世安已经上朝去了，不遇而回，心中正没好气，进来就问平儿道：“他们还没起来呢么？”平儿回说：“没有呢。”贾琏一路摔帘子进来，冷笑道：“好啊！这会子还都不起来，安心打擂台打撒手儿！”一叠声又要吃茶。平儿忙倒了一碗茶来。原来那些丫头老婆见贾琏出了门，又复睡了，不打量这会子回来，原不曾预备，平儿便把温过的拿了来。贾琏生气，举起碗来，哗啷一声摔了个粉碎。凤姐惊醒，唬了一身冷汗，“嗳哟”一声，睁开眼…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐听了，气的干咽，要和他分证，想了一想，又忍住了，勉强陪笑道：“何苦来生这么大气？大清早起，和我叫喊什么？谁叫你应了人家的事？你既应了，只得耐烦些，少不得替人家办办，也没见这个人自己有为难的事，还有心肠唱戏摆酒的闹。”贾琏道：“你可说么！你明儿倒也问问他。”凤姐诧异道：“问谁！”贾琏道：“问谁？问你哥哥！”凤姐道：“是他吗？”贾琏道：“可不是他，还有谁呢。”凤姐忙问道：“他又有什么事，叫你替他跑？”贾琏道：“你还在坛子里呢。”凤姐道：…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐听了，才知王仁所行如此，但他素性要强护短，听贾琏如此，便道：“凭他怎么样，到底是你的亲大舅儿。再者，这件事，死的大爷、活的二叔都感激你。罢了，没什么说的，我们家的事，少不得我低三儿下四的求你，省了带累别人受气，背地里骂我。”说着，眼泪便下来了，掀开被窝，一面坐起来，一面挽头发，一面披衣裳。贾琏道：“你倒不用这么着，是你哥哥不是人，我并没说你什么。况且我出去了，你身上又不好，我都起来了，他们还睡着，咱们老辈子有这个规矩么？你如今作好好…","so":0,"eo":0},{"surface":"凤姐","text":"那时天已大亮，日影横窗，贾琏也不便再说，站起来出去了。这里凤姐自己起来，正在梳洗，忽见王夫人那边小丫头过来道：“太太说了，叫问二奶奶今日过舅太爷那边去不去？要去，说叫二奶奶同着宝二奶奶一路去呢。”凤姐因方才一段话已经灰心丧意，恨娘家不给争气；又兼昨夜园中受了那一惊，也实在没精神，便说道：“你先回太太去：我还有一两件事没办清，今日不能去，况且他们那又不是什么正经事。宝二奶奶要去，各自去罢。”小丫头答应着回去回复了，不在话下。","so":0,"eo":0}]},{"chap":104,"ctitle":"第104章 醉金刚小鳅生大浪 痴公子馀痛触前情","deeds":[{"surface":"凤姐","text":"不料贾芸自从那日给凤姐送礼不收，不好意思进来，也不常到荣府。那荣府的门上原看着主子的行事，叫谁走动才有些体面，一时来了他便进去通报；若主子不大理了，不论本家亲戚，他一概不回，支回去就完事。那日贾芸到府，说：“给琏二爷请安。”门上的说：“二爷不在家，等回来我们替回罢。”贾芸欲要说“请二奶奶的安”，又恐门上厌烦，只得回家。又被倪家母女催逼着，说：“二爷常说府上不论那个衙门，说一声儿谁敢不依。如今还是府里的一家儿，又不为什么大事，这个情还讨不…","so":0,"eo":0},{"surface":"凤姐","text":"贾政回到自己屋内，王夫人等见过，宝玉贾琏替另拜见。贾政见了宝玉果然比起身之时脸面丰满，倒觉安静，独不知他心里糊涂，所以心甚喜欢，不以降调为念，心想幸亏老太太办理的好。又见宝钗沉厚更胜先时，兰儿文雅俊秀，便喜形于色。独见环儿仍是先前，究不甚钟爱。歇息了半天，忽然想起：“为何今日短了一人？”王夫人知是想着黛玉，前因家书未报，今日又刚到家，正是喜欢，不便直告，只说是病着。岂知宝玉的心里已如刀搅，因父亲到家，只得把持心性伺候。王夫人设筵接风，子…","so":0,"eo":0}]},{"chap":105,"ctitle":"第105章 锦农军查抄宁国府 骢马使弹劾平安州","deeds":[{"surface":"凤姐","text":"且说贾母那边女眷也摆家宴。王夫人正在那边说：“宝玉不到外头，看你老子生气。”凤姐带病哼哼卿卿的说：“我看宝玉也不是怕人，他见前头陪客的人也不少了，所以在这里照应，也是有的。倘或者爷想起里头少个人在那里照应，太太便把宝兄弟献出去，可不是好？”贾母笑道：“凤丫头病到这个分儿，这张嘴还是那么尖巧。”正说到高兴，只听见邢夫人那边的人一直声的嚷迸来说：“老太太，太太！不、不好了！多多少少的穿靴带帽的强、强盗来了！翻箱倒笼的来拿东西！”贾母等听着发…","so":0,"eo":0},{"surface":"凤姐","text":"那时一屋子人拉这个扯那个，正闹得翻天覆地。又听见一叠声嚷说：“叫里头女眷们回避，王爷进来了。”宝钗、宝玉等正在没法，只见地下这些丫头婆子乱拉乱扯的时候，贾琏喘吁吁的跑进来说：“好了，好了，幸亏王爷救了我们了！”众人正要问他，贾琏见凤姐死在地下，哭着乱叫；又见老太太吓坏了，也回不过气来，更是着急。还亏了平儿将凤姐叫醒，令人抚着。老太太也苏醒了，又哭的气短神昏，躺在炕上，李纨再三宽慰。然后贾琏定神，将两王恩典说明，惟恐贾母邢夫人知道贾赦被拿…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏在旁窃听，不见报他的东西，心里正在疑惑。只闻二王问道：“所抄家资，内有借券，实系盘剥，究是谁行的？政老据实才好。”贾政听了，跪在地下磕头，说：“实在犯官不理家务，这些事全不知道，问犯官侄儿贾琏才知。”贾琏连忙走上，跪下禀说：“这一箱文书既在奴才屋里抄出来的，敢说不知道么？只求王爷开恩。奴才叔叔并不知道的。”两王道：“你父已经获罪，只可并案办理。你今认了，也是正理。如此，叫人将贾琏看守，馀俱散收宅内。政老，你须小心候旨，我们进内复旨去…","so":0,"eo":0},{"surface":"凤姐","text":"正在着急听候内信，只见薛蝌气嘘嘘的跑进来说：“好容易进来了！姨父在那里呢？”贾政道：“来的好，外头怎么放进来的？”薛蝌道：“我再三央及，又许他们钱，所以我才能够出入的。”贾政便将抄去之事告诉了他，就烦他打听打听，说：“别的亲友在火头儿上也不便送信，是你就好通信了。”薛蝌道：“这里的事我倒想不到，那边东府的事，我己听见说了。”贾政道：“究竟犯什么事？”薛蝌道：“今儿为我哥哥打听决罪的事，在衙门里听见有两位御史，风闻是珍大哥引诱世家子弟赌博…","so":0,"eo":0}]},{"chap":106,"ctitle":"第106章 王熙凤致祸抱羞惭 贾太君祷天消祸患","deeds":[{"surface":"凤姐","text":"可怜贾琏屋内东西，除将按例放出的文书发给外，其馀虽未尽入官的，早被查抄的人尽行抢去，所存者只有家伙物件。贾琏始则惧罪，后蒙释放，已是大幸，及想起历年积聚的东西并凤姐的体己，不下五七万金，一朝而尽，怎得不疼。且他父亲现禁在锦衣府，凤姐病在垂危，一时悲痛。又见贾政含泪叫他，问道：“我因官事在身，不大理家，故叫你们夫妇总理家事。你父亲所为固难谏劝，那重利盘剥究竟是谁干的？况且非咱们这样人家所为。如今入了官，在银钱呢是不打紧的，这声名出去还了得…","so":0,"eo":0},{"surface":"凤姐","text":"那时天已点灯时候，贾政进去请贾母的安，见贾母略略好些。回到自己房中，埋怨贾琏夫妇不知好歹，如今闹出放账的事情，大家不好，心里很不受用。只是凤姐现在病重，况他所有的什物尽被抄抢，心内自然难受，一时也未便说他，暂且隐忍不言。一夜无话。次早贾政进内谢恩，并到北静王府西平王府两处叩谢，求二位王爷照应他哥哥侄儿。二王应许。贾政又在同寅相好处托情。","so":0,"eo":0},{"surface":"凤姐","text":"且说贾琏打听得父兄之事不大妥，无法可施，只得回到家中。平儿守着凤姐哭泣，秋桐在耳房里抱怨凤姐。贾琏走到旁边，见凤姐奄奄一息，就有多少怨言，一时也说不出来。平儿哭道：“如今已经这样，东西去了不能复来；奶奶这样，还得再请个大夫瞧瞧才好啊。”贾琏啐道：“呸！我的性命还不保，我还管他呢！”凤姐听见，睁眼一瞧，虽不言语，那眼泪直流。看见贾琏出去了，便和平儿道：“你别不达时务了。到了这个田地，你还顾我做什么？我巴不得今儿就死才好。只要你能够眼里有我…","so":0,"eo":0},{"surface":"凤姐","text":"幸贾母不知底细，因近日身子好些，又见贾政无事，宝玉、宝钗在旁，天天不离左右，略觉放心。素来最疼凤姐，便叫鸳鸯：“将我的体己东西拿些给凤丫头，再拿些银钱交给平儿，好好的伏侍好了凤丫头，我再慢慢的分派。”又命王夫人照看邢夫人。此时宁国府第入官，所有财产房地等项并家奴等俱已造册收尽。这里贾母命人将车接了尤氏婆媳过来。可惜赫赫宁府，只剩得他们婆媳两个并佩凤偕鸾二人，连一个下人没有。贾母指出房子一所居住，就在惜春所住的间壁，又派了婆子四人、丫头两…","so":0,"eo":0},{"surface":"凤姐","text":"且说贾母见祖宗世职革去，现在子孙在监质审，邢夫人、尤氏等日夜啼哭，凤姐病在垂危，虽有宝玉、宝钗在侧，只可解劝，不能分忧，所以日夜不宁，思前想后，眼泪不干。一日傍晚，叫宝玉回去，自己扎挣坐起，叫鸳鸯等各处佛堂上香，又命自己院内焚起斗香，用拐拄着，出到院中。琥珀知是老太太拜佛，铺下大红猩毡拜垫。贾母上香跪下，磕了好些头，念了一回佛，含泪祝告天地道：“皇天菩萨在上，我贾门史氏，虔诚祷告，求菩萨慈悲。我贾门数世以来，不敢行凶霸道。我帮夫助子，虽…","so":0,"eo":0}]},{"chap":107,"ctitle":"第107章 散馀资贾母明大义 复世职政老沐天恩","deeds":[{"surface":"凤姐","text":"贾母正自长篇大论的说，只见丰儿慌慌张张的跑来回王夫人道：“今早我们奶奶听见外头的事，哭了一场，如今气都接不上了，平儿叫我来回太太。”丰儿没有说完，贾母听见，便问：“到底怎么样？”王夫人便代回道：“如今说是不大好。”贾母起身道：“嗳！这些冤家，竟要磨死我了。”说着，叫人扶着，要亲自看去，贾政急忙拦信住劝道：“老太太伤了好一会子心，又分派了好些事，这会子该歇歇儿了。就是孙子媳妇有什么事，叫媳妇瞧去就是了，何必老太太亲身过去呢？倘或再伤感起来…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐正在气厥。平儿哭的眼肿腮红，听见贾母带着王夫人等过来，疾忙出来迎接。贾母便问：“这会子怎么样了？”平儿恐惊了贾母，便说：“这会子好些儿。”说着，跟了贾母进来，赶忙先走过去，轻轻的揭开帐子。凤姐开眼瞧着，只见贾母进来，满心惭愧。先前原打量贾母等恼他，不疼他了，是死活由他的，不料贾母亲自来瞧，心里一宽，觉那拥塞的气略松动些，便要扎挣坐起。贾母叫平儿按着：“不用动。你好些么？”凤姐含泪道：“我好些了。只是从小儿过来，老太太、太太怎么样疼我…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉是从来没有经过这大风浪的，心下只知安乐，不知忧患的人，如今碰来碰去，都是哭泣的事，所以他竞比傻子尤甚，见人哭他就哭。凤姐看见众人忧闷，反倒勉强说几句宽慰贾母的话，求着：“请老太太、太太回去，我略好些过来磕头。”说着，将头仰起。贾母叫平儿：“好生服侍。短什么，到我那里要去。”说着，带了王夫人将要回到自己房中，只听见两三处哭声。贾母听着，实在不忍，便叫王夫人散去，叫宝玉：“去见你大爷大哥，送一送就回来。”自己躺在榻上下泪。幸喜鸳鸯等能用…","so":0,"eo":0},{"surface":"凤姐","text":"但是家计萧条，入不敷出。贾政又不能在外应酬。家人们见贾政忠厚，凤姐抱病不能理家，贾琏的亏空一日重似一日，难免典房卖地。府内家人几个有钱的，怕贾琏缠扰，都装穷躲事，甚至告假不来，各自另寻门路。独有一个包勇，虽是新投到此，恰遇荣府坏事，他倒有些真心办事，见那些人欺瞒主子，便时常不忿。奈他是个新来乍到的人，一句话也插不上，他便生气，每日吃了就睡。众人嫌他不肯随和，便在贾政前说他终日贪杯生事，并不当差。贾政道：“随他去罢。原是甄府荐来，不好意思…","so":0,"eo":0}]},{"chap":108,"ctitle":"第108章 强欢笑蘅芜庆生辰 死缠绵潇湘闻鬼哭","deeds":[{"surface":"凤姐","text":"却说贾政先前曾将房产并大观园奏请入官，内廷不收，又无人居住，只好封锁。因园子接连尤氏、惜春住宅，太觉旷阔无人，遂将包勇罚看荒园。此时贾政理家，奉了贾母之命，将人口渐次减少，诸凡省俭，尚且不能支持。幸喜凤姐是贾母心爱的人，王夫人等虽不大喜欢，若说治家办事，尚能出力，所以内事仍交凤姐办理。但近来因被抄以后，诸事运用不来，也是每形拮据。那些房头上下人等原是宽裕惯了的，如今较往日十去其七，怎能周到？不免怨言不绝。凤姐也不敢推辞，在贾母前扶病承欢…","so":0,"eo":0},{"surface":"凤姐","text":"湘云在旁说道：“太太们请都坐下，让我们姐妹们给姐姐拜寿。”宝钗听了，倒呆了一呆，回来一想：“可不是明日是我的生日吗？”便说：“姐妹们过来瞧老太太是该的，若说为我的生日，是断断不敢的。”正推让着，宝玉也来请薛姨妈、李婶娘的安。听见宝钗自己推让，他心里本早打算过宝钗生日，因家中闹得七颠八倒，也不敢在贾母处提起。今儿湘云等众人要拜寿，便喜欢道：“明日才是生日，我正要告诉老太太来。”湘云笑道：“扯臊，老太太还等你告诉？你打量这些人为什么来？是老…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐虽勉强说了几句有兴的话，终不似先前爽利、招人发笑。贾母心里要宝钗喜欢，故意的怄凤姐儿说话。凤姐也知贾母之意，便竭力张罗，说道：“今儿老太太喜欢些了。你看这些人好几时没有聚在一处，今儿齐全。”说着，回过头去，看见婆婆、尤氏不在这里，又缩住了口。贾母为着“齐全”两字，也想邢夫人等，叫人请去。邢夫人、尤氏、惜春等听见老太太叫，不敢不来，心内也十分不愿意、想着家业零败，偏又高兴给宝钗做生日，到底老太太偏心，便来了也是无精打彩的。贾母问起岫烟…","so":0,"eo":0},{"surface":"凤姐","text":"一时摆下果酒。贾母说：“也不送到外头，今日只许咱们娘儿们乐一乐。”宝玉虽然娶过亲的人，因贾母疼爱，仍在里头打混，但不与湘云、宝琴等同席，便在贾母身旁设着一个坐儿，他替宝钗轮流敬酒。贾母道：“如今且坐下，大家喝酒。到挨晚儿再到各处行礼去。若如今行起礼来，大家又闹规矩，把我的兴头打回去，就没趣了。”宝钗便依言坐下。贾母又向众人道：“咱们今儿索性洒脱些，各留一两个人伺候。我叫鸳鸯带了彩云、莺儿、袭人、平儿等在后间去也喝一钟酒。”鸳鸯等说：“我…","so":0,"eo":0},{"surface":"凤姐","text":"骰盆又过到贾母跟前，便掷了两个二，两个三。贾母道：“这要喝酒了。”鸳鸯道：“有名儿的，这是‘江南引雏’。众人都该喝一杯。”凤姐道：“雏是雏，倒飞了好些了。”众人瞅了他一眼，凤姐便不言语。贾母道：“我说什么呢？‘公领孙’罢。”下手是李绮，便说道：“‘闲看儿童捉柳花’。”众人都说好。","so":0,"eo":0},{"surface":"凤姐","text":"宝玉巴不得要说、只是令盆轮不到，正想着，恰好到了跟前，便掷了一个二，两个三，一个么，便说道：“这是什么？”鸳鸯笑道：“这是个‘臭’！先喝一钟再掷罢。”宝玉只得喝了又掷。这一掷掷了两个三，两个四。鸳鸯道：“有了，这叫做‘张敞画眉’。”宝玉知是打趣他。宝钗的脸也飞红了。凤姐不大懂得，还说：“二兄弟快说了，再找下家儿是谁。”宝玉难说，自认：“罚了罢。我也没下家儿。”","so":0,"eo":0},{"surface":"凤姐","text":"袭人知老太太不放心，将宝玉仍送到贾母那边，众人都等着未散。贾母便说：“袭人！我素常因你明白，才把宝玉交给你，怎么今儿带他园里去？他的病才好，倘或撞着什么，又闹起来，那可怎么好？”袭人也不敢分辩，只得低头不语。宝钗看宝玉颜色不好，心里着实的吃惊。倒还是宝玉恐袭人受委屈，说道：“青天白日怕什么？我因为好些时没到园里逛逛，今儿趁着酒兴走走，那里就撞着什么了呢？”凤姐在园里吃过大亏的，听到那里，寒毛直竖，说：“宝兄弟胆子忒大了。”湘云道：“不是…","so":0,"eo":0}]},{"chap":109,"ctitle":"第109章 候芳魂五儿承错爱 还孽债迎女返真元","deeds":[{"surface":"凤姐","text":"袭人也本没有睡，听见他们两个说话，即忙上来倒茶。只见老太太那边打发小丫头来问：“宝二爷昨夜睡的安顿么？若安顿，早早的同二奶奶梳洗了就过去。”袭人道：“你去回老太太，说：‘宝玉昨夜很安顿，回来就过来。’”小丫头去了。宝钗连忙梳洗了，莺儿、袭人等跟着，先到贾母那里行了礼。便到王夫人那边起，至凤姐，都让过了。仍到贾母处，见他母亲也过来了。大家问起：“宝玉晚上好么？”宝钗便说：“回去就睡了，没有什么。”众人放心，又说些闲话。","so":0,"eo":0},{"surface":"凤姐","text":"那知宝玉要睡越睡不着，见他两个人在那里打铺，忽然想起那年袭人不在家时，晴雯、麝月两个人服事，夜间麝月出去，睛雯要唬他，因为没穿衣服着了凉，后来，还是从这个病上死的。想到这里，一心移在晴雯身上去了。忽又想起凤姐说五儿给晴雯“脱了个影儿”，因将想睛雯的心又移在五儿身上。自己假装睡着，偷偷儿的看那五儿，越瞧越象晴雯，不觉呆性复发。听了听里间已无声息，知是睡了；但不知麝月睡了没有，便故意叫了两声，却不答应。五儿听见了宝玉叫人，便问道：“二爷要什…","so":0,"eo":0},{"surface":"凤姐","text":"那五儿自从芳官去后，也无心进来了。后来听说凤姐叫他进来伏侍宝玉，竟比宝玉盼他进来的心还急。不想进来以后，见宝钗、袭人一般尊贵稳重，看着心里实在敬慕；又见宝玉疯疯傻傻，不似先前的丰致；又听见王夫人为女孩子们和宝玉玩笑都撵了，所以把女儿的柔情和素日的痴心，一概搁起。怎奈这位呆爷今晚把他当作晴雯，只管爱惜起来。那五儿早已羞得两颊红潮，又不敢大声说话，只得轻轻的说道：“二爷，漱口啊。”宝玉笑着接了茶在手中，也不知道漱了没有，便笑嘻嘻的问道：“你…","so":0,"eo":0},{"surface":"凤姐","text":"自此，贾母两日不迸饮食，胸口仍是膨闷，觉得头晕目眩，咳嗽。邢、王二夫人、凤姐等请安，见贾母精神尚好，不过叫人告诉贾政，立刻来请了安。贾政出来，即请大夫看脉。不多一时，大夫来诊了脉，说是有年纪的人，停了些饮食、感冒些风寒，略消导发散些就好了。开了方子，贾政看了，知是寻常药品，命人煎好进服。以后贾政早晚进来请安。一连三日，不见稍减。贾政又命贾琏打听好大夫，“快去请来瞧老太太的病。咱们家常请的几个大夫，我瞧着不怎么好，所以叫你去。”贾琏想了一…","so":0,"eo":0},{"surface":"凤姐","text":"且说贾母病时，合宅女眷无日不来请安。一日，众人都在那里，只见看园内腰门的老婆子进来回说：“园里的栊翠庵的妙师父知道老太太病了，特来请安。”众人道：“他不常过来，今儿特来，你们快请进来。”凤姐走到床前回了贾母。岫烟是妙玉的旧日相识，先走出去接他。只见妙玉头带妙常冠，身上穿一件月白素绸袄儿，外罩一件水田青缎镶边长背心，拴着秋香色的丝绦，腰下系一条淡墨画的白绫裙，手执麈尾念珠，跟着一个侍儿，飘飘拽拽的走来。岫烟见了问好，说是：“在园内住的时候…","so":0,"eo":0},{"surface":"凤姐","text":"那知贾母这病日重一日，延医调治不效，以后又添腹泻。贾政着急，知病难医，即命人到衙门告诉，日夜同王夫人亲侍汤药。一日，见贾母略进些饮食，心里稍宽，只见老婆子在门外探头。王夫人叫彩云看去，问问是谁。彩云看了是陪迎春到孙家去的人，便道：“你来做什么？”婆子道：“我来了半日，这里找不着一个姐姐们，我又不敢冒撞，我心里又急。”彩云道：“你急什么？又是姑爷作践姑娘不成么？”婆子道：“姑娘不好了，前儿闹了一场，姑娘哭了一夜，昨日痰堵住了。他们又不请大…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏复回到自己房中，便问平儿：“你奶奶今儿怎么样？”平儿把嘴往里一努，说：“你瞧去。”贾琏进内，见凤姐正要穿衣，一时动不得，暂且靠在炕桌儿上。贾琏道：“你只怕养不住了，老太太的事，今儿明儿就要出来了，你还脱得过么？快叫人将屋里收拾收拾，就该扎挣上去了。若有了事，你我还能回来么？”凤姐道：“咱们这里还有什么收拾的！不过就是这点子东西，还怕什么？你先去罢，看老爷叫你。我换衣裳就来。”贾琏先回到贾母房里，向贾政悄悄的回道：“诸事已交派明白了。…","so":0,"eo":0}]},{"chap":110,"ctitle":"第110章 史太君寿终归地府 王凤姐力诎失人心","deeds":[{"surface":"凤姐","text":"却说贾母坐起说道：“我到你们家已经六十多年了，从年轻的时候到老来，福也享尽了。自你们老爷起，儿子孙子也都算是好的了。就是宝玉呢，我疼了他一场，”说到那里，拿眼满地下瞅着，王夫人便推宝玉走到床前。贾母从被窝里伸出手来拉着宝玉，道：“我的儿，你要争气才好！”宝玉嘴里答应，心里一酸，那眼泪便要流下来，又不敢哭，只得站着。听贾母说道：“我想再见一个重孙子，我就安心了。我的兰儿在那里呢？”李纨也推贾兰上去。贾母放了宝玉，拉着贾兰道：“你母亲是要孝…","so":0,"eo":0},{"surface":"凤姐","text":"贾母又瞧了一瞧宝钗，叹了口气，只见脸上发红。贾政知是回光返照，即忙进上参汤。贾母的牙关已经紧了，合了一回眼，又睁着满屋里瞧了一瞧。王夫人、宝钗上去，轻轻扶着，邢夫人、凤姐等便忙穿衣。地下婆子们已将床安设停当，铺了被褥。听见贾母喉间略一响动，脸变笑容，竟是去了。享年八十三岁。众婆子疾忙停床。","so":0,"eo":0},{"surface":"凤姐","text":"贾赦不在家，贾政为长；宝玉、贾兰是亲孙，年纪又小，都应守灵。贾琏虽也是亲孙，带着贾蓉，尚可分派家人办事。虽请了些男女外亲来照应，内里邢、王二夫人、李纨、凤姐、宝钗等是应灵旁哭泣的；尤氏虽可照应，他自贾珍外出，依住荣府，一向总不上前，且又荣府的事不甚谙练；贾蓉的媳妇更不必说，惜春年小，虽在这里长的，他于家事全不知道。所以内里竟无一人支持，只有凤姐可以照管里头的事，况又贾琏在外作主，里外他二人，倒也相宜。","so":0,"eo":0},{"surface":"凤姐","text":"凤姐先前仗着自己的才干，原打量老太太死了，他大有一番作用。邢、王二夫人等本知他曾办过秦氏的事，必是妥当，于是仍叫凤姐总理里头的事。凤姐本不应辞，自然应了，心想：“这里的事本是我管的，那些家人更是我手下的人。太太和珍大嫂子的人本来难使唤，如今他们都去了。银项虽没有对牌，这种银子却是现成的。外头的事又是我们那个办。虽说我现今身子不好，想来也不致落褒贬，必比宁府里还得办些。”心下已定，且待明日接了三，后日一早分派。便叫周瑞家的传出话去，将花名…","so":0,"eo":0},{"surface":"凤姐","text":"正在思算，只见一个小丫头过来说：“鸳鸯姐姐请奶奶。”凤姐只得过去。只见鸳鸯哭得泪人一般，一把拉着凤姐儿，说道：“二奶奶请坐，我给二奶奶磕个头。虽说服中不行礼，这个头是要磕的。”鸳鸯说着跪下，慌的凤姐赶忙拉住，说道：“这是什么礼？有话好好的说。”鸳鸯跪着，凤姐便拉起来。鸳鸯说道：“老太太的事，一应内外，都是二爷和二奶奶办。这种银子是老太太留下的。老太太这一辈子也没有遭塌过什么银钱，如今临了这件大事，必得求二奶奶体体面面的办一办才好。我方才…","so":0,"eo":0},{"surface":"凤姐","text":"那凤姐出来，想道：“鸳鸯这东西好古怪！不知打了什么主意。论理，老太太身上本该体面些。嗳，且别管他，只按着咱们家先前的样子办去。”于是叫旺儿家的来，把话传出去，请二爷进来。不多时，贾琏进来，说道：“怎么找我？你在里头照应着些就是了。横竖作主是老爷太太们，他说怎么着，我们就怎么着。”凤姐道：“你也说起这个话来了，可不是鸳鸯说的话应验了么？”贾琏道：“什么鸳鸯的话？”凤姐便将鸳鸯请进去的话述了一遍。贾琏道：“他们的话算什么！刚才二老爷叫我去，…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，见来了一个丫头，说：“大太太的话，问二奶奶：今儿第三天了，里头还很乱，供了饭，还叫亲戚们等着吗？叫了半天，上了菜，短了饭：这是什么办事的道理？”凤姐急忙进去吆喝人来伺候，将就着把早饭打发了。偏偏那日人来的多，里头的人都死眉瞪眼的。凤姐只得在那里照料了一会子，又惦记着派人，赶着出来，叫了旺儿家的传齐了家下女人们，一一分派了。众人都答应着不动。凤姐道：“什么时候，还不供饭？”众人道：“传饭是容易的，只要将里头的东西发出来，我们才好照…","so":0,"eo":0},{"surface":"凤姐","text":"鸳鸯见凤姐这样慌张，又不好叫他回来，心想：“他头里作事何等爽利周到，如今怎么掣肘的这个样儿。我看这两三天连一点头脑都没有，不是老太太白疼了他了吗！”那里知邢夫人一听贾政的话，正合着将来家计艰难的心，巴不得留一点子作个收局。况且老太太的事原是长房作主。贾赦虽不在家，贾政又是拘泥的人，有件事便说：“请大太太的主意。”邢夫人素知凤姐手脚大，贾琏的闹鬼，所以死拿住不放松。鸳鸯只道已将这项银两交了出去了，故见凤姐掣肘如此，却疑为不肯用心，便在贾母…","so":0,"eo":0}]},{"chap":111,"ctitle":"第111章 鸳鸯女殉主登太虚 狗彘奴欺天招伙盗","deeds":[{"surface":"凤姐","text":"话说凤姐听了小丫头的话，又气又急又伤心，不觉吐了一口血，便昏晕过去，坐在地下。平儿急来扶住，忙叫了人来搀扶着，慢慢的送到自己房中，将凤姐轻轻的安放在炕上，立刻叫小红斟上一杯开水送到凤姐唇边。凤姐呷了一口，昏迷仍睡。秋桐过来略瞧了一瞧，便走开了，平儿也不叫他。只见丰儿在旁站着，平儿便说：“快去回明二位太太。”于是丰儿将凤姐吐血不能照应的话回了邢、王二夫人。邢夫人打量凤姐推病藏躲，因这时女亲都在内里，也不好说别的，心里却不全信，只说：“叫他…","so":0,"eo":0},{"surface":"凤姐","text":"贾政因他为贾母而死，要了香来，上了三炷，作了个揖，说：“他是殉葬的人，不可作丫头论，你们小一辈的都该行个礼儿。”宝玉听了，喜不自胜，走来恭恭敬敬磕了几个头。贾琏想他素日的好处，也要上来行礼，被邢夫人说道：“有了一个爷们就是了，别折受的他不得超生。”贾琏就不便过来了。宝钗听着这话，好不自在，便说道：“我原不该给他行礼，但只老太太去世，咱们都有未了之事，不敢胡为。他肯替咱们尽孝，咱们也该托托他。好好的替咱们伏侍老太太西去，也少尽一点子心哪。…","so":0,"eo":0},{"surface":"凤姐","text":"且说家中林之孝带领拆了棚，将门窗上好，打扫净了院子，派了巡更的人，到晚打更上夜。只是荣府规例，一交二更，三门掩上，男人就进不去了，里头只有女人们查夜。凤姐虽隔了一夜，渐渐的神气清爽了些，只是那里动得。只有平儿同着惜春各处走了一走，吩咐了上夜的人，也便各自归房。","so":0,"eo":0},{"surface":"凤姐","text":"正在没法，只听园里腰门一声大响，打进门来。见一个梢长大汉，手执木棍，众人唬得藏躲不及。听得那人喊说道：“不要跑了他们一个！你们都跟我来！”这些家人听了这话，越发唬得骨软筋酥，连跑也跑不动了。只见这人站在当地，只管乱喊。家人中有一个眼尖些的看出来了，你道是谁，正是甄家荐来的包勇。这些家人不觉胆壮起来，便颤巍巍的说道：“有一个走了，有的在房上呢。”包勇便向地下一扑，耸身上房，追赶那贼。这些贼人明知贾家无人，先在院内偷看惜春房内，见有个绝色尼…","so":0,"eo":0},{"surface":"凤姐","text":"一时贾芸林之孝都进来了，见是失盗，大家着急。进内查点，老太太的房门大开，将灯一照，锁头拧折。进内一瞧，箱柜已开。便骂那些上夜女人道：“你们都是死人么？贼人进来，你们都不知道么？”那些上夜的人啼哭着说道：“我们几个人轮更上夜，是管二三更的。我们都没有住脚，前后走的。他们是四更五更。我们才下班儿，只听见他们喊起来，并不见一个人。赶着照看，不知什么时候把东西早已丢了。求爷们问管四更五更的。”林之孝道：“你们个个要死！回来再说，咱们先到各处看去…","so":0,"eo":0}]},{"chap":112,"ctitle":"第112章 活冤孽妙姑遭大劫 死雠仇赵妾赴冥曹","deeds":[{"surface":"凤姐","text":"话说凤姐命捆起上夜的女人，送营审问，众女人跪地哀求。林之孝同贾芸道：“你们求也无益。老爷派我们看家，没事是造化。如今有了事，上下都耽不是，谁救得你？若说是周瑞的干儿子，连太太起，里里外外的都不干净。”凤姐喘吁吁的说道：“这都是命里所招，和他们说什么？带了他们去就是了。那丢的东西，你告诉营里去说：‘实在是老太太的东西，问老爷们才知道。等我们报了去，请了老爷们回来，自然开了失单送来。’文官衙门里我们也是这样报。”贾芸、林之孝答应出去。惜春一…","so":0,"eo":0},{"surface":"凤姐","text":"二人正说着，只听见外头院子里有人大嚷的说道：“我说那三姑六婆是再要不得的，我们甄府里从来是一概不许上门的。不想这府里倒不讲究这个。昨儿老太太的殡才出去，那个什么庵里的尼姑死要到咱们这里来。我吆喝着不准他进来，腰门上的老婆子们倒骂我，死央及着叫那姑子进来。那腰门子一会儿开着，一会儿关着，不知做什么。我不放心，没敢睡，听到四更，这里就嚷起来。我来叫门倒不开了。我听见声儿紧了，打开了门，见西边院子里有人站着，我便赶上打死了。我今儿才知道这是四…","so":0,"eo":0},{"surface":"凤姐","text":"到了家中，林之孝请了安，一直跟了进来。贾琏到了老太太上屋里，见了凤姐、惜春在那里，心里又恨，又说不出来，便问林之孝道：“衙门里瞧了没有？”林之孝自知有罪，便跪下回道：“文武衙门都瞧了，来踪去迹也看了，尸也验了。”贾琏吃惊道：“又验什么尸？”林之孝又将包勇打死的伙贼似周瑞的干儿子的话回了贾琏。贾琏道：“叫芸儿！”贾芸进来，也跪着听话。贾琏道：“你见老爷时，怎么没有回周瑞的干儿子做贼被包勇打死的话？”贾芸说道：“上夜的人说象他的，恐怕不真，…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏叫人检点偷剩下的东西，只有些衣服、尺头、钱箱未动，馀者都没有了。贾琏心里更加着急，想着外头的棚杠银、厨房的钱，都没有付给，明儿拿什么还呢？便呆想了一会。只见琥珀等进去，哭了一番，见箱柜开着，所有的东西怎能记忆，便胡乱猜想，虚拟了一张失单，命人即送到文武衙门。贾琏复又派人上夜。凤姐、惜春各自回房。贾琏不敢在家安歇，也不及埋怨凤姐，竟自骑马赶出城外去了。这里凤姐又恐惜春短见，打发丰儿过去安慰。","so":0,"eo":0},{"surface":"凤姐","text":"贾政、邢、王夫人等先后到家，到了上房，哭了一场。林之孝带了家下众人请了安，跪着。贾政喝道：“去罢！明日问你。”凤姐那日发晕了几次，竟不能出接，只有惜春见了，觉得满面羞惭。邢夫人也不理他，王夫人仍是照常，李纨、宝钗拉着手说了几句话。独有尤氏说道：“姑娘，你操心了，倒照应了好几天！”惜春一言不答，只紫涨了脸。宝钗将尤氏一拉，使了个眼色，尤氏等各自归房去了。贾政略略的看了一看，叹了口气，并不言语。到书房席地坐下，叫了贾琏、贾蓉、贾芸吩咐了几句…","so":0,"eo":0}]},{"chap":113,"ctitle":"第113章 忏宿冤凤姐托村妪 释旧憾情婢感痴郎","deeds":[{"surface":"凤姐","text":"且说那人赶回家去禀知贾政，即派人去照例料理，陪着环儿住了三天，一同回来。那人去了，这里一人传十，十人传百，都知道赵姨娘使了毒心害人，被阴司里拷打死了。又说是：“琏二奶奶只怕也好不了，怎么说琏二奶奶告的呢？”这些话传到平儿耳内，甚是着急，看着凤姐的样子，实在是不能好的了。况且贾琏近日并不似先前的恩爱，本来事也多，竟象不与他相干的。平儿在凤姐跟前只管劝慰。又兼着邢、王二夫人回家几日，只打发人来问问，并不亲身来看，凤姐心里更加悲苦。贾琏回来也…","so":0,"eo":0},{"surface":"凤姐","text":"凤姐此时只求速死，心里一想，邪魔悉至。只见尤二姐从房后走来，渐近床前，说：“姐姐，许久的不见了。做妹妹的想念的很，要见不能，如今好容易进来见见姐姐。姐姐的心机也用尽了。咱们的二爷糊涂，也不领姐姐的情，反倒怨姐姐作事过于刻薄，把他的前程去了，叫他如今见不得人。我替姐姐气不平。”凤姐恍惚说道：“我如今也后悔我的心忒窄了。妹妹不念旧恶，还来瞧我。”平儿在旁听见，说道：“姐姐说什么？”凤姐一时苏醒，想起尤二姐已死，必是他来索命。被平儿叫醒，心里…","so":0,"eo":0},{"surface":"凤姐","text":"小丫头子说着，凤姐听见，便叫：“平儿，你来。人家好心来瞧，不可冷淡了他。你去请了刘老老进来，我和他说说话儿。”平儿只得出来请刘老老这里坐。凤姐刚要合眼，又见一个男人一个女人走向炕前，就象要上炕的。凤姐急忙便叫平儿，说：“那里来了一个男人，跑到这里来了！”连叫了两声，只见丰儿小红赶来，说：“奶奶要什么？”凤姐睁眼一瞧，不见有人，心里明白，不肯说出来，便问丰儿：“平儿这东西那里去了？”丰儿道：“不是奶奶叫去请刘老老去了么？”凤姐定了一会神，…","so":0,"eo":0},{"surface":"凤姐","text":"只见平儿同刘老老带了一个小女孩儿进来，说：“我们姑奶奶在那里？”平儿引到炕边。刘老老便说：“请姑奶奶安。”凤姐睁眼一看，不觉一阵伤心说：“老老，你好？怎么这时候才来？你瞧你外孙女儿也长的这么大了。”刘老老看着凤姐骨瘦如柴，神情恍惚，心里也就悲惨起来，说：“我的奶奶，怎么这几个月不见，就病到这个分儿？我糊涂的要死，怎么不早来请姑奶奶的安！”便叫青儿给姑奶奶请安。青儿只是笑。凤姐看了，倒也十分怜爱，便叫小红招呼着。刘老老道；“我们屯乡里的人…","so":0,"eo":0},{"surface":"凤姐","text":"巧姐儿听见他母亲悲哭，便走到炕前，用手拉着凤姐的手，也哭起来。凤姐一面哭着，道：“你见过了老老了没有？”巧姐儿道：“没有。”凤姐道：“你的名字还是他起的呢，就和干妈一样。你给他请个安。”巧姐儿便走到跟前。刘老老忙拉着道：“阿弥陀佛！不要折杀我了。巧姑娘，我一年多不来，你还认得我么？”巧姐儿道：“怎么不认得？那年在园里见的时候，我还小呢。前年你来，我和你要隔年的蝈蝈儿，你也没有给我，必是忘了。”刘老老道：“好姑娘，我是老糊涂了。要说蝈蝈儿…","so":0,"eo":0},{"surface":"凤姐","text":"这里平儿恐刘老老话多搅烦了凤姐，便拉了刘老老说：“你提起太太来，你还没有过去呢。我出去叫人带了你去见见，也不枉来这一趟。”刘老老便要走。凤姐道：“忙什么？你坐下，我问你：近来的日子还过的么？”刘老老千恩万谢的说道：“我们若不仗着姑奶奶……”说着指着青儿说：“他的老子娘都要饿死了。如今虽说是庄家人苦，家里也挣了好几亩地，又打了一眼井，种些菜蔬瓜果，一年卖的钱也不少，尽够他们嚼吃的了。这两年姑奶奶还时常给些衣服布匹，在我们村里算过得的了。阿…","so":0,"eo":0},{"surface":"凤姐","text":"正说着，又听凤姐叫呢。平儿及到床前，凤姐又不言语了。平儿正问丰儿，贾琏进来，向炕上一瞧，也不言语，走到里间，气哼哼的坐下。只有秋桐跟了进去，倒了茶，殷勤一回，不知嘁嘁喳喳的说些什么。回来，贾琏叫平儿来问道：“奶奶不吃药么？”平儿道：“不吃药怎么样呢？”贾琏道：“我知道么？你拿柜子上的钥匙来罢。”平儿见贾琏有气，又不敢问，只得出来凤姐耳边说了一声。凤姐不言语。平儿便将一个匣子搁在贾琏那里就走。","so":0,"eo":0},{"surface":"凤姐","text":"贾琏道：“有鬼叫你吗？你搁着叫谁拿呢？”平儿忍气打开，取了钥匙，开了柜子，便问道：“拿什么？”贾琏道：“咱们有什么吗？”平儿气的哭道：“有话明说，人死了也愿意！”贾琏道：“这还要说么？头里的事是你们闹的；如今老太太的还短了四五千银子，老爷叫我拿公中的地账弄银子，你说有么？外头拉的账不开发，使得么？谁叫我应这个名儿！只好把老太太给我的东西折变去罢了，你不依么？”平儿听了，一句不言语，将柜里东西搬出。只见小红过来，说：“平姐姐快走！姐姐不好…","so":0,"eo":0}]},{"chap":114,"ctitle":"第114章 王熙凤历幻返金陵 甄应嘉蒙恩还玉阙","deeds":[{"surface":"凤姐","text":"却说宝玉、宝钗听说凤姐病的危急，赶忙起来，丫头秉烛伺候。正要出院，只见王夫人那边打发人来说：“琏二奶奶不好了，还没有咽气，二爷、二奶奶且慢些过去罢。琏二奶奶的病有些古怪，从三更天起，到四更时候，没有住嘴，说了好些胡话，要船要轿，只说赶到金陵归入什么册子去。众人不懂，他只是哭哭喊喊。琏二爷没有法儿，只得去糊船轿，还没拿来，琏二奶奶喘着气等着呢。太太叫我们过来说，等琏二奶奶去了，再过去罢。”宝玉道：“这也奇，他到金陵做什么去？”袭人轻轻的说…","so":0,"eo":0},{"surface":"凤姐","text":"宝玉还要讲出不搬去的理，王夫人打发人来说：“琏二奶奶咽了气了，所有的人都过去了，请二爷、二奶奶就过去。”宝玉听了，也掌不住跺脚要哭。宝钗虽也悲戚，恐宝玉伤心，便说：“有在这里哭的，不如到那边哭去。”于是两人一直到凤姐那里，只见好些人围着哭呢。宝钗走到跟前，见凤姐已经停床，便大放悲声。宝玉也拉着贾琏的手，大哭起来，贾琏也重新哭泣。平儿等因见无人劝解，只得含悲上来劝止了。众人都悲哀不止。贾琏此时手足无措，叫人传了赖大来，叫他办理丧事。自己回…","so":0,"eo":0},{"surface":"凤姐","text":"再说凤姐停了十余天，送了殡。贾政守着老太太的孝，总在外书房。那时清客相公，渐渐的都辞去了，只有个程日兴还在那里，时常陪着说话儿，提起：“家运不好，一连人口死了好些，大老爷合珍大爷又在外头。家计一天难似一天，外头东庄地亩也不知道怎么样，总不得了！”那程日兴道：“我在这里好些年，也知道府上的人，那一个不是肥己的？一年一年都往他家里拿，那自然府上是一年不够一年了。又添了大老爷珍大爷那边两处的费用，外头又有些债务。前儿又破了好些财，要想衙门里缉…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏宝玉早已伺候在那里代送，因贾政未叫，不敢擅入。甄应嘉出来，两人上去请安。应嘉一见宝玉，呆了一呆，心想：“这个怎么甚象我家宝玉！只是浑身缟素。”问道：“至亲久阔，爷们都不认得了。”贾政忙指贾琏道：“这是家兄名赦之子琏二侄儿。”又指着宝玉道：“这是第二小犬，名叫宝玉。”应嘉拍手道：“奇！我在家听见说老亲翁有个衔玉生的爱子，名叫宝玉，因与小儿同名，心中甚为罕异。后来想着这个也是常有的事，不在意了。岂知今日一见，不但面貌相同，且举止一般，这…","so":0,"eo":0}]},{"chap":116,"ctitle":"第116章 得通灵幻境悟仙缘 送慈柩故乡全孝道","deeds":[{"surface":"凤姐","text":"正在为难，见凤姐站在一所房檐下招手儿。宝玉看见，喜欢道：“可好了，原来回到自己家里了。怎么一时迷乱如此？”急奔前来说：“姐姐在这里么？我被这些人捉弄到这个分儿，林妹妹又不肯见我，不知是何原故？”说着，走到凤姐站的地方，细看起来，并不是凤姐，原来却是贾蓉的前妻秦氏。宝玉只得立住脚，要问凤姐姐在那里。那秦氏也不答言，竟自往屋里去了。宝玉恍恍惚惚的，又不敢跟进去，只得呆呆的站着，叹道：“我今儿得了什么不是，众人都不理我！”便痛哭起来。见有几个…","so":0,"eo":0}]},{"chap":117,"ctitle":"第117章 阻超凡佳人双护玉 欣聚党恶子独承家","deeds":[{"surface":"凤姐","text":"正闹着，只见丫头来回话；“琏二爷回来了，颜色大变，说请太太回去说话。”王夫人又吃了一惊，说道：“将就些叫他进来罢。小婶子也是旧亲，不用回避了。”贾琏进来见了王夫人，请了安。宝钗迎着，也问了贾琏的安。贾琏回道：“刚才接了我父亲的书信，说是病重的很，叫我就去，迟了恐怕不能见面！”说到那里，眼泪便掉下来了。王夫人道：“书上写的是什么病？”贾琏道：“写的是感冒风寒起的，如今竟成了痨病了。现在危急，专差一个人连日连夜赶来的，说：‘如若再耽搁一两天…","so":0,"eo":0},{"surface":"凤姐","text":"贾琏又说了几句，才出来，叫了众家人来，交代清楚。写了书，收拾了行装，平儿等不免叮咛了好些话。只有巧姐儿惨伤的了不得。贾琏又欲托王仁照应，巧姐到底不愿意，听见外头托了芸、蔷二人，心里更不受用，嘴里却说不出来。只得送了他父亲，谨谨慎慎的随着平儿过日子。丰儿、小红因凤姐去世，告假的告假，告病的告病。平儿意欲接了家中一个姑娘来，一则给巧姐作伴，二则可以带量他。遍想无人。只有喜鸾、四姐儿是贾母旧日钟爱的，偏偏四姐儿新近出了嫁了，喜鸾也有了人家儿，…","so":0,"eo":0},{"surface":"凤姐","text":"众人听了，大笑起来。贾蔷也忍不住的笑，说道：“傻大舅你好！我没有骂你，你为什么骂我？快拿杯来，罚一大杯。”邢大舅喝了，已有醉意。众人又喝了几杯，都醉起来。邢大舅说他姐姐不好，王仁说他妹妹不好，都说的狠狠毒毒的。贾环听了，趁着酒兴，也说凤姐不好，怎样苛刻我们，怎么样踏我们的头。众人道：“大凡做个人，原要厚道些。看凤姑娘仗着老太太这样的利害，如今‘焦了尾巴梢子’了，只剩了一个姐儿，只怕也要现世现报呢。”贾芸想着凤姐待他不好，又想起巧姐儿见他…","so":0,"eo":0}]},{"chap":118,"ctitle":"第118章 记微嫌舅兄欺弱女 惊谜语妻妾谏痴人","deeds":[{"surface":"凤姐","text":"那贾芸听见贾蔷的假话，心里便没想头。连日在外又输了好些银钱，无所抵偿，便和贾环借贷。贾环本是一个钱没有的，虽是赵姨娘有些积蓄，早被他弄光了，那能照应人家？便想起凤姐待他刻薄，趁着贾琏不在家，要摆布巧姐出气，遂把这个当叫贾芸来上，故意的埋怨贾芸道：“你们年纪又大，放着弄银钱的事又不敢办，倒和我没有钱的人商量。”贾芸道：“三叔你这话说的倒好笑。咱们一块儿玩，一块儿闹，那里有有钱的事？”贾环道：“不是前儿有人说是外藩要买个偏房？你们何不和王大…","so":0,"eo":0}]},{"chap":120,"ctitle":"第120章 甄士隐详说太虚情 贾雨村归结红楼梦","deeds":[{"surface":"凤姐","text":"且说贾政扶贾母灵柩，贾蓉送了秦氏、凤姐、鸳鸯的棺木到了金陵，先安了葬。贾蓉自送黛玉的灵，也去安葬。贾政料理坟墓的事。一日，接到家书，一行一行的看到宝玉、贾兰得中，心里自是喜欢；后来看到宝玉走失，复又烦恼。只得赶忙回来。在道儿上又闻得有恩赦的旨意，又接着家书，果然赦罪复职，更是喜欢，便日夜趱行。","so":0,"eo":0}]}],"relations":[{"id":"216b3768-38be-40cc-996a-7a0b99647b49","code":"夫妻","sc":6,"ec":118,"status":"ACTIVE","other":"贾琏","dir":"in"},{"id":"4216a894-c792-47da-a8b8-26cfbb9a3b32","code":"主仆","sc":6,"ec":113,"status":"ACTIVE","other":"平儿","dir":"out"
