so":0,"eo":0},{"surface":"宝玉","text":"贾母因问黛玉念何书。黛玉道：“刚念了《四书》。”黛玉又问姊妹们读何书，贾母道：“读什么书，不过认几个字罢了。”一语未了，只听外面一阵脚步响，丫鬟进来报道：“宝玉来了。”黛玉心想，这个宝玉不知是怎样个惫懒人呢。及至进来一看，却是位青年公子：头上戴着束发嵌宝紫金冠，齐眉勒着二龙戏珠金抹额，一件二色金百蝶穿花大红箭袖，束着五彩丝攒花结长穗宫绦，外罩石青起花八团倭缎排穗褂，登着青缎粉底小朝靴。面若中秋之月，色如春晓之花，鬓若刀裁，眉如墨画，鼻如…","so":0,"eo":0},{"surface":"宝玉","text":"却说贾母见他进来，笑道：“外客没见就脱了衣裳了，还不去见你妹妹呢。”宝玉早已看见了一个袅袅婷婷的女儿，便料定是林姑妈之女，忙来见礼。归了坐细看时，真是与众各别。只见：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看罢，笑道：“这个妹妹我曾见过的。”贾母笑道：“又胡说了，你何曾见过？”","so":0,"eo":0},{"surface":"宝玉","text":"宝玉笑道：“虽没见过，却看着面善，心里倒象是远别重逢的一般。”贾母笑道：“好，好！这么更相和睦了。”","so":0,"eo":0},{"surface":"宝玉","text":"宝玉便走向黛玉身边坐下，又细细打量一番，因问：“妹妹可曾读书？”黛玉道：“不曾读书，只上了一年学，些须认得几个字。”宝玉又道：“妹妹尊名？”黛玉便说了名。宝玉又道：“表字？”黛玉道：“无字。”宝玉笑道：“我送妹妹一字：莫若‘颦颦’二字极妙。”探春便道：“何处出典？”宝玉道：“《古今人物通考》上说：‘西方有石名黛，可代画眉之墨。’况这妹妹眉尖若蹙，取这个字岂不美？”探春笑道：“只怕又是杜撰。”宝玉笑道：“除了《四书》，杜撰的也太多呢。”因…","so":0,"eo":0},{"surface":"宝玉","text":"当下奶娘来问黛玉房舍，贾母便说：“将宝玉挪出来，同我在套间暖阁里，把你林姑娘暂且安置在碧纱厨里。等过了残冬，春天再给他们收拾房屋，另作一番安置罢。”宝玉道：“好祖宗，我就在碧纱厨外的床上很妥当。又何必出来，闹的老祖宗不得安静呢？”贾母想一想说：“也罢了。”每人一个奶娘并一个丫头照管，馀者在外间上夜听唤。一面早有熙凤命人送了一顶藕合色花帐并锦被缎褥之类。黛玉只带了两个人来，一个是自己的奶娘王嬷嬷，一个是十岁的小丫头，名唤雪雁。贾母见雪雁甚…","so":0,"eo":0},{"surface":"宝玉","text":"却说袭人倒有些痴处：伏侍贾母时，心中只有贾母；如今跟了宝玉，心中又只有宝玉了。只因宝玉性情乖僻，每每规谏，见宝玉不听，心中着实忧郁。是晚宝玉李嬷嬷已睡了，他见里面黛玉鹦哥犹未安歇，他自卸了妆，悄悄的进来，笑问：“姑娘怎么还不安歇？”黛玉忙笑让：“姐姐请坐。”袭人在床沿上坐了。鹦哥笑道：“林姑娘在这里伤心，自己淌眼抹泪的，说：‘今儿才来了，就惹出你们哥儿的病来。倘或摔坏了那玉，岂不是因我之过！’所以伤心，我好容易劝好了。”袭人道：“姑娘快…","so":0,"eo":0}]},{"chap":5,"ctitle":"第5章 贾宝玉神游太虚境 警幻仙曲演红楼梦","deeds":[{"surface":"宝玉","text":"第四回中既将薛家母子在荣府中寄居等事略已表明，此回暂可不写了。如今且说林黛玉自在荣府，一来贾母万般怜爱，寝食起居一如宝玉，把那迎春、探春、惜春三个孙女儿倒且靠后了；就是宝玉黛玉二人的亲密友爱，也较别人不同，日则同行同坐，夜则同止同息，真是言和意顺，似漆如胶。不想如今忽然来了一个薛宝钗，年纪虽大不多，然品格端方，容貌美丽，人人都说黛玉不及。那宝钗却又行为豁达，随分从时，不比黛玉孤高自许，目无下尘，故深得下人之心，就是小丫头们亦多和宝钗亲近…","so":0,"eo":0},{"surface":"宝玉","text":"一时宝玉倦怠，欲睡中觉。贾母命人：“好生哄着，歇息一回再来。”贾蓉媳妇秦氏便忙笑道：“我们这里有给宝二叔收拾下的屋子，老祖宗放心，只管交给我就是了。”因向宝玉的奶娘丫鬟等道：“嬷嬷、姐姐们，请宝二叔跟我这里来。”贾母素知秦氏是极妥当的人，因他生得袅娜纤巧，行事又温柔和平，乃重孙媳中第一个得意之人。见他去安置宝玉，自然是放心的了。","so":0,"eo":0},{"surface":"宝玉","text":"当下秦氏引一簇人来至上房内间，宝玉抬头看见是一幅画挂在上面，人物固好，其故事乃是“燃藜图”也，心中便有些不快。又有一副对联，写的是：“世事洞明皆学问，人情练达即文章。”及看了这两句，纵然室宇精美，铺陈华丽，亦断断不肯在这里了，忙说：“快出去，快出去！”秦氏听了笑道：“这里还不好，往那里去呢？要不就往我屋里去罢。”宝玉点头微笑。一个嬷嬷说道：“那里有个叔叔往侄儿媳妇房里睡觉的礼呢？”秦氏笑道：“不怕他恼，他能多大了，就忌讳这些个？上月你没…","so":0,"eo":0},{"surface":"宝玉","text":"说着大家来至秦氏卧房。刚至房中，便有一股细细的甜香。宝玉此时便觉眼饧骨软，连说：“好香！”入房向壁上看时，有唐伯虎画的《海棠春睡图》，两边有宋学士秦太虚写的一副对联云：","so":0,"eo":0},{"surface":"宝玉","text":"案上设着武则天当日镜室中设的宝镜，一边摆着赵飞燕立着舞的金盘，盘内盛着安禄山掷过伤了太真乳的木瓜。上面设着寿昌公主于含章殿下卧的宝榻，悬的是同昌公主制的连珠帐。宝玉含笑道：“这里好，这里好！”秦氏笑道：“我这屋子，大约神仙也可以往得了。”说着，亲自展开了西施浣过的纱衾，移了红娘抱过的鸳枕。于是众奶妈伏侍宝玉卧好了，款款散去，只留下袭人、晴雯、麝月、秋纹四个丫鬟为伴。秦氏便叫小丫鬟们好生在檐下看着猫儿打架。","so":0,"eo":0},{"surface":"宝玉","text":"那宝玉才合上眼，便恍恍惚惚的睡去，犹似秦氏在前，悠悠荡荡，跟着秦氏到了一处。但见朱栏玉砌，绿树清溪，真是人迹不逢，飞尘罕到。宝玉在梦中欢喜，想道：“这个地方儿有趣，我若能在这里过一生，强如天天被父母师傅管束呢！”正在胡思乱想，听见山后有人作歌曰：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，是个女孩儿的声气。歌音未息，早见那边走出一个美人来，蹁跹袅娜，与凡人大不相同。有赋为证：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉见是一个仙姑，喜的忙来作揖，笑问道：“神仙姐姐，不知从那里来，如今要往那里去？我也不知这里是何处，望乞携带携带。”那仙姑道：“吾居离恨天之上灌愁海之中，乃放春山遣香洞太虚幻境警幻仙姑是也。司人间之宇风情月债，掌尘世之女怨男痴。因近来风流冤孽缠绵于此，是以前来访察机会，布散相思。今日与尔相逢，亦非偶然。此离吾境不远，别无他物，仅有自采仙茗一盏，亲酿美酒几瓮，素练魔舞歌姬数人，新填《红楼梦》仙曲十二支。可试随我一游否？”宝玉听了，喜跃非…","so":0,"eo":0}]},{"chap":6,"ctitle":"第6章 贾宝玉初试云雨情 刘老老一进荣国府","deeds":[{"surface":"宝玉","text":"却说秦氏因听见宝玉梦中唤他的乳名，心中纳闷，又不好细问。彼时宝玉迷迷惑惑，若有所失，遂起身解怀整衣。袭人过来给他系裤带时，刚伸手至大腿处，只觉冰冷粘湿的一片，吓的忙褪回手来，问：“是怎么了？”宝玉红了脸，把他的手一捻。袭人本是个聪明女子，年纪又比宝玉大两岁，近来也渐省人事。今见宝玉如此光景，心中便觉察了一半，不觉把个粉脸羞的飞红，遂不好再问。仍旧理好衣裳，随至贾母处来，胡乱吃过晚饭，过这边来，趁众奶娘丫鬟不在旁时，另取出一件中衣与宝玉换…","so":0,"eo":0}]},{"chap":7,"ctitle":"第7章 送宫花贾琏戏熙凤 宴宁府宝玉会秦钟","deeds":[{"surface":"宝玉","text":"周瑞家的轻轻掀帘进去，见王夫人正和薛姨妈长篇大套的说些家务人情话。周瑞家的不敢惊动，遂进里间来。只见薛宝钗家常打扮，头上只挽着，伏在几上和丫鬟莺儿正在那里描花样子呢。见他进来，便放下笔，转过身，满面堆笑让：“周姐姐坐。”周瑞家的也忙陪笑问道：“姑娘好？”一面炕沿边坐了，因说：“这有两三天也没见姑娘到那边逛逛去，只怕是你宝兄弟冲撞了你不成？”宝钗笑道：“那里的话。只因我那宗病又发了，所以且静养两天。”周瑞家的道：“正是呢。姑娘到底有什么病…","so":0,"eo":0},{"surface":"宝玉","text":"一时周瑞家的携花至王夫人正房后。原来近日贾母说孙女们太多，一处挤着倒不便，只留宝玉、黛玉二人在这边解闷，却将迎春、探春、惜春三人移到王夫人这边房后三间抱厦内居住，令李纨陪伴照管。如今周瑞家的故顺路先往这里来，只见几个小丫头都在抱厦内默坐，听着呼唤。迎春的丫鬟司棋和探春的丫鬟侍书二人，正掀帘子出来，手里都捧着茶盘茶钟，周瑞家的便知他姐妹在一处坐着，也进入房内。只见迎春、探春二人正在窗下围棋。周瑞家的将花送上，说明原故，二人忙住了棋，都欠身…","so":0,"eo":0},{"surface":"宝玉","text":"谁知此时黛玉不在自己房里，却在宝玉房中，大家解九连环作戏。周瑞家的进来，笑道：“林姑娘，姨太太叫我送花儿来了。”宝玉听说，便说：“什么花儿？拿来我瞧瞧。”一面伸手接过匣子来看时，原来是两枝宫制堆纱新巧的假花。黛玉只就宝玉手中看了一看，便问道：“还是单送我一个人的，还是别的姑娘们都有呢？”周瑞家的道；“各位都有了，这两枝是姑娘的。”黛玉冷笑道：“我就知道么，别人不挑剩下的也不给我呀。”周瑞家的听了，一声儿也不敢言语。宝玉问道：“周姐姐，你…","so":0,"eo":0},{"surface":"宝玉","text":"次日凤姐梳洗了，先回王夫人毕，方来辞贾母。宝玉听了，也要逛去，凤姐只得答应着。立等换了衣裳，姐儿两个坐了车。一时进入宁府，早有贾珍之妻尤氏与贾蓉媳妇秦氏，婆媳两个带着多少侍妾丫鬟等接出仪门。那尤氏一见凤姐，必先嘲笑一阵，一手拉了宝玉，同入上房里坐下。秦氏献了茶。凤姐便说：“你们请我来作什么？拿什么孝敬我？有东西就献上来罢，我还有事呢。”尤氏未及答应，几个媳妇们先笑道：“二奶奶今日不来就罢，既来了，就依不得你老人家了。”正说着，只见贾蓉进…","so":0,"eo":0},{"surface":"宝玉","text":"说着出去一会儿，果然带了个后生来：比宝玉略瘦些，眉清目秀，粉面朱唇，身材俊俏，举止风流，似更在宝玉之上，只是怯怯羞羞有些女儿之态，腼腆含糊的向凤姐请安问好。凤姐喜的先推宝玉笑道：“比下去了！”便探身一把攥了这孩子的手，叫他身旁坐下，慢慢问他年纪读书等事，方知他的学名叫秦钟。早有凤姐跟的丫鬟媳妇们，看见凤姐初见秦钟并未备得表礼来，遂忙过那边去告诉平儿。平儿素知凤姐和秦氏厚密，遂自作主意，拿了一匹尺头，两个“状元及第”的小金锞子，交付来人送…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉、秦钟二人随便起坐说话儿。那宝玉自一见秦钟，心中便如有所失，痴了半日，自己心中又起了个呆想，乃自思道：“天下竟有这等的人物！如今看了，我竟成了泥猪癞狗了。可恨我为什么生在这侯门公府之家？要也生在寒儒薄宦的家里，早得和他交接，也不枉生了一世。我虽比他尊贵，但绫锦纱罗，也不过裹了我这枯株朽木；羊羔美酒，也不过填了我这粪窟泥沟。‘富贵’二字，真真把人荼毒了。”那秦钟见了宝玉，形容出众，举止不凡，更兼金冠绣服，艳婢娇童，“果然怨不得姐姐素日…","so":0,"eo":0},{"surface":"宝玉","text":"一时凤姐尤氏又打发人来问宝玉：“要吃什么，只管要去。”宝玉只答应着，也无心在饮食上，只问秦钟近日家务等事。秦钟因言：“业师于去岁辞馆，家父年纪老了，残疾在身，公务繁冗，因此尚未议及延师，目下不过在家温习旧课而已。再，读书一事，也必须有一二知己为伴，时常大家讨论才能有些进益。”宝玉不待说完，便道：“正是呢！我们家却有个家塾，合族中有不能延师的便可入塾读书，亲戚子弟可以附读。我因上年业师回家去了，也现荒废着。家父之意亦欲暂送我去，且温习着旧…","so":0,"eo":0},{"surface":"宝玉","text":"凤姐也起身告辞，和宝玉携手同行。尤氏等送至大厅前，见灯火辉煌，众小厮都在丹墀侍立。那焦大又恃贾珍不在家，因趁着酒兴，先骂大总管赖二，说他：“不公道，欺软怕硬，有好差使派了别人，这样黑更半夜送人就派我，没良心的忘八羔子，瞎充管家！你也不想想，焦大太爷翘起一只腿，比你的头还高些。二十年头里的焦大太爷眼里有谁？别说你们这一把子的杂种们！”正骂得兴头上，贾蓉送凤姐的车出来。众人喝他不住，贾蓉忍不住便骂了几句，叫人：“捆起来！等明日酒醒了，再问他…","so":0,"eo":0}]},{"chap":8,"ctitle":"第8章 贾宝玉奇缘识金锁 薛宝钗巧合认通灵","deeds":[{"surface":"宝玉","text":"话说宝玉和凤姐回家，见过众人，宝玉便回明贾母要约秦钟上家塾之事，自己也有个伴读的朋友，正好发愤。又着实称赞秦钟人品行事，最是可人怜爱的。凤姐又在一旁帮着说：“改日秦钟还来拜见老祖宗呢。”说的贾母喜欢起来。凤姐又趁势请贾母一同过去看戏。贾母虽年高，却极有兴头。后日，尤氏来请，遂带了王夫人、黛玉、宝玉等过去看戏。至晌午，贾母便回来歇息。王夫人本好清净，见贾母回来，也就回来了。然后凤姐坐了首席，尽欢至晚而罢。","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉送贾母回来，待贾母歇了中觉，还要回去看戏，又恐搅的秦氏等人不便。因想起宝钗近日在家养病，未去看视，意欲去望他。若从上房后角门过去，恐怕遇见别事缠绕，又怕遇见他父亲，更为不妥，宁可绕个远儿。当下众嬷嬷丫鬟伺候他换衣服，见不曾换，仍出二门去了，众嬷嬷丫鬟只得跟随出来。还只当地去那边府中看戏，谁知到了穿堂儿，便向东北边绕过厅后而去。偏顶头遇见了门下清客相公詹光、单聘仁二人走来，一见了宝玉，便都赶上来笑着，一个抱着腰，一个拉着手，道：“…","so":0,"eo":0},{"surface":"宝玉","text":"闲言少述。且说宝玉来至梨香院中，先进薛姨妈屋里来，见薛姨妈打点针黹与丫鬟们呢。宝玉忙请了安，薛姨妈一把拉住，抱入怀中笑说：“这么冷天，我的儿，难为你想着来！快上炕来坐着罢。”命人沏滚滚的茶来。宝玉因问：“哥哥没在家么？”薛姨妈叹道：“他是没笼头的马，天天逛不了，那里肯在家一日呢？”宝玉道：“姐姐可大安了？”薛姨妈道：“可是呢，你前儿又想着打发人来瞧他。他在里间不是，你去瞧。他那里比这里暖和，你那里坐着，我收拾收拾就进来和你说话儿。”","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，忙下炕来到了里间门前，只见吊着半旧的红绸软帘。宝玉掀帘一步进去，先就看见宝钗坐在炕上作针线，头上挽着黑漆油光的儿，蜜合色的棉袄，玫瑰紫二色金银线的坎肩儿，葱黄绫子棉裙，一色儿半新不旧的，看去不见奢华，惟觉雅淡。罕言寡语，人谓装愚；安分随时，自云守拙。宝玉一面看，一面问：“姐姐可大愈了？”宝钗抬头看见宝玉进来，连忙起身含笑答道：“已经大好了，多谢惦记着。”说着，让他在炕沿上坐下，即令莺儿：“倒茶来。”一面又问老太太、姨娘安，又问…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗看毕，又从新翻过正面来细看，一里念道：“莫失莫忘，仙寿恒昌。”念了两遍，乃回头向莺儿笑道：“你不去倒茶，也在这里发呆作什么？”莺儿也嘻嘻的笑道：“我听这两句话，倒象和姑娘项圈上的两句话是一对儿。”宝玉听了，忙笑道：“原来姐姐那项圈上也有字？我也赏鉴赏鉴。”宝钗道：“你别听他的话，没有什么字。”宝玉央及道：“好姐姐，你怎么瞧我的呢！”宝钗被他缠不过，因说道：“也是个人给了两句吉利话儿，錾上了，所以天天带着。不然沉甸甸的，有什么趣儿？”…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看了，也念了两遍，又念自己的两遍，因笑问：“姐姐，这八个字倒和我的是一对儿。”莺儿笑道：“是个癞头和尚送的，他说必须錾在金器上。”宝钗不等他说完，便嗔着：“不去倒茶！”一面又问宝玉从那里来。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉此时与宝钗挨肩坐着，只闻一阵阵的香气，不知何味，遂问：“姐姐熏的是什么香？我竟没闻过这味儿。”宝钗道：“我最怕熏香。好好儿的衣裳，为什么熏他？”宝玉道：“那么着这是什么香呢 ”宝钗想了想，说：“是了，是我早起吃了冷香丸的香气。”宝玉笑道：“什么‘冷香丸’，这么好闻？好姐姐，给我一丸尝尝呢。”宝钗笑道：“又混闹了。一个药也是混吃的？”","so":0,"eo":0},{"surface":"宝玉","text":"一语未了，忽听外面人说：“林姑娘来了。”话犹未完，黛玉已摇摇摆摆的进来，一见宝玉，便笑道：“哎哟！我来的不巧了。”宝玉等忙起身让坐。宝钗笑道：“这是怎么说？”黛玉道：“早知他来，我就不来了。”宝钗道；“这是什么意思？”黛玉道：“什么意思呢：来呢一齐来，不来一个也不来！今儿他来，明儿我来，间错开了来，岂不天天有人来呢，也不至太冷落，也不至太热闹。姐姐有什么不解的呢？”宝玉因见他外面罩着大红羽缎对襟褂子，便问：“下雪了么？”地下老婆们说：“…","so":0,"eo":0}]},{"chap":9,"ctitle":"第9章 训劣子李贵承申饬 嗔顽童茗烟闹书房","deeds":[{"surface":"宝玉","text":"话说秦邦业父子专候贾家人来送上学之信。原来宝玉急于要和秦钟相遇，遂择了后日一定上学，打发人送了信。到了这天，宝玉起来时，袭人早已把书笔文物收拾停妥，坐在床沿上发闷，见宝玉起来，只得伏侍他梳洗。宝玉见他闷闷的，问道：“好姐姐，你怎么又不喜欢了？难道怕我上学去，撂的你们冷清了不成？”袭人笑道：“这是那里的话？念书是很好的事，不然就潦倒一辈子了，终久怎么样呢？但只一件，只是念书的时候儿想着书，不念的时候儿想着家，总别和他们玩闹，碰见老爷不是玩…","so":0,"eo":0},{"surface":"宝玉","text":"这日贾政正在书房中和清客相公们说闲话儿，忽见宝玉进来请安，回说上学去。贾政冷笑道：“你要再提‘上学’两个字，连我也羞死了。依我的话，你竟玩你的去是正经。看仔细站腌了我这个地，靠腌了我这个门！”众清客都起身笑道：“老世翁何必如此。今日世兄一去，二三年就可显身成名的，断不似往年仍作小儿之态了。天也将饭时了，世兄竟快请罢。”说着便有两个年老的携了宝玉出去。贾政因问：“跟宝玉的是谁？”只听见外面答应了一声，早进来三四个大汉，打千儿请安。贾政看时…","so":0,"eo":0},{"surface":"宝玉","text":"此时宝玉独站在院外，屏声静候，等他们出来同走。李贵等一面掸衣裳，一面说道：“哥儿可听见了？先要揭我们的皮呢。人家的奴才跟主子赚些个体面，我们这些奴才白陪着挨打受骂的。从此也可怜见些才好！”宝玉笑道：“好哥哥，你别委屈，我明儿请你。”李贵道：“小祖宗，谁敢望‘请’，只求听一两句话就有了。”","so":0,"eo":0},{"surface":"宝玉","text":"说着又至贾母这边，秦钟早已来了，贾母正和他说话儿呢。于是二人见过，辞了贾母。宝玉忽想起未辞黛玉，又忙至黛玉房中来作辞。彼时黛玉在窗下对镜理妆听宝玉说上学去，因笑道：“好！这一去，可是要‘蟾宫折桂’了！我不能送你了。”宝玉道：“好妹妹，等我下学再吃晚饭。那胭脂膏子也等我来再制。”唠叨了半日，方抽身去了。黛玉忙又叫住，问道：“你怎么不去辞你宝姐姐来呢？”宝玉笑而不答，一径同秦钟上学去了。","so":0,"eo":0},{"surface":"宝玉","text":"原来这义学也离家不远，原系当日始祖所立，恐族中子弟有力不能延师者，即入此中读书。凡族中为官者皆有帮助银两，以为学中膏火之费，举年高有德之人为师塾。如今秦、宝二人来了，一一的都互相拜见过，读起书来。自此后，二人同来同往同起同坐，愈加亲密。兼贾母爱惜，也常留下秦钟一住三五天，和自己重孙一般看待。因见秦钟家中不甚宽裕，又助些衣服等物。不上一两月工夫，秦钟在荣府里便惯熟了。宝玉终是个不能安分守理的人，一味的随心所欲，因此发了脾性，又向秦钟悄说：…","so":0,"eo":0},{"surface":"宝玉","text":"原来这学中虽都是本族子弟与些亲戚家的子侄，俗语说的好：“一龙九种，种种各别。”未免人多了就有龙蛇混杂、下流人物在内。自秦、宝二人来了，都生的花朵儿一般的模样，又见秦钟腼腆温柔，未语先红，怯怯羞羞有女儿之风；宝玉又是天生成惯能作小服低，赔身下气，性情体贴，话语缠绵。因他二人又这般亲厚，也怨不得那起同窗人起了嫌疑之念，背地里你言我语，诟谇谣诼，布满书房内外。","so":0,"eo":0},{"surface":"宝玉","text":"金荣越发得了意，摇头咂嘴的，口内还说许多闲话。玉爱偏又听见，两个人隔坐咕咕唧唧的角起口来。金荣只一口咬定说：“方才明明的撞见他两个在后院里亲嘴摸屁股，两个商议，定了一对儿。”论长道短，那里只顾得志乱说，却不防还有别人。谁知早又触怒了一个人。你道这一个人是谁？原来这人名唤贾蔷，亦系宁府中正派玄孙，父母早亡，从小儿跟着贾珍过活，如今长了十六岁，比贾蓉生得还风流俊俏。他兄弟二人最相亲厚，常共起居，宁府中人多口杂，那些不得志的奴仆，专能造言诽谤…","so":0,"eo":0},{"surface":"宝玉","text":"这茗烟乃是宝玉第一个得用且又年轻不谙事的，今听贾蔷说：“金荣如此欺负秦钟，连你们的爷宝玉都干连在内，不给他个知道，下次越发狂纵。”这茗烟无故就要欺压人的，如今得了这信，又有贾蔷助着，便一头进来找金荣。也不叫“金相公了”了，只说：“姓金的，你什么东西！”贾蔷遂跺一跺靴子，故意整整衣服，看看日影说：“正时候了。”遂先向贾瑞说有事要早走一步。贾瑞不敢止他，只得随他去了。","so":0,"eo":0}]},{"chap":10,"ctitle":"第10章 金寡妇贪利权受辱 张太医论病细穷源","deeds":[{"surface":"宝玉","text":"话说金荣因人多势众，又兼贾瑞勒令赔了不是，给秦钟磕了头，宝玉方才不吵闹了。大家散了学，金荣自己回到家中，越想越气，说：“秦钟不过是贾蓉的小舅子，又不是贾家的子孙，附学读书，也不过和我一样。因他仗着宝玉和他相好，就目中无人。既是这样，就该干些正经事，也没的说；他素日又和宝玉鬼鬼祟祟的，只当人家都是瞎子看不见。今日他又去勾搭人，偏偏撞在我眼里，就是闹出事来，我还怕什么不成？”他母亲胡氏听见他咕咕唧唧的，说：“你又要管什么闲事？好容易我和你姑…","so":0,"eo":0},{"surface":"宝玉","text":"且说他姑妈原给了贾家“玉”字辈的嫡派，名唤贾璜，但其族人那里皆能象宁荣二府的家势？原不用细说。这贾璜夫妻守着些小小的产业，又时常到宁荣二府里去请安，又会奉承凤姐儿并尤氏，所以凤姐儿尤氏也时常资助资助他，方能加此度日。今日正遇天气晴朗，又值家中无事，遂带了一个婆子，坐上车，来家里走走，瞧瞧嫂子和侄儿。说起话儿来，金荣的母亲偏提起昨日贾家学房里的事，从头至尾，一五一十，都和他小姑子说了。这璜大奶奶不听则已，听了怒从心上起，说道：“这秦钟小杂…","so":0,"eo":0},{"surface":"宝玉","text":"到了宁府，进了东角门，下了车，进去见了尤氏，那里还有大气儿？殷殷勤勤叙过了寒温，说了些闲话儿，方问道：“今日怎么没见蓉大奶奶？”尤氏说：“他这些日子不知些日子不知怎么了，经期有两个多月没有来。叫大夫瞧了，又说并不是喜。那两日到下半日就懒怠动了，话也懒怠说，神也发涅。我叫他：‘你且不必拘礼，早晚不必照例上来，你竟养养儿罢。就有亲戚来，还有我呢。别的长辈怪你，等我替你告诉。’连蓉哥儿我都嘱咐了，我说：‘你不许累他，不许招他生气，叫他静静儿的…","so":0,"eo":0}]},{"chap":11,"ctitle":"第11章 庆寿辰宁府排家宴 见熙凤贾瑞起淫心","deeds":[{"surface":"宝玉","text":"这里渐渐的就有人来。先是贾琏、贾蔷来看了各处的座位，并问：“有什么玩意儿没有？”家人答道：“我们爷算计，本来请太爷今日来家，所以并未敢预备玩意儿。前日听见太爷不来了，现叫奴才们找了一班小戏儿并一档子打十番的，都在园子里戏台上预备着呢。”次后邢夫人、王夫人、凤姐儿、宝玉都来了，贾珍并尤氏接了进去。尤氏的母亲已先在这里，大家见过了，彼此让了坐。贾珍、尤氏二人递了茶，因笑道：“老太太原是个老祖宗，我父亲又是侄儿，这样年纪，这个日子，原不敢请他…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，贾蓉进来，给邢夫人、王夫人、凤姐儿都请了安，方回尤氏道：“方才我给太爷送吃食去，并说我父亲在家伺候老爷们，款待一家子爷们，遵太爷话，并不敢来。太爷听了很喜欢，说：‘这才是。’叫告诉父亲母亲，好生伺候太爷太太们。叫我好生伺候叔叔婶子并哥哥们。还说：‘那《阴骘文》叫他们急急刻出来，印一万张散人。’我将这话都回了我父亲了。我这会子还得快出去打发太爷们并合家爷们吃饭。”凤姐儿说：“蓉哥儿，你且站着。你媳妇今日到底是怎么着？”贾蓉皱皱眉儿…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉也要跟着凤姐儿去瞧秦氏。王夫人道：“你看看就过来罢，那是侄儿媳妇呢。”于是尤氏请了王夫人、邢夫人并他母亲，都过会芳园去了，凤姐儿宝玉方和贾蓉到秦氏这边来。进了房门，悄悄的走到里间房内，秦氏见了要站起来。凤姐儿说：“快别起来，看头晕。”于是凤姐儿紧行了两步，拉住了秦氏的手，说道：“我的奶奶！怎么几日不见，就瘦的这样了！”于是就坐在秦氏坐的褥子上。宝玉也问了好，在对面椅子上坐了。贾蓉叫：“快倒茶来，婶子和二叔在上房还未吃茶呢。”","so":0,"eo":0},{"surface":"宝玉","text":"宝玉正把眼瞅着那《海棠春睡图》并那秦太虚写的“嫩寒锁梦因春冷，芳气袭人是酒香”的对联，不觉想起在这里睡晌觉时梦到“太虚幻境”的事来，正在出神。听得秦氏说了这些话，如万箭攒心，那眼泪不觉流下来了。凤姐儿见了，心中十分难过，但恐病人见了这个样子反添心酸，倒不是来开导他的意思了，因说：“宝玉，你忒婆婆妈妈的了。他病人不过是这样说，那里就到这个田地？况且年纪又不大，略病病儿就好了。”又回向秦氏道：“你别胡思乱想，岂不是自己添病了么？”贾蓉道：“…","so":0,"eo":0},{"surface":"宝玉","text":"于是凤姐儿方移步前来。将转过了一重山坡儿，见两三个婆子慌慌张张的走来，见凤姐儿，笑道：“我们奶奶见二奶奶不来，急的了不得，叫奴才们又来请奶奶来了。”凤姐儿说：“你们奶奶就是这样急脚鬼似的。”凤姐儿慢慢的走着，问：“戏文唱了几出了？”那婆子回道：“唱了八九出了。”说话之间，已到天香楼后门，见宝玉和一群丫头小子们那里玩呢。凤姐儿说：“宝兄弟，别忒淘气了。”一个丫头说道：“太太们都在楼上坐着呢，请奶奶就从这边上去罢。”","so":0,"eo":0},{"surface":"宝玉","text":"于是说说笑笑，点的戏都唱完了，方才撤下酒席，摆上饭来。吃毕，大家才出园子，来到上房，坐下吃了茶，才叫预备车，向尤氏的母亲告了辞。尤氏率同众姬妻并家人媳妇们送出来，贾珍率领众子侄在车旁侍立，都等候着。见了邢、王二夫人，说道：“二位婶于明日还过来逛逛。”王夫人道：“罢了，我们今儿整坐了一日，也乏了，明日也要歇歇。”于是都上车去了。贾瑞犹不住拿眼看着凤姐儿。贾珍进去后，李贵才拉过马来，宝玉骑上，随了王夫人去了。","so":0,"eo":0}]},{"chap":12,"ctitle":"第12章 王熙凤毒设相思局 贾天祥正照风月鉴","deeds":[{"surface":"宝玉","text":"谁知这年冬底，林如海因为身染重疾，写书来特接黛玉回去。贾母听了，未免又加忧闷，只得忙忙的打点黛玉起身。宝玉大不自在，争奈父女之情，也不好拦阻。于是贾母定要贾琏送他去，仍叫带回来。一应土仪盘费，不消絮说，自然要妥帖的。作速择了日期，贾琏同着黛玉辞别了众人，带领仆从，登舟往扬州去了。","so":0,"eo":0}]},{"chap":13,"ctitle":"第13章 秦可卿死封龙禁尉 王熙凤协理宁国府","deeds":[{"surface":"宝玉","text":"凤姐还欲问时，只听二门上传出云板，连叩四下，正是丧音，将凤姐惊醒。人回：“东府蓉大奶奶没了。”凤姐吓了一身冷汗，出了一回神，只得忙穿衣服往王夫人处来。彼时合家皆知，无不纳闷，都有些伤心。那长一辈的想他素日孝顺，平辈的想他素日和睦亲密，下一辈的想他素日慈爱，以及家中仆从老小想他素日怜贫惜贱、爱老慈幼之恩，莫不悲号痛哭。闲言少叙，却说宝玉因近日林黛玉回去，剩得自己落单，也不和人玩耍，每到晚间，便索然睡了。如今从梦中听见说秦氏死了，连忙翻身爬…","so":0,"eo":0},{"surface":"宝玉","text":"一直到了宁国府前，只见府门大开，两边灯火，照如白昼。乱烘烘人来人往，里面哭声摇山振岳。宝玉下了车，忙忙奔至停灵之室，痛哭一番，然后见过尤氏。谁知尤氏正犯了胃气疼的旧症，睡在床上。然后又出来见贾珍。彼时贾代儒、代修、贾敕、贾效、贾敦、贾赦、贾政、贾琮、贾、贾珩、贾、贾琛、贾琼、贾、贾蔷、贾菖、贾菱、贾芸、贾芹、贾蓁、贾萍、贾藻、贾菌、贾芬、贾芳、贾蓝、贾菌、贾芝等都来了。贾珍哭的泪人一般，正和贾代儒等说道：“合家大小，远近亲友，谁不知我这…","so":0,"eo":0},{"surface":"宝玉","text":"只是贾珍虽然心意满足，但里面尤氏又犯了旧疾，不能料理事务，惟恐各诰命来往，亏了礼数，怕人笑话，因此心中不自在。当下正忧虑时，因宝玉在侧，便问道：“事事都算安贴了，大哥哥还愁什么？”贾珍便将里面无人的话告诉了他。宝玉听说：笑道：“这有何难，我荐一个人与你，权理这一个月的事，管保妥当。”贾珍忙问：“是谁？”宝玉见坐间还有许多亲友，不便明言，走向贾珍耳边说了两句。贾珍听了，喜不自胜，笑道：“这果然妥贴。如今就去。”说着拉了宝玉，辞了众人，便往…","so":0,"eo":0},{"surface":"宝玉","text":"可巧这日非正经日期，亲友来的少，里面不过几位近亲堂客，邢夫人、王夫人、凤姐并合族中的内眷陪坐。闻人报：“大爷进来了。”唬的众婆娘“唿”的一声，往后藏之不迭。独凤姐款款站了起来。贾珍此时也有些病症在身，二则过于悲痛，因拄个拐踱了进来。邢夫人等因说道：“你身上不好，又连日多事，该歇歇才是，又进来做什么？”贾珍一面拄拐，扎挣着要蹲身跪下请安道乏，邢夫人等忙叫宝玉搀住，命人拿椅子与他坐。贾珍不肯坐，因勉强陪笑道：“侄儿进来有一件事要求二位婶娘、…","so":0,"eo":0},{"surface":"宝玉","text":"贾珍便命人取了宁国府的对牌来，命宝玉送与凤姐，说道：“妹妹爱怎么就怎么样办，要什么，只管拿这个取去，也不必问我。只求别存心替我省钱，要好看为上；二则也同那府里一样待人才好，不要存心怕人抱怨。只这两件外，我再没不放心的了。”凤姐不敢就接牌，只看着王夫人，王夫人道：“你大哥既这么说，你就照看照看罢了。只是别自作主意，有了事打发人问你哥哥嫂子一声儿要紧。”宝玉早向贾珍手里接过对牌来，强递与凤姐了。贾珍又问：“妹妹还是住在这里，还是天天来呢？若…","so":0,"eo":0}]},{"chap":14,"ctitle":"第14章 林如海灵返苏州郡 贾宝玉路遏北静王","deeds":[{"surface":"宝玉","text":"凤姐方欲说话，只见荣国府的四个执事人进来，都是支取东西领牌的，凤姐问他们要了帖，念过听了，一共四件，因指两件道：“这个开销错了，再算清了来领。”说着将帖子摔下来。那二人扫兴而去。凤姐因见张材家的在旁，便问：“你有什么事？”张材家的忙取帖子回道：“就是方才车轿围子做成，领取裁缝工银若干两。”凤姐听了，收了帖子，命彩明登记，待王兴交过，得了买办的回押相符，然后与张材家的去领。一面又命念那一件，是为宝玉外书房完竣，支领买纸料糊裱祷，凤姐听了，…","so":0,"eo":0},{"surface":"宝玉","text":"如今且说宝玉，因见人众，恐秦钟受委曲，遂同他往凤姐处坐坐。凤姐正吃饭，见他们来了，笑道：“好长腿子，快上来罢。”宝玉道：“我们偏了。”凤姐道：“在这边外头吃的，还是那边吃的？”宝玉道：“同那些浑人吃什么！还是那边跟着老太太吃了来的。”说着，一面归坐。","so":0,"eo":0},{"surface":"宝玉","text":"凤姐饭毕，就有宁府一个媳妇来领牌，为支取香灯，凤姐笑道：“我算着你今儿该来支取，想是忘了。要终久忘了，自然是你包出来，都便宜了我。”那媳妇笑道：“何尝不是忘了，方才想起来，再迟一步也领不成了。”说毕，领牌而去。一时登记交牌。秦钟因笑道：“你们两府里都是这牌，倘别人私造一个，支了银子去．怎么好！”凤姐笑道：“依你说，都没王法了！”宝玉因道：“怎么咱们家没人来牌子支东西？”凤姐道：“他们来领的时候，你还做梦呢。我且问你，你们多早晚才念夜书呢…","so":0,"eo":0},{"surface":"宝玉","text":"正闹着，人来回：“苏州去的昭儿来了。”凤姐急命进来。昭儿打千儿请安，凤姐便问：“回来做什么？”昭儿道：“二爷打发回来的。林姑老爷是九月初三巳时没的。二爷帮了林姑娘同送林姑老爷的灵到苏州，大约赶年底回来。二爷打发奴才来报个信儿请安，讨老太太的示下。还瞧瞧奶奶家里好，叫把大毛衣裳带几件去。”凤姐道：“你见过别人了没有？”昭儿道：“都见过了。”说毕，连忙退出。凤姐向宝玉笑道：“你林妹妹可在咱们家住长了。”宝玉道：“了不得，想来这几日他不知哭的…","so":0,"eo":0},{"surface":"宝玉","text":"一时只见宁府大殡，浩浩荡荡，压地银山一般从北而至。早有宁府开路传事人报与贾珍，贾珍急命前面执事扎住，同贾赦、贾政三人连忙迎上来，以国礼相见。北静王轿内欠身，含笑答礼，仍以世交称呼接待，并不自大。贾珍道：“犬妇之丧，累蒙郡驾下临，荫生辈何以克当。”北静王笑道：“世交至谊，何出此言。”遂回头令长府官主祭代奠。贾赦等一旁还礼，复亲身来谢。北静王十分谦逊。因问贾政道：“那一位是衔玉而诞者？久欲一见为快，今日一定在此，何不请来？”贾政忙退下来，命…","so":0,"eo":0},{"surface":"宝玉","text":"那宝玉素闻北静王的贤德，且才貌俱全，风流跌宕，不为官俗国体所缚，每思相会，只是父亲拘束，不克如愿。今见反来叫他，自是喜欢。一面走，一面瞥见那北静王坐在轿内，好个仪表。","so":0,"eo":0}]},{"chap":15,"ctitle":"第15章 王凤姐弄权铁槛寺 秦鲸卿得趣馒头庵","deeds":[{"surface":"宝玉","text":"话说宝玉，举目见北静王世荣，头上戴着净白簪缨银翅王帽，穿着江牙海水五爪龙白蟒袍，系着碧玉红带，面如美玉，目似明星，真好秀丽人物。宝玉忙抢上来参见，世荣从轿内伸手搀住。见宝玉戴着束发银冠，勒着双龙出海抹额，穿着白蟒箭袖，围着攒珠银带，面若春花，目如点漆。北静王笑道：“名不虚传，果然如‘宝’似‘玉’。”问：“衔的那宝贝在那里？”宝玉见问，连忙从衣内取出，递与北静王细细看了，又念了那上头的字，因问：“果灵验否？”贾政忙道：“虽如此说，只是未曾…","so":0,"eo":0},{"surface":"宝玉","text":"且说宁府送殡，一路热闹非常。刚至城门，又有贾赦、贾政、贾珍诸同寅属下各家祭棚接祭，一一的谢过，然后出城，竟奔铁槛寺大路而来。彼时贾珍带着贾蓉来到诸长辈前让坐轿上马，因而贾赦一辈的各自上了车轿，贾珍一辈的也将要上马。凤姐因惦记着宝玉，怕他在郊外纵性不服家人的话，贾政管不着，惟恐有闪失，因此命小厮来唤他。宝玉只得到他车前。凤姐笑道：“好兄弟，你是个尊贵人，和女孩儿似的人品，别学他们猴在马上。下来，咱们姐儿两个同坐车好不好？”宝玉听说，便下了…","so":0,"eo":0},{"surface":"宝玉","text":"不一时，只见那边两骑马直奔凤姐车来，下马扶车回道：“这里有下处，奶奶请歇歇更衣。”凤姐命请邢、王二夫人示下，那二人回说：“太太们说不歇了，叫奶奶自便罢。”凤姐便命歇歇再走。小厮带着轿马岔出人群，往北而来。宝玉忙命人去请秦钟。那时秦钟正骑着马随他父亲的轿，忽见宝玉的小厮跑来请他去打尖。秦钟远看着宝玉所骑的马，搭着鞍笼，随着凤姐的车往北而去，便知宝玉同凤姐一车，自己也带马赶上来，同入一庄门内。","so":0,"eo":0},{"surface":"宝玉","text":"那庄农人家，无多房舍，妇女无处回避。那些村姑野妇见了凤姐、宝玉、秦钟的人品衣服，几疑天人下降。凤姐进入茅屋，先命宝玉等出去玩玩。宝玉会意，因同秦钟带了小厮们各处游玩。凡庄家动用之物，俱不曾见过的，宝玉见了，都以为奇，不知何名何用。小厮中有知道的，一一告诉了名色并其用处。宝玉听了，因点头道：“怪道古人诗上说：‘谁知盘中餐，粒粒皆辛苦。’正为此也。”一面说，一面又到一间房内。见炕上有个纺车儿，越发以为稀奇。小厮们又说：“是纺线织布的。”宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"说笑间，已赶上大殡。早又前面法鼓金铙，幢幢宝盖，铁槛寺中僧众摆列路旁。少时到了寺中，另演佛事，重设香坛。安灵于内殿偏室之中，宝珠安理寝室为伴。外面贾珍款待一应亲友，也有坐住的，也有告辞的，一一谢了乏，从公、侯、伯、子、男，一起一起的散，至未末方散尽了。里面的堂客皆是凤姐接待，先从诰命散起，也到未正上下方散完了。只有几个近亲本族，等做过三日道场方去的。那时邢、王二夫人知凤姐必不能回家，便要带了宝玉同进城去。那宝玉乍到郊外，那里肯回去？只要…","so":0,"eo":0},{"surface":"宝玉","text":"原来这铁槛寺是宁、荣二公当日修造的，现今还有香火地亩，以备京中老了人口，在此停灵。其中阴阳两宅俱是预备妥贴的，好为送灵人口寄居。不想如今后人繁盛，其中贫富不一，或性情参商。有那家道艰难的，便住在这里了，有那有钱有势尚排场的，只说这里不方便，一定另外或村庄或尼庵寻个下处，为事毕宴退之所。即今秦氏之丧，族中诸人，也有在铁槛寺的，也有别寻下处的。凤姐也嫌不方便，因遣人来和馒头庵的姑子静虚说了，腾出几间房来预备。原来这馒头庵和水月寺一势，因他庙…","so":0,"eo":0},{"surface":"宝玉","text":"不言老尼陪着凤姐。且说那秦钟宝玉二人正在殿上玩耍，因见智能儿过来，宝玉笑道：“能儿来了。”秦钟说：“理他作什么？”宝玉笑道：“你别弄鬼儿，那一日在老太太屋里，一个人没有，你搂着他作什么呢？这会子还哄我！”秦钟笑道：“这可是没有的话。”宝玉道：“有没有也不管你，你只叫他倒碗茶来我喝，就撂过手。”秦钟笑道：“这又奇了，你叫他倒去，还怕他不倒？何用我说呢！”宝玉道：“我叫他倒的是无情意的，不及你叫他倒的是有情意的。”秦钟没法，只得说道：“能儿…","so":0,"eo":0},{"surface":"宝玉","text":"谁想秦钟趁黑晚无人，来寻智能儿。刚到后头房里，只见智能儿独在那儿洗茶碗，秦钟便搂着亲嘴。智能儿急的跺脚说：“这是做什么？”就要叫唤。秦钟道：“好妹妹，我要急死了。你今儿再不依我，我就死在这里。”智能儿道：“你要怎么样，除非我出了这牢坑，离了这些人才好呢。”秦钟道：“这也容易，只是‘远水解不得近渴’。”说着一吹了灯，满屋里漆黑，将智能儿抱到炕上。那智能儿百般的扎挣不起来，又不好嚷，不知怎么样就把中衣儿解下来了。这里刚才入港，说时迟，那时快…","so":0,"eo":0}]},{"chap":16,"ctitle":"第16章 贾元春才选凤藻宫 秦鲸卿夭逝黄泉路","deeds":[{"surface":"宝玉","text":"且说秦钟、宝玉二人跟着凤姐自铁槛寺照应一番，坐车进城，到家见过贾母、王夫人等，回到自己房中，一夜无话。至次日，宝玉见收拾了外书房，约定了和秦钟念夜书。偏偏那秦钟秉赋最弱，因在郊外受了些风霜，又与智能儿几次偷期缱绻，未免失于检点，回来时便咳嗽伤风，饮食懒进，大有不胜之态，只在家中调养，不能上学。宝玉便扫了兴，然亦无法，只得候他病痊再议。","so":0,"eo":0},{"surface":"宝玉","text":"宁、荣两处上下内外人等，莫不欢天喜地，独有宝玉置若罔闻。你道什么缘故？原来近日水月庵的智能私逃入城来找秦钟，不意被秦邦业知觉，将智能逐出，将秦钟打了一顿，自己气的老病发了，三五日，便呜呼哀哉了。秦钟本自怯弱，又带病未痊受了笞杖，今见老父气死，悔痛无及，又添了许多病症。因此，宝玉心中怅怅不乐。虽有元春晋封之事，那解得他的愁闷？贾母等如何谢恩，如何回家，亲友如何来庆贺，宁荣两府近日如何热闹，众人如何得意，独他一个皆视有如无，毫不介意。因此众…","so":0,"eo":0},{"surface":"宝玉","text":"且喜贾琏与黛玉回来，先遣人来报信：“明日就可到家了。”宝玉听了，方略有些喜意。细问原由，方知贾雨村也进京引见，皆由王子腾累上荐本，此来候补京缺。与贾琏是同宗弟兄，又与黛玉有师徒之谊，故同路作伴而来。林如海已葬入祖茔了，诸事停妥。贾涟这番进京，若按站走时本该出月到家，因听见元春喜信，遂昼夜兼程而进。路俱各平安。宝玉只问了黛玉好，馀者也就不在意了。","so":0,"eo":0},{"surface":"宝玉","text":"好容易盼到明日午错，果报“琏二爷和林姑娘进府了。”见面时彼此悲喜交集，未免大哭一场，又致庆慰之词。宝玉细看那黛玉时，越发出落的超逸了。黛玉又带了许多书籍来，忙着打扫卧室，安排器具，又将些纸笔等物分送与宝钗、迎春、宝玉等。宝玉又将北静王所赠苓香串珍重取出来转送黛玉。黛玉说：“什么臭男人拿过的，我不要这东西。”遂掷还不取。宝玉只得收回，暂且无话。","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉近因家中有这等大事，贾政不来问他的书，心中自是畅快。无奈秦钟之病日重一日，也着实悬心，不能快乐。这日一早起来，才梳洗了，意欲回了贾母去望候秦钟，忽见茗烟在二门影壁前探头缩脑。宝玉忙出来问他：“做什么？”茗烟道：“秦大爷不中用了！”宝玉听了，吓了一跳，忙问道：“我昨儿才瞧了他，还明明白白的，怎么就不中用了呢？”茗烟道：“我也不知道，刚才是他家的老头子来特告诉我的。”宝玉听毕，忙转身回明贾母。贾母吩咐：“派妥当人跟去，到那里尽一尽同…","so":0,"eo":0},{"surface":"宝玉","text":"此时秦钟已发过两三次昏，易箦多时矣。宝玉一见，便不禁失声的哭起来。李贵忙劝道：“不可，秦哥儿是弱症，怕炕上硌的不受用，所以暂且挪下来松泛些。哥儿这一哭，倒添了他的病了。”宝玉听了，方忍住近前，见秦钟面如白蜡，合目呼吸，展转枕上。宝玉忙叫道：“鲸哥！宝玉来了。”连叫了两三声，秦钟不睬。宝玉又叫道：“宝玉来了。”那秦钟早已魂魄离身，只剩得一口悠悠馀气在胸，见许多鬼判持牌提索来捉他。那秦钟魂魄那里肯就去，又记念着家中无人管理家务，又惦记着智能…","so":0,"eo":0}]},{"chap":17,"ctitle":"第17章 大观园试才题对额 荣国府归省庆元宵","deeds":[{"surface":"宝玉","text":"话说秦钟既死，宝玉痛哭不止，李贵等好容易劝解半日方住，归时还带馀哀。贾母帮了几十两银子，外又另备奠仪，宝玉去吊祭。七日后便送殡掩埋了，别无记述。只有宝玉日日感悼，思念不已，然亦无可如何了。又不知过了几时才罢。","so":0,"eo":0},{"surface":"宝玉","text":"可巧近日宝玉因思念秦钟，忧伤不已，贾母常命人带他到新园子里来玩耍。此时也才进去，忽见贾珍来了，和他笑道：“你还不快出去呢，一会子老爷就来了。”宝玉听了，带着奶娘小厮们，一溜烟跑出园来。方转过弯，顶头看见贾政引着众客来了，躲之不及，只得一旁站住。贾政近来闻得代儒称赞他专能对对，虽不喜读书，却有些歪才，所以此时便命他跟入园中，意欲试他一试。宝玉未知何意，只得随往。","so":0,"eo":0},{"surface":"宝玉","text":"说毕，命贾珍前导，自己扶了宝玉，逶迤走进山口。抬头忽见山上有镜面白石一块，正是迎面留题处。贾政回头笑道：“诸公请看，此处题以何名方妙？”众人听说，也百说该题“叠翠”二字的，也有说该题“锦嶂”的，又有说“赛香炉”的，又有说“小终南”的，种种名色，不止几十个。原来众客心中，早知贾政要试宝玉的才情，故此只将些俗套敷衍。宝玉也知此意。贾政听了，便回头命宝玉拟来。宝玉道：“尝听见古人说：‘编新不如述旧，刻古终胜雕今。’况这里并非主山正景，原无可题…","so":0,"eo":0},{"surface":"宝玉","text":"说着，进入石洞，只见佳木茏葱，奇花烂漫，一带清流，从花木深处泻于石隙之下。再进数步，渐向北边，平坦宽豁，两边飞楼插空，雕甍绣槛，皆隐于山坳树杪之间。俯而视之，但见青溪泻玉，石磴穿云，白石为栏，环抱池沼，石桥三港，兽面衔吐。桥上有亭，贾政与诸人到亭内坐了，问：“诸公以何题此？”诸人都说：“当日欧阳公《醉翁亭记》有云：‘有亭翼然’，就名‘翼然’罢。”贾政笑道：“‘翼然’虽佳，但此亭压水而成，还须偏于水题为称。依我拙裁，欧阳公句：‘泻于两峰之…","so":0,"eo":0},{"surface":"宝玉","text":"于是出亭过池，一山一石，一花一木，莫不着意观览。忽抬头见前面一带粉垣，数楹修舍，有千百竿翠竹遮映。众人都道：“好个所在！”于是大家进入，只见进门便是曲折游廊，阶下石子漫成甬路，上面小小三间房舍，两明一暗，里面都是合着地步打的床几椅案。从里间房里，又有一小门，出去却是后园，有大株梨花，阔叶芭蕉，又有两间小小退步。后院墙下忽开一隙，得泉一派，开沟尺许，灌入墙内，绕阶缘屋至前院，盘旋竹下而出。贾政笑道：“这一处倒还好，若能月夜至此窗下读书，也…","so":0,"eo":0},{"surface":"宝玉","text":"贾政又向众人道：“‘杏花村’固佳，只是犯了正村名，直待请名方可。”众客都道：“是呀！如今虚的，却是何字样好呢？”大家正想，宝玉却等不得了，也不等贾政的话，便说道：“旧诗云：‘红杏梢头挂酒旗。’如今莫若且题以‘杏帘在望’四字。”众人都道：“好个‘在望’！又暗合‘杏花村’意思。”宝玉冷笑道：“村若用‘杏花’二字，便俗陋不堪了。唐人诗里，还有‘柴门临水稻花香’，何不用‘稻香村’的妙？”众人听了，越发同声拍手道妙。贾政一声断喝：“无知的畜生！你…","so":0,"eo":0},{"surface":"宝玉","text":"说着，引众人步入茆堂，里面纸窗木榻，富贵气象一洗皆尽。贾政心中自是欢喜，却瞅宝玉道：“此处如何？”众人见问，都忙悄悄的推宝玉教他说好。宝玉不听人言，便应声道：“不及‘有凤来仪’多了。”贾政听了道：“咳！无知的蠢物，你只知朱楼画栋、恶赖富丽为佳，那里知道这清幽气象呢！终是不读书之过。”宝玉忙答道：“老爷教训的固是，但古人云‘天然’二字，不知何意？”众人见宝玉牛心，都怕他讨了没趣；今见问“天然”二字，众人忙道：“哥儿别的都明白，如何‘天然’…","so":0,"eo":0},{"surface":"宝玉","text":"贾政听了，摇头道：“更不好。”一面引人出来，转过山坡，穿花度柳，抚石依泉，过了荼蘼茂架，入木香棚，越牡丹亭，度芍药圃，到蔷薇院，傍芭蕉坞里盘旋曲折。忽闻水声潺潺，出于石洞；上则萝薜倒垂，下则落花浮荡。众人都道：“好景，好景！”贾政道：“诸公题以何名？”众人道：“再不必拟了，恰恰乎是‘武陵源’三字。”贾政笑道：“又落实了，而且陈旧。”众人笑道：“不然就用‘秦人旧舍’四字也罢。”宝玉道：“越发背谬了。‘秦人旧舍’是避乱之意，如何使得？莫若‘…","so":0,"eo":0}]},{"chap":18,"ctitle":"第18章 皇恩重元妃省父母 天伦乐宝玉呈才藻","deeds":[{"surface":"宝玉","text":"话说彼时有人回，工程上等着糊东西的纱绫，请凤姐去开库。又有人来回，请凤姐收金银器皿。王夫人并上房丫鬟等皆不得空儿。宝钗因说道：“咱们别在这里碍手碍脚。”说着，和宝玉等便往迎春房中来。","so":0,"eo":0},{"surface":"宝玉","text":"已而入一石港，港上一面匾灯，明现着“蓼汀花溆”四字。看官听说：这“蓼汀花溆”及“有凤来仪”等字，皆系上回贾政偶试宝玉之才，何至便认真用了？想贾府世代诗书，自有一二名手题咏，岂似暴富之家，竟以小儿语搪塞了事呢？只因当日这贾妃未入宫时，自幼亦系贾母教养。后来添了宝玉，贾妃乃长姊，宝玉为幼弟，贾妃念母年将迈，始得此弟，是以独爱怜之。且同侍贾母，刻不相离。那宝玉未入学之先，三四岁时，已得元妃口传教授了几本书，识了数千字在腹中。虽为姊弟，有如母子…","so":0,"eo":0},{"surface":"宝玉","text":"又有贾政至帘外问安行参等事。元妃又向其父说道：“田舍之家，齑盐布帛，得遂天伦之乐；今虽富贵，骨肉分离，终无意趣。”贾政亦含泪启道：“臣草芥寒门，鸠群鸦属之中，岂意得征凤鸾之瑞。今贵人上锡天恩，下昭祖德，此皆山川日月之精华，祖宗之远德，钟于一人，幸及政夫妇。且今上体天地生生之大德，垂古今未有之旷恩，虽肝脑涂地，岂能报效万一！惟朝乾夕惕，忠于厥职。伏愿圣君万岁千秋，乃天下苍生之福也。贵妃切勿以政夫妇残年为念。更祈自加珍爱，惟勤慎肃恭以侍上，…","so":0,"eo":0},{"surface":"宝玉","text":"尤氏、凤姐等上来启道：“筵宴齐备，请贵妃游幸。”元妃起身，命宝玉导引，遂同诸人步至园门前。早见灯光之中，诸般罗列，进园先从“有凤来仪”、“红香绿玉”、“杏帘在望”、“蘅芷清芬”等处，登楼步阁，涉水缘山，眺览徘徊。一处处铺陈华丽，一桩桩点缀新奇。元妃极加奖赞，又劝：“以后不可太奢了，此皆过分。”既而来至正殿，降谕免礼归坐，大开筵宴，贾母等在下相陪，尤氏、李纨、凤姐等捧羹把盏。","so":0,"eo":0},{"surface":"宝玉","text":"题毕，向诸姐妹笑道：“我素乏捷才，且不长于吟咏，姐妹辈素所深知，今夜聊以塞责，不负斯景而已。异日少暇，必补撰《大观园记》并《省亲颂》等文，以记今日之事。妹等亦各题一匾一诗，随意发挥，不可为我微才所缚。且知宝玉能题咏，一发可喜。此中潇湘馆，蘅芜院二处，我所极爱；次之怡红院浣葛山庄；此四大处，必得别有章句题咏方妙。前所题之联虽佳，如今再各赋五言律一首，使我当面试过，方不负我自幼教授之苦心。”宝玉只得答应了，下来自去构思。","so":0,"eo":0},{"surface":"宝玉","text":"时宝玉尚未做完，才做了“潇湘馆”与“蘅芜院”两首，正做“恰红院”一首，起稿内有“绿玉春犹卷”一句。宝钗转眼瞥见，便趁众人不理论，推他道：“贵人因不喜‘红香绿玉’四字，才改了‘怡红快绿’。你这会子偏又用‘绿玉’二字，岂不是有意和他分驰了？况且蕉叶之典故颇多，再想一个改了罢。”宝玉见宝钗如此说，便拭汗说道：“我这会子总想不起什么典故出处来！”宝钗笑道：“你只把‘绿玉’的‘玉’字改作‘蜡’字就是了。”宝玉道：“‘绿蜡’可有出处？”宝钗悄悄的顺…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉续成了此首，共有三首。此时黛玉未得展才，心上不快。因见宝玉构思太苦，走至案旁，知宝玉只少“杏帘在望”一首，因叫他抄录前三首，却自己吟成一律，写在纸条上，搓成个团子，掷向宝玉跟前。宝玉打开一看，觉比自己做的三首高得十倍，遂忙恭楷誊完呈上。元妃看道是：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉","so":0,"eo":0}]},{"chap":19,"ctitle":"第19章 情切切良宵花解语 意绵绵静日玉生香","deeds":[{"surface":"宝玉","text":"且说荣、宁二府中连日用尽心力，真是人人力倦，各各神疲，又将园中一应陈设动用之物，收拾了两三天方完。第一个凤姐事多任重，别人或可偷闲躲静，独他是不能脱得的，二则本性要强，不肯落人褒贬，只扎挣着与无事的人一样。第一个宝玉是极无事最闲暇的。偏这一早，袭人的母亲又亲来回过贾母，接袭人家去吃年茶，晚上才得回来。因此，宝玉只和众丫头们掷骰子赶围棋作戏。正在房内玩得没兴头，忽见丫头们来回说：“东府里珍大爷来请过去看戏，放花灯。”宝玉听了，便命换衣裳。…","so":0,"eo":0},{"surface":"宝玉","text":"谁想贾珍这边唱的是《丁郎认父》、《黄伯央大摆阴魂阵》，更有《孙行者大闹天宫》、《姜太公斩将封神》等类的戏文。倏尔神鬼乱出，忽又妖魔毕露。内中扬幡过会、号佛行香、锣鼓喊叫之声，闻于巷外。弟兄子侄，互为献酬；姊妹婢妻，共相笑语。独有宝玉见那繁华热闹到如此不堪的田地，只略坐了一坐，便走往各处闲耍。先是进内去和尤氏并丫头姬妾鬼混了一回，便出二门来。尤氏等仍料他出来看戏，遂也不曾照管。贾珍、贾琏、薛蟠等只顾猜谜行令，百般作乐，纵一时不见他在座，只…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉见一个人没有，因想：“素日这里有个小书房内曾挂着一轴美人，画的很得神。今日这般热闹，想那里自然无人，那美人也自然是寂寞的．须得我去望慰他一回。”想着，便往那里来。刚到窗前，听见屋里一片喘息之声。宝玉倒唬了一跳，心想：“美人活了不成？”乃大着胆子，舐破窗纸。向内一看，那轴美人却不曾活，却是茗烟按着个女孩子，也干那警幻所训之事，正在得趣，故此呻吟。","so":0,"eo":0},{"surface":"宝玉","text":"宝玉禁不住，大叫“了不得”一脚踹进门去。将两个唬的抖衣而颤。茗烟见是宝玉，忙跪下哀求。宝玉道：“青天白日，这是怎么说！珍大爷要知道了，你是死是活？”一面看那丫头，倒也白白净净儿的有些动人心处，在那里羞的脸红耳赤，低首无言。宝玉跺脚道：“还不快跑！”一语提醒，那丫头飞跑去了。宝玉又赶出去叫道：“你别怕，我不告诉人！”急的茗烟在后叫：“祖宗，这是分明告诉人了！”宝玉因问：“那丫头十几岁了？”茗烟道：“不过十六七了。”宝玉道：“连他的岁数也不…","so":0,"eo":0},{"surface":"宝玉","text":"幸而袭人家不远，不过一半里路程，转眼已到门前。茗烟先进去叫袭人之兄花自芳。此时袭人之母接了袭人与几个外甥女儿几个侄女儿来家，正吃果茶，听见外面有人叫“花大哥”，花自芳忙出去看时，见是他主仆两个，唬的惊疑不定，连忙抱下宝玉来，至院内嚷道：“宝二爷来了！别人听见还可，袭人听了，也不知为何。忙跑出来迎着宝玉，一把拉着问：“你怎么来了？”宝玉笑道：“我怪闷的，来瞧瞧你作什么呢。”袭人听了，才把心放下来，说道：“你也胡闹了！可作什么来呢？”一面又…","so":0,"eo":0},{"surface":"宝玉","text":"袭人的母亲也早迎出来了。袭人拉着宝玉进去。宝玉见房中三五个女孩儿，见他进来，都低了头，羞的脸上通红。花自芳母子两个恐怕宝玉冷，又让他上炕，又忙另摆果子，又忙倒好茶。袭人笑道：“你们不用白忙，我自然知道，不敢乱给他东西吃的。”一面将自己的坐褥拿了来，铺在一个杌子上，扶着宝玉坐下，又用自己的脚炉垫了脚，向荷包内取出两个梅花香饼儿来，又将自己的手炉掀开焚上，仍盖好，放在宝玉怀里，然后将自己的茶杯斟了茶，送与宝玉。彼时他母兄已是忙着齐齐整整的摆…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看见袭人两眼微红，粉光融滑，因悄问袭人道：“好好的哭什么？”袭人笑道：“谁哭来着？才迷了眼揉的。”因此便遮掩过了。因见宝玉穿着大红金蟒狐腋箭袖，外罩石青貂裘排穗褂，说道：“你特为往这里来，又换新衣裳，他们就不问你往那里去吗？”宝玉道：“原是珍大爷请过去看戏换的。”袭人点头，又道：“坐一坐就回去罢，这个地方儿不是你来的。”宝玉笑道：“你就家去才好呢，我还替你留着好东西呢。”袭人笑道：“悄悄儿的罢！叫他们听着作什么？”一面伸手从宝玉项上…","so":0,"eo":0},{"surface":"宝玉","text":"却说宝玉自出了门，他房中这些丫环们都索性恣意的玩笑，也有赶围棋的，也有掷骰抹牌的，磕了一地的瓜子皮儿。偏奶母李嬷嬷拄拐进来请安，瞧瞧宝玉；见宝玉不在家，丫环们只顾玩闹，十分看不过。因叹道：“自从我出去了不大进来，你们越发没了样儿了，别的嬷嬷越不敢说你们了。那宝玉是个‘丈八的灯台，照见人家，照不见自己’的，只知嫌人家腌。这是他的房子，由着你们遭塌，越不成体统了。”这些丫头们明知宝玉不讲究这些，二则李嬷嬷已是告老解事出去的了，如今管不着他们…","so":0,"eo":0}]},{"chap":20,"ctitle":"第20章 王熙凤正言弹妒意 林黛玉俏语谑娇音","deeds":[{"surface":"宝玉","text":"话说宝玉在黛玉房中说“耗子精”，宝钗撞来，讽刺宝玉元宵不知“绿蜡”之典，三人正在房中互相取笑。那宝玉恐黛玉饭后贪眠，一时存了食，或夜间走了困，身体不好，幸而宝钗走来，大家谈笑，那黛玉方不欲睡，自己才放了心。忽听他房中嚷起来，大家侧耳听了一听，黛玉先笑道：“这是你妈妈和袭人叫唤呢。那袭人待他也罢了，你妈妈再要认真排揎他，可见老背晦了。”宝玉忙欲赶过去，宝钗一把拉住道：“你别和你妈妈吵才是呢！他是老糊涂了，倒要让他一步儿的是。”宝玉道：“我…","so":0,"eo":0},{"surface":"宝玉","text":"只见李嬷嬷拄着拐杖，在当地骂袭人：“忘了本的小娼妇儿！我抬举起你来，这会子我来了，你大模厮样儿的躺在炕上，见了我也不理一理儿。一心只想妆狐媚子哄宝玉，哄的宝玉不理我，只听你的话。你不过是几两银子买了来的小丫头子罢咧，这屋里你就作起耗来了！好不好的，拉出去配一个小子，看你还妖精似的哄人不哄！”袭人先只道李嬷嬷不过因他躺着生气，少不得分辩说：“病了，才出汗，蒙着头，原没看见你老人家。”后来听见他说“哄宝玉”，又说“配小子”，由不得又羞又委屈…","so":0,"eo":0},{"surface":"宝玉","text":"可巧凤姐正在上房算了输赢账，听见后面一片声嚷，便知是李嬷嬷老病发了，又值他今儿输了钱，迁怒于人，排揎宝玉的丫头。便连忙赴过来拉了李嬷嬷，笑道：“妈妈别生气。大节下，老太太刚喜欢了一日。你是个老人家，别人吵，你还要管他们才是，难道你倒不知规矩，在这里嚷起来，叫老太太生气不成？你说谁不好，我替你打他；我屋里烧的滚热的野鸡，快跟了我喝酒去罢。”一面说，一面拉着走，又叫：“丰儿，替你李奶奶拿着拐棍子、擦眼泪的绢子。”那李嬷嬷脚不沾地跟了凤姐儿走…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉点头叹道：“这个不知是那里的账，只拣软的欺负！又不知是那个姑娘得罪了，上在他账上了。”一句未完，睛雯在旁说道：“谁又没疯了，得罪他做什么？既得罪了他，就有本事承任，犯不着带累别人！”袭人一面哭，一面拉着宝玉道：“为我得罪了老奶奶，你这会子又为我得罪这些人，这还不够我受的，还只是拉扯人！”宝玉见他这般病势，又添了这些烦恼，连忙忍气吞声，安慰他仍旧睡下出汗。只见他汤烧火热，自己守着他，歪在旁边，劝他只养病，别想那些没要紧的事。袭人冷笑道…","so":0,"eo":0},{"surface":"宝玉","text":"饭毕，贾母犹欲和那几个老管家的嬷嬷斗牌。宝玉掂记袭人，便回至房中。见袭人朦胧睡去，自己要睡，天气尚早。彼时睛雯、绮霞、秋纹、碧痕都寻热闹，找鸳鸯，琥珀。等耍戏去了。见麝月一人在外间屋里灯下抹骨牌。宝玉笑道：“你怎么不和他们去？”麝月道“没有钱。”宝玉道：“床下堆着钱，还不够你输的？”麝月道：“都乐去了，这屋子交给谁呢？那一个又病了，满屋里上头是灯，下头是火，那些老婆子们都老天拔地伏侍了一天，也该叫他们歇歇儿了。小丫头们也伏侍了一天，这会…","so":0,"eo":0},{"surface":"宝玉","text":"只蓖了三五下儿，见晴雯忙忙走进来取钱，一见他两个，便冷笑道：“哦！交杯盏儿还没吃，就上了头了！“宝玉笑道：“你来，我也替你蓖蓖。”晴雯道：“我没这么大造化。”说着，拿了钱，摔了帘子，就出去了。宝玉在麝月身后，麝月对镜，二人在镜内相视而笑。宝玉笑着道：“满屋里就只是他磨牙。”麝月听说，忙向镜中摆手儿。宝玉会意，忽听“唿”一声帘子响，睛雯又跑进来问道：“我怎么磨牙了？咱们倒得说说！”麝月笑道：“你去你的罢，又来拌嘴儿了。”晴雯也笑道：“你又…","so":0,"eo":0},{"surface":"宝玉","text":"次日清晨，袭人已是夜间出了汗，觉得轻松了些，只吃些米汤静养。宝玉才放了心。因饭后走到薛姨妈这边闲逛。","so":0,"eo":0},{"surface":"宝玉","text":"彼时正月内学房中放年学，闺阁中忌针黹，都是闲时，因贾环也过来玩。正遇见宝钗、香菱、莺儿三个赶围棋作耍，贾环见了也要玩。宝钗素日看他也如宝玉，并没他意，今儿听他要玩，让他上来，坐在一处玩。一注十个钱。头一回，自己赢了，心中十分喜欢。谁知后来接连输了几盘，就有些着急。赶着这盘正该自己掷骰子，若掷个七点便赢了，若掷个六点也该赢，掷个三点就输了。因拿起骰子来狠命一掷，一个坐定了二，那一个乱转。莺儿拍着手儿叫“么！”贾环便瞪着眼“六！”“七！”八…","so":0,"eo":0}]},{"chap":21,"ctitle":"第21章 贤袭人娇嗔箴宝玉 俏平儿软语救贾琏","deeds":[{"surface":"宝玉","text":"话说史湘云说着笑着跑出来，怕黛玉赶上。宝玉在后忙说：“绊倒了！那里就赶上了？”黛玉赶到门前，被宝玉叉手在门框上拦住，笑道：“饶他这一遭儿罢。”黛玉拉着手说道：“我要饶了云儿，再不活着。”湘云见宝玉拦着门，料黛玉不能出来，便立住脚，笑道：“好姐姐，饶我这遭儿罢！”却值宝钗来在湘云身背后，也笑道：“我劝你们两个看宝兄弟面上，都撂开手罢。”黛玉道：“我不依。你们是一气的，都来戏弄我。”宝玉劝道：“罢哟，谁敢戏弄你？你不打趣他，他就敢说你了？”…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉送他二人到房，那天已二更多了，袭人来催了几次方回。次早，天方明时，便披衣鞋往黛玉房中来了，却不见紫鹃、翠缕二人，只有他姊妹两个尚卧在衾内。那黛玉严严密密裹着一幅杏子红绫被，安稳合目而睡。湘云却一把青丝，拖于枕畔，一幅桃红绸被只齐胸盖着，衬着那一弯雪白的膀子，撂在被外，上面明显着两个金镯子。宝玉见了叹道：“睡觉还是不老实！回来风吹了，又嚷肩膀疼了。”一面说，一面轻轻的替他盖上。黛玉早已醒了，觉得有人，就猜是宝玉，翻身一看，果然是他。因…","so":0,"eo":0},{"surface":"宝玉","text":"一语未了，只见袭人进来，见这光景，知是梳洗过了，只得回来自己梳洗。忽见宝钗走来，因问：“宝兄弟那里去了？”袭人冷笑道：“‘宝兄弟’那里还有在家的工夫！”宝钗听说，心中明白。袭人又叹道：“姐妹们和气，也有个分寸儿，也没个黑家白日闹的。凭人怎么劝，都是耳旁风。”宝钗听了，心中暗忖道：“倒别看错了这个丫头，听他说话，倒有些识见。”宝钗便在炕上坐了，慢慢的闲言中，套问他年纪家乡等语，留神窥察其言语志量，深可敬爱。","so":0,"eo":0},{"surface":"宝玉","text":"一时宝玉来了，宝钗方出去。宝玉便问袭人道：“怎么宝姐姐和你说的这么热闹，见我进来就跑了？”问一声不答。再问时，袭人方道：“你问我吗？我不知道你们的原故。”宝玉听了这话，见他脸上气色非往日可比，便笑道：“怎么又动了气了呢？”袭人冷笑道：“我那里敢动气呢？只是你从今别进这屋子了，横竖有人伏侍你，再不必来支使我。我仍旧还伏侍老太太去。”一面说，一面便在炕上合眼倒下。宝玉见了这般景况，深为骇异，禁不住赶来央告。那袭人只管合着眼不理。宝玉没了主意…","so":0,"eo":0},{"surface":"宝玉","text":"袭人听他半日无动静，微微的打，料他睡着，便起来拿了一领斗篷来替他盖上。只听“唿”的一声，宝玉便掀过去，仍合着眼装睡。袭人明知其意，便点头冷笑道：“你也不用生气，从今儿起，我也只当是个哑吧，再不说你一声儿了好不好？”宝玉禁不住起身问道：“我又怎么了？你又劝我？你劝也罢了，刚才又没劝，我一进来，你就不理我，赌气睡了，我还摸不着是为什么。这会子你又说我恼了！我何尝听见你劝我的是什么话呢？”袭人道：“你心里还不明白？还等我说呢！”","so":0,"eo":0},{"surface":"宝玉","text":"正闹着，贾母遣人来叫他吃饭，方往前边来胡乱吃了一碗，仍回自己房中。只见袭人睡在外头炕上，麝月在旁抹牌。宝玉素知他两个亲厚，并连麝月也不理，揭起软帘自往里间来。麝月只得跟进来。宝玉便推他出去说：“不敢惊动。”麝月便笑着出来，叫了两个小丫头进去。宝玉拿了本书，歪着看了半天，因要茶，抬头见两个小丫头在地下站着，那个大两岁清秀些的，宝玉问他道：“你不是叫什么‘香’吗？那丫头答道：“叫蕙香。”宝玉又问：“是谁起的名字？”惠香道：“我原叫芸香，是花…","so":0,"eo":0},{"surface":"宝玉","text":"这一日，宝玉也不出房，自己闷闷的，只不过拿书解闷，或弄笔墨，也不使唤众人，只叫四儿答应。谁知这四儿是个乖巧不过的丫头，见宝玉用他，他就变尽方法儿笼络宝玉。至晚饭后，宝玉因吃了两杯酒，眼饧耳热之馀，若往日则有袭人等大家嘻笑有兴，今日却冷清清的，一人对灯，好没兴趣。待要赶了他们去，又怕他们得了意，以后越来劝了；若拿出作上人的光景镇唬他们，似乎又太无情了。说不得横着心：“只当他们死了，横竖自家也要过的。”如此一想，却倒毫无牵挂，反能恰然自悦。…","so":0,"eo":0},{"surface":"宝玉","text":"直至天明方醒，翻身看时，只见袭人和衣睡在衾上。宝玉将昨日的事，已付之度外，便推他说道：“起来好生睡，看冻着。”原来袭人见他无明无夜和姐妹们鬼混，若真劝他，料不能改，故用柔情以警之，料他不过半日片刻，仍旧好了。不想宝玉竞不回转，自己反不得主意，直一夜没好生睡。今忽见宝玉如此，料是他心意回转，便索性不理他。宝玉见他不应，便伸手替他解衣，刚解开钮子，被袭人将手推开，又自扣了。宝玉无法，只得拉他的手笑道：“你到底怎么了？”连问几声，袭人睁眼说道…","so":0,"eo":0}]},{"chap":22,"ctitle":"第22章 听曲文宝玉悟禅机 制灯迷贾政悲谶语","deeds":[{"surface":"宝玉","text":"谁想贾母自见宝钗来了，喜他稳重和平，正值他才过第一个生辰，便自己捐资二十两，唤了凤姐来，交与他备酒戏。凤姐凑趣，笑道：“一个老祖宗，给孩子们作生日，不拘怎么着，谁还敢争？又办什么酒席呢？既高兴，要热闹，就说不得自己花费几两老库里的体已。这早晚找出这霉烂的二十两银子来做东，意思还叫我们赔上！果然拿不出来也罢了，金的银的圆的扁的压塌了箱子底，只是累我们。老祖宗看看，谁不是你老人家的儿女？难道将来只有宝兄弟顶你老人家上五台山不成？那些东西只留…","so":0,"eo":0},{"surface":"宝玉","text":"吃了饭，点戏时，贾母，一面先叫宝钗点，宝钗推让一遍，无法，只得点了一出《西游记》，贾母自是喜欢。又让薛姨妈，薛姨妈见宝钗点了，不肯再点。贾母便特命凤姐点。凤姐虽有邢王二夫人在前，但因贾母之命，不敢违拗，且知贾母喜热闹更喜谑笑科诨，便先点了一出，却是《刘二当衣》。贾母果真更又喜欢。然后便命黛玉点，黛玉又让王夫人等先点。贾母道：“今儿原是我特带着你们取乐，咱们只管咱们的，别理他们。我巴巴儿的唱戏摆酒，为他们呢！他们白听戏白吃已经便宜了，还让…","so":0,"eo":0},{"surface":"宝玉","text":"至上酒席时，贾母又命宝钗点，宝钗点了一出《山门》。宝玉道：“你只好点这些戏。”宝钗道：“你白听了这几年，那里知道这出戏，排场词藻都好呢。”宝玉道：“我从来怕这些热闹戏。”宝钗笑道：“要说这一出‘热闹’，你更不知戏了。你过来．我告诉你，这一出戏是一套《北点绛唇》，铿锵顿挫，那音律不用说是好了，那词藻中有只《寄生草》，极妙，你何曾知道！”宝玉见说的这般好，便凑近来央告：“好姐姐，念给我听听。”宝钗便念给他听道：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，喜的拍膝摇头，称赏不已；又赞宝钗无书不知。黛玉把嘴一撇道：“安静些看戏吧！还没唱《山门》，你就《妆疯》了。”说的湘云也笑了。于是大家看戏，到晚方散。","so":0,"eo":0},{"surface":"宝玉","text":"贾母深爱那做小旦的和那做小丑的，因命人带进来，细看时，益发可怜见的。因问他年纪，那小旦才十一岁，小丑才九岁，大家叹息了一回。贾母令人另拿些肉果给他两个，又另赏钱。凤姐笑道：“这个孩子扮上活象一个人，你们再瞧不出来。”宝钗心内也知道，却点头不说；宝玉也点了点头儿不敢说。湘云便接口道：“我知道，是象林姐姐的摸样儿。”宝玉听了，忙把湘云瞅了一眼。众人听了这话，留神细看，都笑起来了，说：“果然象他！”一时散了。","so":0,"eo":0},{"surface":"宝玉","text":"晚间，湘云便命翠缕把衣包收拾了。翠缕道：“忙什么，等去的时候包也不迟。”湘云道：“明早就走，还在这里做什么？——看人家的脸子！”宝玉听了这话，忙近前说道：“好妹妹，你错怪了我。林妹妹是个多心的人。别人分明知道，不肯说出来，也皆因怕他恼。谁知你不防头就说出来了，他岂不恼呢。我怕你得罪了人，所以才使眼色。你这会子恼了我，岂不辜负了我？要是别人，那怕他得罪了人，与我何干呢？”湘云摔手道：“你那花言巧语别望着我说，我原不及你林妹妹。别人拿他取笑…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉没趣，只得又来找黛玉。谁知才进门，便被黛玉推出来了，将门关上。宝玉又不解何故，在窗外只是低声叫好妹妹好妹妹，黛玉总不理他。宝玉闷闷的垂头不语。紫鹃却知端底，当此时料不能劝。那宝玉只呆呆的站着。黛玉只当他回去了，却开了门，只见宝玉还站在那里。黛玉不好再闭门，宝玉因跟进来，问道：“凡事都有个原故，说出来人也不委屈。好好的就恼，到底为什么起呢？”黛玉冷笑道：“问我呢，我也不知为什么。我原是给你们取笑儿的，拿着我比戏子，给众人取笑儿！”宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，方知才和湘云私谈，他也听见了。细想自己原为怕他二人恼了，故在中间调停，不料自己反落了两处的数落，正合着前日所看《南华经》内“巧者劳而智者忧，无能者无所求，蔬食而遨游，泛若不系之舟”，又曰“山木自寇，源泉自盗”等句，因此越想越无趣。再细想来：“如今不过这几个人，尚不能应酬妥协，将来犹欲何为？”想到其间，也不分辩，自己转身回房。黛玉见他去了，便知回思无趣，赌气去的，一言不发，不禁自己越添了气，便说：“这一去，一辈子也别来了，也别说…","so":0,"eo":0}]},{"chap":23,"ctitle":"第23章 西厢记妙词通戏语 牡丹亭艳曲警芳心","deeds":[{"surface":"宝玉","text":"如今且说那元妃，在宫中编次《大观园题咏》，忽然想起那园中的景致，自从幸过之后，贾政必定敬谨封锁，不叫人进去，岂不辜负此园。况家中现有几个能诗会赋的姊妹们，何不命他们进去居住，也不使佳人落魄，花柳无颜。却又想宝玉自幼在姊妹丛中长大，不比别的兄弟，若不命他进去，又怕冷落了他，恐贾母、王夫人心上不喜，须得也命他进去居住方妥。命太监夏忠到荣府下一道谕：“命宝钗等在园中居住，不可封锢；命宝玉也随进去读书。”贾政王夫人接了谕命。夏忠去后，便回明贾母…","so":0,"eo":0},{"surface":"宝玉","text":"别人听了，还犹自可，惟宝玉喜之不胜。正和贾母盘算着要这个要那个，忽见丫鬟来说：“老爷叫宝玉。”宝玉呆了半晌，登时扫了兴，脸上转了色，便拉着贾母扭的扭股儿糖似的，死也不敢去。贾母只得安慰他道：“好宝贝，你只管去，有我呢。他不敢委屈了你。况你做了这篇好文章，想必娘娘叫你进园去住，他吩咐你几句话，不过是怕你在里头淘气。他说什么，你只好生答应着就是了。”一面安慰，一面唤了两个老嬷嬷来，吩咐：“好生带了宝玉去，别叫他老子唬着他。”老嬷嬷答应了。宝…","so":0,"eo":0},{"surface":"宝玉","text":"可巧贾政在王夫人房中商议事情，金钏儿、彩云、绣鸾、绣凤等众丫鬟都廊檐下站着呢，一见宝玉来，都抿着嘴儿笑他。金钏儿一把拉着宝玉，悄悄的说道：“我这嘴上是才擦的香香甜甜的胭脂，你这会子可吃不吃了？”彩云一把推开金钏儿，笑道：“人家心里发虚，你还怄他！趁这会子喜欢，快进去罢。”宝玉只得挨门进去。原来贾政和王夫人都在里间呢。赵姨娘打起帘子来，宝玉挨身而入，只见贾政和王夫人对坐在炕上说话儿，地下一溜椅子，迎春、探春、惜春、贾环四人都坐在那里。一见…","so":0,"eo":0},{"surface":"宝玉","text":"贾政一举目见宝玉站在眼前，神彩飘逸，秀色夺人，又看看贾环人物委琐，举止粗糙，忽又想起贾珠来。再看看王夫人，只有这一个亲生的儿子，素爱如珍，自己的胡须将已苍白。因此上把平日嫌恶宝玉之心不觉减了八九分。半晌说道：“娘娘吩咐说，你日日在外游嬉，渐次疏懒了工课，如今叫禁管你和姐妹们在园里读书。你可好生用心学习，再不守分安常，你可仔细着！”宝玉连连答应了几个“是”。王夫人便拉他在身边坐下。他姊弟三人依旧坐下。王夫人摸索着宝玉的脖项说道：“前儿的丸…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉答应了，慢慢的退出去，向金钏儿笑着伸伸舌头，带着两个老嬷嬷，一溜烟去了。刚至穿堂门前，只见袭人倚门而立，见宝玉平安回来，堆下笑来，问道：“叫你做什么？”宝玉告诉：“没有什么，不过怕我进园淘气，吩咐吩咐”一面说，一面回至贾母跟前回明原委。只见黛玉正在那里，宝玉便问他：“你住在那一处好？”黛玉正盘算这事，忽见宝玉一问，便笑道：“我心里想着潇湘馆好。我爱那几竿竹子，隐着一道曲栏，比别处幽静些。”宝玉听了，拍手笑道：“合了我的主意了，我也要…","so":0,"eo":0},{"surface":"宝玉","text":"闲言少叙，且说宝玉自进园来，心满意足，再无别项可生贪求之心，每日只和姊妹丫鬟们一处，或读书，或写字，或弹琴下棋，作画吟诗，以至描鸾刺凤，斗草簪花，低吟悄唱，拆字猜枚，无所不至，倒也十分快意。他曾有几首四时即事诗，虽不算好，却是真情真景。","so":0,"eo":0},{"surface":"宝玉","text":"不说宝玉闲吟，且说这几首诗，当时有一等势利人，见是荣国府十二三岁的公子做的，抄录出来，各处称颂；再有等轻薄子弟，爱上那风流妖艳之句，也写在扇头壁上，不时吟哦赏赞。因此上竟有人来寻诗觅字，倩画求题。这宝玉一发得意了，每日家做这些外务。谁想静中生动，忽一日，不自在起来，这也不好，那也不好，出来进去只是发闷。园中那些女孩子，正是混沌世界天真烂漫之时，坐卧不避，嬉笑无心，那里知宝玉此时的心事？那宝玉不自在，便懒在园内，只想外头鬼混，却痴痴的又说…","so":0,"eo":0},{"surface":"宝玉","text":"那日正当三月中浣，早饭后，宝玉携了一套《会真记》，走到沁芳闸桥那边桃花底下一块石上坐着，展开《会真记》，从头细看。正看到“落红成阵”，只见一阵风过，树上桃花吹下一大斗来，落得满身满书满地皆花片。宝玉要抖将下来，恐怕脚步践踏了，只得兜了那花瓣儿，来至池边，抖在池内。那花瓣儿浮在水面，飘飘荡荡，竟流出沁芳闸去了。回来只见地下还有许多花瓣。宝玉正蜘蹰间，只听背后有人说道：“你在这里做什么？”宝玉一回头，却是黛玉来了，肩上担着花锄，花锄上挂着纱…","so":0,"eo":0}]},{"chap":24,"ctitle":"第24章 醉金刚轻财尚义侠 痴女儿遗帕惹相思","deeds":[{"surface":"宝玉","text":"且说宝玉因被袭人找回房去，只见鸳鸯歪在床上看袭人的针线呢，见宝玉来了，便说道：“你往那里去了？老太太等着你呢，叫你过那边请大老爷的安去。还不快去换了衣裳走呢！”袭人便进房去取衣服。宝玉坐在床沿上褪了鞋，等靴子穿的工夫，回头见鸳鸯穿着水红绫子袄儿，青缎子坎肩儿，下面露着玉色绸袜，大红绣鞋，向那边低着头看针线，脖子上围着紫绸绢子。宝玉便把脸凑在脖项上，闻那香气，不住用手摩挲，其白腻不在袭人以下。便猴上身去，涎着脸笑道：“好姐姐，把你嘴上的胭…","so":0,"eo":0},{"surface":"宝玉","text":"见过贾母，出至外面，人马俱已齐备。刚欲上马，只见贾琏请安回来正下马。二人对面，彼此问了两句话，只见旁边转过一个人来，说：“请宝叔安。”宝玉看时，只见这人生的容长脸儿，长挑身材，年纪只有十八九岁，甚实斯文清秀。虽然面善，却想不起是那一房的，叫什么名字。贾琏笑道：“你怎么发呆，连他也不认得？他是廊下住的五嫂子的儿子芸儿。”宝玉笑道：“是了，我怎么就忘了。”因问他：“你母亲好？这会子什么勾当？”贾芸指贾琏道：“找二叔说句话。”宝玉笑道：“你倒…","so":0,"eo":0},{"surface":"宝玉","text":"见了贾赦，不过是偶感些风寒。先述了贾母问的话，然后自己请了安，贾赦先站起来回了贾母问的话，便唤人来：“带进哥儿去太太屋里坐着。”宝玉退出来，至后面，到上房，邢夫人见了，先站起来请过贾母的安，宝玉方请安。邢夫人拉他上炕坐了，方问别人，又命人倒茶。茶未吃完，只见贾琮来问宝玉好。邢夫人道：“那里找活猴儿去！你那奶妈子死绝了，也不收拾收拾。弄的你黑眉乌嘴的，那里还象个大家子念书的孩子？”正说着，只见贾环、贾兰小叔侄两个也来请安。邢夫人叫他两人在…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉见他们起身，也就要一同回去。邢夫人笑道：“你且坐着，我还和你说话。”宝玉只得坐了。邢夫人向他两个道：“你们回去，各人替我问各人的母亲好罢。你姑姑姐姐们都在这里呢，闹的我头晕，今儿不留你们吃饭了。”贾环等答应着便出去了。宝玉笑道：“可是姐姐们都过来了，怎么不见？”邢夫人道：“他们坐了会子，都往后头不知那屋里去了。”宝玉说：“大娘说‘有话说’，不知是什么话？”邢夫人笑道：“那里什么话，不过叫你等着同姐妹们吃了饭去，还有一个好玩的东西给你…","so":0,"eo":0},{"surface":"宝玉","text":"贾芸自然也难提，只得回来。因昨日见了宝玉，到外书房等着，故此吃了饭，又进来，到贾母那边仪门外绮散斋书房里来。只见茗烟在那里掏小雀儿呢。贾芸在他身后，把脚一跺，道：“茗烟小猴儿又淘气了！”茗烟回头，见是贾芸，便笑道：“何苦二爷唬我们这么一跳。”因又笑说：“我不叫茗烟了，我们宝二爷嫌‘烟’字不好，改了叫‘焙茗’了。二爷明儿只叫我焙茗罢。”贾芸点头笑着同进书房，便坐下问：“宝二爷下来了没有？”焙茗道：“今日总没下来。二爷说什么，我替你探探去。…","so":0,"eo":0},{"surface":"宝玉","text":"这里贾芸便看字画古玩。有一顿饭的工夫，还不见来。再看看要找别的小子，都玩去了。正在烦闷，只听门前娇音嫩语的叫了一声“哥哥呀”。贾芸往外瞧时，是个十五六岁的丫头，生的倒甚齐整，两只眼儿水水灵灵的，见了贾芸，抽身要躲，恰值焙茗走来，见那丫头在门前，便说道：“好，好，正抓不着个信儿呢！”贾芸见了焙茗，也就赶出来，问：“怎么样？”焙茗道：“等了半日，也没个人过。这就是宝二爷屋里的。”因说道：“好姑娘，你带个信儿，就说廊上二爷来了。”那丫头听见，…","so":0,"eo":0},{"surface":"宝玉","text":"贾芸喜不自禁，来至绮散斋打听宝玉，谁知宝玉一早便往北静王府里去了。贾芸便呆呆的坐到晌午。打听凤姐回来，去写个领票来领对牌，至院外，命人通报了，彩明走出来要了领票，进去批了银数、年月，一并连对牌交给贾芸。贾芸接来看那批上批着二百两银子，心中喜悦，翻身走到银库上领了银子，回家告诉他母亲，自是母子俱喜。次日五更，贾芸先找了倪二还了银子，又拿了五十两银子出西门找到花儿匠方椿家里去买树，不在话下。","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉自这日见了贾芸，曾说过明日着他进来说话，这原是富贵公子的口角，那里还记在心上，因而便忘怀了。这日晚上，却从北静王府里回来，见过贾母、王夫人等回至园内。换了衣服，正要洗澡，袭人被宝钗烦了去打结子去了，秋纹、碧痕两个去催水。檀云又因他母亲病了接出去了，麝月现在家中病着，还有几个做粗活听使唤的丫头，料是叫不着他，都出去寻伙觅伴的去了。不想这一刻的工夫，只剩了宝玉在屋内。偏偏的宝玉要喝茶，一连叫了两三声，方见两三个老婆子走进来。宝玉见了…","so":0,"eo":0}]},{"chap":25,"ctitle":"第25章 魇魔法叔嫂逢五鬼 通灵玉蒙蔽遇双真","deeds":[{"surface":"宝玉","text":"话说小红心神恍惚，情思缠绵，忽朦胧睡去，遇见贾芸要拉他，却回身一跑，被门槛绊了一胶，唬醒过来，方知是梦。因此翻来复去，一夜无眠。至次日天明，方才起来，有几个丫头来会他去打扫屋子地面，舀洗脸水。这小红也不梳妆，向镜中胡乱挽了一挽头发，洗了洗手脸，便来打扫房屋。谁知宝玉昨儿见了他，也就留心，想着指名唤他来使用，一则怕袭人等多心，二则又不知他是怎么个情性，因而纳闷。早晨起来，也不梳洗，只坐着出神。一时下了纸窗，隔着纱屉子，向外看的真切，只见几…","so":0,"eo":0},{"surface":"宝玉","text":"过了一日，原来次日是王子腾夫人的寿诞，那里原打发人来请贾母、王夫人，王夫人见贾母不去，也不便去了。倒是薛姨妈同着凤姐儿并贾家三个妹妹、宝钗、宝玉，一齐都去了。至晚方回。","so":0,"eo":0},{"surface":"宝玉","text":"王夫人正过薛姨妈院里坐着，见贾环下了学，命他去抄《金刚经咒》唪诵。那贾环便来到王夫人炕上坐着，命人点了蜡烛，拿腔做势的抄写。一时又叫彩云倒钟茶来，一时又叫玉钏剪蜡花，又说金钏挡了灯亮儿。众丫鬟们素日厌恶他，都不答理。只有彩霞还和他合得来，倒了茶给他，因向他悄悄的道：“你安分些罢，何苦讨人厌。”贾环把眼一瞅道：“我也知道，你别哄我。如今你和宝玉好了，不理我，我也看出来了。”彩云咬着牙，向他头上戳了一指头，道：“没良心的，‘狗咬吕洞宾，不识…","so":0,"eo":0},{"surface":"宝玉","text":"两人正说着，只见凤姐跟着王夫人都过来了。王夫人便一长一短问他今日是那几位堂客，戏文好歹，酒席如何。不多时，宝玉也来了，见了王夫人，也规规矩矩说了几句话，便命人除去了抹额，脱了袍服，拉了靴子，就一头滚在王夫人怀里。王夫人便用手摩掌抚弄他，宝玉也扳着王夫人的脖子说长说短的。王夫人道：“我的儿，又吃多了酒，脸上滚热的。你还只是揉搓，一会子闹上酒来！还不在那里静静的躺一会子去呢。”说着，便叫人拿枕头。宝玉因就在王夫人身后倒下，又叫彩霞来替他拍着…","so":0,"eo":0},{"surface":"宝玉","text":"只听宝玉“嗳哟”的一声，满屋里人都唬了一跳。连忙将地下的绰灯移过来一照，只见宝玉满脸是油。王夫人又气又急，忙命人替宝玉擦洗，一面骂贾环。凤姐三步两步上炕去替宝玉收拾着，一面说：“这老三还是这么‘毛脚鸡’似的。我说你上不得台盘！赵姨娘平时也该教导教导他！”一句话提醒了王夫人，遂叫过赵姨娘来，骂道：“养出这样黑心种子来，也不教训教训！几番几次我都不理论，你们一发得了意了，一发上来了！”那赵姨娘只得忍气吞声，也上去帮着他们替宝玉收拾。只见宝玉…","so":0,"eo":0},{"surface":"宝玉","text":"次日，宝玉见了贾母，虽自己承认自己烫的，贾母免不得又把跟从的人骂了一顿。过了一日，有宝玉寄名的干娘马道婆到府里来，见了宝玉，唬了一大跳，问其缘由，知是烫的，便点头叹息，一面向宝玉脸上用指头画了几画，口内嘟嘟囔囔的，又咒诵了一回，说道：“包管好了。这不过是一时飞灾。”又向贾母道：“老祖宗，老菩萨，那里知道那佛经上说的利害！大凡王公卿相人家的子弟，只一生长下来，暗里就有多少促狭鬼跟着他，得空儿就拧他一下，或掐他一下，或吃饭时打下他的饭碗来，…","so":0,"eo":0},{"surface":"宝玉","text":"赵姨娘听了笑道：“罢，罢！再别提起！如今就是榜样。我们娘儿们跟的上这屋里那一个儿？宝玉儿还是小孩子家，长的得人意儿，大人偏疼他些儿也还罢了，我只不服这个主儿！”一面说，一面伸了两个指头。马道婆会意，便问道：“可是琏二奶奶？”赵姨娘唬的忙摇手儿，起身掀帘子一看，见无人，方回身向道婆说：“了不得，了不得！提起这个主儿，这，一分家私要不都叫他搬了娘家去，我也不是个人！”马道婆见说，便探他的口气道：“我还用你说？难道都看不出来！也亏了你们心里不…","so":0,"eo":0},{"surface":"宝玉","text":"却说黛玉，因宝玉烫了脸不出门，倒常在一处说话儿。这日饭后，看了两篇书，又和紫鹃作了一会针线，总闷闷不舒，便出来看庭前才迸出的新笋。不觉出了院门，来到园中，四望无人，惟见花光鸟语，信步便往怡红院来。只见几个丫头舀水，都在游廊上看画眉洗澡呢。听见房内笑声，原来是李纨、凤姐、宝钗都在这里。一见他进来，都笑道：“这不又来了两个？”黛玉笑道：“今日齐全，谁下帖子请的？”凤姐道：“我前日打发人送了两瓶茶叶给姑娘，可还好么？”黛玉道：“我正忘了，多谢…","so":0,"eo":0}]},{"chap":26,"ctitle":"第26章 蜂腰桥设言传心事 潇湘馆春困发幽情","deeds":[{"surface":"宝玉","text":"话说宝玉养过了三十三天之后，不但身体强壮，亦且连脸上疮痕平复，仍回大观园去。这也不在话下。","so":0,"eo":0},{"surface":"宝玉","text":"且说近日宝玉病的时节，贾芸带着家下小厮坐更看守，尽夜在这里，那小红同众丫环也在这里守着宝玉。彼此相见日多，渐渐的混熟了。小红见贾芸手里拿着块绢子，倒象是自己从前掉的，待要问他，又不好问。不料那和尚道士来过，用不着一切男人，贾芸仍种树去了。这件事待放下又放不下，待要问去又怕人猜疑。正是犹豫不决、神魂不定之际，忽听窗外问道：“姐姐在屋里没有？”小红闻听，在窗眼内望外一看，原来是本院的个小丫头佳蕙，因答说：“在家里呢，你进来罢。”佳蕙听了跑进…","so":0,"eo":0},{"surface":"宝玉","text":"佳惠道：“你这两日心里到底觉着怎么样，依我说，你竟家去住两日，请一个大夫来瞧瞧，吃两剂药，就好了。”小红道：“那里的话？好好儿的，家去做什么？”佳蕙道：“我想起来了，林姑娘生的弱，时常他吃药，你就和他要些来吃，也是一样。”小红道：“胡说，药也是混吃的？”佳蕙道：“你这也不是个长法儿，又懒吃懒喝的，终久怎么样？”小红道：“怕什么，还不如早些死了倒于净。”佳蕙道：“好好儿的，怎么说这些话？”小红道：“你那里知道我心里的事！”佳蕙点头，想了一…","so":0,"eo":0},{"surface":"宝玉","text":"说着自己便出房来。出了恰红院，一径往宝钗院内来，刚至沁芳亭畔，只见宝玉的奶娘李嬷嬷从那边来。小红立住，笑问道：“李奶奶，你老人家那里去了，怎么打这里来？”李嬷嬷站住，将手一拍，道：“你说，好好儿的，又看上了那个什么云哥儿雨哥儿的，这会子逼着我叫了他来。明儿叫上屋里听见，可又是不好。”小红笑道：“你老人家当真的就信着他去叫么？”李嬷嬷道：“可怎么样呢？”小红笑道：“那一个要是知好歹，就不进来才是。”李嬷嬷道：“他又不傻，为什么不进来？”小…","so":0,"eo":0},{"surface":"宝玉","text":"这里贾芸随着坠儿逶迤来至怡红院中，坠儿先进去回明了，然后方领贾芸进去。贾芸看时，只见院内略略有几点山石，种着芭蕉，那边有两只仙鹤，在松树下剔翎。一溜回廊上吊着各色笼子，笼着仙禽异鸟。上面小小五间抱厦，一色雕镂新鲜花样镉扇，上面悬着一个匾，四个大字，题道是：“怡红快绿”。贾芸想道：“怪道叫‘怡红院’，原来匾上是这四个字。”正想着，只听里面隔着纱窗子笑说道：“快进来罢，我怎么就忘了你两三个月！”贾芸听见是宝玉的声音，连忙进入房内，抬头一看，…","so":0,"eo":0},{"surface":"宝玉","text":"又进一道碧纱厨，只见小小一张填漆床上，悬着大销金撤花帐子，宝玉穿着家常衣服，着鞋，倚在床上，拿着本书。看见他进来，将书掷下，早带笑立起身来。贾芸忙上前请了安，宝玉让坐，便在下面一张椅子上坐了。宝笑道：“只从那个月见了你，我叫你往书房里来，谁知接接连连许多事情，就把你忘了。”贾芸笑道：“总是我没造化，偏又遇着叔叔欠安。叔叔如今可大安了？”宝玉道：“大好了。我倒听见说你辛苦了好几天。”贾芸道：“辛苦也是该当的。叔叔大安了，也是我们一家子的造…","so":0,"eo":0},{"surface":"宝玉","text":"那宝玉便和他说些没要紧的散话，又说道谁家的戏子好，谁家的花园好，又告诉他谁家的丫头标致，谁家的酒席丰盛，又是谁家有奇货，又是谁家有异物。那贾芸口里只得顺着他说。说了一回，见宝玉有些懒懒的了，便起身告辞。宝玉也不甚留，只说：“你明儿闲了只管来。”仍命小丫头子坠儿送出去了。","so":0,"eo":0},{"surface":"宝玉","text":"贾芸出了怡红院，见四顾无人，便慢慢的停着些走，口里一长一短和坠儿说话。先问他：“几岁了？名字叫什么？你父母在那行上？在宝叔屋里几年了？一个月多少钱？共总宝叔屋内有几个女孩子？”那坠儿见问，便一桩桩的都告诉他了。贾芸又道：“刚才那个和你说话的，他可是叫小红？”坠儿笑道：“他就叫小红。你问他作什么？”贾芸道：“方才他问你什么绢子，我倒拣了一块。”坠儿听了笑道：“他问了我好几遍，可有看见他的绢子的。我那里那么大工夫管这些事？今儿他又问我，他说…","so":0,"eo":0}]},{"chap":27,"ctitle":"第27章 滴翠亭杨妃戏彩蝶 埋香冢飞燕泣残红","deeds":[{"surface":"宝玉","text":"话说黛玉正自悲泣，忽听院门响处，只见宝钗出来了，宝玉、袭人一群人都送出来。待要上去问着宝玉，又恐当着众人问羞了宝玉不便，因而闪过一旁，让宝钗去了，宝玉等进去关了门，方转过来，尚望着门洒了几点泪。自觉无味，转身回来，无精打彩的卸了残妆。紫鹃、雪雁素日知道黛玉的情性，无事闷坐，不是愁眉，便是长叹，且好端端的不知为着什么，常常的便自泪不干的。先时还有人解劝，或怕他思父母，想家乡，受委屈，用话来宽慰。谁知后来一年一月的，竟是常常如此，把这个样儿…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝钗、迎春、探春、惜春、李执、凤姐等并大姐儿、香菱与众丫环们，都在园里玩耍，独不见黛玉，迎春因说道：“林妹妹怎么不见？好个懒丫头，这会子难道还睡觉不成？”宝钗道：“你们等着，等我去闹了他来。”说着，便撂下众人，一直往潇湘馆来。正走着，只见文官等十二个女孩子也来了，上来问了好，说了一回闲话儿，才走开。宝钗回身指道：“他们都在那里呢，你们找他们去，我找林姑娘去就来。”说着，逶迤往潇湘馆来。忽然抬头见宝玉进去了，宝钗便站住，低头想了一想：…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗外面听见这话，心中吃惊，想道：“怪道从古至今那些奸淫狗盗的人，心机都不错，这一开了，见我在这里，他们岂不躁了？况且说话的语音，大似宝玉房里的小红。他素昔眼空心大，是个头等刁钻古怪的丫头，今儿我听了他的短儿，‘人急造反，狗急跳墙’，不但生事，而且我还没趣。如今便赶着躲了料也躲不及，少不得要使个‘金蝉脱壳’的法子。”犹未想完，只听“咯吱”一声，宝钗便故意放重了脚步，笑着叫道：“颦儿，我看你往那里藏！”一面说一面故意往前赶。那亭内的小红坠…","so":0,"eo":0},{"surface":"宝玉","text":"谁知小红听了宝钗的话，便信以为真，让宝钗去远，便拉坠儿道：“了不得了，林姑娘蹲在这里，一定听了话去了！”坠儿听了，也半日不言语。小红又道：“这可怎么样呢？”坠儿道：“听见了，管谁筋疼！各人干各人的就完了。”小红道：“要是宝姑娘听见还罢了。那林姑娘嘴里又爱克薄人，心里又细，他一听见了，倘或走露了，怎么样呢？”二人正说着，只见香菱、臻儿、司棋、侍书等上亭子来了。二人只得掩住这话，且和他们玩笑。只见凤姐站在山坡上招手儿，小红便连忙弃了众人，跑…","so":0,"eo":0},{"surface":"宝玉","text":"小红听了，“扑哧”一笑。凤姐道：“你怎么笑？你说我年轻，比你能大几岁，就做你的妈了？你做春梦呢！你打听打听，这些人比你大的赶着我叫妈，我还不理呢，今儿抬举了你了。”小红笑道：“我不是笑这个，我笑奶奶认错了辈数儿了。我妈是奶奶的干女孩儿，这会子又认我做干女孩儿！”凤姐道：“谁是你妈？”李纨笑道：“你原来不认的他，他是林之孝的女孩儿。”凤姐听了十分诧异，因说道：“哦，是他的丫头啊。”又笑道：“林之孝两口子，都是锥子扎不出一声儿来的。我成日家…","so":0,"eo":0},{"surface":"宝玉","text":"如今且说黛玉，因夜间失寝，次日起来迟了，闻得众姐妹都在园中做饯花会，恐人笑他痴懒，连忙梳洗了出来。刚到了院中，只见宝玉进门，来了便笑道：“好妹妹，你昨儿告了我了没有？叫我悬了一夜的心。”黛玉便回头叫紫鹃：“把屋子收拾了，下一扇纱屉子，看那大燕子回来，把帘子放下来，拿狮子倚住。烧了香，就把炉罩上。”一面说，一面又往外走。宝玉见他这样，还认作是昨日晌午的事，那知晚间的这件公案？还打恭作揖的。黛玉正眼儿也不看，各自出了院门，一直找别的姐妹去了…","so":0,"eo":0},{"surface":"宝玉","text":"只见宝钗、探春正在那边看鹤舞，见黛玉来了，三个一同站着说话儿。又见宝玉来了，探春便笑道：“宝哥哥身上好？我整整的三天没见你了。”宝玉笑道：“妹妹身上好？我前儿还在大嫂子跟前问你呢。”探春道：“宝哥哥，你往这里来，我和你说话。”宝玉听说，便跟了他，离了钗、玉两个，到了一棵石榴树下。探春因说道：“这几天，老爷没叫你吗？”宝玉笑道：“没有叫。”探春道：“昨儿我恍惚听见说，老爷叫你出去来着。”宝玉笑道：“那想是别人听错了，并没叫我。”探春又笑道…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉笑道：“你提起鞋来，我想起故事来了。一回穿着，可巧遇见了老爷，老爷就不受用，问：‘是谁做的？’我那里敢提三妹妹，我就回说是前儿我的生日舅母给的。老爷听了是舅母给的，才不好说什么了。半日还说：‘何苦来！虚耗人力，作践绫罗，做这样的东西。’我回来告诉了袭人，袭人说：‘这还罢了，赵姨娘气的抱怨的了不得：正经亲兄弟，鞋塌拉袜塌拉的没人看见，且做这些东西！”探春听说，登时沉下脸来，道：“你说，这话糊涂到什么田地！怎么，我是该做鞋的人么？环儿难…","so":0,"eo":0}]},{"chap":28,"ctitle":"第28章 蒋玉函情赠茜香罗 薛宝钗羞笼红麝串","deeds":[{"surface":"宝玉","text":"话说林黛玉只因昨夜晴雯不开门一事，错疑在宝玉身上。次日又可巧遇见饯花之期，正在一腔无明未曾发泄，又勾起伤春愁思，因把些残花落瓣去掩埋，由不得感花伤己，哭了几声，便随口念了几句。不想宝玉在山坡上听见，先不过点头感叹，次又听到“侬今葬花人笑痴，他年葬侬知是谁？”“一朝春尽红颜老，花落人亡两不知”等句，不觉恸倒山坡上，怀里兜的落花撒了一地。试想林黛玉的花颜月貌，将来亦到无可寻觅之时，宁不心碎肠断？既黛玉终归无可寻觅之时，推之于他人，如宝钗、香…","so":0,"eo":0},{"surface":"宝玉","text":"那黛玉正自伤感，忽听山坡上也有悲声，心下想道：“人人都笑我有痴病，难道还有一个痴的不成？”抬头一看，见是宝玉，黛玉便啐道：“呸！我打量是谁，原来是这个狠心短命的。”刚说到“短命”二字，又把口掩住，长叹一声，自己抽身便走。","so":0,"eo":0},{"surface":"宝玉","text":"这里宝玉悲恸了一回，见黛玉去了，便知黛玉看见他躲开了，自己也觉无味。抖抖土起来，下山寻归旧路，往怡红院来。可巧看见黛玉在前头走．连忙赶上去，说道：“你且站着。我知道你不理我，我只说一句话，从今以后撩开手。”熏玉回头见是宝玉，待要不理他，听他说只说一句话，便道：“请说。”宝玉笑道：“两句话，说了你听不听呢？”黛玉听说，回头就走。宝玉在身后面叹道：“既有今日，何必当初？”黛玉听见这话，由不得站住，回头道：“当初怎么样？今日怎么样？”宝玉道：…","so":0,"eo":0},{"surface":"宝玉","text":"那里黛玉耳内听了这话，眼内见了这光景，心内不觉灰了大半，也不觉滴下泪来，低头不语。宝玉见这般形象，遂又说道：“我也知道我如今不好了，但只任凭我怎么不好，万不敢在妹妹跟前有错处。就有一二分错处，你或是教导我戒我下次，或骂我几句，打我几下，我都不灰心。谁知你总不理我，叫我摸不着头脑儿，少魂失魄，不知怎么样才好。就是死了也是个屈死鬼，任凭高僧高道忏悔，也不能超生，还得你说明了原故，我才得托生呢！”","so":0,"eo":0},{"surface":"宝玉","text":"黛玉听了这话，不觉将昨晚的事都忘在九霄云外了，便说道：“你既这么说，为什么我去了，你不叫丫头开门呢！”一宝玉诧异道：“这话从那里说起？我要是这么着，立刻就死了！”黛玉啐道：“大清早起‘死’呀‘活’的，也不忌讳！你说有呢就有，没有就没有，起什么誓呢！”宝玉道：“实在没有见你去，就是宝姐姐坐了一坐，就出来了。”黛玉想了一想，笑道：“是了，必是丫头们懒怠动，丧声歪气的，也是有的。”宝玉道：“想必是这个原故。等我回去问了是谁，教训教训他们就好了…","so":0,"eo":0},{"surface":"宝玉","text":"王夫人又道：“既有这个名儿，明儿就叫人买些来吃。”宝玉道：“这些药都是不中用的。太太给我三百六十两银子，我替妹妹配一料丸药，包管一料不完就好了。”王夫人道：“放屁！什么药就这么贵！”宝玉笑道：“当真的呢。我这个方子比别的不同，那个药名儿也古怪，一时也说不清，只讲那头胎紫河车，人形带叶参，三百六十两不足。龟大何首乌，千年松根茯苓胆，诸如此类的药不算为奇，只在群药里算，那为君的药，说起来，唬人一跳！前年薛大哥哥求了我一二年，我才给了他这方子…","so":0,"eo":0},{"surface":"宝玉","text":"凤姐因在里间屋里看着人放桌子，听如此说，便走来笑道：“宝兄弟不是撒谎，这倒是有的。前日薛大爷亲自和我来寻珍珠，我问他做什么，他说配药。他还抱怨说：‘不配也罢了，如今那里知道这么费事！’我问：‘什么药？’他说是宝兄弟说的方子，说了多少药，我也不记得。他又说：‘不是我就买几颗珍珠了，只是必要头上戴过的，所以才来寻几颗。要没有散的花儿，就是头上戴过的拆下来也使得。过后儿我拣好的再给穿了来。’我没法儿儿，只得把两枝珠子花儿现拆了给他。还要一块三…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉因向黛玉道：“你听见了没有？难道二姐姐也跟着我撒谎不成？”脸望着黛玉说，却拿眼睛瞟着宝钗。黛玉便拉王夫人道：“舅母听听，宝姐姐不替他圆谎，他只问着我！”王夫人也道：“宝玉很会欺负你妹妹。”宝玉笑道：“太太不知道这个原故。宝姐姐先在家里住着，薛大哥的事他也不知道，何况如今在里头住着呢？自然是越发不知道了。林妹妹才在背后，以为是我撒谎，就羞我。”","so":0,"eo":0}]},{"chap":29,"ctitle":"第29章 享福人福深还祷福 多情女情重愈斟情","deeds":[{"surface":"宝玉","text":"话说宝玉正自发怔，不想黛玉将手帕子扔了来，正碰在眼睛上，倒唬了一跳，问：“这是谁？”黛玉摇着头儿笑道；“不敢，是我失了手。因为宝姐姐要看呆雁，我比给他看，不想失了手。”宝玉揉着眼睛，待要说什么，又不好说的。","so":0,"eo":0},{"surface":"宝玉","text":"一时凤姐儿来了。因说起初一日在清虚观打醮的事来，约着宝钗、宝玉、黛玉等看戏去。宝钗笑道：“罢，罢，怪热的，什么没看过的戏！我不去。”凤姐道：“他们那里凉快，两边又有楼。咱们要去，我头几天先打发人去，把那些道士都赶出去，把楼上打扫了，挂起帘子来，一个闲人不许放进庙去，才是好呢。我已经回了太太了，你们不去，我自家去。这些日子也闷的很了，家里唱动戏，我又不得舒舒服服的看。”贾母听说，就笑道：“既这么着，我和你去。”凤姐听说，笑道：“老祖宗也去…","so":0,"eo":0},{"surface":"宝玉","text":"不多时，已到了清虚观门口。只听钟鸣鼓响，早有张法官执香披衣，带领众道土在路旁迎接。宝玉下了马，贾母的轿刚至山门以内，见了本境城隆土地各位泥塑圣像，便命往轿。贾珍带领各子弟上来迎接。凤姐儿的轿子却赶在头里先到了，带着鸳鸯等迎接上来，见贾母下了轿，忙要搀扶。可巧有个十二三岁的小道士儿，拿着个剪筒照管各处剪蜡花儿，正欲得便且藏出去，不想一头撞在凤姐儿怀里。凤姐便一扬手照脸打了个嘴巴，把那小孩子打了一个斤斗，骂道：“小野杂种！往那里跑？”那小道…","so":0,"eo":0},{"surface":"宝玉","text":"贾珍到贾母跟前，控身陪笑，说道：“张爷爷进来请安。”贾母听了，忙道：“请他来。”贾珍忙去搀过来。那张道士先呵呵笑道：“无量寿佛！老祖宗一向福寿康宁，众位奶奶姑娘纳福！一向没到府里请安，老太太气色越发好了。”贾母笑道：“老神仙你好？”张道士笑道：“托老太太的万福，小道也还康健。别的倒罢了，只记挂着哥儿，一向身上好？前日四月二十六，我这里做遮天大五的圣诞，人也来的少，东西也很干净，我说请哥儿来逛逛，怎么说不在家？”贾母说道：“果真不在家。”…","so":0,"eo":0},{"surface":"宝玉","text":"谁知宝玉解手儿去了，才来，忙上前问：“张爷爷好！”张道士也抱住问了好，又向贾母笑道：“哥儿越发发福了。”贾母道：“他外头好，里头弱。又搭着他老子逼着他念书，生生儿的把个孩子逼出病来了。”张道士道：“前日我在好几处看见哥儿写的字，做的诗，都好的了不得。怎么老爷还抱怨哥儿不大喜欢念书呢？依小道看来，也就罢了。”又叹道：“我看见哥儿的这个形容身段，言谈举动，怎么就和当日国公爷一个稿子！”说着两眼酸酸的。贾母听了，也由不得有些戚惨，说道：“正是…","so":0,"eo":0},{"surface":"宝玉","text":"贾母听说，便命宝玉摘下通灵玉来，放在盘内。那张道士兢兢业业的用蟒袱子垫着，捧出去了。","so":0,"eo":0},{"surface":"宝玉","text":"这里贾母带着众人各处游玩一回，方去上楼。只见贾珍回说：“张爷爷送了玉来。”刚说着，张道士捧着盘子走到跟前，笑道：“众人托小道的福，见了哥儿的玉，实在稀罕，都没什么敬贺的，这是他们各人传道的法器，都愿意为敬贺之礼。虽不稀罕，哥儿只留着玩耍赏人罢。”贾母听说，向盘内看时，只见也有金璜，也有玉块，或有“事事如意”，或有“岁岁平安”，皆是珠穿宝嵌、玉琢金镂，共有三五十件。因说道：“你也胡闹。他们出家人，是那里来的？何必这样？这断不能收。”张道士…","so":0,"eo":0},{"surface":"宝玉","text":"且说宝玉在楼上，坐在贾母傍边，因叫个小丫头子捧着方才那一盘子东西，将自己的玉带上，用手翻弄寻拨，件一件的挑与贾母看。贾母因看见有个赤金点翠的麒麟，便伸手拿起来，笑道：“这件东西，好象是我看见谁家的孩子也带着一个。”宝钗笑道：“史大妹妹有一个，比这小些。”贾母道：“原来是云儿有这个。”宝玉道：“他这么往我们家去住着，我也没看见？”探春笑道：“宝姐姐有心，不管什么他都记得。”黛玉冷笑道：“他在别的上头心还有限，惟有这些人带的东西上，他才是留…","so":0,"eo":0}]},{"chap":30,"ctitle":"第30章 宝钗借扇机带双敲 椿龄画蔷痴及局外","deeds":[{"surface":"宝玉","text":"话说林黛玉自与宝玉口角后也觉后悔，但又无去就他之理，因此日夜闷闷如有所失。紫鹃也看出八九，便劝道：“论前儿的事，竟是姑娘太浮躁了些。别人不知宝玉的脾气，难道咱们也不知道？为那玉也不是闹了一遭两遭了。”黛玉啐道：“呸！你倒来替人派我的不是。我怎么浮躁了？”紫鹃笑道：“好好儿的，为什么铰了那穗子？不是宝玉只有三分不是，姑娘倒有七分不是？我看他素日在姑娘身上就好，皆因姑娘小性儿，常要歪派他才这么样。”黛玉欲答话，只听院外叫门。紫鹃听了听，笑道…","so":0,"eo":0},{"surface":"宝玉","text":"那黛玉本不曾哭，听见宝玉来，由不得伤心，止不住滚下泪来。宝玉笑着走近床来道：“妹妹身上可大好了？”黛玉只顾拭泪，并不答应。宝玉因便挨在床沿上坐了，一面笑道：“我知道你不恼我，但只是我不来，叫旁人看见，倒象是咱们又拌了嘴的似的。要等他们来劝咱们，那时候儿岂不咱们倒觉生分了？不如这会子你要打要骂，凭你怎么样，千万别不理我！”说着，又把“好妹妹”叫了几十声。黛玉心里原是再不理宝玉的，这会子听见宝玉说“别叫人知道咱们拌了嘴就生分了似的”这一句话…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉两眼直瞪瞪的瞅了他半天，气的“嗳”了一声，说不出话来。见宝玉憋的脸上紫涨，便咬着牙，用指头狠命的在他额上戳了一下子，“哼”了一声，说道：“你这个……”刚说了三个字，便又叹了一口气，仍拿起绢子来擦眼泪。宝玉心里原有无限的心事，又兼说错了话，正自后悔，见黛玉戳他一下子，要说也说不出来，自叹自泣，因此自己也有所感，不觉掉下泪来。要用绢子揩拭，不想又忘了带来，便用衫袖去擦。黛玉虽然哭着，却一眼看见他穿着簇新藕合纱衫，竟去拭泪，便一面自己拭泪…","so":0,"eo":0},{"surface":"宝玉","text":"一句话没说完，只听嚷道：“好了！”宝、黛两个不防，都唬了一跳。回头看时，只见凤姐儿跑进来，笑道：“老太太在那里抱怨天，抱怨地，只叫我来瞧瞧你们好了没有，我说：‘不用瞧，过不了三天，他们自己就好了。’老太太骂我，说我懒，我来了，果然应了我的话了。也没见你们两个！有些什么可拌的，三日好了，两日恼了，越大越成了孩子了。有这会子拉着手哭的，昨儿为什么又成了‘乌眼鸡’似的呢？还不跟着我到老太太跟前，叫老人家也放点儿心呢。”说着，拉了黛玉就走。黛玉…","so":0,"eo":0},{"surface":"宝玉","text":"此时宝钗正在这里，那黛玉只一言不发，挨着贾母坐下。宝玉没什么说的，便向宝钗笑道：“大哥哥好日子，偏我又不好，没有别的礼送，连个头也不磕去。大哥哥不知道我病，倒象我推故不去似的。倘或明儿姐姐闲了，替我分辩分辩。”宝钗笑道：“这也多事，你就要去，也不敢惊动，何况身上不好。弟兄们常在一处，要存这个心倒生分了。”宝玉又笑道：“姐姐知道体谅我就好了。”又道：“姐姐怎么不听戏去？”宝钗道：“我怕热。听了两出，热的很，要走呢，客又不散；我少不得推身上…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉听见宝玉奚落宝钗，心中着实得意，才要搭言，也趁势取个笑儿，不想靓儿因找扇子，宝钗又发了两句话，他便改口说道：“宝姐姐，你听了两出什么戏？”宝钗因见黛玉面上有得意之态，一定是听了宝玉方才奚落之言，遂了他的心愿。忽又见他问这话，便笑道：“我看的是李逵骂了宋江，后来又赔不是。”宝玉便笑道：“姐姐通今博古，色色都知道，怎么连这一出戏的名儿也不知道，就说了这么一套。这叫做《负荆请罪》。”宝钗笑道：“原来这叫‘负荆请罪’！你们通今博古，才知道‘…","so":0,"eo":0},{"surface":"宝玉","text":"一时宝钗、凤姐去了，黛玉向宝玉道：“你也试着比我利害的人了。谁都象我，心拙口夯的，由着人说呢！”宝玉正因宝钗多心，自己没趣儿，又见黛玉问着他，越发没好气起来。欲待要说两句，又怕黛玉多心，说不得忍气，无精打彩，一直出来。","so":0,"eo":0},{"surface":"宝玉","text":"谁知目今盛暑之际，又当早饭已过，各处主仆人等多半都因日长神倦，宝玉背着手，到一处，一处鸦雀无声。从贾母这里出来往西，走过了穿堂便是凤姐的院落。到他院门前，只见院门掩着，知道凤姐素日的规矩，每到天热，午间要歇一个时辰的，进去不便。遂进角门，来到王夫人上房。只见几个丫头手里拿着针线，却打盹儿。王夫人在里间凉床上睡着，金钏儿坐在旁边捶腿，也斜着眼乱恍。宝玉轻轻的走到跟前，把他耳朵上的坠子一摘。金钏儿睁眼，见是宝玉，宝玉便悄俏的笑道：“就困的这…","so":0,"eo":0}]},{"chap":31,"ctitle":"第31章 撕扇子作千金一笑 因麒麟伏白首双星","deeds":[{"surface":"宝玉","text":"话说袭人见了自己吐的鲜血在地，也就冷了半截。想着往日常听人说：“少年吐血，年月不保，纵然命长终是废人了。”想起此言，不觉将素日想着后来争荣夸耀之心尽管灰了，眼中不觉的滴下泪来。宝玉见他哭了，也不觉心酸起来，因问道：“你心里觉着怎么样？”袭人勉强笑道：“好好儿的，觉怎么样呢！”宝玉的意思即刻便要叫人烫黄酒，要山羊血峒丸来。袭人拉着他的手，笑道：“你这一闹不打紧，闹起多少人来，倒抱怨我轻狂。分明人不知道，倒闹的人知道了，你也不好，我也不好。…","so":0,"eo":0},{"surface":"宝玉","text":"那天刚亮，宝玉也顾不得梳洗，忙穿衣出来，将王济仁叫来亲自确问。王济仁问其原故，不过是伤损，便说了个丸药的名字，怎么吃，怎么敷。宝玉记了，回园来依方调治，不在话下。","so":0,"eo":0},{"surface":"宝玉","text":"这日正是端阳佳节，蒲艾簪门，虎符系臂。午间王夫人治了酒席，请薛家母女等过节。宝玉见宝钗淡淡的，也不和他说话，自知是昨日的原故。王夫人见宝玉没精打彩，也只当是昨日金钏儿之事，他没好意思的，越发不理他。黛玉见宝玉懒懒的，只当是他因为得罪了宝钗的原故，心中不受用，形容也就懒懒的。凤姐昨日晚上王夫人就告诉了他宝玉、金钏儿的事，知道王夫人不喜欢，自己如何敢说笑，也就随着王夫人的气色行事，更觉淡淡的。迎春姐妹见众人没意思，也都没意思了。因此，大家坐…","so":0,"eo":0},{"surface":"宝玉","text":"那黛玉天性喜散不喜聚，他想的也有个道理。他说：“人有聚就有散，聚时喜欢，到散时岂不清冷？既清冷则生感伤，所以不如倒是不聚的好。比如那花儿开的时候儿叫人爱，到谢的时候儿便增了许多惆怅，所以倒是不开的好。”故此人以为欢喜时，他反以为悲。那宝玉的性情只愿人常聚不散，花常开不谢；及到筵散花榭，虽百万种悲伤，也就没奈何了，因此今日之筵大家无兴散了，黛玉还不觉怎么着，倒是宝玉心中闷闷不乐，回至房中，长吁短叹。","so":0,"eo":0},{"surface":"宝玉","text":"偏偏晴雯上来换衣服，不防又把扇子失了手掉在地下，将骨子跌折。宝玉叹道：“蠢才，蠢才，将来怎么样！明日你自己当家立业，难道也是这么顾前不顾后的？”晴雯冷笑道：“二爷近来气大的很，行动就给脸子瞧。前儿连袭人都打了，今儿又来寻我的不是。要踢要打凭爷去。就是跌了扇子，也算不的什么大事。先时候儿什么玻璃缸，玛瑙碗，不知弄坏了多少，也没见个大气儿，这会子一把扇子就这么着。何苦来呢！嫌我们就打发了我们，再挑好的使。好离好散的倒不好？”","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了这些话，气的浑身乱战。因说道：“你不用忙，将来横竖有散的日子！”袭人在那边早已听见，忙赶过来，向宝玉道：“好好儿的，又怎么了？可是我说的，一时我不到就有事故儿。”晴雯听了冷笑道：“姐姐既会说，就该早来呀，省了我们惹的生气。自古以来，就只是你一个人会伏侍，我们原不会伏侍。因为你伏侍的好，为什么昨儿才挨窝心脚啊！我们不会伏侍的，明日还不知犯什么罪呢？”袭人听了这话，又是恼，又是愧，待要说几句，又见宝玉已经气的黄了脸，少不得自己忍了性…","so":0,"eo":0},{"surface":"宝玉","text":"袭人羞得脸紫涨起来，想想原是自己把话说错了。宝玉一面说道：“你们气不忿，我明日偏抬举他。”袭人忙拉了宝玉的手道：“他一个糊涂人，你和他分证什么？况且你素日又是有担待的。比这大的过去了多少，今日是怎么了？”晴雯冷笑道：“我原是糊涂人，那里配和我说话！我不过奴才罢咧！”袭人听说，道：“姑娘到底是和我拌嘴，是和二爷拌嘴呢？要是心里恼我，你只和我说，不犯着当着二爷吵；要是恼二爷，不该这么吵的万人知道。我才也不过为了事，进来劝开了，大家保重，姑娘…","so":0,"eo":0},{"surface":"宝玉","text":"晴雯听了这话，不觉越伤起心来，含泪说道：“我为什么出去？要嫌我，变着法儿打发我去也不能够的。”宝玉道：“我何曾经过这样吵闹？一定是你要出来了。不如回太太打发你去罢。”说着，站起来就要走。袭人忙回身拦住，笑道：“往那里去？”宝玉道：“回太太去！”袭人笑道：“好没意思！认真的去回，你也不怕臊了他！就是他认真要去，也等把这气下去了，等无事中说话儿回了太太也不迟。这会子急急的当一件正经事去回，岂不叫太太犯疑？”宝玉道：“太太必不犯疑，我只明说是…","so":0,"eo":0}]},{"chap":32,"ctitle":"第32章 诉肺腑心迷活宝玉 含耻辱情烈死金钏","deeds":[{"surface":"宝玉","text":"话说宝玉见那麒麟，心中甚是欢喜，便伸手来拿，笑道：“亏你拣着了。你是怎么拾着的？”湘云笑道：“幸而是这个。明日倘或把印也丢了，难道也就罢了不成？”宝玉笑道：“倒是丢了印平常，若丢了这个，我就该死了。”","so":0,"eo":0},{"surface":"宝玉","text":"袭人倒了茶来与湘云吃，一面笑道：“大姑娘，我前日听见你大喜呀。”湘云红了脸，扭过头去吃茶，一声也不答应。袭人笑道：“这会子又害臊了？你还记得那几年，咱们在西边暖阁上住着，晚上你和我说的话？那会子不害臊，这会子怎么又臊了？”湘云的脸越发红了，勉强笑道：“你还说呢，那会子咱们那么好，后来我们太太没了，我家去住了一程子，怎么就把你配给了他。我来了，你就不那么待我了。”袭人也红了脸，笑道：“罢哟，先头里，姐姐长，姐姐短，哄着我替你梳头洗脸，做这…","so":0,"eo":0},{"surface":"宝玉","text":"一面说，一面打开绢子，将戒指递与袭人。袭人感谢不尽，因笑道：“你前日送你姐姐们的，我已经得了。今日你亲自又送来，可见是没忘了我。就为这个试出你来了。戒指儿能值多少，可见你的心真。”史湘云道：“是谁给你的？”袭人道：“是宝姑娘给我的。”湘云叹道：“我只当林姐姐送你的，原来是宝姐姐给了你。我天天在家里想着，这些姐姐们，再没一个比宝姐姐好的。可惜我们不是一个娘养的。我但凡有这么个亲姐姐，就是没了父母，也没妨碍的！”说着，眼圈儿就红了。宝玉道：…","so":0,"eo":0},{"surface":"宝玉","text":"袭人道：“且别说玩话，正有一件事要求你呢。”史湘云便问：“什么事？”袭人道：“有一双鞋，抠了垫心子，我这两日身上不好，不得做，你可有工夫替我做做？”史湘云道：“这又奇了。你家放着这些巧人不算，还有什么针线上的、裁剪上的，怎么叫我做起来？你的活计叫人做，谁好意思不做呢？”袭人笑道：“你又糊涂了。你难道不知道，我们这屋里的针线，是不要那些针线上的人做的。”史湘云听了，便知是宝玉的鞋，因笑道：“既这么说，我就替你做做罢。只是一件，你的我才做，…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，有人来回说：“兴隆街的大爷来了，老爷叫二爷出去会。”宝玉听了，便知贾雨村来了，心中好不自在。袭人忙去拿衣服。宝玉一面登着靴子，一面抱怨道：“有老爷和他坐着就罢了，回回定要见我！”史湘云一边摇着扇子，笑道：“自然你能迎宾接客，老爷才叫你出去呢。”宝玉道：“那里是老爷？都是他自己要请我见的。”湘云笑道：“‘主雅客来勤’，自然你有些警动他的好处，他才要会你。”宝玉道：“罢，罢，我也不过俗中又俗的一个俗人罢了，并不愿和这些人来往。”湘云…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，大觉逆耳，便道：“姑娘请别的屋里坐坐罢，我这里仔细腌了你这样知经济的人！”袭人连忙解说道：“姑娘快别说他。上回也是宝姑娘说过一回，他也不管人脸上过不去，啐了一声，拿起脚来就走了。宝姑娘的话也没说完，见他走了，登时羞的脸通红，说不是，不说又不是。幸而是宝姑娘，那要是林姑娘，不知又闹的怎么样、哭的怎么样呢！提起这些话来，宝姑娘叫人敬重。自己过了一会子去了，我倒过不去，只当他恼了，谁知过后还是照旧一样，真真是有涵养、心地宽大的。谁知…","so":0,"eo":0},{"surface":"宝玉","text":"原来黛玉知道史湘云在这里，宝玉一定又赶来，说麒麟的原故。因心下忖度着，近日宝玉弄来的外传野史，多半才子佳人，都因小巧玩物上撮合，或有鸳鸯，或有凤凰，或玉环金佩，或鲛帕鸾绦，皆由小物而遂终身之愿。今忽见宝玉也有麒麟，便恐借此生隙，同湘云也做出那些风流佳事来。因而悄悄走来，见机行事，以察二人之意。不想刚走进来，正听见湘云说“经济”一事，宝玉又说“林妹妹不说这些混账话，要说这话，我也和他生分了”。黛玉听了这话，不觉又喜又惊，又悲又叹。所喜者，…","so":0,"eo":0},{"surface":"宝玉","text":"这里宝玉忙忙的穿了衣裳出来，忽见黛玉在前面慢慢的走着，似乎有拭泪之状，便忙赴着上来笑道：“妹妹往那里去？怎么又哭了？又是谁得罪了你了？”黛玉回头见是宝玉，便勉强笑道：“好好的，我何曾哭来。”宝玉笑道：“你瞧瞧，眼睛上的泪珠儿没干，还撒谎呢。”一面说，一面禁不住抬起手来，替他拭泪。黛玉忙向后退了几步，说道：“你又要死了！又这么动手动脚的。”宝玉笑道：“说话忘了情，不觉的动了手，也就顾不得死活。”黛玉道：“死了倒不值什么，只是丢下了什么‘金…","so":0,"eo":0}]},{"chap":33,"ctitle":"第33章 手足眈眈小动唇舌 不肖种种大承苔挞","deeds":[{"surface":"宝玉","text":"原来宝玉会过雨村回来，听见金钏儿含羞自尽，心中早已五内摧伤，进来又被王夫人数说教训了一番，也无可回说。看见宝钗进来，方得便走出，茫然不知何往，背着手，低着头，一面感叹，一面慢慢的信步走至厅上。刚转过屏门，不想对面来了一人正往里走，可巧撞了个满怀。只听那人喝一声：“站住！”宝玉唬了一跳，抬头看时，不是别人，却是他父亲。早不觉倒抽了一口凉气，只得垂手一旁站着。贾政道：“好端端的，你垂头丧气的什么？方才雨村来了要见你，那半天才出来。既出来了，…","so":0,"eo":0},{"surface":"宝玉","text":"贾政听了这话，又惊又气，即命唤宝玉出来。宝玉也不知是何缘故，忙忙赶来，贾政便问：“该死的奴才！你在家不读书也罢了，怎么又做出这些无法无天的事来！那琪官现是忠顺王爷驾前承奉的人，你是何等草莽，无故引逗他出来，如今祸及于我！”宝玉听了，唬了一跳，忙回道：“实在不知此事。究竟‘琪官’两个字，不知为何物，况更加以‘引逗’二字！”说着便哭。贾政未及开口，只见那长府官冷笑道：“公子也不必隐饰。或藏在家，或知其下落，早说出来，我们也少受些辛苦，岂不念…","so":0,"eo":0},{"surface":"宝玉","text":"贾政此时气得目瞪口歪，一面送那官员，一面回头命宝玉：“不许动！回来有话问你！”一直送那官去了。才回身时，忽见贾环带着几个小厮一阵乱跑。贾政喝命小厮：“给我快打！”贾环见了他父亲，吓得骨软筋酥，赶忙低头站住。贾政便问：“你跑什么？带着你的那些人都不管你，不知往那里去，由你野马一般！”喝叫：“跟上学的人呢？”贾环见他父亲甚怒，便乘机说道：“方才原不曾跑，只因从那井边一过，那井里淹死了一个丫头，我看脑袋这么大，身子这么粗，泡的实在可怕，所以才…","so":0,"eo":0},{"surface":"宝玉","text":"话未说完，把个贾政气得面如金纸，大叫：“拿宝玉来！”一面说，一面便往书房去，喝命：“今日再有人来劝我，我把这冠带家私，一应就交与他和宝玉过去！我免不得做个罪人，把这几根烦恼鬓毛剃去，寻个干净去处自了，也免得上辱先人，下生逆子之罪！”众门客仆从见贾政这个形景，便知又是为宝玉了，一个个咬指吐舌，连忙退出。贾政喘吁吁直挺挺的坐在椅子上，满面泪痕，一叠连声：“拿宝玉来！拿大棍拿绳来！把门都关上！有人传信到里头去，立刻打死！”众小厮们只得齐齐答应…","so":0,"eo":0},{"surface":"宝玉","text":"那宝玉听见贾政吩咐他“不许动”，早知凶多吉少，那里知道贾环又添了许多的话？正在厅上旋转，怎得个人往里头捎信，偏偏的没个人来，连焙茗也不知在那里。正盼望时，只见一个老妈妈出来。宝玉如得了珍宝，便赶上来拉他，说道：“快进去告诉，老爷要打我呢！快去，快去！要紧，要紧！”宝玉一则急了说话不明白，二则老婆子偏偏又耳聋，不曾听见是什么话，把“要紧”二字只听做“跳井”二字，便笑道：“跳井让他跳去，二爷怕什么？”宝玉见是个聋子，便着急道：“你出去叫我的…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉急的手脚正没抓寻处，只见贾政的小厮走来，逼着他出去了。贾政一见，眼都红了，也不暇问他在外流荡优伶，表赠私物，在家荒疏学业，逼淫母婢，只喝命：“堵起嘴来，着实打死！”小厮们不敢违，只得将宝玉按在凳上，举起大板，打了十来下。宝玉自知不能讨饶，只是呜呜的哭。贾政还嫌打的轻，一脚踢开掌板的，自己夺过板子来，狠命的又打了十几下。宝玉生来未经过这样苦楚，起先觉得打的疼不过还乱嚷乱哭，后来渐渐气弱声嘶，呜咽不出。众门客见打的不祥了，赶着上来，恳求…","so":0,"eo":0},{"surface":"宝玉","text":"贾政正要在打，一见王夫人进来，更加火上浇油，那板子越下去的又狠又快。按宝玉的两个小厮忙松手走开，宝玉早已动弹不得了。贾政还欲打时，早被王夫人抱住板子。贾政道：“罢了，罢了！今日必定要气死我才罢！”王夫人哭道：“宝玉虽然该打，老爷也要保重。且炎暑天气，老太太身上又不大好，打死宝玉事小，倘或老太太一时不自在了，岂不事大？”贾政冷笑道：“倒休提这话！我养了这不肖的孽障，我已不孝；平昔教训他一番，又有众人护持。不如趁今日结果了他的狗命，以绝将来…","so":0,"eo":0},{"surface":"宝玉","text":"贾政听了此话，不觉长叹一声，向椅上坐了，泪如雨下。王夫人抱着宝玉，只见他面白气弱，底下穿着一条绿纱小衣，一片皆是血渍。禁不住解下汗巾去，由腿看至臀股，或青或紫，或整或破，竟无一点好处，不觉失声大哭起“苦命的儿”来。因哭出“苦命儿”来，又想起贾珠来，便叫着贾珠哭道：“若有你活着，便死一百个我也不管了！”此时里面的人闻得王夫人出来，李纨、凤姐及迎、探妹妹两个也都出来了。王夫人哭着贾珠的名字，别人还可，惟有李纨禁不住也抽抽搭搭的哭起来了。贾政…","so":0,"eo":0}]},{"chap":34,"ctitle":"第34章 情中情因情感妹妹 错里错以错劝哥哥","deeds":[{"surface":"宝玉","text":"话说袭人见贾母、王夫人等去后，便走来宝玉身边坐下，含泪问他：“怎么就打到这步田地？”宝玉叹气说道：“不过为那些事，问他做什么！只是下半截疼的很，你瞧瞧，打坏了那里？”袭人听说，便轻轻的伸手进去，将中衣脱下，略动一动，宝玉便咬着牙嗳哟，袭人连忙停住手，如此三四次，才褪下来了。袭人看时，只见腿上半段青紫，都有四指阔的僵痕高起来。袭人咬着牙说道：“我的娘，怎么下这般的狠手！你但凡听我一句话，也不到这个分儿。幸而没动筋骨，倘或打出个残疾来，可叫…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，只听丫鬟们说：“宝姑娘来了。”袭人听见，知道穿不及中衣，便拿了一床夹纱被替宝玉盖了。只见宝钗手里托着一丸药走进来，向袭人说道：“晚上把这药用酒研开，替他敷上，把那淤血的热毒散开就好了。”说毕，递与袭人。又问：“这会子可好些？”宝玉一面道谢，说：“好些了。”又让坐。宝钗见他睁开眼说话，不象先时，心中也宽慰了些，便点头叹道：“早听人一句话，也不至有今日。别说老太太、太太心疼，就是我们看着，心里也……”刚说了半句，又忙咽住，不觉眼圈微…","so":0,"eo":0},{"surface":"宝玉","text":"正想着，只听宝钗问袭人道：“怎么好好的动了气，就打起来了？”袭人便把焙茗的话悄悄说了。宝玉原来还不知贾环的话，见袭人说出，方才知道。因又拉上薛蟠，惟恐宝钗沉心，忙又止住袭人道：“薛大哥从来不是这样，你们别混猜度。”宝钗听说，便知宝玉是怕他多心，用话拦袭人。因心中暗暗想道：“打得这个形象，疼还顾不过来，还这样细心，怕得罪了人。你既这样用心，何不在外头大事上做工夫，老爷也欢喜了，也不能吃这样亏。你虽然怕我沉心所以拦袭人的话，难道我就不知我哥…","so":0,"eo":0},{"surface":"宝玉","text":"袭人抽身回来，心内着实感激宝钗。进来见宝玉沉思默默，似睡非睡的模样，因而退出房外栉沐。宝玉默默的躺在床上，无奈臀上作痛，如针挑刀挖一般，更热如火炙，略展转时，禁不住“嗳哟”之声。那时天色将晚，因见袭人去了，却有两三个丫鬟伺候，此时并无呼唤之事，因说道：“你们且去梳洗，等我叫时再来。”众人听了，也都退出。","so":0,"eo":0},{"surface":"宝玉","text":"这里宝玉昏昏沉沉，只见蒋玉函走进来了，诉说忠顺府拿他之事。一时又见金钏儿进来，哭说为他投井之情。宝玉半梦半醒，刚要诉说前情，忽又觉有人推他，恍恍惚惚听得悲切之声。宝玉从梦中惊醒，睁眼一看，不是别人，却是黛玉。犹恐是梦，忙又将身子欠起来，向脸上细细一认，只见他两个眼睛肿得桃儿一般，满面泪光，不是黛玉却是那个！宝玉还欲看时，怎奈下半截疼痛难禁，支持不住，便“嗳哟”一声仍旧倒下，叹了口气说道：“你又做什么来了，太阳才落，那地上还是怪热的，倘或…","so":0,"eo":0},{"surface":"宝玉","text":"此时黛玉虽不是嚎啕大哭，然越是这等无声之泣，气噎喉堵，更觉利害。听了宝玉这些话，心中提起万句言词，要说时却不能说得半句。半天，方抽抽噎噎的道：“你可都改了罢！”宝玉听说，便长叹一声道：“你放心。别说这样话。我便为这些人死了，也是情愿的。”","so":0,"eo":0},{"surface":"宝玉","text":"一句话未了，只见院外人说：“二奶奶来了。”黛玉便知是凤姐来了，连忙立起身，说道：“我从后院子里去罢，回来再来。”宝玉一把拉住道：“这又奇了，好好的怎么怕起他来了？”黛玉急得跺脚，悄悄的说道：“你瞧瞧我的眼睛！又该他们拿咱们取笑儿了。”宝玉听说，赶忙的放了手。黛玉三步两步转过床后，刚出了后院，凤姐从前头已进来了，问宝玉：“可好些了？想什么吃？叫人往我那里取去。”接着薛姨妈又来了。一时贾母又打发了人来。","so":0,"eo":0},{"surface":"宝玉","text":"至掌灯时分，宝玉只喝了两口汤，便昏昏沉沉的睡去。接着周瑞媳妇、吴新登媳妇、郑好时媳妇这几个有年纪长来往的，听见宝玉捱了打，也都进来。袭人忙迎出来，悄悄的笑道：“婶娘们略来迟了一步，二爷睡着了。”说着，一面陪他们到那边屋里坐着，倒茶给他们吃。那几个媳妇子都悄悄的坐了一回，向袭人说：“等二爷醒了，你替我们说罢。”袭人答应了，送他们出去。刚要回来，只见王夫人使个老婆子来说：“太太叫一个跟二爷的人呢。”袭人见说，想了一想，便回身悄悄的告诉晴雯、…","so":0,"eo":0}]},{"chap":35,"ctitle":"第35章 白玉钏亲尝莲叶羹 黄金莺巧结梅花络","deeds":[{"surface":"宝玉","text":"话说宝钗分明听见黛玉克薄他，因惦记着母亲哥哥，并不回头，一径去了。这里黛玉仍旧立于花阴之下，远远的却向怡红院内望着。只见李纨、迎春、探春、惜春并丫鬟人等，都向怡红院内去过之后，一起一起的散尽了，只不见凤姐儿来。心里自己盘算说道：“他怎么不来瞧瞧宝玉呢？便是有事缠住了，他必定也是要来打个花胡哨，讨老太太、太太的好儿才是呢。今儿这早晚不来，必有原故。”一面猜疑，一面抬头再看时，只见花花簇簇一群人，又向恰红院内来了。定睛看时，却是贾母搭着凤姐…","so":0,"eo":0},{"surface":"宝玉","text":"这里薛姨妈和宝钗进园来看宝玉。到了怡红院中，只见抱厦里外回廊上许多丫头老婆站着，便知贾母等都在这里。母女两个进来，大家见过了。只见宝玉躺在榻上，薛姨妈问他：“可好些？”宝玉忙欲欠身，口里答应着：“好些。”又说：“只管惊动姨娘、姐姐，我当不起。”薛姨妈忙扶他睡下，又问他：“想什么，只管告诉我。”宝玉笑道：“我想起来，自然和姨娘要去。”王夫人又问：“你想什么吃？回来好给你送来。”宝玉笑道：“也倒不想什么吃。倒是那一回做的那小荷叶儿小莲蓬儿的…","so":0,"eo":0},{"surface":"宝玉","text":"薛姨妈先接过来瞧时，原来是个小匣子，里面装着四副银模子，都有一尺多长，一寸见方。上面凿着豆子大小，也有菊花的，也有梅花的，也有莲蓬的，也有菱角的：共有三四十样，打的十分精巧。因笑向贾母王夫人道：“你们府上也都想绝了，吃碗汤还有这些样子。要不说出来，我见了这个，也不认得是做什么用的。”凤姐儿也不等人说话，便笑道：“姑妈不知道：这是旧年备膳的时候儿，他们想的法儿。不知弄什么面印出来，借点新荷叶的清香，全仗着好汤，我吃着究竟也没什么意思。谁家…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗旁笑道：“我来了这么几年，留神看起来，二嫂子凭他怎么巧，再巧不过老太太。”贾母听说，便答道：“我的儿，我如今老了，那里还巧什么？当日我象凤丫头这么大年纪，比他还来得呢。他如今虽说不如我，也就算好了。比你姨娘强远了！你姨娘可怜见的，不大说话，和木头似的，公婆跟前就不献好儿。凤儿嘴乖，怎么怨得人疼他。”宝玉笑道：要这么说，不大说话的就不疼了？”贾母道：“不大说话的，又有不大说话的可疼之处，嘴乖的也有一宗可嫌的，倒不如不说的好。”宝玉笑道…","so":0,"eo":0},{"surface":"宝玉","text":"忽有人来请吃饭，贾母方立起身来，命宝玉：“好生养着罢。”把丫头们又嘱咐了一回，方扶着凤姐儿，让着薛姨妈，大家出房去了。犹问：“汤好了不曾？”又问薛姨妈等：“想什么吃，只管告诉我，我有本事叫凤丫头弄了来咱们吃。”薛姨妈笑道：“老太太也会怄他，时常他弄了东西来孝敬，究竟又吃不多儿。”凤姐儿笑道：“姑妈倒别这么说。我们老祖宗只是嫌人肉酸，要不嫌人肉酸，早已把我还吃了呢！”一句话没说了，引的贾母众人都哈哈的大笑起来。宝玉在屋里也掌不住笑了。袭人…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉伸手拉着袭人笑道：“你站了这半日，可乏了。”一面说，一面拉他身旁坐下。袭人笑道：“可是又忘了，趁宝姑娘在院子里，你和他说，烦他们莺儿来打上几根绦子。”宝玉笑道：“亏了你提起来。”说着，便仰头向窗外道：“宝姐姐，吃过饭叫莺儿来，烦他打几根绦子，可得闲儿？”宝钗听见，回头道：“是了，一会儿就叫他来。”贾母等尚未听真，都止步问宝钗何事。宝钗说明了，贾母便说道：“好孩子，你叫他来替你兄弟打几根罢。你要人使，我那里闲的丫多着的呢。你喜欢谁，只…","so":0,"eo":0},{"surface":"宝玉","text":"少顷饭至，众人调放了桌子。凤姐儿用手巾裹了一把牙箸，站在地下，笑道：“老祖宗和姨妈不用让，还听我说就是了。”贾母笑向薛姨妈道：“我们就是这样。”薛姨妈笑着应了。于是凤姐放下四双箸：上面两双是贾母、薛姨妈，两边是宝钗湘云的。王夫人、李宫裁等都站在地下，看着放菜。凤姐先忙着要干净家伙来，替宝玉拣菜。少顷，莲叶汤来了，贾母看过了，王夫人回头见玉钏儿在那里，便命玉钏儿与宝玉送去。凤姐道：“他一个人难拿。”可巧莺儿和同喜都来了，宝钗知道他们已吃了…","so":0,"eo":0},{"surface":"宝玉","text":"袭人、麝月、秋纹三个人正和宝玉玩笑呢，见他两个来了，都忙起来笑道：“你们两个来的怎么碰巧，一齐来了。”一面说，一面接过来。玉钏儿便向一张杌子上坐下，莺儿不敢坐，袭人便忙端了个脚踏来，莺儿还不敢坐。宝玉见莺儿来了，却倒十分欢喜。见了玉钏儿，便想起他姐姐金钏儿来了，又是伤心，又是惭愧，便把莺儿丢下，且和玉钏儿说话。袭人见把莺儿不理，恐莺儿没好意思的，又见莺儿不肯坐，便拉了莺儿出来，到那边屋里去吃茶说话儿去了。","so":0,"eo":0}]},{"chap":36,"ctitle":"第36章 绣鸳鸯梦兆绛芸轩 识分定情悟梨香院","deeds":[{"surface":"宝玉","text":"话说贾母自王夫人处回来，见宝玉一日好似一日，心中自是欢喜。因怕将来贾政又叫他，遂命人将贾政的亲随小厮头儿唤来，吩咐：“以后倘有会人待客诸样的事，你老爷要叫宝玉，你不用上来传话，就回他说我说的，一则打重了，得着实将养几个月才走得，二则他的星宿不利，祭了星，不见外人，过了八月，才许出二门。”那小厮头儿听了，领命而去。贾母又命李嬷嬷、袭人等来，将此话说与宝玉，使他放心。那宝玉素日本就懒与士大夫诸男人接谈，又最厌峨冠礼服贺吊往还等事，今日得了这…","so":0,"eo":0},{"surface":"宝玉","text":"王夫人又问道：“正要问你：如今赵姨娘、周姨娘的月例多少？”凤姐道：“那是定例，每人二两。赵姨娘有环兄弟的二两，共是四两，另外四串钱。”王夫人道：“月月可都按数给他们？”凤姐见问得奇，忙道：“怎么不按数给呢！”王夫人道：“前儿恍惚听见有人抱怨，说短了一串钱，什么原故？”凤姐忙笑道：“姨娘们的丫头月例，原是人各一吊钱，从旧年他们外头商量的，姨娘们每位丫头，分例减半，人各五百钱。每位两个丫头，所以短了一吊钱。这事其实不在我手里，我倒乐得给他们…","so":0,"eo":0},{"surface":"宝玉","text":"薛姨妈笑道：“你们只听凤丫头的嘴，倒象倒了核桃车子似的。账也清楚，理也公道。”凤姐笑道：“姑妈，难道我说错了吗？”薛姨妈笑道：“说的何尝错，只是你慢着些儿说不省力些？”凤姐才要笑，忙又忍住了，听王夫人示下。王夫人想了半日，向凤姐道：“明儿挑一个丫头送给老太太使唤，补袭人，把袭人的一分裁了。把我每月的月例，二十两银子里拿出二两银子一吊钱来，给袭人去。以后凡事有赵姨娘、周姨娘的，也有袭人的，只是袭人的这一分，都从我的分例上匀出来，不必动官中…","so":0,"eo":0},{"surface":"宝玉","text":"却说薛姨妈等这里吃毕西瓜，又说了一回闲话儿，各自散去。宝钗与黛玉回至园中，宝钗要约着黛玉往藕香榭去，黛玉因说还要洗澡，便各自散了。宝钗独自行来，顺路进了恰红院，竟欲寻宝玉去说话儿，以解午倦。不想步入院中，鸦雀无闻，一并连两只仙鹤在芭蕉下都睡着了。宝钗便顺着游廊，来至房中。只见外间床上横三竖四，都是丫头们睡觉。转过十锦棍子，来至宝玉的房内，宝玉在床上睡着了，袭人坐在身旁，手里做针线，傍边放着一柄白犀麈。","so":0,"eo":0},{"surface":"宝玉","text":"不想黛玉因遇见湘云，约他来与袭人道喜，二人来至院中。见静悄悄的，湘云便转身先到厢房里去找袭人去了。那黛玉却来至窗外，隔着窗纱往里一看，只见宝玉穿着银红纱衫子，随便睡着在床上，宝钗坐在身旁做针线，傍边放着蝇刷子。黛玉见了这个景况，早已呆了，连忙把身子一躲，半日又握着嘴笑，却不敢笑出来，便招手儿叫湘云。湘云见他这般，只当有什么新闻，忙也来看，才要笑，忽然想起宝钗素日待他厚道，便忙掩住口。知道黛玉得里不让人，怕他取笑，便忙拉过他来，道：“走罢…","so":0,"eo":0},{"surface":"宝玉","text":"这里宝钗只刚做了两三个花瓣，忽见宝玉在梦中喊骂，说：“和尚道士的话如何信得？什么‘金玉姻缘’？我偏说‘木石姻缘’！”宝钗听了这话，不觉怔了。忽见袭人走进来，笑道：“还没醒呢吗？”宝钗摇头。袭人又笑道：“我才碰见林姑娘、史大姑娘，他们进来了么？”宝钗道：“没见他们进来。”因向袭人笑道：“他们没告诉你什么？”袭人红了脸，笑道：“总不过是他们那些玩话，有什么正经说的。”宝钗笑道：“今儿他们说的可不是玩话，我正要告诉你呢，你又忙忙的出去了。”一…","so":0,"eo":0},{"surface":"宝玉","text":"及见过王夫人回来，宝玉已醒，问起原故，袭人且含糊答应。至夜间人静，袭人方告诉了。宝玉喜不自禁，又向他笑道：“我可看你回家去不去了！那一回往家里走了一趟，回来就说你哥哥要赎你，又说在这里没着落，终久算什么，说那些无情无义的生分话唬我。从今我可看谁来敢叫你去？”袭人听了，冷笑道：“你倒别这么说。从此以后，我是太太的人了，我要走，连你也不必告诉，只回了太太就走。”宝玉笑道：“就算我不好，你回了太太去了，叫别人听见说我不好，你去了，你有什么意思…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听至浓快处，见他不说了，便笑道：“人谁不死？只要死的好。那些须眉浊物只听见‘文死谏’‘武死战’这二死是大丈夫的名节，便只管胡闹起来。那里知道有昏君，方有死谏之臣，只顾他邀名，猛拚一死，将来置君父于何地？必定有刀兵，方有死战，他只顾图汗马之功，猛拚一死，将来弃国于何地？”袭人不等说完，便道：“古时候儿这些人，也因出于不得巳他才死啊。”宝玉道：“那武将要是疏谋少略的，他自己无能，白送了性命，这难道也是不得已么？那文官更不比武官了，他念两…","so":0,"eo":0}]},{"chap":37,"ctitle":"第37章 秋爽斋偶结海棠社 蘅芜院夜拟菊花题","deeds":[{"surface":"宝玉","text":"话说史湘云回家后，宝玉等仍不过在园中嬉游吟咏不提。","so":0,"eo":0},{"surface":"宝玉","text":"且说贾政，自元妃归省之后，居官更加勤慎，以期仰答皇恩。皇上见他人品端方，风声清肃，虽非科第出身，却是书香世代，因特将他点了学差，也无非是选拔真才之意。这贾政只得奉了旨，择于八月二十日起身。是日拜别过宗祠及贾母，便起身而去。宝玉等如何送行，以及贾政出差外面诸事，不及细述。","so":0,"eo":0},{"surface":"宝玉","text":"单表宝玉，自贾政起身之后，每日在园中任意纵性游荡，真把光阴虚度，岁月空添，这日甚觉无聊，便往贾母、王夫人处来混了一混，仍旧进园来了。刚换了衣裳，只见翠墨进来，手里拿着一幅花笺，送与他看。宝玉因道：“可是我忘了，才要瞧瞧三妹妹去，你来的正好。可好些了？”翠墨道：“姑娘好了，今儿也不吃药了，不过是冷着一点儿。”宝玉听说，便展开花笺看时，上面写道：","so":0,"eo":0},{"surface":"宝玉","text":"妹探谨启二兄文几：前夕新霁，月色如洗，因惜清景难逢，未忍就卧，漏已三转，犹徘徊桐槛之下，竟为风露所欺，致获采薪之患。昨亲劳抚嘱，已复遣侍儿问切，兼以鲜荔并真卿墨迹见赐，抑何惠爱之深耶！今因伏几处默，忽因历来古人，处名攻利夺之场，犹置些山滴水之区，远招近揖，投辖攀辕，务结二三同志，盘恒其中，或竖词坛，或开中社，虽因一时之偶兴，每成千古之佳谈。妹虽不才，幸叨陪泉石之间，兼幕薛、林雅调。风庭月榭，惜末宴集诗人；帘杏溪桃，或可醉飞吟盏。孰谓雄才…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看了，不觉喜的拍手笑道：“倒是三妹妹高雅，我如今就去商议。”一面说，一面就走。翠墨跟在后面。刚到了沁芳亭，只见园中后门上值日的婆子手里拿着一个字帖儿走来。见了宝玉，便迎上去，口内说道：“芸哥儿请安，在后门等着呢。这是叫我送来的。”宝玉打开看时，写道：","so":0,"eo":0},{"surface":"宝玉","text":"宝玉看了，笑问道：“他独来了，还有什么人？”婆子道：“还有两盆花儿。”宝玉道：“你出去说，我知道了，难为他想着。你就把花儿送到我屋里去就是了。”","so":0,"eo":0},{"surface":"宝玉","text":"一面说，一面同翠墨往秋爽斋来。只见宝钗、黛玉、迎春、惜春已都在那里了。众人见他进来，都大笑说：“又来了一个。”探春笑道：“我不算俗，偶然起了个念头，写了几个帖儿试一试，谁知一招皆到。”宝玉笑道：“可惜迟了，早该起个社的。”黛玉说道：“此时还不算迟，也没什么可惜，但只你们只管起社，可别算我，我是不敢的。”迎春笑道：“你不敢，谁还敢呢？”宝玉道：“这是一件正经大事，大家鼓舞起来，别你谦我让的。各有主意只管说出来，大家评论。宝姐姐也出个主意，…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉道：“既然定要起诗社，咱们就是诗翁了，先把这些姐妹叔嫂的字样改了才不俗。”李纨道：“极是。何不起个别号，彼此称呼倒雅？我是定了‘稻香老农’，再无人占的。”探春笑道：“我就是‘秋爽居士’罢。”宝玉道：“‘居士’‘主人’，到底不雅，又累赘。这里梧桐芭蕉尽有，或指桐蕉起个倒好。”探春笑道：“有了，我却爱这芭蕉，就称‘蕉下客’罢。”众人都道别致有趣。黛玉笑道：“你们快牵了他来，炖了肉脯子来吃酒。”众人不解，黛玉笑道：“庄子说的‘蕉叶覆鹿’，…","so":0,"eo":0}]},{"chap":38,"ctitle":"第38章 林潇湘魁夺菊花诗 薛蘅芜讽和螃蟹咏","deeds":[{"surface":"宝玉","text":"说着，一齐进了亭子。献过茶，凤姐忙安放杯箸。上面一桌，贾母、薛姨妈、宝钗、黛玉、宝玉；东边一桌，湘云、王夫人、迎、探、惜。西边靠门一小桌，李纨和凤姐，虚设坐位，二人皆不敢坐，只在贾母、王夫人两桌上伺候。凤姐吩咐：“螃蟹不可多拿来，仍旧放在蒸笼里，拿十个来，吃了再拿。”一面又要水洗了手，站在贾母跟前剥蟹肉。头次让薛姨妈，薛姨妈道：“我自己掰着吃香甜，不用人让。”凤姐便奉与贾母。二次的便与宝玉。又说：“把酒烫得滚热的拿来。”又命小丫头们去取…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉独不敢多吃，只吃了一点夹子肉就下来了。贾母一时也不吃了。大家都洗了手。也有看花的，也有弄水看鱼的，游玩了一回。王夫人因问贾母：“这里风大，才又吃了螃蟹，老太太还是回屋里去歇歇罢。若高兴，明日再来逛逛。”贾母听了，笑道：“正是呢。我怕你们高兴，我走了，又怕扫了你们的兴，既这么说，咱们就都去罢。”回头嘱咐湘云：“别让你宝哥哥多吃了。”湘云答应着。又嘱咐湘云、宝钗二人说：“你们两个也别多吃了。那东西虽好吃，不是什么好的，吃多了肚子疼。”二…","so":0,"eo":0},{"surface":"宝玉","text":"湘云便取了诗题，用针绾在墙上。众人看了，都说：“新奇！只怕做不出来。”湘云又把不限韵的缘故说了一番，宝玉道：“这才是正理。我也最不喜限韵。”黛玉因不大吃酒，又不吃螃蟹，自命人掇了一个绣墩，倚栏坐着，拿着钓杆钓鱼。宝钗手里拿着一技桂花，玩了一回，俯在窗槛上，掐了桂蕊，扔在水面，引的那游鱼上来唼喋。湘云出一回神，又让一回袭人等，又招呼山坡下的众人只管放量吃。探春和李纨、惜春正立在垂柳阴中看鸥鹭。迎春却独在花阴下，拿着个针儿穿茉莉花。宝玉又…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉放下钓杆，走至座间，拿起那乌梅银花自斟壶来，拣了一个小小的海棠冻石蕉叶杯。丫头看见，知他要饮酒，忙着走上来斟。黛玉道：“你们只管吃去，让我自己斟才有趣儿。”说置便斟了半盏看时，却是黄酒，因说道：“我吃了一点子螃蟹，觉得心口微微的疼，须得热热的吃口烧酒。”宝玉忙接道：“有烧酒。”便命将那台欢花浸的酒烫一壶来，黛玉也只吃一口便放下了。宝钗也走过来，另拿了一只杯来，也饮了一口放下，便蘸笔至墙上把头一个《忆菊》勾了，底下又赘一个“蘅”字。宝…","so":0,"eo":0},{"surface":"宝玉","text":"怡红公子","so":0,"eo":0},{"surface":"宝玉","text":"怡红公子","so":0,"eo":0},{"surface":"宝玉","text":"众人看一首，赞一首，彼此称扬不绝。李纨笑道：“等我从公评来。通篇看来，各人有各人的警句。今日公评：《咏菊》第一，《问菊》第二，《菊梦》第三，题目新，诗也新，立意更新了，只得要推潇湘妃子为魁了。然后《簪菊》、《对菊》、《供菊》、《画菊》、《忆菊》次之。”宝玉听说，喜的拍手道：“极是！极公！”黛玉道：“我那个也不好，到底伤于纤巧些。”李纨道：“巧的却好，不露堆砌生硬。”黛玉道：“据我看来，头一句好的是‘圃冷斜阳忆旧游’，这句背面傅粉；‘抛书…","so":0,"eo":0},{"surface":"宝玉","text":"大家又评了一回，复又要了热螃蟹，就在大圆桌上吃了一回。宝玉笑道：“今日持螯赏桂，亦不可无诗，我已吟成，谁还敢作？”说着，便忙洗了手，提笔写出，众人看道：","so":0,"eo":0}]},{"chap":39,"ctitle":"第39章 村老老是信口开河 情哥哥偏寻根究底","deeds":[{"surface":"宝玉","text":"宝钗笑道：“这倒是真话。我们没事评论起来，你们这几个，都是百个里头挑不出一个来的。妙在各人有各人的好处。”李纨道：“大小都有个天理，比如老太太屋里，要没鸳鸯姑娘，如何使得？从太太起，那一个敢驳老太太的回？他现敢驳回，偏老太太只听他一个人的话。老太太的那些穿带的，别人不记得，他都记得。要不是他经管着，不知叫人诳骗了多少去呢！况且他心也公道，虽然这样，倒常替人上好话儿，还倒不倚势欺人的。”惜春笑道：“老太太昨日还说呢，他比我们还强呢！”平儿…","so":0,"eo":0},{"surface":"宝玉","text":"凤姐知道合了贾母的心，吃了饭便又打发过来。鸳鸯忙命老婆子带了刘老老去洗了澡，自己去挑了两件随常的衣裳叫给刘老老换上。那刘老老那里见过这般行事？忙换了衣裳出来，坐在贾母榻前，又搜寻些话出来说。彼时宝玉姐妹们也都在这里坐着，他们何曾听见过这些话，自觉比那些瞽目先生说的书还好听。那刘老老虽是个村野人，却生来的有些见识，况且年纪老了，世情上经历过的，见头一件贾母高兴，第二件这些哥儿姐儿都爱听，便没话也编出些话来讲。因说道：“我们村庄上种地种菜，…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉且忙问刘老老：“那女孩儿大雪地里做什么抽柴火？倘或冻出病来呢？”贾母道：“都是才说抽柴火，惹出事来了，你还问呢！别说这个了，说别的罢。“宝玉听说，心内虽不乐，也只得罢了。刘老老便又想了想，说道：“我们庄子东边庄上有个老奶奶子，今年九十多岁了。他天天吃斋念佛，谁知就感动了观音菩萨，夜里来托梦，说：‘你这么虚心，原来你该绝后的，如今奏了玉皇，给你个孙子。’原来这老奶奶只有一个儿子，这儿子也只一个儿子，好容易养到十七八岁上死了，哭的什么儿…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉心中只惦记抽柴的事，因闷的心中筹画。探春因问他：“昨日扰了史大妹妹，咱们回去商议着邀一社，又还了席，也请老太太赏菊何如？”宝玉笑道：“老太太说了，还要摆酒还史妹妹的席，叫咱们做陪呢。等吃了老太太的，咱们再请不迟。”探春道：“越往前越冷了，老太太未必高兴。”宝玉道：“老太太又喜欢下雨下雪的，咱们等下头场雪，请老太太赏雪不好吗？咱们雪下吟诗，也更有趣了。”黛玉笑道：“咱们雪下吟诗，依我说，还不如弄一捆柴火，雪下抽柴，还更有趣儿呢！”说着…","so":0,"eo":0},{"surface":"宝玉","text":"一时散了，背地里宝玉到底拉了刘老老，细问那女孩儿是谁。刘老老只得编了告诉他：“那原是我们庄子北沿儿地埂子上，有个小祠堂儿，供的不是神佛，当先有个什么老爷……”说着，又想名姓。宝玉道：“不拘什么名姓，也不必想了，只说原故就是了。”刘老老道：“这老爷没有儿子，只有一位小姐，名字叫什么若玉，知书儿识字的，老爷太太爱的象珍珠儿。可惜了儿的，这小姐儿长到十七岁了，一病就病死了。”宝玉听了，跌足叹惜，又问：“后来怎么样？”刘老老道：“因为老爷太太疼…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉信以为真，回至房中，盘算了一夜。次日一早，便出来给了焙茗几百钱，按着刘老老说的方向地名，着焙茗去先踏看明白，回来再作主意。那焙茗去后，宝玉左等也不来，右等也不来，急的热地里蚰蜒似的。好容易等到日落，方见焙茗兴兴头头的回来了。宝玉忙问：“可找着了？”焙茗笑道：“爷听的不明白，叫我好找！那地名坐落，不象爷听的一样，所以找了一天，找到东北角田埂子上，才有一个破庙。”宝玉听说，喜的眉开眼笑，忙说道：“刘老老有年纪的人，一时错记了也是有的。你…","so":0,"eo":0}]},{"chap":40,"ctitle":"第40章 史太君两宴大观园 金鸳鸯三宣牙牌令","deeds":[{"surface":"宝玉","text":"话说宝玉听了，忙进来看时，只见琥珀站在屏风跟前，说：“快去罢，立等你说话呢。”宝玉来至上房，只见贾母正和王夫人众姐妹商议给史湘云还席。宝玉因说：“我有个主意：既没有外客，吃的东西也别定了样数，谁素日爱吃的，拣样儿做几样。也不必按桌席，每人跟前摆一张高几，各人爱吃的东西一两样，再一个十锦攒心盒子，自斟壶，岂不别致？”贾母听了，说：“很是。”即命人传与厨房：“明日就拣我们爱吃的东西做了，按着人数，再装了盒子来。早饭也摆在园里吃。”商议之间，…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃早打起湘帘，贾母等进来坐下。黛玉亲自用小茶盘儿捧了一盖碗茶来奉与贾母。王夫人道：“我们不吃茶，姑娘不用倒了。”黛玉听说，便命丫头把自己窗下常坐的一张椅子挪到下手，请王夫人坐了。刘老老因见窗下案上设着笔砚，又见书架上放着满满的书，刘老老道：“这必定是那一位哥儿的书房了？”贾母笑指黛玉道：“这是我这外孙女儿的屋子。”刘老老留神打量了黛玉一番，方笑道：“这那里象个小姐的绣房？竟比那上等的书房还好呢。”贾母因问：“宝玉怎么不见？”众丫头们答…","so":0,"eo":0},{"surface":"宝玉","text":"正说着，只见贾母等来了，各自随便坐下。先有丫鬟挨人递了茶。大家吃毕，凤姐手里拿着西洋布手巾，裹着一把乌木三镶银箸，按席摆下。贾母因说：“把那一张小楠木桌子抬过来，让刘亲家挨着我这边坐。”众人听说，忙抬过来。凤姐一面递眼色与鸳鸯，鸳鸯便忙拉刘老老出去，悄悄的嘱咐了刘老老一席话，又说：“这是我们家的规矩，要错了，我们就笑话呢。”调停巳毕，然后归坐。薛姨妈是吃过饭来的，不吃了，只坐在一边吃茶。贾母带着宝玉、湘云、黛玉、宝钗一桌，王夫人带着迎春…","so":0,"eo":0},{"surface":"宝玉","text":"那刘老老入了坐，拿起箸来，沉甸甸的不伏手，原是凤姐和鸳鸯商议定了，单拿了一双老年四楞象牙镶金的筷子给刘老老。刘老老见了，说道：“这个叉巴子，比我们那里的铁锨还沉，那里拿的动他？”说的众人都笑起来。只见一个媳妇端了一个盒子站在当地，一个丫鬟上来揭去盒盖，里面盛着两碗菜，李纨端了一碗放在贾母桌上，凤姐偏拣了一碗鸽子蛋放在刘老老桌上。贾母这边说声“请”，刘老老便站起身来，高声说道：“老刘，老刘，食量大如牛。吃个老母猪不抬头！”说完，却鼓着腮帮…","so":0,"eo":0},{"surface":"宝玉","text":"贾母隔着纱窗后往院内看了一回，因说道：“后廊檐下的梧桐也好了，只是细些。”正说话，忽一阵风过，隐隐听得鼓乐之声。贾母问：“是谁家娶亲呢？这里临街倒近。”王夫人等笑回道：“街上的那里听的见？这是咱们的那十来个女孩子们演习吹打呢。”贾母便笑道：“既他们演，何不叫他们进来演习，他们也逛一逛，咱们也乐了，不好吗？”凤姐听说，忙命人出去叫来，赶着吩咐摆下条桌，铺上红毡子。贾母道：“就铺排在藕香榭的水亭子上，借着水音更好听。回来咱们就在缀锦阁底下吃…","so":0,"eo":0},{"surface":"宝玉","text":"一齐出来走不多远，已到了荇叶渚，那姑苏选来的几个驾娘早把两只棠木舫撑来。众人扶了贾母、王夫人、薛姨妈、刘老老、鸳鸯、玉钏儿上了这一只船，次后李纨跟上去。凤姐也上去，立在船头上，也要撑船。贾母在舱内道：“那不是玩的！虽不是河里，也有好深的，你快给我进来。”凤姐笑道：“怕什么！老祖宗只管放心。”说着，便一篙点开，到了池当中。船小人多，凤姐只觉乱晃，忙把篙子递与驾娘，方蹲下去。然后迎春姐妹等并宝玉上了那只，随后跟来。其馀老嬷嬷众丫鬟俱沿河随行…","so":0,"eo":0},{"surface":"宝玉","text":"说着已到了花溆的萝港之下，觉得阴森透骨，两滩上衰草残菱，更助秋兴。贾母因见岸上的清厦旷朗，便问：“这是薛姑娘的屋子不是？”众人道：“是”，贾母忙命拢岸，顺着云步石梯上去，一同进了蘅芜院。只觉异香扑鼻，那些奇草仙藤，愈冷愈苍翠，都结了实，似珊瑚豆子一般，累垂可爱。及进了房屋，雪洞一般，一色的玩器全无。案上止有一个土定瓶，瓶中供着数枝菊，并两部书，茶奁、茶杯而已。床上只吊着青纱帐坦，衾褥也十分朴素。贾母叹道：“这孩子太老实了，你没有陈设，何…","so":0,"eo":0},{"surface":"宝玉","text":"说着，坐了一回，方出来，一径来至缀锦阁下。文官等上来请过安，因问：“演习何曲？”贾母道：“只拣你们熟的演习几套罢。”文官等下来，往藕香榭去不提。这里凤姐已带着人摆设齐整，上面左右两张榻，榻上都铺着锦蓉簟，每一榻前两张雕漆几，也有海棠式的，也有梅花式的，也有荷叶式的，也有葵花式的，也有方的，有圆的，其式不一。一个上头放着一分炉瓶，一个攒盒。上面二榻四几，是贾母、薛姨妈；下面一椅两几，是王夫人的。馀者都是一椅一几。东边刘老老，刘老老之下便是…","so":0,"eo":0}]},{"chap":41,"ctitle":"第41章 贾宝玉品茶栊翠庵 刘老老醉卧怡红院","deeds":[{"surface":"宝玉","text":"只见一个婆子走来，请问贾母说：“姑娘们都到了藕香榭，请示下，就演罢，还是再等一会儿呢？”贾母忙笑道：“可是倒忘了，就叫他们演罢。”那婆子答应去了。不一时，只听得萧管悠扬，笙笛并发；正值风清气爽之时，那乐声穿林度水而来，自然使入神恰心旷。宝玉先禁不住，拿起壶来斟了一杯，一口饮尽，复又斟上，才要饮，只见王夫人也要饮，命人换暖酒，宝玉连忙将自己的杯捧了过来，送到王夫人口边，王夫人便就他手内吃了两口。一时暖酒来了，宝玉仍归旧坐。王夫人提了暖壶下…","so":0,"eo":0},{"surface":"宝玉","text":"当下贾母等吃过了茶，又带了刘老老至栊翠庵来。妙玉相迎进去。众人至院中，见花木繁盛，贾母笑道：“到底是他们修行的人，没事常常修理，比别处越发好看。”一面说，一面便往东禅堂来。妙玉笑往里让，贾母道：“我们才都吃了酒肉，你这里头有菩萨，冲了罪过。我们这里坐坐，把你的好茶拿来，我们吃一杯就去了。”宝玉留神看他是怎么行事，只见妙玉亲自捧了一个海棠花式雕漆填金“云龙献寿”的小茶盘，里面放一个成窑五彩小盖钟，捧与贾母。贾母道：“我不吃六安茶。”妙玉笑…","so":0,"eo":0},{"surface":"宝玉","text":"那妙玉便把宝钗、黛玉的衣襟一拉，二人随他出去。宝玉悄悄的随后跟了来。只见妙玉让他二人在耳房内，宝钗便坐在榻上，黛玉便坐在妙玉的蒲团上。妙玉自向风炉上煽滚了水，另泡了一壶茶。宝玉便轻轻走进来，笑道：“你们吃体己茶呢！”二人都笑道：“你又赶了来撤茶吃！这里并没你吃的。”妙玉刚要去取杯，只见道婆收了上面茶盏来，妙玉忙命：“将那成窑的茶杯别收了，搁在外头罢。”宝玉会意，知为刘老老吃了，他嫌腌不要了。又见妙玉另拿出两只杯来，一个旁边有一耳，杯上携…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉因问：“这也是旧年的雨水？”妙玉冷笑道：“你这么个人，竟是大俗人，连水也尝不出来！这是五年前我在玄墓蟠香寺住着，收的梅花上的雪，统共得了那一鬼脸青的花瓮一瓮，总舍不得吃，埋在地下，今年夏天才开了。我只吃过一回，这是第二回了。你怎么尝不出来？隔年蠲的雨水，那有这样清淳？如何吃得！”宝钗知他天性怪僻，不好多话，亦不好多坐，吃过茶，便约着黛玉走出来。宝玉和妙玉陪笑说道：“那茶杯虽然腌了，白撩了岂不可惜？依我说，不如就给了那贫婆子罢，他卖了…","so":0,"eo":0},{"surface":"宝玉","text":"且说贾母因觉身上乏倦，便命王夫人和迎春姐妹陪着薛姨妈去吃酒，自己便往稻香村来歇息。凤姐忙命人将小竹椅抬来，贾母坐上，两个婆子抬起，凤姐、李纨和众丫头婆子围随去了，不在话下。这里薛姨妈也就辞出。王夫打发文官等出去，将攒盒散给众丫头们吃去，自己便也乘空歇着，随便歪在方才贾母坐的榻上，命一个小丫头放下帘子来，又命捶着腿，吩咐他：“老太太那里有信，你就叫我。”说着也歪着睡着了。宝玉、湘云等看着丫头们将攒盒搁在山石上，也有坐在山石上的，也有坐在草…","so":0,"eo":0},{"surface":"宝玉","text":"袭人进了房门，转过集锦子，就听的鼾声如雷，忙进来，只闻见酒屁臭气满屋。一瞧，只见刘老老扎手舞脚的仰卧在床上。袭人这一惊不小，忙上来将他没死活的推醒。那刘老老惊醒，睁眼看见袭人，连忙爬起来，道：“姑娘，我该死了！好歹并没弄腌了床。”一面说，用手去掸。袭人恐惊动了宝玉，只向他摇手儿，不叫他说话。忙将当地大鼎内贮了三四把百合香，仍用罩子罩上。所喜不曾呕吐。忙悄悄的笑道：“不相干，有我呢。你跟我出来罢。”刘老老答应着，跟了袭人，出至小丫头子们房…","so":0,"eo":0}]},{"chap":42,"ctitle":"第42章 蘅芜君兰言解疑癖 潇湘子雅谑补馀音","deeds":[{"surface":"宝玉","text":"因贾母欠安，众人都过来请安，出去传请大夫。一时婆子回：“大夫来了。”老嬷嬷请贾母进幔子去坐，贾母道：“我也老了，那里养不出那阿物儿来，还怕他不成，不用放幔子，就这样瞧罢。”众婆子听了，便拿过一张小桌子来，放下一个小枕头，便命人请。一时只见贾珍、贾琏、贾蓉三个人，将王太医领来。王太医不敢走甬路，只走旁阶，跟着贾珍到了台阶上。早有两个婆子在两边打起帘子，两个婆子在前导引进去，又见宝玉迎接出来。见贾母穿着青绉绸一斗珠儿的羊皮褂子，端坐在榻上。…","so":0,"eo":0},{"surface":"宝玉","text":"这里王夫人和李纨、凤姐儿、宝钗姐妹等，见大夫出去，方从厨后出来。王夫人略坐一坐，也回房去了。刘老老见无事，方上来和贾母告辞。贾母说：“闲了再来。”又命鸳鸯来：“好生打发刘老老出去。我身上不好，不能送你。”刘老老道了谢，又作辞，方同鸳鸯出来。到了下房，鸳鸯指炕上一个包袱说道：“这是老太太的几件衣裳，都是往年间生日节下众人孝敬的。老太太从不穿人家做的，收着也可惜，却是一次也没穿过的，昨日叫我拿出两套来送你带了去，或送人，或自己家里穿罢。这盒…","so":0,"eo":0},{"surface":"宝玉","text":"李纨道：“我请你们大家商议，给他多少日子的假？我给了他一个月的假，他嫌少，你们怎么说？”黛玉道：“论理，一年也不多，这园子盖就盖了一年，如今要画，自然得二年的工夫呢。又要研墨，又要蘸笔，又要铺纸，又要着颜色，又要……”刚说到这里，黛玉也自己掌不住，笑道：“又要照着样儿慢慢的画，可不得二年的工夫？”众人听了，都拍手笑个不住。宝钗笑道：“有趣，最妙落后一句是‘慢慢的画’。他可不画去，怎么就有了呢，所以昨儿那些笑活儿虽然可笑，回想是没趣的。你…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉和黛玉使个眼色儿，黛玉会意，便走至里间，将镜袱揭起。照了照，只见两鬓略松了些，忙开了李纨的妆奁，拿出抿子来，对镜抿了两抿，仍旧收拾好了，方出来指着李纨道：“这是叫你带着我们做针钱、教道理呢，你反招了我们来大玩大笑的！”李纨笑道：“你们听他这刁话，他领着头儿闹，引着人笑了，倒赖我的不是！真真恨的我……只保佑你明儿得一个利害婆婆，再得几个千刁万恶的大姑子、小姑子，试试你那会子还这么刁不刁了！”","so":0,"eo":0},{"surface":"宝玉","text":"黛玉早红了脸，拉着宝钗说：“咱们放他一年的假罢。”宝钗道：“我有一句公道话，你们听听。藕丫头虽会画，不过是几笔写意。如今画这园子，非离了肚子里头有些丘壑的，如何成画？这园子却是象画儿一般，山石树木，楼阁房屋，远近疏密，也不多，也不少，恰恰的是这样。你若照样儿往纸上一画，是必不能讨好的。这要看纸的地步远近，该多该少，分主分宾，该添的要添，该藏该减的要藏要减，该露的要露，这一起了稿子，再端详斟酌，方成一幅图样。第二件，这些楼台房舍，是必要界…","so":0,"eo":0},{"surface":"宝玉","text":"宝钗道：“我说你是‘无事忙’，说了一声，你就问他去，也等着商议定了再去。如今且说拿什么画？”宝玉道：“家里有雪浪纸，又大，又托墨。”宝钗冷笑道：“我说你不中用，那雪浪纸写字、画写意画儿，或是会山水的画南宗山水，托墨，禁得皴染。拿了画这个，又不托色，又难烘，画也不好，纸也可惜。我教给你一个法子，原先盖这园子就有一张细致图样，虽是画工描的，那地步方向是不错的。你和太太要出来，也比着那纸的大小，和凤姐姐要一块重绢，交给外边相公们，叫他照着这图…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉早已预备下笔砚了，原怕记不清白，要写了记着，听宝钗如此说，喜的提起笔来静听。宝钗说道：“头号排笔四支，二号排笔四支，三号排笔四支，大染四支，中染四支，小染四支，大南蟹爪十支，小蟹爪十支，须眉十支，大着色二十支，小着色二十支，开面十支，柳条二十支，箭头朱四两，南赭四两，石黄四两，石青四两，石绿四两，管黄四两，广花八两，铅粉十四匣，胭脂十二帖，大赤二百帖，青金二百帖，广匀胶四两，净矾四两。矾绢的胶矾在外，别管他们，只把绢交出去，叫他们矾…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉又看了一回单子，笑着拉探春悄悄的道：“你瞧瞧，画个画儿，又要起这些水缸箱子来。想必糊涂了，把他的嫁妆单子也写上了。”探春听了，笑个不住，说道：“宝姐姐，你还不拧他的嘴？你问问他编派你的话。”宝钗笑道：“不用问，‘狗嘴里还有象牙不成’！”一面说，一面走上来，把黛玉按在炕上，便要拧他的脸。黛玉笑着，忙央告道：“好姐姐，饶了我罢！颦儿年纪小，只知说，不知道轻重，做姐姐的教导我。姐姐不饶我，我还求谁去呢。”众人不知话内有因，都笑道：“说的好…","so":0,"eo":0}]},{"chap":43,"ctitle":"第43章 闲取乐偶攒金庆寿 不了情暂撮土为香","deeds":[{"surface":"宝玉","text":"这里贾母又向王夫人笑道：“我打发人找你来，不为别的，初二日是凤丫头的生日。上两年我原想着替他做生日，偏到跟前又有事就混过去了。今年人又齐全，料着又没事，咱们大家好生乐一天。”王夫人笑道：“我也想着呢。既是老太太高兴，何不就商议定了？”贾母笑道：“我想往年不拘谁做生日，都是各自送各自的礼，这个也俗了，也觉太生分。今儿我出个新法子，又不生分，又可以取乐儿。”王夫人忙道：“老太太怎么想着好，就是怎么样行。”贾母笑道：“我想着咱们也学那小家子，…","so":0,"eo":0},{"surface":"宝玉","text":"贾母笑着把方才一夕话说与众人听了，众人谁不凑这趣儿呢。再也有和凤姐儿好，情愿这样的。也有怕凤姐儿，巴不得奉承他的。况且都是拿的出来的，所以一闻此言都欣然应诺。贾母先道：“我出二十两。”薛姨妈笑道：“我随着老太太，也是二十两。”邢夫人王夫人笑道：“我们不敢和老太太并肩，自然矮一等，每人十六两罢了。”尤氏李纨也笑道：“我们自然又矮一等，每人十二两罢。”贾母忙和李纨道：“你寡妇失业的，那里还拉你出这个钱，我替你出了罢。”凤姐忙笑道：“老太太别…","so":0,"eo":0},{"surface":"宝玉","text":"转眼已是九月初二日，园中人都打听得尤氏办得十分热闹，不但有戏，连耍百戏并说书的女先儿全有，都打点着取乐玩耍。李纨又向众姐妹道：“今儿是正经社日，可别忘了。宝玉也不来，想必他不知，又贪住什么玩意儿，把这事又忘了。”说着，便命丫头：“去瞧做什么呢，快请了来。”丫头去了半日，回说：“花大姐姐说，今儿一早就出门去了。”众人听了都诧异，说：“再没有出门之理。这丫头糊涂！”因又命翠墨去。一时翠墨回来，说：“可不真出门了。说有个朋友死了，出去探丧去了…","so":0,"eo":0},{"surface":"宝玉","text":"原来宝玉心里有件心事，于头一日就吩咐焙茗：“明日一早出门，备两匹马在后门口等着，不用别人跟着。说给李贵，我往北府里去了，倘或要有人找我，叫他拦住不用找。只说北府里留下了，横竖就来的。”焙茗也摸不着头脑，只得依言说了，今儿一早果然备了两匹马，在园后门等着。天亮了，只见宝玉遍体纯素，从角门出来，一语不发跨上马，一弯腰顺着街就蹭下去了。焙茗也只得跨上马，加鞭赶上，在后面忙问：“往那里去？”宝玉道：“这条路是往那里去的？”焙茗道：“这是出北门的…","so":0,"eo":0},{"surface":"宝玉","text":"一气跑了七八里路出来，人烟渐渐稀少，宝玉方勒住马，回头问焙茗道：“这里可有卖香的？”焙茗道：“香倒有，不知是那一样？”宝玉想到别的香不好，须得檀、芸、降三样。焙茗笑道：“这三样可难得。”宝玉为难。焙茗见他为难，因问道：“要香做什么使？我见二爷时常带的小荷包儿有散香，何不找找？”一句提醒了宝玉，便回手衣襟上挂着个荷包摸了一摸，竟有两星沉速，心内喜欢：“只是不恭些。”再想：“自己亲身带的，倒比买的又好些。”于是又问炉炭，焙茗道：“这可罢了，…","so":0,"eo":0},{"surface":"宝玉","text":"说着，早已来至门前。那老姑子见宝玉来了，事出意外，竟象天上掉下个活龙来的一般，忙上来问好，命老道来接马。宝玉进去，也不拜洛神之像，却只管赏鉴。虽是泥塑的，却真有那“翩若惊鸿，婉若游龙”、“荷出渌波，日映朝霞”的姿态。宝玉不觉滴下泪来。老姑子献了茶，宝玉因和他借香炉烧香。那姑子去了半日，连香供纸马都预备了来。宝玉说道：“一概不用。”命焙茗捧着炉出至后园中，拣一块干净地方儿，竟拣不出。焙茗道：“那井台上如何？”宝玉点头。","so":0,"eo":0},{"surface":"宝玉","text":"一齐来至井台上，将炉放下，焙茗站过一旁。宝玉掏出香来焚上，含泪施了半礼，回身命收了去。焙茗答应，且不收，忙爬下磕了几个头，口内祝道：“我焙茗跟二爷这几年，二爷的心事我没有不知道的，只有今儿这一祭祀，没有告诉我，我也不敢问。只是受祭的阴魂，虽不知名姓，想来自然是那人间有一、天上无双，极聪明清雅的一位姐姐妹妹了。二爷的心事难出口，我替二爷祝赞你，你若有灵有圣，我们二爷这样想着你，你也时常来望候望候二爷，未尝不可。你在阴间，保佑二爷来生也变个…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听他没说完，便掌不住笑了。因踢他道：“别胡说，看人听见笑话。”焙茗起来，收过香炉，和宝玉走着，因道：“我已经合姑子说了，二爷还没用饭，叫他收拾了些东西，二爷勉强吃些。我知道今儿里头大排筵宴，热闹非常，二爷为此才躲了来的。横竖在这里清净一天，也就尽乐了，要不吃东西，断使不得。”宝玉道：“戏酒不吃，这随便的吃些也不妨。”焙茗道：“这才是。还有一说，咱们来了，必有人不放心。若没有人不放心，便晚些进城何妨？若有人不放心，二爷须得进城回家去才…","so":0,"eo":0}]},{"chap":44,"ctitle":"第44章 变生不测凤姐泼醋 喜出望外平儿理妆","deeds":[{"surface":"宝玉","text":"话说宝玉和姐妹一处坐着，同众人看演《荆钗记》，黛玉因看到《男祭》这出上，便和宝钗说道：“这王十朋也不通的很，不管在那里祭一祭罢了，必定跑到江边上来做什么，俗语说：‘睹物思人’，天下的水总归一源，不拘那里的水舀一碗，看着哭去，也就尽情了。”宝钗不答。宝玉听了，却又发起呆来。","so":0,"eo":0},{"surface":"宝玉","text":"原来平儿早被李纨拉入大观园去了。平儿哭的哽咽难言，宝钗劝道：“你是个明白人，你们奶奶素日何等待你。今儿不过他多吃了一口酒，他可不拿你出气，难道拿别人出气不成？别人又笑话他是假的了。”正说着，只见琥珀走来，说了贾母的话，平儿自觉面上有了光辉，方才浙渐的好了，也不往前头来。宝钗等歇息了一回，方来看贾母凤姐。宝玉便让了平儿到怡红院中来，袭人忙接着，笑道：“我先原要让你的，只因大奶奶和姑娘们都让你，我就不好让的了。”平儿也陪笑说：“多谢。”因又…","so":0,"eo":0},{"surface":"宝玉","text":"平儿素昔只闻人说，宝玉专能和女孩们接交。宝玉素日因平儿是贾琏的爱妾，又是凤姐儿的心腹，故不肯和他厮近，因不能尽心，也常为恨事。平儿如今见他这般，心中暗暗的敁敪：“果然话不虚传，色色想的周到。”又见袭人特特的开了箱子，拿出两件不大穿的衣裳，忙来洗了脸。宝玉一旁笑劝道：“姐姐还该擦上些脂粉，不然倒象是和凤姐姐赌气的似的。况且又是他的好日子，而且老太太又打发人来安慰你。”平儿听了有理，便去找粉，只不见粉。宝玉忙走至妆台前，将一个宣窑磁盒揭开，…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉因自来从不曾在平儿前尽过心，——且平儿又是个极聪明，极清俊的上等女孩儿，比不得那起俗拙蠢物——深以为恨。今日是金钏儿生日，故一日不乐。不想后来闹出这件事来，竟得在平儿前稍尽片心，也算今生意中不想之乐，因歪在床上，心内怡然自得。忽又思及贾琏，惟知以淫乐悦己，并不知作养脂粉；又思平儿并无父母兄弟姊妹，独自一人，供应贾琏夫妇二人，贾琏之俗，凤姐之威，他竟能周全妥贴，今儿还遭荼毒，也就薄命的很了。想到此间，便又伤感起来。复又起身，见重喷的酒…","so":0,"eo":0}]},{"chap":45,"ctitle":"第45章 金兰契互剖金兰语 风雨夕闷制风雨词","deeds":[{"surface":"宝玉","text":"凤姐儿道：“过会子我开了楼房，所有这些东西，叫人搬出来你们瞧，要使得，留着使；要少什么，照你们的单子，我叫人赶着买去就是了。画绢我就裁出来。那图样没有在老太太那里，那边珍大爷收着呢。说给你们，省了碰钉子去。我去打发人取了来，一并叫人连绢交给相公们矾去，好不好呢？”李纨点头笑道：“这难为你。果然这么着还罢了。那么着，咱们家去罢，等着他不送了去，再来闹他。”说着便带了他姐妹们就走。凤姐儿道：“这些事再没别人，都是宝玉生出来的。”李纨听了，忙…","so":0,"eo":0},{"surface":"宝玉","text":"平儿斟上茶来，赖嬷嬷忙站起来道：“姑娘，不管叫那孩子倒来罢了，又生受你。”说着，一面吃茶，一面又道：“奶奶不知道，这小孩子们全要管的严。饶这么严，他们还偷空儿闹个乱子来，叫大人操心。知道的，说小孩子们淘气，不知道的人，人家就说仗着财势欺人，连主子名声也不好。恨的我没法儿．常把他老子叫了来，骂一顿才好些。”因又指宝玉道：“不怕你嫌我，如今老爷不过这么管你一管，老太太就护在头里。当日老爷小时，你爷爷那个打，谁没看见的！老爷小时，何曾象你这么…","so":0,"eo":0},{"surface":"宝玉","text":"一日，外面矾了绢，起了稿子进来。宝玉每日便在惜春那边帮忙，探春、李纨、迎春、宝钗等也都往那里来闲坐，一则观画，二则便于会面。宝钗因见天气凉爽，夜复渐长，遂至贾母房中商议，打点些针线来。日间至贾母、王夫人处两次省候，不免又承色陪坐，闲时园中姐妹处，也要不时闲话一回。故日间不大得闲，每夜灯下女工，必至三更方寝。黛玉每岁至春分，秋分后必犯旧疾，今秋又遇着贾母高兴，多游玩了两次，未免过劳了神，近日又复嗽起来，觉得比往常又重，所以总不出门，只在自…","so":0,"eo":0},{"surface":"宝玉","text":"黛玉叹道：“你素日待人，固然是极好的，然我最是个多心的人，只当你有心藏奸。从前日你说看杂书不好，又劝我那些好话，竟大感激你。往日竟是我错了，实在误到如今。细细算来．我母亲去世的时候，又无姐妹兄弟，我长了今年十五岁，竟没一个人象你前日的话教导我。怪不得云丫头说你好。我往日见他赞你，我还不受用；昨儿我亲自经过，才知道了。比如你说了那个，我再不轻放过你的，你竟不介意，反劝我那些话，可知我竟自误了。若不是前日看出来，今日这话，再不对你说。你方才…","so":0,"eo":0},{"surface":"宝玉","text":"吟罢搁笔，方欲安寝，丫鬟报说：“宝二爷来了。”一语未尽，只见宝玉头上戴着大箬笠，身上披着蓑衣。黛玉不觉笑道：“那里来的这么个渔翁？”宝玉忙问：“今儿好？吃了药了没有？今儿一日吃了多少饭？”一面说，一面摘了笠，脱了蓑。一手举起灯来，一手遮着灯儿，向黛玉脸上照了一照，觑着瞧了一瞧，笑道：“今儿气色好了些。”黛玉看他脱了蓑衣，里面只穿半旧红绫短袄，系着绿汗巾子，膝上露出绿绸撒花裤子，底下是掐金满绣的绵纱抹子，着蝴蝶落花鞋。黛玉问道：“上头怕…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉却不留心，因见案上有诗，遂拿起来看了一遍，又不觉叫好。黛玉听了，忙起来夺在手内，灯上烧了。宝玉笑道：“我己记熟了。”黛玉道：“我要歇了，你请去罢，明日再来。”宝玉听了，回手向怀内掏出一个核桃大的金表来，瞧了一瞧，那针巳指到戌末亥初之间，忙又揣了，说道：“原该歇了，又搅的你劳了半日神。”说着，披蓑戴笠出去了，又翻身进来，问道：“你想什么吃？你告诉我，我明儿一早回老太太，岂不比老婆子们说的明白？”黛玉笑道：“等我夜里想着了，明日一早告诉…","so":0,"eo":0},{"surface":"宝玉","text":"紫鹃收起燕窝，然后移灯下帘，伏侍黛玉睡下。黛玉自在枕上感念宝钗，一时又羡他有母有兄；一回又想宝玉素昔和睦，终有嫌疑。又听见窗外竹梢蕉叶之上，雨声淅沥，清寒透幕，不觉又滴下泪来。直到四更方渐浙的睡熟了。暂且无话。","so":0,"eo":0}]},{"chap":46,"ctitle":"第46章 尴尬人难免尴尬事 鸳鸯女誓绝鸳鸯偶","deeds":[{"surface":"宝玉","text":"平儿因问袭人道：“你在那里藏着做什么？我们竟没有看见你．”袭人道：“我因为往四姑娘房里看我们宝二爷去了，谁知迟了一步，说是家去了。我疑惑怎么没遇见呢，想要往林姑娘家找去，又遇见他的人，说也没去。我这里正疑惑是出园子去了，可巧你从那里来了。我一闪，你也没有见。后来他又来了，我从这树后头走到山子石后，我却见你两个说话来了，谁知你们四个眼睛没见我。”一语未了，又听身后笑道：“四个眼睛没见你？你们六个眼睛还没见我呢。”二人吓了一跳，回身一看，你…","so":0,"eo":0},{"surface":"宝玉","text":"鸳鸯已知这话俱被宝玉听了，只伏在石头上装睡。宝玉推他笑道：“这石头上冷，咱们回屋里去睡，岂不好？”说着，拉起鸳鸯来。又忙让平儿来家吃茶，和袭人都劝鸳鸯走，鸳鸯方立起身来。四人竟往怡红院来。宝玉将方才的话俱已听见，心中着实替鸳鸯不快，只默默的歪在床上，任他三人在外间说笑。","so":0,"eo":0},{"surface":"宝玉","text":"且说鸳鸯一夜没睡。至次日，他哥哥回贾母，接他家去逛逛，贾母允了，叫他家去。鸳鸯意欲不去，只怕贾母疑心，只得勉强出来。他哥哥只得将贾赦的话说给他，又许他怎么体面，又怎么当家做姨娘，鸳鸯只咬定牙不愿意。他哥哥无法，少不得回去回复贾赦。贾赦恼起来，因说道：“我说给你，叫你女人和他说去。就说我的话：‘自古嫦娥爱少年’，他必定嫌我老了。大约他恋着少爷们，多半是看上了宝玉，只怕也有贾琏。若有此心，叫他早早歇了。我要他不来，以后谁敢收他？这是一件。第…","so":0,"eo":0},{"surface":"宝玉","text":"可巧王夫人、薛姨妈、李纨、凤姐儿、宝钗等姊妹并外头的几个执事有头脸的媳妇，都在贾母跟前凑趣儿呢。鸳鸯看见，忙拉了他嫂子，到贾母跟前跪下，一面哭，一面说，把邢夫人怎么来说，园子里他嫂子怎么说，今儿他哥哥又怎么说，“因为不依，方才大老爷越发说我‘恋着宝玉’，不然，要等着往外聘，凭我到天上，这一辈子也跳不出他的手心去，终久要报仇。我是横了心的，当着众人在这里，我这一辈子，别说是宝玉，就是宝金、宝银、宝天王、宝皇帝，横竖不嫁人就完了！就是老太太…","so":0,"eo":0},{"surface":"宝玉","text":"贾母听了，气的浑身打战，口内只说：“我通共剩了这么一个可靠的人，他们还要来算计！”因见王夫人在旁，便向王夫人道：“你们原来都是哄我的！外头孝顺，暗地里盘算我！有好东西也来要，有好人也来要。剩了这个毛丫头，见我待他好了，你们自然气不过，弄开了他，好摆弄我！”王夫人忙站起来，不敢还一言。薛姨妈见连王夫人怪上，反不好劝的了。李纨一听见鸳鸯这话，早带了姊妹们出去。探春有心的人，想王夫人虽有委屈，如何敢辩，薛姨妈现是亲妹妹，自然也不好辩，宝钗也不…","so":0,"eo":0},{"surface":"宝玉","text":"话未说完，贾母笑道：“可是我老糊涂了。姨太太别笑话我。你这个姐姐，他极孝顺，不象我们那大太太，一味怕老爷，婆婆跟前不过应景儿。可是我委屈了他。”薛姨妈只答应“是”，又说：“老太太偏心，多疼小儿子媳妇，也是有的。”贾母道：“不偏心。”因又说：“宝玉，我错怪了你娘，你怎么也不提我，看着你娘受委屈。”宝玉笑道：“我偏着母亲说大爷大娘不成？通共一个不是，我母亲要不认，却推谁去？我倒要认是我的不是，老太太不信。”贾母笑道：“这也有理。你快给你娘跪…","so":0,"eo":0}]},{"chap":47,"ctitle":"第47章 呆霸王调情遭苦打 冷郎君惧祸走他乡","deeds":[{"surface":"宝玉","text":"平儿依言放下钱，也笑了一回，方回来。至院门前，遇见贾琏，问他：“太太在那里呢？老爷叫我请过去呢。”平儿忙笑道：“在老太太跟前站了这半日，还没动呢。趁早儿丢开手罢。老太太生了半日气，这会子亏二奶奶凑了半日的趣儿，才略好了些。”贾琏道：“我过去，只说讨老太太示下，十四往赖大家去不去，好预备轿子。又请了太太，又凑了趣儿，岂不好呢。”平儿笑道：“依我说，你竟别过去罢。合家子连太太、宝玉都有了不是，这会子你又填限去了。”贾琏道：“已经完了，难道还…","so":0,"eo":0},{"surface":"宝玉","text":"转眼到了十四，黑早，赖大的媳妇又进来请。贾母高兴，便带了王夫人、薛姨妈及宝玉姐妹等至大花园中，坐了半日。那花园虽不及大观园，却也十分齐整宽阔、泉石林木，楼台亭轩，也有好几处动人的。外面大厅上，薛蟠、贾珍，贾琏、贾蓉并几个近族的都来了。那赖大家内，也请了几个现任的官长并几个大家子弟作陪。因其中有个柳湘莲，薛蟠自上次会过一次，已念念不忘。又打听他最喜串戏，且都串的是生旦风月戏文，不免错会了意，误认他做了风月子弟，正要与他相交，恨没有个引进，…","so":0,"eo":0},{"surface":"宝玉","text":"没一杯茶时候，果见宝玉出来了。赖尚荣向宝玉笑道：“好叔叔，把他交给你，我张罗人去了。”说着已经去了。宝玉便拉了柳湘莲到厅侧书房坐下，问他：“这几日可到秦钟的坟上去了？”湘莲道：“怎么不去？前儿我们几个放鹰去，离他坟上还有二里，我想今年夏天雨水勤，恐怕他坟上站不住。我背着众人走到那里去瞧了一瞧，略又动了一点子，回家来就便弄了几百钱，第三日一早出去雇了两个人收拾好了。”宝玉说：“怪道呢。上月我们大观园的池子里头结了莲蓬，我摘了十个，叫焙茗出…","so":0,"eo":0},{"surface":"宝玉","text":"湘莲见前面人烟已稀，且有一带苇塘．便下马，将马拴在树上，向薛蟠笑道：“你下来，咱们先设个誓。日后要变了心，告诉别人的，就应誓。”薛蟠笑道：“这话有理。”连忙下马，也拴在树上，便跪下说道：“我要日久变心，告诉人去的，天诛地灭。”一言未了，只听“镗”的一声，背后好似铁锤砸下来，只觉得一阵黑，满眼金星乱迸，身不由己，就倒在地下了。湘莲走上来瞧瞧，知道他是个不惯捱打的，只使了三分气力，向他脸上拍了几下，登时便开了果子铺。薛蟠先还要扎挣起身，又被…","so":0,"eo":0}]},{"chap":48,"ctitle":"第48章 滥情人情误思游艺 慕雅女雅集苦吟诗","deeds":[{"surface":"宝玉","text":"正说着，宝玉和探春来了，都入座听他讲诗。宝玉笑道：“既是这样，也不用看诗，‘会心处不在远’，听你说了这两句，可知三昧你已得了。”黛玉笑道：“你说他这‘上孤烟’好，你还不知他这一句还是套了前人的来。我给你这一句瞧瞧，更比这个淡而现成。”说着，便把陶渊明的“暧暧远人村，依依墟里烟”翻了出来，递给香菱。香菱瞧了，点头叹赏，笑道：“原来‘上’字从‘依依’两个字上化出来的。”宝玉大笑道：“你已得了。不用再讲，要再讲，倒学离了。你就做起来了，必是好…","so":0,"eo":0},{"surface":"宝玉","text":"香菱听了，默默的回来，越发连房也不进去，只在池边树下。或坐在山石上出神，或蹲在地下抠地，来往的人都诧异。李纨、宝钗、探春、宝玉等听得此言，都远远的站在山坡上瞧着他笑。只见他皱一回眉，又自己含笑一回。宝钗笑道：“这个人定是疯了。昨夜嘟嘟哝哝，直闹到五更才睡下。没一顿饭的工夫，天就亮了，我就听见他起来了，忙忙碌碌梳了头，就找颦儿去。一回来，呆了一天，做了一首又不好，自然这会子另做呢。”宝玉笑道：“这正是‘地灵人杰’，老天生人，再不虚赋情性的…","so":0,"eo":0}]},{"chap":49,"ctitle":"第49章 琉璃世界白雪红梅 脂粉香娃割腥啖膻","deeds":[{"surface":"宝玉","text":"大家来至王夫人上房，只见黑压压的一地。又有邢夫人的嫂子，带了女儿岫烟进京来投邢夫人的，可巧凤姐之兄王仁也正进京，两亲家一处搭帮来了。走至半路泊船时，遇见李纨寡婶，带着两个女儿，长名李纹，次名李绮，也上京，大家叙起来，又是亲戚，因此三家一路同行。后有薛蟠之从弟薛蝌，因当年父亲在京时，已将胞妹薛宝琴许配都中梅翰林之子为妻，正欲进京聘嫁，闻得王仁进京，他也随后带了妹子赶来。所以今日会齐了，来访投各人亲戚。于是大家见礼叙过，贾母、王夫人都欢喜非…","so":0,"eo":0},{"surface":"宝玉","text":"然后宝玉忙忙来至怡红院中，向袭人、麝月、晴雯笑道：“你们还不快着看去！谁知宝姐姐的亲哥哥是那个样子，他这叔伯兄弟，形容举止另是个样子，倒象是宝姐姐的同胞兄弟似的。更奇在你们成日家只说宝姐姐是绝色的人物，你们如今瞧见他这妹子，还有大嫂子的两个妹子，我竟形容不出来了。老天，老天，你有多少精华灵秀，生出这些人上之人来？可知我‘并底之蛙’，成日家只说现在的这几个人是有一无二的，谁知不必远寻，就是本地风光，一个赛似一个。如今我又长了一层学问了。除…","so":0,"eo":0},{"surface":"宝玉","text":"一语未了，只见探春也笑着进来找宝玉，因说：“咱们诗社可兴旺了。”宝玉笑道：“正是呢。这是一高兴起诗社，鬼使神差来了这些人。但只一件，不知他们可学过做诗不曾？”探春道：“我才都问了问，虽是他们自谦，看其光景，没有不会的。便是不会也没难处，你看香菱就知道了。”晴雯笑道：“他们里头薛大姑娘的妹妹更好。三姑娘看着怎么样？”探春道：“果然的。”据我看来，连他姐姐并这些人总不及他。”袭人听了，又是诧异，又是笑道：“这也奇了，还从那里再寻好的去呢？我…","so":0,"eo":0},{"surface":"宝玉","text":"宝玉听了，喜的眉开眼笑，忙说道：“倒是你明白。我终久是个糊涂心肠，空喜欢了一会子，却想不到这上头。”说着，兄妹两个一齐往贾母处来。果然王夫人已认了薛宝琴做干女儿。贾母喜欢非常，不命往园中住，晚上跟着贾母一处安寝。薛蝌自向薛蟠书房中住下了。贾母和邢夫人说：“你侄女儿也不必家去了，园里住几天，逛逛再去。”邢夫人兄嫂家中原艰难，这一上京原仗的是邢夫人与他们治房舍帮盘缠，听如此说，岂不愿意。邢夫人便将邢岫烟交与凤姐儿。凤姐儿算着园中妹妹多，性情…","so":0,"eo":0},{"surface":"宝玉","text":"此时大观园中、比先又热闹了多少，李纨为首，徐者迎春、探春、惜春、宝钗、黛玉、湘云、李纹、李绮、宝琴、邢岫烟，再添上凤姐儿和宝玉，一共十三人。叙起年庚，除李纨年纪最长，凤姐次之，馀者皆不过十五六七岁，大半同年异月，连他们自己也不能记清谁长谁幼，并贾母、王夫人及家中婆子丫头也不能细细分清，不过是“姐”“妹”“兄”“弟”四个字，随便乱叫。","so":0,"eo":0},{"surface":"宝玉","text":"正说着，只见宝琴来了，披着一领斗篷，金翠辉煌，不知何物。宝钗忙问：“这是那里的？”宝琴笑道：“因下雪珠儿，老太太找了这一件给我的。”香菱上来瞧道：“怪道这么好看，原来是孔雀毛织的。”湘云笑道：“那里是孔雀毛？就是野鸭子头上的毛做的。可见老太太疼你了，这么着疼宝玉，也没给他穿。”宝钗笑道：“真是俗语说的，‘各人有各人的缘法’。我也想不到他这会子来，既来了，又有老太太这么疼他。”湘云道：“你除了在老太太跟前，就在园里，来这两处，只管玩笑吃喝…","so":0,"eo":0},{"surface":"宝玉","text":"说话之间，宝玉、黛玉进来了，宝钗犹自嘲笑。湘云因笑道：“宝姐姐，你这话虽是玩，却有人真心是这样想呢。”琥珀笑道：“真心恼的再没别人，就只是他。”口里说，手抬着宝玉。宝钗、湘云都笑道：“他倒不是这样人。”琥珀又笑道：“不是他，就是他。”说着，又指黛玉。湘云便不作声。宝钗笑道：“更不是了。我的妹妹和他的妹妹一样，他喜欢的比我还甚呢，他那里还恼？你信云儿混说，他那嘴有什么正经。”宝玉素昔深知黛玉有些小性儿，尚不知近日黛玉和宝钗之事，正恐贾母疼…","so":0,"eo":0},{"surface":"宝玉","text":"一时宝钗姊妹往薛姨妈房内去后，湘云往贾母处来，林黛玉回房歇着。宝玉便找了黛玉来，笑道：“我虽看了《西厢记》，也曾有明白的几句说了取笑，你还曾恼过。如今想来，竟有一句不解，我念出来，你讲讲我听。”黛玉听了，便知有文章，因笑道：“你念出来我听听。”宝玉笑道：“那《闹简》上有一句说的最好：‘是几时孟光接了梁鸿案？’这五个字不过是现成的典，难为他‘是几时’三个虚字，问的有趣。是几时接了？你说说我听听。”黛玉听了，禁不住也笑起来，因笑道：“这原问…","so":0,"eo":0}]},{"chap":50,"ctitle":"第50章 芦雪庭争联即景诗 暖香坞雅制春灯谜","deeds":[{"surface":"宝玉","text":"宝玉道：","so":0,"eo":0},{"surface":"宝玉","text":"一面说，一面推宝玉命他联。宝玉正看宝琴、宝钗、黛玉三人共战湘云，十分有趣，那里还顾得联诗？今见黛玉推他，方联道：","so":0,"eo":0},{"surface":"宝玉","text":"李纨道：“够了够了。虽没全完了韵，腾挪的字，若生扭了，倒不好了。”说着大家来细细评论一回，独
