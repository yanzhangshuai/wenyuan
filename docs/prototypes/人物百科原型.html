  DATA = {"generatedAt":"2026-10-14T00:33:19.465Z","works":[{"title":"儒林外史","entities":[{"id":"5b64c4f5-e4bf-4b54-8131-6f00dd9b98e7","name":"杜少卿","type":"PERSON","mentionCount":114,"chapterCount":17,"firstChapter":31,"lastChapter":56,"aliases":["少卿兄","少卿先生","杜世兄","杜仪","杜仪少卿","杜少老爷","杜相公"],"density":"rich","timeline":[{"chap":31,"ctitle":"第三十一回　天长县同访豪杰　赐书楼大醉高朋","deeds":[{"surface":"杜少卿","text":"杜少卿慌忙迎出来，请到厅上拜见，说道：“老伯，相别半载，不曾到得镇上来请老伯和老伯母的安。老伯一向好？”韦四大爷道：“托庇粗安。新秋在家无事，想着尊府的花园，桂花一定盛开了，所以特来看看世兄，要杯酒吃。”杜少卿道：“奉过茶，请老伯到书房里去坐。”小厮捧过茶来，杜少卿吩咐：“把韦四太爷行李请进来，送到书房里去。轿钱付与他，轿子打发回去罢。”请韦四太爷从厅后一个走巷内，曲曲折折走进去，才到一个花园。那花园一进朝东的三间。左边一个楼，便是殿元…","so":0,"eo":0},{"surface":"杜少卿","text":"当请韦四太爷坐在朝南的书房里，这两树桂花就在窗隔外。韦四太爷坐下，问道：“娄翁尚在尊府？”杜少卿道：“娄老伯近来多病，请在内书房住，方才吃药睡下，不能出来会老伯。”韦四太爷道：“老人家既是有恙，世兄何不送他回去？”杜少卿道：“小侄已经把他令郎、令孙都接在此侍奉汤药，小侄也好早晚问候，”韦四太爷道：“老人家在尊府三十多年，可也还有些蓄积，家里置些产业？”杜少卿道：“自先君赴任赣川，把舍下田地房产的账目，都交付与娄老伯，每银钱出入，俱是娄老…","so":0,"eo":0},{"surface":"杜少卿","text":"正说着，家人王胡子手里拿着一个红手本，站在窗子外不敢进来。杜少卿看见他，说道：“王胡子，你有甚么话说？手里拿的甚么东西？”王胡子走进书房，把手本递上来，禀道：“南京一个姓鲍的，他是领戏班出身。他这几年是在外路生意，才回来家。他过江来叩见少爷。”杜少卿道：“他既是领班子的，你说我家里有客，不得见他，手本收下，叫他去罢。”王胡子说道：“他说受过先太老爷多少恩德，定要当面叩谢少爷，”杜少卿道：“这人是先太老爷抬举过的么？”王胡子道：“是。当年…","so":0,"eo":0},{"surface":"杜少卿","text":"王胡子出去，领着鲍廷玺捏手捏脚一路走进来。看见花园宽阔，一望无际，走到书房门口一望，见杜少卿陪着客坐在那里，头戴方巾，身穿玉色夹纱直裰，脚下珠履，面皮微黄，两眉剑竖，好似画上关夫子眉毛。王胡子道：“这便是我家少爷，你过来见。”鲍廷玺进来跪下叩头。杜少爷扶住道：“你我故人，何必如此行礼？”起来作揖，作揖过了，又见了韦四太爷。杜少卿叫他坐在底下。鲍廷玺道：“门下蒙先老太爷的恩典，粉身碎骨难报。又因这几年穷忙，在外做小生意，不得来叩见少爷。今…","so":0,"eo":0},{"surface":"杜少卿","text":"少刻，请了一个大眼睛黄胡子的人来，头戴瓦楞帽，身穿大阔布衣服，扭扭捏捏做些假斯文象，进来作揖坐下，问了韦四太爷姓名，韦四太爷说了，便问：“长兄贵姓？”那人道：“晚生姓张，贱字俊民，久在杜少爷门下，晚生略知医道，连日蒙少爷相约，在府里看娄太爷。”因问：“娄太爷今日吃药如何？”杜少卿便叫加爵去问，问了回来道：“娄太爷吃了药，睡了一觉，醒了，这会觉的清爽些。”张俊民又问，“此位上姓？”杜少卿道：“是南京一位鲍朋友。”说罢，摆上席来，奉席坐下。…","so":0,"eo":0},{"surface":"杜少卿","text":"王胡子又拿一个帖子进来，享道：“北门汪盐商家明日酬生日，请县主老爷，请少爷去做陪客。说定要求少爷到席的。”杜少卿道：“你回他我家里有客，不得到席。这人也可笑得紧，你要做这热闹事，不会请县里暴发的举人、进士陪？我那得工夫替人家陪官！”王胡子应诺去了。","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿向韦四太爷说：“老伯酒量极高的，当日同先君一吃半夜，今日也要尽醉才好。”韦四太爷道：“正是。世兄，我有一句话，不好说。你这肴馔是精极的了，只是这酒是市买来的，身分有限，府上有一坛酒，今年该有八九年了，想是收着还在？”杜少卿道：“小侄竟不知道。”韦四太爷道：“你不知道。是你令先大人在江西到任的那一年，我送到船上，尊大人说：‘我家里埋下一坛酒，等我做了官回来，同你老痛饮。’我所以记得。你家里去问。”张俊民笑说道：“这话，少爷真正该不知…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿走进去，问娘子可晓得这坛酒，娘子说不知道；遍问这些家人、婆娘，都说不知道。后来问到邵老丫，邵老丫想起来道：“是有的。是老爷上任那年，做了一坛酒埋在那边第七进房子后一间小屋里，说是留着韦四太爷同吃的，这酒是二斗糯米做出来的二十斤酿，又对了二十斤烧酒，一点水也不搀。而今埋在地下足足有九年零七月了。这酒醉得死人的，弄出来少爷不要吃！”杜少爷道：“我知道了。”就叫邵老丫拿钥匙开了酒房门，带了两个小厮进去，从地下取了出来，连坛抬到书房里，叫…","so":0,"eo":0}]},{"chap":32,"ctitle":"第三十二回　杜少卿平居豪举　娄焕文临去遗言","deeds":[{"surface":"杜少卿","text":"话说众人吃酒散了，韦四太爷直睡到次日上午才起来，向杜少卿辞别要去，说道：“我还打算到你令叔、令兄各家走走。昨日扰了世兄这一席酒，我心里诀活极了！别人家料想也没这样有趣。我要去了，连这臧朋友也不能回拜，世兄替我致意他罢。”杜少卿又留住了一日。次日，雇了轿夫，拿了一只玉杯和赣州公的两件衣服，亲自送在韦四太爷房里，说道：“先君拜盟的兄弟，只有老伯一位了，此后要求老伯常来走走。小侄也常到镇上请老伯安。这一个玉杯，送老伯带去吃酒，这是先君的两件衣…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿应了，心里想着没有钱用，叫王胡子来商议道：“我圩里那一宗田，你替我卖给那人罢了。”王胡子道：“那乡人他想要便宜，少爷要一千五百两银子，他只出一千三百两银子，所以小的不敢管。”杜少卿道：“就是一千三百两银子也罢。”王胡子道：“小的要禀明少爷才敢去。卖的贱了，又惹少爷骂小的。”杜少卿道：“那个骂你？你快些去卖；我等着要银子用。”王胡子道：“小的还有一句话要禀少爷：卖了银子，少爷要做两件正经事。若是几千几百的白白的给人用，这产业卖了也可…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿收了这银子，随即叫了娄太爷的孙子到书房里，说道：“你明日要回去？”他答应道：“是。老爹叫我回去。”杜少卿道：“我这里有一百两银子给你，你瞒着不要向你老爹说。你是寡妇母亲，你拿着银子回家去做小生意养活着。你老爹若是好了，你二叔回家去，我也送他一百两银子。”娄太爷的孙子欢喜接着，把银子藏在身边，谢了少爷。次日辞回家去，娄太爷叫只称三钱银子与他做盘缠，打发去了。","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿送了回来，一个乡里人在敞厅上站着，见他进来，跪下就与少爷磕头。杜少卿道：“你是我们公祠堂里看祠堂的黄大？你来做甚么？”黄大道：“小的住的祠堂旁边一所屋，原是太老爷买与我的。而今年代多，房子倒了。小的该死，把坟山的死树搬了几棵回来添补梁柱，不想被本家这几位老爷知道，就说小的偷了树，把小的打了一个臭死，叫十几个管家到小的家来搬树，连不倒的房子多拉倒了。小的没处存身，如今来求少爷向本家老爷说声，公中弄出些银子来，把这房子收拾收拾，赏小的…","so":0,"eo":0},{"surface":"杜少卿","text":"门上拿了两副帖子走进来，享道：“臧三爷明日请少爷吃酒，这一副帖子，说也请鲍师父去坐坐。”杜少卿道：“你说拜上三爷，我明日必来。”次日，同鲍廷玺到臧家。臧蓼斋办了一桌齐整菜，恭恭敬敬，奉坐请酒。席间说了些闲话。到席将终的时候，臧三爷斟了一杯酒，高高奉着，走过席来，作了一个揖，把酒递与杜少卿，便跪了下去，说道：“老哥，我有一句话奉求。”杜少卿吓了一跳，慌忙把酒丢在桌上，跪下去拉着他，说道：“三哥，你疯了？这是怎说？”臧寥斋道：“你吃我这杯酒…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿醉了，问道：“臧三哥，我且问你，你定要这廪生做甚么？”臧寥斋道：“你那里知道！廪生，一来中的多，中了就做宫。就是不中，十几年贡了，朝廷试过，就是去做知县、推宫，穿螺蛳结底的靴，坐堂，洒签，打人。像你这样大老官来打秋风，把你关在一间房里，给你一个月豆腐吃，蒸死了你！”杜少卿笑道：“你这匪类，下流无耻极矣！”鲍廷玺又笑道：“笑谈！笑谈！二位老爷都该罚一杯。”当夜席散。","so":0,"eo":0},{"surface":"杜少卿","text":"王胡子回家，问小子们道：“少爷在那里，”小子们道：“少爷在书房里。”他一直走进书房，见了杜少卿，禀道，“银子已是小的送与臧三爷收了，着实感激少爷，说又替他兔了一场是非，成全了功名。其实这样事别人也不肯做的。”杜少卿道：“这是甚么要紧的事，只管跑了来倒熟了！”胡子道：“小的还有话禀少爷。像臧三爷的廪，是少爷替他补，公中青祠堂的房子，是少爷盖，眼见得学院不日来考，又要寻少爷修理考棚。我家太老爷拿几千银子盖了考棚，白白便益众人，少爷就送一个人…","so":0,"eo":0},{"surface":"杜少卿","text":"这几日，娄太爷的病渐渐有些重起来了，杜少卿又换了医生来看，在家心里忧愁。忽一日，臧三爷走来，立着说道：“你晓得有个新闻？县里王公坏了，昨晚摘了印，新官押着他就要出衙门，县里人都说他是个混账官，不肯借房子给他住，在那里急的要死。”杜少卿道：“而今怎样了？”臧寥斋道：“他昨晚还赖在衙门里，明日再不出，就要讨没脸面。那个借屋与他住？只好搬在孤老院！”杜少卿道：“这话果然么？”叫小厮叫王胡子来，向王胡子道：“你快到县前向工房说，叫他进去禀王老爷…","so":0,"eo":0}]},{"chap":33,"ctitle":"第三十三回　杜少卿夫妇游山　迟衡山朋友议礼","deeds":[{"surface":"杜少卿","text":"话说杜少卿自从送了娄太爷回家之后，自此就没有人劝他，越发放着胆子用银子。前项已完，叫王胡子又去卖了一分田来，二千多银子，随手乱用。又将一百银子把鲍廷玺打发过江去了。王知县事体已清，退还了房子，告辞回去。杜少卿在家又住了半年多，银子用的差不多了，思量把自己住的房子并与本家，要到南京去住，和娘子商议，娘子依了。人劝着，他总不肯听。足足闹了半年，房子归并妥了。除还债赎当，还落了有千把多银子，和娘子说道：“我先到南京会过卢家表侄，寻定了房子，再…","so":0,"eo":0},{"surface":"杜少卿","text":"到了仓巷里外祖卢家，表侄卢华士出来迎请表叔进去，到厅上见礼。杜少卿又到楼上拜了外祖、外祖母的神主。见了卢华士的母亲，叫小厮拿出火腿、茶叶土仪来送过。卢华士请在书房里摆饭，请出一位先生来，是华士今年请的业师。那先生出来见礼，杜少卿让先生首席坐下。杜少卿请问：“先生贵姓？”那先生道：“贱姓迟，名均，字衡山。请问先生贵姓？”卢华士道：“这是学生天长杜家表叔。”迟先生道：“是少卿？先生是海内英豪，千秋快士！只道闻名不能见面，何图今日邂逅高贤！”…","so":0,"eo":0},{"surface":"杜少卿","text":"走到状元境，只见书店里贴了多少新封面，内有一个写道：“《历科程墨持运》。处州马纯上、嘉兴蘧验夫同选，”杜少卿道：“这蘧验夫是南昌蘧太守之孙，是我敝世兄。既在此，我何不进去会会他？”便同迟先生进去。蘧验夫出来叙了世谊，彼此道了些相慕的话。马纯上出来叙礼，问：“先生贵姓？”蘧验夫道：“此乃天长殿元公孙杜少卿先生，这位是句容迟衡山先生，皆江南名坛领袖。小弟辈恨相见之晚。”吃过了茶，迟衡山道：“少卿兄要寻居停，此时不能久谈，要相别了。”同走出来…","so":0,"eo":0},{"surface":"杜少卿","text":"当下走过淮清桥，迟衡山路熟，找着房牙子，一路看了几处河房，多不中意，一直看到东水关。这年是乡试年，河房最贵，这房子每月要八两银子的租钱。杜少卿道：“这也罢了，先租了住着，再买他的。”南京的风俗是要付一个进房，一个押月。当下房牙子同房主人跟到仓巷卢家写定租约，付了十六两银子。卢家摆酒留迟衡山同杜少卿坐坐，到夜深，迟衡山也在这里宿了。","so":0,"eo":0},{"surface":"杜少卿","text":"次早，才洗脸，只听得一人在门外喊了进来：“杜少卿先生在那里？”杜少卿正要出去看，那人已走进来，说道：“且不要通姓名，且等我猜一猜着！”定了一会神，走上前，一把拉着少卿道：“你便是杜少卿。”杜少卿笑道：“我便是杜少卿。这位是迟衡山先生，这是舍表侄。先生，你贵姓？”那人道：“少卿天下豪士，英气逼人，小弟一见丧胆，不似迟先生老成尊重，所以我认得不错。小弟便是季苇萧。”迟衡山道：“是定梨园榜的季先生？久仰，久仰！”季苇萧坐下，向杜少卿道：“令兄…","so":0,"eo":0},{"surface":"杜少卿","text":"次日清晨，正要回拜季苇萧这几个人，又是郭铁笔同来道士来拜。杜少卿迎了进来，看见道士的模样，想起昨日的话，又忍不住笑。道士足恭了一回，拿出一卷诗来。郭铁笔也送了两方图书。杜少卿都收了。吃过茶，告别去了。杜少卿方才出去回拜这些人。一连在卢家住了七八夭，同迟衡山谈些礼乐之事，甚是相合，家眷到了，共是四只船，拢了河房。杜少卿辞别卢家，搬了行李去。","so":0,"eo":0},{"surface":"杜少卿","text":"次日众人来贺。这时三月初旬，河房渐好，也有萧管之声。杜少卿备酒请这些人，共是四席。那日，季苇萧、马纯上、蘧验夫、季恬逸、迟衡山、卢华士、景兰江、诸葛天申、萧金铉、郭铁笔，来霞士都在席。金东崖是河房邻居，拜往过了。也请了来。本日茶厨先到，鲍廷玺打发新教的三元班小戏子来磕头，见了杜少卿、杜娘子，赏了许多果子去了。随即房主人家荐了一个卖花堂客叫做姚奶奶来见，杜娘子留他坐着。到上昼时分，客已到齐，将河房窗子打开了。众客散坐，或凭栏看水，或啜茗闲…","so":0,"eo":0},{"surface":"杜少卿","text":"又过了几日，娘子因初到南京，要到外面去看看景致。杜少卿道：“这个使得，”当下叫了几乘轿子，约姚奶奶做陪客，两三个家人婆娘都坐了轿子跟着。厨子挑了酒席，借清凉山一个姚园。这姚园是个极大的园子，进去一座篱门。篱门内是鹅卵石砌成的路，一路朱红栏杆，两边绿柳掩映。过去三间厅，便是他卖酒的所在，那日把酒桌子都搬了。过厅便是一路山径，上到山顶，便是一个八角亭子。席摆在亭子上。娘子和姚奶奶一班人上了亭子，观看景致。一边是清凉山，高高下下的竹树；一边是…","so":0,"eo":0}]},{"chap":34,"ctitle":"第三十四回　议礼乐名流访友　备弓旌天子招贤","deeds":[{"surface":"杜少卿","text":"话说杜少卿别了迟衡山出来，问小厮道：“那差人他说甚么？”小厮道：“他说少爷的文书已经到了，李大老爷吩咐县里邓老爷请少爷到京里去做官，邓老爷现住在承恩寺。差人说，请少爷在家里，邓老爷自己上门来请。”杜少卿道：“既如此说，我不走前门家去了，你快叫一只船，我从河房栏杆上上去。”当下小厮在下浮桥雇了一只凉篷，杜少卿坐了来家。忙取一件旧衣服、一顶旧帽子，穿戴起来，拿手帕包了头，睡在床上，叫小厮：“你向那差人说，我得了暴病，请邓者爷不用来，我病好了…","so":0,"eo":0},{"surface":"杜少卿","text":"小厮进来说：“邓老爷来了，坐在河房里，定要会少爷。”杜少卿叫两个小厮搀扶着，做个十分有病的模样，路也走不全，出来拜谢知县，拜在地下就不得起来。知县慌忙扶了起来，坐下就道：“朝廷大典，李大人专要借光，不想先生病得狼狈至此。不知几时可以勉强就道？”杜少卿道：“治晚不幸大病，生死难保，这事断不能了。总求老父台代我恳辞。”袖子里取出一张呈子来递与知县。知县看这般光景，不好久坐，说道：“弟且别了先生，恐怕劳神。这事，弟也只得备文书详覆上去，看大人…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿因托病辞了知县，在家有许多时不曾出来。这日，鼓楼街薛乡绅家请酒，杜少卿辞了不到，迟衡山先到了。那日在坐的客是马纯上、蘧验夫、季苇萧，都在那里。坐定，又到了两位客：一个是扬州萧柏泉，名树滋；一个是采石余夔，字和声。是两个少年名士。这两人，面如傅粉，唇若涂朱，举止风流，芳兰竟体。这两个名士独有两个绰号：一个叫“余美人”，一个叫“萧姑娘”。两位会了众人，作揖坐下。薛乡绅道：“今日奉邀诸位先生小坐，淮清桥有一个姓钱的朋友，我约他来陪诸位顽…","so":0,"eo":0},{"surface":"杜少卿","text":"吃过了三遍茶，换去大衣服，请在书房里坐。这高老先生虽是一个前辈，却全不做身分，最好顽耍，同众位说说笑笑，并无顾忌，才进书房，就问道：“钱朋友怎么不见？”薛乡绅道：“他今日回了不得来。”高老先生道：“没趣！没趣！今日满座欠雅矣！”薛乡绅摆上两席，奉席坐下。席间谈到浙江这许多名士，以及西湖上的风景，娄氏弟兄两个许多结交宾客的故事。余美人道：“这些事我还不爱，我只爱验夫家的双红姐，说着还齿颊生香。”季苇萧道：“怪不得，你是个美人，所以就爱美人…","so":0,"eo":0},{"surface":"杜少卿","text":"次日，杜少卿才起来，坐在河房里，邻居金东崖拿了自己做的一个《四书讲章》来请教，摆桌子在河房里看。看了十几条，落后金东崖指着一条问道：“先生，你说这“羊枣’是甚么？羊枣即羊肾也。俗语说：‘只顾羊卵子，不顾羊性命。’所以曾子不吃。”杜少卿笑道：“古人解经也有穿凿的，先生这话就太不伦了。”正说着，迟衡山、马纯上、蘧验夫、萧柏泉、季苇萧、余和声，一齐走了进来，作揖坐下。杜少卿道：“小弟许久不曾出门，有疏诸位先生的教，今何幸群贤毕至！”便问：“二…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿道：“朱文公解经，自立一说，也是要后人与诸儒参看。而今丢了诸儒，只依朱注，这是后人固陋，与朱子不相干。小弟遍览诸儒之说，也有一二私见请教。即如《凯风》一篇，说七子之母想再嫁，我心里不安。古人二十而嫁，养到第七个儿子，又长大了，那母亲也该有五十多岁，那有想嫁之理？所谓‘不安其室’者，不过因衣服饮食不称心，在家吵闹，七子所以自认不是。这话前人不曾说过。”迟衡山点头道：“有理。”杜少卿道：“‘女曰鸡鸣’一篇，先生们说他怎么样好？”马二先…","so":0,"eo":0},{"surface":"杜少卿","text":"当下摆齐酒肴，八位坐下小饮。季苇萧多吃了几杯，醉了，说道：“少卿兄，你真是绝世风流。据我说，镇日同一个三十多岁的老嫂子看花饮酒，也觉得扫兴。据你的才名，又住在这样的好地方，何不娶一个标致如君，又有才情的，才子佳人，及时行乐？”杜少卿道：“苇兄，岂不闻晏子云：‘今虽老而丑，我固及见其姣且好也。’况且娶妾的事，小弟觉得最伤天理。天下不过是这些人，一个人占了几个妇人，天下必有几个无妻之客。小弟为朝廷立法：人生须四十无子，方许娶一妾；此妾如不生…","so":0,"eo":0},{"surface":"杜少卿","text":"过了几日，迟衡山独自走来，杜少卿会着。迟衡山道：“那泰伯祠的事，已有个规模了。将来行的礼乐，我草了一个底稿在此，来和你商议，替我斟酌起来。”杜少卿接过底稿看了道：“这事还须寻一个人斟酌。”迟衡山道，“你说寻那个？”杜少卿道：“庄绍光先生。”迟衡山道：“他前日浙江回米了。”杜少卿道：“我正要去。我和你而今同去看他。”","so":0,"eo":0}]},{"chap":35,"ctitle":"第三十五回　圣天子求贤问道　庄征君辞爵还家","deeds":[{"surface":"杜少卿","text":"一日，同娘子赁栏看水，笑说道：“你看这些湖光山色都是我们的了！我们日日可以游玩，不像杜少卿要把尊壶带了清凉山去看花。”闲着无事，又斟酌一樽酒，把杜少卿做的《诗说》，叫娘子坐在傍边，念与他听。念到有趣处，吃一大杯，彼此大笑。庄征君在湖中着实自在。忽一日，有人在那边岸上叫船。这里放船去渡了过来，庄征君迎了出去。那人进来拜见，便是卢信侯。庄征君大喜道：“途间一别，渴想到今。今日怎的到这里？”卢信侯道：“昨日在尊府，今日我方到这里。你原来在这里…","so":0,"eo":0},{"surface":"杜少卿","text":"过两日，又有两个人在那边叫渡船渡过湖来。庄征君迎出去，是迟衡山、杜少卿。庄征君欢喜道：“有趣，‘正欲清谈闻客至’。”邀在湖亭上去坐。迟衡山说要所订泰伯祠的礼乐。庄征君留二位吃了一天的酒，将泰伯祠所行的礼乐商订的端端正正，交与迟衡山拿去了。","so":0,"eo":0},{"surface":"杜少卿","text":"转眼过了年。到二月半间，迟衡山约同马纯上、蘧验夫、季苇萧、萧金铉、金东崖，在杜少卿河房里商议祭泰伯祠之事。众人道：“却是寻那一位做个主祭？”迟衡山道：“这所祭的是个大圣人，须得是个圣贤之徒来主祭，方为不愧。如今必须寻这一个人。”众人道：“是那一位？”迟衡山叠着指头，说出这个人来。只因这一番，有分教：千流万派，同归黄河之源；玉振金生，尽入黄钟之管。毕竟此人是谁，且听下回分解。","so":0,"eo":0}]},{"chap":36,"ctitle":"第三十六回　常熟县真儒降生　泰伯祠名贤主祭","deeds":[{"surface":"杜少卿","text":"虞博士去参见了国子监祭酒李大人，回来升堂坐公座。监里的门生纷纷来拜见。虞博士看见帖子上有一个武书，虞博士出去会着，问道：“那一位是武年兄讳书的？”只见人丛里走出一个矮小人，走过来答道：“门生便是武书。”虞博士道：“在京师久仰年兄克敦孝行，又有大才。”从新同他见了礼，请众位坐下。武书道：“老师文章山斗，门生辈今日得沾化雨，实为侥幸。”虞博士道：“弟初到此间，凡事俱望指教。年兄在监几年了？”武书道：“不瞒老师说，门主少孤，奉事母亲在乡下住。…","so":0,"eo":0},{"surface":"杜少卿","text":"次日，便往元武湖去拜庄征君，庄征君不曾会。虞博士便到河房去拜杜少卿，杜少卿会着。说起当初杜府殿元公在常熟过，曾收虞博士的祖父为门生。殿元乃少卿曾祖，所以少卿称虞博士为世叔。彼此谈了些往事。虞博士又说起仰慕庄征君，今日无缘，不曾会着。杜少卿道：“他不知道，小侄和他说去。”虞博士告别去了。","so":0,"eo":0},{"surface":"杜少卿","text":"次日，杜少卿走到元武湖，寻着了庄征君，问道：“昨日虞博士来拜。先生怎么不会他？”庄征君笑道：“我因谢绝了这些冠盖，他虽是小官，也懒和他相见。”杜少卿道：“这人大是不同，不但无学博气，尤其无进士气。他襟怀冲淡，上而伯夷、柳下惠，下而陶靖节一流人物。你会见他便知。”庄征君听了，便去回拜，两人一见如故。虞博士爱庄征君的恬适，庄征君爱虞博士的浑雅，两人结为性命之交。","so":0,"eo":0},{"surface":"杜少卿","text":"转眼新春二月，虞博士去年到任后，自己亲手栽的一树红梅花，今已开了几枝。虞博士欢喜，叫家人备了一席酒，请了杜少卿来，在梅花下坐，说道：“少卿，春光已见几分，不知十里江梅如何光景？几时我和你携罐去探望一回。”杜少卿道：“小侄正有此意，要约老叔同庄绍光兄作竟日之游。”说着，又走进两个人来。这两人就在国子监门口住，一个姓储，叫做储信，一个姓伊，叫做伊昭，是积年相与学博的。虞博士见二人走了进来，同他见礼让坐。那二人不僭杜少卿的坐。坐下，摆上酒来，…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿吃完了酒，告别了去。那两人还坐着，虞博士进来陪他。伊昭问道：“老师与杜少卿是甚么的相与？”虞博士道：“他是我们世交，是个极有才情的。”伊昭道：“门主也不好说。南京人都知道他本来是个有钱的人，而今弄穷了，在南京躲着，专好扯谎骗钱。他最没有品行！”虞博士道：“他有甚么没品行？”伊昭道：“他时常同乃眷上酒馆吃酒，所以人都笑他。”虞博士道：“这正是他风流文雅处，俗人怎么得知。”储信道：“这也罢了，倒是老师下次有甚么有钱的诗文，不要寻他做。…","so":0,"eo":0},{"surface":"杜少卿","text":"又过了几日，门上传进一副大红连名全帖，上写道：“晚生迟均、马静、季崔、蘧来旬，门生武书、余夔，世侄杜仪同顿首拜。”虞博士看了道：“这是甚么缘故？”慌忙出去会这些人。只因这一番，有分教：先圣祠内，共观大礼之光；国子监中，同仰斯文之主。毕竟这几个人来做甚么，且听下回分解。","so":0,"eo":0}]},{"chap":37,"ctitle":"第三十七回　祭先圣南京修礼　送孝子西蜀寻亲","deeds":[{"surface":"杜少卿","text":"话说虞博士出来会了这几个人，大家见礼坐下。迟衡山道，“晚生们今日特来，泰伯祠大祭商议主祭之人，公中说，祭的是大圣人，必要个贤者主祭，方为不愧，所以特来公请老先生。”虞博士道：“先生这个议论，我怎么敢当？只是礼乐大事，自然也愿观光。请问定在几时？”迟衡山道：“四月初一日。先一日就请老先生到来祠中斋戒一宿，以便行礼。”虞博士应诺了，拿茶与众位吃，吃过，众人辞了出来，一齐到杜少卿河房里坐下。迟衡山道：“我们司事的人，只怕还不足。”杜少卿道：“…","so":0,"eo":0},{"surface":"杜少卿","text":"到三月二十九日，迟衡山约齐杜仪、马静、季萑、金东崖、卢华士、辛东之、蘧来旬、余夔、卢德、虞感祁、诸葛佑、景本蕙、郭铁笔、萧鼎、储信、伊昭、季恬逸、金寓刘、宗姬、武书、臧茶，一齐出了南门，随即庄尚志也到了。众人看那泰伯祠时，几十层高坡上去，一座大门，左边是省牲之所。大门过去，一个大天井。又几十层高坡上去，三座门。进去一座丹墀。左右两廊奉着从祀历代先贤神位，中间是五间大殿，殿上泰伯神位，面前供桌、香炉、烛台。殿后又一个丹墀，五间大楼。左右两…","so":0,"eo":0},{"surface":"杜少卿","text":"金次福、鲍廷玺两人领了一班司球的、司琴的、司瑟的、司管的、司鼗鼓的、司祝的、司敏的、司笙的、司镛的、司萧的、司编钟的、司编磬的，和六六三十六个俏舞的孩子，进来见了众人。迟衡山把签、翟交与这些孩子。下午时分，虞博士到了。庄绍光、迟衡山、马纯上、杜少卿迎了进来。吃过了茶，换了公服，四位迎到省牲所去省了牲。众人都在两边书房里斋宿。","so":0,"eo":0},{"surface":"杜少卿","text":"次日五鼓，把祠门大开了，众人起来，堂上、堂下、门里、门外、两廊，都点了灯烛，庭燎也点起来。迟衡山先请主祭的博士虞老先生，亚献的征君庄老先生；请到三献的，众人推让，说道：“不是迟先生，就是杜先生。”迟衡山道：“我两人要做引赞，马先生系浙江人，请马纯上先生三献。”马二先生再三不敢当，众人扶住了马二先生，同二位老先生一处。迟衡山、杜少卿先引这三位老先生出去，到省牲所拱立。迟衡山、杜少卿回来，请金东崖先生大赞；请武书先生司麾；请臧茶先生司祝；请…","so":0,"eo":0},{"surface":"杜少卿","text":"金东崖先进来到堂上，卢华士跟着。金东崖站定，赞道：“执事者，各司其事！”这些司乐的都将乐器拿在手里。金东崖赞：“排班。”司麾的武书，引着司尊的季筐、辛东之、余夔，司玉的蘧来旬、卢德、虞感祁，司帛的诸葛佑，景本蕙、郭铁笔，入了位，立在丹墀东边：引司祝的臧茶上殿，立在祝版跟前；引司稷的萧鼎、储信、伊昭，司馔的季恬逸、金寓刘、宗姬，入了位，立在丹墀西边。武书捧了麾，也立在西边众人下。金东崖赞：“奏乐。”堂上堂下，乐声俱起。金东崖赞：“迎神。”…","so":0,"eo":0},{"surface":"杜少卿","text":"金东崖赞：“分献者就位。”迟均、杜仪出去引庄征君、马纯上进来，立在丹墀里拜位左右两边。金东崖赞：“主祭者就位。”迟均、杜仪出去引虞博士上来，立在丹墀里拜位中间。迟均、杜仪一左一右，立在丹墀里香案傍。迟均赞：“盥洗。”同杜仪引主祭者盥洗了上来。迟均赞：“主祭者诣香案前。”香案上一个沉香筒，里边插着许多红旗，杜仪抽一枝红旗在手，上有“奏乐”二字。虞博士走上香案前。迟均赞道：“跪。升香。灌地。拜，兴；拜，兴；拜，兴；拜，兴。复位。”杜仪又抽出…","so":0,"eo":0},{"surface":"杜少卿","text":"金东崖赞：“行初献礼。”卢华士在殿里抱出一个牌子来，上写“初献”二字。迟均、杜仪引着主祭的虞博士，武书持麾在迟均前走。三人从丹墀东边走，引司尊的季萑、司玉的蘧来旬、司帛的诸葛佑，一路同走；引着主祭的从上面走。走过西边，引司稷的萧鼎、司馔的季恬逸，引着主祭的从西边下来，在香案前转过东边上去。进到大殿，迟均、杜仪立于香案左右。季萑捧着尊，蘧来旬捧着玉，诸葛佑捧着帛，立在左边；萧鼎捧着稷，季恬逸捧着馔，立在右边。迟均赞：“就位。跪。”虞博士跪…","so":0,"eo":0},{"surface":"杜少卿","text":"金东崖赞：“一奏至德之章，舞至德之容。”堂上乐细细奏了起来。那三十六个孩子，手持签、翟，齐上来舞。乐舞已毕。金东崖赞：“阶下与祭者皆跪。读祝文。”臧茶跪在祝版前，将祝文读了。金东崖赞：“退班。”迟均赞：“平身。复位。”武书、迟均、杜仪、季萑、蘧来旬、诸葛佑、萧鼎、季恬逸引着主祭的虞博士，从西边一路走了下来。虞博士复归主位，执事的都复了原位。","so":0,"eo":0}]},{"chap":38,"ctitle":"第三十八回　郭孝子深山遇虎　甘露僧狭路逢仇","deeds":[{"surface":"杜少卿","text":"话说杜少卿留郭孝子在河房里吃酒饭，自己同武书到虞博士署内，说如此这样一个人，求老师一封书子去到西安。虞博士细细听了，说道：“这书我怎么不写？但也不是只写书子的事，他这万里长途，自然盘费也难，我这里拿十两银子，少卿，你去送与他，不必说是我的。”慌忙写了书子，和银子拿出来交与杜少卿。杜少卿接了，同武书拿到河房里。杜少卿自己寻衣服当了四两银子，武书也到家去当了二两银子来，又苦留郭孝子住了一日。庄征君听得有这个人，也写了一封书子、四两银子送来与…","so":0,"eo":0}]},{"chap":40,"ctitle":"第四十回　萧云仙广武山赏雪　沈琼枝利涉桥卖文","deeds":[{"surface":"杜少卿","text":"武书送出大门，看见监里斋夫飞跑了来，说道：“大堂虞者爷立候相公说话。”武书走去见虞博士。虞博士道：“年兄，令堂旌表的事，部里为报在后面，驳了三回，如今才准了。牌坊银子在司里，年兄可作速领去。”武书谢了出来。次日，带了帖子去回拜萧守备，萧云仙迎入川堂，作揖奉坐。武书道：“昨日枉驾后，多慢！拙作过蒙称许，心切不安，还有些拙刻带在这边，还求指教。”因在袖内拿出一卷诗来。萧云仙接着，看了数首，赞叹不已。随请到书房里坐了。摆上饭来，吃过。萧云仙拿…","so":0,"eo":0}]},{"chap":41,"ctitle":"第四十一回　庄濯江话旧秦淮河　沈琼枝押解江都县","deeds":[{"surface":"杜少卿","text":"国子监的武书是四月尽间生辰，他家中穷，请不起客。杜少卿备了一席果碟，沽几斤酒，叫了一只小凉篷船，和武书在河里游游。清早请了武书来，在河房里吃了饭，开了水门，同下了船。杜少卿道：“正字兄，我和你先到冷淡处走走，”叫船家一路荡到进香河，又荡了回来，慢慢吃酒。吃到下午时候，两人都微微醉了。荡到利涉桥，上岸走走，见马头上贴着一个招牌，上写道：","so":0,"eo":0},{"surface":"杜少卿","text":"武书看了，大笑道：“杜先生，你看南京城里偏有许多奇事，这些地方都是开私门的女人住，这女人眼见的也是私门了，却挂起一个招牌来，岂不可笑！”杜少卿道：“这样的事我们管他怎的？且到船上去煨茶吃。”便同下了船，不吃酒了，煨起上好的茶来，二人吃着闲谈。过了一回，回头看见一轮明月升上来，照得满船雪亮，船就一直荡上去。","so":0,"eo":0},{"surface":"杜少卿","text":"到了月牙池，见许多游船在那里放花炮，内有一只大船，挂着四盏明角灯，铺着凉簟子，在船上中间摆了一席。上面坐着两个客；下面主位上坐着一位，头戴方巾，身穿白纱直裰，脚下凉鞋，黄瘦面庞，清清疏疏三绺白须；横头坐着一个少年，白净面皮，微微几根胡子，眼张失落，在船上两边看女人。这小船走近大船眼前，杜少卿同武书认得那两个客，一个是卢信侯，一个是庄绍光，却认不得那两个人。庄绍光看见二人，立起身来道：“少卿兄，你请过来坐。”杜少卿同武书上了大船。主人和二…","so":0,"eo":0},{"surface":"杜少卿","text":"庄濯江叫从新拿上新鲜酒来，奉与诸位吃。庄濯江就问：“少卿兄几时来的？寓在那里？”庄绍光道：“他已经在南京住了八九年了。尊居现在这河房里。”庄濯江惊道：“尊府大家，园亭花木甲于江北，为甚么肯搬在这里？”庄绍光便把少卿豪举，而今黄金已随手而尽，略说了几句。庄濯江不胜叹息，说道：“还记得十七八年前，我在湖广，鸟衣韦四先生寄了一封书子与我，说他酒量越发大了，二十年来，竟不得一回恸醉，只有在天长赐书楼吃了一坛九年的陈酒，醉了一夜，心里快畅的紧，所…","so":0,"eo":0},{"surface":"杜少卿","text":"当下四五人谈心话旧，一直饮到半夜。在杜少卿河房前观那河里灯人阑珊，笙歌渐歇，耳边忽听得玉萧一声。众人道：“我们各自分手罢。”武书也上了岸去。庄濯江虽年老，事庄绍光极是有礼。当下杜少卿在河房前过，上去回家。庄濯江在船上一路送庄绍光到北门桥，还自己同上岸，家人打灯笼，同卢信候送到庄绍光家，方才回去。庄绍光留卢信侯住了一夜，次日，依旧同往湖园去了。庄濯江次日写了“庄洁率子非熊”的帖子，来拜杜少卿。杜少卿到莲花桥来回拜，留着谈了一日。","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿又在后湖会着庄绍光。庄绍光道：“我这舍侄，亦非等闲之人，他四十年前在泗州同人合本开典当。那合本的人穷了，他就把他自己经营的两万金和典当拱手让了那人，自己一肩行李，跨一个疲驴，出了泗州城。这十数年来，往来楚越，转徒经营，又自致数万金，才置了产业，南京来住。平日极是好友敦伦，替他尊人治丧，不曾要同胞兄弟出过一个钱，俱是他一人独任。多少老朋友死了无所归的，他就殡葬他。又极遵先君当年的教训，最是敬重文人，流连古迹。现今拿着三四千银子在鸡鸣…","so":0,"eo":0},{"surface":"杜少卿","text":"沈琼枝住在王府塘房子里，也同房主人娘子去烧香回来。沈琼枝自从来到南京，挂了招牌，也有来求诗的，也有来买斗方的，也有来托刺绣的。那些好事的恶少，都一传两，两传三的来物色，非止一日。这一日烧香回来，人见他是下路打扮，跟了他后面走的就有百十人。庄非熊却也顺路跟在后面，看见他走到王府塘那边去了。庄非熊心里有些疑惑，次日来到杜少卿家，说：“这沈琼枝在王府塘，有恶少们去说混话，他就要怒骂起来。此人来路甚奇，少卿兄何不去看看？”杜少卿道：“我也听见这…","so":0,"eo":0},{"surface":"杜少卿","text":"当下便留庄非熊在何房看新月。又请了两个客来：一个是退衡山，一个是武书。庄非熊见了，说些闲话，又讲起王府塘沈琼枝卖诗文的事。杜少卿道：“无论他是怎样，果真能做诗文，这也就难得了。”迟衡山道：“南京城里是何等地方！四方的名士还数不清，还那个去求妇女们的诗文？这个明明借此勾引人。他能做不能做，不必管他。”武书道：“这个却奇。一个少年妇女，独自在外，又无同伴，靠卖诗文过日子，恐怕世上断无此理。只恐其中有甚么情由。他既然会做诗，我们便邀了他来做做…","so":0,"eo":0}]},{"chap":43,"ctitle":"第四十三回　野羊塘将军大战　歌舞地酋长劫营","deeds":[{"surface":"杜少卿","text":"二爷道：“你们只管说话，这个人是那里来的？”那人上来磕头请安，怀里拿出一封书子来，递上来。六老爷道：“他姓臧，名唤臧歧，天长县人。这书是社少卿哥寄来的，说臧歧为人甚妥帖，荐来给大爷、二爷使唤。”二爷把信拆开，同大爷看，前头写着些请问老伯安好的话，后面说到“臧歧一向在贵州做长随，贵州的山僻小路他都认得，其人颇可以供使令”等语。大爷看过，向二爷说道，“杜世兄我们也许久不会他了，既是他荐来的人，留下使唤便了。”臧四磕头谢了下去。","so":0,"eo":0}]},{"chap":44,"ctitle":"第四十四回　汤总镇成功归故乡　余明经把酒问葬事","deeds":[{"surface":"杜少卿","text":"因走南京过，想起：“天长杜少卿住在南京利涉桥河房里，是我表弟，何不顺便去看看他？”便进城来到杜少卿家。杜少卿出来接着，一见表兄，心里欢喜，行礼坐下，说这十几年阔别的话。余大先生叹道：“老弟，你这些上好的基业，可惜弃了。你一个做大老官的人，而今卖文为活，怎么弄的惯？”杜少卿道：“我而今在这里，有山川朋友之乐，倒也住惯了。不瞒表兄说，我愚弟也无甚么嗜好，夫妻们带着几个儿子，布衣蔬食，心里淡然。那从前的事，也追悔不来了。”说罢奉茶与表兄吃。吃…","so":0,"eo":0},{"surface":"杜少卿","text":"余大先生道：“我们那边也极喜讲究的迁葬，少卿，这事行得行不得？”杜少卿道：“我还有一句直捷的话。这事朝廷该立一个法子，但凡人家要迁葬，叫他到有司衙门递个呈纸，风水具了甘结：棺材上有几尺水，几斗几升蚁。等开了，说得不错，就罢了；如说有水有蚁，挖开了不是，即于挖的时候，带一个刽子手，一刀把这奴才的狗头斫下来。那要迁坟的，就依子孙谋杀祖父的律，立刻凌迟处死。此风或可少息了。”余有达、迟衡山、武正字三人一齐拍手道：“说的畅快，说的畅快！拿大杯来…","so":0,"eo":0}]},{"chap":45,"ctitle":"第四十五回　敦友谊代兄受过　讲堪舆回家葬亲","deeds":[{"surface":"杜少卿","text":"话说余大先生把这家书拿来递与杜少卿看，上面写着大概的意思说：“时下有一件事，在这里办着，大哥千万不可来家。我听见大哥住在少卿表弟家，最好放心住着，等我把这件事料理清楚了来接大哥，那时大哥再回来。”余大先生道：“这毕竟是件甚么事？”杜少卿道：“二表兄既不肯说，表兄此时也没处去问，且在我这里住着，自然知道。”余大先生写了一封回书说：“到底是件甚么事，兄弟可作速细细写来与我，我不着急就是了。若不肯给我知道，我倒反焦心。“","so":0,"eo":0}]},{"chap":46,"ctitle":"第四十六回　三山门贤人饯别　五河县势利熏心","deeds":[{"surface":"杜少卿","text":"话说余大先生葬了父母之后，和二先生商议，要到南京去谢谢杜少卿；又因银子用完了，顺便就可以寻馆。收拾行李，别了二先生，过江到杜少卿河房里。杜少卿问了这场官事，余大先生细细说了。杜少卿不胜叹息。","so":0,"eo":0},{"surface":"杜少卿","text":"正在河房里闲话，外面传进来，有仪征汤大老爷来拜。余大先生问是那一位，杜少卿道：“便是请表兄做馆的了，不妨就会他一会。”正说着，汤镇台进来，叙礼坐下。汤镇台道：“少卿先生，前在虞老先生斋中得接光仪，不觉鄙吝顿消，随即登堂，不得相值，又悬我一日之思。此位老先生尊姓？”杜少卿道：“这便是家表兄余有达，老伯去岁曾要相约做馆的。”镇台大喜道：“今日无意中又晤一位高贤，真为幸事。”从新作揖坐下。余大先生道：“老先生功在社稷，今日角巾私第，口不言功，…","so":0,"eo":0},{"surface":"杜少卿","text":"过了三日，管家持帖邀客，请各位早到。庄濯江在家等候，庄征君已先在那里。少刻，迟衡山、武正字、杜少卿都到了。庄濯江收拾了一个大敞榭，四面都插了菊花。此时正是九月初五，天气亢爽，各人都穿着袷衣，啜茗闲谈。又谈了一会，汤镇台、萧守府、虞博士都到了，众人迎请进来，作揖坐下。汤镇台道：“我们俱系天涯海角之人，今幸得贤主人相邀一聚，也是三生之缘。又可惜虞老先生就要去了，此聚之后，不知快晤又在何时？”庄沁江道：“各位老先生当今山斗，今日惠顾茅斋，想五…","so":0,"eo":0},{"surface":"杜少卿","text":"坐定，家人捧上茶来，揭开来，似白水一般，香气芬馥，银针都浮在水面。吃过，又换了一巡真天都，虽是隔年陈的，那香气尤烈。虞博士吃着茶笑说道：“二位老先生当年在军中，想不见此物。”萧云仙道：“岂但军中，小弟在青枫城六年，得饮白水，已为厚幸，只觉强于马溺多矣！”汤镇台道：“果然青枫水草可支数年。”庄征君道：“萧老先生博雅，真不数北魏崔浩。”迟衡山道：“前代后代，亦时有变迁的。”杜少卿道：“宰相须用读书人，将帅亦须用读书人。若非萧老先生有识，安能…","so":0,"eo":0},{"surface":"杜少卿","text":"戏子吹打已毕，奉席让坐。戏子上来参堂。庄飞熊起身道：“今日因各位老先生到舍，晚生把梨园榜上有名的十九名都传了来，求各位老先生每人赏他一出戏。”虞博士问：“怎么叫做‘梨园榜’？”余大先生把昔年杜慎卿这件风流事述了一遍。众人又大笑。汤镇台向杜少卿道：“令兄已是铨选部郎了？”杜少卿道：“正是。”武正字道：“慎卿先生此一番评骘，可云至公至明：只怕立朝之后做主考房官，又要目迷五色，奈何？”众人又笑了。当日吃了一天酒。做完了戏，到黄昏时分，众人散了…","so":0,"eo":0},{"surface":"杜少卿","text":"南京饯别虞博士的也不下千余家。虞博士应酬烦了，凡要到船中送别的，都辞了不劳。那日叫了一只校俊杯，在水西门起行，只有杜少卿送在舡上。杜少卿拜别道：“老叔已去，小侄从今无所依归矣！”虞博士也不胜凄然，邀到舡里坐下，说道：“少卿，我不瞒你说，我本赤贫之士，在南京来做了六七年博士，每年积几两俸金，只挣了三十担米的一块田。我此番去，或是部郎，或是州县，我多则做三年，少则做两年，再积些俸银，添得二十担米，每年养着我夫妻两个不得饿死，就罢了。子孙们的…","so":0,"eo":0},{"surface":"杜少卿","text":"杜少卿上了岸，看着虞博士的船开了去，望不见了，方才回来。余大先生在河房里，杜少卿把方才这些话告诉他，余大先生叹道：“难进易退，真乃天怀淡定之君子。我们他日出身皆当以此公为法。”彼此叹赏了一回。当晚余二先生有家书来约大先生回去，说：“表弟虞华轩家请的西席先生去了，要请大哥到家教儿子，目今就要进馆，请作速回去。”余大先生向杜少卿说了，辞别要去。次日束装渡江，杜少卿送过，自回家去。","so":0,"eo":0}]},{"chap":48,"ctitle":"第四十八回　徽州府烈妇殉夫　泰伯祠遗贤感旧","deeds":[{"surface":"杜少卿","text":"次日，王玉辉到学署来谢余大先生。余大先生、二先生都会着，留着吃饭。王王辉说起：“在家日日看见老妻悲恸，心下不忍，意思要到外面去作游几时。又想，要作游除非到南京去，那里有极大的书坊，还可逗着他们刻这三部书。”余大先生道：“老哥要往南京，可惜虞博士去了。若是虞博士在南京，见了此书，赞扬一番，就有书坊抢的刻去了。”二先生道：“先生要往南京，哥如今写一封书子去，与少卿表弟和绍光先生。这人言语是值钱的。”大先生欣然写了几封字，庄征君、杜少卿、迟衡…","so":0,"eo":0},{"surface":"杜少卿","text":"王玉辉到了苏州，又换了船，一路来到南京水西门上岸，进城寻了个下处，在牛公庵住下。次日，拿着书子去寻了一日回来。那知因虞博士选在浙江做官，杜少卿寻他去了，庄征君到故乡去修祖坟；退衡山、武正字都到远处做官去了，一个也遇不着。王玉辉也不懊悔，听其自然，每日在牛公庵看书。过了一个多月，盘费用尽了，上街来闲走走。才走到巷口，遇着一个人作揖，叫声：“老伯怎的在这里？”王玉辉看那人，原来是同乡人，姓邓，名义，字质夫。这邓质夫的父亲是王玉辉同案进学，邓…","so":0,"eo":0},{"surface":"杜少卿","text":"到了下处，邓质夫拜见了，说道：“小侄自别老伯，在扬州这四五年。近日是东家托我来卖上江食盐，寓在朝天宫。一向记念老伯，近况好么？为甚么也到南京来？”王玉辉请他坐下，说道，“贤侄，当初令堂老夫人守节，邻家失火，令堂对天祝告，反风灭火，天下皆闻。那知我第三个小女，也有这一番节烈。”因悉把女儿殉女婿的事说了一遍。“我因老妻在家哭泣，心里不忍。府学余老师写了几封书子与我来会这里几位朋友，不想一个也会不着。”邓质夫道：“是那几位？”王玉辉一一说了。…","so":0,"eo":0}]},{"chap":49,"ctitle":"第四十九回　翰林高谈龙虎榜　中书冒占凤凰池","deeds":[{"surface":"杜少卿","text":"高翰林道，“再也莫提起这话。敝处这里有一位庄先生，他是朝廷征召过的，而今在家闭门注《易》。前日有个朋友和他会席，听见他说：‘马纯上知进而不知退，直是一条小小的亢龙。’无论那马先生不可比做亢龙，只把一个现活着的秀才拿来解圣人的经，这也就可笑之极了！”武正字道：“老先生，此话也不过是他偶然取笑。要说活着的人就引用不得，当初文王、周公，为甚么就引用微子、箕子？后来孔子为甚么就引用颜子？那时这些人也都是活的。”高翰林道：“足见先生博学。小弟专经…","so":0,"eo":0}]},{"chap":56,"ctitle":"第五十六回　神宗帝下诏旌贤　刘尚书奉旨承祭","deeds":[{"surface":"杜少卿","text":"生员：梅玖、王德、王仁、魏好古、蘧景玉、马静、倪霜峰、季萑、诸葛佑、萧鼎、浦玉方、韦阐、杜仪、臧荼、迟均、余夔、萧树滋、虞感祁、庄尚志、余持、余敷、余殷、虞梁、王蕴、邓义、陈春，共二十六人。","so":0,"eo":0},{"surface":"杜少卿","text":"虞育德赐第一甲第一名进士及第，授翰林院修撰。庄尚志赐第一甲第二名进士及第，授翰林院编修。杜仪赐第一甲第三名进士及第，授翰林院编修。萧采等赐第二甲进士出身，俱授翰林院检讨。沈琼枝等赐第三甲同进土出身，俱授翰林院庶吉士。于七月初一日揭榜晓示，赐祭一坛，设于国子监，遣礼部尚书刘迸贤前往行礼。余依议。钦此。到了七月初一日黎明，礼部门口悬出一张榜来，上写道：","so":0,"eo":0},{"surface":"杜少卿","tex 55,"aliases":[],"density":"rich","timeline":[{"chap":20,"ctitle":"第二十回　匡超人高兴长安道　牛布衣客死芜湖关","deeds":[{"surface":"南京","text":"匡超人取定了结，也便收拾行李上船。那时先包了一只淌板船的头舱，包到扬州，在断河头上船。上得船来，中舱先坐着两个人：一个老年的，茧绸直裰，丝绦朱履；一个中年的，宝蓝直裰，粉底皂靴，都戴着方巾。匡超人见是衣冠人物，便同他拱手坐下，问起姓名。那老年的道：“贱姓牛，草字布衣。”匡超人听见景兰江说过的，便道：“久仰。”又问那一位，牛布衣代答道：“此位冯先生，尊字琢庵，乃此科新贵，往京师会试去的。”匡超人道：“牛先生也进京么？”牛布衣道：“小弟不去…","so":0,"eo":0},{"surface":"南京","text":"牛布衣独自搭江船过了南京，来到芜湖，寻在浮桥口一个小庵内作寓。这庵叫做甘露庵，门面三间：中间供着一尊韦驮菩萨；左边一间锁着，堆些柴草；右边一间做走路。进去一个人院落，六殿三间，殿后两间房，一间是本庵一个老和尚自己住着，一间便是牛布衣住的客房。牛布衣日间出去寻访朋友，晚间点了一盏灯，吟哦些甚么诗词之类。老和尚见他孤踪，时常煨了茶送在他房里，陪着说话到一二更天。若遇清风明月的时节，便同他在前面天井里谈说古今的事务，甚是相得。","so":0,"eo":0}]},{"chap":22,"ctitle":"第二十二回　认祖孙玉圃联宗　爱交游雪斋留客","deeds":[{"surface":"南京","text":"卜诚、卜信回家。牛浦赌气，来家拿了一床被，搬在庵里来住。没的吃用，把老和尚的铙、钹、叮当都当了，闲着无事，去望望郭铁笔，铁笔不在店里，柜上有人家寄的一部新《缙绅》卖。牛浦揭开一看，看见淮安府安东县新补的知县董瑛，字彦芳，浙江仁和人。说道：“是了！我们不寻他去？”忙走到庵里，卷了被褥，又把和尚的一座香炉、一架磐，拿去当了二两多银子，也不到卜家告说，竟搭了江船，恰好遇顺风，一日一夜就到了南京燕子矾，要搭扬州船，来到一个饭店里，店主人说道：“…","so":0,"eo":0}]},{"chap":23,"ctitle":"第二十三回　发阴私诗人被打　叹老景寡妇寻夫","deeds":[{"surface":"南京","text":"牛浦被他掼的发昏，又惯倒在一个粪窖子眼前，滚一滚就要滚到粪窖子里面去，只得忍气吞声，动也不敢动。过了半日，只见江里又来了一只船，那船到岸就住了，一个客人走上来粪窖子里面出恭，牛浦喊他救命。那客人道：“你是何等样人，被甚人剥了衣裳捆倒在此？”牛浦道：“老爹，我是芜湖县的一个秀才。因安东县董老爷请我去做馆，路上遇见强盗，把我的衣裳行李都打劫去了，只饶的一命在此。我是落难的人，求老爹救我一救！”那客人惊道：“你果然是安东县董老爷衙门里去的么？…","so":0,"eo":0}]},{"chap":24,"ctitle":"第二十四回　牛浦郎牵连多讼事　鲍文卿整理旧生涯","deeds":[{"surface":"南京","text":"次日，向知县备了席，摆在书房里，自己出来陪，斟酒来奉。他跪在地下，断不敢接酒；叫他坐，也到底不坐。向知县没奈何，只得把酒席发了下去，叫管家陪他吃了。他还上来谢赏。向知县写了谢按察司的禀帖，封了五百两银子谢他。他一厘也不敢受，说道：“这是朝廷颁与老爷们的俸银，小的乃是贱人，怎敢用朝廷的银子？小的若领了这项银子去养家口，一定折死小的。大老爷天恩，留小的一条狗命。”向知县见他说到这田地，不好强他，因把他这些话又写了一个禀帖，禀按察司，又留他住…","so":0,"eo":0},{"surface":"南京","text":"这南京乃是太祖皇帝建都的所在，里城门十三，外城门十八，穿城四十里，沿城一转足有一百二十多里。城里几十条大街，几百条小巷，都是人烟凑集，金粉楼台。城里一道河，东水关到西水关足有十里，便是秦淮河。水满的时候，画船萧鼓，昼夜不绝。喊里城外，琳宫梵宇，碧瓦朱甍，在六朝时是四百八十寺，到如今，何止四千八百寺！大街小巷，合共起来，大小酒楼有六七百座，茶社有一千余处。不论你走到一个僻巷里面，总有一个地方悬着灯笼卖茶，插着时鲜花朵，烹着上好的雨水，茶社…","so":0,"eo":0},{"surface":"南京","text":"他到家料理了些柴米，就把家里笙萧管笛、三弦琵琶，都查点了出来，也有断了弦，也有坏了皮的，一总尘灰寸壅。他查出来放在那里，到总寓傍边茶馆内去会会同行。才走进茶馆，只见一个人坐在那里，头戴高帽，身穿宝蓝缎直裰，脚下粉底皂靴，独自坐在那里吃茶。鲍文卿近前一看，原是他同班唱老生的钱麻子。钱麻子见了他来，说道：“文卿，你从几时回来的？请坐吃茶。”鲍文卿道：“我方才远远看见你，只疑惑是那一位翰林、科、道老爷，错走到我这里来吃茶，原来就是你这老屁精！…","so":0,"eo":0}]},{"chap":25,"ctitle":"第二十五回　鲍文卿南京遇旧　倪廷玺安庆招亲","deeds":[{"surface":"南京","text":"那日早上，正要带着鲍廷玺出门，只见门口一个人，骑了一匹骡子，到门口下了骡子进来。鲍文卿认得是天长县杜老爷的管家姓邵的，便道：“绍大爷，你几时过江来的？”邵管家道：“特过江来寻鲍师父。”鲍文卿同他作了揖，叫儿子也作了揖，请他坐下，拿水来洗脸，拿茶来吃。吃着，问道：“我记得你家老太大该在这年把正七十岁，想是过来定戏的？你家大老爷在府安？”邵管家笑道：“正是为此。老爷吩咐要定二十本戏。鲍师父，你家可有班子？若有。就接了你的班子过去。”鲍文卿道…","so":0,"eo":0},{"surface":"南京","text":"向知府直到下午才回来，换去了大衣服，仍旧坐在河房里，请鲍文卿父子两个进来坐下，说道：“我明日就要回衙门去，不得和你细谈。”因叫小厮在房里取出一到银子来递与他道：“这是二十两银子，你且收着。我去之后，你在家收拾收拾，把班子托与人领着，你在半个月内，同令郎到我衙门里来，我还有话和你说。”鲍文卿接着银子，谢了太老爷的赏，说道：“小的总在半个月内，领了儿子到太老爷衙门里来请安。”当下又留他吃了酒。鲍文卿同儿子回家歇息。次早又到公馆里去送了向太爷…","so":0,"eo":0}]},{"chap":26,"ctitle":"第二十六回　向观察升官哭友　鲍廷玺丧父娶妻","deeds":[{"surface":"南京","text":"又过了几个月，那王家女儿怀着身子，要分娩，不想养不下来，死了。鲍文卿父子两个恸哭。向太守倒反劝道：“也罢，这是他各人的寿数，你们不必悲伤了。你小小年纪，我将来少不的再替你娶个媳妇。你们若只管哭时，惹得夫人心里越发不好过了。”鲍文卿也吩咐儿子，叫不要只管哭。但他自己也添了个痰火疾，不时举动，动不动就要咳嗽半夜，意思要辞了向太爷回家去，又不敢说出来。恰好向大爷升了福建汀漳道，鲍文卿向向太守道：“太老爷又恭喜高升，小的本该跟随大老爷去，怎奈小…","so":0,"eo":0},{"surface":"南京","text":"鲍文卿父子两个，带着银子，一路来到南京，到家告诉浑家向大老爷这些恩德，举家感激。鲍文卿扶着病出去寻人，把这银子买了一所房子；两副行头，租与两个戏班子穿着，剩下的家里盘缠。又过了几个月，鲍文卿的病渐渐重了，卧床不起。自己知道不好了，那日把浑家、儿子、女儿、女婿都叫在跟前，吩咐他们：“同心同意，好好过日子，不必等我满服，就娶一房媳妇进来要紧。”说罢，瞑目而逝。合家恸哭，料理后事，把棺材就停在房子中间，开了几日丧。四个总寓的戏子都来吊孝。鲍廷…","so":0,"eo":0}]},{"chap":27,"ctitle":"第二十七回　王太太夫妻反目　倪廷珠兄弟相逢","deeds":[{"surface":"南京","text":"到第三日，鲍家请了许多的戏子的老婆来做朝。南京的风俗：但凡新媳妇进门，三天就要到厨下去收拾一样菜，发个利市。这莱一定是鱼，取“富贵有余”的意思。当下鲍家买了一尾鱼，烧起锅，请相公娘上锅，玉太太不采，坐着不动。钱麻子的老婆走进房来道：“这使不得。你而今到他家做媳妇，这些规矩是要还他的。”太太忍气吞声，脱了锦缎衣服，系上围裙，走到厨下，把鱼接在手内，拿刀刮了三四刮，拎着尾巴望滚汤锅里一掼。钱麻子老婆正站在锅台傍边看他收拾鱼，被他这一掼，便溅…","so":0,"eo":0},{"surface":"南京","text":"鲍廷玺自己坐着，坐了一会，只见阿三跟了一个人进来，头戴方巾，身穿酱色缎直裰，脚下粉底皂靴，三绺髭须，有五十岁光景。那人走进茶馆，阿三指道：“便是六大爷了。”鲍廷玺忙走上前，那人一把拉住道：“你便是我六兄弟了！”鲍廷垄道：“你便是我大哥哥！”两人抱头大哭，哭了一场坐下。倪廷珠道：“兄弟，自从你过继在鲍老爹家，我在京里，全然不知道。我自从二十多岁的时候就学会了这个幕道，在各衙里做馆。在各省找寻那几个弟兄，都不曾找的着。五年前，我同一位知县到…","so":0,"eo":0},{"surface":"南京","text":"到晚，果然一乘桥子，两个“巡抚部院”的灯笼，阿三跟着，他哥来了。倪廷珠下了轿，进来说道：况弟，我这寓处没有甚么，只带的七十多两银子。”叫阿三在轿柜里拿出来，一包一包，交与鲍廷垄，道：“这个你且收着。我明日就要同姬大人往苏州去。你作速看下一所房子，价银或是二百两、三百两，都可以，你同弟妇搬进去住着。你就收拾到苏州衙门里来。我和姬大人说，把今年束修一千两银子都支了与你，拿到南京来做个本钱，或是买些房产过日。”当下鲍廷垄收了银子，留着他哥吃酒…","so":0,"eo":0}]},{"chap":28,"ctitle":"第二十八回　季苇萧扬州入赘　萧金铉白下选书","deeds":[{"surface":"南京","text":"话说鲍廷玺走到阎门，遇见跟他哥的小厮阿三。阿三前走，后面跟了一个闲汉，挑了一担东西，是些三牲和些银锭、纸马之类。鲍廷玺道：“阿三，倪大太爷在衙门里么？你这些东西叫人挑了同他到那里去？”阿三道：“六太爷来了！大太爷自从南京回来，进了大老爷衙门，打发人上京接太太去。去的人回说，太太已于前月去世。大太爷着了这一急，得了重病，不多几日就归天了。大太爷的灵枢现在城外厝着，小的便搬在饭店里住。今日是大太爷头七，小的送这三牲纸马到坟上烧纸去。”鲍廷玺…","so":0,"eo":0},{"surface":"南京","text":"当下说着笑话，天色晚了下来，里面吹打着，引季苇萧进了洞房。众人上席吃酒，吃罢各散。鲍廷玺仍旧到钞关饭店里住了一夜。次日来贺喜，看新人，看罢出来，坐在厅上。鲍廷玺悄悄问季苇萧道：“姑爷，你前面的姑奶奶不曾听见怎的，你怎么又做这件事？”季苇萧指着对联与他看道：“你不见‘才子佳人信有之’？我们风流人物，只要才子佳人会合，一房两房，何足为奇！”鲍廷玺道：“这也罢了。你这些费用是那里来的？”季苇萧道：“我一到扬州，荀年伯就送了我一百二十两银子，又…","so":0,"eo":0},{"surface":"南京","text":"正说着，只见那辛先生、金先生和一个道士，又有一个人，一齐来吵房。季苇萧让了进去，新房里吵了一会，出来坐下。辛先生指着这两位向季苇萧道：“这位道友尊姓来，号霞土，也是我们扬州诗人。这位是芜湖郭铁笔先生，镌的图书最妙。今日也趁着喜事来奉访。”季苇萧问了二位的下处，说道：“即日来答拜。”辛先生和金先生道：“这位令亲鲍老爹，前日听说尊府是南京的，却几时回南京去？”季苇萧道：“也就在这一两日间。”那两位先生道：“这等我们不能同行了。我们同在这个俗…","so":0,"eo":0},{"surface":"南京","text":"次日早晨，一个人坐了轿子来拜，传进帖子，上写“年家眷同学弟宗姬顿首拜”。季苇萧迎了出去，见那人方巾阔服，古貌古心。进来坐下，季苇萧动问：“仙乡尊字？”那人道：“贱字穆庵，敝处湖广。一向在京，同谢茂秦先生馆于赵王家里。因返舍走走，在这里路过，闻知大名，特来进谒。有一个小照行乐，求大笔一题。将来还要带到南京去，遍请诸名公题咏。”季苇萧道：“先生大名，如雷灌耳。小弟献丑，真是弄斧班门了。”说罢，吃了茶，打恭上轿而去。恰好鲍廷玺走来，取了书子和…","so":0,"eo":0},{"surface":"南京","text":"鲍廷玺拿着这几钱银子，搭了船，回到南京。进了家门，把这些苦处告诉太太一遍，又被太太臭骂了一顿。施御史又来催他兑房价，他没银子兑，只得把房子退还施家，这二十两押议的银子做了干罚。没处存身，太太只得在内桥娘家胡姓借了一间房子，搬进去住着。住了几日，鲍廷玺拿着书子寻到状元境，寻著了季恬逸。季活逸接书看了，请他吃了一壶茶，说道：“有劳鲍老爹。这些话我都知道了。”鲍廷玺别过自去了。","so":0,"eo":0}]},{"chap":30,"ctitle":"第三十回　爱少俊访友神乐观　逞风流高会莫愁湖","deeds":[{"surface":"南京","text":"正待吃饭，小厮来禀道：“沈媒婆在外回老爷话。”慎卿道：“你叫他进来何妨！”小厮出去领了沈大脚进来。杜慎卿叫端一张凳子与他在底下坐着。沈大脚问：“这位老爷？”杜慎卿道：“这是安庆季老爷。”因问道：“我托你的怎样了？”沈大脚道：“正是。十七老爷把这件事托了我，我把一个南京城走了大半个，因老爷人物生得太齐整了，料想那将就些的姑娘配不上，不敢来说。如今亏我留神打听，打听得这位姑娘，在花牌楼住，家里开着机房，姓王。姑娘十二分的人才还多着半分。今年…","so":0,"eo":0}]},{"chap":31,"ctitle":"第三十一回　天长县同访豪杰　赐书楼大醉高朋","deeds":[{"surface":"南京","text":"第一日过江，歇了**县。第二日起早走了几十里路，到了一个地方，叫作四号墩。鲍廷玺进去坐下，正待要水洗脸，只见门口落下一乘轿子来。轿子里走出一个老者来，头戴方巾，身穿白纱直裰，脚下大红绸鞋，一个通红的酒糟鼻，一部大白胡须，就如银丝一般。那老者走进店门，店主人慌忙接了行李，说道：“韦四太爷来了！请里面坐。”那韦四太爷走进堂屋，鲍廷玺立起身来施礼，那韦四太爷还了礼。鲍廷玺让韦四太爷上面坐，他坐在下面，问道：“老太爷上姓是韦，不敢拜问贵处是那里…","so":0,"eo":0},{"surface":"南京","text":"当请韦四太爷坐在朝南的书房里，这两树桂花就在窗隔外。韦四太爷坐下，问道：“娄翁尚在尊府？”杜少卿道：“娄老伯近来多病，请在内书房住，方才吃药睡下，不能出来会老伯。”韦四太爷道：“老人家既是有恙，世兄何不送他回去？”杜少卿道：“小侄已经把他令郎、令孙都接在此侍奉汤药，小侄也好早晚问候，”韦四太爷道：“老人家在尊府三十多年，可也还有些蓄积，家里置些产业？”杜少卿道：“自先君赴任赣川，把舍下田地房产的账目，都交付与娄老伯，每银钱出入，俱是娄老…","so":0,"eo":0},{"surface":"南京","text":"正说着，家人王胡子手里拿着一个红手本，站在窗子外不敢进来。杜少卿看见他，说道：“王胡子，你有甚么话说？手里拿的甚么东西？”王胡子走进书房，把手本递上来，禀道：“南京一个姓鲍的，他是领戏班出身。他这几年是在外路生意，才回来家。他过江来叩见少爷。”杜少卿道：“他既是领班子的，你说我家里有客，不得见他，手本收下，叫他去罢。”王胡子说道：“他说受过先太老爷多少恩德，定要当面叩谢少爷，”杜少卿道：“这人是先太老爷抬举过的么？”王胡子道：“是。当年…","so":0,"eo":0},{"surface":"南京","text":"少刻，请了一个大眼睛黄胡子的人来，头戴瓦楞帽，身穿大阔布衣服，扭扭捏捏做些假斯文象，进来作揖坐下，问了韦四太爷姓名，韦四太爷说了，便问：“长兄贵姓？”那人道：“晚生姓张，贱字俊民，久在杜少爷门下，晚生略知医道，连日蒙少爷相约，在府里看娄太爷。”因问：“娄太爷今日吃药如何？”杜少卿便叫加爵去问，问了回来道：“娄太爷吃了药，睡了一觉，醒了，这会觉的清爽些。”张俊民又问，“此位上姓？”杜少卿道：“是南京一位鲍朋友。”说罢，摆上席来，奉席坐下。…","so":0,"eo":0},{"surface":"南京","text":"那小厮进去请了少卿出来会臧三爷，作揖坐下。杜少卿道：“三哥，好几日不见。你文会做的热闹？”臧三爷道：“正是。我听见你门上说到远客，……慎卿在南京乐而忘返了。”杜少卿道：“是乌衣韦老伯在这里。我今日请他，你就在这里坐坐，我和你到书房里去罢。”臧三爷道：“且坐着，我和你说话。县里王父母是我的老师，他在我跟前说了几次，仰慕你的大才，我几时同你去会会他。”杜少卿道：“像这拜知县做老师的事，只好让三哥你们做。不要说先曾祖、先祖，就先君在日，这样知…","so":0,"eo":0},{"surface":"南京","text":"杜少卿道，“三哥，不要倒熟话。你这位贵老师总不是甚么尊贤爱才，不过想人拜门生受些礼物。他想着我，叫他把梦做醒些！况我家今日请客，煨的有七斤重的老鸭，寻出来的有九年半的陈酒。汪家没有这样好东西吃。不许多话！同我到韦房里去顽。”拉着就走。臧三爷道：“站着！你乱怎的？这韦老先生不曾会过，也要写个帖子。”杜少卿道，“这倒使得。”叫小厮拿笔砚帖子出来。臧三爷拿帖子写了个“年家眷同学晚生臧荼”，先叫小厮拿帖子到书房里，随即同杜少卿进来。韦四太爷迎着…","so":0,"eo":0}]},{"chap":32,"ctitle":"第三十二回　杜少卿平居豪举　娄焕文临去遗言","deeds":[{"surface":"南京","text":"自此之后，娄太爷的病一日重一日。那日，杜少卿坐在他眼前，娄太爷说道：“大相公，我从前挨着，只望病好，而今看这光景，病是不得好了，你要送我回家去！”杜少卿道：“我一日不曾尽得老伯的情，怎么说要回家？”娄太爷道：“你又呆了！我是有子有孙的人，一生出门在外，今日自然要死在家里。难道说你不留我？”杜少卿垂泪道：“这样说我就不留了。老伯的寿器是我备下的，如今用不着，是不好带去了，另拿几十两银子合具寿器。衣服、被褥是做停当的，与老伯带去。”娄太爷道…","so":0,"eo":0}]},{"chap":33,"ctitle":"第三十三回　杜少卿夫妇游山　迟衡山朋友议礼","deeds":[{"surface":"南京","text":"话说杜少卿自从送了娄太爷回家之后，自此就没有人劝他，越发放着胆子用银子。前项已完，叫王胡子又去卖了一分田来，二千多银子，随手乱用。又将一百银子把鲍廷玺打发过江去了。王知县事体已清，退还了房子，告辞回去。杜少卿在家又住了半年多，银子用的差不多了，思量把自己住的房子并与本家，要到南京去住，和娘子商议，娘子依了。人劝着，他总不肯听。足足闹了半年，房子归并妥了。除还债赎当，还落了有千把多银子，和娘子说道：“我先到南京会过卢家表侄，寻定了房子，再…","so":0,"eo":0},{"surface":"南京","text":"当下走过淮清桥，迟衡山路熟，找着房牙子，一路看了几处河房，多不中意，一直看到东水关。这年是乡试年，河房最贵，这房子每月要八两银子的租钱。杜少卿道：“这也罢了，先租了住着，再买他的。”南京的风俗是要付一个进房，一个押月。当下房牙子同房主人跟到仓巷卢家写定租约，付了十六两银子。卢家摆酒留迟衡山同杜少卿坐坐，到夜深，迟衡山也在这里宿了。","so":0,"eo":0},{"surface":"南京","text":"次日众人来贺。这时三月初旬，河房渐好，也有萧管之声。杜少卿备酒请这些人，共是四席。那日，季苇萧、马纯上、蘧验夫、季恬逸、迟衡山、卢华士、景兰江、诸葛天申、萧金铉、郭铁笔，来霞士都在席。金东崖是河房邻居，拜往过了。也请了来。本日茶厨先到，鲍廷玺打发新教的三元班小戏子来磕头，见了杜少卿、杜娘子，赏了许多果子去了。随即房主人家荐了一个卖花堂客叫做姚奶奶来见，杜娘子留他坐着。到上昼时分，客已到齐，将河房窗子打开了。众客散坐，或凭栏看水，或啜茗闲…","so":0,"eo":0},{"surface":"南京","text":"又过了几日，娘子因初到南京，要到外面去看看景致。杜少卿道：“这个使得，”当下叫了几乘轿子，约姚奶奶做陪客，两三个家人婆娘都坐了轿子跟着。厨子挑了酒席，借清凉山一个姚园。这姚园是个极大的园子，进去一座篱门。篱门内是鹅卵石砌成的路，一路朱红栏杆，两边绿柳掩映。过去三间厅，便是他卖酒的所在，那日把酒桌子都搬了。过厅便是一路山径，上到山顶，便是一个八角亭子。席摆在亭子上。娘子和姚奶奶一班人上了亭子，观看景致。一边是清凉山，高高下下的竹树；一边是…","so":0,"eo":0},{"surface":"南京","text":"次日辞别出来。他这番盘程带少了，又多住了几天，在辕门上又被人要了多少喜钱去，叫了一只船回南京，船钱三两银子也欠着。一路又遇了逆风，走了四五天，才走到芜湖。到了羌湖，那船真走不动了，船家要钱买米煮饭。杜少卿叫小厮寻一寻，只剩了五个钱，杜少卿算计要拿衣服去当。心里闷，且到岸上去走走，见是吉祥寺，因在茶桌上坐着，吃了一开茶。又肚里饿了，吃了三个烧饼，倒要六个钱，还走不出茶馆门。只见一个道士在面前走过去，杜少卿不曾认得清。那道士回头一看，忙走近…","so":0,"eo":0},{"surface":"南京","text":"庙里道士走了出来，问那里来的尊客。来道士道：“是天长杜状元府里杜少老爷，”道士听了，着实恭敬，请坐拜茶。杜少卿看见墙上贴着一个斗方，一首识舟亭怀古的诗，上写：“霞士道兄教正”，下写“燕里韦阐思玄稿”。杜少卿道：“这是滁州乌衣镇韦四太爷的诗。他几时在这里的？”道士道：“韦四太爷现在楼上。”杜少卿向来霞土道：“这样，我就同你上楼去。”便一同上楼来，道士先喊道，“韦四太爷，天长杜少老爷来了！”韦四太爷答应道：“是那个？”要走下楼来看。杜少卿上…","so":0,"eo":0},{"surface":"南京","text":"次日，便到北门桥去拜庄绍光先生。那里回说：“浙江巡抚徐大人请了游西湖去了，还有些日子才得来家。”杜少卿便到仓巷卢家去会迟衡山。卢家留着吃饭。迟衡山闲话说起：“而今读书的朋友，只不过讲个举业，若会做两句诗赋，就算雅极的了，放着经史上礼、乐、兵、农的事，全然不问！我本朝太祖定了天下，大功不差似汤武，却全然不曾制作礼乐。少卿兄，你此番征辟了去，替朝廷做些正经事，方不愧我辈所学。”杜少卿道：“这征辟的事，小弟已是辞了。正为走出去做不出甚么事业，…","so":0,"eo":0}]},{"chap":34,"ctitle":"第三十四回　议礼乐名流访友　备弓旌天子招贤","deeds":[{"surface":"南京","text":"话说杜少卿别了迟衡山出来，问小厮道：“那差人他说甚么？”小厮道：“他说少爷的文书已经到了，李大老爷吩咐县里邓老爷请少爷到京里去做官，邓老爷现住在承恩寺。差人说，请少爷在家里，邓老爷自己上门来请。”杜少卿道：“既如此说，我不走前门家去了，你快叫一只船，我从河房栏杆上上去。”当下小厮在下浮桥雇了一只凉篷，杜少卿坐了来家。忙取一件旧衣服、一顶旧帽子，穿戴起来，拿手帕包了头，睡在床上，叫小厮：“你向那差人说，我得了暴病，请邓者爷不用来，我病好了…","so":0,"eo":0},{"surface":"南京","text":"吃过了三遍茶，换去大衣服，请在书房里坐。这高老先生虽是一个前辈，却全不做身分，最好顽耍，同众位说说笑笑，并无顾忌，才进书房，就问道：“钱朋友怎么不见？”薛乡绅道：“他今日回了不得来。”高老先生道：“没趣！没趣！今日满座欠雅矣！”薛乡绅摆上两席，奉席坐下。席间谈到浙江这许多名士，以及西湖上的风景，娄氏弟兄两个许多结交宾客的故事。余美人道：“这些事我还不爱，我只爱验夫家的双红姐，说着还齿颊生香。”季苇萧道：“怪不得，你是个美人，所以就爱美人…","so":0,"eo":0},{"surface":"南京","text":"当下两人坐了一只凉篷船，到了北门桥，上了岸，见一所朝南的门面房子，迟衡山道：“这便是他家了。”两人走进大门，门上的人进去禀了主人，那主人走了出来。这人姓庄名尚志，字绍光，是南京累代的读书人家。这庄绍光十一二岁就会做一篇七千字的赋，天下皆闻。此时已将及四十岁，名满一时，他却闭户著书，不肯妄交一人。这日听见是这两个人来，方才出来相会。只见头戴方巾，身穿宝蓝夹纱直裰，三绺髭须，黄白面皮，出来恭恭敬敬同二位作揖坐下。庄绍光道：“少卿兄，相别数载…","so":0,"eo":0},{"surface":"南京","text":"只听得门外骡铃乱响，来了一起银鞘，有百十个牲口。内中一个解官，武员打扮。又有同伴的一个人，五尺以上身材，六十外岁年纪，花白胡须。头戴一顶毡笠子，身穿箭衣，腰插弹弓一张，脚下黄牛皮靴。两人下了牲口，拿着鞭子一齐走进店来，吩咐店家道：“我们是四川解饷迸京的，今日天色将晚，住一宿，明日早行。你们须要小心伺候。”店家连忙答应。那解官督率着脚夫将银鞘搬入店内，牲口赶到槽上，挂了鞭子，同那人进来，向庄绍光施礼坐下。庄绍光道：“尊驾是四川解饷来的？此…","so":0,"eo":0},{"surface":"南京","text":"同走了半天，庄绍光行李轻便，遂辞了萧、孙二人，独自一辆车子先走。走了几天，将到卢沟桥，只见对面一个人骑了骡子来，遇着车子，问：“车里这位客官尊姓？”车夫道：“姓庄。”那人跳下骡子，说道：“莫不是南京来的庄征君么？”庄绍光正要下车，那人拜倒在地。只因这一番，有分教：朝廷有道，修大礼以尊贤；儒者爱身，遇高官而不爱。毕竟后事如何，且听下回分解。","so":0,"eo":0}]},{"chap":35,"ctitle":"第三十五回　圣天子求贤问道　庄征君辞爵还家","deeds":[{"surface":"南京","text":"话说庄征君看见那人跳下骡子，拜在地下，慌忙跳下车来跪下，扶住那人，说道：“足下是谁？我一向不曾认得。”那人拜罢起来，说道：“前面三里之遥便是一个村店，老先生请上了车，我也奉陪了回去，到店里谈一谈。”庄征君道：“最好。”上了车子。那人也上了骡子，一同来到店里。彼此见过了礼坐下。那人道：“我在京师里算着，征辟的旨意到南京去，这时候该是先生来的日子了，所以出了彰仪门，遇着骡矫车子一路问来，果然问着。今幸得接大教。”庄征君道：“先生尊姓大名？贵…","so":0,"eo":0},{"surface":"南京","text":"自此以后，九卿六部的官，无一个不来拜望请教。庄征君会的不耐烦，只得各衙门去回拜。大学土太保公向徐侍郎道：“南京来的庄年兄，皇上颇有大用之意，老先生何不邀他来学生这里走走？我欲收之门墙，以为桃李。”侍郎不好唐突，把这话婉婉向庄征君说了。庄征君道：“世无孔子，不当在弟子之列。况太保公屡主礼闱，翰苑门生不知多少，何取晚生这一个野人？这就不敢领教了。”侍郎就把这话回了太保。太保不悦。","so":0,"eo":0},{"surface":"南京","text":"庄尚志允令还山，赐内帑银五百两，将南京元武湖赐与庄尚志著书立说，鼓吹休明。","so":0,"eo":0},{"surface":"南京","text":"庄征君别了台儿庄，叫了一只马溜子船，船上颇可看书。不日来到扬州，在钞关住了一日，要换江船回南京。次早才上了江船，只见岸上有二十多乘齐整轿子歇在岸上，都是两淮总商来候庄征君，投进帖子来。庄征君因船中窄小，先请了十位上船来。内中几位本家，也有称叔公的，有称尊兄的，有称老叔的，作揖奉坐。那在坐第二位的就是萧柏泉。众盐商都说是：“皇上要重用台翁，台翁不肯做官，真乃好品行。”萧柏泉道：“晚生知道老先生的意思，老先生抱负大才，要从正途出身，不屑这征…","so":0,"eo":0},{"surface":"南京","text":"这湖是极宽阔的地方，和西湖也差不多大。左边台城，望见鸡鸣寺。那湖中菱、藕、莲、芡，每年出几千石。湖内七十二只打鱼船，南京满城每早卖的都是这湖鱼。湖中间五座大洲：四座洲贮了图籍，中间洲上一所大花园，赐与庄征君住，有几十间房子。园里合抱的老树，梅花、桃、李、芭蕉、桂、菊，四时不断的花。又有一园的竹子，有数万竿。园内轩窗四启，看着湖光山色，真如仙境。门口系了一只船，要往那边，在湖里渡了过去。若把这船收过，那边飞也飞不过来。庄征君就住在花园。","so":0,"eo":0}]},{"chap":36,"ctitle":"第三十六回　常熟县真儒降生　泰伯祠名贤主祭","deeds":[{"surface":"南京","text":"虞博士回家，这年下半年又有了馆。到冬底生了个儿子，因这些事都在祁太公家做的，因取名叫做感祁。一连又做了五六年的馆，虞博士四十一岁，这年乡试，祁太公来送他，说道：“虞相公，你今年想是要高中。”虞博士道：“这也怎见得？”祁太公道：“你做的事有许多阴德。”虞博士道：“老伯，那里见得我有甚阴德？”祁太公道：“就如你替人葬坟，真心实意。我又听见人说，你在路上救了那葬父亲的人。这都是阴德，”虞博士笑道：“阴骘就像耳朵里响，只是自己晓得，别人不晓得。…","so":0,"eo":0},{"surface":"南京","text":"又过了三年，虞博士五十岁了，借了杨家一个姓严的管家跟着，再进京去会试。这科就中了进士，殿试在二甲，朝廷要将他选做翰林。那知这些进士，也有五十岁的，也有六十岁的，履历上多写的不是实在年纪。只有他写的是实在年庚五十岁。天子看见，说道：“这虞育德年纪老了，着他去做一个闲官罢。”当下就补了南京的国子监博士。虞博士欢喜道：“南京好地方，有山有水，又和我家乡相近。我此番去，把妻儿老小接在一处，团集着，强如做个穷翰林。”当下就去辞别了房师、座师和同乡…","so":0,"eo":0},{"surface":"南京","text":"转眼新春二月，虞博士去年到任后，自己亲手栽的一树红梅花，今已开了几枝。虞博士欢喜，叫家人备了一席酒，请了杜少卿来，在梅花下坐，说道：“少卿，春光已见几分，不知十里江梅如何光景？几时我和你携罐去探望一回。”杜少卿道：“小侄正有此意，要约老叔同庄绍光兄作竟日之游。”说着，又走进两个人来。这两人就在国子监门口住，一个姓储，叫做储信，一个姓伊，叫做伊昭，是积年相与学博的。虞博士见二人走了进来，同他见礼让坐。那二人不僭杜少卿的坐。坐下，摆上酒来，…","so":0,"eo":0},{"surface":"南京","text":"杜少卿吃完了酒，告别了去。那两人还坐着，虞博士进来陪他。伊昭问道：“老师与杜少卿是甚么的相与？”虞博士道：“他是我们世交，是个极有才情的。”伊昭道：“门主也不好说。南京人都知道他本来是个有钱的人，而今弄穷了，在南京躲着，专好扯谎骗钱。他最没有品行！”虞博士道：“他有甚么没品行？”伊昭道：“他时常同乃眷上酒馆吃酒，所以人都笑他。”虞博士道：“这正是他风流文雅处，俗人怎么得知。”储信道：“这也罢了，倒是老师下次有甚么有钱的诗文，不要寻他做。…","so":0,"eo":0}]},{"chap":37,"ctitle":"第三十七回　祭先圣南京修礼　送孝子西蜀寻亲","deeds":[{"surface":"南京","text":"当下厨役开剥了一条牛、四副羊，和祭品的肴馔菜蔬都整治起来，共备了十六席：楼底下摆了八席，二十四位同坐，两边书房摆了八席，款待众人。吃了半日的酒，虞博士上轿先进城去。这里众位也有坐轿的，也有走的。见两边百姓，扶老携幼，挨挤着来看，欢声雷动。马二先生笑问：“你们这是为甚么事？”众人都道：“我们生长在南京，也有活了七八十岁的，从不曾看见这样的礼体，听见这样的吹打。老年人都说这位主祭的老爷是一位神圣临凡，所以都争着出来看。”众人都欢喜，一齐进城…","so":0,"eo":0}]},{"chap":38,"ctitle":"第三十八回　郭孝子深山遇虎　甘露僧狭路逢仇","deeds":[{"surface":"南京","text":"郭孝子晓行夜宿，一路来到陕西，那尤公是同官县知县，只得迂道往同官去会他。这尤公名扶徕，字瑞亭，也是南京的一位老名士，去年才到同官县，一到任之时，就做了一件好事。是广东一个人充发到陕西边上来，带着妻子是军妻。不想这人半路死了，妻子在路上哭哭啼啼。人和他说话彼此都不明白，只得把他领到县堂上来。尤公看那妇人是要回故乡的意思，心里不忍，便取了俸金五十两，差一个老年的差人，自己取一块白绫，苦苦切切做了一篇文，亲笔写了自己的名字尤扶徕，用了一颗同官…","so":0,"eo":0},{"surface":"南京","text":"郭孝子同衙役到海月禅林客堂里，知客进去说了，老和尚出来打了问讯，请坐奉茶。那衙役自回去了。郭孝子问老和尚：“可是一向在这里作方丈的么，”老和尚道：“贫僧当年住在南京太平府芜湖县甘露庵里的，后在京师报国寺做方丈。因厌京师热闹，所以到这里居住。尊姓是郭，如今却往成都．是做甚么事？”郭孝子见老和尚清癯面貌，颜色慈悲，说道：“这话不好对别人说，在老和尚面前不妨讲的。”就把要寻父亲这些话，苦说了一番。老和尚流泪叹息，就留在方丈里住，备出晚斋来。郭…","so":0,"eo":0}]},{"chap":40,"ctitle":"第四十回　萧云仙广武山赏雪　沈琼枝利涉桥卖文","deeds":[{"surface":"南京","text":"萧云仙又侯了五六个月，部里才推升了他应天府江淮卫的守备，带领引见。奉旨：“着往新任。”萧云仙领了札付出京，走东路来南京。过了朱龙侨，到了广武卫地方，晚间住在店里，正是严冬时分。约有二更尽鼓，店家吆呼道：“客人们起来！木总爷来查夜！”众人都披了衣服坐在铺上。只见四五个兵打着灯笼，照着那总爷进来，逐名查了。萧云仙看见那总爷原来就是木耐。木耐见了萧云仙，喜出望外，叩请了安，忙将萧云仙请进衙署，住了一宿。","so":0,"eo":0},{"surface":"南京","text":"沈琼枝在宋家过了几天，不见消息，想道：“彼人一定是安排了我父亲，再来和我歪缠。不如走离了他家，再作道理。”将他那房里所有动用的金银器皿、真珠首饰，打了一个包袱，穿了七条裙子，扮做小老妈的模样，买通了那丫鬟，五更时分，从后门走了，清晨出了钞关门上船。那船是有家眷的。沈琼枝上了船，自心里想道：“我若回常州父母家去，恐惹故乡人家耻笑。”细想：“南京是个好地方，有多少名人在那里，我又会做两句诗，何不到南京去卖诗过日子？或者遇着些缘法出来也不可知…","so":0,"eo":0}]},{"chap":41,"ctitle":"第四十一回　庄濯江话旧秦淮河　沈琼枝押解江都县","deeds":[{"surface":"南京","text":"话说南京城里，每年四月半后，秦淮景致渐渐好了。那外江的船，都下掉了楼子，换上凉篷，撑了进来。船舱中间，放一张小方金漆桌子，桌上摆着宜兴沙壶，极细的成窑、宣窑的杯子，烹的上好的雨水毛尖茶。那游船的备了酒和肴馔及果碟到这河里来游，就是走路的人，也买几个钱的毛尖茶，在船上煨了吃，慢慢而行。到天色晚了，每船两盏明角灯，一来一往，映著河里，上下明亮。自文德桥至利涉桥、东水关，夜夜笙歌不绝。又有那些游人买了水老鼠花在河内放。那水花直站在河里，放出来…","so":0,"eo":0},{"surface":"南京","text":"武书看了，大笑道：“杜先生，你看南京城里偏有许多奇事，这些地方都是开私门的女人住，这女人眼见的也是私门了，却挂起一个招牌来，岂不可笑！”杜少卿道：“这样的事我们管他怎的？且到船上去煨茶吃。”便同下了船，不吃酒了，煨起上好的茶来，二人吃着闲谈。过了一回，回头看见一轮明月升上来，照得满船雪亮，船就一直荡上去。","so":0,"eo":0},{"surface":"南京","text":"庄濯江叫从新拿上新鲜酒来，奉与诸位吃。庄濯江就问：“少卿兄几时来的？寓在那里？”庄绍光道：“他已经在南京住了八九年了。尊居现在这河房里。”庄濯江惊道：“尊府大家，园亭花木甲于江北，为甚么肯搬在这里？”庄绍光便把少卿豪举，而今黄金已随手而尽，略说了几句。庄濯江不胜叹息，说道：“还记得十七八年前，我在湖广，鸟衣韦四先生寄了一封书子与我，说他酒量越发大了，二十年来，竟不得一回恸醉，只有在天长赐书楼吃了一坛九年的陈酒，醉了一夜，心里快畅的紧，所…","so":0,"eo":0},{"surface":"南京","text":"杜少卿又在后湖会着庄绍光。庄绍光道：“我这舍侄，亦非等闲之人，他四十年前在泗州同人合本开典当。那合本的人穷了，他就把他自己经营的两万金和典当拱手让了那人，自己一肩行李，跨一个疲驴，出了泗州城。这十数年来，往来楚越，转徒经营，又自致数万金，才置了产业，南京来住。平日极是好友敦伦，替他尊人治丧，不曾要同胞兄弟出过一个钱，俱是他一人独任。多少老朋友死了无所归的，他就殡葬他。又极遵先君当年的教训，最是敬重文人，流连古迹。现今拿着三四千银子在鸡鸣…","so":0,"eo":0},{"surface":"南京","text":"转眼长夏已过，又是新秋，清风戒寒，那秦淮河另是一番景致。满城的人都叫了船，请了大和尚在船上悬挂佛像，铺设经坛，从西水关起，一路施食到进香河，十里之内，降真香烧的有如烟雾溟蒙。那鼓钹梵呗之声不绝于耳。到晚，做的极精致的莲花灯，点起来浮在水面上。又有极大的法船，照依佛家中元地狱赦罪之说，超度这些孤魂升天，把一个南京秦淮河变做西域天竺国。到七月二十九日，清凉山地藏胜会，——人都说地藏菩萨一年到头都把眼闭着，只有这一夜才睁开眼，若见满城都摆的香…","so":0,"eo":0},{"surface":"南京","text":"沈琼枝住在王府塘房子里，也同房主人娘子去烧香回来。沈琼枝自从来到南京，挂了招牌，也有来求诗的，也有来买斗方的，也有来托刺绣的。那些好事的恶少，都一传两，两传三的来物色，非止一日。这一日烧香回来，人见他是下路打扮，跟了他后面走的就有百十人。庄非熊却也顺路跟在后面，看见他走到王府塘那边去了。庄非熊心里有些疑惑，次日来到杜少卿家，说：“这沈琼枝在王府塘，有恶少们去说混话，他就要怒骂起来。此人来路甚奇，少卿兄何不去看看？”杜少卿道：“我也听见这…","so":0,"eo":0},{"surface":"南京","text":"当下便留庄非熊在何房看新月。又请了两个客来：一个是退衡山，一个是武书。庄非熊见了，说些闲话，又讲起王府塘沈琼枝卖诗文的事。杜少卿道：“无论他是怎样，果真能做诗文，这也就难得了。”迟衡山道：“南京城里是何等地方！四方的名士还数不清，还那个去求妇女们的诗文？这个明明借此勾引人。他能做不能做，不必管他。”武书道：“这个却奇。一个少年妇女，独自在外，又无同伴，靠卖诗文过日子，恐怕世上断无此理。只恐其中有甚么情由。他既然会做诗，我们便邀了他来做做…","so":0,"eo":0},{"surface":"南京","text":"沈琼枝看见两人气概不同，连忙接着，拜了万福。坐定，彼此谈了几句闲话。武书道：“这杜少卿先生是此间诗坛祭酒，昨日因有人说起佳作可观，所以来请教。”沈琼枝道：“我在南京半年多，凡到我这里来的，不是把我当作倚门之娼，就是疑我为江湖之盗。两样人皆不足与言。今见二位先生，既无狎玩我的意思，又无疑猜我的心肠。我平日听见家父说：‘南京名士甚多，只有杜少卿先生是个豪杰。’这句话不错了。但不知先生是客居在此，还是和夫人也同在南京？、杜少卿道：“拙荆也同寄…","so":0,"eo":0}]},{"chap":42,"ctitle":"第四十二回　公子妓院说科场　家人苗疆报信息","deeds":[{"surface":"南京","text":"王义安才接过茶杯，站着问道：“大老爷这些时边上可有信来？”汤六老爷道：“怎么没有？前日还打发人来，在南京做了二十首大红缎子绣龙的旗，一首大黄缎子的坐纛。说是这一个月就要进京。到九月霜降祭旗，万岁爷做大将军，我家大老爷做副将军。两人并排在一个毡条上站着磕头。磕过了头，就做总督。”正说着，捞毛的叫了王义安出去，悄悄说了一会话。王义安进来道：“六老爷在上，方才有个外京客要来会会细姑娘，看见六老爷在这里，不敢进来。”六老爷道：“这何妨？请他进来…","so":0,"eo":0},{"surface":"南京","text":"次日，六老爷绝早来说，要在这里摆酒，替两位公子饯行，往南京恭喜去。王义安听见汤大老爷府里两位公子来，喜从天降，忙问：“六老爷，是即刻就来，是晚上才来？”六老爷在腰里摸出一封低银子，称称五钱六分重，递与王义安，叫去备一个七盘两点的席，“若是办不来，再到我这里找。”王义安道：“不敢！不敢！只要六老爷别的事上多挑他姐儿们几回就是了。这一席酒，我们效六老爷的劳。何况又是请府里大爷、二爷的。”六老爷道：“我的乖乖，这就是在行的话了。只要你这姐儿们…","so":0,"eo":0},{"surface":"南京","text":"到下午时分，六老爷同大爷、二爷来。头戴恩荫巾，一个穿大红洒线直裰，一个穿藕合洒线直裰，脚下粉底皂靴，带着四个小厮，大青天白日，提着两对灯笼：一对上写着“都督府”，一对写着“南京乡试”。大爷、二爷进来，上面坐下。两个婊子双双磕了头。六老爷站在旁边。大爷道：“六哥，现成板凳，你坐着不是。”六老爷道：“正是。要禀过大爷、二爷：两个姑娘要赏他一个坐？”二爷道：“怎么不坐？叫他坐了。”两个婊子，轻轻试试，扭头折颈，坐在一条板凳上，拿汗巾子掩着嘴笑…","so":0,"eo":0},{"surface":"南京","text":"次日，叫了一只大船上南京。六老爷也送上船，回去了。大爷、二爷在船上闲谈着迸场的热闹处。二爷道：“今年该是个甚么表题？”大爷道：“我猜没有别的，去年老人家在贵州征服了一洞苗子，一定是这个表题。”二爷道：“这表题要在贵州出。”大爷道：“如此，只得求贤、免钱粮两个题，其余没有了。”一路说着，就到了南京。管家尤胡子接着，把行李搬到钓鱼巷住下。大爷、二爷走进了门，转过二层厅后，一个旁门进去，却是三间倒坐的河厅，收拾的倒也清爽。两人坐定，看见河对面…","so":0,"eo":0}]},{"chap":44,"ctitle":"第四十四回　汤总镇成功归故乡　余明经把酒问葬事","deeds":[{"surface":"南京","text":"那一日，门上人进来颤道：“扬州萧二相公来拜。”汤镇台道：“这是我萧世兄，我会着还认他不得哩。”连忙教请进来。萧柏泉进来见礼。镇台见他美如冠玉，衣冠儒雅，和他行礼奉坐。萧柏泉道：“世叔恭喜回府，小侄就该来请安。因这些时南京翰林侍讲高老先生告假回家，在扬州过，小侄陪了他几时，所以来迟。”汤镇台道：“世兄恭喜入过学了？”萧柏泉道：“蒙前任大宗师考补博士弟子员。这领青衿不为希罕，却喜小侄的文章前三天满城都传遍了，果然蒙大宗师赏鉴，可见甄拔的不差…","so":0,"eo":0},{"surface":"南京","text":"因走南京过，想起：“天长杜少卿住在南京利涉桥河房里，是我表弟，何不顺便去看看他？”便进城来到杜少卿家。杜少卿出来接着，一见表兄，心里欢喜，行礼坐下，说这十几年阔别的话。余大先生叹道：“老弟，你这些上好的基业，可惜弃了。你一个做大老官的人，而今卖文为活，怎么弄的惯？”杜少卿道：“我而今在这里，有山川朋友之乐，倒也住惯了。不瞒表兄说，我愚弟也无甚么嗜好，夫妻们带着几个儿子，布衣蔬食，心里淡然。那从前的事，也追悔不来了。”说罢奉茶与表兄吃。吃…","so":0,"eo":0}]},{"chap":45,"ctitle":"第四十五回　敦友谊代兄受过　讲堪舆回家葬亲","deeds":[{"surface":"南京","text":"余二先生和代书拱一拱手。只见桌傍板凳上坐着一个人，头戴破头巾，身穿破直裰，脚底下一双打板唱曲子的鞋，认得是县里吃荤饭的朋友唐三痰。唐三痰看见余二先生进来说道：“余二哥，你来了，请坐。”余二先生坐下道：“唐三哥，你来这里的早。”唐三痰道：“也不算早了。我绝早同方六房里六老爷吃了面，送六老爷出了城去，才在这里来。你这个事我知道。”因扯在旁边去，悄悄说道：“二先生，你这件事虽非钦件，将来少不得打到钦件里去。你令兄现在南京，谁人不知道？自古‘地…","so":0,"eo":0},{"surface":"南京","text":"要犯余持，系五河贡生，身中，面白，微须，年约五十多岁。的于四月初八日在无为州城隍庙寓所会风影会话，私和人命，随于十一日进州衙关说。续于十六日州审录供之后，风影备有酒席送至城隍庙。风影共出赃银四百两，三人均分，余持得赃一百三十三两有零。二十八日在州衙辞行，由南京回五河本籍。赃证确据，何得讳称并无其人？事关宪件，人命重情，烦贵县查照来文事理，星即差押该犯赴州，以凭审结。望速！望速！","so":0,"eo":0},{"surface":"南京","text":"知县接了关文，又传余二先生来问。余二先生道：“这更有的分辨了。生员再细细具呈上来，只求太父师做主。”说罢下来，到家做呈子。他妻舅赵麟书说道：“姐夫，这事不是这样说了，分明是大爷做的事，他左一回右一回雪片的文书来，姐夫为甚么自己缠在身上？不如老老实实具个呈子，说大爷现在南京，叫他行文到南京去关，姐夫落得干净无事。我这里‘娃子不哭奶不胀’，为甚么把别人家的棺材拉在自己门口哭？”余二先生道：“老舅，我弟兄们的事，我自有主意，你不要替我焦心。”…","so":0,"eo":0},{"surface":"南京","text":"案据贵州移关，“要犯余持，系五河贡生，身中，面白，微须，年约五十多岁。的于四月初八日在无为州城隍庙寓所会风影会话，私和人命，随于十一日进州衙关说。续于十六日州审录供之后，风影备有酒席送至城隍庙。风影共出赃银四百两，三人均分，余持得赃一百三十三两有零。二十八日在州衙辞行，由南京回五河本籍。赃证确据，何得讳称并无其人？事关宪件，人命重情……”等因到县。准此，本县随即拘传本主到案，据供：生员余持，身中，面麻，微须，年四十四岁，系廪膳生员，未曾…","so":0,"eo":0},{"surface":"南京","text":"又过了几日，弟兄二人商议，要去拜风水张云峰。恰好一个本家来请吃酒，两人拜了张云峰，便到那里赴席去。那里请的没有外人，就是请的他两个嫡堂兄弟：一个叫余敷，一个叫余殷。两人见大哥、二哥来，慌忙作揖，彼此坐下，问了些外路的事。余敷道：“今日王父母在彭老二家吃酒。”主人坐在底下道：“还不曾来哩，阴阳生才拿过帖子去。”余殷道：“彭老四点了主考了。听见前日辞朝的时候，他一句话回的不好，朝廷把他身子拍了一下。”余大先生笑道：“他也没有甚么话说的不好，…","so":0,"eo":0},{"surface":"南京","text":"正说着，小厮捧上五碗面。主人请诸位用了醋，把这青菜炒肉夹了许多堆在面碗头上，众人举起著来吃。余殷吃的差不多，拣了两根面条，在桌上弯弯曲曲做了一个来龙，睁着眼道：“我这地要出个状元。葬下去中了一甲第二也算不得，就把我的两只眼睛剜掉了！”主人道：“那地葬下去自然要发？”余敷道：“怎的不发？就要发！并不等三年五年！”余殷道：“偎着就要发！你葬下去才知道好哩。”余大先生道：“前日我在南京听见几位朋友说，葬地只要父母安，那子孙发达的话也是渺茫。”…","so":0,"eo":0}]},{"chap":46,"ctitle":"第四十六回　三山门贤人饯别　五河县势利熏心","deeds":[{"surface":"南京","text":"话说余大先生葬了父母之后，和二先生商议，要到南京去谢谢杜少卿；又因银子用完了，顺便就可以寻馆。收拾行李，别了二先生，过江到杜少卿河房里。杜少卿问了这场官事，余大先生细细说了。杜少卿不胜叹息。","so":0,"eo":0},{"surface":"南京","text":"南京饯别虞博士的也不下千余家。虞博士应酬烦了，凡要到船中送别的，都辞了不劳。那日叫了一只校俊杯，在水西门起行，只有杜少卿送在舡上。杜少卿拜别道：“老叔已去，小侄从今无所依归矣！”虞博士也不胜凄然，邀到舡里坐下，说道：“少卿，我不瞒你说，我本赤贫之士，在南京来做了六七年博士，每年积几两俸金，只挣了三十担米的一块田。我此番去，或是部郎，或是州县，我多则做三年，少则做两年，再积些俸银，添得二十担米，每年养着我夫妻两个不得饿死，就罢了。子孙们的…","so":0,"eo":0}]},{"chap":47,"ctitle":"第四十七回　虞秀才重修元武阁　方盐商大闹节孝祠","deeds":[{"surface":"南京","text":"余大先生看见这般光景，看不上眼，说道：“表弟，我们也不在这里坐着吃酒了，把祭桌抬到你家，我同舍弟一同到你家坐坐罢。还不看见这些惹气的事！”便叫挑了祭桌前走。他四五个人一路走着。在街上余大先生道：“表弟，我们县里，礼义廉耻一总都灭绝了！也因学官里没有个好官，若是放在南京虞博士那里，这样事如何行的去！”余二先生道：“看虞博士那般举动，他也不要禁止人怎样，只是被了他的德化，那非礼之事，人自然不能行出来。”虞家弟兄几个同叹了一口气，一同到家，吃…","so":0,"eo":0}]},{"chap":48,"ctitle":"第四十八回　徽州府烈妇殉夫　泰伯祠遗贤感旧","deeds":[{"surface":"南京","text":"王玉辉回到家里，向老妻和儿子说余老师这些相爱之意。次日，余大先生坐轿子下乡，亲自来拜，留着在草堂上坐了一会，去了。又次日，二先生自己走来，领着一个门斗，挑着一石米，走进来，会着王玉辉，作揖坐下。二先生道：“这是家兄的禄米一石。”又手里拿出一封银子来道：“这是家兄的俸银一两，送与长兄先生，权为数日薪水之资。”王玉辉接了这银子，口里说道：“我小侄没有孝敬老师和世叔，怎反受起老师的惠来？”余二先生笑道：“这个何足为奇！只是贵处这学署清苦，兼之…","so":0,"eo":0},{"surface":"南京","text":"次日，王玉辉到学署来谢余大先生。余大先生、二先生都会着，留着吃饭。王王辉说起：“在家日日看见老妻悲恸，心下不忍，意思要到外面去作游几时。又想，要作游除非到南京去，那里有极大的书坊，还可逗着他们刻这三部书。”余大先生道：“老哥要往南京，可惜虞博士去了。若是虞博士在南京，见了此书，赞扬一番，就有书坊抢的刻去了。”二先生道：“先生要往南京，哥如今写一封书子去，与少卿表弟和绍光先生。这人言语是值钱的。”大先生欣然写了几封字，庄征君、杜少卿、迟衡…","so":0,"eo":0},{"surface":"南京","text":"王玉辉到了苏州，又换了船，一路来到南京水西门上岸，进城寻了个下处，在牛公庵住下。次日，拿着书子去寻了一日回来。那知因虞博士选在浙江做官，杜少卿寻他去了，庄征君到故乡去修祖坟；退衡山、武正字都到远处做官去了，一个也遇不着。王玉辉也不懊悔，听其自然，每日在牛公庵看书。过了一个多月，盘费用尽了，上街来闲走走。才走到巷口，遇着一个人作揖，叫声：“老伯怎的在这里？”王玉辉看那人，原来是同乡人，姓邓，名义，字质夫。这邓质夫的父亲是王玉辉同案进学，邓…","so":0,"eo":0},{"surface":"南京","text":"到了下处，邓质夫拜见了，说道：“小侄自别老伯，在扬州这四五年。近日是东家托我来卖上江食盐，寓在朝天宫。一向记念老伯，近况好么？为甚么也到南京来？”王玉辉请他坐下，说道，“贤侄，当初令堂老夫人守节，邻家失火，令堂对天祝告，反风灭火，天下皆闻。那知我第三个小女，也有这一番节烈。”因悉把女儿殉女婿的事说了一遍。“我因老妻在家哭泣，心里不忍。府学余老师写了几封书子与我来会这里几位朋友，不想一个也会不着。”邓质夫道：“是那几位？”王玉辉一一说了。…","so":0,"eo":0}]},{"chap":51,"ctitle":"第五十一回　少妇骗人折风月　壮士高兴试官刑","deeds":[{"surface":"南京","text":"话说凤四老爹替万中书办了一个真中书，才自己带了行李，同三个差人送万中书到台州审官司去。这时正是四月初旬，天气温和，五个人都穿着单衣，出了汉西门来叫船，打点一直到浙江去。叫遍了，总没有一只杭州船，只得叫船先到苏州。到了苏州，凤四老爹打发清了船钱，才换了杭州船，这只船比南京叫的却大着一半。凤四老爹道：“我们也用不着这大船，只包他两个舱罢。”随即付埠头一两八钱银子，包了他一个中舱，一个前舱。五个人上了苏州船，守候了一日，船家才揽了一个收丝的客…","so":0,"eo":0},{"surface":"南京","text":"闲话休提。不日到了杭州，又换船直到台州，五个人一齐进了城。府差道：“凤四老爹，家门口恐怕有风声，宫府知道了，小人吃不起。”凤四老爹道：“我有道理。”从城外叫了四乘小桥，放下帘子，叫三个差人同万中书坐着，自己倒在后面走。一齐到了万家来，进大门是两号门面房子，二进是两改三造的小厅。万中书才入内去，就听见里面有哭声，一刻，又不哭了。顷刻，内里备了饭出来。吃了饭，凤四老爹道：“你们此刻不要去，点灯后，把承行的叫了来，我就有道理。”差人依着，点灯…","so":0,"eo":0},{"surface":"南京","text":"次日，万中书乘小轿子到了府前城隍庙里面，照旧穿了七品公服，戴了纱帽，着了靴，只是颈子里却系了链子。府差缴了牌票，祁太爷即时坐堂。解差赵升执着批，将万中书解上堂去。祁太爷看见纱帽圆领，先吃一惊，又看了批文，有“遵例保举中书”字样，又吃了一惊。抬头看那万里，却直立着未曾跪下，因问道：“你的中书是甚时得的？”万中书道：“是本年正月内。”祁太爷道：“何以不见知照？”万中书道：“由阁咨部，由部咨本省巡抚，也须时日。想目下也该到了。”祁太爷道：“你…","so":0,"eo":0}]},{"chap":52,"ctitle":"第五十二回　比武艺公子伤身　毁厅堂英雄讨债","deeds":[{"surface":"南京","text":"说着，家人摆上酒来，三个人传杯换盏，吃到半酣，秦二侉子道：“凤四哥，你刚才说要去寻朋友，是寻哪一个？”凤四老爹道：“我有个朋友陈正公，是这里人，他该我几两银子，我要向他取讨。”胡八公子道：“可是一向住在竹竿巷，而今搬到钱塘门外的？”凤四老爹道：“正是。”胡八公子道：“他而今不在家，同了一个毛胡子到南京卖丝去了。毛二胡子也是三家兄的旧门客。凤四哥，你不消去寻他，我叫家里人替你送一个信去，叫他回来时来会你就是了。”当下吃过了饭，各自散了。胡…","so":0,"eo":0},{"surface":"南京","text":"凤四老爹在秦二侉子的下处，逐日打拳、跑马，倒也不寂寞。一日正在那里试拳法，外边走进一个二十多岁的人，瘦小身材，来问南京凤四老爹可在这里。凤四老爹出来会着，认得是陈正公的侄儿陈虾子。问其来意，陈虾子道：“前日胡府上有人送信，说四老爹你来了，家叔却在南京卖丝去了。我今要往南京去接他，你老人家有甚话，我替你带信去。”凤四老爹道：“我要会令叔，也无甚话说。他向日挪我的五十两银子，得便叫他算还给我。我在此还有些时耽搁，竟等他回来罢了。费心拜上令叔…","so":0,"eo":0},{"surface":"南京","text":"陈虾子应诺，回到家取了行李，搭船便到南京。找到江宁县前傅家丝行里，寻着了陈正公。那陈正公正同毛二胡子在一桌子上吃饭，见了侄子，叫他一同吃饭，问了些家务。陈虾子把凤四老爹要银子的话都说了，安顿行李在楼上住。","so":0,"eo":0},{"surface":"南京","text":"且说这毛二胡子先年在杭城开了个绒线铺，原有两千银子的本钱，后来钻到胡三公子家做蔑片，又赚了他两千银子，搬到嘉兴府开了个小当铺。此人有个毛病，啬细非常，一文如命。近来又同陈正公合伙贩丝。陈正公也是一文如命的人，因此志同道合，南京丝行里供给丝客人饮食最为丰盛，毛二胡子向陈正公道：“这行主人供给我们顿顿有肉，这不是行主人的肉，就是我们自己的肉，左右他要算了钱去，我们不如只吃他的素饭，荤菜我们自己买了吃，岂不便宜，”陈正公道：“正该如此。”到吃…","so":0,"eo":0},{"surface":"南京","text":"又过了几天，陈正公把卖丝的银收齐全了，辞了行主人，带着陈虾子搭船回家，顺便到嘉兴上岸，看看毛胡子。那毛胡子的小当铺开在西街上。一路问了去，只见小小门面三间，一层看墙，进了看墙门，院子上面三间厅房，安着柜台，几个朝奉在里面做生意，陈正公问道：“这可是毛二爷的当铺？”柜里朝奉道：“尊驾贵姓？”陈正公道：“我叫做陈正公，从南京来，要会会毛二爷。”朝奉道：“且请里面坐。”后一层便是堆货的楼。陈正公进未，坐在楼底下，小朝奉送上一怀茶来，吃着，问道…","so":0,"eo":0},{"surface":"南京","text":"次日清早，有人来敲门，开门一看，是凤四老爹，邀进窖座，说了些久违想念的话，因说道：“承假一项，久应奉还，无奈近日又被一个人负骗，竟无法可施。”凤四老爹问其缘故，陈正公细细说了一遍。凤四老爹道：“这个不妨，我有道理。明日我同秦二老爷回南京，你先在嘉兴等着我，我包你讨回，一文也不少，何如？”陈公正道：“若果如此，重重奉谢老爹。”凤四老爹道：“要谢的话，不必再提。”别过，回到下处，把这些话告诉秦二侉子。二侉子道：“四老爹的生意又上门了。这是你…","so":0,"eo":0},{"surface":"南京","text":"凤四老爹同秦二傍子说说笑笑，不日到了南京，各自回家。过了两天，凤四老爹到胭脂巷侯秦中书。他门上人回道：“老爷近来同一位太平府的陈四老爷镇日在来宾楼张家闹，总也不回家。”后来凤四老爹会着，劝他不要做这些事，又恰好京里有人寄信来，说他补缺将近，秦中书也就收拾行装进京。那来宾楼只剩得一个陈四老爷。只因这一番，有分教：国公府内，同飞玩雪之筋；来宾楼中，忽讶深宵之梦。毕竟怎样一个来宾楼，且听下回分解。","so":0,"eo":0}]},{"chap":53,"ctitle":"第五十三回　国公府雪夜留宾　来宾楼灯花惊梦","deeds":[{"surface":"南京","text":"话说南京这十二楼，前门在武定桥，后门在东花园，钞库街的南首就是长板桥。自从太祖皇帝定天下，把那元朝功臣之后都没入乐籍，有一个教坊司管着他们，也有衙役执事，一般也坐堂打人。只是那王孙公子们来，他却不敢和他起坐，只许垂手相见。每到春三二月天气，那些姊妹们都匀脂抹粉，站在前门花柳之下，彼此邀伴顽耍。又有一个盒子会，邀集多人，治备极精巧的时样饮馔，都要一家赛过一家。那有几分颜色的，也不肯胡乱接人。又有那一宗老帮闲，专到这些人家来替他烧香，擦炉，…","so":0,"eo":0},{"surface":"南京","text":"陈木南随即上了轿，两个长随跟着，来到大功坊，轿子落在国公府门口，长随传了进去，半日，里边道：“有请。”陈木南下了桥，走进大门，过了银銮殿，从旁边进去。徐九公子立在瞻园门口，迎着叫声：“四哥，怎么穿这些衣服？”陈木南看涂九公子时，乌帽珥貂，身穿织金云缎夹衣，腰系丝绦，脚下朱履。两人拉着手。只见那园里高高低低都是太湖石堆的玲珑山子，山子上的雪还不曾融尽。徐九公子让陈木南沿着栏杆，曲曲折折，来到亭子上。那亭子是园中最高处，望着那园中几百树梅花…","so":0,"eo":0},{"surface":"南京","text":"说着摆上酒来，都是银打的盆子，用架子架着，底下一层贮了烧酒，用火点着，焰腾腾的，暖着那里边的肴撰，却无一点烟火气。两人吃着，徐九公子道：“近来的器皿都要翻出新样，却不知古人是怎样的制度，想来倒不如而今精巧。”陈木南道：“可惜我来迟了一步。那一年，虞博士在国子监时，迟衡山请他到泰伯祠主祭，用的都是古礼古乐，那些祭品的器皿，都是访古购求的。我若那时在南京，一定也去与祭，也就可以见古人的制度了。”徐九公子道：“十几年来我常在京，却不知道家乡有…","so":0,"eo":0},{"surface":"南京","text":"过了一日，陈木南写了一个札子，叫长随拿到国公府向徐九公子借了二百两银子，买了许多缎匹，做了几套衣服，长随跟着，到聘娘家来做进见礼。到了来宾楼门口，一只小猱狮狗叫了两声，里边那个黑胖虔婆出来迎接。看见陈木南人物体面，慌忙说道：“请姐夫到里边坐。”陈木南走了进去，两间卧房，上面小小一个妆楼，安排着花、瓶、炉、几，十分清雅。聘娘先和一个人在那里下围棋，见了陈木南来，慌忙乱了局来陪，说道：“不知老爷到来，多有得罪。”虔婆道：“这就是太平陈四老爷…","so":0,"eo":0},{"surface":"南京","text":"摆上酒来，聘娘高擎翠袖，将头一杯奉了陈四老爷；第二杯就要奉师父，师父不敢当，自己接了酒。彼此放在桌上。虔婆也走来坐在横头。候四老爷干了头一杯，虔婆自己也奉一杯酒，说道：“四老爷是在国公府里吃这好酒好肴的，到我们门户人家，那里吃得惯！”聘娘道：“你看侬妈也韶刀了！难道四老爷家没有好的吃，定要到国公府里才吃着好的？”虔婆笑道：“姑娘说的是，又是我的不是了，且罚我一杯。”当下自己斟着，吃了一大杯。陈木南笑道：“酒菜也是一样。”虔婆道：“四老爷…","so":0,"eo":0}]},{"chap":54,"ctitle":"第五十四回　病佳人青楼算命　呆名士妓馆献诗","deeds":[{"surface":"南京","text":"过了一日，三公子同九公子来河房里辞行，门口下了轿子。陈木南迎进河厅坐丁。三公子道：“老弟，许久不见，风采一发倜傥。姑母去世，愚表兄远在都门，不曾亲自吊唁。几年来学问更加渊博了。”陈木南道：“先母辞世，三载有余。弟因想念九表弟文字相好，所以来到南京，朝夕请教。今表兄荣任闽中，贤昆玉同去，愚表弟倒觉失所了。”九公子道：“表兄若不见弃，何不同到漳州？长途之中，倒觉得颇不寂寞。”陈木南道，“原也要和表兄同行，因在此地还有一两件小事，俟两三月之后…","so":0,"eo":0},{"surface":"南京","text":"才进了来宾楼门，听见里面弹的三弦子响，是虔婆叫了一个男瞎子来替姑娘算命。陈木南把人参、黄连递与虔婆，坐下听算命。那瞎子道：“姑娘今年十七岁，大运交庚寅，寅与亥合，合着时上的贵人，该有个贵人星坐命。就是四正有些不利，吊动了一个计都星，在里面作扰，有些啾卿不安，却不碍大事。莫怪我直谈，姑娘命里犯一个华盖星，却要记一个佛名，应破了才好。将来从一个贵人，还要戴凤冠霞帔，有太太之分哩。”说完，横着三弦弹着，又唱一回，起身要去。虔婆留吃茶，捧出一盘…","so":0,"eo":0}]},{"chap":55,"ctitle":"第五十五回　添四客述往思来　弹一曲高山流水","deeds":[{"surface":"南京","text":"话说万历二十三年，那南京的名士都已渐渐销磨尽了。此时虞博士那一辈人，也有老了的，也有死了的，也有四散去了的，也有闭门不问世事的。花坛酒社，都没有那些才俊之人：礼乐文章，也不见那些贤人讲究。论出处，不过得手的就是才能，失意的就是愚拙；论豪侠，不过有余的就会奢华，不足的就见萧索。凭你有李、杜的文章，颜、曾的品行，却是也没有一个人来问你。所以那些大户人家，冠、昏、丧、祭，乡绅堂里，坐着几个席头，无非讲的是些升、迁、调、降的官场；就是那贫贱儒主…","so":0,"eo":0}]}],"relations":[]},{"id":"a67146c6-b8af-4af6-82eb-3a23d0a30e62","name":"匡超人","type":"PERSON","mentionCount":80,"chapterCount":10,"firstChapter":15,"lastChapter":56,"aliases":["匡二相公","匡先生","匡爷","匡相公","匡迥"],"density":"rich","timeline":[{"chap":15,"ctitle":"第十五回　葬神仙马秀才送丧　思父母匡童生尽孝","deeds":[{"surface":"匡超人","text":"马二先生着实恻然，说道：“你且不要伤心。你尊讳尊字是甚么？”那少年收泪道：”晚生叫匡迥，号超人。还不曾请问先生仙乡贵姓。”马二先生道：“这不必问，你方才看的文章，封面上马纯上就是我了。”匡超人听了这话，慌忙作揖，磕下头去，说道：“晚生真乃‘有眼不识泰山’！”马二先生忙还了礼，说道：“快不要如此，我和你萍水相逢，斯文骨肉。这拆字到晚也有限了，长兄何不收了，同我到下处谈谈？”匡超人道：“这个最好。先生请坐，等我把东西收了。”当下将笔砚纸盘收…","so":0,"eo":0},{"surface":"匡超人","text":"马二先生到文瀚楼开了房门坐下。马二先生问道：“长兄，你此时心里可还想着读书上进？还想着家去看看尊公么？”匡超人见问这话，又落下泪来，道：“先生，我现今衣食缺少，还拿甚么本钱想读书上进？这是不能的了。只是父亲在家患病，我为人子的，不能回去奉侍，禽兽也不如，所以几回自心里恨极，不如早寻一个死处！”马二先生劝道：“决不要如此。只你一点孝思，就是天地也感格的动了。你且坐下，我收拾饭与你吃。”当下留他吃了晚饭，又问道：“比如长兄你如今要回家去，须…","so":0,"eo":0},{"surface":"匡超人","text":"到晚，马二先生又问道：“你当时读过几年书？文章可曾成过篇？”匡超人道：“成过篇的。”马二先生笑着向他说：“我如今大胆出个题目，你做一篇，我看看你笔下可望得进学。这个使得么？”匡超人道：“正要请教先生，只是不通，先生休笑。”马二先生道：”说那里话，我出一题，你明日做。”说罢，出了题，送他在那边睡。次日，马二先生才起来，他文章已是停停当当，送了过来。马二先生喜道：“又勤学，又敏捷，可敬可敬！”把那文章看了一遍，道：“文章才气是有，只是理法欠…","so":0,"eo":0},{"surface":"匡超人","text":"说罢，又到自己书架上，细细检了几部文章，塞在他棉袄里卷着，说道：“这都是好的，你拿去读下。”匡超人依依不舍，又急于要家去看父亲，只得洒泪告辞，马二先生携着手，同他到城隍山旧下处取了铺盖，又送他出清波门，一直送到江船上，看着上了船，马二先生辞别进城去了。","so":0,"eo":0},{"surface":"匡超人","text":"匡超人过了钱塘江，要搭温州的船。看见一只船正走着，他就问：“可带人？”船家道：“我们是抚院大人差上郑老爹的船，不带人的。”匡超人背着行李正待走，船窗里一个白须老者道：“驾长，单身客人带着也罢了，添着你买酒吃。”船家道：“既然老爹吩咐，客人你上来罢。”把船撑到岸边，让他下了船。匡超人放下行李，向老爹作了揖，看见舱里三个人：中间郑老爹坐着，他儿子坐在旁边，这边坐着一外府的客人。郑老爹还了礼，叫他坐下。匡超人为人乖巧，在船上不拿强拿，不动强动…","so":0,"eo":0},{"surface":"匡超人","text":"饭后行船无事，郑老爹说起：“而今人情浇薄，读书的人都不孝父母。这温州姓张的，弟兄三个都是秀才，两个疑惑老子把家私偏了小儿子，在家打吵，吵的父亲急了，出首到官。他两弟兄在府、县都用了钱，倒替他父亲做了假哀怜的呈子，把这事销了案。亏得学里一位老师爷持正不依，详了我们大人衙门，大人准了，差了我到温州提这一干人犯去。”那客人道：“这一提了来审实，府、县的老爷不都有碍？”郑老爹道：“审出真情，一总都是要参的！”匡超人听见这话，自心里叹息：“有钱的…","so":0,"eo":0}]},{"chap":16,"ctitle":"第十六回　大柳庄孝子事亲　乐清县贤宰爱士","deeds":[{"surface":"匡超人","text":"话说匡超人望见自己家门．心里欢喜，两步做一步，急急走来敲门。母亲听见是他的声音，开门迎了出来，看见道：“小二！你回来了！”匡超人道：“娘！我回来了！”放下行李，整一整衣服，替娘作揖磕头。他娘捏一捏他身上，见他穿着极厚的棉袄，方才放下心。向他说道：“自从你跟了客人去后，这一年多，我的肉身时刻不安！一夜梦见你掉在水里，我哭醒来。一夜又梦见你把腿跌折了。一夜又梦见你脸上生了一个大疙瘩，指与我看，我替你拿手拈，总拈不掉。一夜又梦见你来家望着我哭…","so":0,"eo":0},{"surface":"匡超人","text":"外边说着话，他父亲匡太公在房里已听见儿子回来了，登时那病就轻松些，觉得有些精神。匡超人走到跟前，叫一声：“爹！儿子回来了！”上前磕了头。太公叫他坐在床沿上，细细告诉他这得病的缘故，说道：“自你去后，你三房里叔子就想着我这个屋。我心里算计，也要卖给他，除另寻屋，再剩几两房价，等你回来做个小本生意。傍人向我说：‘你这屋是他屋边屋，他谋买你的，须要他多出几两银子。’那知他有钱的人只想便宜，岂但不肯多出钱，照时值估价还要少几两，分明知道我等米下…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人等菜烂了，和饭拿到父亲面前。扶起来坐着。太公因儿子回家，心里欢喜，又有些荤菜，当晚那菜和饭也吃了许多。剩下的，请了母亲同哥进来，在太公面前，放桌子吃了晚饭。太公看着欢喜，直坐到更把天气，才扶了睡下。匡超人将被单拿来，在太公脚跟头睡。","so":0,"eo":0},{"surface":"匡超人","text":"次日清早起来，拿银子到集上买了几口猪，养在圈里，又买了斗把豆子。先把猪肩出一个来杀了，烫洗干净，分肌劈理的卖了一早晨。又把豆子磨了一厢豆腐，也都卖了钱，拿来放在太公床底下。就在太公跟前坐着，见太公烦闷，便搜出些西湖上景致，以及卖的各样的吃食东西，又听得各处的笑话，曲曲折折，细说与太公听。太公听了也笑。太公过了二会，向他道：“我要出恭，快喊你娘进来。”母亲忙走进来，正要替太公垫布，匡超人道：“爹要出恭。不要这样出了。象这布垫在被窝里，出的…","so":0,"eo":0},{"surface":"匡超人","text":"到晚，又扶太公坐起来吃了晚饭。坐一会，伏侍太公睡下，盖好了被。他便把省里带来的一个大铁灯盏装满了油，坐在太公傍边，拿出文章来念。太公睡不着，夜里要吐痰、吃茶，一直到四更鼓，他就读到四更鼓。太公叫一声，就在跟前。太公夜里要出恭，从前没人服侍，就要忍到天亮，今番有儿子在傍伺侯，夜里要出就出，晚饭也放心多吃几口。匡超人每夜四鼓才睡，只睡一个更头乡便要起来杀猪，磨豆腐。","so":0,"eo":0},{"surface":"匡超人","text":"过了四五日，他哥在集上回家的早，集上带了一个小鸡子在嫂子房里煮着，又买了一壶酒，要替兄弟接风，说道：“这事不必告诉老爹罢。”匡超人不肯，把鸡先盛了一碗送与父母，剩下的，兄弟两人在堂里吃着。恰好三房的阿叔过来催房子，匡超人丢下酒多向阿叔作揖下跪。阿叔道：“好呀！老二回来了，穿的恁厚厚敦敦的棉袄！又在外边学得恁知礼，会打躬作揖。”匡超人道：“我到家几日，事忙，还不曾来看得阿叔，就请坐下吃杯便酒罢。”阿叔坐下吃了几杯酒，便提到出房子的话，匡超…","so":0,"eo":0},{"surface":"匡超人","text":"自此以后，匡超人的肉和豆腐都卖的生意又燥，不到日中就卖完了，把钱拿来家伴着父亲。算计那日赚的钱多，便在集上买个鸡、鸭，或是鱼，来家与父亲吃饭。因太公是个痰症，不十分宜吃大荤，所以要买这些东西。或是猪腰子，或是猪肚子，倒也不断。医药是不消说。太公日子过得称心，每日每夜出恭都是儿子照顾定了，出恭一定是匡超人跪在跟前，把腿捧在肩头上。太公的病渐渐好了许多，也和两个儿子商议要寻房子搬家，倒是匡超人说，“父亲的病才好些，索性等再好几分，扶着起来走…","so":0,"eo":0},{"surface":"匡超人","text":"这匡超人精神最足：早半日做生意，夜晚伴父亲，念文章，辛苦已极，中上得闲，还溜到门首同邻居们下象棋。那日正是早饭过后，他看着太公吃了饭，出门无事，正和一个本家放牛的，在打稻场上，将一个稻箩翻过来做了桌子，放着一个象棋盘对著。只见一个白胡老者，背剪着手来看，看了半日，在傍边说道：“老兄这一盘输了！”匡超人抬头一看，认得便是木材大柳庄保正潘老爹。因立起身来叫了他一声，作了个揖。潘保正道：“我道是谁，方才几乎不认得了，你是匡太公家匡二相公。你从…","so":0,"eo":0}]},{"chap":17,"ctitle":"第十七回　匡秀才重游旧地　赵医生高踞诗坛","deeds":[{"surface":"匡超人","text":"只见大路上两个人，手里拿着红纸帖子，走来问道：“这里有一个姓匡的么？”保正认得是学里门斗，说道：“好了，匡二相公恭喜进了学了。”便道：“匡大哥，快领二位去同你老爹说。”匡大东西才拾完在担子里，挑起担子，领两个门斗来家。那人也是保正劝回去了。门斗进了门，见匡太公睡在床上，道了恭喜，把报帖升贴起来。上写道：“捷报贵府相公匡讳迥，蒙提学御史学道大老爷取中乐清县第一名人泮。联科及第。本学公报。”太公欢喜，叫老奶奶烧起茶来，把匡大担了里的糖和豆腐…","so":0,"eo":0},{"surface":"匡超人","text":"直到四五日后，匡超人送过宗师，才回家来，穿着衣中，拜见父母，嫂子是因回禄后就住在娘家去了，此时只拜了哥哥。他哥见他中了个相公，比从前更加亲热些。潘保正替他约齐了分子，择个日子贺学，又借在庵里摆酒。此舍不同，共收了二十多吊钱，宰了两个猪和些鸡鸭之类，吃了两三日酒，和尚也来奉承。","so":0,"eo":0},{"surface":"匡超人","text":"匡超人同太公商议，不磨豆腐了，把这剩下来的十几吊钱把与他哥，又租了两间屋开个小杂货店。嫂子也接了回来，也不分在两处吃了，每日寻的钱家里盘缠。忙过几日，匡超人又进城去谢知县。知县此番便和他分庭抗礼，留着吃了酒饭，叫他拜做老师。事毕回家，学里那两个门斗又下来到他家说话。他请了潘老爹来陪。门斗说：“学里老爷要传匡相公去见，还要进见之礼。”匡超人恼了，道：“我只认得我的老师！他这教官，我去见他做甚么？有甚么进见之礼！”潘老爹道：“二相公，你不可…","so":0,"eo":0},{"surface":"匡超人","text":"那日上坟回来，太公觉得身体不大爽利，从此病一日重似一日，吃了药也再不得见效，饭食也渐渐少的不能吃了。匡超人到处求神问卜，凶多吉少，同哥商议，把自己向日那几两本钱，替太公备后事，店里照旧不动。当下买了一具棺木，做了许多布衣，合着太公的头，做了一顶方巾，预备停当。太公奄奄在床，一日昏聩的狠，一日又觉得明白些。那日，太公自知不济，叫两个儿子都到跟前，吩咐道：“我这病犯得拙了，眼见得望天的日子远，入地的日子近。我一生是个无用的人，一块土也不曾丢…","so":0,"eo":0},{"surface":"匡超人","text":"那一日，正从坟上奠了回来，天色已黑。刚才到家，潘保正走来向他说道：“二相公，你可知道，县里老爷坏了，今日委了温州府二太爷来摘了印去了；他是你老师，你也该进城去看看。”匡超人次日换了素服，进城去看。才走进城，那晓得百姓要留这官，鸣锣罢市，围住了摘印的官，要夺回印信，把城门大白日关了，闹成一片。匡超人不得进去，只得回来再听消息。","so":0,"eo":0},{"surface":"匡超人","text":"第三日，听得省里委下安民的官来了，要拿为首的人。又过了三四日，匡超人从坟上回来，潘保正迎着道：“不好了，祸事到了！”匡超人道：“甚么祸事？”潘保正道：“到家去和你说。”当下到了匡家，坐下道：“昨日安民的官下来，百姓散了，上司叫这官密访为头的人，已经拿了几个。衙门里有两个没良心的差人，就把你也密报了，说老爷待你甚好，你一定在内为头要保留，是那里冤枉的事！如今上面还要密访，但这事那里定得？他若访出是实，恐怕就有人下来拿，依我的意思，你不如在…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人惊得手慌脚忙，说道：“这是那里晦气！多承老爹相爱，说信与我，只是我而今那里去好？”潘保正道：“你自心里想，那处熟就往那处去。”匡超人道：“我只有杭州熟，却不曾有甚相与的。”潘保正道：“你要往杭州，我写一个字与你带去。我有个房分兄弟，行三，人都叫他潘三爷，现在布政司星充吏，家里就在司门前山上住。你去寻着了他，凡事叫他照应。他是个极慷慨的人，不得错的。”匡超人道：“既是如此，费老爹的心写下书子，我今晚就走才好。”当下潘老爹一头写书，他…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人背着行李，走了几天旱路，到温州搭船，那日没有便船，只得到饭店权宿。走进饭店，见里面点着灯，先有一个客人坐在一张桌子上，面前摆了一本书，在那里静静的看。匡超人看那人时，黄瘦面皮，稀稀的几根胡子。那人看书出神，又是个近视眼，不曾见有人进来。匡超人走到跟前，请教了一声“老客”，拱一拱手。那人才立起身来为礼，青绢直身，瓦楞帽子，像个生意人模样。两人叙礼坐下，匡超人问道：“客人贵乡尊姓？”那人道：“在下姓景，寒舍就在这三十里外，因有个小店在…","so":0,"eo":0}]},{"chap":18,"ctitle":"第十八回　约诗会名士携匡二　访朋友书店会潘三","deeds":[{"surface":"匡超人","text":"话说匡超人那晚吃了酒，回来寓处睡下。次日清晨，文瀚楼店主人走上楼来，坐下道：“先生，而今有一件事阳商。”匡超人问是何事。主人道：“日今我和一个朋友合本，要刻一部考卷卖，要费先生的心，替我批一批，又要批的好，又要批的快。合共三百多篇文章，不知要多少日子就可以批得出来？我如今扣着日子，好发与山东、河南客人带去卖，若出的迟，山东、河南客人起了身，就误了一觉睡。这书刻出来，封面上就刻先生的名号，还多寡有几两选金和几十本样书送与先生。不知先生可赶…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人大喜，当晚点起灯来，替他不住手的批，就批出五十篇，听听那樵楼上，才交四鼓。匡超人喜道：“像这样，那里要半个月！”吹灯睡下，次早起来又批，一日搭半夜，总批得七八十篇。","so":0,"eo":0},{"surface":"匡超人","text":"到第四日，正在楼上批文章，忽听得楼下叫一声道：“匡先生在家么？”匡超人道：”是那一位？”忙走下楼来，见是景兰江，手里拿着一个斗方卷着，见了作揖道：“候迟有罪。”匡超人把他让上楼去，他把斗方放开在桌上，说道：“这就是前日宴集限‘楼’字韵的。同人已经写起斗方来，赵雪兄看见，因未得与，不胜怅怅，因照韵也做了一首。我们要让他写在前面，只得又各人写了一回，所以今日才得送来请教。”匡超人见题上写着“暮春旗亭小集，同限‘楼’字”，每人一首诗，后面排着…","so":0,"eo":0},{"surface":"匡超人","text":"当下换了衣服，锁了楼门，同下来走到街上。匡超人道：“如今往那里去？”景兰江道：“是我们这里做过家宰的胡老先生的公子胡三先生。他今朝小生日，同人都在那里聚会，我也要去祝寿，故来拉了你去，到那里可以会得好些人，方才斗方上几位都在那里。”匡超人道：“我还不曾拜过胡三先生，可要带个帖子去？”景兰江道：“这是要的。”一同走到香蜡店，买了个帖子，在柜台上借笔写“眷晚生匡迥拜”。写完，笼着又走。景兰江走着告诉匡超人道：“这位胡三先生虽然好客，却是个胆…","so":0,"eo":0},{"surface":"匡超人","text":"正说得热闹，街上又遇着两个方巾阔服的人，景兰江迎着道：“二位也是到胡三先生家拜寿去的？却还要约那位，向那头走？”那两人道：“就是来约长兄。既遇着，一同行罢。”因问：“此位是谁？”景兰江指着那两人向匡超人道：“这位是金东崖先生，这位是严致中先生。”指着匡超人向二位道，“这是匡超人先生。”四人齐作了一个揖，一齐同走。走到一个极大的门楼，知道是冢宰第了，把帖子交与看门的。看门的说：“请在厅上坐。”匡超人举眼看见中间御书匾额“中朝往石”四个字，…","so":0,"eo":0},{"surface":"匡超人","text":"少顷，胡三公子出来，头戴方巾，身穿酱色缎直裰，粉底皂靴，三绺髭须，约有四十多岁光景。三公子着实谦光，当下同诸位作了揖。诸位祝寿，三公子断不敢当，又谢了诸位，奉坐。金东崖首坐，严致中二坐，匡超人三坐，景兰江是本地人，同三公子坐在主位。金东崖向三公子谢了前日的扰。三公子向严致中道：“一向驾在京师，几时到的？”严致中道：“前日才到。一向在都门敝亲家国子司业周老先生家做屠亭，因与通政范公日日相聚。今通政公告假省墓，约弟同行，顺便返舍走走。’胡三…","so":0,"eo":0},{"surface":"匡超人","text":"吃过，那卫先生、随先生闲坐着，谈起文来。卫先生道：“近来的选事益发坏了！”随先生道：“正是。前科我两人该选一部，振作一番。”卫先生估着眼道：“前科没有文章！”匡超人忍不住，上前问道：“请教先生，前科墨卷到处都有刻本的，怎的没有文章？”卫先生道：“此位长兄尊姓？”景兰江道：“这是德清匡先生。”卫先生道：“所以说没有文章者，是没有文章的法则。”匡超人道：“文章既是中了，就是有法则了。难道中式之外，又另有个法则？”卫先生道：“长兄，你原来不知…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人到寓所还批了些文章才睡。屈指六日之内，把三百多篇文章都批完了。就把在胡家听的这一席话敷衍起来，做了个序文在上。又还偷着功夫去拜了同席吃酒的这几位朋友。选本已成，书店里拿去看了，回来说道：“向日马二先生在家兄文海楼，三百篇文章要批两个月，催着还要发怒，不想先生批的恁快！我拿给人看，说又快又细。这是极好的了！先生住着，将来各书坊里都要来请先生，生意多哩！”因封出二两选金，送来说道：“刻完的时候，还送先生五十个样书。”又备了酒在楼上吃。","so":0,"eo":0}]},{"chap":19,"ctitle":"第十九回　匡超人幸得良朋　潘自业横遭祸事","deeds":[{"surface":"匡超人","text":"话说匡超人睡在楼上，听见有客来拜，慌忙穿衣起来下楼。见一个人坐在楼下，头戴吏巾，身穿无缎直裰，脚下虾膜头厚底皂靴，黄胡子，高颧骨，黄黑面皮，一双直眼。那人见匡超人下来，便问道：“此位是匡二相公么？”匡超人道：“贱姓匡，请问尊客贵姓？”那人道：“在下姓潘，前日看见家兄书子，说你二相公来省。”匡超人道：“原来就是潘三哥。”慌忙作揖行礼，请到楼上坐下。潘三道：“那日二相公赐顾，我不在家。前日返舍，看见家兄的书信，极赞二相公为人聪明，又行过多少…","so":0,"eo":0},{"surface":"匡超人","text":"说罢，自己下去拿茶，又托书店买了两盘点心，拿。上楼来。潘三正在那里看斗方，看见点心到了，说道：“哎呀！这做甚么？”接茶在手，指着壁上道。“二相公，你到省里未，和这些人相与做甚么？”匡超人问是怎的。潘三道：“这一班人是有名的呆子。这姓景的开头巾店，本来有两千银子的本钱，一顿诗做的精光。他每日在店里，手里拿着一个刷子刷头巾，口里还哼的是‘清明时节雨纷纷’，把那买头巾的和店邻看了都笑。而今折了本钱，只借这做诗为由，遇着人就借银子，人听见他都怕…","so":0,"eo":0},{"surface":"匡超人","text":"当下吃了两个点心，便丢下，说道：“这点心吃他做甚么，我和你到街上去吃饭。”叫匡超人锁了门，同到街上司门口一个饭店里。潘三叫切一只整鸭，脍一卖海参杂脍，又是一大盘白肉，都拿上来。饭店里见是潘三爷，屁滚尿流，鸭和肉都捡上好的极肥的切来，海参杂脍加味用作料。两人先斟两壶酒。酒罢用饭，剩下的就给了店里人。出来也不算账，只吩咐得一声：“是我的。”那店主人忙拱手道：“三爷请便，小店知道：”","so":0,"eo":0},{"surface":"匡超人","text":"走出店门，潘三道：“二相公，你而今往那去？”匡超人道：“正要到三哥府上。”潘三道：“也罢，到我家去坐坐。”同着一直走到一个巷内、一带青墙，两扇半截板门，又是两扇重门。进到厅上，一伙人在那里围着一张桌子赌钱，潘三骂道：“你这一班狗才，无事便在我这里胡闹！”众人道：“知道三老爹到家几日了，送几个头钱来与老爹接风。”潘三道：“我那里要你甚么头钱接风！”又道：“也罢，我有个朋友在此，你们弄出几个钱来热闹热闹。”匡超人要同他施礼。他拦住道：“方才…","so":0,"eo":0},{"surface":"匡超人","text":"当下两人来家，赌钱的还不曾散。潘三看看赌完了，送了众人出去，留下匡超人来道：“二相公，你住在此，我和你说话。”当下留在后面楼上，起了一个婚书稿，叫匡超人写了，把与郝老二看，叫他明日拿银子来取。打发郝二去了。吃了晚饭，点起灯来，念着回批，叫匡超人写了。家里有的是豆腐干刻的假印，取来用上，又取出硃笔，叫匡超人写了一个赶回文书的硃签。办毕，拿出酒来对饮，向匡超人道：“像这都是有些想头的事，也不枉费一番精神，和那些呆瘟缠甚么！”是夜留他睡下。次…","so":0,"eo":0},{"surface":"匡超人","text":"不觉住了将及两年。一日，潘三走来道：“二相公，好几日不会，同你往街上吃三杯，”匡超人锁了楼门，同走上街。才走得几步，只见潘家一个小厮寻来了说：“有客在家里等三爷说话。”潘三道：“二相公，你就同我家去。”当下同他到家，请匡超人在里间小客座里坐下。潘三同那人在外边，潘三道：“李四哥，许久不见，一向在那里？”李四道：“我一向在学道衙门前。今有一件事，回来商议，怕三爷不在家，而今会着三爷，这事不愁不妥了。”潘三道：“你又甚么事捣鬼话？同你共事，…","so":0,"eo":0},{"surface":"匡超人","text":"潘三送了李四出去，回来向匡超人说道：“二相公，这个事用的着你了。”匡超人道：“我方才听见的。用着我，只好替考。但是我还是坐在外面做了文章传递，还是竟进去替他考？若要进去替他考，我竟没有这样的胆子。”潘三道：“不访，有我哩！我怎肯害你？且等他封了银子来，我少不得同你往绍兴去。”当晚别了回寓。","so":0,"eo":0},{"surface":"匡超人","text":"过了几日，潘三果然来搬了行李同行，过了钱塘江，一直来到绍兴府，在学道门口寻了一个僻静巷子寓所住下。次日，李四带了那童生来会一会。潘三打听得宗师挂牌考会稽了，三更时分，带了匡超人，悄悄同到班房门口。拿出一顶高黑帽、一件青布衣服、一条红搭包来，叫他除了方巾，脱了衣裳，就将这一套行头穿上。附耳低言，如此如此，不可有误。把他送在班房，潘三拿着衣帽去了。","so":0,"eo":0}]},{"chap":20,"ctitle":"第二十回　匡超人高兴长安道　牛布衣客死芜湖关","deeds":[{"surface":"匡超人","text":"话说匡超人看了款单，登时面如土色，真是“分开两扇顶门骨，无数凉冰浇下来”。口里说不出，自心下想道：“这些事，也有两件是我在里面的；倘若审了，根究起来，如何了得！”当下同景兰江别了刑房，回到街上，景兰江作别去了。匡超人到家，踌躇了一夜，不曾睡觉。娘子问他怎的，他不好真说，只说：“我如今贡了，要到京里去做官，你独自在这里住着不便，只好把你送到乐清家里去。你在我母亲眼前，我便往京里去做官，做的兴头，再来接你上任。”娘子道：“你去做官罢了，我自…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人也收拾行李来到京师见李给谏，给谏大喜。问着他又补了廪，以优行贡入大学，益发喜极。向他说道：“贤契，目今朝廷考取教习，学生料理，包管贤契可以取中。你且将行李搬在我寓处来盘桓几日。”匡超人应诺，搬了行李来。又过了几时，给谏问匡超人可曾婚娶。匡超人暗想，老师是位大人，在他面前说出丈人是抚院的差，恐惹他看轻了笑，只得答道：“还不曾。”给谏道：“恁大年纪，尚不曾娶，也是男子汉‘漂梅之侯’了。但这事也在我身上。”","so":0,"eo":0},{"surface":"匡超人","text":"次晚，遣一个老成管家来到书房里向匡超人说道：“家老爷拜上匡爷。因昨日谈及匡爷还不曾恭喜娶过夫人，家老爷有一外甥女，是家老爷夫人自小抚养大的，今年十九岁，才貌出众，现在署中，家老爷意欲招匡爷为甥婿。一切恭喜费用俱是家老爷备办，不消匡爷费心。所以著小的来向匡爷叩喜。”匡超人听见这话，吓了一跳，思量要回他说已经娶过的，前日却说过不曾；但要允他，又恐理上有碍。又转一念道：“戏文上说的蔡状元招赘牛相府，传为佳话，这有何妨！”即便应允了。","so":0,"eo":0},{"surface":"匡超人","text":"给谏大喜，进去和夫人说下，择了吉日，张灯结彩，倒赔数百金装奁，把外甥女嫁与匡超人。到那一日，大吹大擂，匡超人纱帽圆领，金带皂靴，先拜了给谏公夫妇，一派细乐，引进洞房。揭去方中，见那新娘子辛小姐，真有沉鱼落雁之容，闭月羞花之貌，人物又标致，嫁装又齐整，匡超人此时恍若亲见瑶宫仙子、月下媒娥，那魂灵都飘在九霄云外去了。自此，珠围翠绕，燕尔新婚，享了几个月的天福。","so":0,"eo":0},{"surface":"匡超人","text":"不想教习考取，要回本省地方取结。匡超人没奈何，含着一包眼泪，只得别过了辛小姐，回浙江来，一进杭州城，先到他原旧丈人郑老爹家来。进了郑家门，这一惊非同小可，只见郑老爹两眼哭得通红，对面客位上一人便是他令兄匡大，里边丈母嚎天喊地的哭，匡超人吓痴了，向丈人作了揖，便间：“哥几时来的？老爹家为甚事这样哭？”匡大道：“你且搬进行李来，洗脸吃茶，慢慢和你说。”匡超人洗了脸，走进去见丈母，被丈母敲桌子，打板凳，哭着一场数说：“总是你这天灾人祸的，把我…","so":0,"eo":0},{"surface":"匡超人","text":"匡超人听见了这些话，上不住落下几点泪来，便问：“后事是怎样办的？”匡大道：”弟妇一倒了头，家里一个钱也没有，我店里是腾不出来，就算腾出些须来，也不济事。无计奈何，只得把预备着娘的衣衾棺木都把与他用了。”匡超人道：“这也罢了。”匡大道：”装殓了，家里又没处停，只得权厝在庙后，等你回来下土。你如今来得正好，作速收拾收拾，同我回去。”匡超人道：“还不是下土的事哩。我想如今我还有几两银子，大哥拿回去，在你弟妇厝基上替他多添两层厚砖，砌的坚固些，…","so":0,"eo":0},{"surface":"匡超人","text":"又过了三四日，景兰江同着刑房的蒋书办找了来说话，见郑家房子浅。要邀到茶室里去坐，匡超人近日口气不同，虽不说，意思不肯到茶室，景兰江揣知其意，说道：“匡先生在此取结赴任，恐不便到茶室里去坐，小弟而今正要替先生接风，我们而今竟到酒楼上去坐罢，还冠冕些。”当下邀二人上了酒楼，斟上酒来，景兰江问道：“先生，你这教习的官，可是就有得选的么？”匡超人道：“怎么不选？象我们这正途出身，考的是内廷教习，每日教的多是勋戚人家子弟，”景兰江道：“也和平常教…","so":0,"eo":0},{"surface":"匡超人","text":"蒋刑房等他说完了，慢慢提起来，说：“潘三哥在监里，前日再三和我说，听见尊驾回来了，意思要会一会，叙叙苦情。不知先生你意下何如？”匡超人道：“潘三哥是个豪杰，他不曾遇事时，会着我们，到酒店里坐坐，鸭子是一定两只，还有许多羊肉、猪肉、鸡、鱼，像这店里钱数一卖的菜，他都是不吃的。可惜而今受了累。本该竟到监里去看他一看，只是小弟而今比不得做诸生的时候，既替朝廷办事，就要照依着朝廷的赏罚，若到这样地方去看人，便是赏罚不明了。”蒋刑房道：“这本城的…","so":0,"eo":0}]},{"chap":28,"ctitle":"第二十八回　季苇萧扬州入赘　萧金铉白下选书","deeds":[{"surface":"匡超人","text":"这季恬逸因缺少盘缠，没处寻寓所住，每日里拿着八个钱买四个吊桶底作两顿吃，晚里在刻字店一个案板上睡宽。这日见了书子，知道季苇萧不来，越发慌了；又没有盘缠回安庆去，终日吃了饼坐在刻字店里出神。那一日早上，连饼也没的吃，只见外面走进一个人来，头戴方巾，身穿元色直裰，走了进来，和他拱一拱手。季恬逸拉他在板凳上坐下。那人道：“先生尊姓？”季恬逸道：“贱性季。”那人道：“情问先生，这里可有选文章的名士么？”季恬逸道：“多的很！卫体善、随岑庵、马纯上…","so":0,"eo":0}]},{"chap":42,"ctitle":"第四十二回　公子妓院说科场　家人苗疆报信息","deeds":[{"surface":"匡超人","text":"到初八早上，把这两顶旧头巾叫两个小子戴在头上，抱着篮子到贡院前伺侯。一路打从淮清桥过，那赶抢摊的摆着红红绿绿的封面，都是萧金铉、诸葛天申、季恬逸、匡超人、马纯上、蘧验夫选的时文。一直等到晚，仪征学的秀才点完了，才点他们。进了头门，那两个小厮到底不得进去。大爷、二爷自己抱着篮子，背着行李，看见两边芦柴堆火光一直亮到天上。大爷、二爷坐在地下，解怀脱脚。听见里面高声喊道：“仔细搜检！”大爷、二爷跟了这些人进去，到二门口接卷，进龙门归号。初十日…","so":0,"eo":0}]},{"chap":54,"ctitle":"第五十四回　病佳人青楼算命　呆名士妓馆献诗","deeds":[{"surface":"匡超人","text":"陈和尚自此以后，无妻一身轻，有肉万事足，每日测字的钱就买肉吃，吃饱了就坐在文德桥头测字的桌子上念诗，十分自在。又过了半年，那一日正拿着一本书在那里看，遇着他一个同伙的测字丁言志来看他。见他看这本书，因问道：“你这书是几时买的？”陈和尚道，“我才买来三四天。”丁言志道：“这是莺豆湖唱和的诗。当年胡三公子约了赵雪斋、景兰江、杨执中先生，匡超人、马纯上一班大名士，大会莺豆湖，分韵作诗。我还切记得赵雪斋先生是分的‘八齐’。你看这起句‘湖如莺豆夕…","so":0,"eo":0}]},{"chap":56,"ctitle":"第五十六回　神宗帝下诏旌贤　刘尚书奉旨承祭","deeds":[{"surface":"匡超人","text":"贡生：严大位、随岑庵、匡迥、沈大年，共四人。","so":0,"eo":0},{"surface":"匡超人","text":"第二十一名匡迥，浙江乐清县人。","so":0,"eo":0}]}],"relations":[{"id":"d1002c53-c7f4-4793-9cf1-b9576f20cb2c","code":"师生","sc":15,"ec":null,"status":"ACTIVE","other":"马二先生","dir":"in"},{"id":"ffb49275-f4bf-4025-be40-32880212c2df","code":"兄弟","sc":15,"ec":null,"status":"ACTIVE","other":"马二先生","dir":"in"},{"id":"a16e1081-782c-470e-895a-af068b05cd6c","code":"父子","sc":1 838714da","name":"天长","type":"LOCATION","mentionCount":29,"chapterCount":14,"firstChapter":25,"lastChapter":56,"aliases":["天长县"],"density":"moderate","timeline":[{"chap":25,"ctitle":"第二十五回　鲍文卿南京遇旧　倪廷玺安庆招亲","deeds":[{"surface":"天长","text":"那日早上，正要带着鲍廷玺出门，只见门口一个人，骑了一匹骡子，到门口下了骡子进来。鲍文卿认得是天长县杜老爷的管家姓邵的，便道：“绍大爷，你几时过江来的？”邵管家道：“特过江来寻鲍师父。”鲍文卿同他作了揖，叫儿子也作了揖，请他坐下，拿水来洗脸，拿茶来吃。吃着，问道：“我记得你家老太大该在这年把正七十岁，想是过来定戏的？你家大老爷在府安？”邵管家笑道：“正是为此。老爷吩咐要定二十本戏。鲍师父，你家可有班子？若有。就接了你的班子过去。”鲍文卿道…","so":0,"eo":0}]},{"chap":26,"ctitle":"第二十六回　向观察升官哭友　鲍廷玺丧父娶妻","deeds":[{"surface":"天长","text":"过了半年有余，一日，金次福走来请鲍老太说话。鲍廷玺就请了在堂屋里坐着，进去和母亲说了。鲍老大走了出来，说道：“金师父，许久不见。今日甚么风吹到此？”金次福道：“正是。好久不曾来看老太，老太在家享福。你那行头而今换了班子穿着了？”老太道：“因为班子在城里做戏，生意行得细，如今换了一个文元班，内中一半也是我家的徒弟，在盱眙、天长这一带走。他那里乡绅财主多，还赚的几个大钱。”金次福道：“这样，你老人家更要发财了。”当下吃了一杯茶，金次福道：“…","so":0,"eo":0}]},{"chap":29,"ctitle":"第二十九回　诸葛佑僧寮遇友　杜慎卿江郡纳姬","deeds":[{"surface":"天长","text":"三个同步了一会，一齐回寓，却迎着一乘轿子，两担行李，三个人跟着进寺里来。那轿揭开帘子，轿里坐着一个戴方巾的少年，诸葛天申依稀有些认得。那轿来的快，如飞的就过去了。诸葛天申道：“这轿子里的人，我有些认得他。”因赶上几步，扯着他跟的人，问道：“你们是那里来的？”那人道：“是天长杜十七老爷，”诸葛天申回来，同两人睃着那轿和行李一直进到老退居隔壁那和尚家去了，诸葛天申向两人道：“方才这进去的是天长杜宗伯的令孙。我认得他，是我们那边的名土，不知他…","so":0,"eo":0},{"surface":"天长","text":"进了寺门，诸葛天申道：“且到我们下处坐坐。”杜慎卿道：“也好。”一同来到下处。才进了门，只见季苇萧坐在里面。季恬逸一见了，欢喜道：“苇兄，你来了！”季苇萧道：“恬逸兄，我在刻字店里找问，知道你搬在这里。”便问：“此三位先生尊姓？”季恬逸道：“此位是盱眙诸葛天申先生。此位就是我们同乡萧金铉先生，你难道不认得？”季苇萧道：“先生是住在北门的？”萧金铉道：“正是。”季苇萧道：“此位先生？”季恬逸道：“这位先生，说出来你更欢喜哩！他是天长杜宗伯…","so":0,"eo":0}]},{"chap":30,"ctitle":"第三十回　爱少俊访友神乐观　逞风流高会莫愁湖","deeds":[{"surface":"天长","text":"季苇萧又要问，只见小厮手里拿着一个帖子，走了进来，说道：“外面有个姓郭的芜湖人来拜。”杜慎卿道：“我那里认得这个姓郭的？”季苇萧接过帖子来看了道：“这就是寺门口图书店的郭铁笔，想他是刻了两方图书来拜，先生叫他进来坐坐。”杜慎卿叫大小厮情他进来。郭铁笔走进来作揖，道了许多仰慕的话，说道，“尊府是一门三鼎甲，四代六尚书，门生故吏，天下都散满了。督、抚、司、道，在外头做，不计其数。管家们出去，做的是九品杂职官。季先生，我们自小听见说的：天长杜…","so":0,"eo":0},{"surface":"天长","text":"来到桂花道院，敲开了门，道人请在楼下坐着。杜慎卿道：“我是来拜扬州新到来老爷的。”道人道：“来爷在楼上。老爷请坐，我去请他下来。”道人去了一会，只见楼上走下一个肥胖的道士来，头戴道冠，身穿沉香色直裰，一副油晃晃的黑脸，两道重眉，一个大鼻子，满腮胡须，约有五十多岁的光景。那道士下来作揖奉坐，请问：“老爷尊姓贵处？”杜慎卿道：“敝处天长，贱姓杜。”那道士道：“我们桃源旗领的天长杜府的本钱，就是老爷尊府？”杜慎卿道：“便是。”道士满脸堆下笑来…","so":0,"eo":0},{"surface":"天长","text":"安庆季苇萧、天长杜慎卿，择于五月初三日，莫愁湖湖亭大会。通省","so":0,"eo":0}]},{"chap":31,"ctitle":"第三十一回　天长县同访豪杰　赐书楼大醉高朋","deeds":[{"surface":"天长","text":"而今你在这里帮我些时，到秋凉些，我送你些盘缠投奔他去，包你这千把银子手到拿来。”鲍廷玺道：“到那时候，求老爷写个书子与门下去。”杜慎卿道：“不相干。这书断然写不得。他做大老官是要独做，自照顾人，并不要人帮着照顾。我若写了书子，他说我已经照顾了你，他就赌气不照顾你了。如今去先投奔一个人。”鲍廷玺道：“却又投那一个？”杜慎卿道：“他家当初有个奶公老管家，姓邵的，这人你也该认得。”鲍廷玺想起来道：“是那年门下父亲在日，他家接过我的戏去与老太太…","so":0,"eo":0},{"surface":"天长","text":"第一日过江，歇了**县。第二日起早走了几十里路，到了一个地方，叫作四号墩。鲍廷玺进去坐下，正待要水洗脸，只见门口落下一乘轿子来。轿子里走出一个老者来，头戴方巾，身穿白纱直裰，脚下大红绸鞋，一个通红的酒糟鼻，一部大白胡须，就如银丝一般。那老者走进店门，店主人慌忙接了行李，说道：“韦四太爷来了！请里面坐。”那韦四太爷走进堂屋，鲍廷玺立起身来施礼，那韦四太爷还了礼。鲍廷玺让韦四太爷上面坐，他坐在下面，问道：“老太爷上姓是韦，不敢拜问贵处是那里…","so":0,"eo":0},{"surface":"天长","text":"当时同吃了饭。韦四太爷上轿，鲍廷玺又雇了一个驴子，骑上同行。到了天长县城门口，韦四太爷落下轿说道：“鲍兄，我和你一同走进府里去罢。”鲍廷玺道：“请太爷上轿先行，在下还要会过他管家，再去见少爷。”韦四太爷道：“也罢。”上了轿子，一直来到杜府，门上人传了进去。","so":0,"eo":0}]},{"chap":33,"ctitle":"第三十三回　杜少卿夫妇游山　迟衡山朋友议礼","deeds":[{"surface":"天长","text":"到了仓巷里外祖卢家，表侄卢华士出来迎请表叔进去，到厅上见礼。杜少卿又到楼上拜了外祖、外祖母的神主。见了卢华士的母亲，叫小厮拿出火腿、茶叶土仪来送过。卢华士请在书房里摆饭，请出一位先生来，是华士今年请的业师。那先生出来见礼，杜少卿让先生首席坐下。杜少卿请问：“先生贵姓？”那先生道：“贱姓迟，名均，字衡山。请问先生贵姓？”卢华士道：“这是学生天长杜家表叔。”迟先生道：“是少卿？先生是海内英豪，千秋快士！只道闻名不能见面，何图今日邂逅高贤！”…","so":0,"eo":0},{"surface":"天长","text":"走到状元境，只见书店里贴了多少新封面，内有一个写道：“《历科程墨持运》。处州马纯上、嘉兴蘧验夫同选，”杜少卿道：“这蘧验夫是南昌蘧太守之孙，是我敝世兄。既在此，我何不进去会会他？”便同迟先生进去。蘧验夫出来叙了世谊，彼此道了些相慕的话。马纯上出来叙礼，问：“先生贵姓？”蘧验夫道：“此乃天长殿元公孙杜少卿先生，这位是句容迟衡山先生，皆江南名坛领袖。小弟辈恨相见之晚。”吃过了茶，迟衡山道：“少卿兄要寻居停，此时不能久谈，要相别了。”同走出来…","so":0,"eo":0},{"surface":"天长","text":"次早，才洗脸，只听得一人在门外喊了进来：“杜少卿先生在那里？”杜少卿正要出去看，那人已走进来，说道：“且不要通姓名，且等我猜一猜着！”定了一会神，走上前，一把拉着少卿道：“你便是杜少卿。”杜少卿笑道：“我便是杜少卿。这位是迟衡山先生，这是舍表侄。先生，你贵姓？”那人道：“少卿天下豪士，英气逼人，小弟一见丧胆，不似迟先生老成尊重，所以我认得不错。小弟便是季苇萧。”迟衡山道：“是定梨园榜的季先生？久仰，久仰！”季苇萧坐下，向杜少卿道：“令兄…","so":0,"eo":0},{"surface":"天长","text":"杜少卿到了陶红，在娄太爷柩前大哭了几次，拿银子做了几天佛事，超度娄太爷生天。娄家把许多亲戚请来陪。杜少卿一连住了四五日，哭了又哭。陶红一镇上的人，人人叹息，说：“天长杜府厚道。”又有人说：“这老人家为人必定十分好，所以杜府才如此尊重报答他，为人须像这个老人家，方为不愧。”杜少卿又拿了几十两银子交与他儿子、孙子，买地安葬娄太爷。娄家一门，男男女女都出来拜谢。杜少卿又在柩前恸哭了一场，方才回来。","so":0,"eo":0},{"surface":"天长","text":"到家，娘子向他说道：“自你去的第二日，巡抚一个差宫，同天长县的一个门斗，拿了一角文书来寻，我回他不在家。他住在饭店里，日日来问，不知为甚事。”杜少卿道：“这又奇了！”正疑惑间，小厮来说道：“那差官和门斗在河房里要见。”杜少卿走出去，同那差官见礼坐下。差官道了恭喜，门斗送上一角文书来。那文书是拆开过的，杜少卿拿出来看，只见上写道：","so":0,"eo":0},{"surface":"天长","text":"巡抚部院李，为举荐贤才事：钦奉圣旨，采访天下儒修。本部院访得天长县儒学生员杜仪，品行端醇，文章典雅。为此饬知该县儒学教官，即敦请该生即日束装赴院，以便考验，申奏朝廷，引见招用。","so":0,"eo":0},{"surface":"天长","text":"庙里道士走了出来，问那里来的尊客。来道士道：“是天长杜状元府里杜少老爷，”道士听了，着实恭敬，请坐拜茶。杜少卿看见墙上贴着一个斗方，一首识舟亭怀古的诗，上写：“霞士道兄教正”，下写“燕里韦阐思玄稿”。杜少卿道：“这是滁州乌衣镇韦四太爷的诗。他几时在这里的？”道士道：“韦四太爷现在楼上。”杜少卿向来霞土道：“这样，我就同你上楼去。”便一同上楼来，道士先喊道，“韦四太爷，天长杜少老爷来了！”韦四太爷答应道：“是那个？”要走下楼来看。杜少卿上…","so":0,"eo":0},{"surface":"天长","text":"次日，便到北门桥去拜庄绍光先生。那里回说：“浙江巡抚徐大人请了游西湖去了，还有些日子才得来家。”杜少卿便到仓巷卢家去会迟衡山。卢家留着吃饭。迟衡山闲话说起：“而今读书的朋友，只不过讲个举业，若会做两句诗赋，就算雅极的了，放着经史上礼、乐、兵、农的事，全然不问！我本朝太祖定了天下，大功不差似汤武，却全然不曾制作礼乐。少卿兄，你此番征辟了去，替朝廷做些正经事，方不愧我辈所学。”杜少卿道：“这征辟的事，小弟已是辞了。正为走出去做不出甚么事业，…","so":0,"eo":0}]},{"chap":34,"ctitle":"第三十四回　议礼乐名流访友　备弓旌天子招贤","deeds":[{"surface":"天长","text":"吃过了三遍茶，换去大衣服，请在书房里坐。这高老先生虽是一个前辈，却全不做身分，最好顽耍，同众位说说笑笑，并无顾忌，才进书房，就问道：“钱朋友怎么不见？”薛乡绅道：“他今日回了不得来。”高老先生道：“没趣！没趣！今日满座欠雅矣！”薛乡绅摆上两席，奉席坐下。席间谈到浙江这许多名士，以及西湖上的风景，娄氏弟兄两个许多结交宾客的故事。余美人道：“这些事我还不爱，我只爱验夫家的双红姐，说着还齿颊生香。”季苇萧道：“怪不得，你是个美人，所以就爱美人…","so":0,"eo":0}]},{"chap":37,"ctitle":"第三十七回　祭先圣南京修礼　送孝子西蜀寻亲","deeds":[{"surface":"天长","text":"又过了几日，季萑、萧鼎、辛东之、金寓刘来辞了虞博士，回扬州去了。马纯上同蘧验夫到河房里来辞杜少卿，要回浙江。二人走进河房，见杜少卿、臧荼又和一个人坐在那里。蘧验夫一见，就吓了一跳，心里想道：“这人便是在我娄表叔家弄假人头的张铁臂！他如何也在此？”彼此作了揖。张铁臂见蘧验夫，也不好意思，脸上出神。吃了茶，说了一会辞别的话，马纯上、蘧验夫辞了出来。杜少卿送出大门。莲验夫问道：“这姓张的，世兄因如何和他相与？”杜少卿道：“他叫做张俊民，他在敝…","so":0,"eo":0},{"surface":"天长","text":"武书辞了出去，才走到利涉桥，遇见一个人，头戴方巾，身穿旧布直裰。腰系丝绦，脚卞芒鞋，身上掮着行李，花白胡须，憔悴枯槁。那人丢下行李，向武书作揖。武书惊道：“郭先生，自江宁镇一别，又是三年，一向在那里奔走？”那人道：“一言难尽！”武书道：“请在茶馆里坐。”当下两人到茶馆里坐下。那人道：“我一向因寻父亲，走遍天下。从前有人说是在江南，所以我到江南，这番是三次了。而今听见人说不在江南，已到四川山里削发为僧去了，我如今就要到四川去。”武书道：“…","so":0,"eo":0}]},{"chap":41,"ctitle":"第四十一回　庄濯江话旧秦淮河　沈琼枝押解江都县","deeds":[{"surface":"天长","text":"到了月牙池，见许多游船在那里放花炮，内有一只大船，挂着四盏明角灯，铺着凉簟子，在船上中间摆了一席。上面坐着两个客；下面主位上坐着一位，头戴方巾，身穿白纱直裰，脚下凉鞋，黄瘦面庞，清清疏疏三绺白须；横头坐着一个少年，白净面皮，微微几根胡子，眼张失落，在船上两边看女人。这小船走近大船眼前，杜少卿同武书认得那两个客，一个是卢信侯，一个是庄绍光，却认不得那两个人。庄绍光看见二人，立起身来道：“少卿兄，你请过来坐。”杜少卿同武书上了大船。主人和二…","so":0,"eo":0},{"surface":"天长","text":"庄濯江叫从新拿上新鲜酒来，奉与诸位吃。庄濯江就问：“少卿兄几时来的？寓在那里？”庄绍光道：“他已经在南京住了八九年了。尊居现在这河房里。”庄濯江惊道：“尊府大家，园亭花木甲于江北，为甚么肯搬在这里？”庄绍光便把少卿豪举，而今黄金已随手而尽，略说了几句。庄濯江不胜叹息，说道：“还记得十七八年前，我在湖广，鸟衣韦四先生寄了一封书子与我，说他酒量越发大了，二十年来，竟不得一回恸醉，只有在天长赐书楼吃了一坛九年的陈酒，醉了一夜，心里快畅的紧，所…","so":0,"eo":0}]},{"chap":43,"ctitle":"第四十三回　野羊塘将军大战　歌舞地酋长劫营","deeds":[{"surface":"天长","text":"二爷道：“你们只管说话，这个人是那里来的？”那人上来磕头请安，怀里拿出一封书子来，递上来。六老爷道：“他姓臧，名唤臧歧，天长县人。这书是社少卿哥寄来的，说臧歧为人甚妥帖，荐来给大爷、二爷使唤。”二爷把信拆开，同大爷看，前头写着些请问老伯安好的话，后面说到“臧歧一向在贵州做长随，贵州的山僻小路他都认得，其人颇可以供使令”等语。大爷看过，向二爷说道，“杜世兄我们也许久不会他了，既是他荐来的人，留下使唤便了。”臧四磕头谢了下去。","so":0,"eo":0}]},{"chap":46,"ctitle":"第四十六回　三山门贤人饯别　五河县势利熏心","deeds":[{"surface":"天长","text":"虞华轩走进书房来，姚五爷迎着问道：“可是太尊那里来的？”虞华轩道：“怎么不是。”姚五爷摇着头笑道，“我不信！”唐二棒椎沉吟道：“老华，这倒也不错。果然是太尊里面的人？太尊同你不密迩，同太尊密迩的是彭老三、方老六他们二位。我听见这人来，正在这里疑惑。他果然在太尊衙门里的人，他下县来，不先到他们家去，倒有个先来拜你老哥的？这个话有些不像。恐怕是外方的甚么光棍，打着太尊的旗号，到处来骗人的钱，你不要上他的当！”虞华轩道：“也不见得这人不曾去拜…","so":0,"eo":0}]},{"chap":49,"ctitle":"第四十九回　翰林高谈龙虎榜　中书冒占凤凰池","deeds":[{"surface":"天长","text":"高翰林道，“再也莫提起这话。敝处这里有一位庄先生，他是朝廷征召过的，而今在家闭门注《易》。前日有个朋友和他会席，听见他说：‘马纯上知进而不知退，直是一条小小的亢龙。’无论那马先生不可比做亢龙，只把一个现活着的秀才拿来解圣人的经，这也就可笑之极了！”武正字道：“老先生，此话也不过是他偶然取笑。要说活着的人就引用不得，当初文王、周公，为甚么就引用微子、箕子？后来孔子为甚么就引用颜子？那时这些人也都是活的。”高翰林道：“足见先生博学。小弟专经…","so":0,"eo":0}]},{"chap":53,"ctitle":"第五十三回　国公府雪夜留宾　来宾楼灯花惊梦","deeds":[{"surface":"天长","text":"说着摆上酒来，都是银打的盆子，用架子架着，底下一层贮了烧酒，用火点着，焰腾腾的，暖着那里边的肴撰，却无一点烟火气。两人吃着，徐九公子道：“近来的器皿都要翻出新样，却不知古人是怎样的制度，想来倒不如而今精巧。”陈木南道：“可惜我来迟了一步。那一年，虞博士在国子监时，迟衡山请他到泰伯祠主祭，用的都是古礼古乐，那些祭品的器皿，都是访古购求的。我若那时在南京，一定也去与祭，也就可以见古人的制度了。”徐九公子道：“十几年来我常在京，却不知道家乡有…","so":0,"eo":0}]},{"chap":56,"ctitle":"第五十六回　神宗帝下诏旌贤　刘尚书奉旨承祭","deeds":[{"surface":"天长","text":"第三名杜仪，南直隶天长县人。","so":0,"eo":0},{"surface":"天长","text":"第七名杜倩，南直隶天长县人。","so":0,"eo":0}]}],"relations":[]},{"id":"efa100f2-d4f0-4171-aa1a-ebc76a83a0af","name":"萧云仙","type":"PERSON","mentionCount":29,"chapterCount":5,"firstChapter":39,"lastChapter":56,"aliases":["萧千总","萧守备","萧守府","萧老先生","萧采"],"density":"moderate","timeline":[{"chap":39,"ctitle":"第三十九回　萧云仙救难明月岭　平少保奏凯青枫城","deeds":[{"surface":"萧云仙","text":"那少年精力已倦，寻路旁一个店内坐下。只见店里先坐着一个人，面前放着一个盒子。那少年看那人时，头戴孝巾，身穿白布衣服，脚下芒鞋，形容悲戚，眼下许多泪痕，便和他拱一拱手，对面坐下。那人笑道：“清平世界，荡荡乾坤，把弹子打瞎人的眼睛，却来这店里坐的安稳！”那少年道：“老先生从那里来？怎么知道这件事的？”那人道：“我方才原是笑话。剪除恶人，救拔善类，这是最难得的事。你长兄尊姓大名？”那少年道：“我姓萧，名采，字云仙，舍下就在这成都府二十里外东山…","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙道：“老先生既寻着太老先生，如何不同在一处？如今独自又往那里去？”郭孝子见问这话，哭起来道：“不幸先君去世了。这盒子里便是先君的骸骨。我本是湖广人，而今把先君骸骨背到故乡去归葬。”萧云仙垂泪道：“可怜！可怜！但晚生幸遇着老先生，不知可以拜请老先生同晚生到舍下去会一会家君么？”郭孝子道：“本该造府恭谒，奈我背着先君的骸骨不便，且我归葬心急。致意尊大人，将来有便，再来奉谒罢。”因在行李内取出尤公的书子来，递与萧云仙。又拿出百十个钱来，…","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙回到家中，问了父亲的安，将尤公书子呈上看过。萧昊轩道：“老友与我相别二十年，不通音问，他今做官适意，可喜可喜！”又道：“郭孝子武艺精能，少年与我齐名，可惜而今和我都老了。他今求的他太翁骸骨归葬，也算了过一生心事。”萧云仙在家奉事父亲。","so":0,"eo":0},{"surface":"萧云仙","text":"萧昊轩听了此事，唤了萧云仙到面前，吩咐道：“我听得平少保出师，现驻松潘，征剿生番。少保与我有旧，你今前往投军，说出我的名姓，少保若肯留在帐下效力，你也可以借此投效朝廷，正是男子汉发奋有为之时。”萧云仙道：“父亲年老，儿子不敢远离膝下。”萧昊轩道：“你这话就不是了。我虽年老，现在井无病痛，饭也吃得，觉也睡得，何必要你追随左右？你若是借口不肯前去，便是贪图安逸，在家恋着妻子，乃是不孝之子，从此你便不许再见我的面了！”几句话让的萧云仙闭口无言…","so":0,"eo":0},{"surface":"萧云仙","text":"这一日，离松潘卫还有一站多路，因出店太早，走了十多里，天尚未亮。萧云仙背着行李，正走得好，忽听得背后有脚步响。他便跳开一步，回转头来，只见一个人，手持短棍，正待上前来打他，早被他飞起一脚，踢倒在地。萧云仙夺了他手中短棍，劈头就要打。那人在地下喊道：“看我师父面上，饶恕我罢！”萧云仙住了手，问道：“你师父是谁？”那时天色已明，看那人时，三十多岁光景，身穿短袄，脚下八搭府鞋，面上微有髭须。那人道：“小人姓木名耐，是郭孝子的徒弟。”萧云仙一把…","so":0,"eo":0},{"surface":"萧云仙","text":"过了几日，各路粮饷俱已调齐，少保升帐，传下将令，叫各弁在辕门听候。萧云仙早到，只见先有两位都督在辕门上。萧云仙请了安，立在旁边。听那一位都督道：“前日总镇马大老爷出兵，竟被青枫城的番子用计挖了陷坑，连人和马都跌在陷坑里。马大老爷受了重伤，过了两天，伤发身死。现今尸首并不曾找着。马大老爷是司礼监老公公的侄儿，现今内里传出信来，务必要找寻尸首。若是寻不着，将来不知是个怎么样的处分！这事怎了？”这一位都督道：“听见青枫城一带几十里是无水草的，…","so":0,"eo":0},{"surface":"萧云仙","text":"少刻，云板响处，辕门饶鼓喧闹。少保升帐，传下号令，教两都督率领本部兵马，作中军策应；叫萧云仙带领步兵五百名在前，先锋开路。本帅督领后队调遣。将令已下，各将分头前去。","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙携了木耐，带领五百步兵疾忙前进。望见前面一座高山，十分险峻，那山头上隐隐有旗帜在那里把守。这山名唤椅儿山，是青枫城的门户。萧云仙吩咐木耐道：“你带领二百人从小路扒过山去，在他总路口等着。只听得山头炮响，你们便喊杀回来助战，不可有误。”木耐应诺去了。萧云仙又叫一百兵丁埋伏在山凹里，只听山头炮响，一齐呐喊起来，报称大兵已到，赶上前来助战。分派已定，萧云仙蒂着二百人，大踏步杀上山来。那山上几百番子，藏在上洞里，看见有人杀上来，一齐蜂拥的…","so":0,"eo":0}]},{"chap":40,"ctitle":"第四十回　萧云仙广武山赏雪　沈琼枝利涉桥卖文","deeds":[{"surface":"萧云仙","text":"话说萧云仙奉着将令，监督筑城，足足住了三四年，那城方才筑的成功。周围十里，六座城门，城里又盖了五个衙署。出榜招集流民进来居住，城外就叫百姓开垦田地。萧云仙想道：“像这旱地，百姓一遇荒年，就不能收粮食了，须是兴起些水利来。”因动支钱粮，雇齐民夫，萧云仙亲自指点百姓，在田傍开出许多沟渠来。沟间有洫，洫间有遂，开得高高低低，仿佛江南的光景。到了成功的时候，萧云仙骑着马，带着木耐，在各处犒劳百姓们。每到一处，萧云仙杀牛宰马，传下号令，把那一方百…","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙同木耐，今日在这一方，明日又在那一方，一连吃了几十日酒，共栽了几万棵柳树。众百姓感激萧云仙的恩德，在城门外公同起盖了一所先农祠。中间供着先农神位，旁边供了萧云仙的长生禄位牌。又寻一个会画的，在墙上画了一个马，画萧云仙纱帽补服，骑在马上，前面画木耐的像，手里拿着一枝红旗，引着马，做劝农的光景。百姓家男男女女，到朔望的日子，住这庙里来焚香点烛跪拜，非止一日。","so":0,"eo":0},{"surface":"萧云仙","text":"到次年春天，杨柳发了青，桃花杏花都渐渐开了，萧云仙骑着马，带着木耐，出来游玩。见那绿树阴中，百姓家的小孩子，三五成群的牵着牛，也有倒骑在牛上的，也有横睡在牛背上的，在田旁沟里饮了水，从屋角边慢慢转了过来。萧云仙心里欢喜，向木耐道：“你看这般光景，百姓们的日子有的过了，只是这班小孩子，一个个好模好样，也还觉得聪俊，怎得有个先生教他识字便好。”木耐道：“老爷，你不知道么？前日这先农祠住着一个先生，是江南人，而今想是还在这里，老爷何不去和他商…","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙城工已竣，报上文书去，把这文书就叫木耐赍去。木耐见了少保，少保问他些情节，赏他一个外委把总做去了。少保据着萧云仙的详文，咨明兵部。工部核算：","so":0,"eo":0},{"surface":"萧云仙","text":"萧采承办青枫城城工一案，该抚题销本内：砖、灰、工匠，共开销银一万九千三百六十两一钱二分一厘五毫。查该地水草附近，烧造砖灰甚便，新集流民，充当工役者甚多，不便听其任意浮开。应请核减银七千五百二十五两有零，在于该员名下着追。查该员系四川成都府人，应行文该地方官勒限严比归款可也。奉旨依议。","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙看了邸抄，接了上司行来的公文，只得打点收拾行李，回成都府。比及到家，他父亲已卧病在床，不能起来，萧云仙到床面前请了父亲的安，诉说军前这些始未缘由，说过，又磕下头去，伏着不肯起来。萧昊轩道：“这些事你都不曾做错，为甚么不起来？”萧云仙才把因修城工被工部核减追赔一案说了，又道：“儿子不能挣得一丝半粟孝敬父亲，倒要破费了父亲的产业，实在不可自比于人，心里愧恨之极！”萧昊轩道：“这是朝廷功令，又不是你不肖花消掉了，何必气恼？我的产业攒凑拢…","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙呼天抢地，尽哀尽礼，治办丧事十分尽心。却自己叹息道：“人说‘塞翁失马，未知是福是祸’。前日要不为追赔，断断也不能回家，父亲送终的事，也再不能自己亲自办。可见这番回家，也不叫做不幸。”丧葬已毕，家产都已赔完了，还少三百多两银子，地方官仍旧紧追。适逢知府因盗案的事降调去了。新任知府却是平少保做巡抚时提拔的，到任后，知道萧云仙是少保的人，替他虚出了一个完清的结状，叫他先到平少保那里去，再想法来赔补。少保见了萧云仙，慰劳了一番，替他出了一…","so":0,"eo":0},{"surface":"萧云仙","text":"萧云仙又侯了五六个月，部里才推升了他应天府江淮卫的守备，带领引见。奉旨：“着往新任。”萧云仙领了札付出京，走东路来南京。过了朱龙侨，到了广武卫地方，晚间住在店里，正是严冬时分。约有二更尽鼓，店家吆呼道：“客人们起来！木总爷来查夜！”众人都披了衣服坐在铺上。只见四五个兵打着灯笼，照着那总爷进来，逐名查了。萧云仙看见那总爷原来就是木耐。木耐见了萧云仙，喜出望外，叩请了安，忙将萧云仙请进衙署，住了一宿。","so":0,"eo":0}]},{"chap":44,"ctitle":"第四十四回　汤总镇成功归故乡　余明经把酒问葬事","deeds":[{"surface":"萧云仙","text":"余大先生道：“我们那边也极喜讲究的迁葬，少卿，这事行得行不得？”杜少卿道：“我还有一句直捷的话。这事朝廷该立一个法子，但凡人家要迁葬，叫他到有司衙门递个呈纸，风水具了甘结：棺材上有几尺水，几斗几升蚁。等开了，说得不错，就罢了；如说有水有蚁，挖开了不是，即于挖的时候，带一个刽子手，一刀把这奴才的狗头斫下来。那要迁坟的，就依子孙谋杀祖父的律，立刻凌迟处死。此风或可少息了。”余有达、迟衡山、武正字三人一齐拍手道：“说的畅快，说的畅快！拿大杯来…","so":0,"eo":0}]},{"chap":46,"ctitle":"第四十六回　三山门贤人饯别　五河县势利熏心","deeds":[{"surface":"萧云仙","text":"过了三日，管家持帖邀客，请各位早到。庄濯江在家等候，庄征君已先在那里。少刻，迟衡山、武正字、杜少卿都到了。庄濯江收拾了一个大敞榭，四面都插了菊花。此时正是九月初五，天气亢爽，各人都穿着袷衣，啜茗闲谈。又谈了一会，汤镇台、萧守府、虞博士都到了，众人迎请进来，作揖坐下。汤镇台道：“我们俱系天涯海角之人，今幸得贤主人相邀一聚，也是三生之缘。又可惜虞老先生就要去了，此聚之后，不知快晤又在何时？”庄沁江道：“各位老先生当今山斗，今日惠顾茅斋，想五…","so":0,"eo":0},{"surface":"萧云仙","text":"坐定，家人捧上茶来，揭开来，似白水一般，香气芬馥，银针都浮在水面。吃过，又换了一巡真天都，虽是隔年陈的，那香气尤烈。虞博士吃着茶笑说道：“二位老先生当年在军中，想不见此物。”萧云仙道：“岂但军中，小弟在青枫城六年，得饮白水，已为厚幸，只觉强于马溺多矣！”汤镇台道：“果然青枫水草可支数年。”庄征君道：“萧老先生博雅，真不数北魏崔浩。”迟衡山道：“前代后代，亦时有变迁的。”杜少卿道：“宰相须用读书人，将帅亦须用读书人。若非萧老先生有识，安能…","so":0,"eo":0}]},{"chap":56,"ctitle":"第五十六回　神宗帝下诏旌贤　刘尚书奉旨承祭","deeds":[{"surface":"萧云仙","text":"其武途出身已登仕籍，例不得入翰林院者：汤奏、萧采、木耐，共三人。","so":0,"eo":0},{"surface":"萧云仙","text":"虞育德赐第一甲第一名进士及第，授翰林院修撰。庄尚志赐第一甲第二名进士及第，授翰林院编修。杜仪赐第一甲第三名进士及第，授翰林院编修。萧采等赐第二甲进士出身，俱授翰林院检讨。沈琼枝等赐第三甲同进土出身，俱授翰林院庶吉士。于七月初一日揭榜晓示，赐祭一坛，设于国子监，遣礼部尚书刘迸贤前往行礼。余依议。钦此。到了七月初一日黎明，礼部门口悬出一张榜来，上写道：","so":0,"eo":0},{"surface":"萧云仙","text":"第一名萧采，四川成都府人。","so":0,"eo":0}]}],"relations":[{"id":"bf4f23e6-1732-4ebc-850c-218b37912443","code":"同僚","sc":39,"ec":null,"status":"ACTIVE","other":"木耐","dir":"out"},{"id":"b474c270-ac5e-4943-a8af-95f571568a07","code":"主仆","sc":39,"ec":null,"status":"ACTIVE","other":"木耐","dir":"out"},{"id":"fa4621ee-f1c1-474a-9f69-0c02f4dddd69","code":"师生","sc":40,"ec":null,"status":"ACTIVE","other":"沈先生","dir":"in"}]},{"id":"b4669138-c9d3-42d2-a4fe-391cd5b6846d","name":"王公","type":"PERSON","mentionCount":9,"chapterCount":4,"firstChapter":32,"lastChapter":47,"aliases":["王父母","王知县"],"density":"sparse","timeline":[{"chap":32,"ctitle":"第三十二回　杜少卿平居豪举　娄焕文临去遗言","deeds":[{"surface":"王公","text":"这几日，娄太爷的病渐渐有些重起来了，杜少卿又换了医生来看，在家心里忧愁。忽一日，臧三爷走来，立着说道：“你晓得有个新闻？县里王公坏了，昨晚摘了印，新官押着他就要出衙门，县里人都说他是个混账官，不肯借房子给他住，在那里急的要死。”杜少卿道：“而今怎样了？”臧寥斋道：“他昨晚还赖在衙门里，明日再不出，就要讨没脸面。那个借屋与他住？只好搬在孤老院！”杜少卿道：“这话果然么？”叫小厮叫王胡子来，向王胡子道：“你快到县前向工房说，叫他进去禀王老爷…","so":0,"eo":0},{"surface":"王公","text":"正迎着王胡子飞跑来道：“王老爷来拜，已到门下轿了。”杜少卿和臧寥斋迎了出去。那王知县纱帽便服，进来作揖再拜，说道：“久仰先生，不得一面。今弟在困厄之中，蒙先生慨然以尊斋相借，令弟感愧无地，所以先来谢过，再细细请教。恰好臧年兄也在此，”杜少卿道：“老父台，些小之事，不足介意。荒斋原是空闲，竟请搬过来便了。”臧寥斋道：“门生正要同敝友来侯老师，不想反劳老师先施。”王知县道：“不敢，不敢。”打恭上轿而去。","so":0,"eo":0},{"surface":"王公","text":"杜少卿留下臧寥斋，取出一百二十两银子来递与他，叫他明日去做张家这件事。臧寥斋带着银子去了。次日，王知县搬进来住。又次日，张俊民备了一席酒送在杜府，请臧三爷同鲍师父陪。王胡子私向鲍廷玺道：“你的话也该发动了。我在这里算着，那话已有个完的意思。若再遇个人来求些去，你就没账了。你今晚开口。”","so":0,"eo":0}]},{"chap":33,"ctitle":"第三十三回　杜少卿夫妇游山　迟衡山朋友议礼","deeds":[{"surface":"王公","text":"话说杜少卿自从送了娄太爷回家之后，自此就没有人劝他，越发放着胆子用银子。前项已完，叫王胡子又去卖了一分田来，二千多银子，随手乱用。又将一百银子把鲍廷玺打发过江去了。王知县事体已清，退还了房子，告辞回去。杜少卿在家又住了半年多，银子用的差不多了，思量把自己住的房子并与本家，要到南京去住，和娘子商议，娘子依了。人劝着，他总不肯听。足足闹了半年，房子归并妥了。除还债赎当，还落了有千把多银子，和娘子说道：“我先到南京会过卢家表侄，寻定了房子，再…","so":0,"eo":0}]},{"chap":45,"ctitle":"第四十五回　敦友谊代兄受过　讲堪舆回家葬亲","deeds":[{"surface":"王公","text":"知县接了关文，又传余二先生来问。余二先生道：“这更有的分辨了。生员再细细具呈上来，只求太父师做主。”说罢下来，到家做呈子。他妻舅赵麟书说道：“姐夫，这事不是这样说了，分明是大爷做的事，他左一回右一回雪片的文书来，姐夫为甚么自己缠在身上？不如老老实实具个呈子，说大爷现在南京，叫他行文到南京去关，姐夫落得干净无事。我这里‘娃子不哭奶不胀’，为甚么把别人家的棺材拉在自己门口哭？”余二先生道：“老舅，我弟兄们的事，我自有主意，你不要替我焦心。”…","so":0,"eo":0},{"surface":"王公","text":"又过了几日，弟兄二人商议，要去拜风水张云峰。恰好一个本家来请吃酒，两人拜了张云峰，便到那里赴席去。那里请的没有外人，就是请的他两个嫡堂兄弟：一个叫余敷，一个叫余殷。两人见大哥、二哥来，慌忙作揖，彼此坐下，问了些外路的事。余敷道：“今日王父母在彭老二家吃酒。”主人坐在底下道：“还不曾来哩，阴阳生才拿过帖子去。”余殷道：“彭老四点了主考了。听见前日辞朝的时候，他一句话回的不好，朝廷把他身子拍了一下。”余大先生笑道：“他也没有甚么话说的不好，…","so":0,"eo":0}]},{"chap":47,"ctitle":"第四十七回　虞秀才重修元武阁　方盐商大闹节孝祠","deeds":[{"surface":"王公","text":"这成老爹是个兴贩行的行头，那日叫管家请出大爷来，书房里坐下，说道：“而今我那左近有一分田，水旱无优，每年收的六百石稻。他要二千两银子。前日方六房里要买他的，他已经打算卖给他，那些庄户不肯。”虞华轩道：“庄户为甚么不肯？”成老爹道：“庄户因方府上田主子下乡要庄户备香案迎接，欠了租又要打板子，所以不肯卖与他。”虞华轩道：“不卖给他，要卖与我，我下乡是摆臭案的？我除了不打他，他还要打我？”成老爹道：“不是这样说。说你大爷宽宏大量，不像他们刻薄…","so":0,"eo":0},{"surface":"王公","text":"成老爹辞了主人，一直来到仁昌典，门上人传了进去。主人方老六出来会着，作揖坐下。方老六问：“老爹几时上来的？”成老爹心里惊了一下，答应道：“前日才来的。”方老六又问：“寓在那里？”成老爹更慌了，答应道：“在虞华老家。”小厮拿上茶来吃过。成老爹道：“今日好天气。”方老六道：“正是。”成老爹道：“这些时常会王父母？”方老六道：“前日还会着的。”彼此又坐了一会，没有话说。又吃了一会茶，成老爹道：“太尊这些时总不见下县来过。若还到县里来，少不得先…","so":0,"eo":0},{"surface":"王公","text":"此时元武阁已经动工，虞华轩每日去监工修理。那日晚上回来，成老爹坐在书房里。虞华轩同他作了揖，拿茶吃了，问道：“前日节孝入祠，老爹为甚么不到？”成老爹道：“那日我要到的，身上有些病，不曾来的成。舍弟下乡去，说是热闹的很。方府的执事摆了半街，王公同彭府上的人都在那里送，尊经阁摆席唱戏，四乡八镇几十里路的人都来看，说：“若要不是方府，怎做的这样大事！’你自然也在阁上偏我吃酒。”虞华轩道：“老爹，你就不晓得我那日要送我家八房的叔祖母？”成老爹冷…","so":0,"eo":0}]}],"relations":[]},{"id":"34982043-becb-48b3-a4d0-d6f9a4ddf1ef","name":"倪老爹","type":"PERSON","mentionCount":9,"chapterCount":2,"firstChapter":25,"lastChapter":27,"aliases":["倪霜峰"],"density":"sparse","timeline":[{"chap":25,"ctitle":"第二十五回　鲍文卿南京遇旧　倪廷玺安庆招亲","deeds":[{"surface":"倪老爹","text":"话说鲍文卿到城北去寻人，觅孩子学戏。走到鼓楼坡上，他才上坡，遇着一个人下坡。鲍文卿看那人时，头戴破毡帽，身穿一件破黑绸直裰，脚下一双烂红鞋，花白胡须，约有六十多岁光景。手里拿着一张破琴，琴上贴着一条白纸，纸上写着四个字道：“修补乐器。”鲍文卿赶上几步，向他拱手道：“老爹是会修补乐器的么？”那人道：“正是。”鲍文卿道：“如此，屈老爹在茶馆坐坐。”当下两人进了茶馆坐下，拿了一壶茶来吃着。鲍文卿道：“老爹尊姓？”那人道：“贱姓倪。”鲍文卿道，…","so":0,"eo":0},{"surface":"倪老爹","text":"到那日清晨，倪老爹来了，吃过茶点心，拿这乐器修补。修了一回，家里两个学戏的孩子捧出一顿素饭来，鲍文卿陪着倪老爹吃了。到下午时候。鲍文卿出门回来，向倪老爹道：“却是怠慢老爹的紧，家里没个好菜蔬，不恭。我而今约老爹去酒楼上坐坐，这乐器丢着，明日再补罢。”倪老爹道：“为甚么又要取扰？”当下两人走出来，到一个酒楼上，拣了一个僻净座头坐下。堂官过来问：“可还有客？”倪老爹道：“没有客了。你这里有些甚么菜？”走堂的叠着指头数道：“肘子、鸭子、黄闷鱼…","so":0,"eo":0},{"surface":"倪老爹","text":"鲍文卿起身斟倪老爹一杯，坐下吃酒，因问倪老爹道：“我看老爹像个斯文人，因甚做这修补乐器的事？”那倪老爹叹一口气道：“长兄，告诉不得你！我从二十岁上进学，到而今做了三十六年的秀才。就坏在读了这几句死书，拿不得轻，负不的重，一日穷似一日，儿女又多，只得借这手艺糊口，原是没奈何的事！”鲍文卿惊道：“原来老爹是学校中人，我大胆的狠了。请问老爹几位相公？老太太可是齐眉？”倪老爹道：“老妻还在。从前倒有六个小儿，而今说不得了。”鲍文卿道：“这是甚么…","so":0,"eo":0},{"surface":"倪老爹","text":"鲍文卿着实伤感了一会，说道：“这件事，我倒有个商议，只是不好在老爹跟前说。”倪老爹道：“长兄，你有甚么话，只管说有何妨？”鲍文卿正待要说，又忍住道：“不说罢，这话说了，恐怕惹老爹怪。”倪老爹道：“岂有此理。任凭你说甚么，我怎肯怪你？”鲍文卿道：“我大胆说了罢。”倪老爹道：“你说，你说。”鲍文卿道：“老爹，比如你要把这小相公卖与人，若是卖到他州别府，就和那几个相公一样不见面了。如今我在下四十多岁，生平只得一个女儿，并不曾有儿子。你老人家若…","so":0,"eo":0},{"surface":"倪老爹","text":"过了几日，鲍家备一席酒请倪老爹，倪老爹带了儿子来写立过继文书，凭着左邻开绒线店张国重，右邻开香蜡店王羽秋。两个邻居都到了。那文书上写道：","so":0,"eo":0},{"surface":"倪老爹","text":"立过继文书倪霜峰，今将第六子倪廷玺，年方一十六岁，因日食无措，夫妻商议，情愿出继与鲍文卿名下为义子，改名鲍廷玺。此后成人婚娶，俱系鲍文卿抚养，立嗣承裆，两无异说。如有天年不测，各听天命。今欲有凭，立此过继文书，永远存照。嘉靖十六年十月初一日。立过继文书：倪霜峰。凭中邻：张国重、王羽秋。","so":0,"eo":0},{"surface":"倪老爹","text":"都画了押。鲍文卿拿出二十两银子来付与倪老爹去了。鲍文卿又谢了众人。自此，两家来往不绝。","so":0,"eo":0},{"surface":"倪老爹","text":"这倪廷玺改名鲍廷玺，甚是聪明伶俐。鲍文卿因他是正经人家儿子，不肯叫他学戏，送他读了两年书，帮着当家营班。到十八岁上，倪老爹去世了，鲍文卿又拿出几十两银子来替他料理后事，自己去一连哭了几场，依旧叫儿子去披麻戴孝，送倪老爹人土。自此以后，鲍廷玺着实得力。他娘说他是螟蛉之子，不疼他，只疼的是女儿、女婿。鲍文卿说他是正经人家儿女，比亲生的还疼些。每日吃茶吃酒，都带着他；在外揽生意，都同着他，让他赚几个钱添衣帽鞋袜；又心里算计，要替他娶个媳妇。","so":0,"eo":0}]},{"chap":27,"ctitle":"第二十七回　王太太夫妻反目　倪廷珠兄弟相逢","deeds":[{"surface":"倪老爹","text":"水西门鲍文卿老爹家过继的儿子鲍廷奎，本名倪廷玺，乃父亲倪霜峰第六子，是我的同胞的兄弟。我叫作倪廷珠，找着是我的兄弟，就同他到公馆里来相会。要紧！要紧！","so":0,"eo":0}]}],"relations":[{"id":"380c97ed-04ae-4571-8dc9-988ad07bbbbd","code":"父子","sc":25,"ec":null,"status":"ACTIVE","other":"鲍廷玺","dir":"out"}]}]},{"title":"红楼梦","entities":[{"id":"52c728ca-47d2-40d2-82d0-8aa1452b9db7","name":"宝玉","type":"PERSON","mentionCount":1134,"chapterCount":117,"firstChapter":1,"lastChapter":120,"aliases":["二世兄","二兄","二兄弟","二叔叔","侍者","呆爷","好哥哥","宝二叔","宝兄弟","宝公","宝叔","宝叔叔","宝哥儿","宝哥哥","宝玉儿","宝玉哥哥","富贵闲人","小祖宗","怡红公子","无事忙","浊玉","混世魔王","玉儿","神瑛侍者","绛洞花主","臭小厮","菩萨哥儿","贾宝玉"],"density":"rich","timeline":[{"chap":1,"ctitle":"第1章 甄士隐梦幻识通灵 贾雨村风尘怀闺秀","deeds":[{"surface":"宝玉","text":"一日，炎夏永昼，士隐于书房闲坐，手倦抛书，伏几盹睡，不觉朦胧中走至一处，不辨是何地方。忽见那厢来了一僧一道，且行且谈。只听道人问道：“你携了此物，意欲何往？”那僧笑道：“你放心，如今现有一段风流公案正该了结，这一干风流冤家尚末投胎人世。趁此机会，就将此物夹带于中，使他去经历经历。”那道人道：“原来近日风流冤家又将造劫历世，但不知起于何处，落于何方？”那僧道：“此事说来好笑。只因当年这个石头娲皇未用，自己却也落得逍遥自在，各处去游玩。一日…","so":0,"eo":0},{"surface":"宝玉","text":"说着取出递与士隐。士隐接了看时，原来是块鲜明美玉，上面字迹分明，镌着“通灵宝玉”四字，后面还有几行小字。正欲细看时，那僧便说“已到幻境”。就强从手中夺了去，和那道人竟过了一座大石牌坊，上面大书四字，乃是“太虚幻境”。两边又有一副对联道：","so":0,"eo":0}]},{"chap":2,"ctitle":"第2章 贾夫人仙逝扬州城 冷子兴演说荣国府","deeds":[{"surface":"宝玉","text":"子兴道：“依你说，‘成则公侯败则贼’了？”雨村道：“正是这意。你还不知，我自革职以来，这两年遍游各省，也曾遇见两个异样孩子，所以方才你一说这宝玉我就猜着了，八九也是这一派人物。不用远说，只这金陵城内钦差金陵省体仁院总裁甄家，你可知道？”子兴道：“谁人不知！这甄府就是贾府老亲，他们两家来往极亲热的。就是我也和他家往来非止一日了。”雨村笑道：“去岁我在金陵，也曾有人荐我到甄府处馆。我进去看其光景，谁知他家那等荣贵，却是个富而好礼之家，倒是个…","so":0,"eo":0},{"surface":"宝玉","text":"雨村道：“正是。方才说政公已有一个衔玉之子，又有长子所遗弱孙，这赦老竟无一个不成？”子兴道：“政公既有玉儿之后，其妻又生了一个，倒不知其好歹。只眼前现有二子一孙，却不知将来何如？若问那赦老爷，也有一子，名叫贾琏，今已二十多岁了，亲上做亲，娶的是政老爷夫人王氏内侄女，今已娶了四五年。这位琏爷身上现捐了个同知，也是不喜正务的，于世路上好机变，言谈去得，所以目今现在乃叔政老爷家住，帮着料理家务。谁知自娶了这位奶奶之后，倒上下无人不称颂他的夫人…","so":0,"eo":0}]},{"chap":3,"ctitle":"第3章 托内兄如海荐西宾 接外孙贾母惜孤女","deeds":[{"surface":"宝玉","text":"茶未吃了，只见一个穿红绩袄青绸掐牙背心的一个丫鬟走来笑道：“太太说：请林姑娘到那边坐罢。”老嬷嬷听了，于是又引黛玉出来，到了东南三间小正房内。正面炕上横设一张炕桌，上面堆着书籍茶具，靠东壁面西设着半旧的青缎靠背引枕。王夫人却坐在西边下首，亦是半旧青缎靠背坐褥。见黛玉来了，便往东让。黛玉心中料定这是贾政之位，因见挨炕一溜三张椅子上也搭着半旧的弹花椅袱，黛玉便向椅上坐了。王夫人再三让他上炕，他方挨王夫人坐下。王夫人因说：“你舅舅今日斋戒去了…","
